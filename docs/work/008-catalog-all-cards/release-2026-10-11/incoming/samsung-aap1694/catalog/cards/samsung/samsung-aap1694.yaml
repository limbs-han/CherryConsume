notes: 2026-10-11 상품안내장(2022.8판) 확인. 출시 2020-12-23. 연회비 해외겸용 Mastercard·국내전용 모두 20,000원(기본 7,000+제휴 13,000). 모든 할인은 전월 40만원 이상이고 발급월+1개월까지는 40만 구간 혜택을 준다. 생활요금 자동납부 5%와 할인점·주유 2,000원 할인을 받은 이용금액은 실적에서 빠진다. 실적 제외는 4대보험, 국세·지방세·공과금, 초중고 납입금, 대학 등록금, 대중교통, 택시, 아파트 관리비, 임대료, 기프트·선불카드, 상품권이다. 무이자할부는 실적에 넣고 할인에서 뺀다.
