schema_version: 2
id: lotte-p13391-a13391
issuer: lotte
name: LOCA for Coffee
kind: credit
product_codes: [P13391-A13391]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
  - {scope: global, brand: mastercard, amount: 20000}
sources:
  - {id: page, kind: product_page, url: 'https://www.lottecard.co.kr/app/LPCDADB_V100.lc?vtCdKndC=P13391-A13391', fetched_at: '2026-10-11'}
  - {id: manual, kind: manual_pdf, url: 'https://image.lottecard.co.kr/UploadFiles/cardProvisionPath/2020-A00016_20260930_10005.pdf', fetched_at: '2026-10-11'}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2020-07-10'
    source: manual
    tiers: [0, 1500000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: original_month
    new_card: {until: next_month_end, tier: 1500000, from: issue}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [포인트 충전과 스마트 캐시백 신청 이용금액은 할인에서 빠진다]
    benefits:
      - key: coffee-50
        title: 스타벅스·폴바셋·빽다방·투썸플레이스 50% 결제일 할인
        source: manual
        evidence: [커피 스타벅스ㆍ폴바셋ㆍ빽다방ㆍ투썸플레이스 50% 1만원, '지난달 1일 ~ 말일까지 150만원 이상 (본인, 가족카드 합산) 이용 시 혜택이 제공됩니다.']
        target:
          merchants: [paik_coffee, paul_bassett, starbucks, twosome]
        reward: {type: billing_discount, rate: 50}
        limits:
          - {per: month, amount: 10000}
        tiers: {from: 1500000}
      - key: streaming-20
        title: 스트리밍 정기결제 20% 결제일 할인
        source: manual
        evidence: [스트리밍 넷플릭스ㆍ유투브ㆍ왓챠ㆍ멜론ㆍ지니뮤직 20% 1만원, '서비스 대상 가맹점 공식 홈페이지 또는 앱을 통해 직접 신청한 정기결제(자동이체) 이용 건만 혜택이 제공되며, 1회성 일반구매 결제 및 통신 요금 내 합산 청구, 앱마켓(구글플레이/앱스토어 등) 결제와 같이 가맹점 구분이 불가한 경우에는 혜택이 제공되지 않습니다.']
        target:
          merchants: [genie, melon, netflix, watcha, youtube_premium]
        when:
          - billing: [autopay, subscription]
        reward: {type: billing_discount, rate: 20}
        limits:
          - {per: month, amount: 10000}
        tiers: {from: 1500000}
      - key: transit-10
        title: 시내버스·지하철·택시 10% 결제일 할인
        source: manual
        evidence: [교통 버스ㆍ 지하철ㆍ 택시 10% 월 5천원, '지하철, 시내버스, 택시 이용 건만 혜택이 제공되며, 고속버스, 시외버스 이용금액은 혜택이 제공되지 않습니다.']
        target:
          categories: [taxi, transit.bus_city, transit.subway]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 1500000}
      - key: delivery-10
        title: 배달의민족·요기요 10% 결제일 할인
        source: manual
        evidence: [배달앱 배달의민족ㆍ요기요 10% 월 5천원, '공식 앱을 통한 결제 시 혜택이 제공되며, 가맹점 직접 결제 건은 혜택이 제공되지 않습니다.']
        target:
          merchants: [baemin, yogiyo]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 1500000}
      - key: online-5
        title: 쿠팡·SSG닷컴·마켓컬리 5% 결제일 할인
        source: manual
        evidence: [온라인쇼핑 쿠팡ㆍSSG닷컴ㆍ마켓컬리 5% 월 5천원, 일부 PG(결제대행) 업체를 통해 결제 시 혜택이 제공되지 않습니다.]
        target:
          merchants: [coupang, kurly, ssg_com]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 1500000}
    unmodeled: [가맹점 구분이 어려운 PG 결제는 온라인쇼핑 할인에서 빠진다, LOCA 시리즈 카드가 아닌 롯데카드 이용금액만 실적에서 빠져 다른 LOCA 시리즈 카드 이용금액도 실적에 합산될 수 있다. 이 카드 결제만 센다, 가족카드 이용금액과 할인한도가 본인카드와 합산된다, 해외 이용과 대중교통 같은 무승인 결제는 롯데카드 접수일 기준으로 실적에 들어가 이용한 달과 다를 수 있다, '오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 포인트 충전은 실적에서 빠진다', 롯데카드의 다른 결제일 할인 혜택과 겹치면 할인이 큰 혜택 하나만 준다, 할인은 승인 시점 기준 남은 한도 안에서 준다]
notes: 2026-10-11 상품설명서(2026년 9월 심의) 대조. 출시일 2020-07-10. 지난달 150만원 이상일 때만 다섯 영역 할인, 영역마다 월 할인한도. 신규 발급 특례는 발급일부터 다음 달 말일까지 실적과 상관없이 혜택 제공이라 150만 구간으로 넣었다. 유투브는 유튜브 프리미엄 정기결제로 옮겼다.
