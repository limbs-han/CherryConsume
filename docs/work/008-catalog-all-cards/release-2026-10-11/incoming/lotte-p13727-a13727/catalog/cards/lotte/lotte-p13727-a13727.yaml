        title: 이지웰 복지몰 4% 결제일 할인
        source: page
        evidence: [40만원 이상 4.0% 1만원, '국내외 가맹점 결제일 할인 혜택과 이지웰 복지몰 결제일 할인 혜택은 중복 제공되지 않으며, 할인 금액이 큰 혜택으로 적용됩니다.']
        target:
          merchants: [ezwel_mall]
        reward: {type: billing_discount, rate: 4}
        limits:
          - {per: month, amount: 10000}
        tiers: {from: 400000}
      - key: transit-5
        title: 버스·지하철·택시 5% 결제일 할인
        source: page
        evidence: [20만원 이상 교통(버스·지하철·택시) 5% 1만원(일 5천원), '교통할인은 지하철, 시내버스, 공항버스, 공항철도, 택시 이용 시 혜택이 제공되며 고속버스, 시외버스, 이용 금액은 혜택이 제공되지 않습니다.']
        target:
          categories: [taxi, transit.bus_city, transit.subway]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: day, amount: 5000}
          - {per: month, amount: 10000}
        tiers: {from: 200000}
      - key: telecom-1000
        title: 이동통신 자동납부 건당 1천원 결제일 할인
        source: page
        evidence: [통신(자동이체) 건당 1천원 1천원, '통신할인은 이동통신요금 자동납부 건에 대해서 혜택이 제공되며, 결합상품(인터넷 및 TV 등) 이용 금액은 혜택이 제공되지 않습니다.']
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, fixed: 1000}
        limits:
          - {per: month, amount: 1000}
        tiers: {from: 200000}
    unmodeled: [공항버스와 공항철도도 교통 할인 대상이지만 업종이 없어 계산하지 않는다, 이동통신 할인에서 인터넷·TV 결합상품 요금은 빠진다, 이지웰 X LOCA 카드가 아닌 롯데카드 이용금액은 실적에서 빠진다, '오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금은 실적에서 빠진다', 해외 이용과 대중교통 같은 무승인 결제는 롯데카드 접수일 기준으로 실적에 들어가 이용한 달과 다를 수 있다, 롯데카드의 다른 결제일 할인 혜택과 겹치면 할인이 큰 혜택 하나만 준다]
notes: 2026-10-11 상품 페이지 대조. 출시일 2021-03-23. 국내외 가맹점 할인은 75만원 미만 0.5%, 이상 1.0%로 한도 없음. 할인 제외에 국세가 없고 지방세만 있어 tax.local만 넣었다. 대중교통(버스·지하철·택시)과 통신요금 자동납부는 국내외 가맹점 할인에서만 빠진다. 이지웰 복지몰 가맹점 키는 공통 파일에 더해야 한다. 신규 발급 특례는 발급일부터 다음 달 말일까지 모든 혜택, 국내외 가맹점은 특별할인이라 75만 구간으로 넣었다.
