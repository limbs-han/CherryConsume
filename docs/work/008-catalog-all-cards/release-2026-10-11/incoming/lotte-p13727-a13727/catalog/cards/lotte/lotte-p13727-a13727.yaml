      - key: all-1-0
        title: 국내외 가맹점 1.0% 결제일 할인
        source: page
        evidence: [특별할인 75만원 이상 1.0%, '이지웰 X LOCA 카드를 최초 발급 받은 경우, 카드발급일 ~ 다음 달 말일까지 지난달 이용실적에 상관없이 혜택이 제공됩니다. (국내외 가맹점 결제일 할인의 경우 특별할인 혜택 제공)']
        target:
          exclude_categories: [taxi, telecom, transit.bus_city, transit.bus_express, transit.bus_intercity, transit.subway]
          all: true
        reward: {type: billing_discount, rate: 1.0}
        tiers: {from: 750000}
