notes: 2026-10-11 상품 페이지와 상품설명서(2024년 5월 기준) 대조. 출시일 2024-04-25. 공시 색인 id lotte-1883을 상품 코드 id로 바꿨다. 보험엔로카(lotte-p14828-a14828)와 할인 금액은 같지만 대상이 메리츠화재 보험료로 다르고 자동차보험 캐시백이 없는 다른 상품이다. 신규 발급 특례는 발급일부터 다음 달 말일까지 13,000원 한도라 30만 구간으로 넣었다. 할인받은 보험료 전액이 실적에서 빠진다. 가족카드는 발급하지 않는다.
