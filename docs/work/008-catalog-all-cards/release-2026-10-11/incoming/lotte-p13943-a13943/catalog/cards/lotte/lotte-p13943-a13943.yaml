open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2021-09-15이다, assumed: '2026-10-11'}
  - {path: sources, question: 상품설명서 PDF 주소를 상품 페이지에서 찾지 못해 상품 페이지만 근거로 했다}
  - {path: 'revisions[0].benefits[restaurant-60].target', question: 패스트푸드가 롯데카드 음식점 업종에 드는지 원문으로 확인하지 못했다, assumed: 일반음식점만}
notes: 2026-10-11 상품 페이지 대조. 출시일 2021-09-15. 지난달 40만원 이상이면 네 영역 60% 결제일 할인, 모든 혜택 통합 월 13,000원. 할인 혜택이 적용된 이용금액 전체가 실적에서 빠진다. 대중교통(버스, 지하철)은 시외·고속버스까지 실적에서 뺐다. 신규 발급 특례는 발급일부터 다음 달 말일까지 실적과 상관없이 혜택 제공이라 40만 구간으로 넣었다.
