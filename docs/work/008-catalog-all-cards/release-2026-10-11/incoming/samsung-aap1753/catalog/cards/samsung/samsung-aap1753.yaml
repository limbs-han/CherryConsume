        target:
          merchants: [gs_caltex, hd_oilbank, s_oil, sk_energy]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 10000}
        limits:
          - {per: day, count: 1}
          - per: month
            count: {500000: 1, 1000000: 2, 1500000: 3}
          - {per: month, amount: 30000}
        tiers: {from: 500000}
        unmodeled: [LPG충전소는 할인하지 않는다]
      - key: transit-10
        title: 대중교통 10% 할인
        source: manual
        evidence: [대중교통·택시·전기차 충전요금 10% 결제일할인, '대중교통 버스, 지하철', '통합 월 할인한도 : 5,000원', 전월 이용금액 50만원 이상 시 제공, '대중교통은 오프라인 결제건에 한하며, 시외·고속버스는 제외']
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: transit-taxi}
        tiers: {from: 500000}
      - key: taxi-10
        title: 택시 10% 할인
        source: manual
        evidence: [택시 택시, '통합 월 할인한도 : 5,000원', 택시는 오프라인 결제건에 한함]
        target:
          categories: [taxi]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: transit-taxi}
        tiers: {from: 500000}
    unmodeled: ['할인과 실적은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 자동납부 등)는 매출전표 접수일 기준이다', 삼성카드의 다른 결제일할인 혜택과 겹치면 할인 금액이 큰 것 하나만 준다, '전기차 충전요금 10%는 대중교통·택시와 월 5,000원 한도를 함께 쓰지만 전기차 충전 업종이 없어 계산하지 않는다', '주차장(케이엠파크)·대리운전(카카오 T 대리) 10%, 고속도로 통행료 10%(후불교통 결제), 스타벅스 드라이브 스루 My DT Pass 30%는 공통 가맹점이나 업종이 없거나 입력으로 구별할 수 없어 계산하지 않는다. 각 월 5,000원 한도', 스피드메이트 엔진오일 20, 000원 현장할인과 차량 점검 무료 서비스는 계산하지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품설명서 심의일(2025-09-02)로 두었다. 상품 출시일은 2021-12-02다, assumed: '2025-09-02'}
  - {path: annual_fees, question: 상품설명서 연회비 표에 해외겸용 VISA 2만원 행만 있고 국내전용이 같은 칸으로 묶여 있어 국내전용도 2만원으로 두었다, assumed: 20000}
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-11 상품설명서(2025.9판, 심의필 2025-C1a-12816호) 대조. 출시 2021-12-02. 실적 제외는 주유 업종 이용금액 전체, 4대보험, 국세·지방세·공과금, 학교납입금, 등록금, 대중교통, 택시, 임대료, 상품권·선불 충전이다. 아파트 관리비는 실적에 들어간다. 할인받은 금액은 주유 말고는 실적에 들어간다. 발급월+1개월까지는 50만 구간 혜택.
