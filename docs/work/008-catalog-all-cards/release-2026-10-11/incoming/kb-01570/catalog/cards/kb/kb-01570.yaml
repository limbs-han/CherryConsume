short_name: KB 쏘영 체크
kind: check
product_codes:
  - '01570'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=01570', fetched_at: '2026-10-11', review_no: 260522-01722-PIF}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 50000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [education.tuition, gift_card, prepaid_charge, tax.local, transit.bus_city, transit.subway, utility.water]
      month_offset: {}
      exclude_applied: 0
    benefit_exclusions:
      categories: [gift_card, prepaid_charge]
      unmodeled: ['PG 결제와 다른 간편결제, 호텔·백화점·대형마트·철도역사 입점 가맹점, 상품권 구매는 할인에서 빠진다']
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 발급받았나요?'}
    limits:
      - {key: integrated, per: month, amount: 5000}
    benefits:
      - key: streaming-5
        title: 멜론·YouTube Premium 5% 환급할인
        source: page
        evidence: ['스트리밍 | 멜론, YouTube Premium | 5% | 1천원 | 3천원 이상 이용 시', 실적유예기간 미적용, YouTube Premium, YouTube Music Premium 할인 적용, 멜론 음원 구독 외 공연 이용 금액 등은 할인 제외]
        target:
          merchants: [melon, youtube_premium]
        when:
          - amount: {min: 3000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: month, amount: 1000}
          - {shared: integrated}
        tiers: {from: 50000}
        unmodeled: [멜론 공연 이용 금액은 할인에서 빠진다]
      - key: convenience-5
        title: GS25·CU 5% 환급할인
        source: page
        evidence: ['편의점 | GS25, CU편의점 | 5% | 1천원 | 5천원', '실적유예기간 제공: KB국민 쏘영 체크카드로 최초 사용등록일로부터 다음달 말일까지 독서실/문구점, 편의점 서비스 제공']
        target:
          merchants: [cu, gs25]
        when:
          - amount: {min: 5000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: month, amount: 1000}
          - {shared: integrated}
        tiers:
          from: 50000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: fastfood-5
        title: 패스트푸드 업종 5% 환급할인
        source: page
        evidence: [패스트푸드점 | 패스트푸드점 | 5% | 1천원 | 7천원, 패스트푸드 업종 등록 대표 가맹점 맥도날드, 버거킹, 롯데리아, KFC, 쉐이크쉑 등]
        target:
          categories: [restaurant.fastfood]
        when:
          - amount: {min: 7000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: month, amount: 1000}
          - {shared: integrated}
        tiers: {from: 50000}
      - key: transit-5
        title: 버스·지하철 5% 청구·환급할인
        source: page
        evidence: ['대중교통 | 버스, 지하철 | 5% | 1천원 | 1만원', 1만원 이상 이용 시, 실적 유예기간 미적용, '청구 할인 대상: 후불교통(시내버스, 지하철) *이용대금명세서상 기재 된 이용일 기준 제공', '환급 할인 대상: 고속/시외 버스']
        target:
          categories: [transit.bus_city, transit.bus_express, transit.bus_intercity, transit.subway]
        when:
          - amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: month, amount: 1000}
          - {shared: integrated}
        tiers: {from: 50000}
        unmodeled: [후불교통은 이용대금명세서에 적힌 이용일 단위로 할인한다. 1만원 이상 조건을 결제 건마다 따져 실제보다 적게 줄 수 있다]
    unmodeled: [문구점(팬시용품점)과 독서실(스터디카페) 업종 5% 환급할인(영역 월 1천원)은 공통 업종이 없어 계산하지 않는다, 전월 실적은 동일계열 카드 이용액을 합산한다, '무승인 금액(자판기, 터널통행료, 유료도로, 기차·고속버스 취소 반환 수수료)과 정부지원금, 포인트리 충전금액은 실적에서 빠진다', 통합할인한도는 전표 매입 순서대로 차감한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2020년 9월 21일 신규출시만 적었다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통요금 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 만 7세에서 18세가 발급받는 청소년 카드다. 같은 혜택의 KB국민 샘 쏘영 체크카드(01574)는 실적을 그 카드 단독으로 센다는 점만 다르다.
