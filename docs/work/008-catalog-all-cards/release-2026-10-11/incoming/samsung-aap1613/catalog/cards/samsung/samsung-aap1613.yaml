schema_version: 2
id: samsung-aap1613
issuer: samsung
name: T 라이트 삼성카드
short_name: T 라이트
search_names: [T 라이트, T라이트, 티 라이트]
kind: credit
product_codes: [AAP1613]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 25000}
  - {scope: global, brand: visa, amount: 25000}
sources:
  - {id: page, kind: product_page, url: 'https://www.samsungcard.com/home/card/cardinfo/PGHPPCCCardCardinfoDetails001?code=AAP1613', fetched_at: 2026-10-11}
  - {id: manual, kind: manual_pdf, url: 'https://www.samsungcard.com/filedownload.do?grpNo=1zPVy1PuFbwGC7xZyM4qtgWh5qoyzjl0SXZ5e7qD76s%3D&sn=1', fetched_at: 2026-10-11}
checked_at: 2026-10-11
revisions:
  - effective_from: 2019-08-01
    source: manual
    tiers: [0, 400000, 800000, 1200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, taxi, transit.bus_city, transit.subway, utility]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 0
    new_card:
      until: next_month_end
      tier: 400000
      tier_by_benefit: {coffee-5: 800000, convenience-5: 800000, delivery-5: 800000, starbucks-5: 800000}
      from: issue
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [삼성카드 할인이 적용된 일시불·할부 이용금액은 할인하지 않는다]
    options:
      - key: light_installment
        title: SKT 라이트할부 이용 여부
        choices:
          - {key: none, title: 라이트할부 미이용. SKT 통신요금 자동납부 할인을 받는다}
          - {key: using, title: 'SKT 라이트할부 이용 중. 월 10,000~20,000원 결제대금 차감을 받는다'}
        default: none
        change: next_month
        unsupported: [using]
    limits:
      - key: telecom
        per: month
        amount: {400000: 3000, 800000: 5000, 1200000: 8000}
        count: 1
      - key: coffee
        per: month
        amount: {800000: 3000, 1200000: 5000}
      - key: convenience-delivery
        per: month
        amount: {800000: 3000, 1200000: 5000}
    benefits:
      - key: skt-telecom
        title: SKT 통신요금 자동납부 할인
        source: manual
        evidence: ['SKT 라이트할부 미이용 시, SKT 통신요금 자동납부금액 3,000원~8,000원 결제일할인(청구할인)', '전월 이용금액대별 통합 월 할인한도 40만원 이상 3,000원, 80만원 이상 5,000원, 120만원 이상 8,000원, 통합 월 할인횟수 1회', 'SKT 통신요금 자동납부금액이 할인한도보다 작은 경우, 자동납부금액만큼만 해당 월 회원님의 카드 결제대금에서 자동 차감']
        target:
          merchants: [skt]
        when:
          - option:
              light_installment: [none]
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - {shared: telecom}
        tiers: {from: 400000}
        unmodeled: ['결합상품요금, 휴대전화 단말기 구매금액, 대리점 카드 결제는 할인하지 않는다']
      - key: coffee-5
        title: 커피전문점 5% 할인
        source: manual
        evidence: [커피전문점 5% 결제일할인(청구할인), '스타벅스, 투썸플레이스, 카페베네, 탐앤탐스, 커피빈, 엔제리너스, 할리스커피, 파스쿠찌, 아티제, 폴 바셋', '전월 이용금액대별 통합 월 할인한도 80만원 이상 3,000원, 120만원 이상 5,000원', '오프라인 일반 결제건에 한하며, 백화점, 할인점, 쇼핑몰, 고속도로 휴게소 내 임대매장은 제외됩니다.']
        target:
          merchants: [angel_in_us, artisee, cafe_bene, coffee_bean, hollys, pascucci, paul_bassett, tom_n_toms, twosome]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: coffee}
        tiers: {from: 800000}
        unmodeled: [백화점·할인점·쇼핑몰·고속도로 휴게소 임대매장은 할인하지 않는다]
      - key: starbucks-5
        title: 스타벅스 5% 할인
        source: manual
        evidence: ['스타벅스의 경우, 사이렌오더 결제건도 혜택이 제공됩니다.']
        target:
          merchants: [starbucks]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: coffee}
        tiers: {from: 800000}
        unmodeled: [매장 결제와 사이렌오더만 할인하고 임대매장은 제외한다]
      - key: convenience-5
        title: 편의점 5% 할인
        source: manual
        evidence: [편의점·배달앱 5% 결제일할인(청구할인), '편의점 CU, GS25, 세븐일레븐, 미니스톱', '편의점의 경우, 오프라인 일반 결제건에 한해 혜택이 제공됩니다.']
        target:
          merchants: [cu, gs25, ministop, seven_eleven]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: convenience-delivery}
        tiers: {from: 800000}
      - key: delivery-5
        title: 배달앱 5% 할인
        source: manual
        evidence: [편의점·배달앱 5% 결제일할인(청구할인), '배달앱 배달의민족, 요기요, 쿠팡이츠', '배달앱의 경우, 공식 홈페이지·앱을 통한 결제건에 한하며, 가맹점 직접 결제건은 제외됩니다.']
        target:
          merchants: [baemin, coupang_eats, yogiyo]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: convenience-delivery}
        tiers: {from: 800000}
    unmodeled: ['SKT 라이트할부 이용 시 결제대금 차감(전월 40만원 이상 10,000원, 80만원 이상 15,000원, 120만원 이상 20,000원, 월 1회)은 결제 하나에 붙는 혜택이 아니라 계산하지 않는다. 완납하면 통신요금 자동납부 할인으로 바뀐다', 'SKT 24·36개월 라이트할부(삼성 갤럭시 단말기, 연 5.9%·7%)는 할부 서비스라 계산하지 않는다', 삼성카드의 다른 결제일할인과 중복되지 않고 큰 금액만 적용한다, '할인은 승인 시점 기준이고 해외 결제와 무승인 결제(대중교통, 자동납부 등)는 매출전표 접수 시점 기준이다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 상품안내장은 2019.7 심의(2019-C1a-06170호)이고 출시일 2019-08-01을 시행일로 두었다. 더 새 안내장이 있는지 확인하지 못했다, assumed: '2019-08-01'}
  - {path: 'revisions[0].benefits', question: 할인의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-11 상품안내장(2019.7 심의) 확인. U+ 라이트(samsung-aap1893)와 같은 구조에 통신사가 SKT다. 연회비 국내전용과 해외겸용 VISA 모두 25,000원(기본 7,000+제휴 18,000). 실적 제외는 무이자할부, 4대보험, 국세·지방세·공과금, 대학 등록금, 대중교통, 택시, 아파트 관리비, 기프트·선불카드 구매와 충전, 상품권이다. 할인 받은 결제도 실적에 넣는다. 발급월+1개월까지 통신요금은 40만 구간, 커피·편의점·배달앱은 80만 구간 혜택을 준다.
