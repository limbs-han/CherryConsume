  - {scope: global, brand: mastercard, amount: 30000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=04404', fetched_at: '2026-10-11'}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 600000, 900000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.tuition, gift_card, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      interest_free: count
      month_offset: {}
      exclude_applied: 1
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 본인 명의로 발급받았나요? 가족카드만 발급받은 경우는 아니요를 고르세요.'}
    benefits:
      - key: pet-30
        title: 동물병원·반려동물 서비스·용품점 30% 청구할인
        source: page
        evidence: ['동물병원, 반려동물 서비스/용품점 | 30% | 1만원 | 1만5천원 | 2만원', '애견샵, 동물검사소, 약품구매, 장례업체 포함', 최초 카드 사용등록일로부터 다음달 말일까지는 「펫코노미 카드」 전월 이용실적이 없는 경우에도 1구간 (전월 이용실적 30만원 이상)에 해당하는 할인 서비스가 적용됩니다.]
        target:
          categories: [pet]
        reward: {type: billing_discount, rate: 30}
        limits:
          - per: month
            amount: {0: 10000, 300000: 10000, 600000: 15000, 900000: 20000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: interpark-10
        title: 인터파크쇼핑 10% 청구할인
        source: page
        evidence: ['인터파크쇼핑 | 10% | 1만원 | 2만원(2구간, 3구간)', '인터파크쇼핑 인터넷 홈페이지, 모바일 및 APP 결제건 포함', '단, 인터넷 쇼핑몰 내 상품권, 여행, 항공권, 티켓, 도서이용금액 할인 제외']
        target:
          merchants: [interpark]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {0: 10000, 300000: 10000, 600000: 20000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [인터파크 안의 상품권·여행·항공권·티켓·도서 결제는 할인에서 빠진다]
      - key: mart-5
        title: 이마트·홈플러스·롯데마트 5% 청구할인
        source: page
        evidence: ['대형마트 | 5% | 5천원 | 1만원(2구간, 3구간)', '인터넷쇼핑몰/슈퍼(이마트 에브리데이, 홈플러스 익스프레스, 롯데슈퍼, 롯데마켓999) 이용금액, 상품권 구매 및 건물 내 임대매장 이용금액은 할인 제외']
        target:
          merchants: [emart, homeplus, lotte_mart]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - per: month
            amount: {0: 5000, 300000: 5000, 600000: 10000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [대형마트 건물 안 임대매장은 할인에서 빠진다]
    unmodeled: [반려견 단체보험 무료 가입은 결제 혜택이 아니라 계산하지 않는다, 기본 포인트리는 적립되지 않는다, '무승인전표(대중교통, 자판기, 터널 이용료, 항공기내 이용)와 정부지원금은 실적에서 빠진다', 월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 할인 서비스는 다른 할인 카드와 중복 할인되지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2017.07.28 출시만 적었다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 인터파크와 대형마트 한도표의 2만원과 1만원은 2구간과 3구간을 합친 칸이다. 연회비는 K-WORLD(JCB)와 마스터 모두 합계 3만원이다.
