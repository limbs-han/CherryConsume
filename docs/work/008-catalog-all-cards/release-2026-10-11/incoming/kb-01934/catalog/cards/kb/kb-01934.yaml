open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2024.7.16 출시만 적었다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통요금 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 청년 제대군인을 겨냥한 상품이지만 원문에 발급 대상 제한이 없어 일반 상품으로 담았다.
