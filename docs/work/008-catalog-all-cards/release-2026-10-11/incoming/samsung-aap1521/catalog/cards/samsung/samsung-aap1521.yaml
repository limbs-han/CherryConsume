        evidence: [삼성 페이로 온라인 결제 또는 오프라인 결제 중 택1하여 삼성 페이로 결제 시 10% 결제일할인(청구할인), '월 할인한도는 5,000원입니다.', 전월 일시불 및 할부 이용금액 30만원 이상 시 제공됩니다., '삼성카드 앱을 통해 매월 변경할 수 있으며, 변경 신청 다음 달 1일에 자동 반영됩니다.']
        target: {all: true}
        when:
          - option:
              pay_mode: [online]
          - {channel: online}
          - payment: [samsung_pay]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
        exclude_applied: 1
      - key: spay-offline-10
        title: 삼성 페이 오프라인 결제 10% 할인
        source: manual
        evidence: [삼성 페이로 오프라인 결제 시 10% 결제일할인(청구할인), '월 할인한도는 5,000원입니다.']
        target: {all: true}
        when:
          - option:
              pay_mode: [offline]
          - {channel: offline}
          - payment: [samsung_pay]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
        exclude_applied: 1
      - key: telecom-10
        title: 이동통신요금 자동납부 10% 할인
        source: manual
        evidence: [SKT·KT·LG U+ 이동통신요금 자동납부 시 10% 결제일할인(청구할인), '월 할인한도는 5,000원입니다.', 전월 일시불 및 할부 이용금액 30만원 이상 시 제공됩니다.]
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
        exclude_applied: 1
        unmodeled: ['결합상품요금, 휴대전화 단말기 구매금액, 대리점 카드 결제는 할인하지 않는다']
      - key: movie-5000
        title: CGV·롯데시네마 5,000원 할인
        source: manual
        evidence: ['전국 CGV 및 롯데시네마 영화 티켓 10,000원 이상 결제 시 5,000원 결제일할인(청구할인)', '통합 월 1회, 연 12회 제공됩니다.', '현장 결제, 공식 홈페이지 및 앱을 통한 온라인 예매 시 제공됩니다.']
        target:
          merchants: [cgv, lotte_cinema]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 5000}
        limits:
          - {per: month, count: 1}
        tiers: {from: 300000}
        exclude_applied: 1
        unmodeled: [예매 대행 사이트 결제는 할인하지 않는다]
      - key: base-0-3
        title: 국내외 가맹점 0.3% 할인
        source: manual
        evidence: ['전월 이용금액에 관계없이, 할인한도 없이 국내외 가맹점 0.3% 결제일할인(청구할인)']
        target: {all: true}
        reward: {type: billing_discount, rate: 0.3}
    unmodeled: [삼성카드의 다른 결제일할인과 중복되지 않고 큰 금액만 적용한다, '할인은 승인 시점 기준이고 해외 결제와 무승인 결제(대중교통, 자동납부 등)는 매출전표 접수 시점 기준이다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 출시일 2017-02-28을 시행일로 두었다. 대조한 상품안내장은 2022.7판(심의필 2017-C1a-06523호)이다, assumed: '2017-02-28'}
  - {path: 'revisions[0].benefits', question: 할인의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].new_card', question: 서비스 유예 표가 깨져 읽혀 발급월+1개월까지 실적 없이 10%·이동통신·영화 할인을 주는 것으로 보았다, assumed: 발급월+1개월 30만 구간}
notes: 2026-10-11 상품안내장(2022.7판) 확인. 출시 2017-02-28. 연회비 해외겸용 Mastercard·국내전용 모두 10,000원(기본 7,000+제휴 3,000). 삼성 페이 10%는 온라인과 오프라인 중 하나를 골라 매월 바꿀 수 있고 다음 달 1일부터 반영된다. 삼성 페이 10%, 이동통신 10%, 영화 할인을 받은 이용금액은 실적에서 빠진다. 실적 제외는 국세·지방세·공과금, 아파트 관리비, 대학 등록금, 상품권, 선불카드 충전이다. 삼성카드는 사회보험료를 공과금으로 분류해 insurance.social도 뺐다. 대중교통과 무이자할부는 실적에 넣는다.
