        - {interest_free: true}
      categories: [education.tuition, insurance.social, prepaid_charge, tax, taxi, transit.bus_city, transit.bus_express, transit.subway, utility]
      unmodeled: [다이어트할부와 삼성카드 할인이 적용된 일시불·할부 이용금액은 할인하지 않는다, '고속도로 통행요금, 모바일 티머니, 문자알림서비스, 스마트오토서비스 이용금액은 할인하지 않는다']
