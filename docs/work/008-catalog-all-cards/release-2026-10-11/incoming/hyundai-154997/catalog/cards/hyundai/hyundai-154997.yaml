        when:
          - {channel: online}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
        unmodeled: [네이버쇼핑은 네이버 도메인으로 확인되는 가맹점만 적립한다, 상품 선택 시 연결된 다른 사이트나 앱에서 결제하면 적립하지 않는다]
      - key: restaurant-5
        title: 일반음식점 5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 온라인몰, 일반음식점, 해외 가맹점 5% M포인트 적립, 대상점 통합해 월 1만 M포인트 적립 한도]
        target:
          categories: [restaurant.general]
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
      - key: overseas-5
        title: 해외 가맹점 5% M포인트 적립
        source: manual
        evidence: ['해외 가맹점 : 해외 온·오프라인 가맹점', 대상점 통합해 월 1만 M포인트 적립 한도]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
      - key: base-15
        title: 국내외 가맹점 1.5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 50만원 이상 시 국내외 가맹점 1.5% M포인트 적립, 1회 및 연간 적립 한도 제한 없음, '4,639원 결제 시 70 M포인트 적립']
        target: {all: true}
        reward: {type: points, program: hyundai_m_point, rate: 1.5, round: round}
        tiers: {from: 500000}
    unmodeled: [SC제일은행 영업점 외화 환전 75% 우대는 결제 혜택이 아니라 계산하지 않는다, 실적과 적립 한도는 본인과 가족 카드를 합산한다, 국제브랜드 수수료와 해외서비스 수수료는 실적에 넣지 않는다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다]
open_questions:
  - {path: product_codes, question: 카드 상세 주소의 상품 코드를 확인하지 못했다, assumed: '[]'}
  - {path: 'revisions[0].effective_from', question: 가이드북 시행일을 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
notes: 2026-10-11 공식 가이드북 대조. 연회비 국내전용과 국내외겸용(VISA Platinum) 30,000원(기본 10,000+제휴 20,000), 가족카드 10,000원. 전월 50만 이상 국내외 1.5%, 100만 이상 온라인몰·일반음식점·해외 5%이고 세 영역 합쳐 월 1만 M포인트를 넘으면 1.5%로 적립한다. 매출 건별 소수점 이하 반올림. 실적 제외 목록은 카드론 등, 수수료, 공과금, 상품권·선불카드뿐이라 전기·가스·관리비·무이자 할부는 실적에 넣는다. 공과금 중 상하수도 요금은 utility.water로 뺀다. 취소는 승인월에서 빼고 해외는 취소 달에서 뺀다. 신규 발급은 수령 등록월 다음 달 이용 건까지 50만·100만 미만도 혜택을 줘 100만 구간으로 둔다.
