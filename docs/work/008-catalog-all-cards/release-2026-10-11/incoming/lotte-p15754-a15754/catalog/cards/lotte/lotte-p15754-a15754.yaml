notes: 2026-10-11 상품 페이지와 상품설명서(2025년 8월 심의) 대조. 출시일 2025-06-29. 생활업종 표에 할인율 칸이 비어 있지만 상품 페이지 머리에 커피·편의점·쇼핑 10% 할인이라 적혀 있어 10%로 적었다. 신규 발급 특례는 사용등록월부터 다음 달 말일까지 40만 구간이다. 할인받은 이용금액 전체가 실적에서 빠진다. 같은 이름의 상품 코드 P15756-A15756, P15758-A15758이 판매 목록에 함께 있다.
