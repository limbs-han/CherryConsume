open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품설명서 판(2022.8)의 첫날로 두었다. 상품 출시일은 2021-04-19다, assumed: '2022-08-01'}
  - {path: 'revisions[0].benefits[fuel-60].reward.per_liter', question: 전월 생활요금 자동납부 건수는 결제 입력으로 판단하지 않아 0건 기준 리터당 금액으로 두었다. 자동납부가 있으면 실제 할인이 리터당 20원 더 크다, assumed: '60, 80, 100'}
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-11 상품설명서(2022.8판, 심의필 2021-C1a-02785호) 대조. 출시 2021-04-19. 연회비 해외겸용 Mastercard와 국내전용 모두 9,900원(기본 7,000+제휴 2,900). 실적 제외는 주유와 배달앱·편의점 할인이 적용된 이용금액, 4대보험, 국세·지방세·공과금, 학교납입금, 등록금, 대중교통, 택시, 아파트 관리비, 임대료, 상품권·선불 충전이다. 온라인쇼핑몰 1%와 해외 1%는 실적에 들어간다. 발급월+1개월까지는 30만 구간 혜택. 다른 결제일할인과 겹치면 큰 것 하나만.
