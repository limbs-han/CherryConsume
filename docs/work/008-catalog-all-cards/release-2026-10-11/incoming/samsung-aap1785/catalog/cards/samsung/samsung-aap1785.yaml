schema_version: 2
id: samsung-aap1785
issuer: samsung
name: 네이버웹툰 삼성 iD 카드
short_name: 네이버웹툰 삼성 iD
search_names: [네이버웹툰 iD, 네이버웹툰 삼성카드, 웹툰 삼성카드]
kind: credit
product_codes: [AAP1785]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 10000}
  - {scope: global, brand: mastercard, amount: 10000}
sources:
  - {id: page, kind: product_page, url: 'https://www.samsungcard.com/home/card/cardinfo/PGHPPCCCardCardinfoDetails001?code=AAP1785', fetched_at: 2026-10-11}
  - {id: manual, kind: manual_pdf, url: 'https://www.samsungcard.com/filedownload.do?grpNo=1zPVy1PuFbwGC7xZyM4qtnkQ6u4qfU3KVldCRLwFg4g%3D&sn=1', fetched_at: 2026-10-11}
checked_at: 2026-10-11
revisions:
  - effective_from: 2022-12-23
    source: manual
    tiers: [0, 300000, 600000, 900000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit.bus_city, transit.subway, utility]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 300000, from: issue}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit.bus_city, transit.bus_express, transit.subway, utility]
      unmodeled: [삼성카드 할인이 적용된 일시불과 할부 이용금액은 적립하지 않는다, '자체 가맹점번호로 승인되는 일부 결제(간편결제, 키오스크 등)는 적립하지 않는다', '고속도로 통행요금, 문자알림서비스, 스마트오토서비스, 구매캐시백 계약 가맹점의 의약품·유류 구매한도 결제는 적립하지 않는다']
    stacks:
      - {key: main}
      - {key: npay}
    benefits:
      - key: naver-digital-50
        title: 네이버 디지털콘텐츠·네이버플러스 멤버십 50% 적립
        source: manual
        evidence: [네이버 디지털콘텐츠/네이버플러스 멤버십 50% 네이버페이 포인트 적립, '네이버 디지털콘텐츠 네이버웹툰, 네이버 시리즈, 치지직 채널 정기구독', '네이버플러스 멤버십 네이버플러스 멤버십, 네이버플러스 멤버십 스튜던트', '전월 이용금액대별 통합 월 적립한도 30만원 이상 10,000P, 60만원 이상 20,000P, 90만원 이상 30,000P']
        target:
          merchants: [chzzk, naver_plus_membership, naver_series, naver_webtoon]
        reward: {type: points, program: npay_point, rate: 50}
        limits:
          - per: month
            amount: {300000: 10000, 600000: 20000, 900000: 30000}
        tiers: {from: 300000}
        exclude_applied: 1
        unmodeled: [네이버 디지털콘텐츠는 공식 홈페이지 결제와 안드로이드 제3자 인앱 네이버페이 결제만 적립한다. Google Play 안 네이버페이 결제는 제외한다]
      - key: online-5
        title: 온라인쇼핑몰 5% 적립
        source: manual
        evidence: [온라인쇼핑몰 5% 네이버페이 포인트 적립, '쿠팡, 티몬, 위메프, G마켓, 옥션, 11번가, 인터파크, 삼성카드 쇼핑', '전월 이용금액대별 통합 월 적립한도 30만원 이상 5,000P, 60만원 이상 7,000P, 90만원 이상 10,000P']
        target:
          merchants: [auction, coupang, eleven_st, gmarket, interpark, samsung_card_shopping]
        reward: {type: points, program: npay_point, rate: 5}
        limits:
          - per: month
            amount: {300000: 5000, 600000: 7000, 900000: 10000}
        tiers: {from: 300000}
        exclude_applied: 1
      - key: delivery-coffee-5
        title: 배달앱·스타벅스 5% 적립
        source: manual
        evidence: [배달앱/커피전문점 5% 네이버페이 포인트 적립, '배달앱 배달의민족, 쿠팡이츠', 커피전문점 스타벅스(사이렌오더 결제건 포함), '통합 월 적립한도 : 5,000P', 전월 이용금액 30만원 이상 시 제공]
        target:
          merchants: [baemin, coupang_eats, starbucks]
        reward: {type: points, program: npay_point, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
        exclude_applied: 1
        unmodeled: [배달앱은 공식 앱 결제만 적립하고 가맹점 직접 결제는 제외한다]
      - key: overseas-1
        title: 해외 1% 적립
        source: manual
        evidence: ['전월 이용금액에 관계없이, 적립한도 없이 해외 1% 네이버페이 포인트 적립', 해외 가맹점 및 해외 직접구매 이용건, 해외겸용카드에 한해 제공]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: points, program: npay_point, rate: 1}
      - key: npay-1
        title: 네이버페이 결제 국내 1% 적립
        source: manual
        evidence: ['전월 이용금액에 관계없이, 적립한도 없이 국내 가맹점에서 네이버페이로 결제 시 1% 네이버페이 포인트 적립', 현장 결제 시 네이버페이에 연동된 삼성페이 결제건도 혜택 제공, 네이버페이로 결제 시 국내 가맹점 1% 네이버페이 포인트 적립 혜택과 중복 적용]
        target: {all: true}
        when:
          - {region: domestic}
          - payment: [naver_pay]
        reward: {type: points, program: npay_point, rate: 1}
        stack: npay
    unmodeled: [티몬과 위메프는 영업을 멈춰 온라인쇼핑몰 5%에 넣지 않았다, '실적은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다', 적립은 매출전표 접수 순서로 적용한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 출시일 2022-12-23을 시행일로 두었다. 대조한 상품안내장은 2026.6판(심의필 2026-C1a-07639호)이라 그 사이 바뀐 내용이 있을 수 있다, assumed: '2022-12-23'}
  - {path: 'revisions[0].benefits', question: 적립의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].benefits[naver-digital-50].target', question: 네이버 시리즈와 치지직 가맹점이 공통 파일에 없어 naver_series와 chzzk를 새로 제안했다, assumed: 'naver_series, chzzk'}
notes: 2026-10-11 상품안내장(2026.6판) 확인. 연회비 해외겸용 Mastercard·국내전용 모두 10,000원(기본 7,000+제휴 3,000). 50%와 5% 적립 세 가지는 전월 30만원 이상이고 발급월+1개월까지는 30만 구간 혜택을 준다. 이 세 적립을 받은 이용금액은 실적에서 빠진다. 네이버페이 결제 국내 1%는 다른 적립과 더해 받는다. 실적 제외는 4대보험, 국세·지방세·공과금, 아파트 관리비, 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다. 무이자할부는 실적에 넣고 적립에서 뺀다.
