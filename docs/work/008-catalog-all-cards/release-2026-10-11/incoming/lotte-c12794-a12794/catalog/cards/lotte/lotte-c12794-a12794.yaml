    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      interest_free: count
      installment: full_at_purchase
      cancellation: original_month
