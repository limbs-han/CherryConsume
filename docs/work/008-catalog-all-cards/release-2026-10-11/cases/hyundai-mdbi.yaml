card: hyundai-mdbi
holder:
  started_on: '2026-01-01'
  options:
  - {option: insurance, choice: insured, effective_from: '2026-01-01'}
cases:
- name: 보험 유지 50만 구간 건별 순차 할인
  prev_month_spend: 550000
  payments:
  - {at: 2026-11-05T10:00, amount: 10000, category: cafe}
  - {at: 2026-11-06T10:00, amount: 20000, category: cafe}
  expect:
  - {payment: 0, benefits: {insured-discount: 10000}, counted: 10000}
  - {payment: 1, benefits: {insured-discount: 2000}, counted: 20000}
  calc: 가이드북 예시. 월 1만2천원 한도에서 첫 건 1만원 전액, 둘째 건 2천원
- name: 보험 유지 100만 구간 1만7천원
  prev_month_spend: 1000000
  payments:
  - {at: 2026-11-05T10:00, amount: 50000, category: cafe}
  expect:
  - {payment: 0, benefits: {insured-discount: 17000}, counted: 50000}
  calc: 100만 이상 월 1만7천원 한도
- name: 50만 직전은 혜택 없음
  prev_month_spend: 499999
  payments:
  - {at: 2026-11-05T10:00, amount: 50000, category: cafe}
  expect:
  - {payment: 0, benefits: {}, counted: 50000}
  calc: 50만 미만 혜택 제외
- name: 보험 미이용 0.5% 반올림 적립
  prev_month_spend: 500000
  holder:
    started_on: '2026-01-01'
    options:
    - {option: insurance, choice: not_insured, effective_from: '2026-01-01'}
  payments:
  - {at: 2026-11-05T10:00, amount: 999990, category: cafe}
  expect:
  - {payment: 0, benefits: {not-insured-points: 5000}, counted: 999990}
  calc: 가이드북 예시 999,990 x 0.5% = 4,999.95 반올림 5,000
