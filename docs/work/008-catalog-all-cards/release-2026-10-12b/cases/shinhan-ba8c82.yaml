  options: [{option: choice, choice: coffee, effective_from: '2026-01-01'}]
cases:
- name: 20만 구간 커피 20% 한도 2천
  prev_month_spend: 200000
  payments:
  - {at: 2026-11-04T10:00, amount: 5000, category: cafe, payment_method: physical_card}
  - {at: 2026-11-05T10:00, amount: 10000, category: cafe, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {coffee-20: 1000}}
  - {payment: 1, benefits: {coffee-20: 1000}}
  calc: 5,000 x 20% = 1,000. 두 번째 2,000원 중 통합 한도 남은 1,000원
- name: 실적 직전 199999 없음
  prev_month_spend: 199999
  payments:
