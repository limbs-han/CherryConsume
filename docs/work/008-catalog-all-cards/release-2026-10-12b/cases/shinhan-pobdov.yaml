- name: 금액별 적립률과 SOL페이 추가
  prev_month_spend: 800000
  payments:
  - {at: 2026-11-04T10:00, amount: 19999, category: restaurant.general, payment_method: physical_card}
  - {at: 2026-11-04T11:00, amount: 20000, category: restaurant.general, payment_method: physical_card}
  - {at: 2026-11-04T12:00, amount: 100000, category: restaurant.general, payment_method: physical_card}
  - {at: 2026-11-04T13:00, amount: 500000, category: department_store, payment_method: physical_card}
  - {at: 2026-11-04T14:00, amount: 10000, category: restaurant.general, payment_method: shinhan_sol_pay}
  expect:
  - {payment: 0, benefits: {daily-under-20k: 39}}
  - {payment: 1, benefits: {daily-20k: 80}}
  - {payment: 2, benefits: {daily-100k: 800}}
  - {payment: 3, benefits: {daily-500k: 5000}}
  - {payment: 4, benefits: {daily-under-20k: 20, daily-solpay-extra: 10}}
  calc: 19,999 x 0.2% = 39. 20,000 x 0.4% = 80. 100,000 x 0.8% = 800. 500,000 x 1% = 5,000. SOL페이 10,000원은 0.2% 20 + 0.1% 10
