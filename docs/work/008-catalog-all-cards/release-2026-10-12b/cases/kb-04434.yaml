  calc: 사용등록 다음 달 말일까지 실적 없이도 할인
- name: 무이자할부 할인과 실적 제외
  prev_month_spend: 400000
  payments:
  - {at: 2026-11-05T10:00, amount: 50000, category: restaurant.general, payment_method: samsung_pay, installment_months: 3, interest_free: true}
  expect:
  - {payment: 0, benefits: {}, counted: 0}
  calc: 무이자할부는 할인 제외이고 실적도 제외
