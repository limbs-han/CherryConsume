open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: '상품 페이지에 실적 제외 목록이 없다. 커피 할인의 상품권 구입, 선불카드 충전 제외만 있다', assumed: 'gift_card, prepaid_charge'}
