notes: 신한카드 상품 페이지와 상품 API 기준. 카드 출시 2013.01.30. 연회비 없음. 교통, 커피, 쇼핑 셋 중 하나를 골라 캐시백을 받고 바꾸면 그날 실적부터 적용한다. 전월 실적 20만/30만/50만/80만/120만원 이상 구간마다 월 할인 한도 2천/3천/5천/8천/1만2천원. 교통카드 이용실적은 전전월 기준. 캐시백 한도는 매월 초 생기고 말일에 없어지며 이월하지 않는다.
