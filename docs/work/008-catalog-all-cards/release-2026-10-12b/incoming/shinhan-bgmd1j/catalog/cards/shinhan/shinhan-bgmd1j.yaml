    benefits:
      - key: delivery-app
        title: 배달앱 2~5% 적립
        source: page
        evidence: ['배달앱 이용 시 최대 5% 적립(요기요, 배달의 민족, 쿠팡이츠, 땡겨요)', '마이신한포인트로 적립되며, 이용금액 1회 4만원까지(적립포인트 기준 2천 포인트) 적립 적용', '1회 이용금액 1만원 이상 시 일 1회, 월 4회 적용', '30만원 이상 50만원 미만 2%, 50만원 이상 80만원 미만 3%, 80만원 이상 5%', 공식 배달앱에서 ‘앱 내 카드 결제 > LG트윈스 신한카드 체크 결제’ 시 적용]
        target:
          merchants: [baemin, coupang_eats, ddangyo, yogiyo]
        when:
          - {channel: online}
          - amount: {min: 10000}
        reward:
          type: points
          program: mysinhan_point
          rate: {300000: 2, 500000: 3, 800000: 5}
        limits:
          - {per: txn, base: 40000}
          - {per: day, count: 1}
          - {per: month, count: 4}
        tiers: {from: 300000}
      - key: convenience
        title: 편의점 2~5% 적립
        source: page
        evidence: ['편의점 이용 시 최대 5% 적립(GS25, CU, 세븐일레븐, 이마트24)', 마이신한포인트로 적립되며 건당 적립은 최대 2천 포인트까지 가능, '1회 이용금액 1만원 이상 시 일 1회, 월 4회 적용', '오프라인 매장에 한하여 적용되며, 인터넷이나 모바일 앱을 통한 온라인 거래는 할인 적용 제외', 백화점/할인점 등 입점 매장 제외]
        target:
          merchants: [cu, emart24, gs25, seven_eleven]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward:
          type: points
          program: mysinhan_point
          rate: {300000: 2, 500000: 3, 800000: 5}
        limits:
          - {per: txn, amount: 2000}
          - {per: day, count: 1}
          - {per: month, count: 4}
        tiers: {from: 300000}
        unmodeled: [백화점·할인점 입점 편의점은 적립하지 않는다]
    unmodeled: ['LG트윈스 정규시즌 홈경기 입장권 3천원 할인(일 1회, 월 2회, 프리미엄석·테이블석·익사이팅존·무인발권기 제외)은 공통 가맹점이 없고 좌석을 가릴 수 없어 계산하지 않는다', 'LG트윈스 홈경기장 구단 공식 매장 용품 10% 적립(1회 2만원까지, 1만원 이상, 일 1회, 월 4회)은 공통 가맹점이 없어 계산하지 않는다', 교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 해외 이용금액은 매입일 기준으로 실적 달을 정한다]
notes: '신한카드 상품 페이지 기준. 연회비 국내전용과 Visa 모두 없음. 가족카드 발급 불가, 후불교통 신청 가능. 배달앱과 편의점은 영역마다 1만원 이상 결제에 일 1회, 월 4회, 전월 30만/50만/80만원 구간 2/3/5% 적립. 배달앱은 1회 4만원까지, 편의점은 건당 2천P까지. 신규 발급 회원은 등록월 다음 달까지 생활 편의 영역 30만원 구간. 실적 제외: 현금서비스, 카드론, 연회비, 수수료, 이자, 기프트·선불카드, 취소, 지방세, 수도요금, 국세, 4대보험, 스쿨뱅킹, 아파트관리비, 도시가스, 전기요금, 상품권·선불전자지급수단. 취소 금액을 어느 달 실적에서 빼는지 페이지에 없어 카드사 기본값을 쓴다.'
