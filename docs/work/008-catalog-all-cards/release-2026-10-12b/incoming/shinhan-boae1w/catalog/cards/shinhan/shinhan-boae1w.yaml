open_questions:
  - {path: 'revisions[0].effective_from', question: 이 혜택 구성이 시작된 날을 공식 원문에서 찾지 못해 확인한 날로 두었다, assumed: '2026-10-12'}
notes: 'SKT T&Life 신한카드 상품 페이지 기준(2026-10-12 headless Chrome). 심의필 제2026-C1a-07701호(2026.05.27). 연회비 국내전용 2만7천원, Mastercard 3만원. 가족카드 불가, 후불교통 기능 카드로만 발급. 할인은 전월 30만원 이상. SKT 통신 6천/8천/1만원, T라이프 5% 월 5천/7천/1만2천원(30만/70만/120만). 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 무이자할부, 지방세·국세·지방세외수입·환경개선부담금, 4대보험, 스쿨뱅킹, 대학(원) 등록금, 아파트관리비, 도시가스·전기·TV수신료·수도요금, 상품권·선불전자지급수단, 전자지급수단 충전, 거래 취소. 국내 취소는 최초 승인 달, 해외 취소는 매입 달에서 뺀다. 신규 발급 회원은 등록월 다음 달까지 30만~70만원 구간.'
