        tiers: {from: 300000}
        unmodeled: ['결합상품(TV, 인터넷, 유선전화) 요금은 적립하지 않는데 같은 통신사 가맹점이라 나누지 못한다']
    unmodeled: [LGE.COM 플러스 서비스(구매액 일부를 12개월 뒤 청구하고 12개월 실적 400만~4천만원이면 10만~100만원 할인)는 12개월 누적 실적이라 계산하지 않는다. 플러스 서비스 이용 회원은 적립도 받지 않는다, 교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 해외 이용금액은 매입일 기준으로 실적 달을 정한다, 신한카드 할인이 적용된 거래는 실적에서 빠진다]
notes: LGE.COM 신한카드 상품 페이지 기준(2026-10-12). 출시 2024-09-27, 심의필 제2024-C1a-12520호. 연회비는 페이지 HTML의 국내전용 2만5천원, Master 2만8천원. 플러스 서비스 미이용 회원만 적립한다. LG전자 3%는 전월 50만원 이상 월 10만·연 30만 포인트, 생활 적립은 30만원 이상 월 8천, 50만원 이상 월 1만 포인트 통합 한도. 신규 발급 회원은 등록월 다음 달 말까지 50만 구간. 페이지 적립 제외 목록에 간편결제 문구가 없어 카드사 기본의 간편결제 제외를 쓰지 않았다. 무이자할부는 실적과 적립에서 빠진다. 2026-10-12 결정대로 시내버스와 지하철을 실적에서 뺐다.
