        target:
          all: true
          exclude_merchants: [coffee_bean, daiso, ediya, emart, gs_caltex, kt, lg_uplus, lotte_mart, mega_coffee, olive_young, paul_bassett, sk_energy, skt, starbucks, twosome]
        reward:
          type: points
          program: mysinhan_point
          rate: {0: 0.5, 500000: 1, 1000000: 1.5, 1500000: 2}
        limits:
          - {shared: integrated}
      - key: special-offline
        title: 마트·생활·주유·카페 1~6% 특별 적립
        source: page
        evidence: [특별 적립 | 1% | 2% | 4% | 6%, '마트 | 롯데마트, 이마트', '생활 | 다이소, 올리브영', '주유 | SK에너지, GS칼텍스', '카페 | 스타벅스, 이디야, 커피빈, 투썸플레이스, 폴바셋, 메가커피', '특별 적립 영역은 오프라인 매장 이용 시에만 적립되며, 백화점, 할인점, 면세점, 공항 등 입점 매장 이용금액은 적립되지 않습니다.']
        target:
          merchants: [coffee_bean, daiso, ediya, emart, gs_caltex, lotte_mart, mega_coffee, olive_young, paul_bassett, sk_energy, starbucks, twosome]
        when:
          - {channel: offline}
          - {region: domestic}
        reward:
          type: points
          program: mysinhan_point
          rate: {0: 1, 500000: 2, 1000000: 4, 1500000: 6}
        limits:
          - {shared: integrated}
        unmodeled: [입점 매장·창고형 할인매장·기업형 슈퍼 제외, 주유 LPG 제외]
      - key: special-smart-order
        title: 카페 스마트 오더 특별 적립
        source: page
        evidence: [카페 영역은 스타벅스 사이렌오더 등 스마트 오더 이용 시에도 적립됩니다., 특별 적립 | 1% | 2% | 4% | 6%]
        target:
          merchants: [coffee_bean, ediya, mega_coffee, paul_bassett, starbucks, twosome]
        when:
          - {channel: online}
          - {region: domestic}
        reward:
          type: points
          program: mysinhan_point
          rate: {0: 1, 500000: 2, 1000000: 4, 1500000: 6}
        limits:
          - {shared: integrated}
        unmodeled: [온라인 결제 중 스마트 오더만 적립. 스타벅스 앱 선물하기 제외]
      - key: special-telecom
        title: 이동통신 자동납부 특별 적립
        source: page
        evidence: ['통신요금 | SKT, LG U+, KT 통신요금 자동납부', 특별 적립 | 1% | 2% | 4% | 6%, 통신요금 자동납부 금액만 특별 적립되며]
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward:
          type: points
          program: mysinhan_point
          rate: {0: 1, 500000: 2, 1000000: 4, 1500000: 6}
        limits:
          - {shared: integrated}
        unmodeled: [알뜰폰·선불폰·결합상품 제외]
    unmodeled: [교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 최초 신규 발급 회원은 다음 달까지 50만 구간이지만 재발급 회원은 제외라 신규 특례를 계산하지 않는다, 포인트 리필 3천P와 웰컴 포인트 3만P는 계산하지 않는다, 본인과 가족카드 실적과 한도 합산]
notes: 상품 페이지 기준. 국내 취소는 최초 승인 달, 해외 취소는 매입 달에서 뺀다. 특별 적립 영역 가맹점은 기본 적립에서 빠진다. 기본 Plan 카드와 이름이 기호 하나만 달라 이름 뒤에 (플러스)를 붙였다.
