notes: '신한카드 상품 페이지 기준. 연회비는 페이지 표기로 국내전용 2만원, Mastercard 2만 3천원. 카드 출시 2020.01.30. 렌탈·생활월납·디지털 구독 자동이체와 정기결제에 건별로 전월 40만/80만/120만원 구간 렌탈 3천/5천/7천P, 생활월납과 디지털 구독 2천/4천/6천P를 준다. 업체별 월 1건이라 업체마다 혜택을 나누고 영역 통합 월 5건, 3건, 3건을 공유 한도로 묶었다. 렌탈은 건당 1만원, 나머지는 6천원 이상. 신규 발급 회원은 등록월 다음 달까지 40만원 구간. 실적 제외: 연회비, 카드대출, 수수료, 이자, 취소, 기프트카드·상품권, 선불카드·선불전자지급수단. 취소 금액을 어느 달 실적에서 빼는지 페이지에 없어 카드사 기본값을 쓴다.'
