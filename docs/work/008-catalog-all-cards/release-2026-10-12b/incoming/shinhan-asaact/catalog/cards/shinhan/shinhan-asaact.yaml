schema_version: 2
id: shinhan-asaact
issuer: shinhan
name: 신한카드 S-Line 체크
kind: check
product_codes: [ASAACT, ASABWU, ASAD0L]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/check/1188362_2206.html', fetched_at: '2026-10-12'}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2026-06-23'
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 600000, 1000000]
    spend:
      exclude_categories: [annual_fee, gift_card, prepaid_charge]
    new_card:
      tier: 300000
      tier_by_benefit: {base-point-0-2: 0}
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
      categories: [annual_fee, gift_card, prepaid_charge, tax, utility]
      unmodeled: [포인트 사용금액은 적립 제외]
    limits:
      - key: integrated
        per: month
        amount: {300000: 5000, 600000: 10000, 1000000: 20000}
    stacks:
      - {key: main, pick: best, spill: none}
    benefits:
      - key: base-point-0-2
        title: 전 가맹점 0.2% 적립
        source: page
        evidence: ['기본적립: 전 가맹점 이용금액의 0.2% 적립', 전월 30만원 이상 이용 시 제공, '할인 적용된 이용금액, 연회비, 지방세, 수도요금, 공과금 납부, 각종 수수료 및 이자, 포인트 사용금액, 선불카드 충전금액, Gift카드 구매 금액 등은 포인트 적립에서 제외']
        target: {all: true}
        reward: {type: points, program: mysinhan_point, rate: 0.2}
        tiers: {from: 300000}
        notes: 할인 적용된 이용금액은 적립 제외라 할인과 같은 묶음에 둔다
      - key: dining-lunch-5
        title: 요식업종 점심시간 5% 할인
        source: page
        evidence: [요식업종 이용금액의 5% 할인, 오전 11시~오후 2시 이용금액에 한하여 제공, '1만원 이상(할인 전 승인금액 기준) 이용 시 일 1회, 월 5회, 건당 최대 1천원 할인']
        target:
          categories: [restaurant]
        when:
          - time: {from: '11:00', to: '14:00'}
          - amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {per: day, count: 1}
          - {per: month, count: 5}
          - {shared: integrated}
        tiers: {from: 300000}
        notes: 요식업종에 카페가 드는지 원문이 없어 음식점만 담았다
      - key: transit-postpaid-5
        title: 후불교통 버스·지하철 5% 할인
        source: page
        evidence: ['버스, 지하철 이용금액의 5% 할인(후불교통 카드 선택 시)', 월 최대 5천원까지 할인, S-Line 체크카드를 후불교통카드로 이용 시 제공]
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - billing: [postpaid_transit]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: ['공항버스, 공항리무진, 공항철도는 제외']
      - key: homeshopping-5
        title: 홈쇼핑 5% 할인
        source: page
        evidence: [홈쇼핑 이용금액의 5% 할인, 'CJ, 현대, GS, 롯데 홈쇼핑에 한함', '월 2회, 건당 최대 2,500원 할인']
        target:
          merchants: [cj_onstyle, gs_shop, hyundai_homeshopping, lotte_homeshopping]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 2500}
          - {per: month, count: 2}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: overseas-5
        title: 해외 이용 5% 할인
        source: page
        evidence: [해외 이용금액의 5% 할인, '월 2회, 건당 최대 2,500원 할인']
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 2500}
          - {per: month, count: 2}
          - {shared: integrated}
        tiers: {from: 300000}
    unmodeled: [특별적립 0.3%는 3개월 연속 50만원 이상 이용 조건이라 계산하지 않는다, SK주유소 리터당 40원 할인은 후불교통을 고르지 않은 경우에만 주어 계산하지 않는다, 신규 발급 회원은 등록월 다음 달 말까지 통합할인한도 1만원이지만 30만 구간 한도 5천원으로 계산한다, 신한금융 우대 서비스와 신한라이프 금리 우대는 계산하지 않는다]
notes: 상품 페이지 기준. 교통카드 이용금액은 전전월 금액이 전월 실적에 반영되어 카드사 기본 month_offset을 쓴다. 모바일 후불교통 예외 문구가 없다. 할인은 모두 캐시백 할인이고 통합할인한도 안에서 준다. 디자인만 다른 같은 상품 ASABWU, ASAD0L도 이 카드로 등록한다.
