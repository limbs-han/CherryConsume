notes: '신한카드 상품 페이지 기준. 연회비 국내 20,000원, Visa 23,000원. 후불교통 기능이 있는 카드로만 발급. 전월 30만/70만/120만원 이상 구간에서 ECO Life(교통·페이퍼리스·그린마켓) 1만/2만/3만원, Healthy Plan 5천/1만/1만5천원, Daily Vibe 5천/1만/1만5천원 월 할인 한도. 모두 10% 결제일 할인. 매주 월요일 후불교통 버스·지하철 이용일당 1천원 캐시백(일 1회, 전월 30만원 이상). 신규 회원은 등록월+1개월까지 30만 구간, 월요일 캐시백은 실적과 관계없이. 취소는 국내는 처음 승인된 달, 해외는 취소 전표 매입 달. 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 지방세·국세·지방세외수입·환경개선부담금, 4대보험, 스쿨뱅킹·대학 등록금, 아파트관리비·도시가스·전기·TV수신료·수도요금, 상품권·선불전자지급수단, 포인트·캐시 충전, 거래 취소.'
