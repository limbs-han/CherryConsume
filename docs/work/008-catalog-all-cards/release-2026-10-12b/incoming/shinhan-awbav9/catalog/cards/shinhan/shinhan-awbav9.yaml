schema_version: 2
id: shinhan-awbav9
issuer: shinhan
name: 신한카드 주거래 체크
short_name: 신한 주거래 체크
kind: check
product_codes: [AWBAV9]
status: on_sale
annual_fees:
  - {scope: global, brand: visa, amount: 0}
  - {scope: global, brand: upi, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/check/1187975_2206.html', fetched_at: 2026-10-12}
checked_at: 2026-10-12
revisions:
  - effective_from: 2015-10-26
    source: page
    tiers: [0, 300000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, gift_card, prepaid_charge, transit.bus_city, transit.subway]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
      categories: [annual_fee, gift_card, prepaid_charge, tax.local]
      unmodeled: [포인트로 결제한 금액은 적립하지 않는다]
    facts:
      - {key: shinhan_bank_account, type: bool, scope: card, ask: 이 카드 결제계좌가 신한은행 계좌인가요}
    limits:
      - {key: total, per: month, amount: 30000}
    stacks:
      - {key: main}
      - {key: bank}
    benefits:
      - key: base-0-3
        title: 국내외 가맹점 0.3% 적립
        source: page
        evidence: [국내외 가맹점 0.3% 포인트 적립, 전월 실적 30만원 이상 시 제공, 신한카드 주거래 체크로 마이신한포인트는 월 최대 3만원까지 적립됩니다.(해당월 총 청구금액 기준/가족카드 통합)]
        target: {all: true}
        reward: {type: points, program: mysinhan_point, rate: 0.3}
        limits:
          - {shared: total}
        tiers: {from: 300000}
      - key: bank-shopping-0-7
        title: 신한은행 결제계좌 쇼핑 0.7% 추가 적립
        source: page
        evidence: ['할인점 : 이마트, 롯데마트, 홈플러스', '백화점 : 롯데백화점, 현대백화점, 신세계백화점', '온라인몰 : 11번가, G마켓, 옥션, 쿠팡, 티켓몬스터, 롯데홈쇼핑', 카드 이용대금 결제계좌가 신한은행인 경우 제공되는 서비스입니다., '이마트 에브리데이, 롯데슈퍼, 홈플러스 익스프레스 등 기업형 슈퍼마켓(SSM) 및 백화점, 할인점의 상품권 구매는 제외됩니다.']
        target:
          merchants: [auction, coupang, eleven_st, emart, gmarket, homeplus, hyundai_department, lotte_department, lotte_homeshopping, lotte_mart, shinsegae_department, tmon]
        when:
          - {fact: shinhan_bank_account}
        reward: {type: points, program: mysinhan_point, rate: 0.7}
        limits:
          - {shared: total}
        tiers: {from: 300000}
        stack: bank
        unmodeled: [쿠팡, 티켓몬스터, 롯데홈쇼핑은 사이트나 앱에 직접 접속한 결제만 적립한다]
      - key: bank-overseas-0-7
        title: 신한은행 결제계좌 해외 0.7% 추가 적립
        source: page
        evidence: [해외 이용금액 0.7% 추가적립(총 1% 적립), 카드 이용대금 결제계좌가 신한은행인 경우 제공되는 서비스입니다.]
        target: {all: true}
        when:
          - {region: overseas}
          - {fact: shinhan_bank_account}
        reward: {type: points, program: mysinhan_point, rate: 0.7}
        limits:
          - {shared: total}
        tiers: {from: 300000}
        stack: bank
      - key: bank-life-telecom-1-7
        title: 신한은행 결제계좌 이동통신 자동이체 1.7% 추가 적립
        source: page
        evidence: [이동통신 요금(SKT/KT/LGU+) 자동 이체 거래건, 알뜰폰 자동 이체 거래 건은 제외됩니다.]
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
          - {fact: shinhan_bank_account}
        reward: {type: points, program: mysinhan_point, rate: 1.7}
        limits:
          - {shared: total}
        tiers: {from: 300000}
        stack: bank
      - key: bank-life-transit-1-7
        title: 신한은행 결제계좌 버스·지하철 후불교통 1.7% 추가 적립
        source: page
        evidence: [버스/지하철 후불교통카드 이용금액, 버스/지하철의 후불교통카드 이용 금액만 적립됩니다.]
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - billing: [postpaid_transit]
          - {fact: shinhan_bank_account}
        reward: {type: points, program: mysinhan_point, rate: 1.7}
        limits:
          - {shared: total}
        tiers: {from: 300000}
        stack: bank
      - key: bank-life-gas-1-7
        title: 신한은행 결제계좌 도시가스 1.7% 추가 적립
        source: page
        evidence: [도시가스 이용 금액]
        target:
          categories: [utility.gas]
        when:
          - {fact: shinhan_bank_account}
        reward: {type: points, program: mysinhan_point, rate: 1.7}
        limits:
          - {shared: total}
        tiers: {from: 300000}
        stack: bank
    unmodeled: [월 3만 포인트 한도는 해당 월 총 청구금액 기준이고 본인과 가족카드, 복수카드를 합산한다. 앱은 이용한 달 기준으로 센다, 신한은행 결제계좌 추가 적립은 거래 매입 시점과 결제 시점 모두 신한은행 결제계좌여야 받는다, 교통카드 이용금액은 전전월 금액이 전월 실적에 반영되는데 결제수단별 반영월을 담을 수 없어 시내버스와 지하철을 실적에서 뺐다. 실적이 실제보다 적게 잡힌다]
open_questions:
  - {path: 'revisions[0].benefits[base-0-3]', question: 원문에 결제 계좌가 타행이면 기본서비스 0.7%만 적립된다는 문장이 있지만 기본 적립은 0.3%로 안내되어 서로 맞지 않는다. 덜 주는 쪽으로 기본 0.3%만 두었다, assumed: 기본 0.3%}
  - {path: 'revisions[0].spend.cancellation', question: 취소 금액을 어느 달 실적에서 빼는지 상품 페이지에 없다. 신한카드 기본값을 따랐다, assumed: cancel_month}
notes: '신한카드 상품 페이지 기준. 연회비는 Visa와 UPI 모두 없음. 전월 30만원 이상이면 국내외 가맹점 0.3%를 적립하고, 결제계좌가 신한은행이면 쇼핑과 해외 0.7%(총 1%), 생활 1.7%(총 2%)를 더 적립한다. 추가 적립은 기본 적립과 다른 묶음이다. 적립은 모두 합쳐 월 3만 포인트까지다. 신규 발급 회원은 등록월 다음 달 말까지 실적과 관계없이 받는다. 실적 제외: 현금서비스, 카드론, 연회비, 수수료, 이자, 기프트카드 구매, 선불카드 충전, 취소.'
