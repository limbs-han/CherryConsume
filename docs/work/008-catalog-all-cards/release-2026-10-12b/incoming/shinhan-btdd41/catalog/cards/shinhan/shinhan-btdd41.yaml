notes: '신한카드 EVerywhere 상품 페이지 기준(2026-10-12 headless Chrome). 심의필 제2026-C1h-10818호(2026.07.21~2027.07.20). 연회비 국내전용 1만9천원, Visa 2만2천원. 가족카드 불가. 캐시백은 다음 달 15일 결제계좌로 입금. 전월 40만원 이상. 전기차 충전 40만~80만원 30% 월 1만5천원, 80만원 이상 50% 월 2만원. 생활(디지털 구독 20%, 이동통신·편의점·베이커리·커피 5%) 통합 월 5천원. 실적 제외: 카드대출, 연회비, 수수료·이자, 국세·지방세·수도요금, 4대보험, 기프트카드·상품권, 선불전자지급수단, 거래 취소, 아파트관리비, 전기요금, 도시가스. 신규 발급 회원은 등록월 다음 달 말까지 전기차 40만~80만원 구간, 생활과 주차는 실적과 무관하게 제공.'
