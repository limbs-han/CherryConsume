notes: '신한카드 상품 페이지 기준. 연회비 국내전용 22,000원, Mastercard 25,000원. 포인트 적립은 전월 30만원 이상이고 한도가 없다. 해외 수수료 할인은 실적과 한도 없이 준다. 취소는 국내는 승인된 달, 해외는 신한카드 접수 확정일 기준으로 뺀다. 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 상품권·선불전자지급수단, 지방세·국세·4대보험, 아파트관리비, 도시가스·전기·수도요금, 거래 취소, 해외 가상화폐·사행성 가맹점. 신규 회원은 등록월+1개월까지 실적과 관계없이 적립.'
