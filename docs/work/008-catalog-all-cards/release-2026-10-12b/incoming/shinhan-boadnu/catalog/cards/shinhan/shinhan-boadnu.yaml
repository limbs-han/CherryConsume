notes: '신한카드 상품 페이지 기준. 신규발급과 유효기간 연장이 중단되었고 후불 기후동행 서비스는 2026년 9월 30일 종료 안내가 있어 discontinued로 두었다. 생활 할인은 남아 있다. 연회비 없음. 일곱 영역 5% 결제일 할인, 건당 할인 전 1만원 이상, 최대 1천원, 영역별 일 1회. 온라인(쇼핑몰·OTT·배달앱·서점)과 오프라인(커피·편의점·잡화) 월 한도가 따로 전월 20만/40만/60만원 이상 3천/4천/5천원. 신규 회원은 등록월+1개월까지 20만 구간. 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 거래 취소, 지방세·국세·지방세외수입·환경개선부담금, 4대보험, 스쿨뱅킹·대학 등록금, 아파트관리비·도시가스·전기·TV수신료·수도요금, 상품권·선불전자지급수단, 포인트·캐시 충전.'
