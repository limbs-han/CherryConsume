notes: 신한카드 상품 페이지와 상품 API 기준. 카드 출시 2025.07.31. 연회비 국내전용·UnionPay 2.7만원, UnionPay 모바일 단독 2.2만원. 1% 캐시백과 생활밀착 0.7% 추가 캐시백은 전월 실적 조건이 없다. 캐시백은 결제일 다음 2영업일 안에 결제계좌로 들어온다. 영화와 서울랜드 할인은 직전월 30만원 이상, 신규 회원은 등록월 다음 달 말까지 실적 없이 제공. 원문 교통카드 이용금액은 전월 실적 기준 합산이라 적혀 있으나 신한 공통 방식에 따라 시내버스와 지하철을 실적에서 뺐다.
