        unmodeled: [전월 100만원 이상에 결제계좌 일 잔액 100만원(200만원) 이상인 영업일이 15일 이상이면 5천(1만5천) 포인트 한도를 받는데 계좌 잔액을 알 수 없어 카드 이용금액 200만·300만원 조건만 계산한다, '유튜브 프리미엄은 PC 정기결제만, 통신요금은 알뜰폰·결합상품을 뺀 이동통신 자동납부만 적립한다']
    unmodeled: [SOL포인트로 적립되고 1포인트가 마이신한포인트 1포인트다. SOL Plan 포인트박스로 모으면 10%를 더 넣어 주는 혜택은 계산하지 않는다, 연간 2천만원 이상 이용 시 5만원 캐시백(연 1회)은 연간 누적 실적이라 계산하지 않는다, '발급 첫해 병원·마트·카페 2만원 이상 첫 결제 2만원 웰컴 캐시백(최초 1회, 첫해 연회비 납부 시)은 계산하지 않는다', 본인카드와 가족카드의 전월·연간 이용금액과 월 적립 한도는 합산한다, 교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 해외 이용금액은 매입일 기준으로 실적 달을 정한다]
notes: SOL메이트 신한카드 SOL Plan+ 상품 페이지와 상세 API 기준(2026-10-12). 출시 2026-05-29, 심의필 제2026-C1a-08050호. 연회비는 API의 국내전용(cardBrandCode 0) 5만원, 플래티늄(코드 1, Mastercard) 5만3천원. 신한 슈퍼SOL 앱에서만 신청하고 결제계좌는 신한은행이다. 전월 40만원 이상이면 기본 1%와 병원·마트·카페 2.5%, 100만원 이상이면 1.5%와 5%. 특별 적립은 영역마다 이용금액 월 30만원까지, 기본과 특별 합산 월 6만 포인트. 특별 적립 영역 가맹점과 OTT·멤버십·통신요금은 기본 적립에서 빠진다. 국내 취소는 원래 승인한 달, 해외 취소는 취소 전표가 매입된 달 실적에서 뺀다. 신규 발급 회원은 등록월 다음 달까지 40만 구간. SOL Plan(shinhan-pofdvs)과 다른 상품이다. 2026-10-12 결정대로 시내버스와 지하철을 실적에서 뺐다. 기본 Plan 카드와 이름이 기호 하나만 달라 이름 뒤에 (플러스)를 붙였다.
