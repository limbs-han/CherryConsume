notes: 'KT 가족만족 DC 신한카드 상품 페이지 기준(2026-10-12 headless Chrome). 심의필 제2023-C1a-08411호(2023.07.27). 연회비 국내전용 1만5천원, Mastercard 1만8천원(기본). 가족카드 연회비 없음. 전월 30만~70만원 미만 월 7천원, 70만원 이상 1만5천원. 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 상품권·선불전자지급수단, 무이자할부(부분 무이자 포함), 지방세·국세, 4대보험, 스쿨뱅킹, 대학(원) 등록금, 도시가스·전기·수도요금, 거래 취소. 신규 발급 회원은 등록월 다음 달 말까지 30만~70만원 구간.'
