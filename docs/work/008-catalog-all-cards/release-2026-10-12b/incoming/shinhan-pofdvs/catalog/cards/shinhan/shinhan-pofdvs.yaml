schema_version: 2
id: shinhan-pofdvs
issuer: shinhan
name: SOL메이트 신한카드 SOL Plan
short_name: 신한 SOL메이트 SOL Plan
kind: credit
product_codes: [POFDVS]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 30000}
  - {scope: global, brand: mastercard, amount: 33000}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/credit/1235283_2207.html', fetched_at: 2026-10-12}
checked_at: 2026-10-12
revisions:
  - effective_from: 2026-10-12
    effective_from_estimated: true
    source: page
    tiers: [0, 400000, 1000000, 2000000, 3000000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
    new_card: {tier: 400000}
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, utility]
      unmodeled: [포인트로 결제한 금액과 이 카드로 할인 서비스를 받은 거래는 적립하지 않는다, 키오스크나 간편결제로 결제해 가맹점명이 PG사나 간편결제명으로 찍히면 적립하지 않는다]
    limits:
      - {key: integrated, per: month, amount: 50000}
    benefits:
      - key: base
        title: 국내외 기본 1~1.5% SOL포인트 적립
        source: page
        evidence: ['기본 적립 : 국내/외 이용금액 최대 1.5% SOL포인트 적립', 40만원 이상 100만원 미만 기본 적립 1%, 100만원 이상 1.5%, 통합 적립 한도 5만 포인트, '기본 적립과 특별 적립은 중복 적용되지 않으며, 특별 적립 영역 가맹점은 기본 적립 대상에서 제외됩니다.', ‘담을수록 SOLSOL 서비스’ 대상 영역(OTT/멤버십)은 기본 적립 대상에서 제외됩니다.]
        target:
          exclude_categories: [cafe, hospital, pet.vet, restaurant.bakery]
          all: true
          exclude_merchants: [coffee_bean, coupang_wow, disney_plus, ediya, emart, lotte_mart, mega_coffee, naver_plus_membership, netflix, nh_hanaro_mart, paris_baguette, paul_bassett, starbucks, tous_les_jours, traders, tving, twosome, youtube_premium]
        reward:
          type: points
          program: mysinhan_point
          rate: {400000: 1, 1000000: 1.5}
        limits:
          - {shared: integrated}
        tiers: {from: 400000}
        unmodeled: [해외 일시불을 할부로 바꾼 거래와 해외 현금인출은 적립하지 않는다]
        notes: 특별 적립 영역 가맹점과 업종은 조건을 채우지 못해도 기본 적립에서 뺐다. 원문이 영역 가맹점을 기본 적립 대상에서 뺀다고 해서 덜 주는 쪽을 골랐다
      - key: special-hospital
        title: 병원 2.5~5% SOL포인트 적립
        source: page
        evidence: ['특별 적립 : 병원/마트/카페 최대 5% SOL포인트 적립', '병원: 종합병원, 개인병원, 치과병원, 동물병원, 응급실운영병원 업종', 40만원 이상 100만원 미만 특별 적립 2.5%, 100만원 이상 5%, '특별 적립 영역의 경우, 병원/ 마트/ 카페 각 영역별로 이용금액 기준 월 30만원까지 서비스가 적용됩니다.', 특별 적립 영역은 오프라인 매장 이용 시에만 적립되며]
        target:
          categories: [hospital, pet.vet]
        when:
          - {channel: offline}
          - {region: domestic}
        reward:
          type: points
          program: mysinhan_point
          rate: {400000: 2.5, 1000000: 5}
        limits:
          - {per: month, base: 300000}
          - {shared: integrated}
        tiers: {from: 400000}
      - key: special-mart
        title: 마트 2.5~5% SOL포인트 적립
        source: page
        evidence: ['마트: 이마트, 트레이더스 홀세일클럽, 롯데마트, 농협 하나로마트', '마트 영역은 대상 가맹점 외 창고형 할인매장, 기업형 슈퍼마켓(이마트 에브리데이, 롯데슈퍼 등) 이용 시에는 적립되지 않습니다.', '마트 영역은 주차비, 문화센터 및 마트 내 입점된 임대 매장 이용 시에는 적립되지 않습니다.']
        target:
          merchants: [emart, lotte_mart, nh_hanaro_mart, traders]
        when:
          - {channel: offline}
          - {region: domestic}
        reward:
          type: points
          program: mysinhan_point
          rate: {400000: 2.5, 1000000: 5}
        limits:
          - {per: month, base: 300000}
          - {shared: integrated}
        tiers: {from: 400000}
        unmodeled: ['마트 주차비, 문화센터, 입점 임대 매장은 적립하지 않는다']
      - key: special-cafe
        title: 카페·제과 2.5~5% SOL포인트 적립
        source: page
        evidence: ['카페: 스타벅스, 이디야, 커피빈, 투썸플레이스, 폴바셋, 메가커피, 파리바게뜨, 뚜레쥬르, 커피전문점/제과점 업종', 카페 영역은 스타벅스 사이렌오더 등 스마트 오더 이용 시에도 적립됩니다.]
        target:
          categories: [cafe, restaurant.bakery]
          merchants: [coffee_bean, ediya, mega_coffee, paris_baguette, paul_bassett, starbucks, tous_les_jours, twosome]
        when:
          - {channel: offline}
          - {region: domestic}
        reward:
          type: points
          program: mysinhan_point
          rate: {400000: 2.5, 1000000: 5}
        limits:
          - {per: month, base: 300000}
          - {shared: integrated}
        tiers: {from: 400000}
        unmodeled: [스타벅스 사이렌오더 같은 스마트 오더도 적립되지만 온라인으로 기록한 결제는 계산하지 않는다, 해외 스타벅스와 선물하기는 적립하지 않는다]
      - key: ott-membership
        title: OTT·멤버십 정기결제 100% SOL포인트 적립
        source: page
        evidence: ['OTT: 넷플릭스, 유튜브 프리미엄, 티빙, 디즈니플러스', '멤버십: 네이버플러스 멤버십, 쿠팡 와우 멤버십', 이용금액 기준 건당 4, 900원 이상인 거래에 한해서만 서비스 제공됩니다., '단, 결제계좌의 전월 잔액 조건을 미충족하였더라도 카드 전월 이용금액이 200만원 이상일 경우 5천 포인트 적립 한도, 300만원 이상일 경우 1만5천 포인트 적립 한도가 제공됩니다.']
        target:
          merchants: [coupang_wow, disney_plus, naver_plus_membership, netflix, tving, youtube_premium]
        when:
          - billing: [subscription]
          - amount: {min: 4900}
        reward: {type: points, program: mysinhan_point, rate: 100}
        limits:
          - per: month
            amount: {2000000: 5000, 3000000: 15000}
        tiers: {from: 2000000}
        unmodeled: ['전월 카드 이용 100만원 이상이면서 결제계좌 일 잔액 100만원 이상 영업일이 15일 이상이면 5천P, 200만원 이상이 15일 이상이면 1만5천P까지 주지만 계좌 잔액은 달마다 바뀌어 계산하지 않는다', '앱마켓 인앱결제, 1회성 결제, 통신요금 합산 결제는 적립하지 않는다. 유튜브 프리미엄은 PC 정기결제만 적립한다']
    unmodeled: [적립한 SOL포인트를 SOL Plan 포인트박스로 받으면 10%를 더 주지만 포인트박스 계좌가 있어야 해 계산하지 않는다, 본인카드와 가족카드의 전월 이용금액과 월 적립 한도는 합산한다, '특별 적립 영역의 백화점, 할인점, 면세점, 공항 입점 매장은 적립하지 않는다', 교통카드 이용금액은 실물 전전월 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 해외 이용금액은 매입일 기준으로 실적 달을 정한다, SOL Plan 계열 카드는 한 사람이 한 장만 가질 수 있다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 이 혜택 구성이 시작된 날을 공식 원문에서 찾지 못해 확인한 날로 두었다, assumed: '2026-10-12'}
notes: 'SOL메이트 신한카드 SOL Plan 상품 페이지 기준(2026-10-12 headless Chrome). 심의필 제2026-C1a-13074호(2026.08.28). 신한 슈퍼SOL 앱에서만 신청, 결제계좌는 본인 신한은행 계좌. 연회비 국내전용 3만원, Mastercard 3만3천원(플래티늄). 가족카드 연회비 없음. SOL포인트 1P는 마이신한포인트 1P와 같아 mysinhan_point로 계산한다. 쓸수록 SOLSOL은 전월 40만~100만원 기본 1%·특별 2.5%, 100만원 이상 기본 1.5%·특별 5%, 기본과 특별 합쳐 월 5만P, 특별은 영역별 월 이용 30만원까지. 담을수록 SOLSOL(OTT·멤버십 100%)은 계좌 잔액 조건 대신 카드 실적만으로 받는 200만원 5천P, 300만원 1만5천P만 담았다. 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 지방세·국세·지방세외수입·환경개선부담금, 4대보험, 스쿨뱅킹, 대학(원) 등록금, 아파트관리비, 도시가스·전기·TV수신료·수도요금, 상품권·선불전자지급수단, 전자지급수단 충전, 거래 취소. 국내 취소는 최초 승인 달, 해외 취소는 매입 달. 신규 발급 회원은 등록월 다음 달까지 쓸수록 SOLSOL 40만~100만원 구간.'
