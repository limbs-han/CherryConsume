notes: 'LG U+ 스마트플랜 Plus 신한카드 상품 페이지 기준(2026-10-12 headless Chrome). 심의필 제2020-C1a-03280호(2020.04.16). 연회비 국내전용 2만2천원, Mastercard 2만5천원. 가족카드 발급 불가. 실적 제외: 카드대출, 연회비, 수수료·이자, 도시가스, 전기요금, 4대보험, 무이자할부(슬림할부 포함), 거래 취소, 기프트·선불카드, 상품권·선불전자지급수단. 세금은 실적 제외 목록에 없다. 신규 발급 회원은 등록월 다음 달 말까지 30만~70만원 구간.'
