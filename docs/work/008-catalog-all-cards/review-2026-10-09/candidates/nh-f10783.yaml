schema_version: 2
id: nh-f10783
issuer: nh
name: zgm 할인카드
kind: credit
product_codes: [F10783]
status: on_sale
sources:
  - {id: page, kind: product_page, url: 'https://card.nonghyup.com/servlet/IpCc2021R.act?CD_WRS_SQNO=90010515', fetched_at: &id001 2026-10-04}
checked_at: *id001
revisions:
  - effective_from: *id001
    effective_from_estimated: true
    source: page
    tiers: [0, 400000]
    spend:
      exclude_categories: [education, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit, utility]
    limits:
      - {key: basic_day, per: day, amount: 10000}
      - {key: basic_month, per: month, amount: 40000}
      - {key: living_area, per: month, amount: 5000}
      - {key: living_total, per: month, amount: 20000}
    benefits:
      - key: basic-domestic-1
        title: 기본할인 국내 1% 할인
        source: page
        evidence: ['기본할인 (국내 전 가맹점 1%, NH페이 및 해외 2% 청구할인)', '※ 전월실적 40만원이상 시 제공, 일 1만원, 월 통합한도 4만원', ※ 최초 카드사용등록일로부터 다음달 말일까지는 전월실적 미달 시에도 서비스가 제공]
        target: {all: true}
        reward: {type: billing_discount, rate: 1}
        limits:
          - {shared: basic_day}
          - {shared: basic_month}
        tiers: {from: 400000}
        unmodeled: [‘기본할인’과 ‘생활할인’ 혜택이 중복 적용되지 않음]
      - key: basic-nhpay-2
        title: NH페이 온라인 결제 2% 할인
        source: page
        evidence: ['기본할인 (국내 전 가맹점 1%, NH페이 및 해외 2% 청구할인)', ※ ‘NH페이 온라인 결제’ 할인 서비스는 ‘국내 온라인 결제’에 한함, '※ 전월실적 40만원이상 시 제공, 일 1만원, 월 통합한도 4만원']
        target: {all: true}
        when:
          - payment: [nh_pay]
        reward: {type: billing_discount, rate: 2}
        limits:
          - {shared: basic_day}
          - {shared: basic_month}
        tiers: {from: 400000}
      - key: basic-overseas-2
        title: 해외 전 가맹점 2% 할인
        source: page
        evidence: ['기본할인 (국내 전 가맹점 1%, NH페이 및 해외 2% 청구할인)', '※ 전월실적 40만원이상 시 제공, 일 1만원, 월 통합한도 4만원']
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: billing_discount, rate: 2}
        limits:
          - {shared: basic_day}
          - {shared: basic_month}
        tiers: {from: 400000}
      - key: living-utility-10
        title: 공과금 10% 할인
        source: page
        evidence: ['생활할인 (매월 생활비 10%, 디지털 구독 30% 청구할인)', '공과금 | 아파트관리비, 전기요금(주택용), 도시가스 업종 * 월 자동납부 결제건에 한함 | 10%']
        target:
          categories: [apartment_fee, utility.electricity, utility.gas]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: living_area}
          - {shared: living_total}
        tiers: {from: 400000}
        unmodeled: [자동납부 결제건에 한함]
      - key: living-digital-30
        title: 디지털구독 30% 할인
        source: page
        evidence: ['생활할인 (매월 생활비 10%, 디지털 구독 30% 청구할인)', '디지털구독 | 유튜브프리미엄, 넷플릭스, 티빙, 웨이브 * 월 이용권 정기결제(자동납부) 건에 한함 | 30%']
        target:
          merchants: [netflix, tving, wavve, youtube_premium]
        reward: {type: billing_discount, rate: 30}
        limits:
          - {shared: living_area}
          - {shared: living_total}
        tiers: {from: 400000}
        unmodeled: ['자동납부 결제건에 한함, 기타 결제수단 및 1회성 결제는 제외']
open_questions:
  - {path: 'revisions[0].effective_from', question: 원문에서 시행일을 찾지 못해 수집한 날로 두었다}
  - {path: 'revisions[0]', question: 'spend의 exclude_categories: 원문에서 읽은 값이 카드사 기본값과 다르다. 원문과 맞는지 확인한다'}
  - {path: 'revisions[0]', question: 'benefits[?].reward.rate: 이동통신 요금 할인율은 몇 퍼센트인가?'}
  - {path: 'revisions[0]', question: 'benefits[?].reward.rate: 새벽배송 할인율은 몇 퍼센트인가?'}
  - {path: 'revisions[0]', question: 'benefits[?].reward.rate: 대형마트 할인율은 몇 퍼센트인가?'}
  - {path: 'revisions[0]', question: 'benefits[?].reward.rate: 보험료 할인율은 몇 퍼센트인가?'}
  - {path: 'revisions[0]', question: 'benefits[?].reward.rate: 반려동물 관련 할인율은 몇 퍼센트인가?'}
  - {path: 'revisions[0]', question: 'benefits[?].reward.type: 전세계 공항 라운지 무료 이용 혜택의 reward.type은 무엇인가?'}
  - {path: 'revisions[0]', question: 'kind: zgm 할인카드가 신용카드인지 체크카드인지 확인 필요'}
  - {path: kind, question: 'kind를 두 번째 검토에서 공식 원문의 문구를 따라 고쳤다: 발급 기준 안내표입니다. 발급대상 | 개인(신용) 교통구분 | 교통(후불), 비교통 ※ 가족카드 발급가능 ※ 본 상품은 ''모바일카드''발급이 가능합니'}
notes: 새 카드 초안. 머리는 색인에서, 규칙은 모델이 원문에서 옮겼다. 연회비와 짧은 이름은 사람이 채운다.
