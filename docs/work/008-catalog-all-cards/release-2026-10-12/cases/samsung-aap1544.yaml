  - {payment: 1, benefits: {daily-npay-10: 1000}, counted: 0}
  - {payment: 2, benefits: {base-0-5: 50}, counted: 10000}
  - {payment: 3, benefits: {daily-delivery-5: 1000}, counted: 0}
  calc: 4,000P 뒤 15,000 × 10% = 1,500이나 남은 한도 1,000. 한도를 다 쓴 다음 건은 0.5% 50P. 배민 네이버페이는 10% 한도 소진 뒤 5% 20,000 × 5% = 1,000P
