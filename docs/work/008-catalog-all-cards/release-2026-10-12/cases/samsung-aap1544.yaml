- name: 일상 패키지 네이버페이 온라인 10% 30만 구간 하한
  prev_month_spend: 300000
  payments:
  - {at: 2026-11-03T20:00, amount: 30000, merchant: gmarket, channel: online, payment_method: naver_pay}
  expect:
  - {payment: 0, benefits: {daily-npay-10: 3000}, counted: 0}
  calc: 30,000 × 10% = 3,000P. 10% 적립 건은 실적 제외라 0
