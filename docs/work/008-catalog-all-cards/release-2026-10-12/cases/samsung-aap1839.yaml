card: samsung-aap1839
holder:
  started_on: '2026-01-01'
  options: [{option: light_installment, choice: none, effective_from: '2026-01-01'}]
cases:
- name: KT 통신요금 40만 구간 월 3천원 한도
  prev_month_spend: 400000
  payments:
  - {at: 2026-11-25T09:00, amount: 60000, merchant: kt, billing: autopay, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {kt-telecom: 3000}, counted: 60000}
  calc: 정기결제액만큼 할인하되 40만 구간 월 한도 3,000원
- name: KT 통신요금이 한도보다 적으면 결제액만큼
  prev_month_spend: 1200000
  payments:
  - {at: 2026-11-25T09:00, amount: 5000, merchant: kt, billing: autopay, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {kt-telecom: 5000}}
  calc: 120만 구간 한도 8,000원보다 적어 5,000원 전액
- name: 40만 직전이면 통신요금 할인 없음
  prev_month_spend: 399999
  payments:
  - {at: 2026-11-25T09:00, amount: 60000, merchant: kt, billing: autopay, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {}}
  calc: 0 구간
- name: 커피 80만 구간 통합 월 3천원 한도와 스타벅스 사이렌오더
  prev_month_spend: 800000
  payments:
  - {at: 2026-11-02T08:00, amount: 40000, merchant: twosome, payment_method: physical_card}
  - {at: 2026-11-03T08:00, amount: 40000, merchant: starbucks, channel: online, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {coffee-5: 2000}, counted: 40000}
  - {payment: 1, benefits: {starbucks-5: 1000}}
  calc: 40,000 × 5% = 2,000. 스타벅스 2,000이나 남은 한도 1,000
- name: 80만 직전이면 편의점 할인 없음
  prev_month_spend: 799999
  payments:
  - {at: 2026-11-02T12:00, amount: 10000, merchant: cu, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {}}
  calc: 40만 구간에는 편의점 할인이 없다
- name: 편의점 배달앱 120만 구간 통합 월 5천원
  prev_month_spend: 1200000
  payments:
  - {at: 2026-11-02T12:00, amount: 60000, merchant: gs25, payment_method: physical_card}
  - {at: 2026-11-03T19:00, amount: 60000, merchant: baemin, channel: online, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {convenience-5: 3000}}
  - {payment: 1, benefits: {delivery-5: 2000}}
  calc: 60,000 × 5% = 3,000. 배민 3,000이나 남은 한도 2,000
- name: 신규 발급 다음 달까지 통신 40만 구간 편의점 80만 구간
  prev_month_spend: 0
  holder:
    started_on: '2026-10-15'
  payments:
  - {at: 2026-11-02T12:00, amount: 10000, merchant: cu, payment_method: physical_card}
  - {at: 2026-11-25T09:00, amount: 60000, merchant: kt, billing: autopay, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {convenience-5: 500}}
  - {payment: 1, benefits: {kt-telecom: 3000}}
  calc: 10월 발급이라 11월 말까지 특례. 10,000 × 5% = 500, KT는 40만 구간 3,000
- name: 무이자할부 할인과 실적 제외, 지하철 실적 제외
  prev_month_spend: 1200000
  payments:
  - {at: 2026-11-02T12:00, amount: 100000, merchant: gs25, installment_months: 3, interest_free: true, payment_method: physical_card}
  - {at: 2026-11-03T08:00, amount: 1500, category: transit.subway, payment_method: physical_card}
  expect:
  - {payment: 0, benefits: {}, counted: 0}
  - {payment: 1, benefits: {}, counted: 0}
  calc: 무이자할부는 할인과 실적 모두 제외. 지하철은 후불교통 실적 제외
