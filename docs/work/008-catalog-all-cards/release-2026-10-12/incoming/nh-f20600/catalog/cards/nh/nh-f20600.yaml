schema_version: 2
id: nh-f20600
issuer: nh
name: 쿵야싱싱체크카드
kind: check
product_codes: [F20600]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://card.nonghyup.com/servlet/IpCc2021R.act?CD_WRS_SQNO=90010545', fetched_at: '2026-10-12', review_no: 준법감시인 심의필 2026-4110}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2026-10-12'
    effective_from_estimated: true
    source: page
    tiers: [0, 300000]
    spend:
      basis: prev_calendar_month
      regions: [domestic, overseas]
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit.bus_city, transit.subway, utility]
      installment: full_at_purchase
      cancellation: cancel_month
    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      categories: [gift_card, prepaid_charge]
      unmodeled: [백화점·할인점·쇼핑몰 안 임대매장은 적립에서 빠진다, '가상화폐 거래소 이용금액, 포인트 결제분, 과태료, 우편요금은 실적에서 빠진다', 다른 청구할인과 겹치면 큰 혜택 하나만 준다]
    limits:
      - {key: special, per: month, amount: 10000}
    benefits:
      - key: base-0-2
        title: 국내외 기본 0.2% NH포인트
        source: page
        evidence: ['기본 : 국내/외 0.2% NH포인트 적립', 전월실적 및 적립한도 없습니다, 전통시장 및 생활영역 이용 금액은 기본적립(0.2%)이 제공되지 않습니다.]
        target:
          exclude_categories: [traditional_market, travel.duty_free]
          all: true
          exclude_merchants: [cgv, cu, daiso, gs25, nh_hanaro_mart, nh_mall, olive_young, paris_baguette, starbucks]
        when:
          - {region: domestic}
        reward: {type: points, program: nh_point, rate: 0.2}
        unmodeled: [생활영역 해외일시불 이용금액에는 기본 적립이 없다고 보고 국내 이용만 계산한다, 생활영역 가맹점은 조건과 실적에 상관없이 기본 적립에서 뺐다]
      - key: market-15
        title: 전통시장 15% NH포인트
        source: page
        evidence: ['전통시장 : 15% NH포인트 적립', 국세청 기준 전통시장 등록 가맹점, 전월실적 30만원 이상 시 제공됩니다., 전통시장 및 생활영역 적립한도는 월 1만포인트 입니다.]
        target:
          categories: [traditional_market]
        reward: {type: points, program: nh_point, rate: 15}
        limits:
          - {shared: special}
        tiers: {from: 300000}
      - key: life-0-3
        title: 생활영역 0.3% NH포인트
        source: page
        evidence: ['생활영역 : 0.3% NH포인트 적립', '하나로마트/클럽, 농협몰, GS25, CU, 올리브영, 다이소(오프라인 매장 직접 결제건), CGV(영화관람권), 스타벅스(사이렌오더 포함), 파리바게뜨', 전월실적 30만원 이상 시 제공됩니다.]
        target:
          merchants: [cgv, nh_hanaro_mart, nh_mall, paris_baguette, starbucks]
        reward: {type: points, program: nh_point, rate: 0.3}
        limits:
          - {shared: special}
        tiers: {from: 300000}
        unmodeled: [CGV는 영화관람권만이고 매점은 빠진다, 백화점·마트 입점 매장과 별도 가맹점번호로 승인되는 간편결제는 빠질 수 있다]
      - key: life-store-0-3
        title: 편의점·잡화 0.3% NH포인트
        source: page
        evidence: ['편의점/잡화 : GS25, CU, 올리브영, 다이소', 오프라인 매장 직접 결제건에 한함]
        target:
          merchants: [cu, daiso, gs25, olive_young]
        when:
          - {channel: offline}
        reward: {type: points, program: nh_point, rate: 0.3}
        limits:
          - {shared: special}
        tiers: {from: 300000}
      - key: life-overseas-0-3
        title: 해외일시불·면세점 0.3% NH포인트
        source: page
        evidence: ['해외 : 해외일시불, 면세점']
        target:
          categories: [travel.duty_free]
        reward: {type: points, program: nh_point, rate: 0.3}
        limits:
          - {shared: special}
        tiers: {from: 300000}
      - key: life-abroad-0-3
        title: 해외 이용 0.3% NH포인트
        source: page
        evidence: ['해외 : 해외일시불, 면세점']
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: points, program: nh_point, rate: 0.3}
        limits:
          - {shared: special}
        tiers: {from: 300000}
notes: 2026-10-12 expand98 업종 재조사. 전통시장 업종이 생겨 다시 옮겼다. 시행일은 원문에 없어 확인한 날로 두었다.
