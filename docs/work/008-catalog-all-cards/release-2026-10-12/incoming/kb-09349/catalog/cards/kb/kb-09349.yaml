notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 새 업종 전통시장으로 국세청 지정 전통시장 할인을 담았다. 지방세는 상하수도를 포함해 tax.local과 utility.water로 뺐다. 온누리상품권 차감과 KB Pay 쇼핑 탭 할인은 빼서 실제보다 덜 준다.
