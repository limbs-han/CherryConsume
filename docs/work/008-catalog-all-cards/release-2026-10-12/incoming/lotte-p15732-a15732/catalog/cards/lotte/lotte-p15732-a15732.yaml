notes: 2026-10-11 상품설명서 대조. 출시일 2025-05-12. 연회비 국내전용·해외겸용(VISA) 모두 20,000원(기본 7,000+제휴 13,000), 가족카드 없음. 국내외 1% 트래블 포인트 적립, 전월실적과 한도 없음. 트래블 포인트는 트래블월렛 운영 포인트로 1포인트 = 1원이다. 롯데카드 L.POINT는 적립되지 않는다. 대중교통 적립 제외 범위는 원문대로 시내·광역·시외버스와 지하철, 택시, 고속버스다.
