notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 새 업종 차량정비, 주차장, 세차로 차량서비스 혜택을 담았다. 실적 유예기간은 본인 생애 첫 발급만 1구간 혜택을 준다. 초중고 학교납입금만 적혀 있어 primary_secondary_fee로 뺐다.
