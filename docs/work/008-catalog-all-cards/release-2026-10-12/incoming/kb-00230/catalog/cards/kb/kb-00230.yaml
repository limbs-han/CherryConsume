short_name: KB EV
kind: credit
product_codes:
  - '00230'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
  - {scope: global, brand: mastercard, amount: 20000}
  - {scope: domestic, form: mobile, amount: 14000}
  - {scope: global, brand: mastercard, form: mobile, amount: 14000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=00230', fetched_at: '2026-10-12', review_no: 제2024-C1a-09001호}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2024-08-08'
    effective_from_estimated: true
    source: page
    tiers: [0, 400000, 800000, 1200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, car.toll, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      interest_free: exclude
      month_offset: {}
      exclude_applied: 1
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: ['PG 결제, 일부 간편결제, 호텔·백화점·대형마트·철도역사 입점 가맹점은 할인에서 빠질 수 있다']
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 본인 명의로 발급받았나요? 가족카드만 발급받은 경우는 아니요를 고르세요.'}
    benefits:
      - key: ott-20
        title: OTT 20% 청구할인
        source: page
        evidence: ['넷플릭스, 티빙, 웨이브, 디즈니 플러스, 유튜브 프리미엄 | 40만원 이상 | 20% | 5천원', 공식 홈페이지/모바일앱을 통한 정기결제 시 할인 (간편결제 및 앱스토어를 통한 인앱결제 등은 제외), '최초 카드 사용 등록일(KB Pay 등 간편결제 등록 포함)로 부터 다음달 말일(실적 유예기간)까지 KB국민 EV 카드 전월 이용실적 40만원 미만 시, 월 2천5백원 한도까지 할인이 제공됩니다.']
        target:
          merchants: [disney_plus, netflix, tving, wavve, youtube_premium]
        when:
          - payment: [physical_card]
        reward: {type: billing_discount, rate: 20}
        limits:
          - per: month
            amount: {0: 2500, 400000: 5000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [공식 홈페이지와 앱의 정기결제만 할인하고 앱스토어 인앱결제는 제외한다]
      - key: openmarket-kbpay-10
        title: KB Pay 오픈마켓 10% 청구할인
        source: page
        evidence: ['G마켓, 옥션, 11번가 | 40만원 이상 | 10% | 5천원', 'G마켓, 옥션, 11번가에서 KB Pay 결제수단으로 결제 시 할인', '최초 카드 사용 등록일(KB Pay 등 간편결제 등록 포함)로 부터 다음달 말일(실적 유예기간)까지 KB국민 EV 카드 전월 이용실적 40만원 미만 시, 월 2천5백원 한도까지 할인이 제공됩니다.']
        target:
          merchants: [auction, eleven_st, gmarket]
        when:
          - payment: [kb_pay]
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {0: 2500, 400000: 5000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: ev-charging-20
        title: 전기차 충전 20% 청구할인
        source: page
        evidence: ['전기/수소차 충전 | 전기차 충전기, 수소차 충전소 | 20% | 40만원 이상 1만원, 80만원 이상 1만5천원, 120만원 이상 2만원', 실적 유예기간 전월 이용실적 40만원 미만 시 월 5천원 한도]
        target:
          categories: [car.ev_charging]
        reward: {type: billing_discount, rate: 20}
        limits:
          - per: month
            amount: {0: 5000, 400000: 10000, 800000: 15000, 1200000: 20000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [수소차 충전소는 담을 업종이 없어 계산하지 않는다]
      - key: parking-carwash-20
        title: 주차·세차 20% 청구할인
        source: page
        evidence: ['주차, 세차 | 주차장, 세차장 업종 | 20% | 40만원 이상 월 5천원', 실적 유예기간 전월 이용실적 40만원 미만 시 월 2천5백원 한도]
        target:
          categories: [car.car_wash, car.parking]
        reward: {type: billing_discount, rate: 20}
        limits:
          - per: month
            amount: {0: 2500, 400000: 5000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
    unmodeled: ['손해보험 업종 보험료 건당 20만원 이상 1만원 청구할인(연 1회, 유예 5천원)은 공통 업종 민간 보험이 생명보험까지 넓어 계산하지 않는다', 가족카드 실적과 한도는 본인과 합산한다, 해외 이용금액은 매입 완료 기준 일시불만 실적에 넣는다, '정부지원금, 공항버스·자판기·터널통행료·항공기내 같은 무승인 전표는 실적에서 빠진다. 공항버스는 담을 업종이 없다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2024.08.08 출시라고만 적었다. 현재 규칙의 시작일로 잠정 적용한다., assumed: '2024-08-08'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 터널통행료 무승인 전표 실적 제외를 통행료 업종 전체 제외로 옮겼다. 승인된 통행료도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: car.toll}
  - {path: 'revisions[0].unmodeled', question: 자동차보험 1만원 청구할인을 담으려면 공통 업종 손해보험이 필요하다. 민간 보험은 생명보험까지 넓다}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. KB 에버온 EV kb-00235와 혜택 구조가 같다. 손해보험 자동차보험 혜택은 업종이 없어 뺐다. 초중고 학교납입금만 적혀 있어 primary_secondary_fee로 뺐다.
