revisions:
  - effective_from: '2025-06-30'
    effective_from_estimated: true
    source: page
    tiers: [0, 400000, 800000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, car.toll, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      interest_free: count
      month_offset: {}
