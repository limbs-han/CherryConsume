schema_version: 2
id: lotte-1784
issuer: lotte
name: KT Super DC 롯데카드
kind: credit
product_codes: []
status: on_sale
annual_fees:
  - {scope: domestic, amount: 23000}
  - {scope: global, brand: mastercard, amount: 25000}
  - {scope: global, brand: amex, amount: 25000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://image.lottecard.co.kr/UploadFiles/cardProvisionPath/2020-A00011_20250707_10004.pdf', fetched_at: '2026-10-12'}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2026-10-12'
    effective_from_estimated: true
    source: manual
    tiers: [0, 300000, 700000, 1200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, telecom, transit.bus_city, transit.bus_intercity, transit.subway, utility]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: original_month
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 300000, from: registration}
    facts:
      - {key: kt_superdc_handset_installment, type: bool, scope: card, ask: '이 카드로 KT 통신기기(핸드폰) 할부 서비스를 이용 중인가요? 할부를 다 갚았으면 아니요입니다'}
    benefits:
      - key: kt-telecom
        title: KT 유·무선 통신요금 자동이체 결제일 할인
        source: manual
        evidence: ['KT 유·무선 통신요금 10,000~20,000원 결제일 할인', '30만원 이상~70만원 미만 10,000원 / 70만원 이상~120만원 미만 15,000원 / 120만원 이상 20,000원 (통신기기 할부 이용시)', 통신기기(핸드폰) 할부 미이용시 7, 000원, 할인금액이 청구금액보다 큰 경우 청구금액까지만 할인 적용됩니다., KT 통신요금 할인을 받기 위해서는 반드시 통신요금 자동이체가 되어 있어야 합니다., '최초 카드발급 후 사용등록일~다음달 말일까지는 지난달 이용금액 30만원 미만 시에도 할부 이용 시 10,000원, 미이용 시 7,000원 결제일 할인']
        target:
          merchants: [kt]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: 7000
            adjust:
              - when: {fact: kt_superdc_handset_installment}
                amount: {300000: 10000, 700000: 15000, 1200000: 20000}
        tiers: {from: 300000}
        notes: 통신요금이 할인액보다 적으면 그 금액만큼이라 100% 할인에 월 한도로 적었다. 할부 이용 여부를 답하지 않으면 미이용 7,000원으로 계산한다
    unmodeled: [KT 유·무선 통신요금은 실적에서 빠진다. 가맹점 단위 실적 제외가 없어 통신요금 업종 전체를 실적에서 뺐다, 'KT Super DC 롯데카드가 아닌 롯데카드 이용금액, 오토·스마트캐시백 신청금액, 장애인 고용부담금, 관세·벌금·과태료·민원발급 수수료·인지세·송달료, 무승인전표(자판기, 터널통행료, 항공기 기내 구매), 현금서비스·카드론·이자·수수료는 실적에서 빠진다', 실적과 할인 한도는 본인과 가족카드를 합산한다, 롯데카드의 다른 결제일 할인과 겹치면 할인이 큰 혜택 하나만 준다, 통신기기 할부를 완납하면 다음 날부터 미이용 할인으로 바뀐다, 이동통신처럼 한 달 이용분이 다음 달에 결제되는 건은 롯데카드 접수일 기준으로 실적에 넣는다]
open_questions:
  - {path: product_codes, question: 롯데카드 온라인 판매 목록에 상품 코드가 없어 id를 공시 색인 번호로 두었다. KT 매장 전용 판매로 보인다, assumed: '[]'}
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2022-09-23이고 설명서는 2025년 6월 기준이다, assumed: '2026-10-12'}
notes: 2026-10-12 상품설명서(2025년 6월 기준) 대조. 이미지 PDF라 화면으로 읽었다. 연회비 국내전용 23,000원, 해외겸용(MASTER, AMEX) 25,000원. 신규 발급 특례는 사용등록일부터 다음 달 말일까지 30만 구간이다. 대중교통(시내·광역·시외버스, 지하철)은 실적에서 빠진다.
