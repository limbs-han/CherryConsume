      - key: taxi-50
        title: 택시 50% 하나머니 적립
        source: page
        evidence: ['택시 이용금액 50% 하나머니 적립 제공 (지난달 실적 50만원 이상, 월 적립 한도 5천 하나머니)', '택시업종, 카카오T, UT | 50% | 5천 하나머니', '카카오T와 UT의 경우 공식 앱 또는 홈페이지를 통한 택시 결제건에 한하여 서비스가 제공되며, 대리운전·퀵 서비스·주차·기차 등 택시 이외의 결제건은 서비스가 제외됨']
        target:
          categories: [taxi]
        reward: {type: points, program: hana_money, rate: 50, round: round}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 500000}
      - key: overseas-3
        title: 해외 가맹점 3% 하나머니 적립
        source: page
        evidence: [해외 | 해외 가맹점 | 3%, '영역별 3% 하나머니 적립 | 지난달 실적 50만원 이상, 월 통합 적립한도 5만 하나머니']
