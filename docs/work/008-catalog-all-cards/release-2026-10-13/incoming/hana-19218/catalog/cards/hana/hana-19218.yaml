        tiers: {from: 500000}
      - key: travel-3
        title: 항공·면세·여행 3% 하나머니 적립
        source: page
        evidence: ['항공 | 대한항공, 아시아나 항공, 진에어, 에어부산, 에어서울, 제주항공, 티웨이항공', '면세 | 신라면세점, 롯데면세점, 신세계면세점, 현대백화점면세점', '여행 | 하나투어, 아고다, 익스피디아, 호텔스닷컴', '항공/면세 : 공식 홈페이지(온라인/모바일앱) 및 오프라인 매장을 통한 결제 시에만 서비스 제공']
        target:
          merchants: [agoda, air_busan, air_seoul, asiana_airlines, expedia, hana_tour, hotels_com, hyundai_dfs, hyundai_dfs_online, jeju_air, jin_air, korean_air, lotte_dfs, lotte_dfs_online, shilla_dfs, shilla_dfs_online, shinsegae_dfs, shinsegae_dfs_online, tway_air]
