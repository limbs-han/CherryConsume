      - key: ev-30
        title: EV 충전 30% 하나머니 적립
        source: page
        evidence: ['주유(LPG포함) 리터당 150 하나머니, EV충전 30% 하나머니 적립 (지난달 실적 50만원 이상, 월 적립 한도 1만 하나머니)', EV(전기차) 충전 가맹점 멤버십 가입 후 결제 카드로 등록 이용한 경우 또는 대상 충전 가맹점의 충전 기기 현장 결제 건에 한하여 서비스 제공]
        target:
          categories: [car.ev_charging]
        reward: {type: points, program: hana_money, rate: 30, round: round}
        limits:
          - {per: month, amount: 10000}
        tiers: {from: 500000}
        unmodeled: [EV 충전 요금이 아파트 관리비 같은 다른 이용 건에 포함된 결제는 제외된다, 충전 가맹점 멤버십 등록이 필요하다]
      - key: base-1-5
        title: 국내외 가맹점 1.5% 하나머니 적립
        source: page
        evidence: [국내외가맹점 최대 1.5% 하나머니 적립, 1.5% | 200만원 이상 | 10만 하나머니, 1.0% | 200만원 미만 | 없음, 적립 영역이 중복 되는 경우 적립금액이 큰 서비스가 우선 적용 (매출 건당 하나의 서비스만 적용)]
        target: {all: true}
        reward: {type: points, program: hana_money, rate: 1.5, round: round}
        limits:
          - {per: month, amount: 100000}
        tiers: {from: 2000000}
      - key: base-1
        title: 국내외 가맹점 1% 하나머니 적립
        source: page
        evidence: [1.0% | 200만원 미만 | 없음, '기본적립, 특별적립, 주유/EV충전 적립, 택시 50%적립, 디지털 컨텐츠 50% 적립의 월 적립 한도를 모두 소진 후, 발생하는 추가 매출 건은 1.0% 하나 머니 적립 제공']
        target: {all: true}
        reward: {type: points, program: hana_money, rate: 1, round: round}
    unmodeled: [주유 리터당 150 하나머니 적립은 휘발유 고시가 기준 리터 환산이라 계산하지 않고 일반 적립률로 둔다, 연간 누적 이용금액에 따른 프리미엄 바우처와 보너스 바우처 하나머니와 공항 라운지는 계산하지 않는다, 본인카드와 가족카드 실적은 각각 산정한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 카드 출시일을 잠정 시작일로 둔다., assumed: '2026-06-29'}
  - {path: 'revisions[0].spend.exclude_categories', question: '원문 실적 제외는 국세, 지방세, 수도·전기요금 등이다. 전기와 수도가 공과금에 드는지 단정할 수 없어 utility 전체를 뺐다.', assumed: utility 전체}
  - {path: 'revisions[0].benefits[ev-30].limits', question: EV 충전과 주유 적립은 월 통합 1만 하나머니인데 주유를 계산하지 않아 EV만 1만 한도로 둔다., assumed: EV만 1만}
notes: 2026-10-13 공식 상품 페이지(준법번호 L-24-0078)에서 옮겼다. 연회비 VISA 본인 300,000원, 국내전용 본인 295,000원이며 제휴연회비는 바우처와 서비스 비용이다. 하나머니 1하나머니 = 1원, 소수점 이하 반올림. 적립 영역이 겹치면 큰 쪽 하나만 준다.
