        target:
          merchants: [gs_caltex, sk_energy]
        reward: {type: points, program: kb_pointree, per_liter: 150}
        limits:
          - per: month
            amount: {500000: 10000, 1000000: 20000, 1500000: 30000}
        tiers: {from: 500000}
        notes: 원문은 경유·LPG도 휘발유 기준유가로 리터를 환산한다. 앱은 reference.yaml의 기름값으로 리터를 환산한다
      - key: car-care-5
