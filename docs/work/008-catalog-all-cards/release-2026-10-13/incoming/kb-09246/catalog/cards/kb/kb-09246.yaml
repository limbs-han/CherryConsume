    unmodeled: [자동차보험 건당 10만원 이상 1만점(연 1회)은 자동차보험만 가릴 업종이 없어 계산하지 않는다, 발레파킹과 공항 라운지 같은 티타늄 서비스는 계산하지 않는다, 최초 사용등록일부터 다음 달 말일까지 실적 없이 50만원 구간을 주는 신규 특례는 계산하지 않는다, 정부지원금(보육료·유치원보조비·바우처)과 무승인전표(자판기·터널통행료·항공기내 이용)는 실적에서 빠진다, 제과·편의점·올리브영의 백화점·대형마트 입점 매장은 적립에서 빠진다, 적립 한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일로 둔다., assumed: '2026-10-12'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통요금 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].stacks', question: 전 가맹점 0.2%가 주유·차량관리·생활 적립과 겹쳐 쌓이는지 원문이 밝히지 않았다. 덜 주는 쪽으로 같은 묶음에서 큰 것 하나만 받게 두었다, assumed: main}
  - {path: annual_fees, question: 모바일 단독카드 연회비를 원문에서 찾지 못했다}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다.
