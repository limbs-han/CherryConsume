notes: 2026-10-13 공식 상품 페이지를 브라우저로 열어 확인했다. 상품 출시일 2026-06-26. 금융혁신지원특별법에 따른 혁신금융서비스 상품이다. 가족카드 실적과 한도는 본인카드와 별도다.
