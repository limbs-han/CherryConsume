    unmodeled: [본인회원 부모가 신청하고 만 12~18세 자녀에게 발급하는 가족 신용카드다, 월 이용한도 기본 10만원이며 일시불만 가능하다, PG나 간편결제 전용 가맹점으로 결제하면 할인 제외, 신차구매와 의약품 전용몰과 환금성 업종과 부동산임대료와 LH/SH 공공임대료는 실적 제외인데 담지 못했다, 후불교통 이용금액은 매출표 접수일 기준으로 가족회원 월 실적에 포함된다, 국내가맹점 취소가 매월 1~2일에 접수되면 전월 실적에서 뺀다, 신규 특례는 최초 발급 카드에만 주고 시작일은 사용등록일과 사용개시일 중 빠른 날이다, 고속버스는 시외버스까지 실적 제외인데 고속·시외 모두 한 업종으로 뺐다]
open_questions:
