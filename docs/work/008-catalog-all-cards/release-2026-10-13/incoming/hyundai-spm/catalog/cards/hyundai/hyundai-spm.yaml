schema_version: 2
id: hyundai-spm
issuer: hyundai
name: 현대카드 Summit
short_name: 현대 Summit
search_names: [Summit, 써밋, 현대카드 Summit, 현대카드 서밋]
kind: credit
product_codes: [SPM]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 200000}
  - {scope: global, brand: visa, amount: 200000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/260513_%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81_Summit.pdf', fetched_at: 2026-10-13}
checked_at: 2026-10-13
revisions:
  - effective_from: 2026-05-13
    effective_from_estimated: true
    source: manual
    tiers: [0, 500000, 1000000]
    spend:
      exclude_categories: [annual_fee, gift_card, prepaid_charge, tax, utility.water]
      cancellation: original_month
    new_card: {until: next_month_end, tier: 1000000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [고속도로 통행 요금과 후불하이패스 카드 이용 금액은 적립에서 뺀다, 현대카드의 다른 할인이 적용된 결제는 적립에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 적립에서 뺀다]
    limits:
      - {key: area-5, per: month, amount: 20000}
    stacks:
      - key: main
        pick: priority
        order: [area-5, base-15]
        spill: split
    benefits:
      - key: area-5
        title: 학원·병원·약국·항공·여행사·골프 5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 교육, 병원, 여행, 골프 영역 5% M포인트 적립, '교육 : 학원/유치원 업종', '병원 : 병원/약국 업종', '여행 : 국내 항공사/여행사/특급호텔 업종', '골프 : 골프장/골프연습장 업종', '대상 영역 통합해 월 2만 M포인트 적립 한도 (본인+가족 카드 합산 기준, 적립 한도 초과 시 기본 혜택 적립률 적용)', 추가 혜택은 대상 영역의 국내 가맹점에 한해 제공되며 대상 영역의 해외 가맹점 이용 시 기본 혜택 대상점으로 구분되어 기본 혜택 적용, 추가 혜택 적용 시 기본 혜택은 중복 제공되지 않음]
        target:
          categories: [education.academy, hospital, pharmacy, sports.golf, travel.agency, travel.airline]
        when:
          - {region: domestic}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: area-5}
        tiers: {from: 1000000}
        unmodeled: [특급호텔은 공통 숙박 업종이 모든 호텔을 포함해 담지 않았다, 유치원은 카드사 공통 적립 제외 목록에 있어 담지 않았다, 항공은 국내 항공사만이지만 업종으로는 외국 항공사 국내 결제도 포함될 수 있다, 간편결제·PG·키오스크처럼 별도 가맹점번호로 승인되는 결제는 5%에서 빠지고 1.5%만 준다, 월 적립 한도는 본인과 가족 카드를 합산한다]
        notes: 대상 영역 통합 월 2만 M포인트를 넘으면 1.5%
      - key: base-15
        title: 국내외 가맹점 1.5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 50만원 이상 시 국내외 가맹점 1.5% M포인트 적립, 1회 및 연간 적립 한도 제한 없음, 기본 및 추가 혜택의 경우 매출 건별로 소수점 이하 반올림 후 적립]
        target: {all: true}
        reward: {type: points, program: hyundai_m_point, rate: 1.5, round: round}
        tiers: {from: 500000}
    unmodeled: [연간 보너스 15만원 바우처 또는 20만 M포인트 교환(연 1회)은 발급 첫해 누적 100만원과 2차년도 전년도 1, 200만원 이용 조건이라 계산하지 않는다, 공항 라운지와 발레파킹은 결제 혜택이 아니다, 적립은 매출전표 접수 순서로 한도를 적용한다, 실적과 적립 한도는 본인과 가족 카드를 합산한다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, M 긴급적립을 쓰면 적립 포인트가 상환에 쓰인다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 가이드북 파일 이름의 260513을 시작일로 보았다. 원문에 시행일 문구는 확인하지 못했다, assumed: '2026-05-13'}
notes: 2026-10-13 공식 가이드북 대조. 연회비 국내전용과 국내외겸용(VISA Signature) 200,000원(기본 50,000+제휴 150,000), 가족카드 50,000원. 전월 50만 이상 국내외 1.5% M포인트 무제한, 100만 이상 학원·병원·약국·국내 항공·여행사·골프 5%이고 영역 통합 월 2만 M포인트를 넘으면 1.5%다. 매출 건별 소수점 이하 반올림. 실적 제외는 카드론·연회비·공과금·상품권·선불카드뿐이다. 적립 제외는 카드사 기본에 월세를 더했다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 50만·100만 미만도 혜택을 줘 100만 구간으로 둔다.
