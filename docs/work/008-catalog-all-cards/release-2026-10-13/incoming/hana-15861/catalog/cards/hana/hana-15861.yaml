open_questions:
  - {path: 'revisions[0].spend', question: 취소가 실적에서 빠지는 달. 원문에는 혜택을 매입 취소가 접수된 달에 차감한다는 문구만 있다, assumed: cancel_month}
  - {path: 'revisions[0].benefits', question: 원문은 결제 한 건에 영역 혜택이 여럿 겹칠 때의 처리를 적지 않았다. 한 건에 가장 큰 혜택 하나만 준다, assumed: 가장 큰 혜택 하나}
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 상품 페이지 준법심의 시작일을 잠정 시작일로 둔다., assumed: '2026-07-06'}
  - {path: 'revisions[0].benefits[beauty-pet-5].target', question: 원문 대상은 미용업종이다. 화장품 업종은 넣지 않고 미용실만 넣었다., assumed: 미용실과 동물병원}
notes: 2026-10-13 공식 상품 페이지(준법심의 A-26-2661)에서 옮겼다. 원더카드 2.0의 HAPPY 맞춤 혜택 조합이다. 같은 상품의 LIVING, FREE+, DAILY 조합과 같은 틀이다. 연회비 19,900원(기본 12,000원, 제휴 7,900원). 제휴연회비는 혜택플러스 선택 시 부과된다. 실적은 지난달 1일~말일 승인 기준 국내외 일시불·할부. 전가맹점 0.5%와 간편결제 1.2% 이하로 할인받은 매출은 실적에 들어간다. 무이자 할부 결제는 할인 제외.
