schema_version: 2
id: hana-18394
issuer: hana
name: 하나 더 넥스트 멤버스
short_name: 하나 더 넥스트 멤버스
search_names: [더 넥스트 멤버스, 하나 더 넥스트]
kind: credit
product_codes:
  - '18394'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 25000}
  - {scope: global, brand: visa, amount: 25000}
sources:
  - {id: page, kind: product_page, url: 'https://www.hanacard.co.kr/OPI41000000D.web?CD_PD_SEQ=18394', fetched_at: 2026-10-13, review_no: A-25-0312}
checked_at: '2026-10-13'
revisions:
  - effective_from: 2025-02-17
    effective_from_estimated: true
    source: page
    tiers: [0, 500000, 1000000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 1
    new_card: {until: next_month_end, tier: 500000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, prepaid_charge, rent, tax]
    limits:
      - key: area
        per: month
        amount: {500000: 5000, 1000000: 10000}
    stacks:
      - key: main
        pick: priority
        order: [saving-autopay-10, saving-insurance-10, care-10, life-10, shopping-1, domestic-0-8]
        spill: split
    benefits:
      - key: saving-autopay-10
        title: 관리비·전기·가스 자동이체와 4대보험 10% 하나머니 적립
        source: page
        evidence: ['적립 대상 : 아파트관리비 · 전기요금 · 가스요금 자동이체 / 4대 사회보험료 및 손해보험 업종 결제 건', '10% | 지난달 실적 50만원 이상 100만원 미만 | 5,000 하나머니', '10% | 지난달 실적 100만원 이상 | 10,000 하나머니']
        target:
          categories: [apartment_fee, insurance.social, utility.electricity, utility.gas]
        when:
          - billing: [autopay]
        reward: {type: points, program: hana_money, rate: 10}
        limits:
          - {shared: area}
        tiers: {from: 500000}
        exclude_applied: 1
        unmodeled: [아파트관리비 전기요금 가스요금은 하나카드 자동납부 등록이 가능한 가맹점만 대상이고 관리사무소 일괄 납부 건은 제외된다, 전기요금과 가스요금은 가정용과 일부 영업용만 대상이다]
      - key: saving-insurance-10
        title: 손해보험 10% 하나머니 적립
        source: page
        evidence: ['보험료의 경우 4대 사회보험 (국민연금, 고용보험, 산재보험, 건강보험 자동납부 보험료) 및 손해보험료 (하나손해보험, 삼성화재, 현대해상, DB손해보험, 메리츠화재, 롯데손해보험, 한화손해보험 , 기타 손해보험업종) 결제 건에 한해 서비스가 제공됩니다', '10% | 지난달 실적 50만원 이상 100만원 미만 | 5,000 하나머니']
        target:
          merchants: [hyundai_marine, meritz_fire]
        reward: {type: points, program: hana_money, rate: 10}
        limits:
          - {shared: area}
        tiers: {from: 500000}
        exclude_applied: 1
        unmodeled: [하나손해보험 삼성화재 DB손해보험 롯데손해보험 한화손해보험과 그 밖의 손해보험 업종은 가맹점 목록에 없어 담지 못했다]
      - key: care-10
        title: 병원·약국 10% 하나머니 적립
        source: page
        evidence: ['적립 대상 : 병원, 약국 등 의료 업종 및 대교뉴이프 인지·신체케어', '10% | 지난달 실적 50만원 이상 100만원 미만 | 5,000 하나머니', '의료 업종은 하나카드 가맹점 업종으로 등록된 것을 기준으로 오프라인 결제 건에 한해 서비스가 제공되며, 온라인 결제 및 앱 등을 이용하여 미리 결제하는 방식은 서비스에서 제외됩니다']
        target:
          categories: [hospital, pharmacy]
        when:
          - {channel: offline}
        reward: {type: points, program: hana_money, rate: 10}
        limits:
          - {shared: area}
        tiers: {from: 500000}
        exclude_applied: 1
        unmodeled: [대교뉴이프 인지케어와 신체케어 결제 건은 담지 못했다, 요양병원 요양 보육 복지시설 한약방 동물병원 등 병원과 약국 업종에 들지 않는 의료업은 계산하지 않는다]
      - key: life-10
        title: 영화·티켓 10% 하나머니 적립
        source: page
        evidence: ['적립 대상 : 인터파크티켓, YES24, CGV, 롯데시네마, 메가박스', '10% | 지난달 실적 50만원 이상 100만원 미만 | 5,000 하나머니', 인터파크티켓 및 YES24는 공식 홈페이지/앱을 통한 결제 건에 한하여 서비스가 제공됩니다]
        target:
          merchants: [cgv, interpark_ticket, lotte_cinema, megabox, yes24_ticket]
        reward: {type: points, program: hana_money, rate: 10}
        limits:
          - {shared: area}
        tiers: {from: 500000}
        exclude_applied: 1
        unmodeled: [공식 홈페이지와 앱 또는 영화관 오프라인 결제만 대상이고 구매대행 사이트와 온라인 쇼핑몰 관람권과 외부 사이트 결제는 제외된다]
      - key: shopping-1
        title: 마트·쿠팡·네이버쇼핑 1% 하나머니 적립
        source: page
        evidence: ['적립 대상 : 마트 및 슈퍼마켓 업종, 쿠팡, 네이버쇼핑', 1% | 없음 | 없음, '마트 및 슈퍼마켓 업종은 하나카드에 등록된 가맹점 업종 기준으로 오프라인 결제 건에 한해 서비스가 제공되며, 창고형 할인매장과 상설 임대매장은 서비스에서 제외됩니다']
        target:
          categories: [grocery_mart]
          merchants: [coupang, naver_plus_store]
          exclude_merchants: [costco, traders]
        reward: {type: points, program: hana_money, rate: 1}
        exclude_applied: 1
        unmodeled: [마트와 슈퍼마켓은 오프라인 결제만 대상이다. 앱은 업종 기준으로 계산하므로 온라인 마트 결제가 섞일 수 있다, 상설 임대매장은 제외된다, 쿠팡과 네이버쇼핑은 공식 홈페이지 결제만 대상이고 상품권 여행 항공권 티켓 도서 공연 매출은 제외된다]
      - key: domestic-0-8
        title: 국내 가맹점 0.8% 하나머니 적립
        source: page
        evidence: [0.8% | 없음 | 없음, '더 넥스트 특화 서비스 영역별 월 적립한도 초과 시, 국내 가맹점 기본 적립률 0.8% 적용됩니다']
        target: {all: true}
        when:
          - {region: domestic}
        reward: {type: points, program: hana_money, rate: 0.8}
        exclude_applied: 1
    unmodeled: [가족카드의 지난달 실적과 적립 한도는 본인카드와 합산한다, 적립 대상이 겹치면 적립률이 높은 서비스 하나만 준다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 카드 출시일을 잠정 시작일로 둔다., assumed: '2025-02-17'}
  - {path: 'revisions[0].limits[area]', question: 'SAVING, CARE, LIFE 표마다 월 통합 적립 한도가 적혀 있고 안내문에는 영역별 월 적립한도라고도 적혀 있다. 영역마다 따로인지 하나를 함께 쓰는지 불명확하다.', assumed: 세 영역이 한도 하나를 함께 쓴다}
  - {path: 'revisions[0].spend', question: 실적 제외에 서비스(할인/적립) 받은 전체 매출 제외와 SAVING CARE LIFE 적립 받은 매출 제외가 함께 적혀 있다. 0.8%와 1% 적립 매출도 제외인지 불명확하다., assumed: 적립 받은 매출은 모두 실적에서 제외}
  - {path: 'revisions[0].spend.exclude_categories', question: '원문은 수도/전기요금과 그 외 공과금, 도시가스를 실적에서 뺀다고 적었다. 업종 하나로 맞춰 utility 전체를 뺐다.', assumed: utility 전체}
notes: 2026-10-13 공식 상품 페이지(준법심의 A-25-0312)에서 옮겼다. 연회비 국내전용과 VISA 본인 25,000원. 하나머니 소수점 이하는 원문에 없어 원 미만 버림으로 본다. 최초 사용 등록일부터 다음 달 말일까지는 지난달 실적이 50만원 미만이어도 50만원 이상 100만원 미만 기준으로 준다.
