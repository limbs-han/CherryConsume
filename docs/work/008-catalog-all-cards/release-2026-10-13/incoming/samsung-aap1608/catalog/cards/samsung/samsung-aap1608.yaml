schema_version: 2
id: samsung-aap1608
issuer: samsung
name: 라이프파트너 삼성카드
short_name: 라이프파트너 삼성
search_names: [라이프파트너 삼성, 라이프파트너카드, 삼성 라이프파트너]
kind: credit
product_codes: [AAP1608]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
  - {scope: global, brand: mastercard, amount: 20000}
sources:
  - {id: page, kind: product_page, url: 'https://www.samsungcard.com/home/card/cardinfo/PGHPPCCCardCardinfoDetails001?code=AAP1608', fetched_at: 2026-10-13}
  - {id: manual, kind: manual_pdf, url: 'https://www.samsungcard.com/filedownload.do?grpNo=1zPVy1PuFbwGC7xZyM4qtvNgbhGvgGcxfEIhXg67blo%3D&sn=1', fetched_at: 2026-10-13, review_no: 제2019-C1a-03321호}
checked_at: '2026-10-13'
revisions:
  - effective_from: '2022-08-01'
    effective_from_estimated: true
    source: manual
    tiers: [0, 400000, 700000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, taxi, transit.bus_city, transit.subway, utility]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 400000, from: issue}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [다이어트할부와 삼성카드 할인이 적용된 일시불·할부 이용금액은 할인하지 않는다]
    limits:
      - key: fuel
        per: month
        count: {400000: 1, 700000: 2}
      - key: mart
        per: month
        count: {400000: 1, 700000: 2}
      - key: medical
        per: month
        count: {400000: 1, 700000: 2}
    benefits:
      - key: insurance-monthly
        title: 보험료 월 3,000원·5,000원 할인
        source: manual
        evidence: ['보험료 10,000원 이상 결제 시 월 3,000원·5,000원 결제일할인', '업종 보험 생명보험, 손해보험', '전월 이용금액대별 40만원 이상 3,000원, 70만원 이상 5,000원', 통합 월 할인횟수 1회, 발급월+1개월까지는 전월 이용금액 40만원 미만 시에도 40만원 이상~70만원 미만 구간의 할인금액이 제공]
        target:
          categories: [insurance.private]
        when:
          - amount: {min: 10000}
        reward:
          type: billing_discount
          fixed: {400000: 3000, 700000: 5000}
        limits:
          - {per: month, count: 1}
        tiers: {from: 400000}
      - key: fuel-3000
        title: 주유 3만원 이상 3,000원 할인
        source: manual
        evidence: ['주유소에서 30,000원 이상 결제 시 3,000원 결제일할인', 업종 주유 모든 주유소, '전월 이용금액대별 통합 월 할인횟수 40만원 이상 1회, 70만원 이상 2회', LPG충전소도 포함]
        target:
          categories: [fuel]
        when:
          - amount: {min: 30000}
        reward: {type: billing_discount, fixed: 3000}
        limits:
          - {shared: fuel}
        tiers: {from: 400000}
      - key: mart-2000
        title: 할인점 3만원 이상 2,000원 할인
        source: manual
        evidence: ['할인점에서 30,000원 이상 결제 시 2,000원 결제일할인', '할인점 이마트, 이마트 트레이더스, 롯데마트, 홈플러스', '전월 이용금액대별 통합 월 할인횟수 40만원 이상 1회, 70만원 이상 2회', '온라인몰도 포함되며, 기업형 슈퍼마켓, 쇼핑 외 결제건(상품권, 주차장 등), 할인점 내 임대매장은 제외']
        target:
          merchants: [emart, homeplus, lotte_mart, traders]
        when:
          - amount: {min: 30000}
        reward: {type: billing_discount, fixed: 2000}
        limits:
          - {shared: mart}
        tiers: {from: 400000}
        unmodeled: [쇼핑 외 결제(상품권, 주차장 등)와 할인점 내 임대매장은 할인하지 않는다]
      - key: medical-1000
        title: 의료 3천원 이상 1,000원 할인
        source: manual
        evidence: ['의료비 3,000원 이상 결제 시 1,000원 결제일할인', '업종 의료 병/의원, 약국', '전월 이용금액대별 통합 월 할인횟수 40만원 이상 1회, 70만원 이상 2회', 오프라인 일반 결제건에 한해 혜택이 제공, '요양병원, 보건소, 동물병원은 제외']
        target:
          categories: [hospital, pharmacy]
        when:
          - {channel: offline}
          - amount: {min: 3000}
        reward: {type: billing_discount, fixed: 1000}
        limits:
          - {shared: medical}
        tiers: {from: 400000}
        unmodeled: [요양병원과 보건소는 할인하지 않는다]
      - key: movie-5000
        title: 영화 1만2천원 이상 5,000원 할인
        source: manual
        evidence: ['영화 티켓 12,000원 이상 결제 시 5,000원 결제일할인', '영화 CGV, 롯데시네마, 메가박스', 통합 월 할인횟수 1회, 오프라인 일반 결제 및 공식 홈페이지·앱을 통한 결제건에 한해 혜택이 제공, 전월 이용금액 40만원 이상 시 제공]
        target:
          merchants: [cgv, lotte_cinema, megabox]
        when:
          - amount: {min: 12000}
        reward: {type: billing_discount, fixed: 5000}
        limits:
          - {per: month, count: 1}
        tiers: {from: 400000}
    unmodeled: [할인과 실적은 승인 시점 기준이다, 삼성카드의 다른 결제일할인 혜택과 겹치면 할인 금액이 큰 것 하나만 준다, 보험사 정책에 따라 신용카드로 보험료 납부가 제한될 수 있다, '보험료 결제 시 건별 30만원 이상 10,000원 60만원 이상 20,000원을 주는 보험료 연 할인은 연 기준이 발급월 포함 12개월이라 담지 않았다. 이 할인을 받는 첫 결제 이후에는 월 3,000원·5,000원 할인으로 넘어간다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품안내장 판(2022.8)의 첫날로 두었다. 출시일은 2019-06-05다, assumed: '2022-08-01'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통 범위가 적혀 있지 않아 시내버스와 지하철로 두었다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-13 상품안내장(2022.8판, 심의필 2019-C1a-03321호) 대조. 출시 2019-06-05. 연회비 해외겸용 Mastercard·국내전용 모두 20,000원(기본 7,000+제휴 13,000). 보험료 월 할인과 주유, 할인점, 의료는 전월 이용금액 40만원 구간 1회, 70만원 구간 2회이고 영화는 월 1회다. 실적 제외는 4대보험, 국세·지방세·공과금, 대학 등록금, 대중교통, 택시, 아파트 관리비, 기프트·선불카드, 상품권이다. 발급월+1개월까지는 40만 구간 혜택.
