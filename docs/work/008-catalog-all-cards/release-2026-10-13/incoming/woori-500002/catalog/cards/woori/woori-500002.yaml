notes: 2026-10-13 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2026-03-20. 연회비 없음. 기본 국내외 0.2% 실적·한도 없음. 전월 국내외 30만 이상 특별캐시백 온라인쇼핑·TV홈쇼핑·생활편의·건강의료 0.5% 통합 월 1만원, 보험·레저·주유 1% 통합 월 2만원. 특별과 기본은 한 결제에 하나만이고 큰 쪽을 준다. 한도를 넘은 다음 결제부터 기본 0.2%.
