  - {path: status, question: 상품 페이지가 자바스크립트로 그려져 판매 상태를 다시 확인하지 못해 색인 값 on_sale을 두었다, assumed: on_sale}
  - {path: 'revisions[0].benefits', question: 할인 혜택이 서로 중복 적용되지 않고 큰 금액만 적용된다는 문구를 한 묶음에 큰 쪽 하나만 주는 것으로 옮겼다. 한도가 따로인 항목은 한도를 각각 두었다, assumed: pick best}
notes: 2026-10-13 상품안내장(2021.10판, 심의필 제2021-C1a-08774호) 확인. 2021-09-15 출시. 연회비 해외겸용 Mastercard 20,000원. 아울렛 10%, 이마트 계열 7%, 커피·제과 10%, 배달앱 10%는 전월 40만원 이상일 때 월 한도가 구간별이고 간편결제 1%와 해외 1.5%는 실적 없이 받는다. 실적 제외는 4대보험, 공과금, 초중고 납입금, 등록금, 대중교통, 택시, 아파트 관리비, 임대료, 기프트·선불카드, 상품권이다. 상품안내장이 2021년판이라 이후 개정은 확인하지 못했다.
