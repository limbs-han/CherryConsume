open_questions:
  - {path: 'revisions[0].effective_from', question: 준법심의일 2026-02-12를 현재 규칙의 시작일로 보았다. 원문에 시행일은 없다, assumed: '2026-02-12'}
  - {path: 'revisions[0].spend', question: '원문은 수도/전기요금, 그외 공과금, 도시가스를 실적에서 뺀다. 공과금 범위를 단정할 수 없어 utility 전체를 뺐다', assumed: utility 전체}
notes: 2026-10-13 공식 상품 페이지에서 옮겼다. 연회비 17,000원. 혜택 받은 매출을 실적에서 빼는 문구는 없다. 지난달 실적은 1일부터 말일 승인 기준이다. 후불교통 같은 무승인 거래는 매출 접수월 이용금액에 넣는다.
