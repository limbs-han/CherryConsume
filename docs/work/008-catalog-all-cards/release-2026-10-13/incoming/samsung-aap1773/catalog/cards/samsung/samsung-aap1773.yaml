notes: 2026-10-13 상품안내장(2022.9판, 심의필 2022-C1a-07471호) 대조. 연회비 해외겸용 Mastercard 15,000원(기본 7,000+제휴 8,000), 국내전용 없음. 후불교통 기능 탑재. 동물병원 30% 혜택이 제공된 이용금액은 실적에서 뺀다. 발급월+1개월까지는 전월 40만원 미만이어도 40만원 구간 혜택을 준다. 삼성카드의 다른 결제일할인과 겹치면 큰 것 하나만 준다.
