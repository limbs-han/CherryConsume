  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통요금·후불 기후동행카드 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
