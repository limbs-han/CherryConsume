schema_version: 2
id: kb-09270
issuer: kb
name: KB국민 올라운드카드
short_name: KB 올라운드
kind: credit
product_codes:
  - '09270'
status: on_sale
annual_fees:
  - {scope: global, brand: k_world_jcb, amount: 15000}
  - {scope: global, brand: mastercard, amount: 15000}
  - {scope: global, brand: k_world_jcb, form: mobile, amount: 9000}
  - {scope: global, brand: mastercard, form: mobile, amount: 9000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=09270', fetched_at: '2026-10-12', review_no: 제2020-C1a-09396호}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2026-10-12'
    effective_from_estimated: true
    source: page
    tiers: [0, 400000, 800000, 1200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [PG 전용 가맹점 결제와 호텔·백화점·대형마트·철도역사 입점 가맹점은 할인에서 빠질 수 있다]
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 본인 명의로 발급받았나요? 가족카드만 발급받은 경우는 아니요를 고르세요.'}
    options:
      - key: select
        title: 선택 할인서비스
        choices:
          - {key: fuel, title: 주유소·충전소 리터당 100원}
          - {key: store, title: 대형마트·편의점·커피·약국 5%}
        default: null
        change: next_month
    limits:
      - key: store
        per: month
        amount: {0: 10000, 400000: 10000, 800000: 30000, 1200000: 50000}
    stacks:
      - {key: main, pick: best}
      - {key: base, pick: best}
    benefits:
      - key: pointree-0-8
        title: 국내외 가맹점 0.8% 포인트리 적립
        source: page
        evidence: [국내 및 해외 전 가맹점 0.8% 적립, 전월 실적조건 및 적립한도 없음, '적립 서비스 제외 대상 취소금액, 무이자할부, 단기카드대출(현금서비스), 장기카드대출(카드론), 각종 세금 및 공과금, 전기/수도, 아파트관리비, 정부지원금, 대학(대학원)등록금, 초/중/고등학교(국/공립)납입금, 각종 수수료 및 이자, 연체료, 연회비, 상품권 및 선불카드(선불전자지급수단포함) 구입/충전금액', 포인트리 1점은 1원과 가치가 동일합니다.]
        target:
          exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, tax, utility]
          all: true
        reward: {type: points, program: kb_pointree, rate: 0.8}
        stack: base
        unmodeled: [정부지원금 결제는 적립에서 빠진다]
      - key: select-fuel-100
        title: '[선택] 주유소·충전소 리터당 100원 청구할인'
        source: page
        evidence: [택1 전 주유소 리터당 100원 청구할인(충전소 포함), 리터당 100원 | 1만원 | 3만원 | 5만원, 40만원 이상 80만원 미만 | 80만원 이상 120만원 미만 | 120만원 이상, 할인 금액 산정방법= 주유이용금액 X (리터당 할인금액(100원)/기준유가), '기준유가 : GS칼텍스 고시 휘발유가 기준', 최초 카드 사용등록일로부터 다음 달 말일(실적 유예기간)까지 올라운드카드 이용실적이 없는 경우에도 ‘ 40만원 이상 ’ 에 해당하는 서비스가 제공됩니다., 올라운드카드 ‘선택 할인서비스’ 를 받은 이용건(해당 매출 전체)]
        target:
          categories: [fuel]
        when:
          - option:
              select: [fuel]
        reward: {type: billing_discount, per_liter: 100}
        limits:
          - per: month
            amount: {0: 10000, 400000: 10000, 800000: 30000, 1200000: 50000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        exclude_applied: 1
        unmodeled: [리터는 GS칼텍스 고시 휘발유가로 환산하고 경유·등유·LPG도 휘발유가로 환산한다. 앱은 공통 기름값 기준값으로 환산한다]
      - key: select-store-5
        title: '[선택] 편의점·커피·약국 5% 청구할인'
        source: page
        evidence: [택2 스토어(대형마트·편의점·커피전문점·약국) 5% 청구할인, 5% | 1만원 | 3만원 | 5만원, '편의점(GS25,CU)', '커피전문점:커피/음료전문점 업종(KB국민카드 업종분류 기준)', '약국: 약국 업종(KB국민카드 업종분류 기준)', '편의점,커피전문점,약국 이용 시 유의사항: 백화점, 대형마트, 호텔/콘도 등 대형시설 입점 점포로서 해당 대형시설의 가맹점번호를 사용하는 매장의 경우 할인 대상에서 제외될 수 있음']
        target:
          categories: [cafe, pharmacy]
          merchants: [cu, gs25]
        when:
          - option:
              select: [store]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: store}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        exclude_applied: 1
        unmodeled: [백화점·대형마트·호텔 같은 대형시설 가맹점번호를 쓰는 편의점·커피전문점·약국은 할인에서 빠질 수 있다]
      - key: select-mart-5
        title: '[선택] 이마트·롯데마트·홈플러스 5% 청구할인'
        source: page
        evidence: [택2 스토어(대형마트·편의점·커피전문점·약국) 5% 청구할인, 5% | 1만원 | 3만원 | 5만원, '대형마트(이마트, 롯데마트, 홈플러스)', '온라인 쇼핑몰, 상품권 구매 및 건물 내 입점매장, SSM(이마트 에브리데이, 홈플러스 익스프레스, 롯데슈퍼) 및 해당 마트와 상이한 별도의 가맹점으로 승인 처리되는 마트 내 입점 매장 이용금액은 서비스 제외']
        target:
          merchants: [emart, homeplus, lotte_mart]
        when:
          - option:
              select: [store]
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: store}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        exclude_applied: 1
        unmodeled: [대형마트 안 입점 매장은 할인에서 빠진다]
    unmodeled: [월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 해외 이용금액은 매입 완료일 기준으로 실적 달을 나누고 일시불만 센다, '정부지원금과 무승인전표(자판기, 터널통행료, 항공기내 이용)는 실적에서 빠진다', 할인 한도는 이용 순서대로 채운다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2018.10.30 출시만 적었다. 현재 규칙 시작일을 몰라 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-12'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통요금) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-12 KB국민카드 상품 페이지로 대조했다. 선택 할인서비스 두 가지 중 하나를 고른다. 선택 할인을 받은 결제는 금액 전체가 실적에서 빠지고 0.8% 적립은 실적과 관계없다. 원문의 초중고 국공립 납입금 제외는 덜 주는 쪽으로 초중고 납입금 전체를 뺐다.
