          merchants: [cgv, lotte_cinema, megabox]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 4000}
        limits:
          - {per: month, count: 1}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: [예매대행 사이트 결제는 제외, 연 12회 한도는 월 1회로 이미 지켜진다]
      - key: coffee-10
        title: 주요 커피전문점 10% 청구할인
        source: page
        evidence: ['카페/외식: 스타벅스, 커피빈, 카페베네, 탐앤탐스, 엔제리너스, 투썸플레이스, 할리스, 달.콤 10% 할인', '통합 1일 1회, 월 2회, 1회 1만원 한도', 백화점·아울렛 입점 매장 제외]
        target:
          merchants: [angel_in_us, cafe_bene, coffee_bean, dalkomm, hollys, starbucks, tom_n_toms, twosome]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 10000}
          - {per: day, count: 1}
          - {per: month, count: 2}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: [백화점과 아울렛 입점 매장은 제외]
    unmodeled: [놀이공원 할인과 금융우대는 계산하지 않는다, 가족카드 실적은 본인과 합산하지 않는다, 간편결제 결제는 할인이 제공되지 않을 수 있다]
open_questions:
  - {path: 'revisions[0].source', question: 상품 페이지에 연회비 금액이 적혀 있지 않아 연회비 칸을 비웠다, assumed: 연회비 없음으로 표시하지 않음}
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시작일을 찾지 못해 수집한 날로 두었다, assumed: '2026-10-13'}
  - {path: 'revisions[0].limits[0]', question: 통합할인한도가 후불교통 할인에도 걸리는지 원문이 분명하지 않아 걸리는 쪽으로 두었다, assumed: shared integrated}
notes: 2026-10-13 expand21 조사. 한도는 전월 30만원 5천원과 50만원 1만원이다. 놀이공원과 금융우대는 한도 밖이다
