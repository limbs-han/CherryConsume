        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - billing: [postpaid_transit]
        reward: {type: billing_discount, fixed: 100}
        limits:
          - {per: month, amount: 1000}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: [환승 결제는 횟수에서 빠진다]
      - key: convenience-5
        title: 편의점·올리브영 5% 청구할인
        source: page
        evidence: ['쇼핑/미용: GS25, CU, 세븐일레븐, 올리브영 5% 할인', '통합 1일 1회, 월 2회, 1회 1만원 한도']
        target:
          merchants: [cu, gs25, olive_young, seven_eleven]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: txn, base: 10000}
          - {per: day, count: 1}
          - {per: month, count: 2}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: online-10
        title: 쿠팡·티몬·위메프 10% 청구할인
        source: page
        evidence: ['쇼핑/미용: 쿠팡, 티몬, 위메프 10% 할인', '통합 1일 1회, 월 2회, 1회 1만원 한도']
        target:
          merchants: [coupang, tmon, wemakeprice]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 10000}
          - {per: day, count: 1}
          - {per: month, count: 2}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: movie-4000
        title: CGV·롯데시네마·메가박스 4천원 청구할인
        source: page
        evidence: ['공연/문화: CGV, 롯데시네마, 메가박스 4,000원 할인', '현장·온라인 예매, 통합 월 1회·연 12회, 건당 1만원 이상 결제, 예매대행 사이트 제외']
