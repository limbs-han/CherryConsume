notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-12-06. 연회비 국내전용 10,000원, Mastercard·VISA 12,000원. 전월 국내 30만 이상 적립. 기본 국내 0.8%, 특별 이동통신 자동납부·대중교통 5%, 커피·영화 3%, 백화점·대형마트·온라인쇼핑·주유·해외 1%, 주요 간편결제 3% 추가. 특별·추가 통합 월 1만/2만/5만원. 결제건당 1만원 미만은 적립 제외. 상품 코드 834629 페이지는 혜택이 같은 상품이라 이 카드로 등록한다.
