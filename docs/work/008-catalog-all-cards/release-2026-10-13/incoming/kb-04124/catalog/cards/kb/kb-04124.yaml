        target:
          categories: [taxi, transit.rail]
        when:
          - option:
              pack: [a]
            amount: {min: 5000}
        reward: {type: cashback, rate: 20}
        limits:
          - {per: month, amount: 2000}
        tiers: {from: 200000}
