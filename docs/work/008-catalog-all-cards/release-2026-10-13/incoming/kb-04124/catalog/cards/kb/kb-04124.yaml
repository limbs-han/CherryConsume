    benefits:
      - key: a-ott-50
        title: '[A팩] 넷플릭스·유튜브 프리미엄·티빙·스포티파이 50% 할인'
        source: page
        evidence: ['OTT 넷플릭스, 유튜브, 티빙, 스포티파이 50% 5,000원', '[OTT] 공식 홈페이지를 통한 정기결제 이용권에 한함 (인앱결제, 단건 결제, 포인트 및 캐시 충전 등은 제외)', 유튜브는 유튜브 프리미엄 멤버십 결제 건에 한함]
        target:
          merchants: [netflix, spotify, tving, youtube_premium]
        when:
          - billing_not: [in_app]
            option:
              pack: [a]
        reward: {type: cashback, rate: 50}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 200000}
        unmodeled: [정기결제 이용권만 할인하고 단건 결제와 캐시 충전은 빠진다]
      - key: a-app-30
        title: '[A팩] 구글 플레이스토어·애플 앱스토어 30% 할인'
        source: page
        evidence: ['APP 구글 플레이스토어, 애플 앱스토어 (건당 5,000원 이상 이용시) 30% 5,000원']
        target:
          merchants: [app_store, google_play]
        when:
          - option:
              pack: [a]
            amount: {min: 5000}
        reward: {type: cashback, rate: 30}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 200000}
      - key: a-pcroom-20
        title: '[A팩] PC방 20% 할인'
        source: page
        evidence: ['여가 노래방, PC방(건당 5,000원 이상 이용시) 20% 2,000원', '[여가] 노래방 및 비디오방/게임방 업종 결제 건에 한함']
        target:
          categories: [pc_room]
        when:
          - option:
              pack: [a]
            amount: {min: 5000}
        reward: {type: cashback, rate: 20}
        limits:
          - {per: month, amount: 2000}
        tiers: {from: 200000}
        unmodeled: [노래방도 같은 한도로 할인하지만 업종이 없어 담지 않았다]
      - key: a-taxi-rail-20
        title: '[A팩] 택시·철도 20% 할인'
