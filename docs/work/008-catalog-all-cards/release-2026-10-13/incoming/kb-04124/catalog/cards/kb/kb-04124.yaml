        evidence: ['편의점 GS25, CU에서 KB Pay로 결제 시 20% 2,000원', '[편의점] 오프라인 매장에서 KB Pay로 이용 시 제공 백화점, 대형마트 등 일부 입점 매장 제외']
        target:
          merchants: [cu, gs25]
        when:
          - channel: offline
            payment: [kb_pay]
            option:
              pack: [a, b]
        reward: {type: cashback, rate: 20}
        limits:
          - {per: month, amount: 2000}
        tiers: {from: 200000}
        notes: A팩과 B팩에 같은 편의점 혜택이 있어 하나로 두었다
      - key: a-movie-4000
        title: '[A팩] CGV·메가박스·롯데시네마 4천원 할인'
        source: page
        evidence: ['영화관 CGV, 메가박스, 롯데시네마 (건당 15,000원 이상 이용시) 4,000원 4,000원(1회)', '[영화관] 공식 홈페이지/모바일 앱 및 영화관 현장 결제건에 한함 (단, 매점, 관람권(상품권) 구입, 예매대행사이트는 제외)']
