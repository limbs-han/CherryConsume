notes: 2026-10-13 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-07-05. 본인카드 연회비 2,500,000원 가족카드 500,000원. 국내외 2% 모아포인트 전월실적 조건 없음 월 이용금액 1억원까지. 1모아포인트는 1원. 별도 자격기준 심사로 발급한다.
