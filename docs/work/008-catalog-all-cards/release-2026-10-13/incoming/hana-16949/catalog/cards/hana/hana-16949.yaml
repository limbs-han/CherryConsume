open_questions:
  - {path: 'revisions[0].effective_from', question: 준법심의 기간 시작일 2026-07-06을 현재 규칙의 시작일로 보았다. 원문에 시행일은 없다, assumed: '2026-07-06'}
  - {path: 'revisions[0].spend', question: 원문 실적 제외의 수도요금과 공과금 범위를 단정할 수 없어 utility 전체를 뺐다, assumed: utility 전체}
  - {path: 'revisions[0].stacks', question: '2% 업종 할인, 5% 간편결제 할인, 0.5% 기본 할인이 겹치는지 원문에 없다. 결제 하나에 가장 큰 하나만 받는 것으로 두었다', assumed: 가장 큰 하나}
notes: 2026-10-13 공식 상품 페이지에서 옮겼다. 연회비 19,900원은 기본 12,000원에 혜택플러스 제휴연회비 7,900원을 더한 값이다. 사용자가 하나페이에서 조합을 바꿀 수 있다. 서비스 받은 매출은 실적에서 빠지되 기본 0.5%만 받은 매출은 실적에 남는다.
