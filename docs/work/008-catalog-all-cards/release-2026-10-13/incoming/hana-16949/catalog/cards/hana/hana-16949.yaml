        evidence: [할인대상 하나페이 모든결제 5%, 지난달 실적 40만원 이상 80만원 미만 4000원 80만원 이상 120만원 미만 6000원 120만원 이상 10000원]
        target: {all: true}
        when:
          - payment: [hana_pay]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: pay-month}
        tiers: {from: 400000}
        exclude_applied: 1
