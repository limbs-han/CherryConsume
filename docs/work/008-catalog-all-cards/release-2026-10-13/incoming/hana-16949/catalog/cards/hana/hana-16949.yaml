        title: 간편결제 온라인 5% 청구할인
        source: page
        evidence: ['삼성페이, 네이버페이, 카카오페이, SSG페이, 페이코, 쿠페이, 11 pay에 카드를 등록하여 온라인 가맹점에서 결제하는 건 5%', 하나페이를 제외한 다른 간편결제 시 오프라인 가맹점에서의 결제는 서비스에서 제외, 지난달 실적 40만원 이상 80만원 미만 4000원 80만원 이상 120만원 미만 6000원 120만원 이상 10000원]
