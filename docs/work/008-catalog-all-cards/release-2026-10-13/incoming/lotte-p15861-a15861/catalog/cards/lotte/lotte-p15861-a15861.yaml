        source: manual
        evidence: ['편의점 세븐일레븐, GS25, CU, 이마트24 10% 5,000원 7,000원 10,000원', '오프라인 결제 건에 한하여 혜택이 제공되며, 온라인(간편결제 등) 결제건은 적용 제외 됩니다.']
        target:
          merchants: [cu, emart24, gs25, seven_eleven]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 7000, 1500000: 10000}
        tiers: {from: 500000}
      - key: shopping-10
        title: 쿠팡·네이버스마트스토어·올리브영·다이소·무신사 10% 결제일 할인
        source: manual
        evidence: ['쇼핑 쿠팡, 네이버스마트스토어, 올리브영, 다이소, 무신사 10% 5,000원 7,000원 10,000원', '올리브영, 다이소, 무신사 결제 시 입점매장(대형마트 할인점, 지하철 역사, 휴게소 등) 이용금액은 혜택이 제공되지 않습니다.']
        target:
          merchants: [coupang, daiso, musinsa, naver_plus_store, olive_young]
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 7000, 1500000: 10000}
        tiers: {from: 500000}
    unmodeled: ['YBM 할인 대상 가운데 TOEIC 접수와 YBM NET만 공통 가맹점에 있어 넣었다. YBM어학원, YBM인강, YBM연수원, YBM유학센터, YBM ECC, YBM잉글루 등은 가맹점이 없어 계산하지 않는다', 할인받은 YBM 이용금액은 실적에서 빠진다, PG나 간편결제 가맹점으로 접수된 결제는 할인에서 빠진다, '네이버스마트스토어는 다른 간편결제에 등록한 네이버페이 결제와 네이버 디지털콘텐츠(네이버웹툰, 시리즈온, MYBOX 등) 결제가 빠진다', '올리브영, 다이소, 무신사의 대형마트·지하철 역사·휴게소 입점매장은 할인하지 않는다', '오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 정부지원금, TV 수신료, 포인트 충전, 고속도로 통행요금, 무승인전표, 기후동행카드 충전, 벌금·과태료·민원 발급 수수료·관세·인지세·송달료, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', YBM X 디지로카가 아닌 롯데카드 이용금액은 실적에 넣지 않는다, 롯데카드의 다른 결제일 할인과 겹치면 할인금액이 큰 혜택 하나만 준다, 할인은 승인 시점 기준 남은 한도 안에서 준다]
notes: 2026-10-12 상품설명서(2026년 4월 기준) 대조. 출시일 2026-04-24. 판매 카드 목록에 디자인만 다른 P15861-A15861(블랙)과 P15862-A15862(데님)이 있어 한 파일에 두 코드를 넣었다. 공시 색인 id lotte-1957을 상품 코드 id로 바꿨다. 영역별 월 한도는 표에 줄마다 따로 적혀 있어 따로 두었다. 신규 발급 특례는 사용 등록월부터 다음 달 말일까지 50만 구간이다.
