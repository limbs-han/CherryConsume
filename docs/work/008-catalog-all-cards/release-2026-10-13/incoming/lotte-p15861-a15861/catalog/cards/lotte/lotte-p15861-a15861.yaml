    benefits:
      - key: ybm-20
        title: YBM 20% 결제일 할인
        source: manual
        evidence: ['YBM 20% 7,000원 12,000원 35,000원', 'YBM 주관 어학시험 및 IT시험(TOEIC, TOEIC Speaking Test, JPT, MOS 등), YBM연수원, YBM어학원, ... YBM인강 ...', 롯데카드에 YBM 계열사 또는 가맹으로 등록된 가맹점 기준으로 혜택이 제공됩니다.]
        target:
          merchants: [toeic, ybm_net]
        reward: {type: billing_discount, rate: 20}
        limits:
          - per: month
            amount: {500000: 7000, 1000000: 12000, 1500000: 35000}
        tiers: {from: 500000}
        exclude_applied: 1
      - key: convenience-10
