open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 카드 출시일을 잠정 시작일로 둔다., assumed: '2016-04-18'}
  - {path: 'revisions[0].spend.exclude_categories', question: '원문은 지역쇼핑과 주유 가맹점 이용금액, 공과금, 도시가스를 실적에서 뺀다고 적었다. 지역쇼핑 가맹점을 업종으로 가릴 수 없어 백화점과 마트 업종 전체를, 공과금은 utility 전체를 뺐다.', assumed: 백화점 마트 주유 utility 전체}
  - {path: 'revisions[0].benefits[life-transit-money]', question: 통신 교통 자동이체 적립은 영역 이용금액을 합쳐 10만원마다 주는지 원문에 영역별 합산 방법이 없다., assumed: 자동이체와 교통을 따로 합산}
notes: 2026-10-13 공식 상품 페이지(준법심의 A-26-0740)에서 옮겼다. 연회비 국내전용 8,000원, 국내외겸용 10,000원. 하나머니 1하나머니 1원. 영역별 이번 달 합산 이용금액이 10만원이 될 때마다 5천 하나머니이고 국내 적립은 월 최대 4만 하나머니다. 지역쇼핑과 주유는 적립을 받지 못해도 지난달 실적에서 빠진다.
