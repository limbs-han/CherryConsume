      - key: co-lease-discount
        title: 코웨이 렌탈료 자동납부 결제일 할인
        source: manual
        evidence: ['40만원 이상 8,000원', '80만원 이상 12,000원', '160만원 이상 24,000원', 코웨이 롯데카드로 코웨이 렌탈료 자동 납부 연결시에만 결제일 할인 혜택을 받으실 수 있습니다., 렌탈료가 렌탈료 할인 한도보다 적을 경우 렌탈료 만큼만 할인됩니다., 지난달 이용금액이 40만원 미만인 경우는 결제일 할인이 되지 않습니다., '코웨이 롯데카드를 최초 발급한 경우 카드발급일로부터 다음 달 말일까지 이용 실적에 관계없이 8,000원 렌탈료 할인 한도가 제공됩니다.']
        target:
          merchants: [coway_rental]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {400000: 8000, 800000: 12000, 1600000: 24000}
        tiers: {from: 400000}
    unmodeled: [코웨이 24·36개월 장기 할부 이용금액은 실적에서 빠지지만 결제 입력으로 가려내지 않는다. 장기 할부를 기록하면 실적이 실제보다 크게 잡힐 수 있다, '장기 할부 캐시백 8,000·12,000·24,000원은 할부 이용 다음 달부터 36개월차까지 매월 26일 지급이라 계산하지 않는다. 렌탈료 할인과 함께 쓰면 캐시백이 우선이고 렌탈료 할인은 없다', 롯데카드의 다른 결제일 할인과 겹치면 할인 금액이 큰 혜택 하나만 준다, '공공기관 개설 가맹점, 정부지원금, TV 수신료, 오토·스마트 캐시백과 오토·할부서비스 이용금액, 하이패스 충전과 이용금액, 고속도로 통행요금, 무승인전표, 벌금·과태료·민원 발급 수수료·관세·인지세·송달료, 기후동행카드 충전과 결제, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', 코웨이 롯데카드가 아닌 다른 롯데카드 이용금액은 실적에 넣지 않는다, 할인은 승인 시점 기준 남은 한도 안에서 준다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 설명서는 2026년 6월 기준이라 카드 출시일을 시행일로 두었다, assumed: '2026-06-19'}
notes: 2026-10-12 상품설명서(2026년 6월 기준, 여신금융협회 심의필 제2026-C1a-09996호) 대조. 쿠쿠 X LOCA(lotte-1858)와 같은 짜임으로 옮겼다. 렌탈료가 한도보다 적으면 렌탈료만큼 할인이라 100% 할인에 월 한도로 적었다. 신규 발급 특례는 발급일부터 다음 달 말일까지 8,000원 한도라 40만 구간으로 넣었다. 가족카드 발급 불가.
