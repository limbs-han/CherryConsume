notes: 2026-10-13 상품안내장(2025.9판, 심의필 2025-C1a-13852호) 대조. 연회비 실물카드 해외겸용 Mastercard와 국내전용 10,000원(기본 7,000+제휴 3,000), 모바일카드 5,000원(기본 2,000+제휴 3,000). 후불교통 탑재. 실적 제외는 4대보험, 고용부담금, 세금과 공과금, 학교납입금, 대학 등록금, 대중교통, 택시, 아파트관리비, 부동산 임대료, 기프트·선불카드, 상품권과 온라인 간편결제 5%, 스트리밍 50%, 편의점 10% 혜택이 적용된 이용금액이다. 해외 1.5% 적용 금액은 실적 제외 목록에 없어 실적에 넣는다. 발급월+1개월까지는 전월 30만원 미만이어도 30만원 구간 혜택을 준다.
