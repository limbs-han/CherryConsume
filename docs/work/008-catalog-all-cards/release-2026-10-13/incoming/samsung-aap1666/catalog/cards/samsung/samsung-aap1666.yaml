        title: 해외 1.5% 할인
        source: manual
        evidence: ['전월 이용금액에 관계없이, 해외 1.5% 결제일할인(청구할인)', 해외 가맹점 및 해외 직접구매 이용건, 통합 월 할인한도는 50만원입니다, 해외겸용카드에 한해 혜택이 제공됩니다]
