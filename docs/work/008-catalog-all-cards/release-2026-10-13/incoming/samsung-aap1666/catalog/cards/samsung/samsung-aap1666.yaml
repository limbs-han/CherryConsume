        evidence: [편의점·헬스&뷰티·생활잡화 10% 결제일할인(청구할인), '편의점 CU, GS25, 세븐일레븐, 미니스톱, 이마트24', '헬스&뷰티 올리브영, 롭스, 랄라블라', 생활잡화 다이소, '통합 월 할인한도는 5,000원', 전월 이용금액 30만원 이상 시 제공, '오프라인 일반 결제건에 한하며, 임대매장은 제외']
