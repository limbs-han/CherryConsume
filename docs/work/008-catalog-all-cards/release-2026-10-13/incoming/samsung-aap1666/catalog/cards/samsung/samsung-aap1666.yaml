        limits:
          - {shared: overseas}
        exclude_applied: 0
    unmodeled: ['할인과 실적은 승인 시점 기준이고 해외 결제와 무승인 결제(대중교통, 이동통신 등 정기결제건)는 매출전표 접수 시점 기준이다', 삼성카드의 다른 결제일할인과 겹치면 할인 금액이 큰 것 하나만 준다, 헬스&뷰티 중 랄라블라는 공통 가맹점이 없어 담지 않았다, 건강보험 등 고용부담금과 장애인 고용부담금은 실적에서 빼야 하나 담을 업종이 없다, 후불교통 기능이 있어 대중교통은 실적에서 빠진다]
