notes: 2026-10-13 상품안내장(2025.9판) 대조. 연회비는 실물 해외겸용 Mastercard와 국내전용 모두 10,000원(기본 7,000+제휴 3,000)이고 모바일카드는 5,000원이다. 쇼핑 5% 두 혜택은 전월 이용금액 구간별 통합 월 한도를 같이 쓰고 혜택을 받은 이용금액은 전월 실적에서 제외된다. 해외 1.5%는 실적과 관계없이 월 50만원 한도다.
