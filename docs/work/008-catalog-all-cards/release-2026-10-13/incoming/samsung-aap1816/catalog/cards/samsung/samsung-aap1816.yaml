open_questions:
  - {path: 'revisions[0].effective_from', question: 시행일을 원문에서 찾지 못했다. 상품안내장은 2024.9판이고 심의필 날짜는 2024-09-19이다, assumed: '2024-09-19'}
  - {path: 'revisions[0].spend.exclude_categories', question: 전월 이용금액 제외 대상이 CGV 안내에 적혀 있지 않아 적립 제외 대상 목록으로 대신했다, assumed: 적립 제외 대상과 같음}
  - {path: 'revisions[0].benefits', question: 적립과 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].benefits[area1-wd].when', question: 평일과 주말 구분에서 공휴일을 어느 쪽으로 세는지 적혀 있지 않다, assumed: 요일만 따른다}
notes: 2026-10-13 상품안내장(2024.9판, 심의필 제2024-C1a-11453호) 대조. 연회비 해외겸용 Mastercard와 국내전용 모두 20,000원(기본 7,000+제휴 13,000). 신백리워드는 10신백리워드 단위로 쓰고 1신백리워드는 1원이다.
