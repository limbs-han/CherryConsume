notes: 2026-10-12 KB국민카드 상품 페이지로 대조했다. 기본 0.3%와 6대 업종 0.3% 추가 적립은 함께 받는다. 전월 실적 조건과 적립한도가 없다. 연회비 표 제목이 toss KB국민카드로 적혀 있지만 국내전용과 국내외겸용 모두 7천원이다. 국민연금증 KB국민카드만 가진 회원이 연간 10만원 이상 쓰면 다음 해 연회비를 면제한다.
