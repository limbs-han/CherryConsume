notes: 2026-10-12 상품설명서(2025년 10월 기준, 여신금융협회 심의필 제2025-C1a-16429호) 대조. 글꼴 때문에 글자 추출이 안 돼 쪽 그림으로 읽었다. 출시일 2025-10-16, 연회비 국내전용과 해외겸용(MASTER) 50,000원, 가족카드 연회비 없음. 국내외 0.5% L.POINT 적립, 실적 조건과 한도 없음, 1천원 미만 절사라 1천원당 5포인트로 옮겼다. 혜택과 연회비가 롯데백화점 AVENUEL EMERALD카드(lotte-1690)와 같지만 발급 대상 등급이 다른 별도 상품이라 따로 둔다.
