open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 상품 페이지 준법심의일을 잠정 시작일로 둔다., assumed: '2026-02-10'}
  - {path: 'revisions[0].spend.exclude_categories', question: '원문 실적 제외는 "공과금, 도시가스 이용금액"이다. 전기와 수도가 공과금에 드는지 단정할 수 없어 utility 전체를 뺐다.', assumed: utility 전체}
  - {path: 'revisions[0].tiers', question: 다른 하나멤버스 Mega 체크카드 페이지에는 실적 기준이 20만원으로 적힌 곳이 있다고 한다. 이 페이지는 25만원이다., assumed: 25만원}
  - {path: 'revisions[0].benefits[life-200].target', question: '요식, 온라인쇼핑 업종 범위를 하나카드 기준으로 단정할 수 없다. 요식은 커피 업종을 생활밀착으로 보지 않은 원문 예시에 맞춰 일반음식점과 패스트푸드만 넣었다.', assumed: '일반음식점, 패스트푸드'}
  - {path: 'revisions[0].benefit_exclusions', question: '상품권, 선불카드 충전 매출이 적립에서 빠지는지 원문에 없다.', assumed: 적립에서 뺌}
notes: 2026-10-13 공식 상품 페이지(상세 번호 CD_PD_SEQ=4882, 목록 상품 번호 9400, 준법심의 A-26-0341)에서 옮겼다. 연회비 면제, 브랜드 VISA. 발급수수료 2,000원은 다음 달 말일까지 1만원 이상 쓰면 돌려준다. 하나머니 1하나머니 = 1원. 건당 이용금액을 2만원으로 나눈 몫에 200 또는 100을 곱하고 남은 금액은 버린다. 월 통합 적립한도 10만 하나머니.
