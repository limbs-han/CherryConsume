        title: 버스·지하철·택시 5% 청구할인
        source: page
        evidence: ['대중교통(버스, 지하철), 택시 5% 청구할인', 월 3천원 할인한도, '시외버스, 고속버스 제외', 버스/지하철 요금할인은 실제 카드 사용일이 아닌 이용대금명세서 상 기재된 이용일 기준으로 제공]
        target:
          categories: [taxi, transit.bus_city, transit.subway]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 3000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
