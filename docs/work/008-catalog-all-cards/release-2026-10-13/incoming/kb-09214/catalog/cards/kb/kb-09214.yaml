        evidence: [백화점 | 10% | 7천원 | 1만 4천원, '3대 백화점 : 롯데백화점, 신세계백화점, 현대백화점']
        target:
          merchants: [hyundai_department, lotte_department, shinsegae_department]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: shopping}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        exclude_applied: 1
