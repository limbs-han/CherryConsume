        source: page
        evidence: ['편의점, 면세점, 3대 홈쇼핑 5% 청구할인', 월 5천원 할인한도, '편의점, 면세점 : 편의점 업종, 면세점 업종', '3대 홈쇼핑 : 현대홈쇼핑, GS홈쇼핑, CJ오쇼핑']
