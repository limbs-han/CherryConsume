        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 3000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
    unmodeled: [고궁(경복궁·창경궁·덕수궁)·N서울타워 전망대·서울 시티투어버스 20% 할인(월 3천원)은 담을 가맹점이 없어 계산하지 않는다, '에버랜드 50%, 캐리비안베이 30% 현장할인은 지정 이용권에만 주어 계산하지 않는다', '서울 용산구·영등포구, 안산 단원구 음식 업종 5% 할인(월 3천원)은 지역을 결제 입력으로 가릴 수 없어 계산하지 않는다', 월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 해외 이용금액은 매입 완료일 기준으로 실적 달을 나누고 일시불만 센다, 정부지원금 결제는 실적에서 빠진다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙의 시작일을 찾지 못했다. 원문은 2017년 01월 13일 출시만 적었다, assumed: '2026-10-12'}
  - {path: 'revisions[0].limits', question: 대형마트와 백화점은 표에서 각각 월 7천원·1만4천원 한도로 적혀 있지만 따로인지 함께인지 문구가 없다. 덜 주는 쪽인 함께 쓰는 한도로 두었다, assumed: shared}
notes: 2026-10-12 KB국민카드 상품 페이지와 상품설명서 PDF를 대조했다. 국내 거주 외국인 선호 서비스를 담은 상품이지만 발급 대상 제한이 없어 일반 상품으로 담는다. 대형마트·백화점 할인받은 결제만 실적에서 빠지고 무이자할부는 실적에 들어간다. 연회비 K-WORLD(UPI) 1만5천원, 마스터 1만7천원이다.
