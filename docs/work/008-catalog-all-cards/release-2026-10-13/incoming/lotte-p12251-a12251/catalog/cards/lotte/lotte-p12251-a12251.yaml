    unmodeled: [청호나이스 24·36개월 장기 할부 이용금액은 실적에서 빠지지만 결제 입력으로 가려내지 않는다. 장기 할부를 기록하면 실적이 실제보다 크게 잡힐 수 있다, '장기 할부 캐시백 13,000·17,000·23,000원은 40만원 이상 장기 할부 이용 뒤 매월 말일 지급이라 계산하지 않는다. 렌탈료 할인과 함께 쓰지 못한다', 롯데카드의 다른 결제일 할인과 겹치지 않는다, 현금서비스·카드론·이자·수수료는 실적에서 빠진다, 청호나이스 스페셜 롯데카드가 아닌 다른 롯데카드 이용금액은 실적에 넣지 않는다, 할인은 승인 시점 기준 남은 한도 안에서 준다, 롯데카드 제공 L.POINT는 적립하지 않는다]
notes: 2026-10-12 상품 페이지와 상품설명서(2024년 9월 기준, 출시일 2018-04-02) 대조. 상품 페이지에 신규 발급 중단이 적혀 있어 status를 discontinued로 두었다. 실적 제외는 국세·지방세·아파트관리비·연회비와 대출, 이자, 수수료, 장기 할부, 렌탈료 할인 받은 결제뿐이라 대중교통과 무이자 할부는 실적에 넣었다. 신규 발급 특례는 카드 사용 등록일부터 다음 달 말일까지 13,000원 할인이라 30만 구간으로 넣었다. 청호나이스 X LOCA(lotte-p15683-a15683)와 다른 상품이다. 앞 조사 id lotte-1541을 상품 코드 id로 바꿨다.
