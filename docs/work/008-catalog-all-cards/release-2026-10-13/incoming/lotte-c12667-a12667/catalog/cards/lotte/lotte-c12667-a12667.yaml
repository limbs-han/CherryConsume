notes: 2026-10-12 상품 페이지와 상품설명서 대조. lotte-c15817-a15817 LIKIT all 기본교통 체크카드와 혜택은 같지만 실적과 캐시백 제외 목록에 교통이 없어 다른 상품으로 둔다. 기본 0.2%와 주말·공휴일 0.2%는 더해 받는다. 최초 발급은 사용 등록일부터 다음 달 말일까지 추가 혜택을 주어 30만 구간으로 넣었다.
