schema_version: 2
id: ibk-12113090002
issuer: ibk
name: 일상의 기쁨카드(체크)
kind: check
product_codes:
  - '12113090002'
status: on_sale
annual_fees:
  - {scope: domestic, brand: unionpay, amount: 0}
  - {scope: global, brand: mastercard, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.ibk.co.kr/cardbiz/detailBizNew.ibk?PDLN_CD=12&PDGR_CD=11&PDTM_CD=309&PDCD=0002&pageId=CA01010000', fetched_at: 2026-10-13}
checked_at: 2026-10-13
revisions:
  - effective_from: 2026-10-13
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 500000]
    spend:
      basis: prev_calendar_month
      regions: [domestic]
      exclude_categories: [apartment_fee, education.tuition, gift_card, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      installment: full_at_purchase
      cancellation: cancel_month
    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      categories: [gift_card, prepaid_charge]
    limits:
      - key: integrated
        per: month
        amount: {300000: 5000, 500000: 10000}
      - {key: cvs_day, per: day, count: 1}
      - {key: cvs_month, per: month, count: 2}
      - {key: shop_day, per: day, count: 1}
      - {key: shop_month, per: month, count: 2}
      - {key: coffee_day, per: day, count: 1}
      - {key: coffee_month, per: month, count: 2}
    benefits:
      - key: transit-100
        title: 버스·지하철 건당 100원 청구할인
        source: page
        evidence: [후불교통카드로 이용한 버스·지하철 건당 100원 할인, 매출표 접수일 기준 월 최대 1천원, 환승 건은 이용횟수에서 제외]
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - billing: [postpaid_transit]
        reward: {type: billing_discount, fixed: 100}
        limits:
          - {per: month, amount: 1000}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: [환승 이용 건은 이용횟수에서 빠지지만 결제로 알 수 없다]
      - key: cvs-5
        title: 편의점 5% 청구할인
        source: page
        evidence: ['GS25, CU, 세븐일레븐 5% 할인', '편의점과 올리브영은 통합하여 1일 1회, 월 2회, 1회 이용금액 1만원 한도']
        target:
          merchants: [cu, gs25, seven_eleven]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: txn, base: 10000}
          - {shared: cvs_day}
          - {shared: cvs_month}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: oliveyoung-5
        title: 올리브영 5% 청구할인
        source: page
        evidence: [올리브영 5% 할인, '편의점과 올리브영은 통합하여 1일 1회, 월 2회, 1회 이용금액 1만원 한도']
        target:
          merchants: [olive_young]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: txn, base: 10000}
          - {shared: cvs_day}
          - {shared: cvs_month}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: online-10
        title: 쿠팡·티몬·위메프 10% 청구할인
        source: page
        evidence: ['쿠팡, 티켓몬스터, 위메프 10% 할인', '통합 1일 1회, 월 2회, 1회 1만원 한도']
        target:
          merchants: [coupang, tmon, wemakeprice]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 10000}
          - {shared: shop_day}
          - {shared: shop_month}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: movie-4000
        title: CGV·롯데시네마·메가박스 4천원 청구할인
        source: page
        evidence: ['CGV, 롯데시네마, 메가박스 4천원 할인', '현장 및 온라인 예매, 통합 월 1회, 연 12회, 건당 1만원 이상 결제 시']
        target:
          merchants: [cgv, lotte_cinema, megabox]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 4000}
        limits:
          - {per: month, count: 1}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: [예매 대행 사이트로 예매하면 제외다, 연 12회는 월 1회 한도 안에 들어 따로 두지 않았다]
      - key: coffee-10
        title: 주요 커피전문점 10% 청구할인
        source: page
        evidence: ['스타벅스, 커피빈, 카페베네, 탐앤탐스, 엔제리너스, 투썸플레이스, 할리스, 달.콤 10% 할인', '통합 1일 1회, 월 2회, 1회 1만원 한도', 백화점 및 할인(아울렛)점 입점 매장 제외]
        target:
          merchants: [angel_in_us, cafe_bene, coffee_bean, dalkomm, hollys, starbucks, tom_n_toms, twosome]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 10000}
          - {shared: coffee_day}
          - {shared: coffee_month}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: [백화점과 아울렛 입점 매장은 제외다]
    unmodeled: [금융우대서비스(이체·ATM 수수료 면제와 환전 우대)는 금액으로 계산하지 않는다, 놀이공원 할인은 월 1회 연 2회 자유이용권 할인이라 계산하지 않는다, 국가·공공기관 가맹점 실적 제외는 업종으로 담을 수 없다, 간편결제로 결제하면 할인되지 않을 수 있다, 가족카드 실적은 카드별로 본다]
open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외 교통요금을 시내버스와 지하철 업종 제외로 옮겼다. 후불교통 유료도로 이용분은 담을 업종이 없다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].effective_from', question: 시행일을 찾지 못해 조사일로 뒀다, assumed: '2026-10-13'}
notes: 2026-10-13 expand21 조사. I-Campus 체크(일상생활형)과 혜택 구조가 같다. 편의점과 올리브영, 쿠팡 묶음, 커피를 각자 일 1회 월 2회 한도로 묶었다
