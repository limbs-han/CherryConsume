open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일은 2024-04-11이고 상품안내장은 2024.4판이다. 출시일을 시행일로 두었다, assumed: '2024-04-11'}
notes: 2026-10-13 상품안내장(2024.4판, 여신금융협회 심의필 제2024-C1a-04005호) 대조. 연회비 국내전용과 해외겸용 Mastercard 모두 10,000원(기본 7,000+제휴 3,000). 실적 제외는 4대보험, 국세·지방세·공과금, 아파트관리비, 부동산 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다. 발급월+1개월까지는 전월 실적이 40만원 미만이어도 40만원 구간 혜택을 준다.
