schema_version: 2
id: kb-09253
issuer: kb
name: KB국민 Easy ring 티타늄카드
short_name: KB Easy ring 티타늄
kind: credit
product_codes:
  - '09253'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 30000}
  - {scope: global, brand: mastercard, amount: 30000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=09253', fetched_at: '2026-10-12', review_no: 제2026-C1a-02335호}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2020-04-21'
    effective_from_estimated: true
    source: page
    tiers: [0, 500000, 1000000, 1500000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit, utility]
      exclude_applied: 0
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [PG 전용 가맹점 결제와 호텔·백화점·대형마트·철도역사 입점 가맹점은 할인에서 빠질 수 있다]
    options:
      - key: select
        title: Easy ring 선택서비스(4개 중 택2)
        choices:
          - {key: online-mart, title: 온라인쇼핑과 대형마트}
          - {key: online-cafe, title: 온라인쇼핑과 커피·편의점·제과}
          - {key: online-fuel, title: 온라인쇼핑과 주유}
          - {key: mart-cafe, title: 대형마트와 커피·편의점·제과}
          - {key: mart-fuel, title: 대형마트와 주유}
          - {key: cafe-fuel, title: 커피·편의점·제과와 주유}
        default: null
        change: next_month
    stacks:
      - {key: main, pick: best}
    benefits:
      - key: telecom-1500
        title: 통신요금 자동납부 1만원당 1,500원 청구할인
        source: page
        evidence: ['통신요금 | 1만원당 1,500원 할인 | 7천원 | 1만5천원 | 2만5천원', '통신요금 : SKT, KT, LG U+, KB Liiv M 자동납부 이용금액', '통신요금 할인금액은 승인건별로 산정(건별 승인금액 기준 1만원 미만 절사) 하며, 여러건인 경우 각 할인금액을 합산하여 전월 이용실적 구간별 할인한도 내에서 제공', '이동통신요금, 유선전화, 인터넷 결합상품 포함', '알뜰폰(SKT, KT, LG U+) 제외']
        target:
          merchants: [kt, lg_uplus, liiv_m, skt]
        when:
          - billing: [autopay]
        reward:
          type: billing_discount
          per_unit: {unit: 10000, amount: 1500}
        limits:
          - per: month
            amount: {500000: 7000, 1000000: 15000, 1500000: 25000}
        tiers: {from: 500000}
        unmodeled: [SKT·KT·LG U+ 망을 쓰는 알뜰폰 요금은 할인에서 빠진다]
      - key: select-online-5
        title: '[선택] 온라인쇼핑 5% 청구할인'
        source: page
        evidence: ['온라인쇼핑 | G마켓, 옥션, 11번가, 쿠팡, 위메프 | 5% | 5천원 | 1만원 | 1만5천원', '상품권, 여행, 항공권, 티켓, 도서, 별도 팝업사이트 제외']
        target:
          merchants: [auction, coupang, eleven_st, gmarket, wemakeprice]
        when:
          - option:
              select: [online-mart, online-cafe, online-fuel]
        reward: {type: billing_discount, rate: 5}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 10000, 1500000: 15000}
        tiers: {from: 500000}
        unmodeled: [온라인쇼핑의 여행·항공권·티켓·도서 결제와 별도 팝업사이트 결제는 할인에서 빠진다]
      - key: select-mart-5
        title: '[선택] 대형마트 5% 청구할인'
        source: page
        evidence: ['대형마트 | 이마트, 롯데마트, 홈플러스 | 5% | 5천원 | 1만원 | 1만5천원', '온라인 결제, 상품권 구매 및 임대매장, SSM(롯데슈퍼, 이마트 에브리데이, 홈플러스 익스프레스 등) 이용금액 제외']
        target:
          merchants: [emart, homeplus, lotte_mart]
        when:
          - {channel: offline}
          - option:
              select: [online-mart, mart-cafe, mart-fuel]
        reward: {type: billing_discount, rate: 5}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 10000, 1500000: 15000}
        tiers: {from: 500000}
        unmodeled: [대형마트 건물 안 임대매장은 할인에서 빠진다]
      - key: select-cafe-5
        title: '[선택] 커피·편의점·제과 5% 청구할인'
        source: page
        evidence: ['커피/편의점/제과·아이스크림 | 커피, 편의점, 제과/아이스크림 업종 | 5% | 5천원 | 1만원 | 1만5천원', '온라인 결제, 상품권(선물하기 등) 및 선불카드(선불전자지급수단 포함) 충전 제외', '백화점, 마트 등에 입점한 일부 가맹점 제외']
        target:
          categories: [cafe, convenience, restaurant.bakery]
        when:
          - {channel: offline}
          - option:
              select: [online-cafe, mart-cafe, cafe-fuel]
        reward: {type: billing_discount, rate: 5}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 10000, 1500000: 15000}
        tiers: {from: 500000}
        unmodeled: [아이스크림 업종은 공통 업종에 없어 계산하지 않는다]
      - key: select-fuel-5
        title: '[선택] SK·GS 주유 5% 청구할인'
        source: page
        evidence: ['주유 (SK, GS) | SK주유소, GS주유소 (충전소 포함) | 5% | 5천원 | 1만원 | 1만5천원']
        target:
          merchants: [gs_caltex, sk_energy]
        when:
          - option:
              select: [online-fuel, mart-fuel, cafe-fuel]
        reward: {type: billing_discount, rate: 5}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 10000, 1500000: 15000}
        tiers: {from: 500000}
      - key: plus-movie-3000
        title: 영화 1만원 이상 3,000원 청구할인
        source: page
        evidence: ['영화 | CGV, 롯데시네마, 메가박스 | 건별 1만원 이상 시 3천원 할인 | 월1회 (3천원)', '현장 결제, 공식 홈페이지 및 모바일(앱) 결제 시 제공']
        target:
          merchants: [cgv, lotte_cinema, megabox]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 3000}
        limits:
          - {per: month, count: 1}
        tiers: {from: 500000}
      - key: plus-music-1000
        title: 멜론·지니·넷플릭스 5천원당 1천원 청구할인
        source: page
        evidence: ['음원/영상 | 멜론, 지니, 넷플릭스 | 건별 5천원 당 1천원 할인 | 2천원', 공식 홈페이지 및 모바일(앱)을 통한 정기결제 시 제공, 간편결제(Pay) 이용금액 제외]
        target:
          merchants: [genie, melon, netflix]
        when:
          - billing: [subscription]
          - payment_not: [kakao_pay, kb_pay, naver_pay, payco, samsung_pay, toss_pay]
        reward:
          type: billing_discount
          per_unit: {unit: 5000, amount: 1000}
        limits:
          - {per: month, amount: 2000}
        tiers: {from: 500000}
      - key: plus-delivery-2000
        title: 요기요·마켓컬리 2만원 이상 2,000원 청구할인
        source: page
        evidence: ['배달앱 | 요기요, 마켓컬리 | 건별 2만원 이상 시 2천원 할인 | 월2회 (4천원)', 간편결제(Pay) 이용금액 제외]
        target:
          merchants: [kurly, yogiyo]
        when:
          - amount: {min: 20000}
          - payment_not: [kakao_pay, kb_pay, naver_pay, payco, samsung_pay, toss_pay]
        reward: {type: billing_discount, fixed: 2000}
        limits:
          - {per: month, count: 2}
        tiers: {from: 500000}
    unmodeled: [당월 인정실적 150만원 초과 이용금액의 0.3%를 다음 달 포인트리로 주는 Easy ring 리워드는 한 달 누적 초과분이라 계산하지 않는다, 최초 사용등록일부터 다음 달 말일까지 실적 없이 50만원 구간 혜택을 주는 신규 특례는 계산하지 않는다, 공항 라운지·발레파킹 같은 티타늄 서비스는 계산하지 않는다, 무승인전표(자판기·터널통행료·항공기내 이용)와 정부지원금은 실적에서 빠진다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택이 시작된 날짜를 찾지 못해 출시일 2020.04.21로 두었다., assumed: '2020-04-21'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문은 교통요금을 실적에서 뺀다고만 적었다. 덜 주는 쪽으로 철도와 고속·시외버스를 포함한 대중교통 전체를 실적에서 뺐다, assumed: transit}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 선택서비스 4개 중 2개를 고르는 방식을 두 개 조합 여섯 선택지로 옮겼다. 변경은 신청 다음 달 1일부터다. 연회비는 기본 7천원과 제휴 2만3천원이고 모바일 단독카드는 2만4천원이다.
