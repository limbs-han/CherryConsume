      - key: medical-study
        title: 학습지·서점·학원 3% 캐시백
        source: page
        evidence: [의료(임신·출산) / 보육(교육) 업종 3% 캐시백, 학습지 웅진 씽크빅 교원 빨간펜 대교눈높이 한솔교육 윤선생, 교육 학원 서점 교보문고 영풍문고 알라딘중고서점, 학원은 오프라인 결제 시에만 제공]
        target:
          merchants: [daekyo, hansol_education, kyobo_book, kyowon, woongjin_thinkbig, youngpoong_book]
        when:
          - payment_not: [baemin_pay, coupay, kakao_pay, l_pay, naver_pay, payco, smile_pay, ssg_pay, toss_pay, woori_won_pay]
        reward: {type: cashback, rate: 3}
        limits:
          - {per: txn, base: 50000}
          - {shared: medical}
          - {shared: total}
        tiers: {from: 300000}
        unmodeled: [윤선생과 알라딘중고서점은 가맹점이 없어 담지 않았다. 학원 업종은 오프라인만이고 학원 전체가 대상이라 담지 않았다]
      - key: untact-10
        title: 언택트 라이프 10% 캐시백
        source: page
        evidence: [언택트 라이프 업종 10% 캐시백, 영상 넷플릭스 웨이브 티빙 유튜브 프리미엄, 음원 멜론 지니뮤직 유튜브 뮤직, 전자도서 교보문고 SAM YES24 북클럽, 멤버십 네이버플러스 컬리멤버스, 언택트 라이프 월 한도 30만원 3000원 60만원 6000원 90만원 12000원]
        target:
          merchants: [genie, kurly_members, kyobo_sam, melon, naver_plus_membership, netflix, tving, wavve, yes24_crema_club, youtube_premium]
        when:
          - billing: [subscription]
          - payment_not: [baemin_pay, coupay, kakao_pay, l_pay, naver_pay, payco, smile_pay, ssg_pay, toss_pay, woori_won_pay]
        reward: {type: cashback, rate: 10}
        limits:
          - {per: txn, base: 50000}
          - {shared: untact}
          - {shared: total}
        tiers: {from: 300000}
        unmodeled: [정기결제만이고 대상 가맹점 공식 홈페이지나 앱에서 직접 신청한 건만. 구글플레이·앱스토어와 1회성 구매와 앱마켓 결제 제외. 넷플릭스는 Basic·Standard·Premium 요금제만. 유튜브 뮤직은 가맹점이 없어 담지 않았다]
      - key: overseas-1
        title: 해외 건당 1만원 이상 30만원 미만 1% 캐시백
        source: page
        evidence: [해외가맹점(해외직구 포함) 이용금액 1~2% 캐시백, 1만원 이상 30만원 미만 1%, 이용횟수 제한 없이 월 최대 1만원, Mastercard 브랜드만 제공]
        target: {all: true}
        when:
          - {region: overseas}
          - amount: {min: 10000, below: 300000}
        reward: {type: cashback, rate: 1}
        limits:
          - {shared: overseas}
          - {shared: total}
        tiers: {from: 300000}
        unmodeled: [Mastercard 해외겸용만. 국내전용 BC는 해외 캐시백이 없다. 해외 매출 접수일 기준]
      - key: overseas-2
        title: 해외 건당 30만원 이상 2% 캐시백
        source: page
        evidence: [해외가맹점(해외직구 포함) 이용금액 1~2% 캐시백, 30만원 이상 2%, 이용횟수 제한 없이 월 최대 1만원, Mastercard 브랜드만 제공]
        target: {all: true}
        when:
          - {region: overseas}
          - amount: {min: 300000}
        reward: {type: cashback, rate: 2}
        limits:
          - {shared: overseas}
          - {shared: total}
        tiers: {from: 300000}
        unmodeled: [Mastercard 해외겸용만. 국내전용 BC는 해외 캐시백이 없다. 해외 매출 접수일 기준]
    unmodeled: [체크카드 소액신용결제는 월 최대 30만원 한도 안 신용 일시불이며 신용카드 실적으로 산정된다. 국민행복카드 바우처는 카드사 부가서비스가 아니다. 가족카드 발급 불가]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 전체 혜택의 정확한 시작일을 확인하지 못해 공식 원문 수집일로 두었다. 상품출시일은 2021-03-02이다., assumed: '2026-10-05'}
notes: 2026-10-13 공식 상품 페이지 대조. 통합 월 캐시백 한도는 영역별 한도와 함께 적용된다. 해외 캐시백은 영역 한도 1만원이 따로 있다.
