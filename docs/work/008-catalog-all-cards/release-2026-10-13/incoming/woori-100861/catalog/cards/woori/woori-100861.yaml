      - key: shopping-online
        title: 온라인쇼핑 2% 캐시백
        source: page
        evidence: [쇼핑/생활 업종 2% 캐시백, 온라인쇼핑 쿠팡 11번가 롯데홈쇼핑 G마켓 옥션 인터파크 롯데ON, 결제 건당 최대 캐시백 대상 금액 5만원]
        target:
          merchants: [auction, coupang, gmarket, interpark, lotte_homeshopping, lotte_on]
        when:
          - {channel: online}
          - payment_not: [baemin_pay, coupay, kakao_pay, l_pay, naver_pay, payco, smile_pay, ssg_pay, toss_pay, woori_won_pay]
