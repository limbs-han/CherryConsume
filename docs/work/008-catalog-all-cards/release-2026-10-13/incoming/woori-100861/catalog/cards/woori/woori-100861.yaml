        title: 이동통신 자동납부 2% 캐시백
        source: page
        evidence: [쇼핑/생활 업종 2% 캐시백, 이동통신 SKT KT LG U+, 정기결제 이용건에 한하여 캐시백 적용, 휴대전화 요금을 본 카드로 자동납부 신청 후 결제한 건]
