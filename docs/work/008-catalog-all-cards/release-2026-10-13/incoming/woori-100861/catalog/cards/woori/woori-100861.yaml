        title: 의료·보육 3% 캐시백
        source: page
        evidence: [의료(임신·출산) / 보육(교육) 업종 3% 캐시백, 병·의원(동물병원 포함) 산후조리원 약국 어린이집 유치원, 결제 건당 최대 캐시백 대상 금액 5만원, 의료 보육 월 한도 30만원 3000원 60만원 6000원 90만원 12000원]
        target:
          categories: [education.kindergarten, hospital, pharmacy]
        when:
          - payment_not: [baemin_pay, coupay, kakao_pay, l_pay, naver_pay, payco, smile_pay, ssg_pay, toss_pay, woori_won_pay]
        reward: {type: cashback, rate: 3}
