          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
          - payment_not: [baemin_pay, coupay, kakao_pay, l_pay, naver_pay, payco, smile_pay, ssg_pay, toss_pay, woori_won_pay]
        reward: {type: cashback, rate: 2}
        limits:
          - {per: txn, base: 50000}
          - {shared: shopping}
          - {shared: total}
        tiers: {from: 300000}
        unmodeled: [인터넷과 집전화 결합상품 제외. 생활월납 도시가스요금과 전기요금은 가맹점이 없어 담지 않았다]
      - key: shopping-rental
        title: 렌탈 정기결제 2% 캐시백
        source: page
        evidence: [쇼핑/생활 업종 2% 캐시백, 렌탈 코웨이 LG전자 가전구독 SK매직 쿠쿠홈시스 청호나이스 현대렌탈케어 바디프랜드 넥센타이어, 정기결제 이용건에 한하여 캐시백 적용]
