        source: page
        evidence: ['이동통신(5% 할인, 월 최대 2천원)', 'SKT, KT, LGU+', 건당 5만원 이상의 휴대전화 요금 자동납부 건에 한함]
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
          - amount: {min: 50000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 2000}
          - {shared: integrated}
        tiers: {from: 200000}
      - key: daiso-5
        title: 다이소 5% 청구할인
        source: page
        evidence: ['다이소(5% 할인, 월 최대 2천원)', 건당 1만원 이상의 오프라인 결제 건에 한함, 대형시설 입점점포 및 임대매장 제외]
        target:
          merchants: [daiso]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 2000}
          - {shared: integrated}
        tiers: {from: 200000}
        unmodeled: [대형시설 입점점포와 임대매장은 제외]
      - key: coupang-5
        title: 쿠팡 5% 청구할인
        source: page
        evidence: ['쿠팡 (5% 할인, 월 최대 1천원)', 건당 1만원 이상 결제 건에 한함, 상품권·선불카드 구매 및 충전 등의 이용금액 제외, 공식 앱 또는 홈페이지를 통한 결제 건에 한하여 할인 제공]
        target:
          merchants: [coupang]
        when:
          - {channel: online}
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 5}
        limits:
