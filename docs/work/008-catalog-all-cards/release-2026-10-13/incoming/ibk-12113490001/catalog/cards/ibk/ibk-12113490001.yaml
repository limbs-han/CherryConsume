          - {shared: integrated}
        tiers: {from: 200000}
      - key: delivery-5
        title: 배달앱 5% 청구할인
        source: page
        evidence: ['배달앱(5% 할인, 월 최대 2천원)', '배달의민족, 요기요, 쿠팡이츠', 건당 1만원 이상 결제 건에 한함, 공식앱을 통한 결제 건에 한하여 할인 제공]
        target:
          merchants: [baemin, coupang_eats, yogiyo]
        when:
          - {channel: online}
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 2000}
          - {shared: integrated}
        tiers: {from: 200000}
      - key: convenience-5
        title: 편의점 5% 청구할인
        source: page
        evidence: ['편의점(5% 할인, 월 최대 1천원)', 'CU, GS25, 세븐일레븐, 이마트24', 건당 1만원 이상의 오프라인 결제 건에 한함, 상품권·선불카드 구매 및 충전 등의 이용금액 제외, '대형시설 입점점포 및 임대매장(백화점, 대형할인점 등) 제외']
        target:
          merchants: [cu, emart24, gs25, seven_eleven]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 1000}
          - {shared: integrated}
        tiers: {from: 200000}
        unmodeled: [대형시설 입점점포와 임대매장은 제외]
    unmodeled: [국가·공공기관·공공단체 가맹점 이용금액은 실적에서 빠진다, 간편결제 결제는 할인이 제공되지 않을 수 있다, 쿠팡과 배달앱은 공식 앱이나 홈페이지 결제만 대상이다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시작일을 찾지 못해 수집한 날로 두었다, assumed: '2026-10-13'}
  - {path: 'revisions[0].new_card', question: 원문은 사용 등록일 이후 다음 월말까지 통합 월 할인한도 5천원을 기본 제공한다고 적었다. 20만원 구간과 같다고 보았다, assumed: 200000}
notes: 2026-10-13 expand21 조사. 외국인 대상 체크카드로 소개되지만 발급대상은 개인이다. 전월 20만원 미만이면 할인이 없다. 대중교통 이용대금은 실적에서 빼고 후불교통 결제만 할인한다
