    stacks:
      - {key: main}
      - {key: overseas}
      - {key: online}
    benefits:
      - key: base-1-5
        title: 기본 1.5% IBK포인트 적립
        source: manual
        evidence: [국내·외 가맹점 이용금액의 1.5% 적립, '전월 이용실적 50만원 이상인 경우 제공되며, 월 적립한도 없음', 1포인트는 1원과 동일한 가치를 가집니다]
        target:
          exclude_categories: [fuel]
          all: true
        when:
          - {interest_free: false}
        reward: {type: points, program: ibk_point, rate: 1.5}
        tiers: {from: 500000}
      - key: fuel-1-5
        title: 주유 1.5% IBK포인트 적립
        source: page
        evidence: [주유(유류, LPG포함) 이용금액 합산 최대 월 100만원까지 적립대상으로 인정됩니다]
        target:
          categories: [fuel]
        when:
          - {interest_free: false}
        reward: {type: points, program: ibk_point, rate: 1.5}
        limits:
          - {shared: fuel-cap}
        tiers: {from: 500000}
      - key: overseas-5
        title: 해외 가맹점 5% IBK포인트 적립
        source: manual
        evidence: [해외 가맹점 이용금액의 5% 적립, '전월 이용실적 50만원 이상인 경우 제공되며, 월 적립한도 15,000포인트', 기본 포인트와 특별 포인트Ⅰ, Ⅱ는 중복 적용 가능]
        target: {all: true}
        when:
          - {region: overseas}
          - {interest_free: false}
        reward: {type: points, program: ibk_point, rate: 5}
        limits:
          - {shared: overseas-cap}
        tiers: {from: 500000}
        stack: overseas
        notes: 한도를 넘으면 기본 포인트만 적립한다
      - key: online-0-5
        title: 온라인 쇼핑 0.5% IBK포인트 적립
        source: manual
        evidence: [온라인 쇼핑 가맹점 이용금액의 0.5% 적립, '온라인쇼핑 | 쿠팡, G마켓, 옥션, 11번가 | 10,000포인트', 기본 포인트와 특별 포인트Ⅰ, Ⅱ는 중복 적용 가능]
        target:
          merchants: [auction, coupang, eleven_st, gmarket]
        when:
          - {interest_free: false}
        reward: {type: points, program: ibk_point, rate: 0.5}
        limits:
          - {shared: online-cap}
        tiers: {from: 500000}
        stack: online
        notes: 월 한도 1만 포인트가 가맹점별인지 영역 전체인지 표가 분명하지 않아 영역 전체로 뒀다
    unmodeled: [국가·공공기관·공공단체가 개설한 가맹점 이용금액은 실적과 적립에서 빠지지만 담을 업종이 없다, 신용카드 약관의 첫 달 특례는 없다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 시행일을 찾지 못해 준법감시인 심의일로 뒀다, assumed: '2025-11-28'}
  - {path: 'revisions[0].limits[online-cap]', question: 온라인 쇼핑 월 1만 포인트 한도가 가맹점별인지 영역 전체인지 분명하지 않다, assumed: 영역 전체}
notes: 2026-10-13 expand21 조사. 해외와 온라인 특별 적립은 기본 적립에 더해 받는다. 신규 발급 특례는 원문에 없다
