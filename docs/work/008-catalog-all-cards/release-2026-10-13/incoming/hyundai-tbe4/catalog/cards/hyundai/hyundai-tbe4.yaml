              reward: [m_point]
        reward: {type: points, program: hyundai_m_point, rate: 1.5, round: round}
        tiers: {from: 500000}
    unmodeled: [개인 카드 대한항공 마일리지형(1천원당 1마일리지)은 마일리지 가치를 원 단위로 정한 문구가 없어 계산하지 않는다, 법인 카드는 이 상품에 담지 않는다, 연 1회 50만원권 바우처 4매(키톤·몽클레르·라망 시크레·이타닉 가든)는 연간 이용 금액 조건이라 계산하지 않는다, 인천공항 라운지·발레파킹과 특급호텔 발레파킹은 결제 혜택이 아니라 계산하지 않는다, 실적과 적립은 본인 가족 법인 카드를 합산한다, 국제브랜드 수수료와 해외서비스 수수료는 실적에 넣지 않는다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다]
open_questions:
  - {path: status, question: 상품 페이지에 판매 상태 표시가 없다. 가이드북이 2026년 4월 판이라 판매 중으로 보았다, assumed: on_sale}
  - {path: 'revisions[0].effective_from', question: 가이드북 시행일을 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
notes: 2026-10-13 공식 가이드북(2026년 4월 판)과 상품 페이지 대조. 연회비 국내전용과 국내외겸용(Visa Infinite) 3,000,000원(기본 1,000,000+제휴 2,000,000), 가족카드 1,000,000원. 개인 카드는 M포인트형이면 전월 50만 이상 국내외 1.5% M포인트이고 한도가 없다. 마일리지형은 계산하지 않는다. 매출 건별 소수점 이하 반올림. 실적 제외는 카드론 등, 수수료, 공과금, 상품권·선불카드뿐이라 상하수도만 utility.water로 뺀다. 취소는 승인월에서 빼고 해외는 취소 달에서 뺀다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 50만 미만도 혜택을 준다.
