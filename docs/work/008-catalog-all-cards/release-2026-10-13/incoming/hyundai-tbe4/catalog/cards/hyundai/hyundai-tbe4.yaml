        title: 국내외 가맹점 1.5% M포인트 적립 (M포인트형)
        source: manual
        evidence: [개인 카드 M포인트형 전월 이용 금액 50만원 이상 시 국내외 가맹점 이용 금액 1.5% M포인트 적립, 1회 및 연간 적립 한도 제한 없음, 매출 건별로 소수점 이하 반올림 후 적립, '55,500원 결제 시 833 M포인트 적립(55,500x1.5% = 832.5의 소수점 이하 반올림)']
        target: {all: true}
        when:
