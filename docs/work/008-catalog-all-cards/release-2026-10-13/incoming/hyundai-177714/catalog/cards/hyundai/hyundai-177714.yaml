schema_version: 2
id: hyundai-177714
issuer: hyundai
name: 현대카드 하이브리드(Apple Pay Rewards)
short_name: 현대 하이브리드 Apple Pay
search_names: [하이브리드 Apple Pay Rewards, 현대 하이브리드 애플페이, 현대카드 하이브리드 Apple Pay]
kind: check
product_codes: []
status: on_sale
annual_fees:
  - {scope: domestic, amount: 5000}
  - {scope: global, brand: visa, amount: 5000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/20260428_%ED%95%98%EC%9D%B4%EB%B8%8C%EB%A6%AC%EB%93%9C%20Apple%20Pay%20Rewards.pdf', fetched_at: 2026-10-13}
checked_at: 2026-10-13
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: manual
    tiers: [0, 300000, 600000]
    spend:
      exclude_categories: [annual_fee, gift_card, prepaid_charge, tax, utility.water]
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [고속도로 통행 요금과 후불하이패스 카드 이용 금액은 캐시백에서 뺀다, 현대카드의 다른 할인과 무이자 할부가 적용된 결제는 캐시백에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 캐시백에서 뺀다]
    benefits:
      - key: apple-pay-10
        title: Apple Pay 10% 캐시백
        source: manual
        evidence: [전월 이용 금액 30만원 이상 시 국내외 가맹점 Apple Pay 이용 금액 10% 캐시백, '전월 이용 금액별 캐시백 한도 - 30만원 이상 60만원 미만 : 월 5천원 - 60만원 이상 : 월 1만원', 매출 건별로 소수점 이하 반올림 후 캐시백, 해외 가맹점 Apple Pay 이용 금액 캐시백은 국내외겸용 카드에 한해 적용]
        target: {all: true}
        when:
          - payment: [apple_pay]
        reward: {type: cashback, rate: 10, round: round}
        limits:
          - per: month
            amount: {300000: 5000, 600000: 10000}
        tiers: {from: 300000}
    unmodeled: [캐시백은 매출전표 접수 순서로 한도를 적용한다, 국제브랜드 수수료와 해외서비스 수수료는 실적에 넣지 않는다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, 계좌 잔액이 모자랄 때 신용으로 결제하는 하이브리드 기능은 결제 혜택과 관계없다]
open_questions:
  - {path: product_codes, question: 카드 상세 주소의 상품 코드를 확인하지 못했다, assumed: '[]'}
  - {path: 'revisions[0].effective_from', question: 가이드북 시행일을 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
  - {path: kind, question: 체크카드에 잔액이 모자라면 신용으로 결제하는 하이브리드 카드다. 결제 계좌 즉시 출금이 기본이라 체크로 두었다, assumed: check}
notes: 2026-10-13 공식 가이드북 대조. 연회비 국내전용과 국내외겸용(Visa Platinum) 5,000원, 가족카드 없음. 전월 30만 이상 Apple Pay로 결제한 국내외 가맹점 10% 캐시백이고 월 한도는 30만 이상 5천원, 60만 이상 1만원. 매출 건별 소수점 이하 반올림. 실적 제외는 카드론 등, 수수료, 공과금, 상품권·선불카드뿐이라 상하수도만 utility.water로 뺀다. 취소는 승인월에서 빼고 해외는 취소 달에서 뺀다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 30만 구간 한도를 주고 실제 60만 이상이면 60만 구간 한도다. Apple Pay가 아닌 결제는 혜택이 없다.
