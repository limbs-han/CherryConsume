open_questions:
  - {path: 'revisions[0].effective_from', question: 시행일을 찾지 못해 준법감시인 심의일로 뒀다, assumed: '2024-06-28'}
  - {path: 'revisions[0].limits', question: 통합할인한도 표에서 온라인쇼핑과 해외쇼핑이 쇼핑서비스 한 한도인지 따로인지 분명하지 않다. 덜 주는 쪽으로 합쳤다, assumed: 쇼핑서비스 한도 공유}
  - {path: 'revisions[0].spend.regions', question: 전월 이용금액이 국내만인지 분명하지 않다. 원문은 국내 가맹점 기준, assumed: '[domestic]'}
notes: 2026-10-13 expand21 조사. 생활서비스는 후불교통 택시 통신 스타벅스가 한도를 같이 쓰고 쇼핑서비스는 온라인과 해외가 같이 쓴다
