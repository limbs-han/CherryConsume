notes: 2026-10-13 상품안내장(2022.10판, 심의필 2020-C1a-06164호) 대조. 출시 2020-07-06. 연회비 해외겸용 VISA·국내전용 모두 10,000원(기본 7,000+제휴 3,000). 주유 리터당 할인은 전월 이용금액 구간과 전월 생활요금 자동납부 건수에 따라 60~150원이고 월 15,000원, 1회 주유금액 10만원까지다. 자동납부 건수는 사용자에게 묻는 사실 두 개로 옮겼다. 주유와 편의점·커피 10%를 받은 이용금액은 실적에서 빠진다. 발급월+1개월까지는 30만 구간 혜택.
