revisions:
  - effective_from: '2026-10-12'
    effective_from_estimated: true
    source: page
    tiers: [0, 400000, 800000, 1500000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      exclude_applied: 1
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [PG 전용 가맹점 결제와 호텔·백화점·대형마트·철도역사 입점 가맹점은 일부 서비스에서 할인이 빠진다]
    limits:
      - {key: mart_telecom, per: month, amount: 5000}
      - {key: coffee_conv_taxi, per: month, amount: 5000}
      - {key: beauty_sports, per: month, amount: 10000}
    stacks:
      - {key: main, pick: best}
    benefits:
      - key: gs-shop-12
        title: GS SHOP 12% 청구할인
        source: page
        evidence: ['GS SHOP | 12% | 전월 실적 40만원 이상 2만원, 80만원 이상 3만원, 150만원 이상 5만원', 'GS SHOP: 상품권 구매 등 현금 환원성 거래, 네이버페이·토스 등 간편결제 제외']
        target:
          merchants: [gs_shop]
        when:
          - payment_not: [apple_pay, coupay, eleven_pay, kakao_pay, l_pay, naver_pay, payco, samsung_pay, smile_pay, ssg_pay, toss_pay]
        reward: {type: billing_discount, rate: 12}
        limits:
          - per: month
            amount: {400000: 20000, 800000: 30000, 1500000: 50000}
        tiers: {from: 400000}
      - key: mart-5
        title: 이마트·롯데마트·홈플러스 5% 청구할인
        source: page
        evidence: ['대형마트/이동통신 | 5% | 월 5,000원 | 전월 40만원 이상, 건당 30,000원 이상', '롯데마트, 이마트, 홈플러스(오프라인 매장 이용건)', '온라인몰, 건물 내 임대매장, SSM, 상품권 제외']
        target:
          merchants: [emart, homeplus, lotte_mart]
        when:
          - amount: {min: 30000}
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: mart_telecom}
        tiers: {from: 400000}
        unmodeled: [대형마트 건물 내 임대매장 결제는 할인에서 빠진다]
      - key: telecom-5
        title: 이동통신 자동납부 5% 청구할인
        source: page
        evidence: [SKT·KT·LG U+·Liiv M의 이동통신 자동납부 요금, 건당 30, 000원 이상 결제 시]
        target:
          merchants: [kt, lg_uplus, liiv_m, skt]
        when:
          - amount: {min: 30000}
          - billing: [autopay]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: mart_telecom}
        tiers: {from: 400000}
      - key: coffee-conv-taxi-10
        title: 커피·편의점·택시 10% 청구할인
        source: page
        evidence: ['커피/편의점/택시 | 10% | 5,000원 | 전월 40만원 이상', '커피, 편의점, 택시 업종', '백화점·대형마트 입점 일부 가맹점, 상품권, 선불식 충전카드 제외']
        target:
          categories: [cafe, convenience, taxi]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: coffee_conv_taxi}
        tiers: {from: 400000}
      - key: beauty-sports-5
        title: 미용실·화장품·골프 5% 청구할인
        source: page
        evidence: ['미용실/화장품/문화센터/스포츠 | 5% | 10,000원 | 전월 40만원 이상, 온라인 결제 제외', '미용실, 화장품, 문화센터 업종과 종합스포츠센터, 골프장, 골프연습장, 테니스장, 수영장, 요가, 볼링장 업종']
        target:
          categories: [beauty.cosmetics, beauty.salon, sports.golf]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: beauty_sports}
        tiers: {from: 400000}
        unmodeled: [문화센터와 종합스포츠센터·테니스장·수영장·요가·볼링장 업종은 담을 업종이 없어 계산하지 않는다. 스포츠 업종 전체는 스포츠용품점까지 넓어 골프만 담았다]
    unmodeled: [최초 사용등록일부터 다음 달 말일까지 실적 없이 서비스를 주는 신규 특례는 계산하지 않는다, 정부지원금(보육료·유치원보조비·바우처)과 무승인전표(공항버스·자판기·터널이용료·기내 이용)는 실적에서 빠진다, 할인 한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2020.12.16 출시만 적었다., assumed: '2026-10-12'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].limits', question: '대형마트/이동통신, 커피/편의점/택시, 미용실 등 영역이 원문 표 한 줄에 한도 하나로 적혀 있어 영역 안 대상들이 한도를 함께 쓴다고 두었다', assumed: shared}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 할인받은 결제는 금액 전체가 실적에서 빠진다. GS SHOP은 간편결제로 결제하면 할인이 빠져 간편결제 전부를 제외했다.
