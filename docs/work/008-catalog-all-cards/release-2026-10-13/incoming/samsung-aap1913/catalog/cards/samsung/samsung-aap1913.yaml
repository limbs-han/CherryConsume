open_questions:
  - {path: 'revisions[0].effective_from', question: 시행일을 원문에서 찾지 못했다. 상품 페이지가 열려 있어 수집일로 두었다, assumed: '2026-10-05'}
  - {path: 'revisions[0].benefits', question: 할인의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].spend.exclude_categories', question: 안내장이 전월 이용금액 제외에 대중교통을 적지 않아 실적에 넣었다. 할인 제외에는 대중교통과 택시가 있다, assumed: 대중교통 실적 포함}
notes: 2026-10-13 상품안내장 대조. 연회비 해외겸용 VISA와 국내전용 모두 18,000원(기본 7,000+제휴 11,000). 의료 20% 또는 생활 영역 10% 중 하나를 고르고 할인받은 전체 이용금액은 전월 이용금액에서 빠진다. 쇼핑 1%, 여가 2%, 국내 0.5%는 실적과 관계없고 서로 중복되지 않는다. 선택 옵션과 여가 2%는 통합 월 한도를 넘으면 국내 0.5%만 적용된다.
