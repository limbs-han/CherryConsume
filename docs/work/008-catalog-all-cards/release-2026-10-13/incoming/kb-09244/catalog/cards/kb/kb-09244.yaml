notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 특화서비스 세 영역은 영역마다 한도가 따로다. 백화점은 쇼핑 영역 한도를 함께 쓴다. KB Pay 오픈마켓 할인은 쇼핑 할인과 함께 받는다.
