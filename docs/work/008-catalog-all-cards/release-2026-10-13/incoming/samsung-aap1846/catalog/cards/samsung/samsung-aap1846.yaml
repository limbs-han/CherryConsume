notes: 2026-10-13 상품안내장(2026.8판, 심의필 2026-C1a-11597호) 대조. 연회비 해외겸용 Mastercard와 국내전용 7,000원(기본 7,000+제휴 없음). 후불교통 기능 탑재. 실적 제외는 4대보험, 고용부담금, 세금과 공과금, 아파트 관리비, 부동산 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다. 할인 적용 금액을 실적에서 빼는 문구가 없어 할인 받은 결제도 실적에 넣었다. 1일부터 말일까지 일시불·할부 이용금액이 실적이다. 발급월+1개월까지는 40만원 미만이어도 40만원 구간 혜택을 준다.
