    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
    benefits:
      - key: rental-subscription-discount
        title: 청호나이스 렌탈·구독료 정기결제 청구 할인 (월 8천원·1만2천원·1만6천원)
        source: manual
        evidence: [전월 이용 금액 40만원 이상 시 청호나이스 렌탈/구독료 정기결제 최대 1만 6천원 청구 할인, '40만원 이상 80만원 미만 : 월 8천원', '80만원 이상 120만원 미만 : 월 1만 2천원', '120만원 이상 : 월 1만 6천원', 렌탈/구독료 정기결제 결제 건에 한해 혜택 적용, '일반 납부 건, 정기결제일 이후 납부 건은 혜택 제외', '청호나이스 렌탈/구독료가 청구 할인 금액보다 적을 경우, 결제 금액만큼만 혜택 적용', 청호나이스 렌탈/구독료 정기결제 건수와 관계없이 전월 이용 금액별 월 할인 한도 내 혜택 적용]
        target:
          merchants: [chungho_rental]
        when:
          - billing: [subscription]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {400000: 8000, 800000: 12000, 1200000: 16000}
        tiers: {from: 400000}
        exclude_applied: 1
        notes: 렌탈·구독료가 한도보다 적으면 결제 금액만큼만 할인하므로 rate 100에 월 한도로 담았다
    unmodeled: [정기결제일 이후 납부한 건과 일반 납부 건은 할인하지 않는다, 정기결제는 청호나이스 고객센터를 통해 신청한 건만 할인한다, 할인은 매출전표 접수 순서로 한도를 적용한다, 실적과 할인 한도는 본인과 가족 카드를 합산한다, TV 수신료·고속도로 통행료·후불하이패스는 실적에서 뺀다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, 현대카드의 다른 청구 할인과 겹치면 큰 쪽 하나만 준다, 월 할인 한도를 넘긴 뒤 혜택 받은 결제를 취소하면 이전 결제에 다음 달 15일경 할인한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 가이드북은 2026년 4월 기준이다. 그 전부터 혜택이 같았는지 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
notes: 2026-10-13 공식 가이드북(2026년 4월 기준) 대조. 연회비 국내전용과 국내외겸용(Visa Platinum) 20,000원(기본 10,000+제휴 10,000), 가족카드 5,000원. 전월 40만 이상 청호나이스 렌탈·구독료 정기결제를 월 8천원(40만), 1만2천원(80만), 1만6천원(120만) 한도로 청구 할인한다. 실적은 전월 1일~말일 일시불과 할부이고 청구 할인 받은 렌탈·구독료 결제 전체와 무이자 할부를 뺀다. 취소는 승인월 실적에서 빼고 해외는 취소 달에서 뺀다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 40만 구간 한도.
