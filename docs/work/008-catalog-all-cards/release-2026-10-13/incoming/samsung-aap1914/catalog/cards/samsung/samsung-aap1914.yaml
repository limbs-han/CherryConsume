notes: 2026-10-13 상품안내장(2026.5판, 심의필 2026-C1a-05942호) 대조. 출시 2026-04-21. 연회비 해외겸용 VISA 18,000원(기본 7,000+제휴 11,000). 국내전용도 같은 금액으로 보았다. SELECT 서비스는 의료 20%와 생활 영역 10% 중 하나를 고르고 전월 이용금액 50만·100만·150만원 구간에 월 7,000·10,000·15,000원 통합 한도다. 쇼핑 1%, 여가 2%, 국내 0.5%는 한도 없이 또는 월 50만원 한도로 받고 서로 겹치지 않는다. 의료 20%와 생활 10%를 받은 이용금액은 전월 실적에서 빠진다. 발급월+1개월까지는 50만 구간 혜택.
