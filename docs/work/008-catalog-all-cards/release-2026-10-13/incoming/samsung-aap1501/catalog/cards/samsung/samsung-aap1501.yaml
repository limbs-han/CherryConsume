schema_version: 2
id: samsung-aap1501
issuer: samsung
name: CU·배달의민족 삼성카드 taptap
short_name: CU·배민 taptap
search_names: [CU 배달의민족 taptap, CU 배민 삼성카드]
kind: credit
product_codes: [AAP1501]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 10000}
  - {scope: global, brand: mastercard, amount: 10000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.samsungcard.com/filedownload.do?grpNo=1zPVy1PuFbwGC7xZyM4qtoi5AVOU7whODzCPGg4gWlc%3D&sn=1', fetched_at: 2026-10-13}
checked_at: 2026-10-13
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: manual
    tiers: [0, 300000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, taxi, transit.bus_city, transit.subway, utility]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 1
    new_card: {until: next_month_end, tier: 300000, from: issue}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
        - payment: [mobile_tmoney]
      categories: [car.toll, prepaid_charge]
      unmodeled: [다이어트할부는 할인하지 않는다]
    benefits:
      - key: public-transport-10
        title: 대중교통 10% 결제일할인
        source: manual
        evidence: ['대중교통 이용금액 1,000원당 100원 결제일할인(청구할인)', '월 할인한도는 6,000원입니다.', 전월 일시불 및 할부 이용금액 30만원 이상 시 제공됩니다., '버스, 지하철(시외·고속·공항버스 제외)']
        target:
          categories: [transit.bus_city, transit.subway]
        reward:
          type: billing_discount
          per_unit: {unit: 1000, amount: 100}
        limits:
          - {per: month, amount: 6000}
        tiers: {from: 300000}
        unmodeled: [원문은 명세서 이용일 기준 월 누적 이용금액 1, 000원당 100원이고 앱은 결제마다 1, 000원 단위로 계산해 덜 계산한다]
      - key: cu-20
        title: CU 20% 결제일할인
        source: manual
        evidence: ['CU 이용금액 1,500원당 200원 결제일할인(청구할인)', '월 할인한도는 4,000원입니다.', 전월 일시불 및 할부 이용금액 30만원 이상 시 제공됩니다.]
        target:
          merchants: [cu]
        reward:
          type: billing_discount
          per_unit: {unit: 1500, amount: 200}
        limits:
          - {per: month, amount: 4000}
        tiers: {from: 300000}
      - key: restaurant-10
        title: 음식점 1,000원 결제일할인
        source: manual
        evidence: ['음식점, 주점에서 10,000원 이상 결제 시 1,000원 결제일할인(청구할인)', '월 할인한도는 4,000원입니다.(월 4회 한도)', 전월 일시불 및 할부 이용금액 30만원 이상 시 제공됩니다., '음식점 한식, 양식, 일식, 중식, 뷔페, 패밀리레스토랑, 간이음식점, 패스트푸드']
        target:
          categories: [restaurant.fastfood, restaurant.general]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 1000}
        limits:
          - {per: month, amount: 4000}
          - {per: month, count: 4}
        tiers: {from: 300000}
        unmodeled: [주점, 노래방, 주류판매점 결제는 담을 업종이 없어 할인을 계산하지 않는다]
      - key: baemin-20
        title: 배달의민족 2,000원 결제일할인
        source: manual
        evidence: ['배달의민족에서 15,000원 이상 결제 시 2,000원 결제일할인(청구할인)', '월 할인한도는 6,000원입니다.(월 3회 한도)', 전월 일시불 및 할부 이용금액 30만원 이상 시 제공됩니다., 배달의민족 홈페이지 및 App을 통한 결제건에 한해 제공됩니다.(가맹점 직접 결제건 제외)]
        target:
          merchants: [baemin]
        when:
          - {channel: online}
          - amount: {min: 15000}
        reward: {type: billing_discount, fixed: 2000}
        limits:
          - {per: month, amount: 6000}
          - {per: month, count: 3}
        tiers: {from: 300000}
    unmodeled: [삼성카드의 다른 결제일할인과 중복 적용되지 않고 할인 혜택이 큰 금액만 적용한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 시행일을 원문에서 찾지 못했다. 출시는 2016-07-08이고 상품안내장은 2022.7판이다, assumed: '2026-10-05'}
  - {path: 'revisions[0].benefits', question: 할인의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통 범위가 적혀 있지 않아 시내버스와 지하철로 두었다. 삼성카드는 사회보험료를 공과금으로 분류해 insurance.social을 뺐다, assumed: 'transit.bus_city, transit.subway, insurance.social'}
notes: 2026-10-13 상품안내장(2022.7판, 심의필 2017-C1a-04768호) 대조. 연회비는 해외겸용 Mastercard와 국내전용 모두 10,000원(기본 7,000+제휴 3,000). 가족카드 없음. 발급월+1개월까지는 전월 실적과 관계없이 혜택을 준다.
