notes: 2026-10-12 상품설명서(2026년 8월 기준) 대조. LOCA X BS RENTAL(lotte-p13828-a13828)과 같은 구조인데 제휴 렌탈사가 60여 곳이다. 신규 발급 특례는 발급일부터 다음 달 말일까지 10,000원 한도라 30만 구간으로 넣었다. 실적 제외 목록에 대중교통과 택시가 없어 실적에 남겼다.
