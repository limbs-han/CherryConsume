          merchants: [angel_in_us, coffee_bean, compose_coffee, ediya, hollys, mega_coffee, paik_coffee, pascucci, paul_bassett, starbucks, tom_n_toms, twosome]
        reward: {type: points, program: ibk_point, rate: 6}
        limits:
          - {shared: coffee-cap}
        tiers: {from: 200000}
        stack: coffee
        unmodeled: [백화점·대형할인점·아울렛 입점 매장은 제외, 팀 홀튼 더벤티 하삼동커피는 가맹점 키가 없어 담지 않았다]
    unmodeled: [국가·공공기관·공공단체가 개설한 가맹점 이용금액은 실적에서 빠지지만 담을 업종이 없다, 후불교통 기능은 있으나 실적 제외 여부가 원문에 없다]
