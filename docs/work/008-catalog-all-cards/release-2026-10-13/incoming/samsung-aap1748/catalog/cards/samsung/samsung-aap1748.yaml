notes: 2026-10-13 상품안내장(2022.8판, 심의필 2021-C1a-10111호) 대조. 연회비 해외겸용 Mastercard 10,000원(기본 7,000+제휴 3,000), 국내전용 없음. 후불교통 기능 탑재. 실적 제외는 4대보험, 고용부담금, 세금과 공과금, 학교납입금, 등록금, 대중교통, 택시, 아파트 관리비, 임대료, 기프트·선불카드, 상품권이다. 할인 받은 결제도 실적에 넣는다. 발급월+1개월까지는 전월 40만원 미만이어도 40만원 구간 혜택을 준다.
