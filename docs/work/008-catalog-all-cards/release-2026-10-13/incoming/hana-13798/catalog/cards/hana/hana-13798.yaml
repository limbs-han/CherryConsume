open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 원문 신규출시일 2021-06-14를 잠정 시작일로 둔다., assumed: '2021-06-14'}
  - {path: 'revisions[0].spend', question: 원문 실적은 국내외 일시불 이용금액 기준이다. 체크카드라 할부가 없다고 보고 일시불만 센다., assumed: 체크 결제 전부}
notes: 2026-10-13 공식 상품 페이지에서 옮겼다. 연회비 없음. 모바일 전용 카드이고 발급수수료 2,000원이 있다. 캐시백은 지난달 실적 10만, 30만, 60만원 구간에 따라 통합 월 3천, 1만, 2만원 한도이고 편의점, 딜리버리, 대중교통, 커피는 구간별 1천, 2천, 4천원 한도도 따로 있다. 캐시백 소수점 이하는 절사한다. 초안의 대중교통 대상 업종에서 고속버스 제외를 뺐다. 이미 대상이 시내버스와 지하철뿐이라서다. 금쪽이 Young Hana+ 체크카드(94080)는 혜택이 같은 상품이라 이 카드로 등록한다.
