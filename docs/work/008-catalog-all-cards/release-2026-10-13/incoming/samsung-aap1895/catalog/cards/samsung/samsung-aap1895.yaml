        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: edu}
        tiers: {from: 400000}
        unmodeled: [이투스, 대성마이맥, 천재교과서(밀크T)는 가맹점 목록에 없어 담지 않았다, 캐시충전건과 인앱 결제는 할인하지 않는다]
      - key: overseas-1
        title: 해외 1% 할인
        source: manual
        evidence: ['전월 이용금액에 관계없이, 할인한도 없이 해외 가맹점 1% 결제일할인', 해외 온라인 거래 시 국내 전자지급결제대행업체(PG)를 통해 결제되는 경우 국내 가맹점으로 분류되어 할인 대상에서 제외, 해외겸용카드에 한해 제공]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: billing_discount, rate: 1}
    unmodeled: ['아모레퍼시픽 온라인몰(아모레몰, 이니스프리, 오설록) 이용 시 10% 뷰티포인트 적립과 해피오더, F&B, hy 1%·그 외 국내 가맹점 0.1% 뷰티포인트 적립은 안내장에 뷰티포인트의 원화 가치가 없어 담지 않았다', 많이 쓸수록 5%~20% 추가 할인은 당월 이용금액 40만원 이상과 당월 이용 영역 개수로 정해 다음 달 결제대금에서 차감한다. 전월 이용금액 구간으로 계산하는 이 앱 모델에 맞지 않아 담지 않았다, 삼성카드의 다른 결제일할인과 중복 적용되지 않고 할인 혜택이 큰 금액만 적용한다, '전월 이용금액은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 이동통신 등 정기결제)는 매출전표 접수일 기준이다', 후불교통기능이 탑재되어 발급된다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 시행일을 원문에서 찾지 못했다. 안내장 유의사항에 카드 신규 출시일이 2026년 3월 26일로 적혀 있다, assumed: '2026-03-26'}
  - {path: 'revisions[0].limits[happy-fnb]', question: '해피오더와 F&B, hy 정기결제와 일반결제가 각자 통합 월 할인한도 10,000원이라고 적혀 있어 같은 한도를 함께 쓰는지 따로 쓰는지 불분명하다', assumed: 월 한도 10000원을 함께 씀}
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-13 상품안내장 대조. 연회비 해외겸용 VISA와 국내전용 모두 15,000원(기본 7,000+제휴 8,000). 해피오더, F&B, hy 서비스는 전월 이용금액 40만원 이상일 때 월 한도 10,000원이고 발급월+1개월까지는 40만원 구간을 준다. 아파트·통신·쇼핑·교육 5% 할인은 40만원 이상 4,000원, 80만원 이상 8,000원이다.
