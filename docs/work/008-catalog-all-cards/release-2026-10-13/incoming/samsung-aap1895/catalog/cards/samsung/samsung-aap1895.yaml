        evidence: [학원/학습지/인터넷강의/온라인서점 5% 결제일할인, '인터넷강의 이투스, 메가스터디교육(메가스터디, 엠베스트, 엘리하이), 대성마이맥, 천재교과서(밀크T)', '온라인서점 YES24, 알라딘, 교보문고', '전월 이용금액대별 통합 월 할인한도 40만원 이상 4,000원, 80만원 이상 8,000원', 인터넷강의는 초/중/고 교육과정 관련 공식 홈페이지/앱을 통한 결제건에 한함, '온라인서점은 공식 홈페이지/앱을 통한 결제건에 한하며, 캐시충전건, 구글플레이, 앱스토어 등을 통한 결제건(인앱 결제) 제외']
        target:
