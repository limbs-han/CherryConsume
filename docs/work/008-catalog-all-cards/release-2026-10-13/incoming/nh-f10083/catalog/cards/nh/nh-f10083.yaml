schema_version: 2
id: nh-f10083
issuer: nh
name: NH FIT 신용할인형(경남FC)
short_name: NH FIT 경남FC
kind: credit
product_codes:
  - '90010152'
  - F10083
status: on_sale
annual_fees:
  - {scope: domestic, amount: 8000}
  - {scope: global, brand: mastercard, amount: 10000}
sources:
  - {id: page, kind: product_page, url: 'https://card.nonghyup.com/servlet/IpCc2021R.act?CD_WRS_SQNO=90010152', fetched_at: 2026-10-13}
checked_at: 2026-10-13
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 800000, 1200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      unmodeled: ['과태료, 연체료, 각종 수수료와 이자, 포인트 결제분은 실적과 할인에서 빠진다', 다른 NH농협카드 할인과 겹치면 큰 혜택 하나만 준다]
    limits:
      - key: total
        per: month
        amount: {300000: 10000, 800000: 20000, 1200000: 30000}
    benefits:
      - key: fuel-gs-caltex-60
        title: GS칼텍스 주유 리터당 60원 청구할인
        source: page
        evidence: ['주유 | GS칼텍스 주유소(LPG 포함) 리터당 60원 청구할인 월 2회, 1회 주유금액 10만원 이내']
        target:
          merchants: [gs_caltex]
        when:
          - {channel: offline}
        reward: {type: billing_discount, per_liter: 60}
        limits:
          - {per: month, count: 2}
          - {shared: total}
        tiers: {from: 300000}
        unmodeled: [1회 주유금액 10만원 이내만 대상이라 그 넘는 금액은 계산에 들어간다]
      - key: online-5
        title: 온라인 쇼핑 5% 청구할인
        source: page
        evidence: ['온라인 쇼핑 | G마켓, 11번가, 쿠팡, 티몬 5% 청구할인 월 2회, 건당 1만원 이상 이용 시 제공']
        target:
          merchants: [coupang, eleven_st, gmarket, tmon]
        when:
          - {channel: online}
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, count: 2}
          - {shared: total}
        tiers: {from: 300000}
      - key: coffee-5
        title: 커피 5% 청구할인
        source: page
        evidence: ['커피 | 스타벅스(사이렌오더포함), 이디야, 파리바게뜨 5% 청구할인 월 2회, 건당 1만원 이상 이용 시 제공']
        target:
          merchants: [ediya, paris_baguette, starbucks]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, count: 2}
          - {shared: total}
        tiers: {from: 300000}
        unmodeled: [스타벅스 사이렌오더도 대상인데 오프라인 조건 때문에 앱 결제는 계산하지 않는다]
      - key: convenience-5
        title: 편의점 5% 청구할인
        source: page
        evidence: ['편의점 | GS25, CU, 세븐일레븐 5% 청구할인 월 2회, 건당 1만원 이상 이용 시 제공']
        target:
          merchants: [cu, gs25, seven_eleven]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, count: 2}
          - {shared: total}
        tiers: {from: 300000}
      - key: delivery-5
        title: 배달앱 5% 청구할인
        source: page
        evidence: ['배달앱 | 배달의민족, 요기요 5% 청구할인 월 2회, 건당 1만원 이상 이용 시 제공']
        target:
          merchants: [baemin, yogiyo]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, count: 2}
          - {shared: total}
        tiers: {from: 300000}
      - key: movie-2000
        title: 영화 2,000원 청구할인
        source: page
        evidence: ['영화 | CGV/롯데시네마/메가박스 2천원 청구할인 월 1회, 건당 1만원 이상 결제 시']
        target:
          merchants: [cgv, lotte_cinema, megabox]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 2000}
        limits:
          - {per: month, count: 1}
          - {shared: total}
        tiers: {from: 300000}
      - key: mart-5
        title: 대형마트 5% 청구할인
        source: page
        evidence: ['대형마트 | 하나로마트/이마트/홈플러스/롯데마트 5% 청구할인 월 1회, 건당 5만원 이상 시 제공(단, 온라인매장 및 SSM 제외)']
        target:
          merchants: [emart, homeplus, lotte_mart, nh_hanaro_mart]
        when:
          - {channel: offline}
          - amount: {min: 50000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, count: 1}
          - {shared: total}
        tiers: {from: 300000}
      - key: transit-5
        title: 대중교통 5% 청구할인
        source: page
        evidence: [대중교통 | 버스/지하철 이용액의 5% 청구할인 매출표 접수일 기준으로 월 최대 2천원 할인]
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - billing: [postpaid_transit]
          - payment_not: [mobile_tmoney]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 2000}
          - {shared: total}
        tiers: {from: 300000}
      - key: overseas-2
        title: 해외 가맹점 2% 청구할인
        source: page
        evidence: [해외/직구 | 해외 가맹점(해외사이트 포함) 이용금액 2% 청구할인 건당 이용금액 2만원 이상 시 제공 통합 월 할인한도와 별도로 월 최대 10만원 할인]
        target: {all: true}
        when:
          - {region: overseas}
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 2}
        limits:
          - {per: month, amount: 100000}
        tiers: {from: 300000}
        unmodeled: [원문이 해외 할인에 전월실적 조건을 적었는지 불분명해 30만 구간부터로 두었다]
    unmodeled: [전국 주요 놀이공원 현장할인은 월 1회 연 6회 한도의 연 기준이 발급일인지 달력 연도인지 원문에 없어 뺐다, 경남FC 홈구장 입장권 3천원 할인은 티켓링크 결제 중 경남FC 입장권만 대상이라 뺐다, 경남FC 메가스토어 5~10% 현장할인은 품목별이라 뺐다, 해외 이용은 매출표 접수일 기준으로 실적에 들어간다, 가족카드는 발급되지 않는다]
open_questions:
  - {path: 'revisions[0].benefits[overseas-2].tiers', question: 해외 2% 할인에 전월실적 조건이 있는지 원문에 분명하지 않다., assumed: 30만 구간부터}
  - {path: 'revisions[0].effective_from', question: 시행일을 찾지 못해 수집일로 두었다., assumed: '2026-10-05'}
  - {path: 'revisions[0].benefits[online-5].when', question: 온라인 쇼핑은 공식 홈페이지와 앱 결제만 대상이라 온라인 채널로 두었다., assumed: online}
notes: 2026-10-13 공식 상품 페이지에서 옮겼다. 연회비는 신용 국내전용 8000, 마스터 10000. 혜택마다 월 횟수가 따로이고 통합 월 한도를 함께 쓴다. 체크카드 변형은 이 파일에 담지 않았다.
