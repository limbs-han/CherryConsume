notes: 2026-10-13 상품안내장(2023.1판, 심의필 제2023-C1a-00005호) 대조. 연회비 국내전용과 해외겸용 Mastercard 모두 20,000원(기본 7,000+제휴 13,000). 통신요금 할인은 정기결제 금액이 월 한도보다 적으면 결제 금액만큼 할인한다. 발급월+1개월까지는 30만원 미만이어도 30만 구간 혜택을 준다.
