open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2021-09-15이고 상품설명서는 2026년 3월 기준이다, assumed: '2026-10-12'}
notes: 2026-10-12 상품 페이지와 상품설명서(2026년 3월 기준) 대조. LOCA LIKIT Eat(lotte-p13943-a13943)과 같은 구조다. 지난달 40만원 이상이면 네 영역 60% 결제일 할인, 모든 혜택 통합 월 13,000원. 할인 혜택이 적용된 이용금액 전체가 실적에서 빠진다. 대중교통(버스, 지하철)은 시외·고속버스까지 실적에서 뺐다. 티몬은 상품 페이지에 아직 대상으로 적혀 있어 그대로 두었다.
