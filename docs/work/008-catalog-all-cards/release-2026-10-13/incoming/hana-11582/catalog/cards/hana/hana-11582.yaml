notes: 2026-10-13 공식 상품 페이지(상세 번호 CD_PD_SEQ=12519, 목록 상품 번호 11582, 준법심의 A-26-0403)에서 옮겼다. 연회비 없음, 발급수수료 2,000원은 다음 달 말일까지 1만원 이상 쓰면 돌려준다. 실적은 국내 가맹점 이용금액만 센다. 캐쉬백은 매달 이용금액에 대해 다음 달 10영업일 안에 결제계좌로 입금한다.
