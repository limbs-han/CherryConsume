notes: 2026-10-12 상품 페이지와 상품설명서(2022년 7월 기준) 대조. 공시 색인 id lotte-1772를 상품 코드 id로 바꿨다. 상품 페이지에 발급 중단 문구가 없다. 네이버페이 쇼핑엔로카 PLAN+(lotte-p14381-a14381)처럼 플랜할인 미이용 회원의 1% 결제일 할인만 계산한다. 할인 한도 없음. 가족카드는 발급하지 않는다. 실적 제외의 대중교통은 시외버스까지 빼 실적이 적게 잡히는 쪽으로 두었다.
