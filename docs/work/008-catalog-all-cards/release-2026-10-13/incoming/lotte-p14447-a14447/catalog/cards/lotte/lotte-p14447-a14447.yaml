notes: 2026-10-12 상품 페이지 대조. 출시일 2023-06-26. 상품설명서 PDF 주소는 공시 목록에 있으나 이름이 한글이라 페이지로 대조했다. 통신요금이 한도보다 적으면 요금만큼 할인이라 100% 할인에 월 한도로 적었다. 신규 발급 특례는 사용 등록일부터 다음 달 말일까지 10,000원 한도라 30만 구간으로 넣었다. 1~24개월이 발급월부터라 시작일은 발급일로 받는다. 가족카드는 발급하지 않는다.
