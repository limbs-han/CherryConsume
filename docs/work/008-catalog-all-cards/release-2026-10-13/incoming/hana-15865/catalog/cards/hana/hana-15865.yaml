        tiers: {from: 400000}
    unmodeled: [T멤버십 바코드를 쓴 11pay 오프라인 결제 20% 하나머니 적립은 T멤버십 앱 결제 수단을 입력으로 가릴 수 없어 계산하지 않는다, 무이자할부 서비스(국내 5만원 이상 2~3개월)는 계산하지 않는다, 가족카드 이용금액과 월 한도는 본인카드와 합산한다, '온가족 플러스(가족카드당 월 1만원 캐시백, 차년도 연회비 1만원 지원)는 가족카드 실적이 필요해 계산하지 않는다', 트래블로그 스위치로 해외결제를 외화 하나머니로 설정해 해외 이용하면 원더 서비스가 없다, 혜택플러스와 맞춤 혜택 조합 변경은 계산하지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 상품 페이지 준법심의 시작일을 잠정 시작일로 둔다., assumed: '2026-07-06'}
  - {path: 'revisions[0].benefits', question: 영역 혜택이 한 건에 겹칠 때의 처리를 원문이 적지 않았다. 대상 가맹점이 겹치지 않아 영향이 없다고 보았다., assumed: 겹침 없음}
  - {path: 'revisions[0].limits', question: SK 주유와 11번가 한도가 같은 4천 8천 1만2천원 한도를 같이 쓰는지 따로인지 원문이 분명하지 않다., assumed: 둘이 함께 쓴다}
  - {path: 'revisions[0].spend', question: 취소가 실적에서 빠지는 달. 원문에는 혜택을 매입 취소가 접수된 달에 차감한다는 문구만 있다., assumed: cancel_month}
notes: 2026-10-13 공식 상품 페이지(준법심의 A-26-2660)에서 옮겼다. 원더카드 2.0의 T 맞춤 혜택 조합이다. 연회비 19,900원(기본 12,000원, 제휴 7,900원). 실적은 지난달 국내외 일시불과 할부 이용금액. 혜택은 모두 하나머니 적립이고 1하나머니는 1원이다. 서비스 받은 매출은 실적에서 빠진다. 무이자할부 결제는 적립에서 제외된다.
