        evidence: ['적립 대상 : 이마트, 트레이더스 홀세일 클럽, 홈플러스, 롯데마트', '10% | 지난달 실적 40만원 이상 80만원 미만 | 4,000', '지난달 실적 80만원 이상 120만원 미만 | 8,000', '지난달 실적 120만원 이상 | 12,000', 오프라인 결제 건에 한하여 서비스가 제공됩니다., 트레이더스 홀세일 클럽을 제외한 창고형 할인매장(롯데마트 맥스 등)과 상설·임대 매장은 서비스에서 제외됩니다.]
