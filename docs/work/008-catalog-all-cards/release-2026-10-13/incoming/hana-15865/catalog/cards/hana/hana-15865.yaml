        evidence: ['적립 대상 : 카카오T, UT, 택시업종', '10% | 지난달 실적 40만원 이상 80만원 미만 | 4,000', '지난달 실적 80만원 이상 120만원 미만 | 8,000', '지난달 실적 120만원 이상 | 12,000', '카카오T, UT는 공식 앱에서 카드를 등록하고 미리 결제하는 방식에만 서비스가 제공되며, 현장결제 또는 나중에 결제하는 방식에는 서비스가 제외됩니다.']
