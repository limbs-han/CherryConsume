short_name: 웰스 삼성 할부
search_names: [웰스 라이트할부 삼성카드, 웰스 삼성카드 할부, 웰스 할부카드]
kind: credit
product_codes: [AAP1709]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 15000}
  - {scope: global, brand: visa, amount: 15000}
sources:
