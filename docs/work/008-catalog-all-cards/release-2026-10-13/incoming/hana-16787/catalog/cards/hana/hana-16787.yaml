notes: 2026-10-13 공식 상품 페이지(준법심의 A-26-0328)에서 옮겼다. 연회비 국내전용과 Mastercard 모두 20,000원. 하나머니 1하나머니 = 1원, 소수점 이하 반올림. 해외 신용 결제 이용에는 해외서비스수수료 0.2%와 국제브랜드수수료 1.0%가 붙는다.
