    benefits:
      - key: bodyfriend-rental
        title: 바디프랜드 렌탈료 자동이체 청구할인
        source: manual
        evidence: ['30만원 이상 13,000원 / 70만원 이상 17,000원 / 120만원 이상 23,000원', Smart Living 에브리바디 롯데카드로 바디프랜드/에브리알 가전제품 렌탈료 자동이체시에만 할인혜택을 받으실 수 있습니다., 할인금액이 렌탈요금보다 큰 경우 렌탈요금 청구금액까지만 할인받으실 수 있으며, 이용실적 제외 대상 - 렌탈료 할인 받으신 이용건(렌탈료 전액)]
        target:
          merchants: [bodyfriend_rental]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {300000: 13000, 700000: 17000, 1200000: 23000}
        tiers: {from: 300000}
        exclude_applied: 1
    unmodeled: [에브리알 가전제품 렌탈료도 할인 대상이지만 공통 가맹점이 없어 계산하지 않는다, 대상 가맹점에 적용되는 롯데카드의 다른 청구할인과 중복 할인하지 않는다, 실적과 할인 한도는 본인과 가족카드를 합산한다, 현금서비스·카드론·수수료·이자는 실적에서 빠진다, 신규 발급 특례 기간의 사용등록 달 실적은 사용등록일부터 말일까지로 센다]
open_questions:
  - {path: product_codes, question: 롯데카드 온라인 판매 목록에 상품 코드가 없어 id를 공시 색인 번호로 두었다. 제휴 채널 전용 판매로 보인다, assumed: '[]'}
  - {path: 'revisions[0].effective_from', question: 공시된 설명서가 2021년 9월 기준이라 그 뒤 바뀐 조건이 있는지 확인하지 못했다. 시행일은 원문 확인일로 두었다. 카드 출시일은 2017-10-16이다, assumed: '2026-10-12'}
notes: 2026-10-12 상품설명서(2021년 9월 기준) 대조. 연회비 국내전용 12,000원, 해외겸용(Master) 15,000원, 가족카드 면제. 렌탈료가 할인액보다 적으면 그 금액까지라 100% 할인에 월 한도로 적었다. 실적 제외 목록에 무이자할부, 공과금, 상품권이 없어 실적에 넣는다. 신규 발급 특례는 카드사용등록일부터 다음 달 말일까지 13,000원이라 30만 구간이다.
