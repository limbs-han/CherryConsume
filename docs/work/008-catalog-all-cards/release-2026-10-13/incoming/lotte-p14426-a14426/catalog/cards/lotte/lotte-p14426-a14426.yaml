notes: 2026-10-12 상품 페이지와 상품설명서(2023년 4월 기준) 대조. 출시일 2023-04-01. 네이버페이 쇼핑엔로카 PLAN+(lotte-p14381-a14381)와 같은 짜임으로 옮겼다. 플랜할인 미이용 회원의 1% L.POINT 적립만 계산하고 플랜할인 이용은 선택지로 두고 계산하지 않는다. 적립한도 없음. 가족카드는 발급하지 않는다.
