open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못해 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-12'}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 옮겼다. 티타늄(kb-09251)과 같은 구조이고 연회비, 구간(50만·100만), 한도(5천·1만점), Pick 영역 8개, 알뜰폰 제외가 다르다. 연회비는 일반카드 합계 2만원이고 모바일 단독은 1만4천원이다.
