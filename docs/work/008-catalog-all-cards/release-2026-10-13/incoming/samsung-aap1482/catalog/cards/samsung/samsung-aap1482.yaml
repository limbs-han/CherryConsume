open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품안내장 판(2025.9)의 첫날로 두었다, assumed: '2025-09-01'}
  - {path: 'revisions[0].spend.exclude_categories', question: 이 상품안내장에 전월 이용금액 제외 대상 목록이 없어 삼성카드 공통 목록으로 두었다. 목록이 더 적으면 실적이 늘 수 있다, assumed: 삼성카드 공통 제외 목록}
  - {path: 'revisions[0]', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].spend.interest_free', question: 무이자할부의 실적 처리가 상품안내장에 없다, assumed: count}
notes: 2026-10-13 상품안내장(2025.9판, 심의필 2025-C1a-13486호) 대조. 연회비 해외겸용 Mastercard, VISA, JCB와 국내전용 모두 10,000원(기본 7,000+제휴 3,000). 영화 할인과 주유 할인은 전월 이용금액에서 혜택이 적용된 주유소·충전소 이용금액을 뺀다. 할인이 적용된 이용금액에는 빅포인트를 적립하지 않아 주유 할인과 기본 적립을 한 묶음에 두었다.
