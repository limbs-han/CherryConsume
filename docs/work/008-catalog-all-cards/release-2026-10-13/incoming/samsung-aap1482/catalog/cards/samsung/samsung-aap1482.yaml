        evidence: [주유소 및 LPG충전소에서 5만원 이상 결제 시 2, 000원 결제일할인(청구할인), 전월 일시불 및 할부 이용금액 50만원 이상 시, 일 1회 월 4회 제공, 휘발유 경유 LPG 이용금액에 한해 혜택이 제공됩니다, 발급월+1개월까지는 전월 이용금액에 관계없이 제공됩니다]
