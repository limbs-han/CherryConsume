open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 상품 페이지 준법심의일을 잠정 시작일로 둔다., assumed: '2026-06-26'}
  - {path: 'revisions[0].benefits[taxi-app-20].when', question: 택시와 딜리버리와 디지털라이프는 군 급여이체 조건 충족 시 제공이라 적었다. 지난달 실적 10만원 이상으로 받는 Basic 서비스에도 같은 항목이 있어 급여이체 없이 받을 수 있는지 원문 요약이 겹친다., assumed: 급여이체가 있어야 받음}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문 실적 제외에 그 외 공과금이 들어 있어 utility 전체를 뺐다., assumed: utility 전체}
  - {path: 'revisions[0].benefits[basic-longhaul-5].target', question: 광역교통 대상에 시외버스와 고속버스 업종 전체를 넣었다. 원문 대상은 기차와 고속시외버스다., assumed: 철도와 고속버스와 시외버스}
notes: 2026-10-13 공식 상품 페이지(준법심의 A-26-2543)에서 옮겼다. 연회비 없음, Visa. 출시 2025-12-15. Basic 서비스는 지난달 실적 10만원 이상부터 통합 월 한도가 5천, 1만, 2만, 3만, 5만원이다. 군마트와 쿠팡 네이버플러스스토어 혜택은 실적과 관계없다. 한 사람이 여러 장을 가져도 혜택 기준은 회원 단위다. 후불교통 요금은 매출이 접수된 달의 이용금액에 들어간다.
