        target:
          categories: [sports.golf]
        when:
          - amount: {min: 20000}
        reward: {type: points, program: kb_pointree, rate: 5}
        limits:
          - per: month
            amount: {300000: 3000, 500000: 6000}
        tiers: {from: 300000}
        unmodeled: [사우나·목욕탕·찜질방 5% 적립은 같은 한도를 쓰지만 업종이 없어 담지 않았다]
      - key: insurance-2000
        title: 보험료 건당 10만원 이상 2천점 적립
        source: page
        evidence: ['보험료 (생명,손해, 기타 보험) 2천점 2천점 이용금액 건당 10만원 이상 시 2천점 적립', 실적유예기간 미적용(전월이용실적 충족 시에만 제공)]
        target:
          categories: [insurance.private]
        when:
          - amount: {min: 100000}
        reward: {type: points, program: kb_pointree, fixed: 2000}
        limits:
          - {per: month, count: 1}
        tiers: {from: 300000}
