        source: page
        evidence: [국내 가맹점 이용금액의 1%를 포인트리로 적립해 드립니다.전월 이용실적 조건 및 적립한도가 없습니다., '[국내 가맹점 적립 제외 대상] HERITAGE Exclusive ''골프백 딜리버리 서비스, 의료 동행 서비스, 밀리의서재 12개월 정기구독'' 할인 받은 이용건(해당 이용금액 전체), 무이자할부 이용금액, 단기카드대출(현금서비스), 장기카드대출(카드론), 국세, 지방세, 각종 공과금(전기/수도 등), 아파트관리비, 정부지원금(보육료/유치원보조비/바우처 이용금액 등), 초·중·고 학교 납입금 전체(수업료/교육비/현장학습비/급식비), 대학(대학원)등록금, 4대 사회보험료(건강/연금/고용/산재), 각종 수수료 및 이자, 연체료, 연회비, 상품권 및 선불카드(선불전자지급수단 포함) 구입·충전금액, 신차구매청구(환급) 할인 전표 전체, 해외이용 전표 전체, 취소금액']
        target:
          exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, insurance.social, tax, utility]
          all: true
        when:
          - {region: domestic}
        reward: {type: points, program: kb_pointree, rate: 1}
