      - key: special-1
        title: 항공·면세점·골프장·호텔 1% 추가 적립
        source: page
        evidence: [항공/면세점/골프장/호텔 업종 이용금액의 1%를 포인트리로 추가 적립해 드립니다.＇국내 가맹점 1% + 특화 영역 1%＇ 중복 적용 가능 합니다.전월 이용실적 조건 및 적립한도가 없습니다., 당사 등록된 가맹점 업종 기준 제공되며, 별도의 전용 가맹점번호로 승인 처리되는 일부 간편페이(Pay) 이용 금액 제외, '[특화 영역 적립 제외 대상] 무이자할부 이용금액, 상품권 및 선불카드(선불전자지급수단 포함) 구입·충전금액, 취소금액']
