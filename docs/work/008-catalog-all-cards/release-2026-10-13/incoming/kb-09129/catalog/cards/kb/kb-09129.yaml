        when:
          - {region: domestic}
        reward: {type: points, program: kb_pointree, rate: 1}
        stack: special
        notes: 해외 가맹점에도 붙는지 원문이 모호해 덜 주는 쪽으로 국내만 담았다
      - key: overseas-3
        title: 해외 가맹점 3% 포인트리 적립
        source: page
        evidence: [해외 가맹점 이용금액의 3%를 포인트리로 적립해 드립니다.전월 이용실적 조건 및 적립한도가 없습니다., '[해외 가맹점 적립 제외 대상] 무이자할부 이용금액, 국내이용 전표 전체, 취소금액']
        target: {all: true}
        when:
