    unmodeled: ['연 1회 쿠폰 2가지(골프클럽 이용권, 호텔 멤버십, 대한항공 좌석 승급, 동반자 항공권, 리무진 이용권)는 연간 이용실적 조건이 있어 계산하지 않는다', 골프백 딜리버리·의료 동행·밀리의 서재 구독권 100% 청구할인과 그 결제의 국내 적립 제외는 지정 예약처 결제라 계산하지 않는다, '롯데호텔 객실 20~30%와 F&B 10% 할인, 발레파킹은 담을 가맹점이 없어 계산하지 않는다', THE LOUNGE와 Visa Infinite 라운지·발레파킹 서비스는 결제 혜택이 아니라 계산하지 않는다, 신차구매 청구할인 전표는 국내 적립에서 빠진다, 정부지원금 결제는 적립에서 빠진다]
