        source: page
        evidence: ['스타벅스, 투썸플레이스, 폴바셋 5천원 결제일 할인', 건당 1만원 이상 이용 시 할인 혜택이 제공됩니다., 현장 결제 건에 한해 제공되며, '커피 5,000원 15,000원 25,000원']
        target:
          merchants: [paul_bassett, starbucks, twosome]
        when:
          - amount: {min: 10000}
          - {channel: offline}
        reward: {type: billing_discount, fixed: 5000}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 15000, 1500000: 25000}
        tiers: {from: 500000}
      - key: delivery
        title: 배달의민족·요기요 1천원 결제일 할인
