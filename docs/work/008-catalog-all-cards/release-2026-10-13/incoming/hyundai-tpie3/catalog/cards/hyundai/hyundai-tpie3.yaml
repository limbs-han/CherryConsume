schema_version: 2
id: hyundai-tpie3
issuer: hyundai
name: the Pink Edition3
short_name: 현대 the Pink Ed3
search_names: [the Pink Ed3, the Pink Edition3, 더 핑크 에디션3]
kind: credit
product_codes: [TPIE3]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 200000}
  - {scope: global, brand: visa, amount: 200000}
sources:
  - {id: page, kind: product_page, url: 'https://www.hyundaicard.com/cpc/cr/CPCCR0201_01.hc?cardWcd=TPIE3', fetched_at: 2026-10-05}
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/20260824_%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81_the%20Pink%20Edition3.pdf', fetched_at: 2026-10-13}
checked_at: 2026-10-13
revisions:
  - effective_from: 2026-08-24
    source: manual
    tiers: [0, 500000, 1000000]
    spend:
      exclude_categories: [annual_fee, gift_card, prepaid_charge, tax, utility]
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
    new_card: {until: next_month_end, tier: 1000000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [고속도로 통행 요금과 후불하이패스 카드 이용 금액은 적립에서 뺀다, 현대카드의 다른 할인이 적용된 결제는 적립에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 적립에서 뺀다, 부분 무이자 할부는 수수료를 내는 개월의 이용 금액만 적립한다]
    limits:
      - {key: dept-5, per: month, amount: 50000}
      - {key: fashion-5, per: month, amount: 30000}
      - {key: online-5, per: month, amount: 20000}
    stacks:
      - key: main
        pick: priority
        order: [dept-5, fashion-5-any, fashion-5-online, online-5, base-15]
        spill: split
    benefits:
      - key: base-15
        title: 국내외 가맹점 1.5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 50만원 이상 시 국내외 가맹점 1.5% M포인트 적립, 월 적립 한도 없음, 추가 혜택 적용 시 기본 혜택은 중복 제공되지 않음, 매출 건별로 소수점 이하 반올림 후 적립, '4,639x1.5% = 69.58의 소수점 이하 반올림 70 M포인트']
        target: {all: true}
        reward: {type: points, program: hyundai_m_point, rate: 1.5, round: round}
        tiers: {from: 500000}
      - key: dept-5
        title: 백화점·프리미엄 아울렛 5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 백화점/프리미엄 아울렛, 패션/뷰티, 온라인몰 영역 5% M포인트 적립, '백화점/프리미엄 아울렛 : 현대백화점, 롯데백화점, 신세계백화점, 갤러리아백화점, 현대 프리미엄 아울렛, 롯데 프리미엄 아울렛, 신세계사이먼 프리미엄 아울렛', 월 적립 한도 5만 M포인트, 월 적립 한도 초과 시 기본 혜택 적립률 적용, 추가 혜택은 대상점별 국내 가맹점에 한해 제공]
        target:
          merchants: [galleria, hyundai_department, hyundai_premium_outlet, lotte_department, lotte_premium_outlet, shinsegae_department, shinsegae_premium_outlet]
        when:
          - {region: domestic}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: dept-5}
        tiers: {from: 1000000}
        unmodeled: [백화점·아울렛의 온라인몰·주차장·문화센터·임대 매장 이용은 5%에서 빠지고 기본 1.5%만 적립한다]
      - key: fashion-5-any
        title: 무신사·유니클로·ZARA·올리브영 5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 백화점/프리미엄 아울렛, 패션/뷰티, 온라인몰 영역 5% M포인트 적립, '패션/뷰티 온·오프라인 : 무신사, 유니클로, ZARA, 올리브영', 월 적립 한도 3만 M포인트, 월 적립 한도 초과 시 기본 혜택 적립률 적용, ZARA의 경우 ZARA HOME 결제 건은 국내외 가맹점으로 구분되어 기본 혜택 적용, 오프라인 대상점은 백화점·할인점·쇼핑몰 및 일부 기차 역사 등에 입점된 매장 이용 시 기본 혜택 적용]
        target:
          merchants: [musinsa, olive_young, uniqlo, zara]
        when:
          - {region: domestic}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: fashion-5}
        tiers: {from: 1000000}
        unmodeled: [백화점·할인점·쇼핑몰·기차 역사 안에 입점한 오프라인 매장은 5%에서 빠지고 기본 1.5%만 적립한다, 온라인은 대상점 공식 홈페이지와 앱 안의 결제만 5%이고 연결된 다른 사이트나 앱에서 결제하면 기본 1.5%만 적립한다]
      - key: fashion-5-online
        title: 29CM·W컨셉·KREAM 온라인 5% M포인트 적립
        source: manual
        evidence: ['패션/뷰티 온라인 : 29CM, W컨셉, KREAM', 월 적립 한도 3만 M포인트, 그 외 대상점은 온라인 결제 건에 한해 적용, 온라인은 대상점 공식 홈페이지 및 앱 내 결제 건에 한해 추가 혜택 적용]
        target:
          merchants: [kream, twentynine_cm, wconcept]
        when:
          - {region: domestic, channel: online}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: fashion-5}
        tiers: {from: 1000000}
        unmodeled: [대상점 공식 홈페이지와 앱 안의 결제만 5%이고 연결된 다른 사이트나 앱에서 결제하면 기본 1.5%만 적립한다]
      - key: online-5
        title: 네이버플러스 스토어·쿠팡·컬리 5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 백화점/프리미엄 아울렛, 패션/뷰티, 온라인몰 영역 5% M포인트 적립, '온라인몰 : 네이버플러스 스토어, 쿠팡, 컬리', 월 적립 한도 2만 M포인트, 쿠팡의 경우 쿠팡이츠 결제 건은 국내외 가맹점으로 구분되어 기본 혜택 적용, 네이버플러스 스토어의 경우 네이버 도메인(naver.com)으로 확인되는 가맹점에 한해 추가 혜택 적용]
        target:
          merchants: [coupang, kurly, naver_plus_store]
          exclude_merchants: [coupang_eats]
        when:
          - {region: domestic, channel: online}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: online-5}
        tiers: {from: 1000000}
        unmodeled: [대상점 공식 홈페이지와 앱 안의 결제만 5%이고 연결된 다른 사이트나 앱에서 결제하면 기본 1.5%만 적립한다, 네이버플러스 스토어는 naver.com 도메인으로 확인되는 가맹점만 5%다]
    unmodeled: [PG결제나 간편결제 가맹점명으로 승인된 결제는 영역 5%에서 빠지고 기본 1.5%만 적립한다, 영역별 적립 한도는 본인과 가족 카드를 합산한다, 적립은 결제 순서가 아니라 현대카드 매출전표 접수 순서로 한도를 쓴다, 실적은 본인과 가족 카드를 합산한다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, 연간 보너스 바우처 15만원권은 첫해 누적 100만원 이상 다음 해부터 전년도 1, 200만원 이상 조건이라 계산하지 않는다, 공항 라운지와 발레파킹은 결제 혜택이 아니다, M 긴급적립은 선지급 포인트 서비스라 계산하지 않는다]
open_questions:
  - {path: product_codes, question: 상품 코드는 수집한 상품 페이지 주소의 cardWcd를 따랐다, assumed: '[TPIE3]'}
notes: 2026-10-13 공식 가이드북(2026-08-24판) 대조. 연회비 국내전용과 국내외겸용(Visa Signature) 200,000원(기본 30,000+제휴 170,000), 가족카드 50,000원. 전월 50만 이상 국내외 1.5% M포인트 한도 없음. 전월 100만 이상 백화점·아울렛(월 5만P), 패션·뷰티(월 3만P), 온라인몰(월 2만P) 5% M포인트이고 한도를 넘은 금액은 기본 1.5%다. 건별 소수점 이하 반올림. 실적 제외는 카드론·연회비·수수료·공과금(전기·가스·수도 포함)·상품권·선불카드이고 무이자 할부와 할인 받은 결제는 실적에 든다. 적립 제외는 카드사 기본에 월세를 더했다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 100만 구간 적립. 해외 이용 적립은 국내외겸용 카드에 한한다.
