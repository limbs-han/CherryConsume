notes: 2026-10-12 상품설명서(2025년 7월 기준, 여신금융협회 심의필 제2025-C1a-10593호) 대조. 출시일 2020-03-06. 연회비 국내전용과 해외겸용(MASTER, AMEX) 25,000원, 가족카드 연회비 없음. 지난달 40만원 이상 8,000원, 80만원 이상 13,000원 SKT 자동납부 결제일 할인. 신규 발급 특례는 카드사용등록일부터 다음 달 말일까지 8,000원이라 40만 구간으로 넣었다. 대중교통과 택시는 실적 제외 목록에 없어 실적에 넣었다. 시행일은 설명서 기준월로 추정했다.
