      - {key: telecom, per: month, amount: 5000}
      - {key: convenience, per: month, amount: 5000}
      - {key: online, per: month, amount: 5000}
    benefits:
      - key: fuel-10
        title: HD현대오일뱅크 주유 10% 할인
        source: manual
        evidence: [HD현대오일뱅크 10% 할인, HD현대오일뱅크 주유(충전)소에서 주유 시 10% 결제일할인, 주유 주유소, LPG충전소, '전월 이용금액대별 통합 월 할인한도 40만원 이상 15,000원, 80만원 이상 25,000원, 120만원 이상 35,000원']
        target:
          merchants: [hd_oilbank]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: fuel}
        tiers: {from: 400000}
      - key: telecom-5
        title: 통신요금 정기결제 5% 할인
        source: manual
        evidence: [통신 5% 할인, 통신요금 정기결제 시 5% 결제일할인, '이동통신 SKT/KT/LG U+/알뜰폰(SK텔링크, KT스카이라이프, KT M모바일, 헬로모바일, 미디어로그) 이동통신요금', '인터넷, 유선통신 SK브로드밴드/KT/LG U+ 인터넷/유선통신요금', '통합 월 할인한도 5,000원, 전월 이용금액 40만원 이상 시 제공', '알뜰폰은 결합상품요금, 휴대폰 등 단말기 구매금액 및 대리점 카드 결제건 제외', '인터넷, 유선통신은 사물인터넷(IoT)관련 요금, 휴대폰 등 단말기 구매금액 및 대리점 카드 결제건 제외']
        target:
          merchants: [hello_mobile, kt, kt_m_mobile, kt_skylife, lg_uplus, media_log, sk_broadband, sk_telink, skt]
        when:
          - billing: [autopay, subscription]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: telecom}
        tiers: {from: 400000}
        unmodeled: [결합상품요금, 사물인터넷(IoT) 요금, 단말기 구매금액, 대리점 카드 결제건은 할인하지 않는다]
      - key: convenience-5
        title: 편의점 5% 할인
        source: manual
        evidence: [편의점 5% 결제일할인, 편의점 CU, GS25, 세븐일레븐, 이마트24, '통합 월 할인한도 5,000원, 전월 이용금액 40만원 이상 시 제공', '오프라인 결제건에 한하며, 백화점, 할인점, 쇼핑몰 등의 임대매장은 제외']
        target:
          merchants: [cu, emart24, gs25, seven_eleven]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: convenience}
        tiers: {from: 400000}
        unmodeled: [백화점·할인점·쇼핑몰 임대매장은 할인하지 않는다]
      - key: online-5
        title: 온라인쇼핑몰 5% 할인
        source: manual
        evidence: [온라인쇼핑몰 5% 결제일할인, 온라인쇼핑몰 쿠팡, 네이버플러스 스토어, SSG.COM, 롯데ON, G마켓, 옥션, 11번가, 삼성카드 쇼핑, '통합 월 할인한도 5,000원, 전월 이용금액 40만원 이상 시 제공']
        target:
          merchants: [auction, coupang, eleven_st, gmarket, lotte_on, naver_plus_store, samsung_card_shopping, ssg_com]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: online}
        tiers: {from: 400000}
    unmodeled: [삼성카드의 다른 결제일할인과 중복 적용되지 않고 할인 혜택이 큰 금액만 적용한다, '차량 점검 서비스(엔진오일 교환 현장할인, 안전점검, 타이어 펑크 수리, 위치 교환)는 연 단위 횟수 혜택이라 담지 않았다', 가맹점 정보가 결제대행업체(PG)나 간편결제 전용 가맹점으로 확인되면 업종 할인 대상에서 빠진다, HD현대오일뱅크 주유(충전)소 이용금액은 전월 이용금액에서 빠진다. 앱은 모든 주유 업종을 뺐다, '전월 이용금액은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 이동통신 등 정기결제)는 매출전표 접수일 기준이다', 후불교통기능이 탑재되어 발급된다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 안내장에 판 표시나 시행일이 보이지 않아 수집일로 두었다, assumed: '2026-10-05'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외는 HD현대오일뱅크 주유소 이용금액뿐인데 가맹점 단위로 뺄 수 없어 주유 업종 전체를 뺐다. 대중교통 범위는 시내버스와 지하철로 두었다, assumed: 'fuel, transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-13 상품안내장 대조. 연회비 해외겸용 VISA와 국내전용 모두 15,000원(기본 7,000+제휴 8,000). 발급월+1개월까지는 40만원 구간 혜택을 준다. 후불교통, 모바일교통, 택시 이용금액도 전월 이용금액에서 뺀다.
