        target:
          merchants: [bulgogi_brothers]
        reward: {type: onsite_discount, rate: 20}
        limits:
          - {per: month, count: 1}
          - {per: month, amount: 10000}
        tiers: {from: 200000}
        unmodeled: [백화점과 아울렛 입점 매장은 제외될 수 있다]
    unmodeled: [CGV 현장할인은 연 6회 한도의 기준 연도를 원문이 밝히지 않아 계산하지 않는다, 롯데렌터카 할인과 항공 숙박 할인과 면세점 쿠폰은 계산하지 않는다, 놀이공원 할인은 발급월에 제공하지 않고 자유이용권 여부를 결제로 알 수 없어 계산하지 않는다, 탄소포인트 에코마일리지 적립과 ATM 수수료 면제와 환전 우대는 결제 혜택이 아니라 계산하지 않는다, 가족카드 이용실적은 본인 실적과 합산하지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시작일을 찾지 못해 수집한 날로 두었다, assumed: '2026-10-13'}
  - {path: 'revisions[0].spend.exclude_categories', question: 페이지가 전월 실적 제외 항목을 따로 적지 않아 다른 IBK 체크카드처럼 공과금 상품권 세금 관리비를 뺐다, assumed: 'apartment_fee, gift_card, prepaid_charge, tax, utility'}
notes: 2026-10-13 expand21 조사. 적립은 TOP포인트이고 건당 금액에 따라 비율이 다르며 실적 조건이 없다. 20만원 이상 구간은 외식 영화 놀이공원 ATM 서비스에만 걸린다
