        target:
          merchants: [emart, homeplus, lotte_mart, nh_hanaro_mart, traders]
        when:
          - {channel: offline}
        reward: {type: points, program: samsung_bigpoint, rate: 10}
        limits:
          - {shared: mart}
        tiers: {from: 1000000}
        unmodeled: [쇼핑 외 결제(상품권, 주차장 등)와 임대매장은 적립하지 않는다]
      - key: online-10
        title: 온라인쇼핑몰 10% 빅포인트 적립
        source: manual
        evidence: ['온라인쇼핑몰 쿠팡, SSG.COM, G마켓, 옥션, 11번가, 삼성카드 쇼핑 10,000P', 전월 이용금액 100만원 이상 시 제공]
        target:
          merchants: [auction, coupang, eleven_st, gmarket, samsung_card_shopping, ssg_com]
        reward: {type: points, program: samsung_bigpoint, rate: 10}
        limits:
          - {shared: online}
        tiers: {from: 1000000}
      - key: fuel-10
        title: 주유 10% 빅포인트 적립
        source: manual
        evidence: ['주유 주유소, LPG충전소, 전기차충전소 10,000P', 전월 이용금액 100만원 이상 시 제공]
        target:
          categories: [fuel]
        reward: {type: points, program: samsung_bigpoint, rate: 10}
        limits:
          - {shared: fuel}
        tiers: {from: 1000000}
        unmodeled: [전기차 충전소는 대상 사업자 목록과 멤버십 등록 조건이 있어 담지 않았다]
      - key: life-3-bill
        title: 아파트 관리비·이동통신 3% 빅포인트 적립
        source: manual
        evidence: [아파트 관리비/이동통신 정기결제 시 3% 빅포인트 적립, '통합 월 적립한도 : 5,000P', 전월 이용금액 50만원 이상 시 제공, '알뜰폰은 결합상품요금, 휴대폰 등 단말기 구매금액 및 대리점 카드 결제건 제외']
        target:
          categories: [apartment_fee]
          merchants: [hello_mobile, kt, kt_m_mobile, kt_skylife, lg_uplus, media_log, sk_telink, skt]
        when:
          - billing: [autopay, subscription]
        reward: {type: points, program: samsung_bigpoint, rate: 3}
        limits:
          - {shared: life-3}
        tiers: {from: 500000}
        unmodeled: [알뜰폰 결합상품요금, 단말기 구매금액, 대리점 카드 결제는 적립하지 않는다]
      - key: life-3-academy
        title: 학원 3% 빅포인트 적립
        source: manual
        evidence: [학원/인터넷강의/학습지 3% 빅포인트 적립, 학원 입시/보습/외국어/예체능계 학원, '통합 월 적립한도 : 5,000P', 전월 이용금액 50만원 이상 시 제공, 학원은 오프라인 결제건에 한함]
        target:
          categories: [education.academy]
        when:
          - {channel: offline}
        reward: {type: points, program: samsung_bigpoint, rate: 3}
        limits:
          - {shared: life-3}
        tiers: {from: 500000}
      - key: life-3-study
        title: 인터넷강의·학습지 3% 빅포인트 적립
        source: manual
        evidence: ['인터넷강의 이투스, 메가스터디교육(메가스터디, 엠베스트, 엘리하이), 대성마이맥, 천재교과서(밀크T)', '학습지 웅진씽크빅, 교원, 대교, 한솔교육', 인터넷강의는 초/중/고 교육과정 관련 공식 홈페이지/앱을 통한 결제건에 한함]
        target:
          merchants: [daekyo, hansol_education, kyowon, megastudy, woongjin_thinkbig]
        reward: {type: points, program: samsung_bigpoint, rate: 3}
        limits:
          - {shared: life-3}
        tiers: {from: 500000}
        unmodeled: [인터넷강의는 초·중·고 교육과정 공식 홈페이지·앱 결제만 적립하고 이투스, 대성마이맥, 밀크T는 가맹점이 없어 담지 않았다]
      - key: spay-1
        title: 삼성페이 국내 오프라인 1% 빅포인트 적립
        source: manual
        evidence: ['전월 이용금액에 관계없이, 적립한도 없이 국내 오프라인 가맹점에서 삼성페이로 결제 시 1% 빅포인트 적립', 삼성월렛(구 삼성페이) 앱을 통한 간편결제건에 한함]
        target: {all: true}
        when:
          - {region: domestic}
          - {channel: offline}
          - payment: [samsung_pay]
        reward: {type: points, program: samsung_bigpoint, rate: 1}
        stack: spay
      - key: overseas-1
        title: 해외 1% 빅포인트 적립
        source: manual
        evidence: ['전월 이용금액에 관계없이, 적립한도 없이 해외 1% 빅포인트 적립', 해외 가맹점 및 해외 직접구매 이용건, 해외겸용카드에 한해 제공]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: points, program: samsung_bigpoint, rate: 1}
    unmodeled: ['연간 이용금액 1,500만원 이상 3만원, 2,500만원 이상 5만원의 다음 해 연회비 할인은 계산하지 않는다', 10% 영역과 3% 영역은 삼성페이 1% 적립과 중복 적용된다, '전월 이용금액은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다', 후불·모바일 교통 결제건은 실적에서 빠지는데 시내버스와 지하철만 업종으로 뺐다]
open_questions:
  - {path: annual_fees, question: '연회비 표의 국내전용 칸이 비어 있어 해외겸용 5만원(기본 7,000+제휴 43,000)만 적었다. 브랜드는 Mastercard, VISA, JCB다', assumed: global only}
  - {path: status, question: 상품 페이지가 자바스크립트로 그려져 판매 상태를 다시 확인하지 못해 색인 값 on_sale을 두었다, assumed: on_sale}
notes: 2026-10-13 상품안내장(2025.9판, 심의필 제2025-C1a-13487호) 확인. 2024-07-26 출시. 4대 생활 영역 10%는 영역마다 월 10,000P 한도이고 전월 100만원 이상, 아파트 관리비·이동통신과 교육 3%는 통합 월 5,000P 한도에 전월 50만원 이상이다. 삼성페이 국내 오프라인 1%와 해외 1%는 실적과 한도 없이 준다. 1포인트는 1원이다.
