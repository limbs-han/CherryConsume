open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2023년 7월 3일 출시만 적었다., assumed: '2026-10-12'}
  - {path: 'revisions[0].limits[integrated].amount', question: 원문의 통합할인한도 표는 20만원 이상부터다. 실적 없이 받는 커피 할인은 커피 월 한도 3천원만 적용되는 것으로 두었다., assumed: 3000}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 노리2 체크카드와 같은 계열이 아니어서 실적과 한도를 합산하지 않는다. 할인은 환급할인이다.
