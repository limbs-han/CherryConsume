schema_version: 2
id: hana-17771
issuer: hana
name: JADE First Centum
short_name: 하나 JADE First Centum
search_names: [JADE 퍼스트 센텀, 제이드 퍼스트 센텀]
kind: credit
product_codes:
  - '17771'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 995000}
  - {scope: global, brand: visa, amount: 1000000}
sources:
  - {id: page, kind: product_page, url: 'https://www.hanacard.co.kr/OPI41000000D.web?schID=pcd&mID=PI41017771P&CD_PD_SEQ=17771', fetched_at: 2026-10-13, review_no: L-24-0075}
checked_at: 2026-10-13
revisions:
  - effective_from: 2024-05-31
    effective_from_estimated: true
    source: page
    tiers: [0, 500000, 2000000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      installment: full_at_purchase
      cancellation: cancel_month
    new_card: {until: next_month_end, tier: 500000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
    limits:
      - {key: special, per: month, amount: 100000}
      - {key: fuel, per: month, amount: 30000}
    stacks:
      - key: main
        pick: priority
        order: [fuel-200, special-overseas, special-airline, special-dutyfree, special-travel, special-hana-tour-offline, base-1-5, base-1]
        spill: split
    benefits:
      - key: fuel-200
        title: 주유 리터당 200 하나머니 적립
        source: page
        evidence: ['주유(LPG포함) | SK에너지, GS칼텍스, S-Oil, HD현대오일뱅크, 알뜰주유소 | 리터당 200머니 | 월 통합 3만 하나머니', 주유(LPG포함) 이용금액은 SK에너지 고시 휘발유가 기준으로 주유 리터 환산하여 적립 제공]
        target:
          merchants: [altteul_fuel, gs_caltex, hd_oilbank, s_oil, sk_energy]
        reward: {type: points, program: hana_money, per_liter: 200}
        limits:
          - {shared: fuel}
        tiers: {from: 500000}
        unmodeled: [리터는 SK에너지 고시 휘발유가로 환산한다. 앱은 공통 기름값 기준값으로 환산한다, EV 충전 50% 적립은 대상 충전소 목록을 가맹점으로 담을 수 없어 계산하지 않는다]
      - key: special-overseas
        title: 해외 가맹점 3% 하나머니 적립
        source: page
        evidence: ['지난달 실적 50만원 이상, 월 통합 적립 한도 20만 하나머니(요약에는 월 통합 10만 하나머니)', 해외 | 해외 가맹점 | 3%]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: points, program: hana_money, rate: 3}
        limits:
          - {shared: special}
        tiers: {from: 500000}
      - key: special-airline
        title: 지정 항공 3% 하나머니 적립
        source: page
        evidence: ['항공 | 대한항공, 아시아나 항공, 진에어, 에어부산, 에어서울, 제주항공, 티웨이항공 |', '항공/면세 : 공식 홈페이지(온라인/모바일앱) 및 오프라인 매장을 통한 결제 시에만 서비스 제공, 여행사, 구매대행사이트, 온라인쇼핑몰 (오픈마켓, 소셜 등)을 통한 결제건은 서비스 제외됨']
        target:
          merchants: [air_busan, air_seoul, asiana_airlines, jeju_air, jin_air, korean_air, tway_air]
        reward: {type: points, program: hana_money, rate: 3}
        limits:
          - {shared: special}
        tiers: {from: 500000}
        unmodeled: [공식 홈페이지와 앱 또는 오프라인 매장에서 직접 결제한 건만 제공한다. 여행사와 구매대행 사이트와 온라인 쇼핑몰을 거친 결제는 제외한다.]
      - key: special-dutyfree
        title: 지정 면세점 3% 하나머니 적립
        source: page
        evidence: ['면세 | 신라면세점, 롯데면세점, 신세계면세점, 현대백화점면세점 |']
        target:
          merchants: [hyundai_dfs, hyundai_dfs_online, lotte_dfs, lotte_dfs_online, shilla_dfs, shilla_dfs_online, shinsegae_dfs, shinsegae_dfs_online]
        reward: {type: points, program: hana_money, rate: 3}
        limits:
          - {shared: special}
        tiers: {from: 500000}
        unmodeled: [공식 홈페이지와 앱 또는 오프라인 매장에서 직접 결제한 건만 제공한다. 여행사와 구매대행 사이트와 온라인 쇼핑몰을 거친 결제는 제외한다.]
      - key: special-travel
        title: 지정 여행 온라인 3% 하나머니 적립
        source: page
        evidence: ['여행 | 하나투어, 아고다, 익스피디아, 호텔스닷컴 |', '여행/온라인쇼핑몰: 공식 홈페이지(온라인/모바일앱)를 통한 결제 시에만 서비스 제공되며, 몰 이동을 통해 다른 온라인 쇼핑몰로 이동하여 결제하는 경우는 서비스 제외됨']
        target:
          merchants: [agoda, expedia, hana_tour, hotels_com]
        when:
          - {channel: online}
        reward: {type: points, program: hana_money, rate: 3}
        limits:
          - {shared: special}
        tiers: {from: 500000}
        unmodeled: [지정 업체 공식 홈페이지와 앱에서 직접 결제한 건만 제공한다. 몰 이동 결제는 제외한다.]
      - key: special-hana-tour-offline
        title: 하나투어 오프라인 3% 하나머니 적립
        source: page
        evidence: [여행 - 하나투어 가맹점은 오프라인 결제 시에도 서비스 제공됨]
        target:
          merchants: [hana_tour]
        when:
          - {channel: offline}
        reward: {type: points, program: hana_money, rate: 3}
        limits:
          - {shared: special}
        tiers: {from: 500000}
      - key: base-1-5
        title: 국내외 가맹점 1.5% 하나머니 적립
        source: page
        evidence: [1.5% | 200만원 이상 | 10만 하나머니, '1.5% 적립: 월 한도 10만 하나머니, 지난달 실적 200만원 이상', '기본적립 : 서비스 실적 조건 없음']
        target: {all: true}
        reward: {type: points, program: hana_money, rate: 1.5}
        limits:
          - {per: month, amount: 100000}
        tiers: {from: 2000000}
      - key: base-1
        title: 국내외 가맹점 1% 하나머니 적립
        source: page
        evidence: [1.0% | 200만원 미만 | 없음, '기본적립, 특별적립, 주유/EV충전 적립의 월 적립 한도를 모두 소진 후, 발생하는 추가 매출 건은 1.0% 하나 머니 적립 제공']
        target: {all: true}
        reward: {type: points, program: hana_money, rate: 1}
    unmodeled: ['프리미엄 바우처는 본인에게 연 1회 택1이다. 첫해 발급 후 200만원 이용, 이후 직전 1년 2,400만원 이용이 필요하다. 해외·항공·면세·여행 60만원 청구할인이나 특급호텔 숙박 패키지다.', 호텔 다이닝 20만원 현장할인과 골프·프리미엄 아울렛 50% 할인 보너스 바우처는 연간 누적 실적 조건이라 계산하지 않는다, '전세계 공항라운지는 본인·가족·동반자 통합 연 10회, 일 3회다.', 무료 주차 월 2회와 VISA Infinite 발렛파킹은 계산하지 않는다, 가족카드의 전월 실적과 한도는 본인카드와 합산한다, 적립 영역이 겹치면 적립금액이 큰 서비스 하나만 준다, 해외 매출은 최종 원화 청구금액으로 적립한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 카드 출시일을 잠정 시작일로 둔다., assumed: '2024-05-31'}
  - {path: 'revisions[0].limits[special]', question: '영역별 3% 적립 한도가 상세에는 월 통합 20만 하나머니, 요약에는 10만 하나머니로 다르게 적혀 있다.', assumed: 10만 하나머니}
  - {path: 'revisions[0].stacks', question: '특별·주유 한도를 다 쓴 결제에 200만원 이상 회원이 1.5% 기본적립을 받는지, 원문 문장대로 1.0%만 받는지 불명확하다.', assumed: 1.5% 한도가 남으면 1.5%}
  - {path: 'revisions[0]', question: 원문에 하나머니 반올림 문구가 없다., assumed: 원 미만 버림}
notes: 2026-10-13 공식 상품 페이지(준법심의 L-24-0075)에서 옮겼다. 연회비 VISA 본인 1,000,000원, 국내전용 본인 995,000원, 가족 VISA 100,000원, 국내전용 가족 95,000원. 기본적립은 실적 조건 없이 1%, 지난달 200만원 이상이면 1.5%(월 10만 하나머니). 특별적립과 주유는 지난달 50만원 이상이고 최초 사용 등록 후 다음 달 말일까지는 50만원 미만도 50만원으로 본다.
