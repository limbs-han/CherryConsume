open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 원문에 신규 출시일 2019-11-27이 있어 잠정 시작일로 둔다., assumed: '2019-11-27'}
  - {path: 'revisions[0].benefits[region-shopping-points].when', question: 지역쇼핑에서 온라인몰 이용금액만 빠진다고 읽어 오프라인 결제만 대상으로 했다., assumed: 오프라인만}
  - {path: 'revisions[0].new_card', question: 아파트관리비 적립이 신규 특례에서 60만원 기준을 받는지 원문에 없다., assumed: 30만원 기준이라 아파트관리비 적립 없음}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문 실적 제외는 지역쇼핑과 주유 적립 대상 가맹점이다. 가맹점만 뺄 수 없어 백화점과 마트와 주유 업종 전체를 빼 실적이 적게 잡힌다., assumed: 세 업종 전체 제외}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문 실적 제외는 공과금과 도시가스다. 전기와 수도가 공과금에 드는지 원문만으로 단정할 수 없어 utility 전체를 뺐다., assumed: utility 전체}
notes: 2026-10-13 공식 상품 페이지에서 옮겼다. 연회비 국내전용 8,000원, 국내외겸용 10,000원. 하나머니 1하나머니 = 1원. 영역별 이번 달 합산 이용금액이 10만원이 될 때마다 5천 하나머니라 달 합계 보상으로 넣었다. 지역쇼핑과 주유는 월 2만 하나머니를 같이 쓴다. 지역쇼핑과 주유 가맹점 이용금액은 적립을 받지 못해도 지난달 실적에서 빠진다. 초안의 통신과 교통 묶음을 교통과 자동이체로 나눠 key commute-points는 교통만 남겼다.
