notes: 2026-10-13 상품안내장(2022.8판, 심의필 2022-C1a-03638호) 대조. 출시 2022-04-22. 연회비 해외겸용 Mastercard·국내전용 모두 10,000원(기본 7,000+제휴 3,000). 가족카드 3,000원. 배달앱·편의점·이동통신 5%를 받은 이용금액은 실적에서 빠지고 나머지 할인 건은 실적에 들어간다. 5% 세 영역은 월 5,000원 한도를 함께 쓴다. 발급월+1개월까지는 30만 구간 혜택.
