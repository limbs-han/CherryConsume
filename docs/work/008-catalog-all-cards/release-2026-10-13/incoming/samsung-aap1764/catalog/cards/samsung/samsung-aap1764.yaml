open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품안내장 판(2022.8)의 첫날로 두었다. 출시일은 2022-04-22다, assumed: '2022-08-01'}
