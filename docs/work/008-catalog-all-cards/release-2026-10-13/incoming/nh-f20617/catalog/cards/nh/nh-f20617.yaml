open_questions:
  - {path: 'revisions[0].benefits[cashback-shop-movie].reward', question: 10대 업종 캐시백에 건당 최소금액 문구가 없다, assumed: 최소금액 없음}
  - {path: 'revisions[0].benefits[cashback-shop-movie].tiers', question: 20만원과 50만원 구간 문구가 표의 쇼핑 행에만 있다. 나머지 업종도 같다고 보았다, assumed: 같은 구간}
  - {path: 'revisions[0].effective_from', question: 시행일은 신규 출시일 2026-03-23으로 두었다, assumed: '2026-03-23'}
notes: 2026-10-13 상품 페이지(준법감시인 심의필 2026-2372)를 대조했다. 후불교통은 실적에서 빠지지 않고 합산된다. 10대 업종은 조건이 달라 혜택 다섯으로 나누고 월 3만원 한도를 함께 쓴다.
