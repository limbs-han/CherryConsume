schema_version: 2
id: hyundai-mpe4
issuer: hyundai
name: 현대카드MM
short_name: 현대 MM
search_names: [Hyundai MM, 현대MM, 현대카드 MM]
kind: credit
product_codes: [MPE4]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 70000}
  - {scope: global, brand: visa, amount: 70000}
  - {scope: global, brand: amex, amount: 70000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/MM%20%EC%83%81%ED%92%88%20%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81.pdf', fetched_at: 2026-10-13}
checked_at: 2026-10-13
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: manual
    tiers: [0, 500000, 1000000]
    spend:
      exclude_categories: [annual_fee, gift_card, prepaid_charge, tax, utility.water]
      cancellation: original_month
    new_card: {until: next_month_end, tier: 1000000, from: issue}
    limits:
      - {key: area-10, per: month, amount: 20000}
    stacks:
      - key: main
        pick: priority
        order: [online-dining-overseas-10, overseas-10, base-all-1-5]
        spill: split
    benefits:
      - key: base-all-1-5
        title: 국내외 가맹점 1.5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 50만원 이상 시 국내외 가맹점 1.5% M포인트 적립, 1회 및 연간 적립 한도 제한 없음, 추가 혜택 적용 시 기본 혜택은 중복 제공되지 않음, 기본 혜택 및 추가 혜택 적립의 경우 매출 건별로 소수점 이하 반올림 후 적립]
        target: {all: true}
        reward: {type: points, program: hyundai_m_point, rate: 1.5, round: round}
        tiers: {from: 500000}
      - key: online-dining-overseas-10
        title: 온라인 쇼핑몰·일반음식점 10% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 온라인 쇼핑몰, 일반음식점, 해외 가맹점 10% M포인트 적립, '온라인 쇼핑몰 : 네이버쇼핑, 쿠팡, G마켓, 옥션, 11번가, SSG.COM, 컬리', 일반음식점, '대상점 통합해 월 2만 M포인트 적립 한도 (본인+가족 카드 합산 기준, 적립 한도 초과시 기본 혜택 적립률 적용)', 네이버쇼핑의 경우 네이버 도메인(naver.com)으로 확인되는 가맹점에 한해 적립, 쿠팡의 경우 쿠팡이츠 결제 건은 적립 제외, 대상 온라인 쇼핑몰의 공식 홈페이지 및 앱 내 결제 건에 한해 적립 적용되며 상품 선택 시 연결된 다른 사이트 및 앱에서 결제한 경우 적립 제외]
        target:
          categories: [restaurant.general]
          merchants: [auction, coupang, eleven_st, gmarket, kurly, naver_plus_store, ssg_com]
          exclude_merchants: [coupang_eats]
        when:
          - {region: domestic}
        reward: {type: points, program: hyundai_m_point, rate: 10, round: round}
        limits:
          - {shared: area-10}
        tiers: {from: 1000000}
        unmodeled: [네이버쇼핑은 naver.com 도메인으로 확인되는 가맹점만 적립한다, 온라인 쇼핑몰은 공식 홈페이지와 앱 안의 결제만 적립하고 상품을 고른 뒤 연결된 다른 사이트나 앱에서 결제하면 제외한다, 월 적립 한도는 본인과 가족 카드를 합산한다]
        notes: 온라인 쇼핑몰은 네이버쇼핑, 쿠팡(쿠팡이츠 제외), G마켓, 옥션, 11번가, SSG.COM, 컬리. 해외 영역과 통합 월 2만 M포인트, 넘으면 1.5%
      - key: overseas-10
        title: 해외 가맹점 10% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 온라인 쇼핑몰, 일반음식점, 해외 가맹점 10% M포인트 적립, '해외 가맹점 : 해외 온·오프라인 가맹점', '대상점 통합해 월 2만 M포인트 적립 한도 (본인+가족 카드 합산 기준, 적립 한도 초과시 기본 혜택 적립률 적용)', 추가 혜택 적용 시 기본 혜택은 중복 제공되지 않음]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: points, program: hyundai_m_point, rate: 10, round: round}
        limits:
          - {shared: area-10}
        tiers: {from: 1000000}
        unmodeled: [월 적립 한도는 본인과 가족 카드를 합산한다]
        notes: 해외 온·오프라인 가맹점. 온라인 쇼핑몰·일반음식점과 통합 월 2만 M포인트, 넘으면 1.5%
    unmodeled: [대중교통처럼 사후 승인되는 가맹점과 해외 이용 금액은 매출일자 기준으로 실적 달을 정한다, 국제브랜드 수수료와 해외서비스 수수료는 실적에 넣지 않는다, 본인과 가족 카드 이용 금액을 합산해 실적을 센다, 부분 무이자 할부는 수수료를 내는 개월의 이용 금액만 적립한다, 세이브-오토 같은 선지급 포인트 약정을 쓰면 그 약정의 적립 기준을 따른다, 월 적립 한도를 넘긴 뒤 혜택 받은 결제를 취소하면 한도 때문에 빠졌던 이전 결제에 다음 달 15일경 적립한다, 인천공항 라운지와 발레파킹은 결제 혜택이 아니다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 가이드북에 시행일과 판 정보가 없어 수집일을 시작일로 둔다, assumed: '2026-10-05'}
notes: 2026-10-13 공식 가이드북 대조. 연회비 국내전용과 국내외겸용(Visa/Amex Platinum) 70,000원(기본 20,000+제휴 50,000), 가족카드 20,000원. 전월 50만 이상 국내외 1.5% M포인트, 100만 이상 온라인 쇼핑몰 7곳·일반음식점·해외 가맹점 10%이고 통합 월 2만 M포인트를 넘으면 1.5%다. 추가 혜택이 적용되면 기본 1.5%는 겹쳐 주지 않는다. 매출 건별 소수점 이하 반올림. 실적 제외는 카드론 등, 수수료, 공과금, 상품권·선불카드뿐이라 상하수도만 utility.water로 뺀다. 취소는 승인월에서 뺀다. 신규 발급은 발급월 다음 달 이용 건까지 50만·100만 미만도 혜택을 줘 100만 구간으로 둔다.
