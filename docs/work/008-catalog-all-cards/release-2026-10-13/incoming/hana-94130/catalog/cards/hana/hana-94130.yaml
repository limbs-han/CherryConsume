  - {path: 'revisions[0].benefits', question: '요약 문구의 생활밀착업종 2만원당 200하나머니, 그 외 업종 100하나머니, 이동통신요금 자동이체 적립은 상세 표에 대상과 한도가 없다.', assumed: 넣지 않음}
