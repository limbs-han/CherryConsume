notes: 2026-10-13 공식 상품 페이지(상세 번호 CD_PD_SEQ=16734, 목록 상품 번호 94130, 준법심의 L-23-0074)에서 옮겼다. 연회비 없음, 발급수수료 2,000원은 다음 달 말일까지 1만원 이상 쓰면 돌려준다. 하나머니 1하나머니 = 1원. 적립 비율의 반올림 문구가 없어 원 미만은 버린다. 하나머니 적립 서비스는 체크 결제에만 주고 최초 사용등록 다음 달 말일까지는 월 최대 5천 하나머니까지 적립한다.
