        evidence: [배달앱/디지털콘텐츠 20% 결제일할인, '디지털 콘텐츠 넷플릭스, 디즈니+, 유튜브, 티빙 정기결제건', '통합 월 할인한도 5,000원, 전월 이용금액 40만원 이상 시 제공', '디지털콘텐츠는 구글플레이, 앱스토어 등을 통한 결제건(인앱 결제) 제외', 디지털콘텐츠의 유튜브는 유튜브 프리미엄 결제건에 한함]
