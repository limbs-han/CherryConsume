schema_version: 2
id: hyundai-mhmfi
issuer: hyundai
name: 현대해상 현대카드
short_name: 현대 현대해상
search_names: [현대해상 현대카드, 현대해상카드]
kind: credit
product_codes: [MHMFI]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 30000}
  - {scope: global, brand: visa, amount: 30000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/T_AOB-20260720-1555-29_%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81_%ED%98%84%EB%8C%80%ED%95%B4%EC%83%81%EC%B9%B4%EB%93%9C_V2_%EA%B3%B5%EC%8B%9C%EC%8B%A4%EC%9A%A9.pdf', fetched_at: 2026-10-13}
checked_at: 2026-10-13
revisions:
  - effective_from: 2026-07-20
    effective_from_estimated: true
    source: manual
    tiers: [0, 500000, 1000000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      interest_free: exclude
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
      exclude_applied: 1
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [현대카드의 다른 할인이 적용된 결제는 할인에서 뺀다]
    facts:
      - {key: hi_insurance_kept, type: bool, scope: card, ask: '이 카드로 현대해상 보험료를 내는 보험계약자이고, 그 보험을 전월 1일 이상 유지했나요'}
    benefits:
      - key: insured-discount
        title: 현대해상 보험 유지 시 국내외 가맹점 청구 할인 (전월 50만 월 1만2천원, 100만 월 1만7천원)
        source: manual
        evidence: [전월 이용 금액 50만/100만원 이상 시 국내외 가맹점 최대 1만 7천원 청구 할인 또는 0.5% M포인트 적립, '이용(유지) 50만원 이상~100만원 미만 최대 1만 2천원 청구 할인, 100만원 이상 최대 1만 7천원 청구 할인', 청구 금액이 할인 한도보다 적을 경우 청구 금액만큼만 혜택 적용, 보험료를 납입하는 현대해상 현대카드 본인 회원(보험계약자) 혜택 제외는 피보험자, 혜택 제공월 기준 전월 1일 이상 유지, 전월 이용 금액 50만원 미만 시 혜택 제외, 청구 할인은 본인 카드에 한해 적용]
        target: {all: true}
        when:
          - {fact: hi_insurance_kept}
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {500000: 12000, 1000000: 17000}
        tiers: {from: 500000}
        exclude_applied: 1
        unmodeled: [청구 할인은 본인 카드 결제에만 적용한다, 현대해상 보험 유지 여부는 사용자 답에 따른다]
    unmodeled: [현대해상 보험을 이용하지 않거나 해지한 경우 국내외 가맹점 0.5% M포인트(전월 50만원 이상)는 담지 않았다, 신규 발급 시 수령 등록월 다음 달 이용 건까지 보험 유지와 무관하게 50만원 미만도 50만~100만 구간 청구 할인을 주는 특례는 보험 유지 답과 무관하게 줄 수 없어 담지 않았다, 할인은 매출전표 접수 순서로 한도를 적용한다, 실적과 할인 한도는 본인과 가족 카드를 합산한다, 고속도로 통행요금과 후불하이패스 이용금액은 실적에서 뺀다, 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, 국제브랜드 수수료와 해외서비스 수수료는 실적에 넣지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 가이드북 시행일을 확인하지 않아 파일 이름의 날짜 20260720을 시작일로 둔다, assumed: '2026-07-20'}
notes: 2026-10-13 공식 가이드북 대조. 연회비 국내전용과 국내외겸용(Visa Platinum) 30,000원(기본 10,000+제휴 20,000), 가족카드 10,000원. 현대해상 보험을 유지하면 전월 50만 이상 100만 미만 월 1만2천원, 100만 이상 월 1만7천원까지 국내외 가맹점 결제를 청구 할인하고 결제 금액이 한도보다 적으면 그 금액만큼이라 rate 100에 월 한도 구간표로 담았다. 보험 유지 여부는 사용자에게 묻는 사실이다. 실적은 전월 1일~말일 일시불과 할부이고 공과금 등, 부동산 임대료, 무이자할부, 할인 받은 결제를 뺀다. 취소는 승인월에서 빼고 해외는 취소 달에서 뺀다. 보험 미이용 0.5% M포인트는 담지 않았다.
