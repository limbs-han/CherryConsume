        target: {all: true}
        reward: {type: points, program: samsung_bigpoint, rate: 0.5}
      - key: area-dept-5
        title: 백화점 5% 빅포인트 적립
        source: manual
        evidence: [많이 쓰는 영역 5% 자동 맞춤 적립, 백화점·할인점·슈퍼마켓 영역 중 월 이용금액이 가장 큰 1개 영역에 대해 5% 빅포인트 적립, '백화점 신세계/롯데/현대/갤러리아 백화점, AK플라자', '전월 이용금액대별 월 적립한도 40만원 이상 5,000P, 70만원 이상 10,000P', '오프라인 결제건에 한하며, 쇼핑 외 결제건(상품권, 주차장 등), 임대매장은 제외', 국내외 가맹점 0.5% 빅포인트 적립 혜택과 중복 적용]
        target:
          merchants: [ak_plaza, galleria, hyundai_department, lotte_department, shinsegae_department]
        when:
          - {channel: offline}
          - {ranked: area}
        reward: {type: points, program: samsung_bigpoint, rate: 5}
        limits:
          - {shared: area5}
        tiers: {from: 400000}
        stack: area-stack
        unmodeled: [임대매장과 쇼핑 외 결제(상품권, 주차장 등)는 적립하지 않는다]
