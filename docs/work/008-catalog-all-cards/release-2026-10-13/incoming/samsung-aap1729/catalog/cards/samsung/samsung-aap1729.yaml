        title: 할인점 5% 빅포인트 적립
        source: manual
        evidence: [많이 쓰는 영역 5% 자동 맞춤 적립, 백화점·할인점·슈퍼마켓 영역 중 월 이용금액이 가장 큰 1개 영역에 대해 5% 빅포인트 적립, '할인점 이마트, 이마트 트레이더스, 롯데마트, 홈플러스, 농협 하나로마트', '전월 이용금액대별 월 적립한도 40만원 이상 5,000P, 70만원 이상 10,000P', '오프라인 결제건에 한하며, 쇼핑 외 결제건(상품권, 주차장 등), 임대매장은 제외']
        target:
          merchants: [emart, homeplus, lotte_mart, nh_hanaro_mart, traders]
        when:
          - {channel: offline}
          - {ranked: area}
        reward: {type: points, program: samsung_bigpoint, rate: 5}
        limits:
          - {shared: area5}
        tiers: {from: 400000}
        stack: area-stack
        unmodeled: [임대매장과 쇼핑 외 결제(상품권, 주차장 등)는 적립하지 않는다]
      - key: area-super-5
        title: 슈퍼마켓 5% 빅포인트 적립
