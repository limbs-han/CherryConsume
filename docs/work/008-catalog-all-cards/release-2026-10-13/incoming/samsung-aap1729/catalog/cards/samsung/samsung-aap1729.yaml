        title: 주유 2% 빅포인트 추가 적립
        source: manual
        evidence: [주유·이동통신·아파트 관리비 2% 빅포인트 추가 적립, 주유 주유소, LPG충전소, 전기차충전소, '전월 이용금액대별 통합 월 적립한도 40만원 이상 5,000P, 70만원 이상 10,000P', '''기본 0.5% 빅포인트+2% 빅포인트''의 형태로 적립', 월 적립한도 초과 시 기본 0.5% 적립만 적용]
        target:
          categories: [fuel]
        reward: {type: points, program: samsung_bigpoint, rate: 2}
        limits:
          - {shared: bonus2}
        tiers: {from: 400000}
        stack: bonus
        unmodeled: [전기차충전소는 환경부 등 충전사업자 멤버십 등록 가맹점에 한하는 조건이라 담지 않았다]
      - key: mobile-2
        title: 이동통신 2% 빅포인트 추가 적립
        source: manual
        evidence: [주유·이동통신·아파트 관리비 2% 빅포인트 추가 적립, '이동통신 SKT, KT, LG U+, 알뜰폰 이동통신요금 정기결제건', '이동통신은 결합상품요금, 휴대전화 등 단말기 구매금액 및 대리점 카드 결제건 제외', '알뜰폰은 SK텔링크, KT스카이라이프, KT M모바일, 헬로모바일, 미디어로그에 한함', '전월 이용금액대별 통합 월 적립한도 40만원 이상 5,000P, 70만원 이상 10,000P']
        target:
          merchants: [hello_mobile, kt, kt_m_mobile, kt_skylife, lg_uplus, media_log, sk_telink, skt]
        when:
          - billing: [autopay]
        reward: {type: points, program: samsung_bigpoint, rate: 2}
        limits:
          - {shared: bonus2}
        tiers: {from: 400000}
        stack: bonus
        unmodeled: [결합상품요금, 단말기 구매금액, 대리점 카드 결제건은 적립하지 않는다]
      - key: apt-2
        title: 아파트 관리비 2% 빅포인트 추가 적립
        source: manual
        evidence: [주유·이동통신·아파트 관리비 2% 빅포인트 추가 적립, 아파트 관리비 아파트관리비 정기결제건, '전월 이용금액대별 통합 월 적립한도 40만원 이상 5,000P, 70만원 이상 10,000P']
        target:
          categories: [apartment_fee]
        when:
          - billing: [autopay]
        reward: {type: points, program: samsung_bigpoint, rate: 2}
        limits:
          - {shared: bonus2}
        tiers: {from: 400000}
        stack: bonus
    unmodeled: [가족카드의 이용금액은 본인카드와 합산해 실적과 적립한도를 센다, 3개 영역 합산 이용금액 1원 이상이어야 5% 영역 적립을 준다. 가족카드에는 5% 영역 적립을 주지 않는다, 포인트는 다음 달 15일에 적립한다, '적립은 매출전표 접수 시점순으로 하고 전월 이용금액은 승인일 기준이다. 해외 결제와 무승인 결제(대중교통, 이동통신 등 정기결제)는 매출전표 접수일 기준이다', 후불교통기능이 탑재되어 발급된다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 안내장에 판 표시나 시행일이 보이지 않아 수집일로 두었다, assumed: '2026-10-05'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통 범위가 적혀 있지 않아 시내버스와 지하철로 두었다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits', question: 적립 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-13 상품안내장 대조. 연회비는 본인 실물카드 해외겸용 Mastercard, UnionPay와 국내전용 모두 20,000원(기본 7,000+제휴 13,000)이고 모바일카드는 15,000원, 가족 실물카드는 13,000원이다. 1포인트는 1원 가치다. 5% 영역 적립은 백화점·할인점·슈퍼마켓 중 그 달 이용액이 가장 큰 1개 영역만 받는다.
