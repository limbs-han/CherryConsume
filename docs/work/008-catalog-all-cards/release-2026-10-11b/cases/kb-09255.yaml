card: kb-09255
holder:
  started_on: '2025-01-01'
  options:
    - {option: mode, choice: auto, effective_from: '2025-01-01'}
cases:
  - name: '[A] 음식 3%는 건당 1만원 이상'
    prev_month_spend: 500000
    payments:
      - {at: 2026-11-02T12:00, amount: 9900, category: restaurant.general}
      - {at: 2026-11-03T12:00, amount: 10000, category: restaurant.general}
    expect:
      - {payment: 0, benefits: {}, counted: 9900}
      - {payment: 1, benefits: {a-food-3: 300}, counted: 10000}
    calc: 9,900원은 건당 1만원 미만이라 없음. 10,000 × 3% = 300
  - name: 50만 구간 경계 직전 499999는 선택서비스 없음
    prev_month_spend: 499999
    payments:
      - {at: 2026-11-03T12:00, amount: 10000, category: restaurant.general}
    expect:
      - {payment: 0, benefits: {}, counted: 10000}
    calc: 전월 499,999원은 50만 미만이라 선택서비스 없음
  - name: '[A] 음식 영역 월 3천원 한도'
