        title: 대중교통 10% 청구할인
        source: page
        evidence: ['후불교통(시내버스, 지하철), 고속·시외버스 10% 청구할인', 월 할인한도 4, 000원, 전월 실적 30만원 이상]
        target:
          categories: [transit.bus_city, transit.bus_express, transit.bus_intercity, transit.subway]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 4000}
        tiers: {from: 300000}
        unmodeled: [이용대금명세서상 이용일 기준으로 계산한다. 후불교통 제공 지역만 대상이다]
    unmodeled: [생애 최초 신규발급은 발급 후 60일 주유 할인과 사용등록 후 90일 대중교통 할인(월 4만원 이용금액까지)을 실적과 무관하게 주는데 이 특례는 담지 않았다, '스피드메이트 엔진오일 무료교환, 정비 2만원 할인, 펑크 수리, 공임 10% 할인과 캠핑지원 캐시백 추첨은 담지 않았다', 현금서비스·카드론·수수료는 실적에서 빠진다, 다른 할인 카드와 중복 적용되지 않는다]
open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인 대중교통 전표 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠질 수 있다, assumed: 'annual_fee, transit.bus_city, transit.subway'}
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙의 시작일을 찾지 못해 수집일로 둔다. 출시일은 2012.04.12다, assumed: '2026-10-11'}
notes: 2026-10-11 KB국민카드 상품 페이지와 대조. 실적 제외 목록에 상품권·세금·관리비가 없어 실적에 넣었다.
