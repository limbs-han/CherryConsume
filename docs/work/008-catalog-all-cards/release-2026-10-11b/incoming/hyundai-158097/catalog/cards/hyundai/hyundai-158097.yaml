notes: 2026-10-11 공식 상품설명서 대조. 부모 회원이 신청해 만 12~18세 자녀에게 주는 가족 신용카드다. 연회비 국내전용 2,000원(제휴 2,000). 전월 일시불 10만원 이상이면 편의점 4곳, 커피 4곳, 패스트푸드 5곳, 시내버스·지하철·택시 2% 청구할인, 통합 월 5천원. 편의점은 현장 결제만이라 혜택을 둘로 나눠 한도를 함께 쓴다. 실적은 전월 1일~말일 일시불이고 연회비, 이자, 공과금만 뺀다. 취소는 승인월에서 뺀다.
