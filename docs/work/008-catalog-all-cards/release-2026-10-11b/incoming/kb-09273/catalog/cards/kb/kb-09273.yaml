    unmodeled: [상품명에 톡톡 with가 들어간 카드는 전월 이용실적과 서비스별 월 할인한도를 함께 쓴다. 두 장 이상 가지면 앱이 실적과 할인을 카드마다 따로 계산해 더 크게 보일 수 있다, 최초 사용등록일부터 다음 달 말일까지 실적 없이도 혜택을 주는 신규 특례는 계산하지 않는다, '정부지원금(보육료·유치원보조비·바우처), 무승인전표(자판기·터널통행료·항공기내 이용)는 실적에서 빠진다', 할인 한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2020.12.30 출시만 적었다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 실적 제외 '교통요금'이 후불교통만인지 교통 전체인지 분명하지 않다. 덜 주는 쪽으로 교통 업종 전체를 실적에서 뺐다. 택시는 남겼다., assumed: transit}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 톡톡 with Kbank 카드(09483)는 혜택과 연회비가 같아 같은 상품으로 본다. 톡톡 with Kbank(09483)는 혜택이 같은 상품이라 이 카드로 등록한다.
