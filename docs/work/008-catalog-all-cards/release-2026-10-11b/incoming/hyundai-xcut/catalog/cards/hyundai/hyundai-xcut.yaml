schema_version: 2
id: hyundai-xcut
issuer: hyundai
name: 현대카드 X Cut
short_name: 현대 X Cut
search_names: [X Cut, 엑스컷, 현대카드 X Cut]
kind: credit
product_codes: [XCUT]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 30000}
  - {scope: global, brand: visa, amount: 30000}
  - {scope: global, brand: amex, amount: 30000}
sources:
  - {id: page, kind: product_page, url: 'https://www.hyundaicard.com/cpc/cr/CPCCR0201_01.hc?cardWcd=XCUT', fetched_at: 2026-10-05}
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/20260330_X%20Cut.pdf', fetched_at: 2026-10-11}
checked_at: 2026-10-11
revisions:
  - effective_from: 2026-03-30
    effective_from_estimated: true
    source: manual
    tiers: [0, 500000, 1000000]
    spend:
      exclude_categories: [annual_fee, gift_card, prepaid_charge, tax, utility.water]
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
    new_card: {until: next_month_end, tier: 1000000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [고속도로 통행 요금과 후불하이패스 카드 이용 금액은 할인에서 뺀다, 현대카드의 다른 할인이 적용된 결제는 할인에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 할인에서 뺀다]
    limits:
      - {key: plus-5, per: month, amount: 10000}
    stacks:
      - key: main
        pick: priority
        order: [beauty-delivery-5, convenience-5, base-1]
        spill: split
    benefits:
      - key: beauty-delivery-5
        title: 올리브영·다이소·무신사, 배달 앱 5% 청구 할인
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 뷰티/생활/패션, 배달 앱, 편의점 5% 청구 할인, '뷰티/생활/패션 : 올리브영, 다이소, 무신사', '배달 앱 : 배달의민족, 쿠팡이츠, 요기요', '대상점 통합해 월 1만원 할인 한도 (본인+가족 카드 합산 기준, 할인 한도 초과 시 기본 혜택 할인율 적용)', 추가 혜택은 대상점별 국내 가맹점에 한해 제공, 무신사에서 네이버페이로 결제 시 국내외 가맹점으로 구분되어 기본 혜택 적용]
        target:
          merchants: [baemin, coupang_eats, daiso, musinsa, olive_young, yogiyo]
        when:
          - region: domestic
            payment_not: [kakao_pay, naver_pay, payco, toss_pay]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
        unmodeled: [온라인은 공식 홈페이지와 앱 안의 결제만 5%이고 연결된 다른 사이트나 앱 결제는 1%다, 백화점·할인점·쇼핑몰·기차 역사 안 매장은 1%다, 배달원이나 가맹점에 직접 결제하면 1%다]
      - key: convenience-5
        title: 편의점 5% 청구 할인
        source: manual
        evidence: ['편의점 : GS25, CU, 세븐일레븐, 이마트24', 편의점은 현장 결제 건에 한해 추가 혜택 적용되며 앱에서 결제한 경우 국내외 가맹점으로 구분되어 기본 혜택 적용]
        target:
          merchants: [cu, emart24, gs25, seven_eleven]
        when:
          - {region: domestic, channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
      - key: base-1
        title: 국내외 가맹점 1% 청구 할인
        source: manual
        evidence: [전월 이용 금액 50만원 이상 시 국내외 가맹점 1% 청구 할인, 1회 및 연간 할인 한도 제한 없음, 해외 이용 금액 할인은 국내외겸용 카드에 한해 적용]
        target: {all: true}
        reward: {type: billing_discount, rate: 1}
        tiers: {from: 500000}
    unmodeled: [간편결제·PG·키오스크처럼 별도 가맹점번호로 승인되는 결제는 5% 대상점이어도 1%다, 할인은 매출전표 접수 순서로 한도를 적용한다, 실적과 할인 한도는 본인과 가족 카드를 합산한다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, 긴급할인(선지급 포인트)을 쓰면 할인 금액이 상환에 먼저 쓰인다, 현대카드의 다른 청구 할인과 겹치면 큰 쪽 하나만 준다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 가이드북은 2026년 3월 기준이고 파일 이름 날짜가 2026-03-30이다. 시행일을 따로 확인하지 않았다, assumed: '2026-03-30'}
notes: 2026-10-11 공식 가이드북(2026년 3월 기준) 대조. 연회비 국내전용과 국내외겸용(Visa/Amex Platinum) 30,000원(기본 10,000+제휴 20,000), 가족카드 10,000원. 전월 50만 이상 국내외 1% 무제한, 100만 이상 올리브영·다이소·무신사·배달 앱·편의점 현장 결제 5%(통합 월 1만원, 넘으면 1%). 신규 발급 시 수령 등록월 다음 달 이용 건까지 실적과 무관하게 기본·추가 혜택을 줘 100만 구간으로 둔다. 실적 제외는 카드론·연회비·공과금·상품권·선불카드뿐이고 무이자 할부와 할인 받은 결제도 실적에 든다. 원문에 끝수 처리가 없어 원 미만 버림.
