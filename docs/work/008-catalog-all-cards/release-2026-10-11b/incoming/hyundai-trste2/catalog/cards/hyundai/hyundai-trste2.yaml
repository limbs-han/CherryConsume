open_questions:
  - {path: 'revisions[0].effective_from', question: 출시일은 2024-08-16이고 가이드북은 2026년 5월 기준이다. 그 사이 혜택이 같았는지 확인하지 않았다, assumed: '2026-05-01'}
notes: 2026-10-11 공식 가이드북(2026년 5월 기준) 대조. 연회비 국내전용과 국내외겸용(VISA Infinite) 500,000원(기본 150,000+제휴 350,000), 가족카드 150,000원. 전월 50만 이상 국내외 1.5% M포인트 무제한, 건별 소수점 이하 반올림. 항공 마일리지형은 계산하지 않는다. 실적 제외는 카드론·연회비·공과금·상품권·선불카드뿐이고 무이자 할부와 할인 받은 결제도 실적에 든다. 적립 제외는 카드사 기본에 월세를 더했다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 50만 구간.
