schema_version: 2
id: kb-09322
issuer: kb
name: KB국민 K-패스체크카드
short_name: KB K-패스체크
kind: check
product_codes:
  - '09322'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=09322', fetched_at: '2026-10-11', review_no: 240215-00555-PIF}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [education.tuition, gift_card, prepaid_charge, tax.local, transit.bus_city, transit.subway]
      month_offset: {}
      exclude_applied: 0
    benefit_exclusions:
      categories: [gift_card, prepaid_charge]
      unmodeled: ['PG 결제, 대행사이트 결제, 호텔·백화점·대형마트·철도역사 입점 가맹점, 상품권 구매는 적립에서 빠질 수 있다']
    limits:
      - {key: living, per: month, amount: 4000}
    stacks:
      - {key: main}
      - {key: kbpay}
    benefits:
      - key: transit-10
        title: 버스·지하철 10% 포인트리 적립
        source: page
        evidence: [대중교통 적립 | 버스, 지하철 | 10% | 2천점 | 20만원, '택시, 시외버스, 고속버스, 공항버스 제외', 최초 카드 사용 등록 후 다음 달 말일까지 전월 실적 조건 미달 시에도 서비스 제공]
        target:
          categories: [transit.bus_city, transit.subway]
        reward: {type: points, program: kb_pointree, rate: 10}
        limits:
          - {per: month, amount: 2000}
        tiers:
          from: 200000
          waived_when:
            card_month: {min: 0, max: 1}
        unmodeled: [버스·지하철 적립은 실제 이용일이 아니라 이용대금명세서의 이용일 달로 계산된다]
      - key: living-1
        title: 커피·약국·편의점·영화·패스트푸드 1% 포인트리 적립
        source: page
        evidence: [생활서비스 적립 | 커피 업종 약국 업종 편의점 업종 영화(CGV, 롯데시네마) 패스트푸드 업종 | 1% | 4천점]
        target:
          categories: [cafe, convenience, pharmacy, restaurant.fastfood]
          merchants: [cgv, lotte_cinema]
        reward: {type: points, program: kb_pointree, rate: 1}
        limits:
          - {shared: living}
        tiers:
          from: 200000
          waived_when:
            card_month: {min: 0, max: 1}
      - key: living-telecom-1
        title: 이동통신요금 자동납부 1% 포인트리 적립
        source: page
        evidence: ['이동통신요금 자동납부 (SK, KT, LG, LiivM) 건당 1만원 이상 이용 시 | 1% | 4천점']
        target:
          exclude_categories: [telecom.internet_tv]
          merchants: [kt, lg_uplus, liiv_m, skt]
        when:
          - billing: [autopay]
            amount: {min: 10000}
        reward: {type: points, program: kb_pointree, rate: 1}
        limits:
          - {shared: living}
        tiers:
          from: 200000
          waived_when:
            card_month: {min: 0, max: 1}
      - key: kbpay-living-1
        title: KB Pay로 생활서비스 결제 시 1% 추가 적립
        source: page
        evidence: [KB Pay 추가적립 | '생활서비스 적립' 영역에서 KB Pay 이용 시 | 1% | 4천점, 합계 1만점]
        target:
          categories: [cafe, convenience, pharmacy, restaurant.fastfood]
          merchants: [cgv, lotte_cinema]
        when:
          - payment: [kb_pay]
        reward: {type: points, program: kb_pointree, rate: 1}
        limits:
          - {per: month, amount: 4000}
        tiers:
          from: 200000
          waived_when:
            card_month: {min: 0, max: 1}
        stack: kbpay
        notes: 이동통신요금 자동납부는 KB Pay로 결제할 수 없어 추가적립 대상에서 뺐다
    unmodeled: [월 적립한도는 본인회원 기준이다, 해외 이용금액은 매입 완료일 기준으로 실적 달을 나눈다, '정부지원금, 연체료, 수수료와 자판기·터널통행료·유료도로 같은 무승인 금액은 실적에서 빠진다', 정부 K-패스 환급은 카드 혜택이 아니라 계산하지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2023.04.26 출시와 2024.02.15 심의만 적었다. 현재 규칙 시작일을 몰라 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통요금 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
  - path: revisions[0].benefits[living-1].tiers
    question: 원문 표의 전월 실적 20만원 칸이 대중교통 행에만 보인다. 생활서비스와 KB Pay 추가적립에도 붙는지 분명하지 않아 덜 주는 쪽으로 모든 혜택에 20만원을 둔다
    assumed: '200000'
notes: 2026-10-11 KB국민카드 상품 페이지로 대조했다. 실적 유예 문구에 생애 최초 발급 조건이 없어 사실을 묻지 않는다.
