  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 300000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
