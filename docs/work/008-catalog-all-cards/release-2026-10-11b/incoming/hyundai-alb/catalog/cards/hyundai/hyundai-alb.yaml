schema_version: 2
id: hyundai-alb
issuer: hyundai
name: 알파벳카드B
short_name: 현대 알파벳B
search_names: [Alphabet B, 알파벳 카드 B, 알파벳카드B]
kind: credit
product_codes: [ALB]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 15000}
  - {scope: global, brand: visa, amount: 15000}
  - {scope: global, brand: amex, amount: 15000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/%EC%95%8C%ED%8C%8C%EB%B2%B3%EC%B9%B4%EB%93%9CB%20%EC%83%81%ED%92%88%20%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81_0701.pdf', fetched_at: 2026-10-11}
checked_at: 2026-10-11
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: manual
    tiers: [0, 400000, 800000, 1200000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_express, utility]
      interest_free: exclude
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
      exclude_applied: 1
    new_card: {until: next_month_end, tier: 400000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [현대카드의 다른 할인이 적용된 결제는 할인에서 뺀다]
    limits:
      - key: extra-5
        per: month
        amount: {400000: 5000, 800000: 10000, 1200000: 15000}
    benefits:
      - key: beauty-fashion-10
        title: 뷰티·패션 10% 청구 할인
        source: manual
        evidence: [전월 이용 금액 40만원 이상 시 뷰티, 헬스, 패션 10% 청구 할인, '뷰티 : 올리브영, 미용실, 피부과, 성형외과, 치과', '패션 : 무신사, 29CM, W컨셉, KREAM, 나이키, 룰루레몬', '전월 이용 금액별 할인 한도 - 40만원 이상 80만원 미만 : 대상 영역 통합해 월 1만원 - 80만원 이상 120만원 미만 : 대상 영역 통합해 월 2만원 - 120만원 이상 : 대상 영역 통합해 월 3만 5천원', 무신사 외 패션 영역 대상점은 공식 홈페이지 및 앱 내 결제 건에 한해 기본 혜택 적용, 백화점·할인점·쇼핑몰 및 일부 기차 역사 등에 입점된 매장 결제 건은 기본 혜택 제외]
        target:
          categories: [beauty.salon]
          merchants: [kream, musinsa, nike_com, olive_young, twentynine_cm, wconcept]
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {400000: 10000, 800000: 20000, 1200000: 35000}
        tiers: {from: 400000}
        unmodeled: [피부과·성형외과·치과와 헬스장·필라테스·요가·테니스장·수영장도 10% 대상이지만 담을 업종이 없어 계산하지 않는다, 룰루레몬 공식 홈페이지와 앱 결제도 대상이지만 가맹점이 없어 계산하지 않는다, 백화점·할인점·쇼핑몰·기차 역사 안 매장 결제는 할인하지 않는다]
      - key: cafe-5
        title: 커피전문점 5% 청구 할인
        source: manual
        evidence: [전월 이용 금액 40만원 이상 시 커피전문점, 편의점, 대중교통 5% 청구 할인, '커피전문점 : 스타벅스, 투썸플레이스, 폴바셋, 이디야커피, 메가MGC커피', '전월 이용 금액별 할인 한도 - 40만원 이상 80만원 미만 : 영역별 월 5천원, 대상 영역 통합해 월 5천원 - 80만원 이상 120만원 미만 : 영역별 월 5천원, 대상 영역 통합해 월 1만원 - 120만원 이상 : 영역별 월 5천원, 대상 영역 통합해 월 1만 5천원']
        target:
          merchants: [ediya, mega_coffee, paul_bassett, starbucks, twosome]
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
          - {shared: extra-5}
        tiers: {from: 400000}
        unmodeled: [백화점·할인점·쇼핑몰 안 매장과 공동가맹점 결제는 할인하지 않는다]
      - key: convenience-5
        title: 편의점 5% 청구 할인
        source: manual
        evidence: ['편의점 : GS25, CU, 세븐일레븐, 이마트24', 편의점은 현장 결제 건에 한해 추가 혜택 적용되며 앱에서 결제한 경우 제외]
        target:
          merchants: [cu, emart24, gs25, seven_eleven]
        when:
          - {region: domestic, channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
          - {shared: extra-5}
        tiers: {from: 400000}
      - key: transit-5
        title: 시내버스·지하철·택시 5% 청구 할인
        source: manual
        evidence: ['대중교통 : 시내버스, 지하철, 택시', 시외버스 및 고속버스 결제 건은 추가 혜택 제외, 택시 앱 이용 시 현대카드에 등록된 가맹점 및 업종 분류 기준에 따라 추가 혜택 적용]
        target:
          categories: [taxi, transit.bus_city, transit.subway]
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
          - {shared: extra-5}
        tiers: {from: 400000}
        unmodeled: [택시 앱 결제는 현대카드 업종 분류에 따라 할인 여부가 달라진다]
    unmodeled: [간편결제·PG·키오스크처럼 별도 가맹점번호로 승인되거나 PG·간편결제 가맹점명으로 찍힌 결제는 할인하지 않는다, 할인은 매출전표 접수 순서로 한도를 적용한다, 실적과 할인 한도는 본인과 가족 카드를 합산한다, TV 수신료·고속도로 통행료·후불하이패스는 실적에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 실적에 넣지 않는다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, 현대카드의 다른 청구 할인과 겹치면 큰 쪽 하나만 준다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 가이드북(2026년 4월 기준) 시행일을 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
notes: 2026-10-11 공식 가이드북(2026년 4월 기준) 대조. 연회비 국내전용과 국내외겸용(Visa/Amex Platinum) 15,000원(기본 10,000+제휴 5,000), 가족카드 5,000원. 전월 40만 이상 올리브영·미용실·무신사·29CM·W컨셉·KREAM·나이키 10%를 월 1만·2만·3만5천원(40만·80만·120만) 한도로 담았다. 피부과·성형외과·치과와 헬스 영역, 룰루레몬은 담을 업종이나 가맹점이 없어 뺐다. 커피전문점·편의점·대중교통 5%는 영역별 월 5천원이고 세 영역 합쳐 40만 이상 5천원, 80만 이상 1만원, 120만 이상 1만5천원이다. 국내 가맹점만. 원문에 끝수 처리가 없어 원 미만 버림. 실적은 전월 1일~말일 일시불과 할부이고 공과금 등, 무이자 할부, 이 카드 혜택을 받은 결제 전체를 뺀다. 취소는 승인월에서 빼고 해외는 취소 달에서 뺀다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 40만 미만도 40만 구간 한도로 준다. 할인 제외는 상품권·선불카드와 다른 현대카드 할인·무이자 할부뿐이다.
