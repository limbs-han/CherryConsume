    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 발급받았나요?'}
    benefits:
      - key: academy-7
        title: 학원 7% 환급할인
        source: page
        evidence: [학원 | 7% | 5천원 | 1만원, 이용금액 건당 3만원~10만원까지 할인 적용, '할인제외 : PG(인터넷결제) 이용금액', 최초 카드발급 후 사용등록일로부터 다음 달 말일까지 이용실적이 없는 경우에도 1구간 서비스 제공됩니다.]
        target:
          categories: [education.academy]
        when:
          - amount: {min: 30000}
        reward: {type: cashback, rate: 7}
        limits:
          - {per: txn, base: 100000}
          - per: month
            amount: {0: 5000, 300000: 5000, 500000: 10000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [PG 인터넷결제로 낸 학원비는 할인에서 빠진다]
      - key: book-5
        title: 교보문고·영풍문고 매장 5% 환급할인
        source: page
        evidence: [서점 | 5% | 5천원 | 1만원, 이용금액 건당 3만원~10만원까지 할인 적용, '서점 : 서점 업종', '할인제외 : PG(인터넷결제) 이용금액']
        target:
          merchants: [kyobo_book, youngpoong_book]
        when:
          - channel: offline
            amount: {min: 30000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, base: 100000}
          - per: month
            amount: {0: 5000, 300000: 5000, 500000: 10000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [원문 대상은 서점 업종 전체지만 공통 파일에 서점 업종이 없어 교보문고와 영풍문고 매장만 계산한다]
      - key: pet-5
        title: 동물병원·애완동물 5% 환급할인
        source: page
        evidence: [동물병원 | 5% | 5천원 | 1만원, 이용금액 건당 3만원~10만원까지 할인 적용, '동물병원 : 동물병원/애완동물 업종']
        target:
          categories: [pet]
        when:
          - amount: {min: 30000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, base: 100000}
          - per: month
            amount: {0: 5000, 300000: 5000, 500000: 10000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: pharmacy-5
        title: 약국 5% 환급할인
        source: page
        evidence: [약국 | 5% | - | 5천원, 이용금액 건당 3만원~10만원까지 할인 적용, '약국 : 약국 업종']
        target:
          categories: [pharmacy]
        when:
          - amount: {min: 30000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, base: 100000}
          - {per: month, amount: 5000}
        tiers: {from: 500000}
      - key: transit-5
        title: 버스·지하철 5% 할인
        source: page
        evidence: ['전국 버스·지하철 | 5% | 1,500원', '후불교통 (시내버스, 지하철) 5% 청구할인', '할인 제외 : 공항버스']
        target:
          categories: [transit.bus_city, transit.subway]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 1500}
        tiers: {from: 300000}
        unmodeled: [후불교통은 실제 이용일이 아니라 이용내역서에 적힌 이용일 기준으로 할인한다, '고속·시외버스 5% 환급할인도 같은 월 1,500원 한도를 쓰지만 공항버스를 나눌 수 없어 계산하지 않는다']
    unmodeled: [월간 할인한도는 본인회원 기준이다, '무승인 결제(자판기, 터널통행료 등)와 정부지원금은 실적에서 빠진다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통 이용금액 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits[transit-5].limits', question: '대중교통 월 한도 1,500원은 표에서 두 구간에 걸친 한 칸이라 30만, 50만 구간 모두 1,500원으로 보았다', assumed: 1500}
notes: 2026-10-11 KB국민카드 상품 페이지(준법감시인 심의필 200428-01318-HPP)를 직접 받아 대조했다. 연회비가 없는 체크카드다. 해외 이용금액은 실적에서 빠진다. 실적 유예는 학원, 서점, 동물병원에만 적혀 있다.
