open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품설명서 판(2023.6)의 첫날로 두었다. 부가서비스 변경 제한 기준일은 2023-05-18다, assumed: '2023-06-01'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통 범위가 적혀 있지 않아 시내버스와 지하철로 두었다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 상품설명서(2023.6판, 심의필 2023-C1a-05476호) 대조. 연회비 해외겸용 VISA와 국내전용 모두 15,000원(기본 7,000+제휴 8,000). 메가스터디교육 할인은 구간별 월 한도까지 온라인 결제금액을 깎는다. 생활요금과 보험은 함께 월 3회다. 발급월+1개월까지는 30만 구간 혜택. 실적 제외는 무이자할부, 4대보험, 국세·지방세·공과금, 아파트 관리비, 임대료, 유치원·학교납입금, 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다. 할인 받은 이용금액은 실적에 들어간다.
