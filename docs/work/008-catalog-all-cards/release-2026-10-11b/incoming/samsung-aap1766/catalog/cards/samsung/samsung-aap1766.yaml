open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품설명서 판(2022.8)의 첫날로 두었다. 부가서비스 변경 제한 기준일은 2022-06-30이다, assumed: '2022-08-01'}
  - path: revisions[0].limits[life]
    question: 상품설명서가 생활 필수 영역 1.5%의 통합 월 할인한도를 100만원으로 적었다. 상품 페이지에서 다시 확인하지 못했다
    assumed: '1000000'
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통 범위가 적혀 있지 않아 시내버스와 지하철로 두었다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-11 상품설명서(2022.8판, 심의필 2022-C1a-04459호) 대조. 연회비 해외겸용 VISA와 국내전용 모두 49,000원(기본 7,000+제휴 42,000). 0.5%는 실적과 한도 없이 주고 나머지는 전월 50만원 이상이다. 발급월+1개월까지는 50만 구간 혜택. 주유는 일 1회, 1회 10만원, 월 30만원까지 리터당 할인이다. 실적 제외는 4대보험, 국세·지방세·공과금, 임대료, 학교납입금, 등록금, 대중교통, 택시, 하이패스 통행요금, 기프트·선불카드, 상품권이다. 아파트 관리비, 무이자할부, 할인 받은 이용금액은 실적에 들어간다.
