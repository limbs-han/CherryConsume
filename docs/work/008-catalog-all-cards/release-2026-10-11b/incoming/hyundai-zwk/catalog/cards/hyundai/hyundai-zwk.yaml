open_questions:
  - {path: 'revisions[0].effective_from', question: 출시일은 2025-07-17이고 가이드북은 2026년 10월 기준이다. 그 사이 혜택이 같았는지 확인하지 않았다, assumed: '2026-10-01'}
notes: 2026-10-11 공식 가이드북(2026년 10월 기준) 대조. 연회비 국내전용과 국내외겸용(Visa/Amex Platinum) 20,000원(기본 10,000+제휴 10,000), 가족카드 5,000원. 전월 50만 이상 9개 영역 5%, 일반음식점·주유소·대형마트는 토·일요일 10%. 기본과 추가를 합쳐 월 2만5천원(50만 이상), 5만원(100만 이상). 영역별 한도는 가이드북 표를 따랐다. 이동통신·대중교통 월 5천원, 온라인몰·커피·편의점·배달 앱 월 4회 건당 1천원, 음식점 월 2회 건당 1천원(주말 2천원), 주유·대형마트 월 2회 건당 2천5백원(주말 5천원). 표시 영역은 일 1회. 평일 공휴일은 5%. 실적에서 무이자 할부를 빼지만 할인 받은 결제는 뺀다는 문구가 없어 실적에 넣는다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 50만 구간 한도. 원문에 끝수 처리가 없어 원 미만 버림.
