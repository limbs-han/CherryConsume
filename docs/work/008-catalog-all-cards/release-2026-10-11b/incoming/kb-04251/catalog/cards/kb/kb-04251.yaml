        tiers: {from: 300000}
        exclude_applied: 1
    unmodeled: [정부지원금, 현금서비스, 카드론, 수수료, 항공기내 무승인전표는 실적에서 빠진다. 부분 무이자할부도 실적에서 빠진다, 월 할인한도는 본인회원 기준으로 가족카드와 합산한다]
open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인 대중교통 전표 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠질 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙의 시작일을 찾지 못해 수집일로 둔다, assumed: '2026-10-11'}
notes: 2026-10-11 KB국민카드 상품 페이지와 대조. 공통 가맹점 kb_insurance(KB손해보험)가 필요하다. 주유 대상 유종의 원문 표기 '경우'는 경유로 읽었다.
