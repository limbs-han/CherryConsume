schema_version: 2
id: lotte-1835
issuer: lotte
name: LOCA 더하기 카드(Prime)
kind: credit
product_codes: []
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://image.lottecard.co.kr/UploadFiles/cardProvisionPath/2023-A00011_20260923_10003.pdf', fetched_at: '2026-10-11'}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2023-05-09'
    source: manual
    tiers: [0, 3000000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit.bus_express]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: original_month
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 3000000, from: issue}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit.bus_express]
    limits:
      - {key: special, per: month, amount: 20000}
    stacks:
      - key: main
        pick: priority
        order: [dept-2-4, travel-2-4, overseas-2-4, basic-1-2]
        spill: split
    benefits:
      - key: basic-1-2
        title: 국내외 모든 가맹점 1.2% 결제일 할인
        source: manual
        evidence: [기본할인  국내외 모든 가맹점  1.2%  없음, 국내외 모든 가맹점에서 혜택이 제공됩니다.]
        target: {all: true}
        reward: {type: billing_discount, rate: 1.2}
        tiers: {from: 3000000}
      - key: dept-2-4
        title: 백화점 2.4% 결제일 할인
        source: manual
        evidence: [특별할인  백화점  2.4%  20, 000원, 특별할인은 건당 2만원 이상 결제 건에 대해서 혜택이 제공됩니다., 백화점 업종으로 등록된 가맹점에서 혜택이 제공됩니다., 오프라인 매장 이용 건만 혜택이 제공됩니다.]
        target:
          categories: [department_store]
        when:
          - amount: {min: 20000}
          - {channel: offline}
        reward: {type: billing_discount, rate: 2.4}
        limits:
          - {shared: special}
        tiers: {from: 3000000}
        unmodeled: [백화점 안 임대매장 이용금액은 할인에서 빠진다]
      - key: travel-2-4
        title: 항공·호텔 2.4% 결제일 할인
        source: manual
        evidence: [골프, 항공, 호텔 업종으로 등록된 가맹점에서 혜택이 제공됩니다, 일부 PG(결제대행) 업체를 통해 결제 시 혜택이 제공되지 않습니다.]
        target:
          categories: [travel.airline, travel.hotel]
        when:
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 2.4}
        limits:
          - {shared: special}
        tiers: {from: 3000000}
        unmodeled: [일부 PG 업체를 통한 결제는 할인에서 빠진다]
      - key: overseas-2-4
        title: 해외 2.4% 결제일 할인
        source: manual
        evidence: [모든 해외 가맹점 이용 건에 혜택이 제공됩니다.]
        target: {all: true}
        when:
          - amount: {min: 20000}
          - {region: overseas}
        reward: {type: billing_discount, rate: 2.4}
        limits:
          - {shared: special}
        tiers: {from: 3000000}
    unmodeled: [실적은 지난달 모든 롯데 개인 신용카드 이용금액 300만원 이상이고 그중 이 카드 이용금액이 100만원 이상이어야 한다. 다른 롯데카드 이용금액을 알 수 없어 이 카드만으로 300만원을 채워야 혜택을 계산한다, 특별할인 골프 업종은 공통 업종이 없어 계산하지 않는다. 골프 결제는 기본할인 1.2%로 계산한다, 기본할인과 특별할인은 중복되지 않고 특별할인 한도를 넘는 금액은 기본할인을 받는다, 국내 가맹점 5만원 이상 2~3개월 할부는 무이자 할부이고 그 결제는 다른 할인과 실적에서 빠진다, 롯데카드의 다른 결제일 할인과 겹치면 할인 금액이 큰 혜택 하나만 준다, '고속도로 통행요금, 무승인전표, 벌금·과태료·민원 발급 수수료·관세·인지세·송달료, 장애인 고용부담금, 오토·스마트 캐시백 신청 이용금액, 포인트 충전, 현금서비스·카드론·이자·수수료는 실적과 할인에서 빠진다', 카드 발급 월부터 12개월 동안 1, 200만원 이상 이용하면 내년도 연회비를 면제한다. 계산하지 않는다, 할인은 승인 시점 기준 남은 한도 안에서 준다, 이 카드로 결제하면 롯데카드가 주는 L.POINT 적립은 없다]
notes: 2026-10-11 상품설명서(2026년 8월 기준, 2026-09 심의) 대조. 출시일 2023-05-09. 상품 코드를 공개 목록에서 찾지 못해 공시 색인 id를 그대로 둔다. 특별할인 한도가 설명서 앞쪽 표에는 20,000원, 뒤쪽 표에는 24,000원으로 달라 덜 주는 20,000원으로 두었다. 세 영역은 한도 한 칸을 같이 써 함께 쓰는 한도로 두었다. 신규 발급 특례는 발급일부터 다음 달 말일까지 실적과 관계없이 할인이라 300만 구간으로 넣었다. 공과금과 아파트관리비는 원문 제외 목록에 없어 실적과 할인에 넣었다. 가족카드는 발급되지 않는다.
