        source: manual
        evidence: [롯데 플래티넘 카드 | 이용금액의 0.2% L.POINT 적립, 국내 및 해외 가맹점에서 롯데 플래티넘 카드로 결제 시 롯데카드 제공 L.POINT 0.2% 적립, L.POINT 적립기준에 따라 결제금액 1천원 당 해당 적립률로 포인트가 적립됩니다.]
        target: {all: true}
