notes: 2026-10-11 상품 안내장(2026년 8월 기준, 여신금융협회 심의필 제2026-C1a-13110호) 대조. 출시일 2006-10-16. 해외겸용(VISA, MASTER) 연회비 10만원, 가족카드 5만원. 국내외 가맹점 0.2% L.POINT 적립, 1천원당 2포인트로 옮겼다. 실적 조건과 한도 문구 없음. 같은 안내장의 SKYPASS와 아시아나클럽 플래티넘은 다른 카드라 담지 않았다.
