notes: 2026-10-11 공식 가이드북 대조. SC제일은행 판 현대카드ZERO Edition3(할인형)이고 혜택은 hyundai-zero-edition3-discount와 같다. 연회비 국내전용과 국내외겸용(Visa Platinum) 15,000원(기본 10,000+제휴 5,000), 가족카드 5,000원. 실적·한도 없이 0.8% 청구할인. 할인 제외는 공과금, 전기·가스·관리비·월세, 학교 납입금·등록금, 상품권·선불, 4대보험, 고속도로 통행료·후불하이패스·고속버스, 현대카드 다른 할인·무이자할부 적용 건, 연회비와 해외 수수료이고 카드사 파일의 혜택 제외로 따른다.
