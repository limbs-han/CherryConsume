notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 모든 할인은 KB Pay 결제에만 준다. 커피와 편의점은 월 5천원 한도를 함께 쓴다. 실적 제외에 대중교통 무승인전표가 없어 버스·지하철을 실적에 넣는다.
