          - billing: [autopay]
        reward: {type: points, program: woori_moa_point, rate: 1.5}
        limits:
          - {shared: special}
        tiers: {from: 500000}
        unmodeled: [인터넷이나 유선전화와 결합상품으로 신청한 휴대전화 요금은 적립 제외다]
      - key: basic-1
        title: 국내 기본 1% 적립
        source: page
        evidence: [기본 | 특별가맹점 외 국내 적립 대상 가맹점 | 1%, '월 적립한도 : 특별적립 50만점 (기본적립 한도 제한 없음)']
        target: {all: true}
        when:
          - {region: domestic}
        reward: {type: points, program: woori_moa_point, rate: 1}
        tiers: {from: 500000}
      - key: fuel-60-per-liter
        title: 주유 리터당 60원 청구할인
        source: page
        evidence: ['HD현대오일뱅크, S-OIL 주유 및 충전 시 리터당 60원 청구할인', '통합 1일 1회, 1회 결제금액 최대 10만원 / 월 결제 금액 20만원에 한함', 전월 국내 가맹점 이용실적 50만원 이상 시 제공]
        target:
          merchants: [hd_oilbank, s_oil]
        reward: {type: billing_discount, per_liter: 60}
        limits:
          - {per: day, count: 1}
          - {per: txn, base: 100000}
          - {per: month, base: 200000}
        tiers: {from: 500000}
        stack: fuel
    unmodeled: [Two-in-One 결제서비스로 체크 결제된 매출은 0.3%만 적립한다. 이 서비스를 쓰는지 알 수 없어 신용 결제로 계산한다, 교통카드 이용금액과 통신료 자동납부 금액은 매출표 접수일 기준으로 실적에 넣는다, 취소 매출표가 매월 1~2일에 접수되면 전월 실적에서 뺀다, 가족카드 포인트는 본인회원에게 합산 적립되지만 전월실적과 한도는 카드별로 따로 본다, 프리미엄 기프트·여행 기프트·공항라운지·렌터카·KTX 할인 같은 서비스는 결제 혜택이 아니라 계산하지 않는다, 모아포인트와 우리WON꿀머니는 1점에 1원이다]
open_questions:
  - path: revisions[0].benefits[basic-1].tiers
    question: 요약에는 모아포인트 1~2% 적립이 전월 국내 가맹점 이용금액 50만원 이상 시 제공이라 적혀 있고, 적립표 아래에는 전월 이용 실적 조건 없음이라 적혀 있다. 덜 주는 쪽으로 50만원 이상만 적립한다
    assumed: '500000'
  - {path: 'revisions[0].benefits', question: '특별적립 대상 가맹점 목록에 여행사(하나투어 등)와 대형마트(이마트, 홈플러스, 롯데마트)가 있으나 적립률 표에는 없다. 기본 1%로 두었다', assumed: 기본 1%}
  - {path: 'revisions[0].stacks', question: 특별적립 월 50만점을 다 쓴 뒤 같은 가맹점 결제에 기본 1%를 주는지 문구가 없다, assumed: 주지 않음}
  - {path: 'revisions[0].benefits[basic-1].reward', question: 원 미만 포인트 처리 문구가 없다, assumed: floor}
notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품출시일 2026-10-02. 연회비 30만원(기본 3만원과 제휴 27만원), 국내전용과 Mastercard·VISA 해외겸용. 해외·면세점 2%, 병의원·커피·영화·이동통신 1.5%, 그 밖의 국내 1%. 특별적립만 월 50만점 한도. 주유는 HD현대오일뱅크·S-OIL 리터당 60원, 일 1회 건당 10만원 월 20만원까지. 실적 제외는 해외, 현금서비스, 카드론, 수수료, 이자, 연회비다.
