        title: 영화 1.5% 특별 적립
        source: page
        evidence: ['특별 | 병의원(동물병원 포함), 커피, 영화, 이동통신 | 1.5%', '영화 | CGV, 롯데시네마', 예매 대행사이트를 통해 결제 시 제외]
        target:
          merchants: [cgv, lotte_cinema]
        reward: {type: points, program: woori_moa_point, rate: 1.5}
        limits:
          - {shared: special}
        tiers: {from: 500000}
        unmodeled: [예매 대행사이트로 결제하면 특별 적립 제외다]
      - key: special-telecom-15
        title: 이동통신 자동이체 1.5% 특별 적립
        source: page
        evidence: ['특별 | 병의원(동물병원 포함), 커피, 영화, 이동통신 | 1.5%', '이동통신 | SKT, KT, LGU+, 헬로모바일, KTM모바일, U+유모바일', '휴대전화 요금에 한하며, 본 카드로 대상 통신사에 자동이체 신청 후 결제한 건에 대해서만 적립', '인터넷, 유선전화 등 결합상품 신청 시에는 적립 제외']
