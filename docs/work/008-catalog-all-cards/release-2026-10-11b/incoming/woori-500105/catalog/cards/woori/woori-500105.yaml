        target:
          merchants: [paul_bassett, starbucks, twosome]
        reward: {type: points, program: woori_moa_point, rate: 1.5}
        limits:
          - {shared: special}
        tiers: {from: 500000}
        unmodeled: [백화점·대형마트 안 매장과 미군부대 매장은 특별 적립 제외다, 커피 브랜드 상품권과 선불카드 구매·충전은 적립 제외다]
