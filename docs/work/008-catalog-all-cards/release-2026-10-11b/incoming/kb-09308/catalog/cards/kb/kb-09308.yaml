notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 결제 금액만큼 KB Pay 머니가 빠지는 선불형 카드라 체크카드로 둔다. 적립은 KB Pay 머니로 돌려받아 캐시백으로 옮겼다. 월 통합 최대 2만원은 세 혜택 한도 합과 같아 따로 적지 않았다.
