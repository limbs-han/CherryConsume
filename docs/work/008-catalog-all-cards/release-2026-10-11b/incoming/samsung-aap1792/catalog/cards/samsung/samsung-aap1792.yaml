notes: 2026-10-11 상품안내장(2023.4판, 여신금융협회 심의필 제2023-C1a-03058호)과 대조. 연회비 국내전용과 해외겸용 VISA 모두 20,000원(기본 7,000+제휴 13,000). 발급월+1개월까지는 30만원 미만이어도 30만 구간 혜택을 준다. 실적 제외는 4대보험, 국세·지방세·공과금, 아파트관리비, 부동산 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드 구매와 충전, 상품권이다.
