        evidence: [보람상조 자동납부 | 40만원 이상 | 5천원, 80만원 이상 | 8천원, 120만원 이상 | 1만 1천원, '최초 카드 사용일(KB Pay 등 간편결제 등록 포함)로 부터 다음 달 말일(실적 유예 기간)까지 보람상조 KB카드 전월 이용실적 40만원 미만 시, 월 2천 5백원 한도까지 할인이 제공됩니다.']
