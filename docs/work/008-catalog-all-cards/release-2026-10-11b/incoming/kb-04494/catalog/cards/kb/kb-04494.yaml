        evidence: ['G마켓, 옥션, 11번가 | 40만원 이상 | 10% | 5천원', 'G마켓, 옥션, 11번가에서 KB Pay 결제수단으로 결제 시 할인']
        target:
          merchants: [auction, eleven_st, gmarket]
        when:
          - payment: [kb_pay]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 400000}
        unmodeled: [실적 유예 기간 월 2천5백원 한도 할인은 보람상조 할인과 같은 한도인지 알 수 없어 오픈마켓에는 계산하지 않는다]
    unmodeled: ['무승인전표(대중교통, 공항버스, 자판기, 터널통행료 등)와 정부지원금은 실적에서 빠진다', 실적과 할인한도는 본인회원 기준이라 가족카드 이용분과 합산한다, 할인은 전표 매입 순서대로 적용한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일을 잠정 적용 시작일로 둔다. 상품 출시일은 2025-06-30이다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits[boram-autopay].reward', question: 보람상조 할인은 월 할인한도 금액까지 자동납부 금액에서 깎는 것으로 보았다. 할인율은 원문에 없다, assumed: 'rate 100, 월 한도 5천/8천/1만1천원'}
notes: 2026-10-11 KB국민카드 상품 페이지(준법감시인 심의필 제260406-01115-PIF)를 직접 받아 대조했다. 연회비는 실물 국내전용·Master 2만2천원, 모바일단독 1만6천원이고 면제 조건이 없다. 할인 받은 이용 건은 전체가 실적에서 빠진다. 보람상조 가맹점은 공통 파일에 새로 더해야 한다.
