open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문 하단 출시일 문구가 펫코노미카드(2017.07.28)로 적혀 있다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 한도표의 colspan으로 마트와 온라인 1만원이 2·3구간 공통임을 확인했다. 펫코노미카드(kb-04404)와 혜택과 연회비가 달라 다른 상품으로 본다. 강아지와 고양이 디자인은 같은 상품이다.
