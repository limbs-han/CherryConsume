notes: 2026-10-11 상품설명서(2026년 8월 기준, 여신금융협회 심의필 제2026-C1a-13596호) 대조. 출시일 2023-04-07. 국내외 가맹점 결제일 할인, 지난달 100만원 미만 0.5%, 100만원 이상 1.0%, 한도 없음, 중복 없음. LOCA CLASSIC(lotte-loca-classic)과 달리 구간이 100만원이고 대중교통·택시·고속버스가 실적과 할인에서 빠진다. 최초 발급 시 발급일부터 다음 달 말일까지 특별할인. 가족카드 연회비 13,000원.
