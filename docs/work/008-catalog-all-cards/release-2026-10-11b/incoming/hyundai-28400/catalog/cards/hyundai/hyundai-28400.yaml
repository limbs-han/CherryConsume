schema_version: 2
id: hyundai-28400
issuer: hyundai
name: 현대카드M-경차전용카드 Edition2(경형승합)
short_name: 현대 M 경차전용 Ed2
search_names: [경차전용카드 Edition2, 경차전용카드 에디션2, 현대카드M 경차전용카드]
kind: credit
product_codes: []
status: on_sale
annual_fees:
  - {scope: domestic, amount: 5000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/T_A3W-20260518-1024-06_%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81_%EA%B2%BD%EC%B0%A8%EC%A0%84%EC%9A%A9%20Ed2_V3_%EA%B3%B5%EC%8B%9C%EC%8B%A4%EC%9A%A9.pdf', fetched_at: 2026-10-11}
checked_at: 2026-10-11
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: manual
    tiers: [0, 300000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_express, utility]
      interest_free: exclude
      cancellation: original_month
    new_card: {until: next_month_end, tier: 300000, from: issue}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [고속도로 통행 요금은 적립에서 뺀다, 현대카드의 다른 할인이 적용된 결제는 적립에서 뺀다]
    options:
      - key: fuel_type
        title: 주유 할인 신청 유종
        choices:
          - {key: gasoline_diesel, title: 휘발유·경유}
          - {key: lpg, title: LPG}
        default: null
        change: immediate
        unsupported: [lpg]
    benefits:
      - key: fuel-150
        title: SK에너지·HD현대오일뱅크 리터당 150원 청구 할인
        source: manual
        evidence: [SK에너지·HD현대오일뱅크에서 주유 시 리터당 150원 청구 할인 모든 충전소(LPG) 이용 시 리터당 150원 청구 할인, 할인 한도 월 2만원, '유류비 결제 금액 기준 1회 6만원, 1일 12만원 한도 내 청구 할인 적용', 최초 신청 유종에 한해 제공, 온라인 및 앱으로 결제 시 유종 확인 불가하여 할인 적용 불가, 전월 이용 금액 30만원 이상 시 혜택 제공, 신규 발급 시 발급월 포함 2개월간 전월 이용 금액 관계없이 청구 할인 제공]
        target:
          merchants: [hd_oilbank, sk_energy]
        when:
          - option:
              fuel_type: [gasoline_diesel]
          - {channel: offline}
        reward: {type: billing_discount, per_liter: 150}
        limits:
          - {per: txn, base: 60000}
          - {per: day, base: 120000}
          - {per: month, amount: 20000}
        tiers: {from: 300000}
        exclude_applied: 1
        unmodeled: [리터는 SK에너지·HD현대오일뱅크 공시 휘발유가로 환산하고 경유도 휘발유가로 환산한다, M포인트나 H-Coin으로 결제하면 할인하지 않는다]
      - key: base-02
        title: 국내 가맹점 0.2% M포인트 적립
        source: manual
        evidence: [국내 가맹점에서 0.2% M포인트 적립, 전월 이용 금액 30만원 이상 시 적립, 매출 건별로 소수점 이하 반올림 후 적립, 신규 발급 시 발급월 기준 다음 달 이용 건까지는 전월 이용 금액 30만원 미만일 경우에도 적립 제공]
        target: {all: true}
        when:
          - {region: domestic}
        reward: {type: points, program: hyundai_m_point, rate: 0.2, round: round}
        tiers: {from: 300000}
      - key: gs-caltex-60p
        title: GS칼텍스 리터당 60 M포인트 적립
        source: manual
        evidence: [GS칼텍스 주유 시 리터당 60 M포인트 적립, '일 2회, 1회 10만원 한도(LPG 제외) (회당 10만원 초과 주유 금액은 M포인트 적립 제외)', 특별 적립은 기본 적립과 중복 적용 불가, 특별·추가 적립은 전월 이용 금액 관계없이 적립]
        target:
          merchants: [gs_caltex]
        reward: {type: points, program: hyundai_m_point, per_liter: 60}
        limits:
          - {per: txn, base: 100000}
          - {per: day, count: 2}
        unmodeled: [LPG 충전은 적립하지 않는다, 리터는 GS칼텍스 고시 휘발유가로 환산하고 등유와 경유도 휘발유가로 환산한다, 일부 주유소는 적립하지 않는다]
    unmodeled: [LPG 충전소 리터당 150원 할인은 공통 업종에 LPG가 없어 계산하지 않는다, 현대자동차·기아 신차 구매 1.5% M포인트는 공통 가맹점이 없어 계산하지 않는다, 제휴 온라인쇼핑몰 추가 M포인트는 현대카드 홈페이지를 거쳐 접속해야 해 계산하지 않는다, 경차 유류세 환급은 유류세환급 카드의 정부 환급이라 계산하지 않는다, 대중교통 등 사후 승인 가맹점 이용 금액은 매출전표 접수일 달의 실적으로 센다]
open_questions:
  - {path: product_codes, question: 카드 상세 주소의 상품 코드를 확인하지 못했다, assumed: '[]'}
  - {path: 'revisions[0].effective_from', question: 가이드북 시행일을 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
  - {path: name, question: 가이드북은 경차전용카드 Edition2와 Edition2(유류세환급)만 적고 경형승합이라는 이름은 없다. 같은 혜택으로 보았다, assumed: 경차전용카드 Edition2와 같은 혜택}
notes: 2026-10-11 공식 가이드북 대조. 연회비 국내전용 5,000원이고 유류세환급 카드는 연회비가 없다. 전월 30만 이상 SK에너지·HD현대오일뱅크 리터당 150원 청구 할인(1회 6만원·1일 12만원 결제액까지, 월 2만원, 최초 신청 유종만, 오프라인만), 국내 0.2% M포인트(건별 반올림), GS칼텍스 리터당 60 M포인트(실적 무관, 일 2회, 1회 10만원, 기본 적립과 중복 없음). 실적은 전월 1일~말일 일시불과 할부이고 공과금, 전기·가스·관리비, 학교 납입금, 상품권·선불, 4대보험, 고속버스, 할인 받은 결제, 무이자 할부를 뺀다. 취소는 최초 결제월에서 뺀다. 신규 발급 시 발급월 포함 2개월은 실적과 관계없이 할인과 적립을 준다.
