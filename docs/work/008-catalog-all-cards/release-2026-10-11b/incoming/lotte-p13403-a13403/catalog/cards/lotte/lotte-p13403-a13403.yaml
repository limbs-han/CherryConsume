    unmodeled: [서점·문구점 오프라인 10% 결제일 할인(월 5천원)은 서점·문구 업종이 없어 계산하지 않는다, LOCA 시리즈 카드가 아닌 롯데카드 이용금액만 실적에서 빠져 다른 LOCA 시리즈 카드 이용금액도 실적에 합산될 수 있다. 이 카드 결제만 센다, 가족카드 이용금액과 할인한도가 본인카드와 합산된다, 해외 이용과 대중교통 같은 무승인 결제는 롯데카드 접수일 기준으로 실적에 들어가 이용한 달과 다를 수 있다, '오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 포인트 충전, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', 롯데카드의 다른 결제일 할인 혜택과 겹치면 할인이 큰 혜택 하나만 준다, 할인은 승인 시점 기준 남은 한도 안에서 준다, 이 카드로 결제하면 롯데카드가 주는 L.POINT 적립은 없다]
notes: 2026-10-11 상품설명서(2026년 9월 심의) 대조. 상품 페이지는 내용이 비어 있어 설명서만 썼다. 출시일 2020-07-10. 지난달 150만원 이상일 때만 할인. 신규 발급 특례는 발급일부터 다음 달 말일까지 실적과 상관없이 혜택이라 150만 구간으로 넣었다. 유치원은 실적에서는 초중고 납입금과 함께 빼는 LOCA for Coffee 방식을 따랐다.
