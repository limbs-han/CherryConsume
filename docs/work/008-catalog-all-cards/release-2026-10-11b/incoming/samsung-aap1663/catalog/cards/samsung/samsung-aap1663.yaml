        title: LG U+ 통신요금 자동납부 할인
        source: manual
        evidence: ['LG U+ 통신요금 자동납부 시, 전월 생활요금 자동납부 결제건수에 따라 LG U+ 통신요금 월 자동납부금액 7,000원~16,000원 결제일할인(청구할인)', '0건(통신요금 자동납부만 이용 시) 30만원 이상 7,000원, 70만원 이상 10,000원, 120만원 이상 13,000원', 통합 월 1회 제공됩니다., 'LG U+ 통신요금 자동납부 합산 금액이 월 할인한도보다 적은 경우, 자동납부금액만큼 해당월 회원님의 카드 결제대금에서 자동 차감됩니다.']
        target:
          merchants: [lg_uplus]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - {shared: telecom}
        tiers: {from: 300000}
        unmodeled: ['결합상품요금, 휴대전화 단말기 구매금액, 대리점 카드 결제건은 할인하지 않는다']
    unmodeled: ['전월 생활요금 자동납부(아파트 관리비, 4대 사회보험, 생명·손해보험, 코웨이·SK매직 렌탈 중 10,000원 이상) 건수가 1건, 2건, 3건 이상이면 월 할인한도가 1,000원, 2,000원, 3,000원씩 커진다. 건수를 계산하지 않아 0건 한도로만 할인한다', 'LG U+ 24개월 라이트할부(최소 10만원, 연 5.9%)는 할부 서비스라 계산하지 않는다', 삼성카드의 다른 결제일할인과 중복되지 않고 큰 금액만 적용한다, '전월 이용금액은 승인 시점 기준이고 해외 결제와 무승인 결제(대중교통, 자동납부 등)는 매출전표 접수 시점 기준이다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품 출시일로 두었다. 상품안내장은 2022.7판이다, assumed: '2020-06-19'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통을 새 방식대로 시내버스와 지하철로 뺐다. 초·중·고 납입금은 school_fee와 primary_secondary_fee를 모두 뺐다. 삼성카드는 사회보험료를 공과금으로 분류해 insurance.social도 뺐다, assumed: 'transit.bus_city, transit.subway, education.school_fee, insurance.social'}
  - {path: 'revisions[0].limits[telecom]', question: 생활요금 자동납부 건수에 따른 한도 증가를 담지 않고 0건 한도만 두었다, assumed: 0건 한도}
notes: 2026-10-11 상품안내장(2022.7판)과 대조. 연회비 국내전용과 해외겸용 모두 20,000원(기본 7,000+제휴 13,000). 통신요금 할인은 자동납부금액만큼 월 한도까지 결제대금에서 빼 준다. 발급월+1개월까지는 30만원 미만이어도 30만 구간 혜택을 준다. 실적 제외는 무이자할부, 4대보험, 국세·지방세·공과금, 초중고 납입금, 대학 등록금, 대중교통, 택시, 아파트관리비, 부동산 임대료, 기프트·선불카드 구매와 충전, 상품권이다. 할인 받은 결제도 실적에 넣는다.
