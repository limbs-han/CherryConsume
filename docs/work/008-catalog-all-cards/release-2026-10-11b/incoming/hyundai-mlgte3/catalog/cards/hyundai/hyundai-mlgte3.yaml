    unmodeled: [신규 발급 시 발급월 포함 2개월간 전월 이용금액 무관 15, 000원 할인 특례는 계산하지 않는다, 할인 24개월 이후의 기본 M포인트 업종별 0.5~3%(당월 100만원 이상 1.5배)는 결제일에 청구된 당월 이용금액 50만원 이상일 때만 주는 방식이라 계산하지 않는다, GS칼텍스 리터당 60 M포인트와 현대자동차·기아 신차 1.5% M포인트 특별 적립은 계산하지 않는다, 제휴 온라인쇼핑몰 추가 M포인트는 현대카드 홈페이지 경유 결제라 계산하지 않는다, 자동이체일이 지난 뒤 결제된 LG U+ 요금은 할인하지 않는다, LG U+ 라이트할부 이용금액은 실적에서 빠지지만 가려내지 못한다, 고속도로 통행요금과 후불하이패스 이용금액은 실적에서 뺀다, 현대카드의 다른 할인 서비스가 적용된 결제는 실적에서 뺀다, 실적과 할인 한도는 본인과 가족 카드를 합산한다, 사후 승인 가맹점 이용금액은 매출전표 접수일 달의 실적으로 센다]
open_questions:
