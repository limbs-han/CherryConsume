notes: 2026-10-11 공식 가이드북 대조. kt-현대카드M Edition3(통신할인형2.0)(hyundai-24083)과 통신사만 다르고 혜택 구조가 같아 그 파일을 따랐다. 연회비 국내전용과 국내외겸용(VISA/AMEX) 20,000원(기본 10,000+제휴 10,000), 가족카드 10,000원. LG U+ 통신요금 자동이체 청구할인을 최초 발급에 한해 24개월간 전월 50만 이상 15,000원, 100만 이상 25,000원 준다. 자동이체 금액이 할인액보다 적으면 그 금액만큼이라 rate 100에 월 한도로 담았다. 24개월 뒤에는 결제일 기준 당월 이용금액으로 정하는 M포인트 적립이라 담지 않았다. 실적은 전월 1일~말일 일시불과 할부이고 청구할인이 적용된 LG U+ 통신요금, 공과금 등, 고속버스, 무이자할부를 뺀다.
