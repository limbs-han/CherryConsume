        title: 국내 온라인 간편결제 2% 추가 청구할인
        source: page
        evidence: ['우리WON페이, 네이버페이, 카카오페이 | + 2%', ※ 전월실적 40만원 이상 시 혜택 제공, ※ 추가 할인은 해당 간편결제에 본 카드를 등록하여 온라인에서 결제 시 제공, 추가 할인 | 40만원 이상 | 1만원, 80만원 이상 | 2만원, ※ 추가 할인한도 초과 이용금액은 기본 할인혜택만 제공]
        target: {all: true}
        when:
          - payment: [kakao_pay, naver_pay, woori_won_pay]
          - {channel: online}
          - {region: domestic}
        reward: {type: billing_discount, rate: 2}
        limits:
          - {shared: extra}
        tiers: {from: 400000}
        stack: extra
        unmodeled: [의약품 전용몰과 제약회사 업종 결제는 추가 할인에서 빠진다, Two-in-One 결제서비스로 체크 매출이 된 건은 추가 할인이 없다]
    unmodeled: ['해외 이용, 교통카드 이용, 통신료 자동납부 금액은 매출표 접수일 기준으로 실적에 들어간다', 국내 가맹점 취소 매출이 매월 1~2일에 접수되면 전월 실적에서 뺀다, 할인은 거래 매입 순서대로 한도를 쓴다]
open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외 원문은 아파트 관리비(임대료)뿐이고 부동산 임대료를 따로 적지 않았다, assumed: 월세 카드납부도 빠진다}
notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-07-08. 페이지 표시는 신청가능. 연회비 실물 12,000원, 모바일 6,000원. 국내외 0.8% 청구할인 실적·한도 없음, 국내 온라인 간편결제(우리WON페이·네이버페이·카카오페이) 2% 추가 전월 40만/80만 이상 월 1만/2만원. woori-every-point와 같은 구조의 할인형이다.
