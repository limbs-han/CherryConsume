schema_version: 2
id: hyundai-179712
issuer: hyundai
name: 국민행복 현대카드
short_name: 현대 국민행복
search_names: [국민행복 현대카드, 국민행복카드 현대, 현대 국민행복카드]
kind: credit
product_codes: []
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/20261001_%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81_%EA%B5%AD%EB%AF%BC%ED%96%89%EB%B3%B5%20%ED%98%84%EB%8C%80%EC%B9%B4%EB%93%9C.pdf', fetched_at: 2026-10-11}
checked_at: 2026-10-11
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: manual
    tiers: [0, 300000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_express, utility]
      interest_free: exclude
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [고속도로 통행 요금과 후불하이패스 카드 이용 금액은 적립에서 뺀다, 현대카드의 다른 할인이 적용된 결제는 적립에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 적립에서 뺀다]
    limits:
      - {key: plus-5, per: month, amount: 10000}
      - {key: education-area, per: month, amount: 3000}
    benefits:
      - key: medical-5
        title: 병원·약국 5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 30만원 이상 시 의료, 온라인몰, 교육, 통신 요금, 렌탈 요금, 코스트코 5% M포인트 적립, '의료 : 병원/약국 * 산후조리원 제외', '영역별 월 3천 M포인트, 대상 영역 통합해 월 1만 M포인트 적립 한도 (적립 한도 초과 시 기본 및 추가 혜택 미적용)', 추가 혜택은 대상점별 국내 가맹점에 한해 제공]
        target:
          categories: [hospital, pharmacy]
        when:
          - {region: domestic}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {per: month, amount: 3000}
          - {shared: plus-5}
        tiers: {from: 300000}
      - key: online-5
        title: 온라인몰 5% M포인트 적립
        source: manual
        evidence: ['온라인몰 : 네이버플러스 스토어, 쿠팡, G마켓, 옥션, 11번가, SSG.COM', 쿠팡의 경우 쿠팡이츠 결제 건은 추가 혜택 제외, 온라인몰은 대상점 공식 홈페이지 및 앱 내 결제 건에 한해 추가 혜택 적용]
        target:
          merchants: [auction, coupang, eleven_st, gmarket, naver_plus_store, ssg_com]
          exclude_merchants: [coupang_eats]
        when:
          - {region: domestic, channel: online}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {per: month, amount: 3000}
          - {shared: plus-5}
        tiers: {from: 300000}
        unmodeled: [네이버플러스 스토어는 naver.com 도메인으로 확인되는 가맹점만 적립한다, 연결된 다른 사이트나 앱에서 결제하면 적립하지 않는다]
      - key: education-5
        title: 어린이집·유치원 5% M포인트 적립
        source: manual
        evidence: ['교육 : 어린이집/유치원, 학원 * 학습지 제외', 영역별 월 3천 M포인트]
        target:
          categories: [childcare, education.kindergarten]
        when:
          - {region: domestic}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: education-area}
          - {shared: plus-5}
        tiers: {from: 300000}
      - key: academy-5
        title: 학원 방문 결제 5% M포인트 적립
        source: manual
        evidence: ['교육 : 어린이집/유치원, 학원 * 학습지 제외', 학원은 오프라인 가맹점 결제(방문 결제) 건에 한해 추가 혜택 적용]
        target:
          categories: [education.academy]
        when:
          - {region: domestic, channel: offline}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: education-area}
          - {shared: plus-5}
        tiers: {from: 300000}
      - key: telecom-5
        title: 이동통신 요금 자동납부 5% M포인트 적립
        source: manual
        evidence: ['통신 요금 : SKT, KT, LG U+', '통신 요금의 경우 비정기 결제 건 및 알뜰폰·선불폰·결합상품(인터넷, TV, 유선전화 등) 이용 금액은 추가 혜택 제외']
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {per: month, amount: 3000}
          - {shared: plus-5}
        tiers: {from: 300000}
        unmodeled: [인터넷·TV·유선전화 결합상품 요금은 적립하지 않는다]
      - key: rental-5
        title: 코웨이·LG전자 렌탈 요금 5% M포인트 적립
        source: manual
        evidence: ['렌탈 요금 : coway, LG전자', '렌탈의 경우 coway, LG전자 비정기 결제 건은 추가 혜택 제외']
        target:
          merchants: [coway, coway_rental, lg_appliance_subscription]
        when:
          - billing: [autopay]
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {per: month, amount: 3000}
          - {shared: plus-5}
        tiers: {from: 300000}
      - key: costco-5
        title: 코스트코 5% M포인트 적립
        source: manual
        evidence: [코스트코(온·오프라인)]
        target:
          merchants: [costco]
        when:
          - {region: domestic}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {per: month, amount: 3000}
          - {shared: plus-5}
        tiers: {from: 300000}
      - key: base-05
        title: 국내외 가맹점 0.5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 30만원 이상 시 국내외 가맹점 0.5% M포인트 적립, '1회 및 연간 적립 한도 제한 없음 (단, 추가 혜택 영역은 적립한도 초과 시 기본 혜택 미적용)', '4,639원 결제 시 23 M포인트 적립']
        target:
          exclude_categories: [childcare, education.academy, education.kindergarten, hospital, pharmacy]
          all: true
          exclude_merchants: [auction, costco, coupang, coway, coway_rental, eleven_st, gmarket, kt, lg_appliance_subscription, lg_uplus, naver_plus_store, skt, ssg_com]
        reward: {type: points, program: hyundai_m_point, rate: 0.5, round: round}
        tiers: {from: 300000}
        unmodeled: [추가 혜택 대상점이 조건에 맞지 않는 결제(해외 결제, 비정기 통신·렌탈 결제, 학원 온라인 결제, 연결된 다른 사이트 결제 등)는 원문상 0.5%를 받지만 대상점을 0.5%에서 빼 두어 계산하지 않는다]
    unmodeled: [국가바우처 사용 금액은 실적과 적립에서 빼고 바우처와 본인 부담금을 함께 결제하면 적립하지 않는다, 간편결제·PG 가맹점명으로 찍힌 결제는 추가 혜택에서 뺀다, 적립은 매출전표 접수 순서로 한도를 적용한다, TV 수신료·고속도로 통행료·후불하이패스는 실적에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 실적에 넣지 않는다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다]
open_questions:
  - {path: product_codes, question: 카드 상세 주소의 상품 코드를 확인하지 못했다, assumed: '[]'}
  - {path: 'revisions[0].effective_from', question: 가이드북 시행일을 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
  - {path: 'revisions[0].benefits[telecom-5].when', question: 원문은 비정기 결제를 뺀다고만 한다. 자동납부로 기록한 결제만 적립한다, assumed: 'billing: [autopay]'}
notes: 2026-10-11 공식 가이드북(2026-10-01) 대조. 연회비 없음. 전월 30만 이상 추가 혜택 대상점 외 국내외 0.5%, 병원약국·온라인몰 6곳·어린이집유치원학원·이동통신 요금·코웨이 LG전자 렌탈·코스트코 5% M포인트이고 영역별 월 3천, 합쳐 월 1만 M포인트를 넘으면 적립하지 않는다. 매출 건별 소수점 이하 반올림. 적립 제외에 사립유치원 납입금이 없어 유치원은 혜택 제외에서 뺐다. 실적은 전월 1일~말일 일시불과 할부이고 국가바우처, 공과금, 전기·가스·관리비, 학교 납입금, 4대보험, 고속버스, 무이자 할부를 뺀다. 취소는 승인월에서 빼고 해외는 취소 달에서 뺀다. 신규 발급 시 수령 등록월 다음 달 이용 건까지 30만 미만도 혜택을 준다.
