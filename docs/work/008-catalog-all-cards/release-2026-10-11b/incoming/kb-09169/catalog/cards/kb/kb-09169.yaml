open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 대중교통 요금 무승인전표 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 할인과 적립을 받은 결제는 금액 전체가 실적에서 빠지고 해외 캐시백만 예외다. 레저팩은 계산하지 않는 선택지로 둔다.
