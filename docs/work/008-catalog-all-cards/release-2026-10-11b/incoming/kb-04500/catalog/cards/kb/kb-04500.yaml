notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 전월 실적 조건이 없다. 연회비는 골드 등급 선택서비스 미신청 기준으로 국내전용 5천원, 국내외겸용 1만원이다. 원문 한도는 할인 금액이 아니라 할인을 주는 이용금액 한도라 base로 옮겼다.
