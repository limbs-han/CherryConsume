            card_month: {min: 0, max: 1}
        notes: 자동이체 승인금액 전액을 월 할인금액까지 할인한다. 0 구간 12,000원은 생애 최초 발급의 실적 유예기간에만 준다
    unmodeled: [월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 결제대행업체(PG)나 간편결제 전용 가맹점으로 승인된 결제는 할인에서 빠질 수 있다, 정부지원금(보육료·유치원보조비·바우처) 결제는 실적에서 빠진다, 자판기·터널이용료·항공기내·공항버스 같은 무승인 전표는 실적에서 빠지지만 담을 업종이 없다]
