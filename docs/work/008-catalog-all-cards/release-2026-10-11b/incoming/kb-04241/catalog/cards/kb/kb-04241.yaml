        evidence: [구 분 | 세부 내용 | 전월 이용실적에 따른 할인 금액 | 1구간(30만원 이상) | 2구간(70만원 이상) | 청구 할인 | Liiv M 통신료 자동이체 할인 | 1만2천원 | 1만7천원 |, '최초 카드 사용 등록일로부터 다음달 말일까지는 KB국민 Liiv M Ⅱ 카드 실적이 없는 경우에도 1구간(전월 이용실적 30만원 이상)에 해당하는 12,000원 청구할인 서비스가 적용됩니다.', 할인금액보다 자동이체 승인금액이 적을 경우 승인금액만큼 할인 적용됩니다., 통신료 자동이체 승인 건이 여러 건인 경우 합산하여 월 할인금액 내에서 할인 됩니다., '할인(적립) 서비스 제공 관련 카드별 실적 유예기간은 본인회원이 해당카드를 생애 최초 발급받은 경우에 적용되며, 가족카드 단독 발급 시 적용되지 않습니다.']
        target:
          merchants: [liiv_m]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {0: 12000, 300000: 12000, 700000: 17000}
        tiers:
          from: 300000
