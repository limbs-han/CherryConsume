notes: 2026-10-11 상품 페이지와 상품설명서(2023년 5월 기준) 대조. 출시일 2021-05-15. 카카오뱅크 앱에서만 신청한다. 특별 캐시백은 그룹마다 월 5천원, 합계 월 3만원이고 전체 캐시백은 월 30만원이다. 스트리밍과 와인은 한 그룹이고 와인앤모어가 없어 스트리밍만 넣었다. 아울렛은 프리미엄아울렛 가맹점으로 좁혀 넣었다. 실적 제외 목록에 대중교통(버스, 지하철)과 택시가 있어 실적에서 뺐다.
