revisions:
  - effective_from: '2021-02-01'
    effective_from_estimated: true
    source: page
    tiers: [0, 400000, 800000, 1200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, taxi, transit, utility]
