        source: page
        evidence: ['편의점 | GS25, CU, 세븐일레븐 | 3천원 | 6천원', 'GS25, CU, 세븐일레븐 오프라인 결제 건에 한하며, 온라인(간편결제 등) 결제건은 적용 제외됩니다.']
        target:
          merchants: [cu, gs25, seven_eleven]
        when:
          - {channel: offline}
        reward:
          type: billing_discount
          rate: {400000: 10, 800000: 15}
        limits:
          - per: month
            amount: {400000: 3000, 800000: 6000}
        tiers: {from: 400000}
      - key: online-shopping
        title: 쿠팡·네이버페이 10~15% 결제일 할인
        source: page
        evidence: ['온라인 쇼핑 | 쿠팡, 네이버페이(네이버파이낸셜) | 3천원 | 6천원', 네이버페이의 경우 롯데카드 등록 기준 네이버페이(네이버파이낸셜)가맹점 결제 건에 대해 혜택을 제공합니다., '기프트·선불카드 충전 및 구매, 포인트 충전, 상품권(모바일 상품권 포함) 구매건은 모두 할인제외 됩니다.']
        target:
          exclude_categories: [gift_card, prepaid_charge]
          merchants: [coupang, naver_pay]
        reward:
          type: billing_discount
          rate: {400000: 10, 800000: 15}
        limits:
          - per: month
            amount: {400000: 3000, 800000: 6000}
        tiers: {from: 400000}
        unmodeled: [일부 PG 업체를 거친 결제는 할인하지 않는다, 'PG를 통한 네이버페이 인증형 결제, 다른 간편결제에 등록된 네이버페이, 네이버 디지털콘텐츠, 네이버페이 분류상 상품권·후원·보험·렌탈·항공·여행·호텔 결제는 할인하지 않는다']
      - key: streaming
        title: 스트리밍 10~15% 결제일 할인
        source: page
        evidence: ['스트리밍 | 넷플릭스, 유튜브, 왓챠, 멜론, 지니뮤직, 디즈니플러스 | 3천원 | 6천원', '공식 홈페이지 및 앱을 통해 직접 신청한 정기결제(자동납부) 이용 건만 혜택이 제공되며, 1회성 일반구매 결제 및 통신요금 내 합산 청구, 앱마켓(구글플레이·앱스토어 등) 결제와 같이 가맹점 구분이 불가한 경우에는 혜택이 제공되지 않습니다.']
        target:
          merchants: [disney_plus, genie, melon, netflix, watcha, youtube_premium]
        when:
