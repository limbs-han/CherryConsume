        evidence: ['커피 | 스타벅스, 폴바셋, 할리스커피, 투썸플레이스 | 3천원 | 6천원', '오프라인 매장 및 각 커피브랜드의 공식앱을 통한 온라인 결제건에 할인 혜택이 제공되며, 상품권 및 선불카드 구입·충전 건은 할인 혜택이 제공되지 않습니다.']
        target:
          merchants: [hollys, paul_bassett, starbucks, twosome]
        reward:
          type: billing_discount
          rate: {400000: 10, 800000: 15}
        limits:
          - per: month
            amount: {400000: 3000, 800000: 6000}
        tiers: {from: 400000}
        unmodeled: ['백화점, 할인점, 쇼핑몰 등에 입점한 매장은 할인하지 않는다', 커피 브랜드 상품권과 선불카드 구입·충전은 할인하지 않는다]
