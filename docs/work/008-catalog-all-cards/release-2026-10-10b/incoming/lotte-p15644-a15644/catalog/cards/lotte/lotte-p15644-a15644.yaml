    benefits:
      - key: transit
        title: 버스·지하철 10~15% 결제일 할인
        source: page
        evidence: [지난달(1~말일) 이용실적 40만원 이상 ~ 80만원 미만시 10% 결제일 할인, 지난달(1~말일) 이용실적 80만원 이상 시 15% 결제일 할인, 대중교통 | 버스/지하철 | 1만원 | 1.5만원, '지하철, 시내버스 이용 건만 혜택이 제공되며 택시, 고속버스, 시외버스 이용 금액은 혜택이 제공되지 않습니다.']
        target:
          categories: [transit.bus_city, transit.subway]
        reward:
          type: billing_discount
          rate: {400000: 10, 800000: 15}
        limits:
          - per: month
            amount: {400000: 10000, 800000: 15000}
        tiers: {from: 400000}
        unmodeled: [대중교통은 한 달 이용액이 다음 달 결제되고 롯데카드 접수일 기준으로 할인 대상과 한도 달이 정해진다]
      - key: coffee
        title: 커피 10~15% 결제일 할인
