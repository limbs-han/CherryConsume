        reward:
          type: billing_discount
          rate: {400000: 10, 800000: 15}
        limits:
          - per: month
            amount: {400000: 3000, 800000: 6000}
        tiers: {from: 400000}
    unmodeled: [신규 발급 특례는 K-패스엔로카를 처음 발급한 경우에만 받는다, K-패스 환급은 정부 정책이라 카드 혜택으로 계산하지 않는다, '해외 이용금액은 현지 매출일자, 이동통신처럼 다음 달 청구되는 건은 롯데카드 접수일 기준으로 실적에 반영한다', '오토·스마트 캐시백 신청 금액, 장애인 고용부담금, TV 수신료, 고속도로 통행요금, 무승인전표, 관세·벌금·과태료·민원 수수료·인지세·송달료, 기후동행카드 충전과 결제는 실적에서 빠진다', 롯데카드가 주는 L.POINT 적립은 없다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 카드출시일 2024-12-31 뒤 혜택이 바뀌었는지 확인하지 못했다. 출시일을 시행일로 두었다, assumed: '2024-12-31'}
notes: 2026-10-10 상품 페이지와 상품설명서(2026년 8월 기준)를 대조했다. 숫자가 같다. 신용카드, 가족카드 발급 불가. 실적은 이 카드 이용금액이고 할인 받은 결제 전체와 대중교통 전체를 실적에서 뺀다. 할인율은 구간마다 10%와 15%, 한도는 업종 줄마다 따로다. 초안은 네이버페이를 빠뜨렸다.
