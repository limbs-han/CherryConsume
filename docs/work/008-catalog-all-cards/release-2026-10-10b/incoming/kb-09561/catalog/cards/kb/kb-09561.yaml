  - {path: 'revisions[0].effective_from', question: 원문은 2024.04.08 출시라고만 적었다. 현재 규칙의 시작일을 찾지 못해 수집일로 둔다., assumed: '2026-10-10'}
  - {path: 'revisions[0].spend.interest_free', question: 원문 실적 제외 목록에 무이자할부가 없어 실적에 넣었다, assumed: count}
notes: 2026-10-10 KB국민카드 상품 페이지를 직접 받아 대조했다. 이 카드의 실적 제외 목록에는 후불교통이 없어 교통 업종을 실적에 남긴다. 가족카드는 발급되지 않는다. 일상 영역 다섯 곳은 월 할인한도를 함께 쓰고 건당 1만원 한도가 있다.
