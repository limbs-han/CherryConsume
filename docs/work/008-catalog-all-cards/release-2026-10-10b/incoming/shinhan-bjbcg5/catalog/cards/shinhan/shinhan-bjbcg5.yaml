open_questions:
  - {path: 'revisions[0].limits[integrated]', question: '월 통합 적립한도가 더해드림·챙겨드림의 총 적립(0.6%, 1.0%)에 걸리는지 기본 0.2%를 뺀 추가분에만 걸리는지 원문에 없다. 적게 주는 쪽으로 총 적립에 걸고 한도를 넘은 금액은 기본 0.2%로 받게 했다', assumed: 총 적립에 적용}
  - {path: 'revisions[0].spend.cancellation', question: 취소 금액을 어느 달 실적에서 빼는지 상품 페이지에 없다, assumed: cancel_month}
  - {path: 'revisions[0].benefits[dream-abroad-0-6]', question: 해외 영역은 해외 일시불만 대상인데 할부를 구별하지 않았다, assumed: 해외 결제 전체}
notes: '신한카드 상품 페이지 기준. 연회비는 페이지 HTML의 Visa 기본 연회비 0원. 성남사랑 이름이 붙었지만 페이지에 성남시민만 발급한다는 문구는 없다. 모두드림 0.2%는 한도 없이 모든 결제에, 더해드림은 DREAM 다섯 영역에 총 0.6%, 챙겨드림은 그 달 이용금액이 가장 큰 영역 하나에 0.4%를 더해 총 1.0%다. 더해드림은 기본 0.2%를 대신하는 같은 묶음, 챙겨드림은 다른 묶음에 두었다. 주유 적립은 모두드림과 중복되지 않아 같은 묶음이다. 교통카드 이용금액은 전전월 금액이 반영되어 카드사 기본값 month_offset을 그대로 쓴다. 실적 제외: 현금서비스, 카드론, 연회비, 수수료, 이자, 취소, 기프트카드 구매, 선불카드 충전, 성남사랑상품권 적용 거래.'
