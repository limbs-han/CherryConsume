        title: 온라인 간편결제 1% 할인
        source: manual
        evidence: ['전월 이용금액에 관계없이, 할인한도 없이 일상 필수 영역 1% 결제일할인', '온라인 간편결제 삼성페이, 네이버페이, 카카오페이', '온라인 간편결제는 국내 온라인 가맹점에 한하며, 오프라인 매장 결제건(바코드, QR코드, 스마트폰NFC/MST 등)은 제외']
