        reward: {type: billing_discount, rate: 1}
      - key: daily-1
        title: 일상 필수 영역 1% 할인
        source: manual
        evidence: ['항공 대한항공, 아시아나항공, 제주항공, 진에어, 티웨이항공', 여행 여행사, 면세점 신라면세점, '리셀쇼핑 크림, 솔드아웃', '온라인쇼핑몰 쿠팡, 티몬, 위메프, SSG.COM, G마켓, 옥션, 11번가, 인터파크, 삼성카드 쇼핑', '홈쇼핑 GS SHOP, CJ온스타일, 롯데홈쇼핑, 현대홈쇼핑', '주유 주유소, LPG충전소', 홈쇼핑은 공식 홈페이지/앱/ARS를 통한 결제건에 한함, '스타벅스의 경우, 사이렌오더 결제건도 혜택 제공']
        target:
          categories: [fuel, travel.agency]
          merchants: [asiana_airlines, auction, cj_onstyle, coupang, eleven_st, gmarket, gs_shop, hyundai_homeshopping, interpark, jeju_air, jin_air, korean_air, kream, lotte_homeshopping, samsung_card_shopping, shilla_dfs_online, ssg_com, starbucks, tmon, tway_air, wemakeprice]
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 1}
        unmodeled: [스타벅스는 매장 결제와 사이렌오더만 할인하고 임대매장은 제외한다, 신라인터넷면세점은 내국인 전용 공식 홈페이지·앱 결제만 할인한다]
      - key: daily-offline-1
        title: 백화점·편의점·커피·신라면세점 1% 할인
        source: manual
        evidence: ['백화점 신세계백화점, 롯데백화점, 현대백화점', '편의점 CU, GS25, 세븐일레븐, 미니스톱, 이마트24', '커피전문점 스타벅스, 이디야커피, 투썸플레이스, 커피빈, 블루보틀', '백화점은 오프라인 결제건에 한하며, 쇼핑 외 결제건(상품권, 주차장 등), 임대매장은 제외', '편의점은 오프라인 결제건에 한하며, 백화점, 할인점, 쇼핑몰 등의 임대매장은 제외', '면세점은 국내 오프라인 매장 및 공식 홈페이지/앱(내국인 전용)을 통한 결제건에 한하며, 임대매장 및 해외 오프라인 매장은 제외']
        target:
          merchants: [blue_bottle, coffee_bean, cu, ediya, emart24, gs25, hyundai_department, lotte_department, ministop, seven_eleven, shilla_dfs, shinsegae_department, twosome]
        when:
          - {region: domestic}
          - {channel: offline}
