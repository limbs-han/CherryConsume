        unmodeled: ['임대매장과 백화점의 쇼핑 외 결제(상품권, 주차장 등)는 1%를 받지 않는다']
      - key: domestic-0-5
        title: 국내 가맹점 0.5% 할인
        source: manual
        evidence: ['전월 이용금액에 관계없이, 할인한도 없이 국내 가맹점 0.5% 결제일할인']
        target: {all: true}
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 0.5}
    unmodeled: ['해외 수수료(브랜드사수수료 1.0%, 해외이용수수료 0.2%) 할인과 공항 라운지는 계산하지 않는다', 리셀쇼핑 솔드아웃은 가맹점이 없어 1%를 담지 않았다. 이 결제는 0.5%로 계산한다, 삼성카드의 다른 결제일할인과 중복되지 않고 큰 금액만 적용한다, '전월 이용금액은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일은 2024-01-30이고 상품설명서는 2024.3판이다. 출시일을 시행일로 두었다, assumed: '2024-01-30'}
  - {path: 'revisions[0].stacks', question: 할인 혜택끼리는 겹치지 않고 큰 쪽 하나로 보았다. 삼성페이 5% 한도를 넘긴 다음 결제부터 해외 2%를 준다, assumed: 'priority, spill none'}
  - {path: 'revisions[0].benefit_exclusions.categories', question: 고속버스는 차내 단말기와 고속버스 앱 결제만 제외지만 업종을 나눌 수 없어 고속버스 전체를 혜택에서 뺐다, assumed: transit.bus_express}
  - {path: status, question: 상품 페이지에서 판매 상태를 다시 확인하지 못해 색인 값 on_sale을 두었다, assumed: on_sale}
notes: 2026-10-10 상품설명서(2024.3판, 여신금융협회 심의필 제2024-C1a-01197호) 확인. 연회비 국내전용과 해외겸용 Mastercard 모두 20,000원(기본 7,000+제휴 13,000). 해외 2%는 월 30만원 한도, 실적 무관. 삼성페이 해외 5%와 인앱·디지털·멤버십 50%는 전월 50만원 이상, 발급월+1개월 유예. 일상 필수 1%와 국내 0.5%는 실적과 한도가 없다. 해외 이용액 전체와 4대보험, 국세·지방세·공과금, 아파트관리비, 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권은 실적에서 빠진다.
