open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 카드 출시일을 잠정 시작일로 둔다, assumed: '2020-12-02'}
  - {path: 'revisions[0].limits[area]', question: '쇼핑, 딜리버리, 대중교통 표마다 월 통합 5만 하나머니가 적혀 있다. 세 영역이 한도 하나를 함께 쓰는지 영역마다 따로인지 원문이 불명확하다', assumed: 세 영역이 5만 하나머니 하나를 함께 쓴다}
notes: '모바일 전용 체크카드. 연회비 없음. 발급수수료 2,000원은 카드수령 다음달 말일까지 1만원 이상 쓰면 돌려준다. 전월 실적 조건 없음. 한 건에 적립률이 높은 서비스 하나만 주고, 쇼핑·딜리버리 한도를 넘기면 페이결제는 0.4%, 그 밖은 0.2%다. 적립 제외: 국세, 지방세, 공과금, 4대보험, 상품권·기프트카드, 선불 충전, 수도·전기요금, 아파트 관리비, 부동산임대료, 스쿨뱅킹, 도시가스, 대학·대학원 등록금, 초중고 납입금, ATM. 소수점 이하 절사. 2026-10-10 상품 페이지 원문으로 작성.'
