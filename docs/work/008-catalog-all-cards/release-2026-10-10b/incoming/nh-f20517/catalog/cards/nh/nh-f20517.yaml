schema_version: 2
id: nh-f20517
issuer: nh
name: NH 모두의카드(체크)
short_name: 모두의카드 체크
kind: check
product_codes:
  - '90010470'
  - F20517
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://card.nonghyup.com/servlet/IpCc2021R.act?CD_WRS_SQNO=90010470', fetched_at: 2026-10-10, review_no: 2026-5116, review_valid_until: 2027-08-31}
checked_at: 2026-10-10
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: page
    tiers: [0, 200000, 800000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 200000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      unmodeled: ['과태료(범칙금), 우체국 우편요금, 가상화폐 거래소, 현금서비스·카드론, 수수료·이자, 연체료, 포인트로 결제한 금액은 실적과 할인에서 빠진다', 백화점·대형마트·할인점(아울렛)·역사 입점 매장과 결제대행업체(PG)·간편결제 가맹점으로 승인된 결제는 할인에서 빠진다, NH농협카드의 다른 혜택과 겹치면 큰 쪽 하나만 받는다]
    limits:
      - key: mobility
        per: month
        amount: {200000: 3000, 800000: 5000}
      - {key: coffee, per: month, amount: 2000, count: 2}
    benefits:
      - key: mobility-bus-subway-10
        title: 버스·지하철 10% 캐시백
        source: page
        evidence: [□ 버스/지하철 10% 캐시백, '- 버스(시내버스, 마을버스, 광역버스, 고속시외버스) 및 지하철', 모빌리티 서비스 월 통합 캐시백 한도 | 20만원 이상 ~ 80만원 미만 | 80만원 이상 | 할인한도 | 3천원 | 5천원]
        target:
          categories: [transit.bus_city, transit.bus_express, transit.bus_intercity, transit.subway]
        reward: {type: cashback, rate: 10}
        limits:
          - {shared: mobility}
        tiers: {from: 200000}
      - key: mobility-rental-5
        title: 쏘카 5% 캐시백
        source: page
        evidence: [□ 렌터카/카쉐어링 5% 캐시백, '- 렌터카, 쏘카, 그린카', 모빌리티 서비스 월 통합 캐시백 한도 | 20만원 이상 ~ 80만원 미만 | 80만원 이상 | 할인한도 | 3천원 | 5천원]
        target:
          merchants: [socar]
        reward: {type: cashback, rate: 5}
        limits:
          - {shared: mobility}
        tiers: {from: 200000}
        unmodeled: [렌터카 업종과 그린카는 업종·가맹점 키가 없어 계산하지 않는다]
      - key: life-telecom-5
        title: 이동통신요금 자동납부 5% 캐시백
        source: page
        evidence: ['□ 이동통신요금 5% 캐시백(월 3천원, 1회 한)', '- SKT, KT, LGU+ 자동납부 시 할인 제공', ※ 라이프 서비스는 이용 건당 1만원 이상 결제 시 캐시백 제공, ※ 라이프 서비스는 전월실적 20만원 이상 결제 시 캐시백 제공]
        target:
          exclude_categories: [telecom.internet_tv]
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
          - amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: month, amount: 3000, count: 1}
        tiers: {from: 200000}
      - key: life-coffee-5
        title: 커피전문점 5% 캐시백
        source: page
        evidence: ['□ 커피전문점 5% 캐시백(월 2천원, 2회 한)', '- 스타벅스/이디야/커피빈/투썸플레이스', '※ 커피전문점/편의점 캐시백 대상 가맹점은 오프라인 매장 현장 결제에 한함(APP결제 등 할인 제외, 스타벅스 사이렌오더 할인 가능)', ※ 라이프 서비스는 이용 건당 1만원 이상 결제 시 캐시백 제공, ※ 라이프 서비스는 전월실적 20만원 이상 결제 시 캐시백 제공]
        target:
          merchants: [coffee_bean, ediya, twosome]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {shared: coffee}
        tiers: {from: 200000}
      - key: life-starbucks-5
        title: 스타벅스 5% 캐시백
        source: page
        evidence: ['□ 커피전문점 5% 캐시백(월 2천원, 2회 한)', '- 스타벅스/이디야/커피빈/투썸플레이스', '※ 커피전문점/편의점 캐시백 대상 가맹점은 오프라인 매장 현장 결제에 한함(APP결제 등 할인 제외, 스타벅스 사이렌오더 할인 가능)', ※ 라이프 서비스는 이용 건당 1만원 이상 결제 시 캐시백 제공]
        target:
          merchants: [starbucks]
        when:
          - amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {shared: coffee}
        tiers: {from: 200000}
        notes: 사이렌오더도 받아 채널 조건을 두지 않았다. 다른 커피전문점과 월 2천원, 2회 한도를 함께 쓴다
      - key: life-convenience-5
        title: 편의점 5% 캐시백
        source: page
        evidence: ['□ 편의점 5% 캐시백(월 1천원, 2회 한)', '- GS25/CU', ※ 라이프 서비스는 이용 건당 1만원 이상 결제 시 캐시백 제공, ※ 라이프 서비스는 전월실적 20만원 이상 결제 시 캐시백 제공]
        target:
          merchants: [cu, gs25]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: month, amount: 1000, count: 2}
        tiers: {from: 200000}
    unmodeled: ['해외 이용금액, 교통카드 이용금액, 통신료 자동이체금액은 매출표 접수일 기준으로 실적에 넣는다. 월말 이용이 다음 달 실적이 될 수 있다', 전기차 충전 5% 캐시백은 환경부 공공 급속충전기 현장결제와 환경부 멤버십카드 결제가 대상인데 맞는 업종·가맹점 키가 없어 계산하지 않는다, K-패스 환급금은 카드 혜택이 아니라 계산하지 않는다]
open_questions:
  - {path: 'revisions[0].limits[mobility]', question: 모빌리티 서비스에 전월실적 조건 문구는 따로 없고 한도표가 20만원 이상부터 시작한다, assumed: 전월 20만원 미만은 모빌리티 캐시백 없음}
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시작일을 확인하지 못해 초안 원문 수집일로 두었다. 상품출시일은 2023-07-03이다, assumed: '2026-10-05'}
  - {path: 'revisions[0].benefits[life-telecom-5].when', question: 이동통신 자동납부에도 건당 1만원 이상 조건이 붙는지 문구가 라이프 서비스 전체에 적혀 있다, assumed: 붙는다}
notes: 2026-10-10 상품 페이지(준법감시인 심의필 2026-5116)를 대조했다. 상품출시일 2023-07-03. 후불교통 필수 카드다. 모빌리티 셋은 월 통합 한도가 전월 20만~80만원 3천원, 80만원 이상 5천원이다. 라이프 셋은 전월 20만원 이상, 건당 1만원 이상이고 개별 한도다. 신규 특례는 최초 사용등록일부터 다음 달 말일까지 최소 구간(20만원) 서비스다. 초안의 모빌리티 한도 누락, 전기차 충전을 GS칼텍스·S-OIL에 붙인 것, 커피 대상 누락을 고쳤다.
