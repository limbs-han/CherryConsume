open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일은 2025-02-13이고 상품설명서는 2026.7판(제2026-C1a-08439호)이다. 출시일을 시행일로 두었다, assumed: '2025-02-13'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문은 SK주유(충전)소 이용금액만 실적에서 빼지만 실적 제외를 가맹점으로 적을 수 없어 주유 업종 전체를 뺐다. 다른 주유소 결제가 실적에 덜 잡힌다. 대중교통은 후불·모바일교통 결제라 시내버스와 지하철을 뺐다, assumed: 'fuel, transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits[telecom-5].when', question: 통신요금 정기결제를 자동납부로 보았다, assumed: 'billing: autopay'}
  - {path: status, question: 상품 페이지에서 판매 상태를 다시 확인하지 못해 색인 값 on_sale을 두었다, assumed: on_sale}
notes: 2026-10-10 상품설명서(2026.7판, 여신금융협회 심의필 제2026-C1a-08439호) 확인. 연회비 국내전용과 해외겸용 Mastercard 모두 15,000원(기본 7,000+제휴 8,000). 발급월+1개월까지 40만 구간 혜택을 준다. 통신·편의점·온라인쇼핑 5%는 영역마다 월 5,000원 한도다. 실적 제외는 SK주유(충전)소, 4대보험, 국세·지방세·공과금, 아파트관리비, 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통(후불·모바일교통), 택시, 기프트·선불카드, 상품권이다. 후불교통기능이 탑재되어 발급된다.
