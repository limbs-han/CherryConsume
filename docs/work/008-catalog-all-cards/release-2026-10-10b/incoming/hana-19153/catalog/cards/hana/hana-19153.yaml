open_questions:
  - {path: 'revisions[0].benefits', question: 3일 연속 이용 2배 적립을 계산하려면 연속 이용일 조건이 필요하다. 지금은 기본 1%만 계산해 혜택을 적게 보여 준다, assumed: 기본 1%만}
notes: MOVING카드의 GLOBAL 모드. 같은 카드의 ALLDAY 모드 hana-19149는 3일 연속 2배 적립을 계산하지 못해 보류였다. 이 모드는 해외 2% 적립이 주 혜택이고 연속 조건이 혜택을 늘리기만 해서 기본 1%만으로 담는다. 카드 출시 2026-07-01. 연회비 국내전용·국내외겸용(Mastercard) 20,000원. 지난달 실적 조건 없음. 하나Pay에서 모드를 바꿀 수 있어 options로 두고 다른 모드는 계산하지 않는다. 한 건에 적립금액이 큰 서비스 하나만 준다. 하나머니 소수점 이하 반올림. 2026-10-10 상품 페이지 원문으로 작성.
