notes: 2026-10-10 상품 페이지(준법감시인 심의필 2026-3845)를 대조했다. 상품출시일 2023-11-07. 발급 대상 만 12세 이상 개인. 국내전용과 국내외겸용(VISA)이고 연회비 없음. 스마트 적립 6개 영역, 1위 0.4%와 2위 0.2% 추가, 추가적립만 전월 20만원 이상 월 5천 포인트 한도, 실적 제외와 신규 특례 문구가 올리 POINT 체크카드(nh-f20016)와 같아 같은 구조로 옮겼다. 1위와 2위를 ranked 두 그룹으로 두고 smart 묶음의 priority로 1위 영역은 0.4%만 받는다. 같은 금액이면 영역 번호 순서다. 초안의 0.6% 단일 혜택과 ranked 누락을 고쳤다.
