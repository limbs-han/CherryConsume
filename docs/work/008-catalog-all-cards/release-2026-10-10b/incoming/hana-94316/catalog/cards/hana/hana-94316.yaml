notes: 2026-10-10 공식 상품 페이지(상세 번호 CD_PD_SEQ=18643, 목록 상품 번호 94316, 준법심의 L-25-0290)에서 옮겼다. 연회비 없음. 발급수수료 2,000원은 다음 달 말일까지 1만원 이상 쓰면 돌려준다. 실적은 지난달 1일~말일 승인 기준 국내외 일시불. 하나머니 소수점 이하 반올림. 한 결제에 적립금액이 높은 서비스 하나만 준다.
