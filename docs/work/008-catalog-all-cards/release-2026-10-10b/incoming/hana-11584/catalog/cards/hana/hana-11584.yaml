notes: 2026-10-10 공식 상품 페이지(준법심의 A-26-0974)에서 옮겼다. 연회비 국내외겸용 Mastercard, UPI 17,000원. 전월 실적, 할인 횟수 조건이 없다. 무이자 할부는 할인 제외. 온라인 1.7%는 월 한도를 다 쓰면 0.7%도 주지 않으므로 온라인과 오프라인 혜택을 채널로 나눴다.
