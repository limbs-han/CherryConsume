notes: 2026-10-10 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-05-30. 연회비 국내전용·Mastercard 12,000원. 전월 국내외 40만/80만 이상 TEN 5개 영역(커피, 편의점, 교통, 이동통신, 해외) 10% 영역별 월 5천/1만원, 통합 월 1만/2만원. ONE 음식점·주점과 온라인 간편결제 1% 통합 월 1만/2만원. 겹치면 TEN 우선. 신규 발급 실적 특례는 페이지에 없다.
