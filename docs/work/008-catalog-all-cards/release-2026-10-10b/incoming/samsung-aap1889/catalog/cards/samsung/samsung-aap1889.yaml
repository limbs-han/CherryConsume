open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일 2025-08-28과 상품설명서 2025.9판을 시행일로 두었다, assumed: '2025-08-28'}
  - {path: 'revisions[0].spend.exclude_categories', question: 이 카드는 대중교통과 택시를 실적에서 빼지 않는다. 삼성카드는 사회보험료를 공과금으로 분류해 insurance.social도 뺐다, assumed: 'insurance.social 포함, 교통 제외 없음'}
  - {path: 'revisions[0].benefits[mobile-5].when', question: 이동통신 정기결제를 자동납부로 보았다, assumed: 'billing: autopay'}
notes: 2026-10-10 상품설명서(2025.9판, 여신금융협회 심의필 제2025-C1a-12727호)와 상품 페이지 대조. 연회비 국내전용과 해외겸용 VISA 모두 15,000원(기본 7,000+제휴 8,000). 기본 적립은 없다. 발급월+1개월까지 40만 구간 혜택을 준다. 실적 제외는 무이자할부, 4대보험, 국세·지방세·공과금, 아파트관리비, 부동산 임대료, 유치원·초중고 납입금, 대학 등록금, 기프트·선불카드, 상품권이다. 적립 받은 결제도 실적에 넣는다.
