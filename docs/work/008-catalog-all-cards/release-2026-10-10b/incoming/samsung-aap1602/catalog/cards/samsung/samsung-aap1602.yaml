open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일은 2019-02-28이고 상품설명서는 2022.7판이다. 출시일을 시행일로 두었다, assumed: '2019-02-28'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통을 시내버스와 지하철로 보았다. 이 카드는 무이자할부와 할인 받은 결제를 실적에서 빼지 않는다, assumed: 'transit.bus_city, transit.subway, taxi'}
  - {path: status, question: 상품 페이지에서 판매 상태를 다시 확인하지 못해 색인 값 on_sale을 두었다, assumed: on_sale}
notes: 2026-10-10 상품설명서(2022.7판, 여신금융협회 심의필 제2019-C1a-01092호) 확인. 연회비 국내전용과 해외겸용 Mastercard 모두 15,000원(기본 7,000+제휴 8,000). 트레이더스 할인은 발급월에 40만 미만 구간, 다음 달부터 실적대로다. 다른 혜택은 발급월+1개월까지 40만 구간 한도를 준다. 영역마다 월 할인한도가 따로다. 가족카드는 없다. 실적 제외는 4대보험·장애인 고용부담금, 국세·지방세·공과금, 대학 등록금, 대중교통, 택시, 아파트관리비, 기프트·선불카드, 상품권이다.
