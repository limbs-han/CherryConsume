notes: 2026-10-10 상품 페이지(2025년 7월 기준, 카드출시일 2011-03-04)를 대조했다. 신용카드. 전월 실적과 무관한 CJ 혜택과 롯데리아 할인만 계산한다. 빕스 20%는 1일 1회, 매출 20만원까지라 건당 4만원 한도로 담았다. 초안은 CJ온스타일과 CJ푸드빌을 전 가맹점 대상으로 잘못 두었다.
