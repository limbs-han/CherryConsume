          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [현장 티켓 구매만 할인하고 놀이공원 안 식음료나 기념품 결제는 빠질 수 있다]
      - key: beauty-10
        title: 올리브영 10% 환급할인
        source: page
        evidence: ['뷰티 | 올리브영, 박승철헤어스투디오 | 10% | 건당 3만원 이상 5만원까지', '할인제외 : 상품권 및 선불카드 구입·충전금액, 백화점·대형마트 입점 점포 이용금액']
