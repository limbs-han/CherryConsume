            amount: {min: 50000}
        reward: {type: cashback, fixed: 2000}
        limits:
          - {per: month, count: 1}
          - {shared: integrated}
        tiers:
          from: 200000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [유·무선 통신요금 통합 청구금액은 제외한다]
      - key: amusement-30
        title: 놀이공원 30% 환급할인
        source: page
        evidence: ['놀이공원 | 에버랜드, 롯데월드, 서울랜드 | 30% | 건당 3만원 이상 5만원까지', '제공조건 : 현장 티켓 구매', '할인제외 : 인터넷 예매']
