          merchants: [emart, homeplus, lotte_mart]
        when:
          - channel: offline
            amount: {min: 30000}
            day:
              in: [sat, sun]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, base: 100000}
          - {shared: integrated}
        tiers:
          from: 200000
