        when:
          - amount: {min: 30000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, base: 50000}
          - {shared: integrated}
        tiers:
          from: 200000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: gs25-5
        title: GS25 5% 환급할인
        source: page
        evidence: [편의점 | GS25 | 5% | 건당 1만원 이상 2만원까지, '제공조건 : 오프라인 매장 이용금액', '할인제외 : 티머니 이용금액']
        target:
          merchants: [gs25]
        when:
          - channel: offline
            amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, base: 20000}
          - {shared: integrated}
        tiers:
          from: 200000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [편의점의 티머니 충전 이용금액은 제외한다]
    unmodeled: [전월 실적은 KB국민 체크카드 상품별 또는 동일계열 상품별 합산 승인금액이다, 무승인(철도반환수수료 등)과 정부지원금은 실적에서 빠진다, 해외 이용금액은 이 카드 실적에 포함한다, 통합할인한도는 전표 매입 순서대로 차감한다, 티머니·팝카드 기능은 할인 서비스가 아니라 계산하지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2016년 1월 7일 출시만 적었다., assumed: '2026-10-10'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 교통이용금액 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-10 KB국민카드 상품 페이지를 직접 받아 대조했다. 체크카드 공통 실적 기준에서 교통이용금액, 무승인, 정부지원금을 빼고 해외 이용금액은 이 카드만 포함한다. 실적 유예는 생애 최초 발급만 facts로 확인한다.
