        evidence: [LG U+ 이동통신요금 자동납부 시 4~6천원 환급할인, 1구간 (30만원 이상 50만원 미만) | 4천원, 2구간 (50만원 이상) | 6천원, 최초 카드발급후 사용등록일로부터 다음달 말일까지는 전월이용실적이 없는 경우에도 2천원 환급할인, '제공조건 : 이용금액 건당 1만원 이상 시 할인 (월 1회)', 유무선결합 통신요금 이용시는 할인대상에서 제외]
