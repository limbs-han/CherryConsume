    tiers: [0, 300000, 700000, 1500000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit.bus_city, transit.bus_express, transit.bus_intercity, transit.subway, utility]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: original_month
      exclude_applied: 1
    new_card: {until: next_month_end, tier: 300000, from: issue}
    benefits:
      - key: insurance-payment-discount
        title: 생명·손해보험료 자동이체 결제일 할인
        source: manual
        evidence: ['30만원 이상 13,000원', '70만원 이상 16,000원', '150만원 이상 25,000원', 자동이체 필수, '보험엔로카로 생명보험, 손해보험 보험료 자동이체 연결 시에만 결제일 할인 혜택을 받으실 수 있습니다. (손해보험의 경우 자동차보험 외 보험에 해당)', 보험료가 할인 금액보다 적을 경우 보험료 만큼만 할인이 됩니다., 간편결제(PAY)를 통하여 보험료 납부 시 할인이 적용되지 않습니다.]
        target:
          categories: [insurance.private]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {300000: 13000, 700000: 16000, 1500000: 25000}
        tiers: {from: 300000}
    unmodeled: ['자동차보험료 20만원 이상 결제 캐시백 13,000·16,000·25,000원은 결제 다음 달부터 12회 매월 26일 지급이라 계산하지 않는다. 자동차보험과 다른 보험을 함께 쓰면 캐시백이 우선이고 보험료 할인은 없다', 보험료 할인은 자동차보험 외 생명·손해보험이 대상이다. 자동차보험료를 자동이체로 기록하면 할인이 붙지만 실제로는 캐시백 대상이다, 간편결제로 낸 보험료는 할인하지 않는다, 롯데카드의 다른 결제일 할인과 겹치면 할인 금액이 큰 혜택 하나만 준다, '정부지원금, TV 수신료, 포인트 충전, 오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 고속도로 통행요금, 무승인전표, 벌금·과태료·민원 발급 수수료·관세·인지세·송달료, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', 보험엔로카가 아닌 다른 롯데카드 이용금액은 실적에 넣지 않는다, 할인은 승인 시점 기준 남은 한도 안에서 준다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2023-12-22이고 설명서는 2024년 9월 기준이다, assumed: '2026-10-10'}
notes: 2026-10-10 상품 페이지와 상품설명서 대조. 신규 발급 특례는 발급일부터 다음 달 말일까지 13,000원 한도라 30만 구간으로 넣었다. 보험료가 한도보다 적으면 보험료만큼 할인이라 100% 할인에 월 한도로 적었다. 할인받은 보험료 전액이 실적에서 빠진다.
