    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [PG 결제대행이나 별도 가맹점번호로 승인되는 일부 간편결제는 할인에서 빠질 수 있다]
    limits:
      - {key: fuel-cvs, per: month, amount: 5000}
      - {key: telecom-ott, per: month, amount: 3000}
    benefits:
      - key: online-shopping-10-1
        title: 온라인 쇼핑 KB Pay 10% 할인
        source: page
        evidence: ['온라인 쇼핑(KB Pay) | G마켓, 11번가, SSG.COM | 10% | 1만원 | 1만 5천원 | 2만원', 'KB Pay 결제 건에 한하며, 타 간편 결제 이용 시 할인 제외', '상품권, 여행, 항공권, 티켓, 도서, 별도 팝업 사이트 제외']
        target:
          merchants: [eleven_st, gmarket, ssg_com]
        when:
          - payment: [kb_pay]
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {300000: 10000, 700000: 15000, 1200000: 20000}
        tiers: {from: 300000}
        unmodeled: [상품권·여행·항공권·티켓·도서와 별도 팝업 사이트 결제는 빠진다]
      - key: fuel-100-per-l
        title: SK에너지·GS칼텍스 리터당 100원 할인
        source: page
        evidence: ['주유 | SK에너지, GS칼텍스 | 100원/L | 5천원', 'LPG, 경유, 등유는 휘발유 가격에 비례하여 할인율 적용']
        target:
          merchants: [gs_caltex, sk_energy]
        reward: {type: billing_discount, per_liter: 100}
        limits:
          - {shared: fuel-cvs}
        tiers: {from: 300000}
        notes: 편의점 5%와 월 5천원 한도를 함께 쓴다
      - key: convenience-5
        title: CU·GS25 5% 할인
        source: page
        evidence: ['편의점 | GS25, CU | 5%', 백화점/대형마트 등 일부 입점 매장 제외, 오프라인 매장 일반 결제건에 한함 (온라인 가맹점 제외)]
        target:
          merchants: [cu, gs25]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: fuel-cvs}
        tiers: {from: 300000}
        unmodeled: [백화점·대형마트 등 일부 입점 매장 제외]
      - key: telecom-10
        title: 이동통신요금 10% 할인
        source: page
        evidence: ['이동통신요금(자동납부 요금) | SKT, KT, LG U+, Liiv M | 10% | 3천원', '인터넷, IPTV 등 결합상품 제외']
        target:
          merchants: [kt, lg_uplus, liiv_m, skt]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: telecom-ott}
        tiers: {from: 300000}
        unmodeled: [인터넷·IPTV 등 결합상품 요금 제외]
      - key: ott-30
        title: OTT 30% 할인
        source: page
        evidence: ['OTT | 넷플릭스, 유튜브 프리미엄, Wavve, 티빙, 디즈니플러스 | 30%', 공식 홈페이지를 통한 정기결제 이용건, 간편결제 또는 인앱 결제건 등은 제외]
        target:
          merchants: [disney_plus, netflix, tving, wavve, youtube_premium]
        when:
          - {channel: online}
          - billing: [subscription]
          - payment: [physical_card]
        reward: {type: billing_discount, rate: 30}
        limits:
          - {shared: telecom-ott}
        tiers: {from: 300000}
        notes: 이동통신 10%와 월 3천원 한도를 함께 쓴다
      - key: overseas-5
        title: 해외 가맹점 5% 할인
        source: page
        evidence: [해외 | 해외 가맹점 이용건 | 5% | 5천원]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
      - key: family-restaurant-30
        title: 아웃백 30% 할인
        source: page
        evidence: [패밀리레스토랑 | 아웃백스테이크하우스 | 30% | 3만원 (연 6만원), 백화점/대형마트 등 일부 입점 매장 및 아웃백 딜리버리 제외]
        target:
          merchants: [outback]
        reward: {type: billing_discount, rate: 30}
        limits:
          - {per: month, amount: 30000}
          - {per: year, amount: 60000}
        tiers: {from: 300000}
        unmodeled: [백화점·대형마트 입점 매장과 아웃백 딜리버리는 빠진다]
    unmodeled: ['놀이공원 현장 할인(롯데월드 종합이용권 50%, 에버랜드 1일권 50%, 캐리비안베이 30%)은 이용권 매수 제한이 있어 계산하지 않는다', '정부지원금(보육료·유치원보조비·바우처)과 무승인전표(자판기·터널이용료·항공기내), 현금서비스·카드론, 수수료·이자·연체료는 실적에서 빠진다', 해외 이용금액은 매입 완료 기준으로 실적 달을 나누고 일시불만 센다, 월 할인한도는 본인회원 기준이고 가족카드 이용을 합산한다, 실적 유예기간은 처음 발급받은 이 카드의 사용등록일 기준이다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2023년 11월 29일 출시만 적었다., assumed: '2026-10-10'}
  - {path: 'revisions[0].limits', question: '원문 표에서 주유와 편의점의 5천원, 이동통신과 OTT의 3천원이 한 칸으로 합쳐져 함께 쓰는 한도로 읽었다', assumed: fuel-cvs 5천원과 telecom-ott 3천원}
notes: 2026-10-10 KB국민카드 상품 페이지를 직접 받아 대조했다. 초안의 온라인 쇼핑 구간별 세 혜택은 한 혜택과 구간별 한도로 합쳤다. 해외 이용 시 Amex 1.4%와 해외서비스 0.25% 수수료가 붙는다.
