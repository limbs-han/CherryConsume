revisions:
  - effective_from: '2026-10-10'
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 700000, 1200000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, utility]
