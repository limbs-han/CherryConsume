notes: 2026-10-10 상품설명서(2026.2판, 심의필 2026-C1a-02005호) 대조. 카드 출시 2026-02-06. 연회비 해외겸용 Mastercard·국내전용 모두 20,000원(기본 7,000+제휴 13,000). 상품설명서의 전월 이용금액 제외 대상에 할인 받은 이용금액이 없어 모든 할인 건이 실적에 들어간다. 입장권과 팀스토어는 월 한도 하나를 같이 쓴다. 발급월+1개월까지는 30만원 미만이어도 30만 구간 혜택.
