schema_version: 2
id: ibk-12112580001
issuer: ibk
name: IBK hi 카드
kind: credit
product_codes:
  - '12112580001'
status: on_sale
annual_fees:
  - {scope: domestic, brand: bc, amount: 2000}
  - {scope: global, brand: visa, amount: 4000}
  - {scope: global, brand: mastercard, amount: 4000}
sources:
  - {id: page, kind: product_page, url: 'https://www.ibk.co.kr/cardbiz/detailBizNew.ibk?PDLN_CD=12&PDGR_CD=11&PDTM_CD=258&PDCD=0001&pageId=CA01010000', fetched_at: 2026-10-10, review_no: 제2023-5656호, review_valid_until: 2026-11-26}
  - {id: manual, kind: manual_pdf, url: 'https://www.ibk.co.kr/fup/customer/form/202502272037095859575913180623.pdf', fetched_at: 2026-10-10, review_no: 제2024-6698호, review_valid_until: 2026-11-12}
checked_at: 2026-10-10
revisions:
  - effective_from: 2023-11-27
    effective_from_estimated: true
    source: page
    tiers: [0, 200000, 500000]
    spend:
      basis: prev_calendar_month
      regions: [domestic]
      exclude_categories: [apartment_fee, taxi, transit.bus_city, transit.bus_express, transit.rail, transit.subway]
      installment: full_at_purchase
      cancellation: cancel_month
    new_card: {until: next_month_end, tier: 200000, from: receipt}
    limits:
      - {key: transit-day, per: day, count: 3}
      - {key: transit-month, per: month, amount: 10000}
      - {key: general-day, per: day, count: 1}
      - {key: general-month, per: month, amount: 5000, count: 2}
    benefits:
      - key: transit-weekday
        title: 평일 버스·지하철 1회 100~200원 청구할인
        source: page
        evidence: ['지하철, 버스 등 최대 300원 할인', '1일 3회(환승 제외), 월 1만원 한도', 전월실적 | 평일 | 주말(공휴일 포함) | 20만원 | 100원 | 200원 | 50만원 | 200원 | 300원, '지하철, 버스 : 후불교통 사용 가능한 전지역']
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - billing: [postpaid_transit]
          - day:
              in: [mon, tue, wed, thu, fri]
              holidays: exclude
        reward:
          type: billing_discount
          fixed: {200000: 100, 500000: 200}
        limits:
          - {shared: transit-day}
          - {shared: transit-month}
        tiers: {from: 200000}
        unmodeled: [환승요금은 할인하지 않는다]
      - key: transit-weekend
        title: 주말·공휴일 버스·지하철 1회 200~300원 청구할인
        source: page
        evidence: ['지하철, 버스 등 최대 300원 할인', '1일 3회(환승 제외), 월 1만원 한도', 전월실적 | 평일 | 주말(공휴일 포함) | 20만원 | 100원 | 200원 | 50만원 | 200원 | 300원]
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - billing: [postpaid_transit]
          - day:
              in: [sat, sun]
              holidays: include
        reward:
          type: billing_discount
          fixed: {200000: 200, 500000: 300}
        limits:
          - {shared: transit-day}
          - {shared: transit-month}
        tiers: {from: 200000}
        unmodeled: [환승요금은 할인하지 않는다]
      - key: rail-express-5
        title: 철도·고속버스 5% 청구할인
        source: page
        evidence: ['철도, 고속버스, 택시 5% 할인', '1일 1회, 월 2회, 월 5천원 한도', '철도 : 철도공사 매표소 / 온라인 예매(www.korail.com)', '고속도로 : 고속버스터미널 매표소 / 온라인예매 (www.kobus.co.kr / www.hticket.co.kr)']
        target:
          categories: [transit.bus_express, transit.rail]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: general-day}
          - {shared: general-month}
        tiers: {from: 200000}
        unmodeled: [철도는 한국철도공사 매표소와 홈페이지 예매만 대상이다]
      - key: taxi-5
        title: 택시 5% 청구할인
        source: page
        evidence: ['철도, 고속버스, 택시 5% 할인', '1일 1회, 월 2회, 월 5천원 한도', '택시 : 신용카드 사용가능 택시 전체']
        target:
          categories: [taxi]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: general-day}
          - {shared: general-month}
        tiers: {from: 200000}
      - key: fuel-gs-40
        title: GS칼텍스 리터당 40원 청구할인
        source: page
        evidence: [GS 주유소 리터당 40원 할인(LPG 포함), '1일 1회, 월 4회, 회당 주유금액 10만원 한도', '휘발유, 등유, 경유, LPG는 GS고시 휘발유가 기준으로 환산하여 할인제공']
        target:
          merchants: [gs_caltex]
        reward: {type: billing_discount, per_liter: 40}
        limits:
          - {per: txn, base: 100000}
          - {per: day, count: 1}
          - {per: month, count: 4}
        tiers: {from: 200000}
        notes: 원문은 GS칼텍스 고시 휘발유가로 리터를 환산한다. 앱은 reference.yaml 기름값을 쓴다
      - key: telecom-3
        title: 휴대폰요금 자동이체 3% 청구할인
        source: page
        evidence: [휴대폰 이용대금의 3% 할인, '해당통신사 : SKT, KT, LG U+', '월1회, 최초승인건(자동이체 필수), 최대 1,200원 할인한도']
        target:
          exclude_categories: [telecom.internet_tv]
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 3}
        limits:
          - {per: month, amount: 1200, count: 1}
        tiers: {from: 200000}
      - key: dining-10
        title: 아웃백·빕스 10% 청구할인
        source: page
        evidence: ['아웃백, 빕스 10% 할인', '통합 월 1회, 최대 10만원 한도(최대 1만원 할인한도)']
        target:
          merchants: [outback, vips]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 100000}
          - {per: month, count: 1}
        tiers: {from: 200000}
      - key: movie-2000
        title: 메가박스·CGV 인터넷 예매 2천원 청구할인
        source: page
        evidence: ['메가박스, CGV(인터넷예매) 결제 시 2천원 할인', '통합 월 1회, 연 6회']
        target:
          merchants: [cgv, megabox]
        when:
          - {channel: online}
        reward: {type: billing_discount, fixed: 2000}
        limits:
          - {per: month, count: 1}
          - {per: year, count: 6}
        tiers: {from: 200000}
        notes: 인터넷 예매 조건이 CGV에만 붙는지 둘 다인지 원문이 분명하지 않아 둘 다 인터넷 예매만 계산한다
    unmodeled: [유료도로와 터널 후불교통 할인은 담을 업종이 없어 계산하지 않는다, '백화점·할인점 2~3개월 무이자할부, 주요 놀이공원 할인, 환전 우대, 대출금리 우대, ATM 수수료 면제, 대중교통 상해보험은 계산하지 않는다', 할인은 비씨카드에 등록된 가맹점 업종 기준이다]
open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: 실적에서 빼는 교통이용금액을 버스·지하철과 철도·고속버스·택시 업종 전체로 보았다. 같은 계열 K-패스 카드와 같게 했다, assumed: 'transit.bus_city, transit.subway, transit.rail, transit.bus_express, taxi'}
  - {path: 'revisions[0].spend.exclude_categories', question: '실적 제외 문구가 교통이용금액과 APT관리비뿐이라 세금, 공과금, 상품권은 실적에 넣었다', assumed: 포함}
  - {path: 'revisions[0].limits[general-day]', question: '상품 페이지는 일반교통 1일 1회, 2022년 상품설명서는 1일 2회라고 적었다. 최신 페이지를 따른다', assumed: 1일 1회}
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시작일을 찾지 못해 준법감시인 심의일로 두었다, assumed: '2023-11-27'}
notes: 2026-10-10 expand3 조사. 상품 페이지와 상품설명서를 대조했다. 연회비는 연간 국내 이용 240만원 이상이면 면제다. 2022년 설명서는 영화 대상을 인터파크·CGV로 적었고 페이지는 메가박스·CGV로 적어 페이지를 따랐다
