notes: 2026-10-10 상품설명서(2025.7판, 여신금융협회 심의필 제2025-C1a-09518호) 확인. 연회비 국내전용과 해외겸용 Mastercard 모두 20,000원(기본 7,000+제휴 13,000). SELECT 옵션은 셋 중 하나를 고르고 바꾸면 다음 달 1일부터 반영된다. 발급월+1개월까지 30만 구간 혜택을 준다. 음식점·온라인쇼핑 5%와 10% 할인을 받은 결제는 실적에서 빠진다. 실적 제외는 4대보험, 국세·지방세·공과금, 아파트관리비, 임대료, 유치원·초중고 납입금, 대학 등록금, 기프트·선불카드, 상품권이다. 대중교통과 택시는 실적에 넣는다.
