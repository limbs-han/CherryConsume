    unmodeled: [대중교통 영역의 후불교통 시내버스·지하철 청구할인은 이메일 이용내역서의 이용일과 건당 3만원 기준을 결제 입력으로 맞출 수 없어 계산하지 않는다, '전월 실적은 동일계열 카드(첵첵, 위글위글 첵첵) 실적을 합산한다. 앱은 이 카드 실적만 센다', '정부지원금, 포인트리 충전금액, 자판기·터널통행료·유료도로·기차/고속버스 취소 반환수수료 같은 무승인 금액은 실적에서 빠진다', 해외 이용금액은 매입 완료 기준으로 실적에 넣는다, 통합할인한도는 전표 매입 순서대로 차감한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2020년 6월 8일 출시와 2026.05.22 심의필만 적었다., assumed: '2026-10-10'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통요금 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-10 KB국민카드 상품 페이지를 직접 받아 대조했다. 지방세는 상하수도를 포함해 tax.local과 utility.water로 뺐다. 실적 유예는 생애 최초 발급만 facts로 확인한다.
