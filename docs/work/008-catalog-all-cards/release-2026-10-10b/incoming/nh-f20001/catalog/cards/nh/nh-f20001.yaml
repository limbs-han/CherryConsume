notes: 2026-10-10 상품 페이지(준법감시인 심의필 2026-3845)를 대조했다. 마스터카드 연회비 0원, 온라인 신청 전용. 교통카드 이용대금은 다음 달 실적에 반영된다는 문구로 버스·지하철을 한 달 늦췄다. 신규 특례는 가장 낮은 구간과 같아 적지 않았다.
