schema_version: 2
id: lotte-1761
issuer: lotte
name: LG U+ X LOCA
kind: credit
product_codes: []
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
  - {scope: global, brand: mastercard, amount: 20000}
  - {scope: global, brand: amex, amount: 20000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://image.lottecard.co.kr/UploadFiles/cardProvisionPath/2022-A00005_20220519_10002.pdf', fetched_at: '2026-10-10'}
checked_at: '2026-10-10'
revisions:
  - effective_from: '2026-10-10'
    effective_from_estimated: true
    source: manual
    tiers: [0, 300000, 700000, 1200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit.bus_city, transit.bus_express, transit.bus_intercity, transit.subway, utility]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: original_month
      exclude_applied: 1
    new_card: {until: next_month_end, tier: 300000, from: issue}
    benefits:
      - key: telecom-first-25m
        title: LG유플러스 통신요금 결제일 할인 발급월 포함 25개월까지
        source: manual
        evidence: ['할인 금액 발급월 포함 25개월 까지 10,000원 15,000원 20,000원', LGU+ 통신요금 자동납부 건만 할인 혜택이 제공 됩니다., 통신요금이 할인금액보다 적을 경우 통신요금만큼 할인됩니다.]
        target:
          merchants: [lg_uplus]
        when:
          - billing: [autopay]
          - card_month: {max: 24}
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {300000: 10000, 700000: 15000, 1200000: 20000}
        tiers: {from: 300000}
      - key: telecom-after-25m
        title: LG유플러스 통신요금 결제일 할인 발급월 포함 25개월 초과
        source: manual
        evidence: ['발급월 포함 25개월 초과 6,000원 8,000원 10,000원', '예) 22년 2월 20일 발급 시 24년 2월 요금까지 10/15/20천원 할인, 24년 3월 요금 부터는 6/8/10천원 할인']
        target:
          merchants: [lg_uplus]
        when:
          - billing: [autopay]
          - card_month: {min: 25}
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {300000: 6000, 700000: 8000, 1200000: 10000}
        tiers: {from: 300000}
    unmodeled: ['오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 고속도로 통행요금, 무승인전표(자판기, 터널통행료, 항공 기내 이용), 벌금·과태료·민원발급 수수료·관세·인지세·송달료, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', LG U+ X LOCA가 아닌 다른 롯데카드 이용금액은 실적에 넣지 않는다, 한 달 이용분이 다음 달에 결제되는 이동통신 요금은 롯데카드 접수일 기준으로 실적에 넣는다, 25개월 기준은 발급월을 1개월로 센다. 카드 시작일로 발급일을 넣어야 맞다]
open_questions:
  - {path: product_codes, question: 롯데카드 온라인 판매 목록과 공시 목록에 상품 코드가 없어 id를 공시 색인 번호로 두었다. 제휴 채널 전용 판매로 보인다, assumed: '[]'}
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2022-03-02이고 설명서는 2026년 8월 기준이다, assumed: '2026-10-10'}
notes: 2026-10-10 상품설명서 대조. 초안의 30만원 미만 구간 할인은 신규 발급 특례 기간에만 있어 new_card로 옮겼다. 통신요금이 할인 금액보다 적으면 통신요금만큼 할인이라 100% 할인에 월 한도로 적었다.
