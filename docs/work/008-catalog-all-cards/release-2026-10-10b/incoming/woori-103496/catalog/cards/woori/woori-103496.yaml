open_questions:
  - {path: 'revisions[0].effective_from', question: 지금 혜택 구성의 시행일을 따로 찾지 못해 상품 출시일로 두었다. 페이지 준법심의필은 2026-C01813(2026.06.23)이다, assumed: '2026-02-06'}
notes: 2026-10-10 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2026-02-06. 국내전용, 연회비 없음(가족 포함), 만 18세 이상. 커피·편의점·배달은 영역별 월 한도이고 건당 최대 1천원. 결제 건 혜택이 아닌 해외 ATM 인출(건당 500원 수수료, 환율우대 30%, 국제브랜드 수수료 면제, 미국·필리핀·베트남·태국·인도네시아 ExK ATM)과 공항 커피 무료(전월 20만원 이상 연 2회)는 옮기지 않았다. 캐시백은 매출표 접수일에 결제계좌로 입금.
