        source: manual
        evidence: ['백화점 신세계/롯데/현대/갤러리아백화점, AK 플라자', '프리미엄 아울렛 신세계사이먼 프리미엄 아울렛, 현대프리미엄아울렛, 롯데프리미엄아울렛', '백화점, 프리미엄 아울렛은 오프라인 결제건에 한하며, 쇼핑 외 결제건(상품권, 주차장 등), 임대매장은 제외']
