    unmodeled: ['기프트 서비스(여행·여가·면세점 영역에서 건별 10만원 이상 결제 시 영역별 연 1회, 통합 연 3회 20,000원 결제일할인. 발급 2년차부터는 전년도 이용금액 100만원 이상)는 발급일 기준 연간 횟수와 전년도 누적 실적을 담을 수 없어 넣지 않았다', 골프장·골프연습장 1% 적립은 업종이 없어 담지 않았고 0.5%로 계산한다, 'Mastercard PLATINUM 서비스(공항 라운지, 발렛파킹, Dine with Mastercard 등)는 결제 할인이 아니라 담지 않았다', '할인과 실적은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다', 삼성카드의 다른 결제일할인 혜택과 겹치면 할인 금액이 큰 것 하나만 준다]
open_questions:
  - {path: 'revisions[0].benefits', question: 할인과 적립의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].benefits[zone-1]', question: 상품설명서는 2023.2판이고 1% 온라인 쇼핑몰에 티몬과 위메프가 있다. 두 곳은 영업을 멈춰 넣지 않았다. 상품 페이지 심의필은 2025-10-28이라 더 새 설명서가 있을 수 있다, assumed: 2023.2판 목록에서 티몬과 위메프를 뺌}
notes: 2026-10-10 상품설명서(2023.2판, 심의필 2022-C1a-11419호)와 Mastercard PLATINUM 안내(2026)를 대조. 카드 출시 2022-12-22. 연회비 해외겸용 Mastercard 49,000원(기본 7,000+제휴 42,000), 국내전용 47,000원(기본 7,000+제휴 40,000). 적립 2%/1%/0.5%는 전월 실적과 한도 없이 주고 한 결제에 하나만 받는다. 디지털·쉐이크쉑·써브웨이·영화 할인은 전월 50만원 이상이고 할인 건은 적립하지 않는다. 할인 받은 이용금액도 실적에 들어간다. 발급월+1개월까지는 50만원 미만이어도 할인 제공. 대중교통과 택시는 실적에서 빠진다.
