        tiers: {from: 500000}
        unmodeled: [네이버쇼핑은 naver.com 도메인으로 확인되는 가맹점만 할인한다, 공식 홈페이지와 앱 안의 결제만 할인하고 연결된 다른 사이트나 앱에서 결제하면 제외한다]
      - key: convenience-10
