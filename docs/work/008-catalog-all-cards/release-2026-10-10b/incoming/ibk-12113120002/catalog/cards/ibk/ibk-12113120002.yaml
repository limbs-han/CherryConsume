open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외 문구 교통요금을 버스·지하철·철도·고속·시외버스·택시 업종 전체로 보았다. 후불교통만 빼는 뜻일 수도 있다, assumed: 'transit 전체, taxi'}
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시작일을 찾지 못해 준법감시인 심의일로 두었다, assumed: '2025-12-02'}
notes: 2026-10-10 expand4 조사. 상품 페이지에서 옮겼다. 다이소 신용(ibk-12113120001)과 같은 틀이고 비율과 한도가 낮으며 주유·마트 부가서비스가 없다. 신규 발급은 카드 수령일부터 다음 달 말까지 통합할인한도 5천원을 준다
