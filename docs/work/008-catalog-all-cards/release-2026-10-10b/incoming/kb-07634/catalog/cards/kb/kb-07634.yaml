open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2026.05.14 출시라고만 적었다. 현재 규칙의 시작일로 잠정 적용한다., assumed: '2026-05-14'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(RF후불교통요금) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].facts', question: 이 상품 페이지에는 실적 유예가 생애 최초 본인 발급에만 적용된다는 문구가 없다. 다른 KB 카드와 같게 보고 덜 주는 쪽으로 fact를 물었다, assumed: first_personal_issue}
notes: 2026-10-10 KB국민카드 상품 페이지를 직접 받아 대조했다. 아홉 영역의 할인한도는 영역마다 따로 2천원, 4천원, 1만원이다. 상품설명서 PDF는 글자를 뽑을 수 없어 페이지 표를 따랐다.
