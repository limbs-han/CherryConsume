        source: page
        evidence: [커피전문점/제과점 업종 10% 결제일 할인, '일 1회, 월 3회', 1회 이용금액 1만원 이상인 거래건에 대해 할인이 적용되며, 1회 이용금액 5만원까지 할인이 적용됩니다.]
        target:
