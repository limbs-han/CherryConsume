        title: 생활쇼핑 5만원 이상 15% 할인
        source: page
        evidence: [생활쇼핑 기본 10% 결제일 할인이 적용됩니다., 1회 이용금액 5만원 이상 시 추가 5% 결제일 할인(총 15% 할인)이 적용됩니다., '월 8회 (단, 1회 이용금액 5만원 이상 15% 할인 서비스는 월 8회 생활쇼핑 할인 내 월 최대 4회 적용)', 1회 이용금액 10만원까지 할인이 적용됩니다.(1회 이용금액 10만원 이상인 거래건은 10만원 기준으로 할인 적용), 오프라인 매장에 한하여 적용되며 온라인몰 및 상품권 구매, 문화센터 등 비쇼핑 항목은 생활쇼핑 할인 서비스에서 제외됩니다., 3대 할인점(이마트/롯데마트/홈플러스) 및 창고형 할인매장(이마트 트레이더스/롯데 VIC마켓)은 생활쇼핑 할인 서비스에서 제외됩니다., '생활쇼핑 가맹점 업종: 슈퍼마켓/할인점/편의점/농협(마트)/정육점/생활잡화/식품잡화/수입상품점/주류판매/청과물/농수산물/농가공산품/복지매점/보훈매장/사원전용매장/농수축협직판장/미곡상/대량양판점/연쇄점/연금매장점']
        target:
          categories: [convenience, grocery_mart]
          exclude_merchants: [emart, homeplus, lotte_mart, traders]
        when:
          - {channel: offline}
          - amount: {min: 50000}
        reward: {type: billing_discount, rate: 15}
        limits:
          - {per: txn, base: 100000}
          - {per: month, count: 4}
          - {shared: living_count}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: living-10
        title: 생활쇼핑 10% 할인
        source: page
        evidence: [생활쇼핑 기본 10% 결제일 할인이 적용됩니다., 월 8회, 1회 이용금액 10만원까지 할인이 적용됩니다., 오프라인 매장에 한하여 적용되며 온라인몰 및 상품권 구매, 문화센터 등 비쇼핑 항목은 생활쇼핑 할인 서비스에서 제외됩니다., 3대 할인점(이마트/롯데마트/홈플러스) 및 창고형 할인매장(이마트 트레이더스/롯데 VIC마켓)은 생활쇼핑 할인 서비스에서 제외됩니다.]
        target:
          categories: [convenience, grocery_mart]
          exclude_merchants: [emart, homeplus, lotte_mart, traders]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 100000}
