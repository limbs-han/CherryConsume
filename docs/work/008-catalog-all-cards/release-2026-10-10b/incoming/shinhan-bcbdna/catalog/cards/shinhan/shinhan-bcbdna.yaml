          - {per: month, count: 3}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: weekend-lotte-cinema
        title: 주말 롯데시네마 현장 예매 5천원 할인
        source: page
        evidence: [주말 롯데시네마 현장 예매시 5천원 결제일 할인, '현장 영화 예매에 한하여 적용되며 온라인 예매 및 매점 이용, 상품권 구매는 제외됩니다.', '주말 할인 서비스는 서비스 별 각 일 1회, 월 3회까지 적용됩니다.', 1회 이용금액 1만원 이상인 거래건에 대해 할인이 적용되며]
        target:
          merchants: [lotte_cinema]
        when:
          - {channel: offline}
          - day:
              in: [sat, sun]
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 5000}
        limits:
          - {per: day, count: 1}
          - {per: month, count: 3}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: [롯데시네마 매점 이용과 상품권 구매는 할인하지 않는다.]
    unmodeled: ['생활쇼핑 업종 중 정육점, 생활잡화, 식품잡화, 수입상품점, 주류판매, 청과물, 농수산물, 복지매점, 보훈매장 같은 업종은 공통 업종이 없어 계산하지 않는다.', 롯데 VIC마켓과 코스트코 같은 창고형 할인매장은 생활쇼핑에서 빠지지만 마트 업종으로만 기록하면 구별하지 못한다., '백화점, 마트, 복합쇼핑몰에 입점한 생활쇼핑, 커피전문점, 제과점 가맹점은 할인하지 않는다.', '주말 복합쇼핑몰 10% 할인은 스타필드 하남·고양, 롯데월드타워 쇼핑몰, 롯데몰 은평·김포공항·수원 지점의 직영 가맹점만 대상이라 지점을 구별하지 못해 계산하지 않는다.', Master 브랜드 해외 일시불 거래의 해외서비스 수수료 0.18% 포인트 적립은 브랜드 선택을 묻지 않아 계산하지 않는다., 전월 실적과 월 할인 횟수는 본인과 가족카드를 합산한다., 할인받은 거래가 같은 달에 취소되면 할인 횟수와 한도가 복원된다.]
open_questions:
  - {path: 'revisions[0].effective_from', question: 이 혜택 구성이 시작된 날을 공식 원문에서 찾지 못해 확인한 날로 두었다, assumed: '2026-10-10'}
notes: '신한카드 Deep Store(우리먹거리) 상품 페이지와 신용카드 목록 API 기준. entryId 202408120003. 연회비는 API 값으로 S&(카드사 기본 브랜드 코드 8, 국내전용 연회비로 아멕스 해외 가맹점 이용) 13,000원, Master 16,000원. 카드 출시 2018.07.10, 심의필 제2018-C1a-08191호. 실적 제외: 할인 적용 매출, 아파트 관리비, 국세, 지방세, 수도요금, 4대보험, 카드대출, 연회비, 수수료, 이자, 기프트카드 구매, 선불카드 충전, 거래취소. 교통 이용금액은 전전월 기준. 신규 발급 회원은 등록월 다음 달 말까지 30만~60만원 구간 한도. 생활쇼핑은 월 8회이고 그중 5만원 이상 15%는 월 4회다. 15%와 10%를 같은 묶음에 두고 월 8회를 함께 쓰는 한도 living_count로 묶었다.'
