        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 50000}
          - {per: day, count: 1}
          - {per: month, count: 3}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: weekend-mart-10
        title: 주말 3대 할인점 10% 할인
        source: page
        evidence: [주말 3대 할인점 10% 결제일 할인, '이마트, 롯데마트, 홈플러스', '이마트트레이더스, 롯데VIC마켓', '기업형 슈퍼마켓(이마트 에브리데이, 롯데슈퍼, 홈플러스 익스프레스), 온라인몰 및 상품권 구매, 문화센터 등 비쇼핑 항목은 3대 할인점 서비스에서 제외됩니다.', 주말 할인서비스는 공휴일 여부와 상관없이 “토요일/일요일”에 해당합니다., '주말 할인 서비스는 서비스 별 각 일 1회, 월 3회까지 적용됩니다.', 1회 이용금액 1만원 이상인 거래건에 대해 할인이 적용되며, 주말 복합쇼핑몰 할인, 3대 할인점 할인 서비스는 1회 이용금액 5만원까지 할인이 적용됩니다.]
        target:
