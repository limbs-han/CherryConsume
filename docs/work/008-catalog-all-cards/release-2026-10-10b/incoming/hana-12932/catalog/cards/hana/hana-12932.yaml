        spill: none
    benefits:
      - key: fuel-10
        title: 4대 정유사 주유·LPG 10% 할인
        source: page
        evidence: ['주유(LPG포함) | SK, GS, S-OIL, 현대오일뱅크 | 40만원 | 10% | 월 최대 1만5천원 청구할인', 70만원 | 10% | 월 최대 3만원 청구할인, '주유 금액 : 1일 1회 최대 10만원 까지 혜택 적용']
        target:
          merchants: [gs_caltex, hd_oilbank, s_oil, sk_energy]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 100000}
          - {per: day, count: 1}
          - per: month
            amount: {400000: 15000, 700000: 30000}
        tiers: {from: 400000}
      - key: coffee-5
        title: 스타벅스·커피빈 5% 할인
        source: page
        evidence: ['커피 | 스타벅스, 커피빈 | 40만원 | 5% | 월 최대 5천원 청구할인', 백화점/쇼핑몰 등 대형 시설물 입점 점포 및 마트 내 임대 점포 이용금액 제외]
        target:
          merchants: [coffee_bean, starbucks]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 400000}
        unmodeled: [백화점·쇼핑몰 등 대형 시설물 입점 점포와 마트 안 임대 점포는 제외된다]
      - key: pay-1
        title: 페이결제 1% 할인
        source: page
        evidence: ['페이결제 | 하나페이, 삼성페이, 네이버페이, 쿠페이, LG페이, L페이, 카카오페이, SSG페이, 페이코에 카드를 등록하여 결제 | 없음 | 1% | 월 최대 5천원 청구할인', 할인 대상이 중복으로 해당되는 경우 할인율이 높은 서비스가 우선 적용됩니다. (매출 건당 하나의 서비스만 적용됩니다.), '주유, 커피, 주차 할인서비스는 서비스별 할인 한도 초과 시, 페이결제는 1.0% 할인율이 적용됩니다.']
        target: {all: true}
        when:
          - payment: [coupay, hana_pay, kakao_pay, l_pay, naver_pay, payco, samsung_pay, ssg_pay]
        reward: {type: billing_discount, rate: 1}
        limits:
          - {per: month, amount: 5000}
        exclude_applied: 0
        notes: LG페이는 결제수단 키가 없어 계산하지 않는다
    unmodeled: [아이파킹 앱 결제 5% 할인(월 5천원)은 가맹점 키가 없어 계산하지 않는다, 스피드메이트 엔진오일 교환 2만5천원 현장할인(연 1회)은 멀티카드 실물 연결 결제에만 주고 가맹점 키가 없어 계산하지 않는다, 국내외 ATM 이용금액은 실적에서 빠진다, 모든 할인은 하나카드에 등록된 국내 가맹점과 업종 기준이다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 카드 출시일을 잠정 시작일로 둔다, assumed: '2020-12-15'}
  - {path: 'revisions[0].benefits[fuel-10].limits', question: 1일 1회 최대 10만원까지가 그날 첫 결제에만 적용인지 하루 합산 10만원까지인지 원문이 불명확하다, assumed: 하루 1회 결제 10만원까지}
notes: '모바일 전용 카드. 연회비 국내전용·국내외겸용(VISA) 15,000원. 실적은 지난달 1일~말일 승인 기준 국내외 일시불·할부 40만원/70만원. 실적 제외: 국세, 지방세, 공과금, 4대보험, 상품권·기프트카드, 선불 충전, 수도·전기요금, 아파트 관리비, 부동산임대료, 스쿨뱅킹, 도시가스, 대학·대학원 등록금, 초중고 납입금, 무이자할부, ATM, 이 카드로 할인 받은 매출(페이결제 할인은 실적 포함). 최초 사용등록일~다음 달 말일은 40만~70만원 구간. 한 건에 할인율이 높은 서비스 하나만 주고, 주유·커피 한도를 넘기면 페이결제 1%가 적용된다. 소수점 이하 절사. 2026-10-10 상품 페이지 원문으로 작성.'
