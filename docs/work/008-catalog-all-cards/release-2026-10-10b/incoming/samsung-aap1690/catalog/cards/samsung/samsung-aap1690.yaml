notes: 2026-10-10 상품설명서(2022.8판, 여신금융협회 심의필 제2020-C1a-09857호) 확인. 연회비 국내전용과 해외겸용 Mastercard 모두 10,000원(기본 7,000+제휴 3,000). 발급월+1개월까지 30만 구간 혜택을 준다. 요기요 10%와 커피·편의점·다이소 5% 할인을 받은 결제는 실적에서 빠지고 요기요 1%와 스트리밍 할인은 실적에 넣는다. 실적 제외는 4대보험, 국세·지방세·공과금, 초중고 납입금, 대학 등록금, 대중교통, 택시, 아파트관리비, 임대료, 기프트·선불카드, 상품권이다. 후불교통기능이 탑재되어 발급된다.
