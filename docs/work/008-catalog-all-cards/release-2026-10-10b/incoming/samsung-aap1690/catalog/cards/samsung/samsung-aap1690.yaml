  - {path: 'revisions[0].effective_from', question: 상품 출시일은 2020-10-29이고 상품설명서는 2022.8판이다. 출시일을 시행일로 두었다, assumed: '2020-10-29'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통을 시내버스와 지하철로 보았다. 초중고 납입금은 유치원을 함께 담은 education.school_fee도 뺐다, assumed: 'transit.bus_city, transit.subway, education.school_fee'}
