    unmodeled: [BS RENTAL 이용금액은 모두 실적에서 빠진다. 할인받은 렌탈료만 빼고 할인받지 않은 BS렌탈 결제는 실적에 남는다, '장기할부 캐시백 10,000·15,000·25,000원은 BS RENTAL 10만원 이상 장기할부 이용 다음 달부터 36개월차까지 매월 26일 지급이라 계산하지 않는다. 렌탈료 할인과 장기할부 캐시백은 중복되지 않는다', 할인 대상은 제휴 렌탈사 렌탈료다. BS렌탈 밖의 제휴 렌탈사는 원문에 이름이 없어 넣지 않았다, '오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 자동차 환경개선 부담금, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', LOCA X BS RENTAL이 아닌 다른 롯데카드 이용금액은 실적에 넣지 않는다]
