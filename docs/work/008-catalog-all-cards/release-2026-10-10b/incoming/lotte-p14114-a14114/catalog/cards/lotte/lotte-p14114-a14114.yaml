    unmodeled: [주유소 할인은 휘발유·경유·LPG만이다. 등유 등 다른 유종은 할인하지 않는다, '전기차 충전 50% 할인은 주유와 월 5,000원 한도를 함께 쓰지만 전기차 충전 업종이 없어 계산하지 않는다', '카카오 대리운전 2,000원 결제일 할인(월 1회)은 가맹점이 없어 계산하지 않는다', 'G car와 세차클링 이용료 10% 결제일 할인(통합 월 5,000원)은 가맹점이 없어 계산하지 않는다', 가족카드 이용금액도 본인 실적에 더하고 할인 한도는 본인과 가족카드가 합산한다, 롯데카드의 다른 결제일 할인과 겹치면 할인 금액이 큰 혜택 하나만 준다, '포인트 충전, 오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 고속도로 통행요금, 무승인전표, 벌금·과태료·민원 발급 수수료·관세·인지세·송달료, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', MY RENTAL+ 롯데카드가 아닌 다른 롯데카드 이용금액은 실적에 넣지 않는다, 할인은 승인 시점 기준 남은 한도 안에서 준다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2022-06-29이고 설명서는 2026년 8월 기준이다, assumed: '2026-10-10'}
  - {path: 'revisions[0].benefits[rental-discount].target', question: 공통 가맹점 lotte_rental(롯데렌탈)이 필요하다. needed/lotte-p14114-a14114.json에 제안했다}
notes: 2026-10-10 상품 페이지와 상품설명서 대조. 신규 발급 특례는 발급일부터 다음 달 말일까지 실적 무관 혜택이고 대여료는 5,000원이라 50만 구간으로 넣었다. 발급월 이용금액이 높으면 그 구간을 준다는 원문과 맞다. 대여료가 할인금액보다 적으면 대여료만큼이라 100% 할인에 월 한도와 월 1회로 적었다. 실적 제외의 대중교통(버스, 지하철)은 시외버스까지 빼 실적이 적게 잡히는 쪽으로 두었다.
