    unmodeled: [신세계백화점 5% 할인은 백화점 실적에 따라 주는 전자할인쿠폰(월 2~5매)이라 계산하지 않는다, '놀이공원 50%·워터파크 30% 현장할인, S-OIL 리터당 40 보너스포인트, 롯데시네마 동반 1인 50% 캐시백은 직전 3개월 월평균 이용금액 30만원 이상 조건이라 계산하지 않는다', '신세계몰과 이마트몰 1,000원당 7 신세계포인트는 공통 가맹점이 없어 계산하지 않는다', 캐시백은 월 1회 출금계좌로 입금된다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 원문 수집일로 두었다. 상품 출시일은 2013-05-02이고 상품안내장은 2023.3판이다, assumed: '2026-10-05'}
  - {path: 'revisions[0].benefits[cashback-1].target', question: 대중교통 범위가 적혀 있지 않아 시내버스와 지하철만 넣었다, assumed: 'transit.bus_city, transit.subway'}
  - {path: annual_fees, question: 상품 페이지는 연회비 없음이라고만 적고 해외겸용 브랜드를 적지 않았다, assumed: domestic 0}
notes: 2026-10-10 상품안내장(신세계KB국민은행·애니패스포인트·지엔미포인트 체크카드 공용, 2023.3판)과 상품 페이지 대조. 초안의 이마트 6,000원, 아웃백 10%, CGV 1,500원, 스타벅스 1,000원은 애니패스·지엔미 포인트체크카드 혜택이라 뺐다. 캐시백은 이용실적과 조건 없이 준다. 신세계포인트는 캐시백과 따로 받는다고 보았다. 상품 페이지에 신세계백화점 무료 주차권이 있으나 결제 혜택이 아니다. 소액신용 30만원과 후불교통은 KB국민은행에서 신청한다.
