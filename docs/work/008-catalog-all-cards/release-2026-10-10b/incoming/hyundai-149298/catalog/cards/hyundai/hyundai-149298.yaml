open_questions:
  - {path: 'revisions[0].effective_from', question: 이 가이드북은 2026년 7월 기준이다. 그 전부터 혜택이 같았는지 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
notes: 2026-10-10 공식 가이드북(2026년 7월 기준) 대조. 연회비 국내전용과 국내외겸용(Visa Platinum) 30,000원(기본 10,000+제휴 20,000), 가족카드 10,000원. 50만 이상 국내외 1%, 롯데 대상점 5%이고 대상점 월 2만 포인트를 넘으면 1%로 적립한다. 매출 건별 소수점 이하 반올림. 실적은 전월 1일~말일 일시불과 할부이고 롯데 대상점 이용 금액과 공과금 등을 뺀다. 취소는 승인월 실적에서 빼고 해외는 취소 달에서 뺀다. 신규 발급 시 카드 수령 등록월 다음 달 이용 건까지 50만 미만도 혜택을 준다. GOLD(hyundai-149297)와 구조가 같다.
