open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 상품 페이지 준법심의일을 잠정 시작일로 둔다. 카드 출시는 2022-08-26이다., assumed: '2026-05-28'}
  - {path: 'revisions[0].benefits[coffee-300].when', question: '건당 결제 조건 표가 대중교통·커피 3백원 이상, 편의점·디지털 구독·주유 3천원 이상, 쇼핑·생활요금 3만원 이상으로 칸을 묶었다. 커피가 3백원인지 표 배치 확인이 필요하다.', assumed: 커피 300원 이상}
  - {path: annual_fees, question: '원문은 국내전용과 국내외 겸용 연회비가 모두 20,000원이라고만 적고 국제 브랜드 이름이 없다.', assumed: 국내전용 20000만 적음}
notes: 2026-10-11 공식 상품 페이지(상세 번호 CD_PD_SEQ=15444, 목록 상품 번호 19109, 준법심의 A-26-2223)에서 옮겼다. 영역마다 지난달 실적 20만/60만/100만원에 월 할인 건수가 다르고 통합 금액 한도는 없다. 실적에서 빠지는 할인 매출은 커피·편의점·디지털 구독·주유·쇼핑·생활요금이고 대중교통 할인 매출은 실적에 남는다. 최초 사용등록일~다음 달 말일은 20만~60만원 구간. 청구할인 제외에 자동이체 전기·도시가스는 들지 않는다.
