open_questions:
  - {path: 'revisions[0].benefits[insurance-10].when', question: 모든 간편결제 제외에 삼성페이와 애플페이도 드는지, assumed: 든다}
  - {path: 'revisions[0].benefits[transit-10].when', question: 원문은 건당 2만원 이상 결제 건이다. 후불교통은 한 달 이용액이 한 건으로 합산 청구되는데 이 조건을 그 합산 청구액에 적용하는지, assumed: 한 달 합산 청구액을 한 건으로 본다. 이 카드는 월 금액 한도만 있어 탈 때마다 적은 결제를 합산해도 계산이 맞다. 2026-09-30 사용자가 카드마다 원문에 맞게 담기로 했다}
notes: '지난달 1일~말일 50만원 이상(본인·가족카드 합산) 이용 시 생활업종 결제일 할인, 월 최대 36,500원. 건당 2만원 이상 결제만 할인하고 스트리밍은 금액과 상관없다. 최초 발급 시 카드발급일~다음 달 말일은 실적과 상관없이 할인. 실적 제외: LOCA 365가 아닌 롯데카드 이용금액, 무이자할부, 국세·지방세, 4대보험, 초·중·고 납입금, 대학등록금, LH·SH 공공임대료, 부동산 임대료, 장애인 고용부담금, 오토·스마트 캐시백 신청 금액, 기프트·선불카드 충전과 구매, 포인트 충전, 상품권, 택시, 고속버스, 고속도로 통행요금, 무승인전표, 벌금·과태료, 민원 발급 수수료, 관세·인지세·송달료, 현금서비스·카드론, 연회비, 이자·수수료. 할인 제외: 모든 무이자할부, 기프트·선불카드 충전과 구매, 포인트 충전, 상품권, 스마트 캐시백 신청 금액. 해외 이용은 현지 매출일자, 이동통신·대중교통처럼 한 달 이용액이 다음 달 결제되는 건은 롯데카드 접수일 기준으로 실적과 할인에 반영. 지난달 실적에 든 매출을 취소하면 지난달 실적과 이번 달 한도가 바뀔 수 있다. 할부는 이용일 기준 전체 금액이 실적에 들어간다. 할인한도는 승인 시점 기준, 이월되지 않는다. 결제 건 혜택 아님: 국내 5만원 이상 2~3개월 무이자할부. L.POINT 적립 없음. 현금서비스, 카드론, 이자, 수수료는 결제 기록이 아니라 다루지 않는다. 첫 개정 시행일 근거: page. 카드출시일 2022-02-14. 롯데카드 공지사항 2019-11~2026-09 71건에 이 카드의 부가서비스 변경 공지 없음.'
