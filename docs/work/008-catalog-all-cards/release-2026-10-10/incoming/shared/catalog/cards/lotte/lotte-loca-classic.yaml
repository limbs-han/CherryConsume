notes: 'LOCA LIKIT 1.2 신규 발급 중단으로 대신 넣은 카드. 국내외 전가맹점 결제일 할인, 할인한도 없음. 지난달 150만원 미만 0.5%, 150만원 이상 1.0%, 기본할인과 특별할인은 중복 제공되지 않는다. 최초 발급 시 카드발급일~다음 달 말일은 실적과 상관없이 특별할인. 실적 제외와 할인 제외: 무이자할부, 국세·지방세, 도시가스비·공과금, 4대보험, LOCA 시리즈가 아닌 롯데카드 이용금액(실적만), 초·중·고 납입금, LH·SH 공공임대료, 부동산 임대료, 장애인 고용부담금, 아파트관리비, 대학등록금, 오토·스마트 캐시백 신청 금액, 기프트·선불카드 충전과 구매, 포인트 충전, 상품권, 현금서비스·카드론, 연회비, 이자·수수료. 현금서비스, 카드론, 이자, 수수료는 결제 기록이 아니라 다루지 않는다. 취소매출은 승인된 달의 실적에서 빠진다. 할부는 승인된 달에 전체 금액이 실적에 들어간다. 해외 이용 수수료 별도. L.POINT 적립 없음. 가족카드 연회비 없음. 첫 개정 시행일 근거: page. 카드출시일 2020-07-10. 롯데카드 공지사항 2019-11~2026-09 71건에 이 카드의 부가서비스 변경 공지 없음.'
