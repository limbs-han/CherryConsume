schema_version: 2
id: hana-10222
issuer: hana
name: 길한통 체크카드
short_name: 하나 길한통 체크
kind: check
product_codes:
  - '10222'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: unionpay, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.hanacard.co.kr/OPI41000000D.web?CD_PD_SEQ=10222', fetched_at: 2026-10-10, review_no: L-20-0563}
  - {id: leaflet, kind: manual_pdf, url: 'https://m.hanacard.co.kr/leaflet/12/12129_20260128.pdf', fetched_at: 2026-10-10, review_no: L-26-0164}
checked_at: '2026-10-10'
revisions:
  - effective_from: 2026-01-28
    effective_from_estimated: true
    source: leaflet
    tiers: [0, 200000, 400000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, prepaid_charge, tax, utility]
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 200000, from: registration}
    limits:
      - key: lunch
        per: month
        amount: {200000: 5000, 400000: 10000}
    benefits:
      - key: overseas-fee-free
        title: 해외 가맹점 국제브랜드수수료 0.6% 면제
        source: leaflet
        evidence: [해외 가맹점 물품구매 시 | 건당 $0.5 면제 | 이용금액의 0.6% 면제, 지난달 카드 이용 금액에 관계 없이 제공, 해외 이용금액은 하나카드 전산상 해외가맹점 매출로 분류된 경우에 한함]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: billing_discount, rate: 0.6}
        unmodeled: [건당 US$0.5 해외이용수수료 면제는 달러 정액이라 계산하지 않는다, 하나은행 결제계좌를 쓰지 않으면 해외 이용이 되지 않는다]
      - key: lunch-time-5
        title: 평일 점심 음식점·커피·편의점 5% 캐쉬백
        source: leaflet
        evidence: ['평일 오전 11시 ~ 오후 2시 사이에 국내일반음식점(한식/중식/양식/일식 등), 커피, 편의점 업종에서 건당 5천원 이상 결제 시 해당 결제 금액의 5% 캐쉬백', 지난달 이용금액 20만원 이상 통합한도 5천원 40만원 이상 1만원, 국내 오프라인 이용금액에 한함, 평일이 임시공휴일 경우 캐쉬백 제외, 캐쉬백 적용 이용금액은 지난달 이용금액에서 제외]
        target:
          categories: [cafe, convenience, restaurant.general]
        when:
          - {region: domestic}
          - {channel: offline}
          - amount: {min: 5000}
          - day:
              in: [mon, tue, wed, thu, fri]
              holidays: exclude
          - time: {from: '11:00', to: '14:00'}
        reward: {type: cashback, rate: 5}
        limits:
          - {shared: lunch}
        tiers: {from: 200000}
        exclude_applied: 1
        unmodeled: [백화점·할인점·아울렛·쇼핑몰·공항·호텔·리조트·역사 입점 점포는 제외된다]
open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: '원문 실적 제외는 "공과금, 도시가스 이용금액"이다. 전기와 수도가 공과금에 드는지 원문만으로 단정할 수 없어 utility 전체를 뺐다.', assumed: utility 전체}
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 상품설명서 준법심의일을 잠정 시작일로 둔다., assumed: '2026-01-28'}
  - {path: 'revisions[0].benefits[lunch-time-5].when', question: '"오전 11시 ~ 오후 2시 사이"에서 14:00 정각 결제가 포함되는지 원문이 불명확하다. 14:00 미만으로 계산한다.', assumed: '11:00 이상 14:00 미만'}
  - {path: 'revisions[0].benefits[lunch-time-5].when', question: 원문은 평일이 임시공휴일이면 제외한다고만 적었다. 평일에 걸린 일반 공휴일도 제외로 계산한다., assumed: holidays exclude}
  - {path: 'revisions[0].spend', question: 실적 제외의 아이행복 정부지원금은 업종으로 가릴 수 없다., assumed: 실적에 넣음}
notes: 2026-10-10 공식 상품 페이지와 상품설명서(준법심의 L-26-0164)에서 옮겼다. 연회비 없음. 해외 ATM 인출 건당 US$3 수수료 면제는 결제가 아니라 계산하지 않는다. UPI 플래티늄 국제 브랜드 서비스는 별도 안내라 넣지 않았다. 도시가스와 공과금은 utility로 실적에서 뺀다.
