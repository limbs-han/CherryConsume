        reward: {type: points, program: hana_money, rate: 5, round: round}
        limits:
          - {per: month, count: 5}
          - {shared: basic}
        tiers: {from: 200000}
        unmodeled: ['대형시설물(백화점, 할인점, 아울렛, 쇼핑몰, 휴게소, 공항, 호텔, 리조트, 역사, 마트) 입점 점포와 임대매장 결제는 제외된다']
