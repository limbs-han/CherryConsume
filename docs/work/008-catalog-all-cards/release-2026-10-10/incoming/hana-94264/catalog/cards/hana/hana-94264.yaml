        source: leaflet
        evidence: [해외 가맹점 이용 시 | 해외 서비스 수수료 면제(건당 US$0.5) | 국제브랜드 수수료 면제(이용금액의 1.1%), 지난달 실적에 관계없이 서비스 제공, 해외 이용금액은 하나카드 전산상 해외 가맹점 매출로 분류된 경우에 한함]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: billing_discount, rate: 1.1}
        unmodeled: [건당 US$0.5 해외서비스수수료 면제는 달러 정액이라 계산하지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 상품설명서 준법심의일을 잠정 시작일로 둔다. 출시일은 2024-08-13이다., assumed: '2025-12-29'}
  - {path: 'revisions[0].benefits[transit-5].limits', question: '"각 서비스 영역별 월 최대 5회 적립"이 월 합산으로 다음 달 한 번 적립하는 대중교통에도 걸리는지 불명확하다. 횟수 한도를 두지 않았다.', assumed: 횟수 한도 없음}
  - {path: 'revisions[0].benefits[subscription-5].when', question: '"간편 결제 건" 제외가 어느 결제수단까지인지 원문에 목록이 없다. 온라인 간편결제 8종만 뺐고 삼성페이, 애플페이, 하나Pay, 쿠페이는 넣었다.', assumed: 'eleven_pay, kakao_pay, l_pay, naver_pay, payco, smile_pay, ssg_pay, toss_pay 제외'}
notes: 2026-10-10 공식 상품 페이지(상세 번호 CD_PD_SEQ=18064, 목록 상품 번호 94264)와 상품설명서(준법심의 L-25-0564)에서 옮겼다. 하나머니 잔액으로 결제하는 하나머니 전용 체크카드다. 국내는 원화 하나머니, 해외는 외화 하나머니에서 나간다. 연회비 없음. 초안의 국내 가맹점 5% 한 혜택은 목록 요약을 잘못 옮긴 것이라 영역 다섯 개로 나눴다. 20만 구간의 편의점, 커피·베이커리, 대중교통이 월 5천을 같이 쓰고 50만 구간의 구독과 생활비가 다른 월 5천을 같이 쓴다. 50만 구간은 20만 구간 영역도 받는다. 적립은 매출 접수된 일시불 이용금액 기준이고 체크카드라 할부가 없어 조건을 두지 않았다. 해외 ATM 인출 수수료 면제와 국내외 ATM 이용금액 실적 제외는 결제가 아니라 넣지 않았다. 적립 제외는 수도요금만 빼고 전기·가스요금은 생활비 영역 대상이라 남겼다. 실적 제외의 그외 공과금은 utility와 tax로 넣었다.
