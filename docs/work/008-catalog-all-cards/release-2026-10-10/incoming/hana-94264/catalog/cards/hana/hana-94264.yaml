        tiers: {from: 200000}
      - key: subscription-5
        title: 유튜브 프리미엄·넷플릭스·쿠팡와우 정기결제 5% 적립
        source: leaflet
        evidence: ['구독 | 유튜브 프리미엄, 넷플릭스, 쿠팡와우멤버십 | 5% | 건당 7천원 이상 | 5천 하나머니 | 50만원 이상', '구독 : 월 정기결제 건에 한하여 매월 제공되며, 유튜브 프리미엄/넷플릭스 이용시 포인트, 캐시, 머니충전, 컨텐츠 개별 결제, 간편 결제 건 및 앱스토어를 통한 결제 건(인앱 결제)은 서비스에서 제외됨']
