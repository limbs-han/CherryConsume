          exclude_merchants: [lfmall]
        reward: {type: points, program: kb_pointree, rate: 0.5}
        unmodeled: [정부지원금(보육료·유치원보조비·바우처) 결제와 신차구매청구(환급)할인 전표는 적립에서 빠진다]
    unmodeled: [정부지원금(보육료·유치원보조비·바우처) 결제와 신차구매청구(환급)할인 전표는 실적에서 빠진다, 부분 무이자 할부 이용금액도 실적과 적립에서 빠진다. 결제 입력의 무이자 여부에 부분 무이자도 표시해야 한다, 월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 할인과 적립 한도는 전표 매입 순서대로 채운다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 정확한 날짜를 확인해야 한다. 원문은 2022.10.07 출시라고만 적었다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-10'}
  - {path: 'revisions[0].spend.basis', question: 상품 페이지에 전월 이용실적 집계 기준 문구가 없다. KB 카드사 기본값인 전월 1일부터 말일 승인 기준으로 둔다. 상품설명서로 확인해야 한다., assumed: prev_calendar_month}
notes: 2026-10-10 KB국민카드 상품 페이지를 직접 받아 대조했다. 상품설명서 PDF(img2.kbcard.com)는 robots.txt가 막아 받지 않았다. 연회비는 모바일 공식 페이지 m.kbcard.com/c/09314의 합계 1만5천원과 데스크톱 머리의 국내전용, MASTER 15,000원을 따른다. 데스크톱 연회비 탭 표는 이 카드에 없는 K-World와 VISA 행이 있어 다른 상품 표로 본다. LFmall 할인은 lfmall 가맹점 온라인 결제로 계산한다. 공통 가맹점 lfmall이 필요하다.
