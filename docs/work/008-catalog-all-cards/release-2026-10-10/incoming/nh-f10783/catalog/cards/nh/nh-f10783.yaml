    unmodeled: ['실적과 혜택에서 과태료·범칙금, 우체국 우편요금, 가상화폐 거래소, 카드대출, 수수료·이자·연체료, 포인트 사용분은 제외한다.', 해외와 교통·통신료 등 무승인 결제는 매출표 접수일 기준으로 실적에 넣는다. 취소는 취소 매출표 접수월 실적에서 차감한다., 가족카드는 실적과 횟수·한도를 본인카드와 별도로 계산한다., '더라운지 앱 공항라운지 국내외 합산 월 1회·연 2회. 전월실적 40만원 이상, 등록월 제외. 본인·가족 각각 제공. 당일 탑승권·여권 필요. 발급한 이용권은 24시간 내 사용해야 한다.', '국제브랜드 발레파킹 선택서비스는 전월실적 30만원 이상, 등록월 제외.', 공과금 중 전기요금은 주택용만 해당한다.]
open_questions:
  - {path: 'revisions[0].benefits[living-digital-30].when', question: 디지털구독에서 제외하는 일부 페이 결제수단 이름을 추가 확인해야 한다. 원문에 특정 이름이 없다., assumed: 정기결제와 인앱 제외는 실행하며 공식 사이트 직접결제 여부와 미상 페이는 확인 필요 조건으로 표시한다.}
notes: 수집된 공식 상품 페이지의 현재 조건을 대조했다. 과거 시행일을 확인하지 못해 수집일을 추정 적용일로 사용했다.
