open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 원문 수집일로 두었다. 상품 출시일은 2017-11-17이고 상품설명서는 2023.6판이다, assumed: '2026-10-05'}
  - {path: 'revisions[0].benefits', question: 포인트의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통 범위가 적혀 있지 않아 taptap O처럼 시내버스와 지하철로 두었다. 삼성카드는 사회보험료를 공과금으로 분류해 insurance.social을 뺐다, assumed: 'transit.bus_city, transit.subway, insurance.social'}
notes: 2026-10-10 상품설명서(2023.6판, 심의필 2017-C1a-12219호) 대조. 카드 신청은 네이버페이에서만 받는다. 연회비 해외겸용 Mastercard와 국내전용 모두 15,000원(기본 7,000+제휴 8,000), 가족카드 없음. 적립은 중복되지 않고 적립률이 높은 혜택이 먼저다. 10% 한도를 넘긴 다음 결제부터 커피·편의점·배달앱은 5%, 나머지는 0.5%다. 3,000P 추가 적립만 10%와 겹쳐 받는다. 실적 제외는 10%·5%·3,000P 적립이 적용된 이용금액, 국세·지방세·공과금, 아파트 관리비, 대학 등록금, 대중교통, 택시, 상품권, 선불카드 충전이다. 0.5% 적립 건은 실적에 들어간다. 발급월+1개월까지 패키지 혜택은 실적과 관계없이 준다. 패키지는 매월 바꿀 수 있고 신청 다음 달 1일에 반영된다. 네이버페이 포인트 1포인트는 1원.
