    unmodeled: ['해외·교통·통신은 매출표 접수월에 실적 반영. 국내 취소가 1~2일 접수되면 전월 실적 차감, 그 이후 접수는 접수월 차감', 신규 특례 시작일은 수령등록일과 사용개시일 중 빠른 날. 보유 시작일에 그 날을 입력한다, 추가·특별 적립 통합 한도 또는 영역 한도를 초과한 이후 결제부터 기본 적립한다, 모아포인트와 우리WON꿀머니는 각 1원. 가입자에게 꿀머니로 지급되나 계산은 모아포인트로 동일 원화가치를 표시한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 전체 혜택의 정확한 시작일을 확인하지 못해 공식 원문 수집일로 두었다. 상품출시일과 다르다., assumed: '2026-10-05'}
notes: 2026-10-10 공식 원문 대조. 안내만 보존한 추가 서비스는 계산 합계에 포함하지 않는다. 상품출시일은 2026-06-12이며 현행 조건 전체의 시행일 근거로 사용하지 않았다.
