[project]
name = "cherry-core"
version = "0.1.0"
description = "체리컨슘 카탈로그와 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.60",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
# openpyxl은 앱 엑셀 가져오기 시험의 xlsx를 만드는 backend/tools/make_import_fixtures.py가 쓴다. 작업 006 설계 7절
dev = ["pytest>=8.3", "ruff>=0.8", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cherry_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
