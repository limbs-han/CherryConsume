[project]
name = "cherry-core"
version = "0.1.0"
description = "체리컨슘 카탈로그와 계산 엔진"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.60",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
# 서버 cherry_api만 쓴다. 묶음은 wheel에 들어가지 않아 파이프라인에는 깔리지 않는다. 작업 005 설계 1절
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[tool.uv]
default-groups = ["dev", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cherry_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
