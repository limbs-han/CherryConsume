card: kakaobank-friends-check
cases:
  - name: 기본 캐시백 평일, 토요일, 추석 금요일
    prev_month_spend: 0
    payments:
      - {at: 2026-09-15T12:00, amount: 12345, merchant: cu}
      - {at: 2026-09-19T12:00, amount: 12345, merchant: cu}
      - {at: 2026-09-25T12:00, amount: 12345, merchant: cu}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 24}, counted: 12345, warnings: [assumed_value]}
      - {payment: 1, benefits: {weekend-0-4: 49}, counted: 12345}
      - {payment: 2, benefits: {weekend-0-4: 49}, counted: 12345}
    calc: 화요일 12,345 × 0.2% = 24.69, 버림 24. 토요일 12,345 × 0.4% = 49.38, 버림 49. 9월 25일 금요일은 추석이라 평일 0.2%는 빠지고 공휴일 0.4%로 49. 기본 캐시백은 구간 조건이 없어 지난달 0이어도 받는다

  - name: 대체공휴일과 한글날
    prev_month_spend: 0
    payments:
      - {at: 2026-10-05T10:00, amount: 30000, category: restaurant.general}
      - {at: 2026-10-06T10:00, amount: 30000, category: restaurant.general}
      - {at: 2026-10-09T10:00, amount: 30000, category: restaurant.general}
    expect:
      - {payment: 0, benefits: {weekend-0-4: 120}}
      - {payment: 1, benefits: {weekday-0-2: 60}}
      - {payment: 2, benefits: {weekend-0-4: 120}}
    calc: 10월 5일 월요일은 개천절 대체공휴일, 9일 금요일은 한글날이라 30,000 × 0.4% = 120. 10월 6일 화요일은 30,000 × 0.2% = 60

  - name: 배달의민족 금액 하한, 결제수단, 월 1회
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-01T19:00, amount: 19999, merchant: baemin, channel: online, payment_method: baemin_pay}
      - {at: 2026-09-02T19:00, amount: 20000, merchant: baemin, channel: online, payment_method: kakao_pay}
      - {at: 2026-09-03T19:00, amount: 20000, merchant: baemin, channel: online, payment_method: baemin_pay}
      - {at: 2026-09-05T19:00, amount: 25000, merchant: baemin, channel: online, payment_method: physical_card}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 39}, counted: 19999}
      - {payment: 1, benefits: {weekday-0-2: 40}}
      - {payment: 2, benefits: {baemin-1000: 1000, weekday-0-2: 40}, counted: 20000, warnings: [check_conditions]}
      - {payment: 3, benefits: {weekend-0-4: 100}, warnings: [limit_exhausted]}
    calc: 지난달 300,000은 30만 구간 하한. 19,999는 2만원 미만, 카카오페이는 대상 결제수단이 아니라 행사 없음. 배민페이 20,000에 1,000원과 평일 20,000 × 0.2% = 40. 토요일 25,000은 월 1회를 써 행사 0, 주말 25,000 × 0.4% = 100. 19,999 × 0.2% = 39.998, 버림 39

  - name: GS25와 저가커피 공유 월 10회, 월 1,000원
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-01T08:00, amount: 4999, merchant: gs25, payment_method: physical_card}
      - {at: 2026-09-01T09:00, amount: 1999, merchant: compose_coffee, payment_method: physical_card}
      - {at: 2026-09-02T08:00, amount: 5000, merchant: gs25, payment_method: physical_card}
      - {at: 2026-09-02T09:00, amount: 2000, merchant: mega_coffee, payment_method: samsung_pay}
      - {at: 2026-09-03T08:00, amount: 5000, merchant: gs25, payment_method: samsung_pay}
      - {at: 2026-09-03T09:00, amount: 2000, merchant: paik_coffee, payment_method: physical_card}
      - {at: 2026-09-04T08:00, amount: 5000, merchant: gs25, payment_method: physical_card}
      - {at: 2026-09-04T09:00, amount: 2000, merchant: compose_coffee, payment_method: physical_card}
      - {at: 2026-09-07T08:00, amount: 5000, merchant: gs25, payment_method: physical_card}
      - {at: 2026-09-07T09:00, amount: 2000, merchant: mega_coffee, payment_method: physical_card}
      - {at: 2026-09-08T08:00, amount: 5000, merchant: gs25, payment_method: physical_card}
      - {at: 2026-09-08T09:00, amount: 2000, merchant: paik_coffee, payment_method: physical_card}
      - {at: 2026-09-09T08:00, amount: 5000, merchant: gs25, payment_method: physical_card}
      - {at: 2026-09-09T09:00, amount: 2000, merchant: compose_coffee, payment_method: physical_card}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 9}}
      - {payment: 1, benefits: {weekday-0-2: 3}}
      - {payment: 2, benefits: {gs25-100: 100, weekday-0-2: 10}}
      - {payment: 3, benefits: {gs25-coffee-100: 100, weekday-0-2: 4}}
      - {payment: 4, benefits: {gs25-100: 100, weekday-0-2: 10}}
      - {payment: 5, benefits: {gs25-coffee-100: 100, weekday-0-2: 4}}
      - {payment: 6, benefits: {gs25-100: 100, weekday-0-2: 10}}
      - {payment: 7, benefits: {gs25-coffee-100: 100, weekday-0-2: 4}}
      - {payment: 8, benefits: {gs25-100: 100, weekday-0-2: 10}}
      - {payment: 9, benefits: {gs25-coffee-100: 100, weekday-0-2: 4}}
      - {payment: 10, benefits: {gs25-100: 100, weekday-0-2: 10}}
      - {payment: 11, benefits: {gs25-coffee-100: 100, weekday-0-2: 4}}
      - {payment: 12, benefits: {weekday-0-2: 10}, warnings: [limit_exhausted]}
      - {payment: 13, benefits: {weekday-0-2: 4}, warnings: [limit_exhausted]}
    calc: GS25 4,999와 커피 1,999는 금액 하한 미달. GS25 5회와 커피 5회로 공유 한도 10회, 1,000원을 채워 11번째부터 0. 기본 평일 5,000 × 0.2% = 10, 2,000 × 0.2% = 4, 4,999 × 0.2% = 9.998 버림 9, 1,999 × 0.2% = 3.998 버림 3

  - name: 다이소 결제수단 모름, 간편결제, 삼성페이
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-10T15:00, amount: 25000, merchant: daiso}
      - {at: 2026-09-11T15:00, amount: 30000, merchant: daiso, channel: online, payment_method: naver_pay}
      - {at: 2026-09-12T15:00, amount: 20000, merchant: daiso, payment_method: samsung_pay}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 50}, warnings: [needs_input]}
      - {payment: 1, benefits: {weekday-0-2: 60}}
      - {payment: 2, benefits: {daiso-1000: 1000, weekend-0-4: 80}, counted: 20000}
    calc: 결제수단 모름은 거짓으로 계산하고 묻는다. 네이버페이는 대상 결제수단이 아니다. 토요일 삼성페이 20,000은 2만원 이상이라 1,000원과 주말 20,000 × 0.4% = 80. 평일 25,000 → 50, 30,000 → 60

  - name: 쿠팡 5만원 하한
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-14T21:00, amount: 49999, merchant: coupang, channel: online, payment_method: coupay}
      - {at: 2026-09-15T21:00, amount: 50000, merchant: coupang, channel: online, payment_method: coupay}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 99}}
      - {payment: 1, benefits: {coupang-3000: 3000, weekday-0-2: 100}, counted: 50000}
    calc: 49,999는 5만원 미만이라 행사 없고 49,999 × 0.2% = 99.998 버림 99. 쿠페이 50,000은 3,000원과 50,000 × 0.2% = 100

  - name: 에이블리 간편결제 제외
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-16T22:00, amount: 80000, merchant: ably, channel: online, payment_method: toss_pay}
      - {at: 2026-09-17T22:00, amount: 50000, merchant: ably, channel: online, payment_method: physical_card}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 160}}
      - {payment: 1, benefits: {ably-2000: 2000, weekday-0-2: 100}}
    calc: 토스페이는 대상 결제수단이 아니라 행사 없고 80,000 × 0.2% = 160. 카드 결제 50,000은 2,000원과 50,000 × 0.2% = 100

  - name: GS칼텍스 하한과 월 1회
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-18T08:00, amount: 49999, merchant: gs_caltex}
      - {at: 2026-09-19T08:00, amount: 70000, merchant: gs_caltex}
      - {at: 2026-09-21T08:00, amount: 60000, merchant: gs_caltex}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 99}}
      - {payment: 1, benefits: {gs-caltex-3000: 3000, weekend-0-4: 280}, counted: 70000}
      - {payment: 2, benefits: {weekday-0-2: 120}, warnings: [limit_exhausted]}
    calc: 금요일 49,999는 5만원 미만이라 행사 없고 99.998 버림 99. 토요일 70,000은 3,000원과 70,000 × 0.4% = 280. 월요일 60,000은 월 1회를 써 행사 0, 60,000 × 0.2% = 120

  - name: 휴대전화 요금 자동결제
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-21T02:00, amount: 49990, merchant: lg_uplus, category: telecom.mobile}
      - {at: 2026-09-22T02:00, amount: 70000, merchant: skt}
      - {at: 2026-09-23T02:00, amount: 50000, merchant: kt, category: telecom.mobile}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 99}}
      - {payment: 1, benefits: {weekday-0-2: 140}, warnings: [needs_input]}
      - {payment: 2, benefits: {telecom-3000: 3000, weekday-0-2: 100}, counted: 50000, warnings: [check_conditions]}
    calc: 청구 방식은 가맹점 기본 autopay. LG유플러스 49,990은 5만원 미만이라 없고 99.98 버림 99. SKT는 업종이 부모 telecom까지만이라 대상 제외 telecom.internet_tv에 모른다로 걸려 없고 휴대폰 요금인지 묻는다. 기본은 70,000 × 0.2% = 140. KT 이동통신 50,000은 3,000원과 100

  - name: 학원 20만원 하한과 온라인 제외
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-01T15:00, amount: 250000, category: education.academy, channel: online}
      - {at: 2026-09-02T15:00, amount: 199999, category: education.academy}
      - {at: 2026-09-03T15:00, amount: 200000, category: education.academy}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 500}}
      - {payment: 1, benefits: {weekday-0-2: 399}}
      - {payment: 2, benefits: {academy-10000: 10000, weekday-0-2: 400}, counted: 200000}
    calc: 온라인 250,000은 오프라인 조건에 걸려 없고 500. 199,999는 20만원 미만이라 없고 399.998 버림 399. 오프라인 200,000은 10,000원과 200,000 × 0.2% = 400

  - name: 후불교통 한 달 합 5만원을 넘기는 결제
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-10T08:00, amount: 30000, category: transit.subway, billing: postpaid_transit}
      - {at: 2026-09-15T08:00, amount: 19999, category: transit.bus_city, billing: postpaid_transit}
      - {at: 2026-09-21T08:00, amount: 1550, category: transit.subway, billing: postpaid_transit}
      - {at: 2026-09-22T08:00, amount: 10000, category: transit.bus_city, billing: postpaid_transit}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 60}}
      - {payment: 1, benefits: {weekday-0-2: 39}}
      - {payment: 2, benefits: {transit-4000: 4000, weekday-0-2: 3}, warnings: [check_conditions]}
      - {payment: 3, benefits: {weekday-0-2: 20}}
    calc: 후불 지하철·시내버스 달 합이 30,000, 49,999로 5만원 미만이라 0. 1,550을 더해 51,549가 되는 결제가 달 혜택 4,000 − 0 = 4,000. 그 뒤 결제는 달 혜택이 4,000 그대로라 0. 기본 평일 60, 19,999 → 39.998 버림 39, 1,550 → 3.1 버림 3, 10,000 → 20

  - name: 택시 3만원 하한, 온라인 제외, 한국 시간 날짜
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-23T23:30, amount: 29999, category: taxi}
      - {at: 2026-09-27T01:00, amount: 40000, category: taxi, channel: online}
      - {at: 2026-09-28T23:30, amount: 30000, category: taxi}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 59}, counted: 29999}
      - {payment: 1, benefits: {weekend-0-4: 160}}
      - {payment: 2, benefits: {taxi-1000: 1000, weekday-0-2: 60}, counted: 30000}
    calc: 9월 23일 수요일 23시 30분은 추석 연휴가 시작되기 전이라 평일, 29,999는 3만원 미만이라 행사 없고 59.998 버림 59. 일요일 온라인 40,000은 오프라인 조건에 걸려 없고 0.4%로 160. 월요일 30,000은 1,000원과 60

  - name: 30만 구간 1원 모자람
    prev_month_spend: 299999
    payments:
      - {at: 2026-09-15T08:00, amount: 5000, merchant: gs25, payment_method: physical_card}
      - {at: 2026-09-15T19:00, amount: 50000, merchant: coupang, channel: online, payment_method: coupay}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 10}, warnings: [tier_not_met]}
      - {payment: 1, benefits: {weekday-0-2: 100}, warnings: [tier_not_met]}
    calc: 299,999는 30만 하한보다 1원 적어 0 구간이라 행사 혜택 없음. 기본은 5,000 × 0.2% = 10, 50,000 × 0.2% = 100

  - name: 신규 특례, 지난달 쓰기 시작
    prev_month_spend: 0
    holder: {started_on: 2026-08-20}
    payments:
      - {at: 2026-09-15T08:00, amount: 5000, merchant: gs25, payment_method: physical_card}
      - {at: 2026-09-30T20:00, amount: 50000, merchant: gs_caltex}
    expect:
      - {payment: 0, benefits: {gs25-100: 100, weekday-0-2: 10}}
      - {payment: 1, benefits: {gs-caltex-3000: 3000, weekday-0-2: 100}}
    calc: 8월 20일 시작이라 9월 30일까지 특례 30만 구간. 지난달 0이어도 GS25 100원과 평일 10. 특례 마지막 날 GS칼텍스 50,000은 3,000원과 100

  - name: 신규 특례가 끝난 달
    prev_month_spend: 0
    holder: {started_on: 2026-07-20}
    payments:
      - {at: 2026-09-15T08:00, amount: 5000, merchant: gs25, payment_method: physical_card}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 10}, warnings: [tier_not_met]}
    calc: 7월 20일 시작이면 특례는 8월 31일까지. 9월은 지난달 0이라 0 구간이고 행사 없음. 평일 5,000 × 0.2% = 10

  - name: 행사 마지막 날
    prev_month_spend: 300000
    payments:
      - {at: 2027-01-31T12:00, amount: 5000, merchant: gs25, payment_method: physical_card}
    expect:
      - {payment: 0, benefits: {gs25-100: 100, weekend-0-4: 20}}
    calc: valid_until 2027-01-31은 그날을 포함해 GS25 100원. 일요일이라 5,000 × 0.4% = 20

  - name: 행사 끝난 다음 날
    prev_month_spend: 300000
    payments:
      - {at: 2027-02-01T12:00, amount: 5000, merchant: gs25, payment_method: physical_card}
    expect:
      - {payment: 0, benefits: {weekday-0-2: 10}}
    calc: valid_until 다음 날이라 행사 혜택 없음. 월요일 5,000 × 0.2% = 10

  - name: 혜택과 실적에서 빠지는 결제
    prev_month_spend: 300000
    payments:
      - {at: 2026-09-10T10:00, amount: 150000, category: apartment_fee}
      - {at: 2026-09-10T11:00, amount: 80000, category: tax}
      - {at: 2026-09-10T12:00, amount: 60000, merchant: coupang, category: gift_card, channel: online, payment_method: coupay}
    expect:
      - {payment: 0, benefits: {}, counted: 0, warnings: [not_counted_toward_spend]}
      - {payment: 1, benefits: {}, counted: 0, warnings: [not_counted_toward_spend]}
      - {payment: 2, benefits: {}, counted: 0, warnings: [not_counted_toward_spend]}
    calc: 아파트관리비, 세금, 상품권은 실적 제외이자 모든 혜택 공통 제외라 기본 캐시백도 없고 실적 0. 쿠팡 교환권 60,000은 5만원 이상이지만 쿠팡 3천원 대상 제외 gift_card에 걸려 없음
