name: cherry_consume
description: "체리컨슘 앱. 작업 005"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: 4.3.0
  cp949_codec: ^1.0.2
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  html: ^0.15.7
  http: ^1.6.0
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  assets:
    # 목록 파일과 카드별 규칙 파일. 폴더마다 적어야 담긴다. 작업 014 설계 1절
    - assets/catalog/
    - assets/catalog/cards/
  # Pretendard 1.3.9에서 자주 쓰는 글자만 남기고 이름을 바꾼 글꼴. backend/tools/subset_font.py, 작업 011 설계 1절
  fonts:
    - family: CherrySans
      fonts:
        - asset: assets/fonts/CherrySans-Regular.otf
        - asset: assets/fonts/CherrySans-Bold.otf
          weight: 700
        - asset: assets/fonts/CherrySans-ExtraBold.otf
          weight: 800
