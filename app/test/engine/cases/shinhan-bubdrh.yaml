  prev_month_spend: 300000
  payments:
  - {at: 2026-11-03T10:00, amount: 10000, merchant: gs25, channel: offline, payment_method: physical_card}
  - {at: 2026-11-03T12:00, amount: 10000, merchant: cu, channel: offline, payment_method: physical_card}
