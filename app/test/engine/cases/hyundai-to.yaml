  calc: 50만 미만
- name: 신규 수령 다음 달까지 100만 구간
  holder: {started_on: 2026-11-02}
  prev_month_spend: 0
  payments:
  - {at: 2026-11-10T10:00, amount: 20000, merchant: app_store}
  expect:
  - {payment: 0, benefits: {tech-inapp-10: 2000}, counted: 20000}
  calc: 수령월이라 전월 0원도 100만 구간. 20,000 × 10% = 2,000P
