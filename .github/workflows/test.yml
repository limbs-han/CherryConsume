# 서버와 엔진 테스트, 앱 테스트. master에 서버, 엔진, 카탈로그, 앱이 바뀐 푸시와 수동 실행에서 돈다. 작업 005, 006
# 서버 테스트는 Postgres가 있어야 돌아 서비스로 띄운다. 값은 compose.yaml과 같은 시험용이다
name: test

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "catalog/**"
      - "app/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: cherry
          POSTGRES_PASSWORD: cherry
          POSTGRES_DB: cherry
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cherry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHERRY_TEST_DATABASE_URL: postgresql://cherry:cherry@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: 형식 검사
        run: uv run ruff check cherry_api cherry_core/engine tests/api tests/engine

      - name: 테스트
        run: |
          uv run pytest -q -rs | tee pytest.log
          # DB 주소를 못 받아 서버 테스트를 건너뛰었으면 통과로 보지 않는다
          if grep -q "CHERRY_TEST_DATABASE_URL이 없어" pytest.log; then
            echo "::error::서버 테스트를 건너뛰었다"
            exit 1
          fi

  # 앱 분석기와 위젯 테스트. Flutter 판은 이 PC와 같게 둔다. 작업 006 계획 단계 1의 4
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable

      - name: 패키지
        run: flutter pub get

      - name: 분석기
        run: flutter analyze

      - name: 테스트
        run: flutter test
