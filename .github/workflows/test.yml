# 카탈로그와 파이프라인 시험, 앱 시험. master에 백엔드, 카탈로그, 앱이 바뀐 푸시와 수동 실행에서 돈다. 작업 005, 006
# 서버는 작업 006 단계 7에서 지웠다. 카탈로그 시험이 앱에 담는 JSON이 카탈로그와 같은지도 본다
name: test

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "catalog/**"
      - "app/**"
      - "docs/store/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: 형식 검사
        run: uv run ruff check cherry_core tests tools

      - name: 테스트
        run: uv run pytest -q

  # 앱 분석기와 위젯 테스트. Flutter 판은 이 PC와 같게 둔다. 작업 006 계획 단계 1의 4
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable

      - name: 패키지
        run: flutter pub get

      - name: 분석기
        run: flutter analyze

      - name: 테스트
        run: flutter test
