# 카드사 원문 수집. 작업 003 설계 4절 2번, 작업 008 설계 2절
# 2026-10-04부터 사용자 집 PC의 Windows 자체 호스팅 러너에서 돈다. 신한처럼 GitHub 서버의 접속을 막는 카드사도 집 주소로는 받힌다
# 예약은 없다. 매달 1일과 15일 사용자가 Actions 화면에서 손으로 돌린다. PC가 켜져 있을 때 돌리려는 것이다. 2026-10-04 사용자가 정했다
# 1일에는 주기 30을 골라 모든 카드사의 카드 원문, 상품공시실, 카탈로그 밖 카드의 상품 페이지와 최신 PDF를 받는다
# 15일에는 주기 14를 골라 14일 주기 카드사의 카드 원문만 받는다. 받은 원문은 운영 볼륨 cherry.bronze.raw에 올린다
# 카드사마다 작업 하나로 나눠 한 카드사가 실패해도 나머지는 올라간다. 러너가 하나라 차례로 돈다
# 카드사가 수집 중단을 요청하면 아래 matrix에서 빼고 카드사 파일을 blocked로 둔다. 2026-10-04 사용자가 정했다
# 공개 저장소라 실행 기록은 누구나 본다. 수집기는 원문 내용을 찍지 않고 카드사 id, 개수, 실패 id만 찍는다
name: collect

on:
  workflow_dispatch:
    inputs:
      interval:
        description: 1일에는 30, 15일에는 14. 30이면 모든 카드사와 상품공시실, 14면 14일 주기 카드사만
        type: choice
        options: ["30", "14"]
        default: "30"
      issuer:
        description: 한 카드사만 다시 받을 때 고른다. all이면 모두
        type: choice
        options: [all, hana, hyundai, ibk, kakaobank, kb, lotte, nh, samsung, shinhan, woori, carddamoa]
        default: all

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Git Bash가 dbfs:/ 같은 인자를 Windows 경로로 바꾸지 않게 한다
  MSYS_NO_PATHCONV: "1"
  PYTHONIOENCODING: utf-8

jobs:
  collect:
    name: collect ${{ matrix.issuer }}
    # 집 PC 러너만 받는다. 이름표 cherry-home은 러너를 등록할 때 붙인다. docs/databricks.md "집 PC 러너"
    runs-on: [self-hosted, Windows, cherry-home]
    # 1일에는 카드 1,000장 안팎의 상품 페이지와 PDF를 2초씩 쉬며 받는다. 브라우저 카드사는 페이지마다 15초까지 기다려
    # KB는 두 시간 가까이 걸릴 수 있다
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # 2026-10-05 우리 올리기가 실패해 한 카드사만 다시 받을 수 있게 했다
        issuer: ${{ fromJSON(inputs.issuer == 'all' && '["hana","hyundai","ibk","kakaobank","kb","lotte","nh","samsung","shinhan","woori","carddamoa"]' || format('["{0}"]', inputs.issuer)) }}
    steps:
      # Git for Windows는 PATH에 cmd 폴더만 넣어 bash가 Windows의 WSL bash.exe로 잡힌다. 리눅스가 깔리지 않은 PC에서는
      # bash 단계가 모두 바로 실패한다. 2026-10-05 첫 실행에서 모든 카드사가 setup-cli와 올리기 단계에서 멈췄다
      # 뒤 단계와 setup-cli 안의 bash 단계가 Git Bash를 쓰게 그 폴더를 PATH 앞에 둔다
      # cmd로 쓴다. Windows PC는 PowerShell 스크립트 실행이 기본으로 막혀 있어 두 번째 실행에서 powershell 단계가 실패했다
      - name: Git Bash를 bash로
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
      - uses: databricks/setup-cli@6a2e75f1f954d87503702c408deea63216c0799d # v1.18.0

      # uv run은 환경을 잠금 파일에 맞추므로 모든 줄에 --group docling을 붙인다. 빼면 그 줄이 Docling을 지운다
      - name: 브라우저 설치
        run: uv run --project backend --group docling --with playwright==1.63.0 python -m playwright install chromium

      - name: Docling 준비
        # 설치나 모델 받기가 실패하면 받기 전에 멈춘다. 그대로 받으면 PDF가 모두 운영의 유료 해석으로 넘어간다. 작업 008 9단계
        run: uv run --project backend --group docling --with playwright==1.63.0 python -c "from cherry_core.pipeline.collect import docling_converter; docling_converter(); print('Docling 준비 끝')"

      - name: 원문 받기
        id: collect
        # 수집이 길어져도 받은 파일은 올릴 수 있게 작업 전체보다 짧게 끊는다
        timeout-minutes: 240
        env:
          INTERVAL: ${{ inputs.interval }}
          ISSUER: ${{ matrix.issuer }}
        run: |
          echo "카드사 ${ISSUER}, 주기 ${INTERVAL}일"
          # robots.txt를 묻지 않는 곳. 삼성, IBK, 카카오뱅크, 롯데는 사용자가 정했고 카드다모아는 robots.txt가 없다
          ignore=()
          case "$ISSUER" in samsung|ibk|kakaobank|lotte|carddamoa) ignore=(--ignore-robots "$ISSUER") ;; esac
          # PDF는 Docling으로 해석해 옆에 .md로 둔다. 모델은 앞 단계에서 받아 사용자 폴더에 남는다. 작업 008 9단계
          # 롯데 상품설명서는 글자층이 깨져 Docling 글을 쓰지 못하고 모두 운영에서 해석한다. 2026-10-05 첫 수집에서
          # Docling이 롯데 PDF를 읽다 수집기 프로세스가 기록 없이 죽어 색인 카드 627장 가운데 41개만 받았다. 그래서 롯데는 끈다
          docling=(--docling)
          [ "$ISSUER" = lotte ] && docling=()
          collect() {
            uv run --project backend --group docling --with playwright==1.63.0 python -m cherry_core.pipeline.collect --out raw "${docling[@]}" --issuer "$ISSUER" "${ignore[@]}" "$@"
          }
          status=0
          # 카드다모아는 카드 원문이 없다. 수집 방법이 blocked인 카드사는 받을 카드 원문이 없어 바로 끝난다
          [ "$ISSUER" = carddamoa ] || collect --interval "$INTERVAL" || status=$?
          if [ "$INTERVAL" = 30 ]; then
            # 목록 파일 이름이 초 단위라 앞 실행과 같은 초에 끝나면 겹친다
            sleep 1
            collect --disclosure --index-cards 0 || status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: 받은 원문 올리기
        # 원문 받기가 시간 제한으로 끊겨도 받은 만큼은 올린다
        if: ${{ !cancelled() }}
        # 비밀값은 이 단계에만 넣는다. 다른 단계의 외부 액션 코드가 읽지 못하게 하려는 것이다
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          # 오류 문구에 https:// 없이 찍히는 주소도 가린다
          h=${DATABRICKS_HOST#https://}; echo "::add-mask::${h%/}"
          if [ ! -d raw/manifests ]; then echo "받은 원문이 없다"; exit 0; fi
          dest=dbfs:/Volumes/cherry/bronze/raw
          # 원문을 먼저 올리고 목록 파일은 마지막에 올린다. 목록만 먼저 올라가면 적재 작업이 없는 파일을 찾는다
          for d in raw/*/; do
            name=$(basename "$d")
            [ "$name" = manifests ] && continue
            databricks fs cp -r "${d%/}" "$dest/$name" --overwrite > /dev/null
          done
          # 파일 하나를 올리는 cp는 없는 폴더를 만들지 않는다. 첫 수집에서 manifests/가 없어 실패했다
          databricks fs mkdir "$dest/manifests"
          for f in raw/manifests/*.jsonl; do
            # 받은 것이 없는 목록 파일은 올리지 않는다. 올리면 할 일 없는 적재 작업이 돈다. blocked 카드사의 카드 원문 실행이 그렇다
            [ -s "$f" ] || continue
            # 폴더째 한 단계 더 들어가 올라가지 않았는지 첫 원문의 자리로 목록 파일을 올리기 전에 확인한다
            # 목록 파일이 먼저 들어가면 없는 원문을 가리켜 글 뽑기가 그 원문을 계속 미룬다. 2026-10-02 PC 올리기에서 겪었다
            # 비밀값이 든 단계라 외부 패키지를 부르는 uv 대신 sed로 경로를 읽는다
            p=$(head -1 "$f" | sed -E 's/.*"path": "([^"]*)".*/\1/')
            # ls를 grep -q에 바로 이으면 grep이 찾자마자 파이프를 닫아 ls가 쓰기 오류로 실패한다. 파일이 많은 우리에서
            # 2026-10-05 "The pipe is being closed"로 멈췄다. 목록을 다 받은 뒤 찾는다
            if [ -n "$p" ]; then listing=$(databricks fs ls "$dest/$(dirname "$p")"); grep -qF "$(basename "$p")" <<< "$listing"; fi
            databricks fs cp "$f" "$dest/manifests/$(basename "$f")" --overwrite > /dev/null
            listing=$(databricks fs ls "$dest/manifests"); grep -qF "$(basename "$f")" <<< "$listing"
          done
          echo "올린 파일 $(find raw -type f | wc -l)개"

      - name: 수집 실패가 있었으면 실패로 끝낸다
        if: ${{ !cancelled() && steps.collect.outputs.status != '0' }}
        run: |
          echo "수집기가 일부 주소를 받지 못했거나 시간 안에 끝나지 않았다. 위 원문 받기 단계를 본다"
          exit 1
