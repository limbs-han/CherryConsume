# 운영 대시보드. 작업 007 설계 1절. 정의는 dashboards/ops.lvdash.json
# 표 이름은 스키마 없이 쓰고, 배포할 때 dataset_catalog와 dataset_schema가 대상의 실버 스키마를 채운다
# 열 때만 웨어하우스를 쓴다. 예약 새로고침을 두지 않는다. 조회는 보는 사람의 권한으로 돈다
# 화면에서 고쳤으면 databricks bundle generate dashboard로 정의 파일을 다시 받는다
resources:
  dashboards:
    cherry_ops:
      display_name: 체리컨슘 운영
      file_path: ../dashboards/ops.lvdash.json
      warehouse_id: ${var.review_warehouse_id}
      embed_credentials: false
      dataset_catalog: cherry
      dataset_schema: ${resources.schemas.silver.name}
