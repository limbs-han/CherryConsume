# 비용 차단 작업. 설계 4절 8번과 9번. 코드는 src/cost_guard.py
# 이 작업에는 cherry_guard 태그를 붙이지 않는다. 자기 자신을 멈추면 새 달에 다시 켤 수 없다
# 멈추게 할 작업에는 tags: {cherry_guard: ${bundle.target}}를 붙인다
resources:
  jobs:
    cherry_cost_guard:
      name: cherry_cost_guard
      schedule:
        quartz_cron_expression: "0 0 */6 * * ?"
        timezone_id: Asia/Seoul
        pause_status: UNPAUSED
      timeout_seconds: 600
      max_concurrent_runs: 1
      # 6시간 예약 실행과 배포 뒤 실행이 겹치면 건너뛰지 않고 기다렸다 돈다
      queue:
        enabled: true
      # 실패하면 차단이 걸리지 않은 것이라 바로 알린다. 권한 오류, wheel 설치 실패, 가격 없는 사용량이 여기로 온다
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: guard
          spark_python_task:
            python_file: ../src/cost_guard.py
            parameters: ["--signup", "${var.signup_date}", "--target", "${bundle.target}"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../../backend/dist/*.whl
