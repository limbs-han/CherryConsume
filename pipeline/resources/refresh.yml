# 새 목록 파일이 오면 도는 작업. 작업 003 과제 15, 16, 18
# 순서: 원문 적재, 글 뽑기, 변경 감지, 추출, 비용 차단. cherry_guard 태그가 있어 비용 차단 작업이 한도를 넘기면 멈춘다
# 실행 시간 제한은 설계 4절 8번의 시작값이다. 과제 15와 18에서 잰 시간의 두 배로 고친다
variables:
  list_model:
    description: 카드사 목록에서 카드 이름을 뽑을 모델. 비면 목록은 보지 않는다. 과제 19에서 추출과 같은 모델로 정했다
    default: "system.ai.gpt-oss-120b"
  list_issuers:
    description: 목록을 볼 카드사 id를 쉼표로 잇는다. 설계 1절 3단계. 2026-09-30 사용자가 정했다
    default: "hyundai,hana,kb"

resources:
  jobs:
    cherry_refresh:
      name: cherry_refresh
      tags:
        cherry_guard: ${bundle.target}
      # pause_status를 여기 적으면 개발용에서도 트리거가 켜진다. 운영용에서만 databricks.yml이 켠다
      trigger:
        file_arrival:
          url: /Volumes/cherry/${resources.schemas.bronze.name}/raw/manifests/
          min_time_between_triggers_seconds: 3600
          wait_after_last_change_seconds: 300
      max_concurrent_runs: 1
      # 단계 하나라도 실패하면 알린다. 원문이 없거나 권한이 없거나 모델 호출이 실패한 경우다
      email_notifications:
        on_failure: ["${var.alert_email}"]
      tasks:
        - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.cherry_ingest.id}
          timeout_seconds: 1800
        - task_key: documents
          depends_on:
            - task_key: ingest
          spark_python_task:
            python_file: ../src/documents.py
            parameters: ["--bronze", "${resources.schemas.bronze.name}", "--silver", "${resources.schemas.silver.name}"]
          environment_key: default
          timeout_seconds: 1800
        - task_key: changes
          depends_on:
            - task_key: documents
          spark_python_task:
            python_file: ../src/changes.py
            parameters:
              - "--silver"
              - "${resources.schemas.silver.name}"
              - "--gold"
              - "${resources.schemas.gold.name}"
              - "--model"
              - "${var.list_model}"
              - "--list-issuers"
              - "${var.list_issuers}"
          environment_key: default
          timeout_seconds: 600
        - task_key: extract
          depends_on:
            - task_key: changes
          # 2026-10-01 과제 18. extract_model이 비면 추출하지 않고 끝난다. 개발용은 비어 있다
          # 다시 돌면 모델 요금이 두 번 나와 자동 재시도를 끈다
          disable_auto_optimization: true
          spark_python_task:
            python_file: ../src/extract.py
            parameters:
              - "--silver"
              - "${resources.schemas.silver.name}"
              - "--gold"
              - "${resources.schemas.gold.name}"
              - "--model"
              - "${var.extract_model}"
              - "--mode"
              - "changes"
          environment_key: default
          timeout_seconds: 3600
        - task_key: guard
          depends_on:
            - task_key: extract
          # 앞 단계가 실패해도 비용 차단 확인은 건너뛰지 않는다
          # 늘 마지막 단계로 둔다. 자기 실행은 취소하지 않아서, 이 단계와 함께 도는 단계가 있으면 한도를 넘어도 끝까지 돈다
          run_if: ALL_DONE
          # 서버리스는 실패한 단계를 저절로 다시 돌린다. 새로 멈춘 실행은 알림을 보내려고 실패로 끝나는데,
          # 다시 돈 시도가 이미 멈춘 것을 보고 성공으로 끝나 알림이 오지 않았다. 2026-10-01 운영 시험
          disable_auto_optimization: true
          spark_python_task:
            python_file: ../src/cost_guard.py
            # {{job.run_id}}는 실행할 때 Databricks가 이 실행의 번호로 바꾼다
            parameters: ["--signup", "${var.signup_date}", "--target", "${bundle.target}", "--run-id", "{{job.run_id}}"]
          environment_key: default
          timeout_seconds: 600
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../../backend/dist/*.whl
