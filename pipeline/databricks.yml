# 체리컨슘 Databricks 번들. 설계는 docs/work/003-databricks-pipeline/design.md 4절 10번
# 작업 공간 주소는 여기 적지 않는다. PC에서는 CLI 프로필, GitHub Actions에서는 비밀값 DATABRICKS_HOST를 쓴다
bundle:
  name: cherry
  engine: direct

include:
  - resources/*.yml

variables:
  signup_date:
    description: 체험 가입일. 비용 차단 금액의 기준이다. 청구 기록과 같게 UTC 날짜로 적는다. 비밀값이 아니다
    default: "2026-09-30"
  alert_email:
    description: 작업이 실패하면 알림을 받을 메일. 공개 저장소에 적지 않으려고 기본값을 두지 않는다

artifacts:
  cherry_core:
    type: whl
    path: ../backend
    build: uv build --wheel
    # 판 번호가 그대로면 서버리스 환경이 예전 wheel을 다시 쓸 수 있어 배포마다 판 번호를 바꾼다
    # 공식 문서에 칸 이름만 있고 뜻 설명은 없다. 첫 운영 배포에서 새 wheel이 깔리는지 본다
    dynamic_version: true

targets:
  dev:
    mode: development
    default: true
    variables:
      alert_email: ${workspace.current_user.userName}
  prod:
    # 운영 배포는 GitHub Actions가 서비스 주체로만 한다. alert_email은 비밀값 ALERT_EMAIL에서 받는다
    # workspace.root_path를 적지 않는다. 적지 않으면 사람 계정으로 운영 배포할 때 오류로 멈춘다
    mode: production
    variables:
      # 2026-10-02 과제 19 3단계에서 사용자가 골랐다. 설계 4절 3번
      extract_model: system.ai.gpt-oss-120b
    resources:
      jobs:
        cherry_cost_guard:
          schedule:
            pause_status: UNPAUSED
        cherry_refresh:
          trigger:
            pause_status: UNPAUSED
