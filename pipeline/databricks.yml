# 체리컨슘 Databricks 번들. 설계는 docs/work/003-databricks-pipeline/design.md 4절 10번
# 작업 공간 주소는 여기 적지 않는다. PC에서는 CLI 프로필, GitHub Actions에서는 비밀값 DATABRICKS_HOST를 쓴다
bundle:
  name: cherry
  engine: direct

include:
  - resources/*.yml

variables:
  signup_date:
    description: 체험 가입일. 비용 차단 금액의 기준이다. 비밀값이 아니다
    default: "2026-09-30"

artifacts:
  cherry_core:
    type: whl
    path: ../backend
    build: uv build --wheel

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
