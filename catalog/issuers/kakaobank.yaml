schema_version: 2
id: kakaobank
name: 카카오뱅크
short_name: 카카오
collect: {list_url: 'https://www.kakaobank.com/Help/Documents/ProductDeclaration/Products', method: browser, interval_days: 30, notice_url: 'https://www.kakaobank.com/Corp/News/Notices', disclosure_url: 'https://www.kakaobank.com/api/v1/docs/app/productGroupList'}
defaults:
  - effective_from: 2021-06-01
    effective_from_estimated: true
    spend: {basis: prev_calendar_month, installment: full_at_purchase, cancellation: cancel_month}
open_questions:
  - {path: 'defaults[0].spend.installment', question: 체크카드 개인회원 약관 제10조 ①이 국내 가맹점에서 일시불에 한하여 이용한다고 써 할부가 생기지 않는다. 할부를 실적에 넣는 방식 문구는 없다, assumed: full_at_purchase}
  - {path: 'defaults[0].spend.cancellation', question: 원문은 취소한 달이 아니라 취소 매출표 접수월의 이용 실적에서 뺀다고 쓴다. 월말에 취소해 매출표가 다음 달에 접수되면 달이 다를 수 있다, assumed: cancel_month}
notes: '상품공시 목록과 공지사항은 자바스크립트로 그림. 목록은 내부 JSON /api/v1/docs/app/productGroupList, 공지는 /api/v1/boards/NOTICE/posts, 상품/약관 변경공시는 /api/v1/boards/PROD_HISTORY/posts에서 받을 수 있음. 행사 혜택 페이지 kakaobankcontent.com은 브라우저로만 읽힘. 행사가 해마다 2월 1일에 바뀌니 1월 중순에 다시 봄. 2026-09-30 수집 시험: www.kakaobank.com의 robots.txt가 이름 붙은 검색 봇 말고는 모두 막아 상품 목록, 공지, 상품 페이지는 받지 않는다. 위 내부 JSON 주소도 같은 사이트라 막힌다. 상품설명서 og.kakaobank.io와 행사 페이지 kakaobankcontent.com은 받고 3천~4천 자가 나온다. 상품 페이지는 사람이 받아 --add로 더한다. 2026-10-03 작업 008 색인: 공시 그룹 목록에서 chnl_prgr_cd 03이 카드 5그룹이고, 그룹별 docs/app/<번호>?hmpg_yn=Y 에 상품설명서 PDF, HTML, TXT 파일 id와 적용일이 있다. 파일은 og.kakaobank.io/view/<id>. 수집 방법 전환은 작업 008 7단계에서. 2026-10-05 defaults 확인. 카카오뱅크가 직접 내는 카드는 체크카드와 mini 잔액으로 쓰는 mini 카드다. 카카오뱅크 삼성카드와 카카오뱅크 개인사업자 삼성카드는 삼성카드가 내는 제휴 신용카드라 이 파일의 규칙이 아니다. 시작일 2021-06-01은 카카오뱅크 체크카드 개인회원 약관의 시행일이다. og.kakaobank.io/download/ 의 b4be845e-e923-4ad6-93f8-48532d6b16e8, a45722ee-4a3b-4355-8f28-9b14ea19cbcc, 9fd9cdf5-2e91-43f6-aede-263e40c67a65, 83c0da25-ef53-4d50-a52d-8d161b196c98 판의 마지막 부칙이 "이 약관은 2021년 6월 1일부터 시행한다"이다. e0002107-fb20-45de-a217-0a06063a7085, 9172b2ac-3f67-4082-bc49-8db9135ecd62 판은 부칙이 없다. 공시 목록이 robots.txt로 막혀 이보다 새 판이 있는지는 보지 못했다. 이 약관에는 실적 산정 규칙이 없고 "전월실적을 모바일앱을 통해 안내합니다"만 있어 시작일로만 썼다. basis와 cancellation은 개인사업자 체크카드 상품 안내장 https://og.kakaobank.io/download/8ccb16fb-9e06-47f6-aad0-cc4981b7105e 심의필 25-1335의 "전월 1일부터 전월 말일까지의 이용실적", "결제 취소금액은 취소매출전표 접수월의 이용실적에서 차감됩니다"에서 옮겼다. 프렌즈 체크카드 파일의 실적 규칙과 같다. 모임 체크카드 안내장 24-2140, mini 카드 안내장 25-2332, 프렌즈 체크카드 안내장 23-0177, 24-1904, 25-2440에는 실적 산정 문구가 없다. installment는 넣지 않았다. 약관 제10조 ①이 국내 이용을 "일시불에 한하여 출금가능 범위 내에서" 된다고만 적고 할부 실적 반영 문구는 없다. 2026-10-05 근거 대조와 위험 검토 뒤 고쳤다. basis와 cancellation의 근거는 개인 체크카드 혜택 페이지 https://event.kakaobank.com/p/card_benefit?i=season8 (심의필 21-051, 2021.2.1~7.31)와 season9~12의 "전월 1일부터 전월 말일까지", "결제 취소 금액은 취소 매출표 접수월의 이용 실적에서 차감"이다. 개인사업자 체크카드 안내장 25-1335는 사업자 상품이라 보조 근거로만 둔다. 시작일 2021-06-01은 실적 규칙이 없는 약관의 시행일이라 추정이다. installment는 체크카드에 할부가 없어 계산에 쓰이지 않지만, 빠지면 기본값 묶음이 통째로 버려져 full_at_purchase로 둔다. 카카오뱅크 이름이 붙은 신용카드는 삼성, 롯데, 현대, 신한, 씨티 같은 다른 카드사가 내는 제휴 카드라 이 파일 규칙에서 뺀다.'
