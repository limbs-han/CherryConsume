schema_version: 2
id: hyundai
name: 현대카드
collect: {list_url: 'https://www.hyundaicard.com/cpc/ma/CPCMA0101_01.hc', method: browser, interval_days: 30, notice_url: 'https://www.hyundaicard.com/cpu/ug/CPUUG3001_01.hc'}
defaults:
  - effective_from: 2022-11-01
    spend: {basis: prev_calendar_month, interest_free: count, installment: full_at_purchase, exclude_applied: 0}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_express, utility]
      unmodeled: [고속도로 통행 요금과 후불하이패스 카드 이용 금액은 혜택에서 뺀다, 현대카드의 다른 할인 서비스가 적용된 결제는 혜택에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 혜택 계산에서 뺀다]
notes: '2026-09-29 확인. defaults 시작일 2022-11-01은 현대카드 개인회원 약관 시행일(공지 2022-11-01). 현대카드 카드 중 가장 이른 첫 개정은 ZERO Edition3(할인형) 2024-01-05이고 그날 이 약관이 시행 중이었다. 그 뒤 약관 시행일 2024-10-17, 2026-05-12는 실적 규칙 기본값을 바꾸지 않아 항목을 더하지 않았다. 혜택 제외는 현대카드M의 적립 제외와 ZERO Edition3(할인형)의 할인 제외 목록이 같아 여기 두고, the Green Edition4는 부동산 임대료를 더해 카드 파일에서 덮어쓴다. 공과금(국세, 관세, 지방세, 지방세외수입, 상하수도, 벌과금, 과태료 등)과 전기·도시가스 요금이 모두 혜택 제외라 tax와 utility 전체를 뺀다. 카드론, 현금서비스, 제수수료, 이자, 자동납부서비스 이용 수수료는 결제 기록이 아니라 다루지 않는다. robots.txt는 카드 목록(/cpc/ma/CPCMA0101_01.hc)과 카드 상세(/cpc/cr/*)를 연다. 카드 목록과 상세 첫 화면은 HTML로 바로 읽히지만 혜택 상세와 실적·제외 기준은 화면을 연 뒤 레이어로 채워져 브라우저가 필요하다. 뉴스·공지 목록은 /cpu/ug/apiCPUUG3001_0101.hc POST(pageNum, pageSize, ctgrCd 01 공지사항, 02 상품·서비스 변경안내)이고 본문은 /cms_content/cp_notice/<id>_notice_1.html이다. 상품 코드는 카드 상세 주소의 cardWcd. 2026-09-30 수집 시험: 상품 목록은 유튜브 동영상을 넣어 요청이 끊이지 않아 networkidle을 기다리다 60초 시간 초과가 났다. 수집기가 load 뒤 15초만 기다리게 고친 뒤 1.8만 자가 나온다. 상품 페이지 3장은 1.7만~2.3만 자, 공지는 5천 자다.'
