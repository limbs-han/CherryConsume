notes: 'defaults 시작일은 공통 약관 시행일을 찾지 못해 우리 카드 중 첫 개정이 가장 이른 EVERY POINT 출시일로 두고 추정 표시. 수집: 상품 목록과 공지는 자바스크립트로 그린다. 목록 주소는 신용카드 목록이고 체크카드는 hiPrdCtgrCd=M110019다. 서비스 변경 게시판은 POST /dcpc/yh1/cmn/bbs/searchBbsList.pwkjson에 scBbsCode 1010으로 본문까지 받는다. 2026-09-29 기준 317건을 끝까지 봤다. 2026-10-03 작업 008 색인: 상품공시실 약관 탭이 색인이다. 발급 중단 여부와 발급 중단일이 있다. 표를 채우는 getMainDataList.pwkjson은 요청을 암호화해 브라우저로만 받는다. 상품설명서는 다운로드 솔루션 팝업이라 직접 주소가 없다.'
