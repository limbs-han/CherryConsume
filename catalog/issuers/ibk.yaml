schema_version: 2
id: ibk
name: IBK기업은행
short_name: IBK
collect: {list_url: 'https://www.ibk.co.kr/cardbiz/listBizNew.ibk?pageId=CA01010000', method: api, interval_days: 30, notice_url: 'https://www.ibk.co.kr/cyber/newibkListCyber.ibk?pageId=IR03010300&category=4', disclosure_url: 'https://www.ibk.co.kr/cardbiz/listBizNew.ibk?pageId=CA01010000'}
defaults:
  - effective_from: 2025-03-06
    effective_from_estimated: true
    spend: {basis: prev_calendar_month, installment: full_at_purchase, cancellation: cancel_month}
open_questions:
  - {path: 'defaults[0].spend.installment', question: '할부를 승인한 달에 전액 넣는다는 문구는 코웨이 IBK 카드 하나에만 있다. I-PET, IBK포인트 신용과 체크, The Value, The Highness, 해피메이트 6장은 국내 이용금액은 승인시점 기준이라고만 쓰고, 그린카드 v2, 다이소 신용과 체크, 웰릭스는 전월 실적을 일시불/할부 이용금액이라고만 쓴다. 할부를 회차마다 넣는다는 문구는 판매 중 77장 어디에도 없다', assumed: full_at_purchase}
  - {path: 'defaults[0].spend.cancellation', question: 원문은 취소한 달이 아니라 취소매출표 접수월 이용금액에서 뺀다고 쓴다. 월말에 취소해 취소매출표가 다음 달에 접수되면 달이 다를 수 있다, assumed: cancel_month}
notes: '2026-09-29 확인. robots.txt가 도박 상담 페이지 하나만 허용하고 사이트 전체를 막아 blocked로 둔다. 전체카드 목록은 HTML에 나오지만 상세 페이지 이동은 자바스크립트다. notice_url은 상품소식 게시판이고 notice_url GET 주소에 &pageNum=N을 붙이면 모든 쪽이 읽힌다. 2026-09-29 상품소식은 6쪽 57건. 2026-10-03 작업 008 색인: 전체 목록은 자바스크립트 없이 읽히고 쪽 넘김은 POST pageNum, CardSaleYn A 전체 1 판매중. 상세는 detailBizNew.ibk에 PDLN_CD, PDGR_CD, PDTM_CD, PDCD를 GET으로 넘기면 열리고 개인설명서 PDF 직접 주소가 있다. 135장. 수집 방법 전환은 작업 008 7단계에서. 2026-10-04 작업 008 7단계: 사용자가 robots.txt를 묻지 않고 받기로 해 method를 api로 바꿨다. collect 워크플로가 --ignore-robots로 받는다. 수집기 이름을 밝히고 2초씩 쉬고 403과 429에 멈춘다. 2026-10-05 확인 defaults 근거: 판매 중 개인 신용과 체크 카드 77장의 상세 페이지와 설명서·리플릿 PDF 149개를 읽었다. 신용카드 개인회원 표준약관(제16차 2026-05-12 시행)과 체크카드 개인회원 약관(제3차 2021-06-01 시행)에는 실적 산정 문구가 없고 표준약관 제15조의2는 전월실적 인정기준을 홈페이지와 앱으로 안내한다고만 쓴다. 할부: 코웨이 IBK 카드 상세 페이지(detailBizNew.ibk?PDLN_CD=12&PDGR_CD=11&PDTM_CD=321&PDCD=0001)와 설명서(https://www.ibk.co.kr/fup/customer/form/202503071439184717675674101966.pdf, 상품 요약 심의필 제2025-1591호 2025.03.06)에 이용실적 산정 시 할부금액은 승인 월 기준으로 1회 인정. I-PET(PDTM_CD=342), IBK포인트 신용(347-0001)과 체크(347-0002), The Value(348-0005), The Highness(348-0006), 해피메이트(356-0001)에 전월 이용금액 산정 시 국내 이용금액은 승인시점 기준, 해외 이용금액은 매출표 접수일 기준. 취소: 신용 29장과 체크 37장, 모두 66장에 승인취소 금액은 취소매출표 접수월 이용금액에서 차감 또는 같은 뜻의 문구. 기간: 실적 조건을 적은 64장 모두 전월 1일부터 말일까지이고 결제일 기준 실적은 없다. 신용과 체크의 차이는 찾지 못했다. 시작일 2025-03-06은 할부 문구가 있는 코웨이 설명서의 심의필 날짜이고 카드사 공통 시행일을 찾지 못해 추정으로 둔다. 무이자할부는 카드마다 달라 기본값에 넣지 않았다. IBK포인트는 실적에서 빼고 나라사랑은 넣는다. 해외 이용금액을 매출표 접수일 달에 넣는 규칙은 담을 칸이 없다. 2026-10-05 근거 대조 뒤 더했다. I-어디로든 그린카드(PDTM_CD=343)는 후불교통 이용금액도 매출표 접수일 기준으로 이용금액에 넣는다. 이 규칙도 담을 칸이 없다.'
