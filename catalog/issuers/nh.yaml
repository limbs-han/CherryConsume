schema_version: 2
id: nh
name: NH농협카드
short_name: 농협
collect: {list_url: 'https://card.nonghyup.com/servlet/IpCc1210I.act', method: api, interval_days: 30, notice_url: 'https://card.nonghyup.com/servlet/IpCi9010I.act?pageNum=1&pageSize=50'}
defaults:
  - effective_from: 2018-01-15
    effective_from_estimated: true
    spend: {basis: prev_calendar_month, installment: full_at_purchase, cancellation: cancel_month}
open_questions:
  - {path: 'defaults[0].spend.installment', question: '할부를 승인월에 승인금액 기준으로 넣는다고 쓴 카드는 콕카드와 콕체크카드 둘이다. 19장은 일시불/할부(전액) 이용금액, 나머지는 일시불/할부 합산이라고만 쓴다', assumed: full_at_purchase}
  - {path: 'defaults[0].spend.cancellation', question: 원문은 취소한 달이 아니라 취소 매출표 접수월 이용실적에서 뺀다고 쓴다. 월말에 취소해 매출표가 다음 달에 접수되면 달이 다를 수 있다, assumed: cancel_month}
notes: '카드 상세는 서버가 그린 HTML이라 바로 읽히지만 브라우저로 열면 몇 초 뒤 보안프로그램 설치 화면으로 넘어감. 카드 목록은 자바스크립트로 불러옴. 새소식 목록은 IpCi9010I.act?pageNum=N&pageSize=50, 상세는 IpCi9011R.act?bbrd_sqno=<번호>를 GET으로 열면 읽힘. 2026-09-29 확인. 상품 코드는 카드 상세 주소의 CD_WRS_SQNO. 2026-09-30 수집 시험: 브라우저로 열면 네 주소 모두 보안프로그램 설치 화면만 받아 method를 api로 바꿨다. 바로 받으면 카드 상세 1.1만 자가 나온다. 새소식은 pageNum과 pageSize를 붙여야 글 목록이 나와 notice_url에 붙였다. 카드 목록은 자바스크립트로 불러와 메뉴 글만 나온다. 2026-10-03 작업 008 색인: 공시실에 카드 목록을 못 찾아 색인은 IpCc1210I.jct 목록 API로 만든다. POST pageNum, cardGubun 빈 값 전체 IPCC0105 신용 IPCC0106 체크, 한 쪽 20장 168장. sel_yn 0이 발급종료. 상품설명서 PDF와 단종일은 없고 출시일은 상세 본문 글에서. 2026-10-05 defaults 근거: 판매 중 카드 상세(https://card.nonghyup.com/servlet/IpCc2021R.act?CD_WRS_SQNO=<코드>) 111장(신용 80, 체크 31)을 받아 봤고 실적 규칙을 다르게 적은 카드는 없다. 신용과 체크 문구가 같다. 할부: 콕카드(90000377)와 콕체크카드(90000378) "할부구매시에는 분할 청구 금액과 무관하게 승인금액 기준으로 승인월에 실적으로 반영", 올바른하나로 카드(90010012)와 체크카드(90010011) 등 19장 "일시불/할부(전액) 이용금액". 취소: 105장 "매출취소 발생시 취소 매출표 접수월 이용실적에서 차감". 취소 매출표가 늦게 접수되면 취소한 달보다 뒤 달에서 빠질 수 있다. 기준: 103장 "전월(1일~말일)", 그중 다수는 "전월(승인일 기준 1일~말일) 국내외 일시불/할부 합산 이용금액". 결제일 기준 실적 문구는 없다. 시작일 2018-01-15는 할부 문구를 분명히 적은 가장 이른 카드인 콕카드·콕체크카드의 신규출시일이다. 지금 페이지는 심의필 제2026-C1a-10170호(2026.07.06) 판이라 출시 때도 같은 문구였는지 확인하지 못해 추정으로 둔다. 2013~2017년 출시 카드도 취소와 1일~말일 문구는 같지만 할부는 "일시불/할부 합산"으로만 적었다. 무이자할부를 실적에 넣는다는 문구는 한 장뿐이라 기본값에 넣지 않았다. 2026-10-05 근거 대조 뒤 더했다. 일부 카드는 해외 이용금액과 무승인 결제인 교통카드 이용금액, 통신료 자동이체금액을 매출표 접수일 기준으로 합산한다. 모두의카드 신용 90010471과 체크 90010470, NH올원 Rental&넥센타이어 90000364, 올바른GIVE+ 안내장 F10001.pdf, 폼체크카드 안내장 F20573.pdf다. 콕카드와 올바른하나로는 해외 이용만 그렇다. 이 규칙은 담을 칸이 없다.'
