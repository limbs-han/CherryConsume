schema_version: 2
id: shinhan
name: 신한카드
collect: {list_url: 'https://www.shinhancard.com/pconts/html/card/credit/CONFM70002/CONFM70002R01.html', method: api, interval_days: 14, notice_url: 'https://www.shinhancard.com/mob/MOBFM164N/MOBFM164R01.shc'}
defaults:
  - effective_from: 2024-03-22
    spend:
      basis: prev_calendar_month
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      month_offset: {transit.bus_city: 1, transit.subway: 1}
      exclude_applied: 0
    new_card: {until: next_month_end, from: registration}
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
open_questions:
  - {path: 'defaults[0].spend.cancellation', question: 취소 금액을 원래 결제 달과 취소한 달 중 어느 달 실적에서 빼는지 세 카드 상품 페이지에 없다, assumed: cancel_month}
  - {path: 'defaults[0].benefit_exclusions.when_any[0].payment', question: '가맹점명이 간편결제명으로 찍히는 페이가 어느 것인지 공식 문구에는 네이버페이, 카카오페이 예시만 있다. 쿠페이, 스마일페이, SSGPAY, L.PAY는 가맹점이 그 몰로 찍힌다고 보고 뺐다. 원문 조건은 결제수단이 아니라 명세서에 찍힌 가맹점명이다. 오프라인 간편결제도 가맹점명이 간편결제명으로 찍히는지 문구가 없어 결제수단으로 가린다', assumed: 'naver_pay, kakao_pay, toss_pay, payco'}
notes: '수집: 신용카드 목록 페이지(CONFM70002)는 상품 API https://shapi.shinhancard.com/card-apply/search/v1.0/searchPagingFixedCardProductList?listID=202001020012 로 목록을 그린다. 카드 상세는 https://shapi.shinhancard.com/card-apply/search/v1.0/getCardProductsInformation?entryId=<entryId>. 2026-09-29 기준 이 목록에 신한카드 처음(202404150001)은 없고 처음(ANNIVERSE)만 있어 처음은 상세 API로 따로 받아야 한다. 체크카드 목록은 /pconts/html/card/check/CONFM70015/CONFM70015R01.html. 부가서비스 변경 공지는 공지사항의 상품·서비스 변경 안내 탭이고 2020년 1월 글부터 남아 있다. defaults 시작일 근거: 신용카드 개인회원 부속약관 제정 안내(2024.01.30 게시, 시행 2024-03-22, https://www.shinhancard.com/pconts/html/helpdesk/dataRoom/MOBFM164N/1225852_1119.html). 이 공지에는 부속약관을 만든다는 사실과 시행일만 있고 실적 산정이나 적용 제외 같은 규칙 내용은 없어 시작일로만 썼다. 규칙 내용은 처음, Mr.Life, Point Plan 상품 페이지의 전월 이용금액 산정기준에서 옮겼다. 교통카드 이용금액은 전전월 이용금액이 전월 이용금액에 반영된다. 후불교통으로 타는 시내버스와 지하철만 한 달 늦게 넣고 철도 표는 넣지 않는다. 신규 발급 회원은 카드 사용 등록월의 다음 달 말까지 카드마다 정한 구간을 적용한다. 구간은 카드 파일에 적는다. 간편결제로 결제해 가맹점명이 간편결제명(네이버페이, 카카오페이 등)이면 서비스 제외. 무이자할부(부분 무이자 포함) 거래는 적립 제외. 이 두 제외는 처음과 Point Plan 상품 페이지 문구이고 Mr.Life는 카드 파일에서 덮는다. 2026-09-30 수집 시험: 상품 페이지와 상세 API는 3천~1.4만 자가 나온다. 상품 목록 131자와 공지 200자는 빈 틀이다. 목록 API는 pageSize를 키워도 한 쪽에 8장까지만 주고 전체 63장이라 주소 하나로는 다 받지 못한다. 상세 API의 responseTime은 받을 때마다 바뀌어 글 뽑기에서 뺀다. 2026-10-01 GitHub Actions 첫 수집에서 열 주소가 모두 RemoteDisconnected였고 같은 날 PC에서는 모두 받았다. GitHub 서버의 접속만 막는 것으로 보고 수집 워크플로에서 빼고 사용자가 PC에서 받는다. 2026-10-03 작업 008 색인: 공시실에 카드 목록이 없어 색인은 shapi 고정 목록 API로 만든다. 신용 listID 202001020012 63장, 체크 202001020001 97장, pageSize=8, index를 totalPage까지. 출시일 cardPdStartDate가 있고 상품설명서 PDF와 단종일은 없다.'
