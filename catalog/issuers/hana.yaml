notes: 'defaults 시작일은 공통 약관 시행일을 찾지 못해 하나 카드 중 첫 개정이 가장 이른 트래블로그 체크카드 출시일로 두고 추정 표시. 수집: 상품 목록과 공지는 자바스크립트로 그린다. 목록 주소는 신용카드 목록이고 체크카드는 CT_ID=241704050328506이다. 공지는 주요공지(OPP35150000D)가 서비스변경안내(OPP25350000D) 글도 함께 싣는다. 목록은 같은 주소에 page, displayCount를 POST로 보내 받는다. 2026-09-30 수집 시험: 브라우저가 돌려준 UTF-8 글을 meta의 euc-kr로 읽어 글이 깨졌다. 수집기가 브라우저 글에 charset=utf-8을 적게 고친 뒤 상품 페이지 1.2만~1.4만 자, 목록과 공지 6천~7천 자가 나온다. 공지 본문은 조회수 줄이 받을 때마다 바뀐다. 2026-10-03 작업 008 색인: 공시실에 카드 목록이 없어 색인은 홈페이지 카드 한눈에 보기 OPI22000000D.ajax로 만든다. targetMethod=searchList, CARD_TYPE R 신용 H 체크, PAGE. curl로는 FRS00015 오류라 브라우저로 받는다. 상세 OPI41000000D.web?CD_PD_SEQ=에 설명서 PDF m.hanacard.co.kr/leaflet/ 직접 주소와 그림이 있다. 판매 상태와 단종일은 없다.'
