    unmodeled: ['안경점 5% 할인과 스마트적립 건강 영역의 안경점, 피부미용원은 공통 업종이 없어 계산하지 않는다', 카카오T대리 자동결제 5% 할인은 택시와 구별할 수 없어 계산하지 않는다, '해외 이용금액, 교통카드 이용금액, 통신료 자동이체금액은 매출표 접수일 기준으로 실적에 넣는다. 월말 이용이 다음 달 실적이 될 수 있다', 스마트적립 추가적립은 이용월 다음 달 15일 이후 한 번에 적립된다. 영역 순위는 달이 끝나야 정해져 달 중간 값은 잠정값이다, 서비스팩 변경은 신청 다음 달 1일부터 적용된다, 국제브랜드 프리미엄 선택 서비스는 결제 혜택이 아니라 계산하지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시작일을 확인하지 못해 카드 신규출시일 2026-01-28로 두었다, assumed: '2026-01-28'}
  - {path: 'revisions[0].benefits[d-rail-taxi-5].target', question: KTX 대상에 코레일 가맹점 전체를 넣었다. KTX가 아닌 일반열차 결제가 빠지는지 문구가 없다, assumed: 코레일 전체}
  - {path: 'revisions[0].benefits[smart-airline-first].target', question: 국내 항공사 중 공통 가맹점에 있는 4곳만 넣었다. 다른 국내 항공사는 계산하지 않는다, assumed: '대한항공, 아시아나, 진에어, 제주항공'}
  - {path: 'revisions[0].limits', question: 스마트적립 월 1만 포인트를 1위와 2위가 함께 쓰는지 문구가 없다, assumed: 함께 쓴다}
  - {path: 'revisions[0].benefits[d-fuel-5].target', question: LPG 충전소와 전기차 충전소가 공통 업종 fuel에 드는지 확인하지 못했다, assumed: fuel 업종 결제만}
notes: 2026-10-10 상품 페이지(여신금융협회 심의필 제2026-C1a-10033호, 2026.07.02)를 대조했다. 신규출시 2026-01-28. 할인 PACK과 적립 PACK 중 하나를 고르고 변경은 다음 달 1일부터다. 할인 PACK은 4개 영역 월 한도가 따로다. 적립 PACK 스마트적립은 5개 영역 중 당월 이용금액 1위 +3%, 2위 +2%이고 같은 금액이면 영역 번호 순이라 혜택 순서를 영역 번호 순으로 두었다. 초안의 영역별 고정 할인 8천원과 1만5천원은 한도를 혜택으로 잘못 옮긴 것이라 지웠다.
