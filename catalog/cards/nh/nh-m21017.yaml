notes: 2026-10-10 상품 페이지(준법감시인 심의필 2026-3845)를 대조했다. 마스터카드 연회비 0원. 신규 특례는 사용등록 후 다음 달 말일까지 20만~50만원 구간이다. 초안이 10대 업종을 넓은 업종으로 잡은 것을 원문 가맹점으로 좁혔고 해외 2%에 지역 조건을 더했다. 라운지와 ATM 수수료 면제는 뺐다.
