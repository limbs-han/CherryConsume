notes: >-
  맡은 이름 zgm.히어로는 NH농협카드 공식 사이트와 검색에서 찾지 못함. 이름이 비슷한 NH대한민국히어로카드는 소방공무원 전용이라 제외하고,
  zgm 계열 대표 할인형인 이 카드로 작성. 2024년 4월 23일 출시, 심의필 2026년 7월 2일로 발급 중.
  연회비는 실물카드 국내전용 2만7천원, 국내외겸용(VISA, Mastercard) 3만원. 모바일카드는 2만1천원, 2만4천원.
  실적은 전월 1일~말일 승인일 기준 국내외 일시불·할부 합산. 해외 이용과 통신료 자동이체 같은 무승인 결제는 매출표 접수일 기준.
  실적 제외 중 업종 코드가 없는 것: 대학(대학원) 등록금, 교육비(학부모부담금), 임대료, 사회보험(국민건강·국민연금·고용·산재),
  가상화폐 거래소, 현금서비스, 카드론, 수수료·이자, 연체료, 거래 취소금액, 포인트 결제 사용분. 후불교통(버스·지하철)과 택시는 실적 제외.
  할인 제외: 실적 제외 항목과 같고 무이자할부 이용금액도 할인 제외. 백화점·할인점·쇼핑몰 임대매장 할인 제외.
  기본할인과 생활할인은 중복되지 않고 둘 중 큰 쪽만 제공. 생활할인 한도를 다 쓰면 기본할인 제공. NH카드 다른 청구할인 프로모션과도 중복 안 됨.
  기본할인은 최초 카드사용등록일부터 다음 달 말일까지 실적 무관 제공. 생활할인은 카드 등록 월에는 없음.
  모델에 못 담은 것: 기본할인 일 1만원 한도, 생활할인 월 통합한도 2만원.
  결제 한 건의 혜택이 아닌 것: 국내외 공항라운지 연 2회(전월 40만원 이상), VISA·Mastercard Platinum 브랜드 서비스.
