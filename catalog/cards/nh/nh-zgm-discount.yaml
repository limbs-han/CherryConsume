    unmodeled: ['실적과 할인에서 과태료·범칙금, 우체국 우편요금, 가상화폐 거래소, 현금서비스·카드론, 수수료·이자, 연체료, 포인트 결제분을 뺌', 해외 이용과 통신료 자동이체 같은 무승인 결제는 매출표 접수일 기준으로 실적에 넣음. 월말 이용이 다음 달 실적이 될 수 있음]
open_questions:
  - {path: 'revisions[0].benefit_exclusions.categories', question: 할인 제외의 각종 세금 및 공과금에 아파트관리비와 전기요금과 도시가스가 들어가는지. 실적 제외에는 따로 적혀 있고 할인 제외 목록에는 없어 기본할인 대상으로 둠, assumed: 관리비·전기·가스는 할인 제외 아님}
  - {path: 'revisions[0].stacks[main].spill', question: 생활할인 한도가 결제 한 건 도중에 끝나면 남은 금액에 기본할인을 주는지, assumed: none}
notes: '첫 개정 시행일 근거: page. 2024년 4월 23일 출시. 부가서비스는 출시 뒤 3년 이상 줄이지 않는다고 적혀 있음. 새소식 514건을 2024년 4월부터 끝까지 봤고 이 카드의 부가서비스 변경 공지는 없음. 맡은 이름 zgm.히어로는 공식 사이트에서 찾지 못해 zgm 계열 할인형인 이 카드로 작성. 실적은 전월 승인일 기준 국내외 일시불·할부 합산이고 취소는 취소 매출표 접수월에서 뺌. 기본할인은 국내 1%, NH페이 국내 온라인 2%, 해외 2%이고 일 1만원, 월 4만원 한도. 기본할인은 최초 카드사용등록일부터 다음 달 말일까지 실적 없이 제공. 생활할인은 7개 영역이고 영역당 월 5천원, 통합 월 2만원, 카드 등록 달에는 없음. 기본할인과 생활할인은 겹치지 않고 큰 쪽만 받으며 생활할인 한도를 다 쓰면 기본할인을 받음. 무이자할부는 할인 제외. 가족카드는 실적과 한도를 본인 카드와 합산하지 않음. 결제 한 건의 혜택이 아닌 것은 국내외 공항라운지 월 1회·연 2회(전월 40만원 이상, 등록 달 제외)와 VISA·Mastercard Platinum 브랜드 서비스.'
