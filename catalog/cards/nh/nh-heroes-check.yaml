notes: '첫 개정 시행일 근거: page. 2024년 7월 16일 출시. 부가서비스는 출시 뒤 3년 이상 줄이지 않는다고 적혀 있음. 새소식 514건 중 2024년 7월부터 2026년 9월 28일까지 제목을 끝까지 봤고 이 카드의 부가서비스 변경 공지는 없음. 여러 카드 약관 변경 공지 중 본문을 연 것(bbrd_sqno 5751, 5776, 5786, 5789, 5863)에도 이 카드는 없음. 발급중단 공지 2건(5770, 5930)도 본문에서 이 카드를 찾지 못했고 상품 페이지는 신청가능. zgm 할인카드와는 상품 코드, 체크카드 여부, 혜택, 실적이 모두 다른 별도 상품. 발급 대상은 만 34세 이하 또는 전역 3년 이내의 제대군인. 국내전용과 국내외겸용(Mastercard)이고 연회비 없음. 후불교통 신청 가능. 실적은 전월 승인일 기준 국내외 일시불·할부 합산이고 취소는 취소 매출표 접수월에서 뺌. 할인받은 자기계발·생활혜택 영역 이용금액은 실적에서 빠짐. 자기계발 4개 영역 10%, 디지털 구독과 교통 20%, 이동통신 10%이고 두 영역 합쳐 월 1만5천원 통합 한도. 월 한도는 매월 1일부터 말일까지 이용 순서대로 적용. 자기계발은 최초 카드사용등록일부터 다음 달 말일까지 실적 없이 제공. 생활혜택은 카드 등록 달에는 없고 그 다음 달부터 전월실적을 채우면 제공. 무이자할부는 할인 제외. 해외 이용 시 국제브랜드수수료 1%와 해외서비스수수료가 따로 붙음. 해외서비스수수료는 상품 페이지에 0.25%와 해외 물품구매 건당 $0.5 두 문구가 있어 서로 다름. 2026년 1월 19일 출시한 NH대한민국히어로카드(신용·체크)는 소방관용 별도 상품(새소식 5943).'
