notes: >-
  연회비는 실물카드 기준. 모바일카드는 국내·해외 모두 15,000원.
  실적은 매월 1일~말일 일시불·할부 이용금액. 할인 제외는 온라인 간편결제·해외 3%, 교통·이동통신·스트리밍 10% 할인이 적용된 건 전체금액만이고, 30% 맞춤할인과 1% 할인 건은 실적에 들어감.
  실적 제외 중 업종 코드 없는 것: 초·중·고 학교납입금, 대학 등록금, 부동산 임대료, 선불카드·전자지급수단 구매·충전, 현금서비스, 카드론, 수수료·이자, 연체료. 건강보험 등 사회보험료는 삼성카드가 공과금으로 분류.
  실적과 할인은 승인 시점 기준, 해외·무승인 건은 매출전표 접수 시점 기준. 취소는 매출취소전표 접수월에서 뺌.
  공식 문구 미확인: 할부를 결제 달에 전액 인정하는지.
  무이자할부, 다른 행사 할인 적용 건은 할인 대상 아님. 삼성카드 다른 결제일할인과 중복 시 큰 것만 적용. 본인·가족카드 실적과 한도 합산.
  발급월+1개월까지는 실적 미달이어도 30만원 구간 혜택 제공.
