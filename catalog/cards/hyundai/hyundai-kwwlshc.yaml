notes: 2026-10-11 공식 가이드북(2026년 7월 판) 대조. 연회비 국내전용과 국내외겸용(Visa Platinum) 20,000원(기본 10,000+제휴 10,000), 가족카드 5,000원. 교원웰스 렌탈·구독료 정기결제 청구할인 하나뿐이고 결제 금액이 할인액보다 적으면 그 금액만큼이라 rate 100에 월 한도 구간표로 담았다. 실적은 전월 1일~말일 일시불과 할부이고 할인 받은 정기결제 금액, 공과금 등, 부동산 임대료, 무이자할부를 뺀다. 취소는 승인월에서 뺀다. 신규 발급은 수령 등록월 다음 달까지 40만 구간 한도를 주고 실적이 더 높으면 그 구간을 따른다.
