notes: '첫 개정 시행일 근거: page. 카드 신규 출시 2024-01-05(상품 페이지 부가서비스 유지 안내). 뉴스·공지 중 2024-01-01 뒤 438건의 본문을 끝까지 봤다. 이 카드가 대상에 든 공지는 긴급할인 대상 확대(2024-10-30, 2025-01-20, 2025-06-10), 긴급할인 이름 변경(2025-08-13), 약관 국제브랜드 수수료 문구(2026-01-07), 해외 결제 대행은행 문구(2026-03-30)이고 모두 할인 혜택은 그대로다. 전월실적 조건이 없어 실적 기준은 none이고 취소 칸은 자리를 채우는 값이다. 연회비 국내외겸용(Visa Platinum/Amex Platinum)과 국내전용 모두 15,000원(기본 10,000+제휴 5,000), 가족카드 5,000원. 할인 제외(실적과 별개)는 공과금(국세, 관세, 지방세, 지방세외수입, 상하수도, 벌과금, 과태료 등), 전기·도시가스 요금, 아파트관리비, 초·중·고 학교납입금, 사립유치원비, 대학·대학원 등록금, 상품권·선불카드, 4대 사회보험료, 고속도로 통행료, 후불하이패스, 고속버스, 다른 현대카드 할인·무이자할부 적용 건, 연회비, 국제브랜드·해외서비스 수수료. 긴급할인을 쓰면 기본 할인 금액이 긴급할인 상환에 쓰인다. 결제 건 혜택 아님: 긴급할인(선지급 포인트 서비스), 메탈 플레이트, 톰 삭스 크레딧 카드 플레이트, Visa/Amex 플래티넘 서비스.'
