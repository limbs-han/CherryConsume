        evidence: ['전월 이용 금액 30만원 이상 시 온라인 쇼핑, 커피전문점, 배달 앱 5% 올리브 포인트 적립', '온라인 쇼핑 | 네이버플러스 스토어, 쿠팡, G마켓, 옥션, SSG.COM | 5% | 월 2천 올리브 포인트(초과 시 미적립)', 온라인 쇼핑은 대상점 공식 홈페이지 및 앱 내 결제 건에 한해 추가 혜택 적용, 결제 승인된 가맹점명이 해당 업체가 아닌 PG결제(결제대행) 또는 간편결제 가맹점명으로 확인되는 경우 해당 가맹점으로 분류되어 적립 제외, '추가 혜택(온라인 쇼핑, 커피전문점, 배달 앱)이 적용된 결제 건의 전체 이용 금액']
