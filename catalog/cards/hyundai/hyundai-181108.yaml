    unmodeled: [올리브 포인트는 매달 이용분을 다음 달 20일에 적립한다, 적립은 결제 순서가 아니라 현대카드 매출전표 접수 순서대로 한도를 쓴다, 실적은 본인과 가족 카드를 합산한다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, 부분 무이자 할부는 수수료를 내는 개월의 이용 금액만 적립한다, 적립 뒤 취소하면 이후 적립될 포인트에서 취소분을 뺀다, 현대카드의 다른 할인 서비스가 적용된 결제는 실적과 적립에서 뺀다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 출시일은 2026-06-18이고 가이드북은 2026년 7월 기준이다. 그 사이 혜택이 같았는지 확인하지 않았다, assumed: '2026-07-01'}
notes: 2026-10-11 공식 가이드북(2026년 7월 기준) 대조. 연회비 국내전용과 국내외겸용(Visa/Amex Platinum) 15,000원(기본 10,000+제휴 5,000), 가족카드 5,000원. 전월 30만 이상 올리브영 20%(월 1만 올리브 포인트), 온라인 쇼핑·커피전문점·배달 앱 5%(영역별 월 2천 올리브 포인트), 넘으면 미적립. 건별 소수점 이하 반올림. 올리브 포인트 원화 가치는 가이드북의 1 올리브 포인트=1원(해지 시 취소분 환산)을 쓴다. 추가 혜택이 적용된 결제는 실적에서 뺀다. 실적 제외는 공과금, 전기·가스, 아파트 관리비, 교육비 납입금, 상품권·선불카드(올리브영 기프트카드 포함), 4대보험, 고속도로 통행료, 고속버스, 무이자 할부. 신규 발급 시 수령 등록월 다음 달 이용 건까지 30만 구간. 기사로 알려진 올리브영 2만 포인트 행사 한도는 가이드북에 없어 담지 않았다.
