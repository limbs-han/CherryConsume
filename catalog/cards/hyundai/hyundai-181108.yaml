        evidence: ['전월 이용 금액 30만원 이상 시 온라인 쇼핑, 커피전문점, 배달 앱 5% 올리브 포인트 적립', '커피전문점 | 스타벅스, 투썸플레이스, 이디야커피, 폴바셋, 메가MGC커피 | 월 2천 올리브 포인트(초과 시 미적립)', 커피전문점의 경우 백화점·할인점·쇼핑몰 내 입점 매장 및 공동 가맹점 결제 건은 추가 혜택 제외, '추가 혜택(온라인 쇼핑, 커피전문점, 배달 앱)이 적용된 결제 건의 전체 이용 금액']
        target:
