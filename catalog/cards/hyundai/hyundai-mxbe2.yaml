        target:
          merchants: [galleria, hyundai_department, lotte_department, shinsegae_department]
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {1000000: 10000, 2000000: 20000}
        tiers: {from: 1000000}
        stack: area
        exclude_applied: 1
        unmodeled: [백화점 온라인몰·주차장·문화센터·임대매장 이용은 할인하지 않는다]
      - key: coffee-bakery-10
        title: 커피·베이커리 10% 청구 할인
        source: manual
        evidence: ['커피전문점 : 스타벅스, 투썸플레이스, 커피빈, 폴바셋', '베이커리 : 파리바게뜨, 파리크라상, 뚜레쥬르', '커피전문점의 경우 백화점, 할인점, 쇼핑몰 내 입점매장 및 공동가맹점은 혜택 제외']
        target:
          merchants: [coffee_bean, paris_baguette, paul_bassett, starbucks, tous_les_jours, twosome]
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {1000000: 10000, 2000000: 20000}
        tiers: {from: 1000000}
        stack: area
        exclude_applied: 1
        unmodeled: [커피전문점은 백화점·할인점·쇼핑몰 안의 입점 매장과 공동가맹점을 할인하지 않는다, 파리크라상은 공통 가맹점이 없어 대상에서 뺐다]
      - key: convenience-10
        title: 편의점 10% 청구 할인
        source: manual
        evidence: ['편의점 영역 : GS25, CU, 세븐일레븐, 이마트24']
