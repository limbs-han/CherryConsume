        title: 주유·대중교통 10% 청구 할인
        source: manual
        evidence: ['주유·대중교통 영역 : 모든 주유소, 시내버스, 지하철', 주유 영역 중 LPG 충전소는 혜택 제외]
        target:
          categories: [fuel, transit.bus_city, transit.subway]
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {1000000: 10000, 2000000: 20000}
        tiers: {from: 1000000}
        stack: area
        exclude_applied: 1
        unmodeled: [LPG 충전소는 할인하지 않는다]
    unmodeled: ['간편결제, PG, 키오스크처럼 별도 가맹점번호로 승인된 결제는 영역 할인을 하지 않는다', 영역별 월 한도와 실적은 본인과 가족 카드를 합산한다, 대중교통 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다, 고속도로 통행료와 후불하이패스는 실적과 적립에서 뺀다, 현대카드의 다른 청구 할인과 겹치면 큰 쪽 하나만 준다, 부분 무이자 할부는 수수료를 내는 개월의 이용 금액만 적립한다, 월 한도를 넘긴 뒤 혜택 받은 결제를 취소하면 이전 결제에 다음 달 15일경 할인한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 가이드북은 2026년 3월 판이다. 그 전부터 혜택이 같았는지 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
notes: 2026-10-10 공식 가이드북 대조. 연회비 국내전용과 국내외겸용(Visa Signature) 200,000원(기본 50,000+제휴 150,000), 가족카드 50,000원. 전월 50만 이상 국내외 1% M포인트(한도 없음, 건별 반올림). 전월 100만 이상 온라인 쇼핑·백화점·커피베이커리·편의점·주유대중교통 10% 청구 할인, 영역별 월 1만원(100만 이상)·2만원(200만 이상). 10% 할인은 기본 1%와 함께 받는다. 실적은 전월 1일~말일 일시불과 할부이고 10% 할인 받은 결제 전체와 무이자 할부를 뺀다. 취소는 승인월 실적에서 뺀다. 신규 발급 시 카드 수령 등록월 다음 달 이용 건까지 50만·100만 미만도 혜택을 준다. 결제 건 혜택 아님 M 긴급적립, 공항 라운지 연 5회, 발레파킹 월 5회, 메탈 플레이트.
