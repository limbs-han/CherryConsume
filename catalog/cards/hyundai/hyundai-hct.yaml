open_questions:
  - {path: 'revisions[0].benefits[domestic-0-7].reward', question: 할인 금액의 원 미만을 어떻게 처리하는지 공식 문구에 없다, assumed: floor}
notes: 2026-10-11 공식 가이드북(2026년 3월 기준) 대조. 연회비 국내전용과 국내외겸용(Visa Platinum) 15,000원(기본 10,000+제휴 5,000), 가족카드 5,000원. 실적·한도 없이 국내 0.7%, 해외 2% 청구할인. 시작일은 가이드북의 카드 신규 출시일 2025-07-17. 할인 제외는 카드사 기본값에 부동산 임대료(월세)를 더했다.
