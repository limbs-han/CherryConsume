open_questions:
  - {path: 'revisions[0].effective_from', question: 출시일은 2023-12-07이고 가이드북은 2026년 3월 기준이다. 그 사이 혜택이 같았는지 확인하지 않았다, assumed: '2026-03-01'}
notes: '2026-10-11 공식 가이드북(2026년 3월 기준) 대조. 연회비 국내전용과 국내외겸용(Visa Platinum) 20,000원(기본 10,000+제휴 10,000), 가족카드 5,000원. 전월 50만 이상 코스트코 밖 국내외 1%, 코스트코 온라인몰 3%, 매장 2%(통합 연 50만 포인트, 넘으면 미적립). 건별 소수점 이하 반올림. 포인트는 바우처로 1포인트 1원(5천 포인트 이상이면 10포인트 단위 올림). 실적 제외는 공과금, 전기·가스, 아파트 관리비, 교육비 납입금, 상품권·선불카드, 4대보험, 고속도로 통행료, 후불하이패스, 고속버스, 무이자 할부. 신규 발급 시 발급월 다음 달 이용 건까지 50만 구간. 결제 건 혜택 아님: 코스트코멤버십카드 겸용, 멤버십 연회비 자동납부.'
