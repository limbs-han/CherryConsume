notes: 2026-10-11 공식 가이드북(2025년 12월 기준) 대조. 연회비 국내전용과 국내외겸용(VISA) 10,000원(기본 10,000+제휴 0), 가족카드 없음. 전월 30만 이상 SSG.COM 7%(월 1만 SSG MONEY, 넘으면 미적립), 그 외 가맹점 0.5% 무제한. 건별 소수점 이하 반올림. SSG MONEY 원화 가치는 가이드북이 SSG MONEY를 원 단위로 적은 문구(매달 SSG MONEY 3,900원 제공)로 1원으로 본다. 실적 제외와 적립 제외는 공과금, 전기·가스, 아파트 관리비, 학교 납입금·등록금, 상품권·선불카드, 4대보험, 고속도로 통행료, 고속버스, 다른 할인 적용 결제, 무이자 할부. 신규 발급 시 발급월 다음 달 이용 건까지 30만 구간. 취소는 승인월 실적에서 뺀다.
