          - {region: overseas}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {per: month, amount: 40000}
        tiers: {from: 1000000}
        unmodeled: [영역별 적립 한도는 본인과 가족 카드를 합산한다]
        notes: 해외 온·오프라인 가맹점. 국내외겸용 카드만. 월 4만 M포인트, 넘으면 1.5%
      - key: dining-5
        title: 다이닝 영역 5% M포인트 적립
        evidence: ['전월 이용 금액 100만원 이상 시 여행, 해외, 다이닝 영역 5% M포인트 적립', 대상 영역 | 대상점 | 전월 이용 금액 | 적립률 | 월 적립 한도, 다이닝 | 국내 일반음식점 | 1만 M포인트, 월 적립 한도 초과 시 기본 혜택 적립률 적용, 영역별 적립 한도는 본인+가족 카드 합산 기준, 추가 혜택 적용 시 기본 혜택은 중복 제공되지 않음, '결제 승인된 가맹점명이 해당 업체가 아닌 PG결제(결제대행) 또는 간편결제 가맹점명으로 확인되는 경우, 해당 가맹점으로 분류되어 추가 혜택 제외되니, 자세한 내용은 현대카드 고객센터(1577-6000)로 문의', 매출 건별로 소수점 이하 반올림 후 적립]
