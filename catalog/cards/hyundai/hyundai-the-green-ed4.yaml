notes: '2026-09-09 출시한 Edition4 기준. 실적 제외: 카드론, 현금서비스, 각종 수수료·이자, 국제브랜드·해외서비스 수수료. 취소는 승인월 실적에서 빼며 해외 이용 취소만 취소월에서 뺀다. 적립 제외(실적과 별개): 아파트관리비, 월세, 유치원·학교 납입금, 대학 등록금, 4대 사회보험료, 고속도로 통행료, 후불하이패스, 고속버스, 다른 현대카드 할인·무이자할부 적용 건 전체. 추가 혜택(5%)이 적용되면 기본 1.5%는 겹쳐 주지 않고, 영역 한도를 넘으면 1.5%로 적립. 신규 발급 시 카드 수령 등록월 다음 달 이용분까지 실적 무관. 결제 건 혜택 아님: 연 15만원 바우처(첫해 누적 100만원, 이후 전년 1,200만원 이상), 공항 라운지 연 5회, 공항·특급호텔 발레파킹 월 5회, M 긴급적립, 메탈 플레이트.'
