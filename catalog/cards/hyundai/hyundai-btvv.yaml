schema_version: 2
id: hyundai-btvv
issuer: hyundai
name: 현대카드 Boutique - Velvet
short_name: 현대 Boutique Velvet
search_names: [Boutique Velvet, 부티크 벨벳, 현대카드 부티크 벨벳]
kind: credit
product_codes: [BTVV]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 80000}
  - {scope: global, brand: visa, amount: 80000}
  - {scope: global, brand: amex, amount: 80000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://www.hyundaicard.com/upload/card/%28%EA%B0%80%EC%9D%B4%EB%93%9C%EB%B6%81%29%20%ED%98%84%EB%8C%80%EC%B9%B4%EB%93%9C%20Boutique%20-%20Velvet_260513.pdf', fetched_at: 2026-10-11}
checked_at: 2026-10-11
revisions:
  - effective_from: 2026-10-05
    effective_from_estimated: true
    source: manual
    tiers: [0, 500000, 1000000]
    spend:
      exclude_categories: [annual_fee, gift_card, prepaid_charge, tax, utility.water]
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
    new_card: {until: next_month_end, tier: 1000000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [고속도로 통행 요금과 후불하이패스 카드 이용 금액은 적립에서 뺀다, 현대카드의 다른 할인이 적용된 결제는 적립에서 뺀다, 국제브랜드 수수료와 해외서비스 수수료는 적립에서 뺀다]
    limits:
      - {key: plus-5, per: month, amount: 10000}
    stacks:
      - key: main
        pick: priority
        order: [online-5, department-5, mart-5, education-5, base-15]
        spill: split
    benefits:
      - key: online-5
        title: 온라인몰 5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 100만원 이상 시 온라인몰, 백화점, 대형마트, 교육 5% M포인트 적립, '온라인몰 : 네이버플러스 스토어, 쿠팡, 컬리, SSG.COM', '대상점 통합해 월 1만 M포인트 적립 한도 (본인+가족 카드 합산 기준, 적립 한도 초과 시 기본 혜택 적립률 적용)', 쿠팡의 경우 쿠팡이츠 결제 건은 국내외 가맹점으로 구분되어 기본 혜택 적용]
        target:
          merchants: [coupang, kurly, naver_plus_store, ssg_com]
          exclude_merchants: [coupang_eats]
        when:
          - {channel: online}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
        unmodeled: [네이버플러스 스토어는 naver.com 도메인으로 확인되는 가맹점만 적립한다, 상품 선택 시 연결된 다른 사이트나 앱에서 결제하면 1.5%만 준다]
      - key: department-5
        title: 백화점 5% M포인트 적립
        source: manual
        evidence: ['백화점 : 현대백화점, 롯데백화점, 신세계백화점, 갤러리아백화점', '백화점의 경우 온라인몰, 백화점 내 상품권 구매금액, 문화센터, 여행사, 양곡, 일부 임대매장 (식당가/귀금속/안경점 등) 결제 건은 국내외 가맹점으로 구분되어 기본 혜택 적용']
        target:
          merchants: [galleria, hyundai_department, lotte_department, shinsegae_department]
        when:
          - {channel: offline}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
        unmodeled: [백화점 문화센터·여행사·양곡·식당가·귀금속·안경점 같은 임대매장 결제는 1.5%만 준다]
      - key: mart-5
        title: 대형마트 5% M포인트 적립
        source: manual
        evidence: ['대형마트 : 이마트, 홈플러스, 롯데마트', '대형마트의 경우 온라인몰, 기업형 슈퍼마켓(이마트 에브리데이, 홈플러스 익스프레스, 롯데슈퍼 등), 주차장, 문화센터, 임대 매장 이용 금액은 추가 혜택 제외']
        target:
          merchants: [emart, homeplus, lotte_mart]
        when:
          - {channel: offline}
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
        unmodeled: [대형마트 주차장·문화센터·임대 매장 결제는 1.5%만 준다]
      - key: education-5
        title: 학원 5% M포인트 적립
        source: manual
        evidence: ['교육 : 학원/유치원 업종', '사립유치원 교육비 납입금, 초·중·고교 학교 납입금, 대학·대학원 등록금 납부 결제 건 적립 제외']
        target:
          categories: [education.academy]
        reward: {type: points, program: hyundai_m_point, rate: 5, round: round}
        limits:
          - {shared: plus-5}
        tiers: {from: 1000000}
        unmodeled: [유치원 업종도 5% 대상이지만 사립유치원 교육비 납입금은 적립 제외라 유치원은 담지 않았다]
      - key: base-15
        title: 국내외 가맹점 1.5% M포인트 적립
        source: manual
        evidence: [전월 이용 금액 50만원 이상 시 국내외 가맹점 1.5% M포인트 적립, 1회 및 연간 적립 한도 제한 없음, 매출 건별로 소수점 이하 반올림 후 적립]
        target: {all: true}
        reward: {type: points, program: hyundai_m_point, rate: 1.5, round: round}
        tiers: {from: 500000}
    unmodeled: [연 1회 5만원 크레딧(호텔·항공여행·일반음식점 5만원 이상 결제 또는 7만 M포인트 교환)은 연간 이용 금액 조건이라 계산하지 않는다, 인천공항 라운지와 발레파킹은 결제 혜택이 아니라 계산하지 않는다, 간편결제·PG·키오스크처럼 별도 가맹점번호로 승인되는 결제는 추가 혜택에서 빼고 1.5%만 준다, 적립은 매출전표 접수 순서로 한도를 적용한다, 실적과 적립 한도는 본인과 가족 카드를 합산한다, 국제브랜드 수수료와 해외서비스 수수료는 실적에 넣지 않는다, 대중교통·정기결제 등 사후 승인 가맹점과 해외 이용 금액은 매출일자 달의 실적으로 센다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 가이드북 시행일을 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
notes: 2026-10-11 공식 가이드북 대조. 연회비 국내전용과 국내외겸용(Visa/Amex Platinum) 80,000원(기본 20,000+제휴 60,000), 가족카드 20,000원. 전월 50만 이상 국내외 1.5%, 100만 이상 온라인몰 4곳·백화점 4곳·대형마트 3곳·학원 5%이고 네 영역 합쳐 월 1만 M포인트를 넘으면 1.5%다. 매출 건별 소수점 이하 반올림. 실적 제외는 카드론 등, 수수료, 공과금, 상품권·선불카드뿐이라 상하수도만 utility.water로 뺀다. 취소는 승인월에서 빼고 해외는 취소 달에서 뺀다. 신규 발급은 수령 등록월 다음 달 이용 건까지 50만·100만 미만도 혜택을 줘 100만 구간으로 둔다.
