notes: 2026-10-11 공식 상품 페이지와 현대카드M·M2 Edition2 제휴통합 가이드북 대조. 연회비 국내전용 15,000원(기본 5,000+제휴 10,000), 국내외겸용(Visa) 20,000원(기본 5,000+제휴 15,000), 가족카드 없음. Mastercard는 2023-10-04 발급 중단. VIPS 20% 현장할인 일 1회 1회 20만원까지, 올리브영·투썸·뚜레쥬르 10% 현장할인, CJ ONSTYLE 5% 청구할인 월 3만원. 실적은 전월 1일~말일 일시불과 할부이고 할인 이용금액, 매출취소, 무이자할부, 세금을 뺀다.
