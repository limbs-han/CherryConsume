open_questions:
  - {path: 'revisions[0].benefits', question: 가이드북은 전월 이용금액 10만원 조건을 CGV 할인에만 적었지만 신규 회원은 발급월과 익월까지 전월 이용금액 무관하게 할인한다고 해 다른 CJ 할인에도 전월 조건이 있어 보인다. 덜 주는 쪽으로 모든 할인에 전월 10만원 이상을 두었다, assumed: tiers from 100000}
  - {path: 'revisions[0].effective_from', question: 가이드북 시행일을 확인하지 않아 수집일을 시작일로 둔다, assumed: '2026-10-05'}
