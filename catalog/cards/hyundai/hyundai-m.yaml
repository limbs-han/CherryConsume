notes: '2024-01-19 출시한 현행 현대카드M(카드 코드 ME4) 기준. 실적은 전월 1일~말일 본인+가족 카드 일시불·할부 금액. 할부·리볼빙은 최초 승인월에 포함. 취소는 승인월 실적에서 빼며, 그 때문에 전월 실적이 모자라면 당월 적립 없음. 대중교통 등 사후 승인 건과 해외 이용은 매출일자 기준. 실적 제외 중 업종 코드 없는 것: 카드론, 현금서비스, 수수료·이자, 국제브랜드·해외서비스 수수료. 현대카드M(구) 등 다른 카드 이용금액은 합산 불가. 적립 제외(실적과 별개): 전기·도시가스 요금, 아파트관리비, 사립유치원비, 초·중·고 학교납입금, 대학·대학원 등록금, 4대 사회보험료, 고속도로 통행료, 후불하이패스, 고속버스, 다른 현대카드 할인·무이자할부 적용 건. 추가 혜택(5%)이 적용되면 기본 1.5%는 겹쳐 주지 않고, 5% 한도를 넘으면 1.5%로 적립. 매출 건별 소수점 이하 반올림. 신규 발급 시 발급월 다음 달 이용분까지 실적 무관. 결제 건 혜택 아님: M 긴급적립, 메탈 플레이트, Visa/Amex 플래티넘 서비스.'
