notes: '첫 개정 시행일 근거: page. 카드 신규 출시 2024-01-19(상품 페이지 부가서비스 유지 안내). 뉴스·공지 2,062건 중 2024-01-01 뒤 438건의 본문을 끝까지 봤다. 이 카드가 대상에 든 공지는 M 긴급적립 대상 확대(2024-09-25, 2025-01-20, 2025-03-13, 2025-05-21), 약관 국제브랜드 수수료 문구(2026-01-07), 적립 관리 기준 문구(2026-02-27), 해외 결제 대행은행 문구(2026-03-30)이고 모두 혜택은 그대로라고 밝혀 부가서비스 변경이 아니다. 2024-01-10 상품명 변경 공지로 옛 카드는 현대카드M(구)가 됐다. 연회비 국내외겸용(Visa Platinum/Amex Platinum)과 국내전용 모두 30,000원(기본 10,000+제휴 20,000), 가족카드 10,000원. 실적은 전월 1일~말일 현대카드M 본인+가족 카드 일시불·할부 금액이고 다른 카드(현대카드M(구) 포함)는 합산하지 않는다. 할부와 리볼빙은 최초 승인월에 넣는다. 취소는 승인월 실적에서 빼며 그 때문에 전월 실적이 모자라면 당월 적립이 없다. 실적 제외: 공과금(국세, 관세, 지방세, 지방세외수입, 상하수도, 벌과금, 과태료, 인지세, 송달료, 민원 발급 수수료), 상품권 등 현금성 유가증권, 선불카드 구매·충전, 연회비, 국제브랜드·해외서비스 수수료. 전기·도시가스 요금은 실적에는 들어가고 적립에서만 빠진다. 적립 제외는 카드사 파일의 혜택 제외. 추가 혜택이 적용되면 기본 1.5%는 겹쳐 주지 않고 월 한도를 넘은 금액은 1.5%로 적립한다. 매출 건별 소수점 이하 반올림. 신규 발급 시 발급월 다음 달 이용분까지 기본과 추가 혜택 모두 실적과 상관없이 준다. 결제 건 혜택 아님: M 긴급적립, 메탈 플레이트, 아티스트 스페셜 플레이트, Visa/Amex 플래티넘 서비스.'
