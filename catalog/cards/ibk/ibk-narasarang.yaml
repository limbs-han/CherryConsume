open_questions:
  - {path: 'revisions[0].benefits[gs25-items-onsite].unmodeled', question: '2026-01-05 원문 품목은 음료(주류 제외), 빙과류, 신선식품이고 지금 페이지는 간편식, 음료, 아이스크림이다. 바뀐 날을 알려 주는 원문이 없다', assumed: 지금 페이지 문구}
  - {path: 'revisions[0].benefits[mytag-momstouch].when', question: 리플렛은 맘스터치 오프라인 매장 결제만이라고 쓰고 지금 상품 페이지는 채널 조건이 없다, assumed: 채널 조건 없음}
  - {path: 'revisions[0].benefits[aio-transit].limits', question: '대중교통 20% 할인이 All in One 월 통합할인한도에 들어가는지. 상품 페이지 문구는 대중교통은 할인 횟수, 할인 금액 제한 없음. 2026-09-29 카드 주인도 포함되는 것 같다고 했지만 확실하지 않다', assumed: 통합할인한도에 포함}
  - {path: 'revisions[0].benefits[px-under-30k].reward.type', question: PX 할인이 결제할 때 빠지는지 청구서에서 빠지는지. 상품 페이지와 설명서에 표기가 없고 IBK 블로그는 현장할인이라고 쓴다. PX 기본할인 네 구간과 특별할인이 같은 답을 따른다. 2026-09-29 카드 주인은 청구할인 같다고 했지만 확실하지 않다, assumed: billing_discount}
  - {path: 'revisions[0].benefits[mega-order-weekday]', question: 메가오더 제휴 할인이 All in One 카페 할인과 한 결제에 같이 적용되는지. 주말 할인도 같은 답을 따른다. 2026-09-29 카드 주인도 모른다, assumed: 둘 중 큰 쪽 하나}
  - {path: 'revisions[0].benefits[mytag-kakaot-taxi]', question: '마이태그 쿠폰과 All in One 할인이 한 결제에 같이 적용되는지. 카카오T 택시와 All in One 택시, 쿠팡 쿠폰과 All in One 쇼핑, NOL 적립과 All in One 여행·레저가 해당한다', assumed: 둘 중 큰 쪽 하나}
  - {path: 'revisions[0].benefits[emart24-items-onsite]', question: 이마트24 주요품목 현장할인이 편의점 10% 청구할인과 한 결제에 같이 적용되는지. GS25 주요품목은 추가 할인으로 적혀 있어 같이 받는 것으로 두었다, assumed: 둘 중 큰 쪽 하나}
  - {path: 'revisions[0].benefits[npay-points]', question: Npay 포인트 적립과 가맹점 카드 할인을 한 결제에 같이 받는지. 상품 페이지에 문구가 없다, assumed: 둘 중 큰 쪽 하나}
  - {path: 'revisions[0].benefits[aio-leisure].target', question: '여행·레저 할인을 비씨카드 전산 업종 중 어디까지 주는지. 상품 페이지는 NOL, 쏘카, PC방만 적는다. 2026-09-29 카드 주인의 명세서 5달치에서 PC방이 아닌 업종의 가맹점 3곳이 이 할인을 받았고 이름에 PC가 들어간 가맹점 1곳은 받지 않았다', assumed: '상품 페이지 문구대로 NOL, 쏘카, PC방'}
notes: 'IBK 상품 페이지(준법감시인 심의필 제2026-5925호, 2026.07.27, 유효기간 2026.12.31) 기준. 2026.01.05 설명서(제2026-0104호)와 BC카드 상품 페이지로 교차 확인. 상품 페이지의 부가서비스 유지 안내에 카드 신규출시일 2012.06.11이 적혀 있다. 리플렛 부가서비스 유지 안내는 카드 신규출시를 2015-12-21로 쓴다.product_codes는 상품 페이지 주소의 PDLN_CD, PDGR_CD, PDTM_CD, PDCD 값을 순서대로 이은 것. 서비스 묶음은 나라(전월 8만원 이상), 사랑(전월 20만원 이상), 파워업 All in One(전월 25만원 이상, 월 통합할인한도 1만/2.5만/4.5만원), 파워업 군마트(PX)와 Npay포인트, 현역병 급여수령 우대 패키지와 현역병 고객 우대 패키지, 특별 제휴서비스(2026.12.31까지)다. 전월 병 급여이체자는 나라·사랑 서비스의 전월실적 조건이 면제된다. 실적은 전월 1일부터 말일까지 국내외 이용금액이고 제세공과금, 상품권, 교통카드 이용금액은 빠진다. 취소는 취소 매출표가 접수된 달 실적에서 뺀다. 카드 등록일부터 다음 달 말일까지는 실적이 모자라도 할인과 Npay 적립을 주고 All in One은 25만~50만원 구간 한도를 쓴다. 결제 건 혜택이 아니라 모델에 없는 것: 국내 공항라운지 연 1회(Master 발급, 병 급여이체자, 2026.12.31까지), 상해보험·병영생활 안심보험 무료가입, 부모상 장례용품 지원, 트래블서비스(국제브랜드 1%·해외이용 0.18% 수수료 면제, 해외 ATM 수수료 월 3회 면제, 매매기준율 적용), GS ALL·그린카드·SYRUP 멤버십, 소액 신용한도. 소액 신용한도 부여 시 설명서가 따로 있다.제휴 전용가나 쿠폰이라 모델에 없는 것: 지니뮤직 전용 이용권 최대 43%(6개월), SPOTV NOW 전용 이용권 최대 30%, 왓챠 30%(4개월), 해커스 인강 30%·라이브 20%·어학원 10%, 월급쟁이부자들 10% 쿠폰(5만원 이상, 월 1회, 최대 5만원), 쏘카 4시간 이상 50% 쿠폰. Npay 적립 전월실적 조건은 설명서 2쪽 요약만 없다고 쓰고 전후대비표 5쪽, 리플렛, 상품 페이지는 모두 25만원 이상이라 25만원 이상으로 둔다.'
