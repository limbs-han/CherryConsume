notes: >-
  IBK 상품 페이지(준법감시인 심의필 제2026-5925호, 2026.07.27) 기준. BC카드 상품 페이지와 체크카드 개인설명서(2026.01.05)로 교차 확인.
  integrated_cap은 파워업 서비스 All in One의 월 통합할인한도(1만/2.5만/4.5만원). 나라·사랑·PX·Npay·우대 패키지·특별 제휴 혜택은 각자 한도라 counts_toward_integrated_cap false.
  실적은 전월 1일~말일 국내외 가맹점 이용금액. 제세공과금, 상품권 구매금액, 교통카드 이용금액은 실적 제외. 취소는 취소 매출표가 접수된 달 실적에서 차감.
  전월 병 급여이체(카드 결제계좌로 국군재정관리단 병 급여 수령) 조건을 채우면 나라·사랑 서비스 전월실적 조건 면제. 이 면제는 모델에 못 담음.
  전월 25만원 이상이면 편의점·대중교통은 All in One 할인만 적용하고 나라·사랑의 편의점·대중교통 할인은 주지 않음.
  카드 등록일부터 다음 달 말일까지는 실적 미달이어도 할인·Npay 적립 제공. 이때 All in One은 25만~50만원 구간 한도.
  간편결제 가맹점명이 결제대행사로 찍히면 할인 제외. 모든 혜택은 비씨카드 전산 등록 가맹점(업종) 기준. 상품권 구매는 할인 제외.
  현장할인 혜택(GS25·이마트24 주요품목, 아웃백, CGV, 놀이공원)은 결제 금액이 이미 할인된 금액으로 찍힘.
  공식 문구 미확인: PX 할인이 현장할인인지 청구할인인지. 메가MGC커피 All in One 할인과 메가오더 제휴 할인, 카카오T All in One 할인과 마이태그 쿠폰의 중복 여부.
  프로모션 기한 2026-12-31까지: 네이버멤버십, 마이태그 쿠폰, 특별 제휴서비스, Npay 50만·100만원 구간 추가 적립, 공항라운지.
  결제 건 혜택 아님: 국내 공항라운지 연 1회(Master 브랜드, 병 급여이체자), 상해보험·병영생활 안심보험 무료가입, 부모상 장례용품 지원, 트래블서비스(국제브랜드 1%·해외이용 0.18% 수수료 면제, 해외 ATM 수수료 월 3회 면제, 매매기준율 적용), GS ALL·그린카드·SYRUP 멤버십.
  제휴 전용가·쿠폰이라 모델 제외: 지니뮤직 전용 이용권 최대 43%(6개월), SPOTV NOW 전용 이용권 최대 30%, 왓챠 30%(4개월), 해커스 인강 30%·라이브 20%·어학원 10%, 월급쟁이부자들 10% 쿠폰(5만원 이상, 월 1회, 최대 5만원), 쏘카 4시간 이상 50% 쿠폰, 슈마커 오프라인 1만원(10만원 이상, 2026-09-30까지).
  공식 문구 차이: 편의점 All in One 1일 할인횟수가 IBK 페이지는 1일 2회, BC카드 페이지는 1일 1회. IBK 값을 씀.
  소액 신용한도 최대 30만원 신청 가능.
