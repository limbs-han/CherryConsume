        evidence: [주요 패밀리레스토랑 5% 할인(캐시백), '아웃백, 온더보더, VIPS', 월 1회, 백화점/대형마트 입점 점포 제외]
        target:
          merchants: [on_the_border, outback, vips]
        when:
          - option:
              type: [baby, children]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: month, count: 1}
          - {shared: ab-integrated}
        tiers: {from: 300000}
      - key: baby-telecom-1k
        title: A형·B형 이동통신요금 자동이체 1천원 캐시백
        source: page
        evidence: ['이동통신요금 자동이체 시 1,000원 캐시백', '월 1회, 최초 접수분에 한함']
