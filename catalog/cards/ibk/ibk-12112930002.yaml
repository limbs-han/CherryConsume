        evidence: ['영화 2,000원 할인(캐시백)', '서비스 제공처 : CGV, 메가박스, 롯데시네마', '서비스 이용안내 : 1일 1회, 월 2회', 전월이용실적 30만원 이상 | 월간 통합적립한도 1만원]
        target:
          merchants: [cgv, lotte_cinema, megabox]
        when:
          - option:
              type: [green]
        reward: {type: cashback, fixed: 2000}
        limits:
          - {per: day, count: 1}
          - {per: month, count: 2}
          - {shared: c-integrated}
        tiers: {from: 300000}
      - key: green-coffee-10
        title: C형 커피 전문점 10% 캐시백
        source: page
        evidence: [커피 전문점 10% 할인(캐시백), '서비스 제공처 : 스타벅스, 커피빈, 카페베네', '서비스 이용안내 : 1일 1회, 월 2회, 1만원 이상 승인건에 한함', '*상품권구매(기프트카드 구입,충전포함) 및 백화점/대형마트 입점 점포 할인제외']
        target:
          merchants: [cafe_bene, coffee_bean, starbucks]
        when:
          - option:
              type: [green]
          - amount: {min: 10000}
        reward: {type: cashback, rate: 10}
