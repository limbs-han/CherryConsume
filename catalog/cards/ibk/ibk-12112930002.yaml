        title: C형 에코머니 기본 적립
        source: page
        evidence: [국내 가맹점 이용금액의 0.2%~0.5% 에코머니 포인트 적립, 전월 이용실적 | 20만원 이상 | 50만원 이상 | 100만원 이상 | 200만원 이상 | 기본 적립률 | 0.2% | 0.3% | 0.4% | 0.5%, '포인트 적립 제외대상 : 후불 교통요금, 무이자 할부 이용금액, 제세공과금, APT관리비, 대학등록금, 정부지원금 매출']
        target:
          exclude_categories: [apartment_fee, education.tuition, insurance.social, tax, utility]
          all: true
        when:
          - option:
              type: [green]
          - {region: domestic}
          - billing_not: [postpaid_transit]
        reward:
          type: points
          program: eco_money
          rate: {200000: 0.2, 500000: 0.3, 1000000: 0.4, 2000000: 0.5}
        tiers: {from: 200000}
        unmodeled: [무이자 할부 이용금액은 적립하지 않는다]
      - key: green-movie-2000
