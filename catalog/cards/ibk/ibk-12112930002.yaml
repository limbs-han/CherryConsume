          - {per: day, count: 1}
          - {per: month, count: 2}
          - {shared: c-integrated}
        tiers: {from: 300000}
    unmodeled: ['A형·B형 딸기가 좋아 키즈 파크 3% 할인(일 1회, 1만원 이상)은 공통 가맹점이 없어 계산하지 않는다', 'B형 주요 놀이공원 자유이용권 50% 현장할인(통합 월 1회, 연 10회, 본인 한정)은 자유이용권 여부를 결제로 알 수 없어 계산하지 않는다', '공통 서비스 보리보리 할인, 그린카드 멤버십, 딸기가 좋아 성인 무료입장과 음료교환권, 출산 행사 초대는 계산하지 않는다', 실적에서 조산원·산후조리원·유아원·정부지원금 매출이 빠지지만 공통 업종이 없어 실적에 넣는다, 가족카드 이용실적은 본인 실적과 합산하지 않고 카드별로 본다, 월간 통합할인한도는 매출이 정상 처리되는 순서대로 차감된다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시작일을 찾지 못해 준법감시인 심의일로 두었다, assumed: '2025-09-04'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외 목록은 A형 제공조건 아래에만 적혀 있다. 모든 유형에 같게 적용했다, assumed: 모든 유형}
  - {path: 'revisions[0].options[type].change', question: 서비스 유형을 바꾸는 방법과 적용 시점이 상품 페이지에 없다, assumed: next_month}
  - {path: 'revisions[0].limits[ab-integrated]', question: A형·B형 통합 월 할인한도가 모든 A형·B형 할인에 함께 걸린다고 보았다. 놀이공원만 한도와 관계없다고 적혀 있다, assumed: 모든 A형·B형 할인에 함께 건다}
  - {path: 'revisions[0].benefits[green-eco-points]', question: 에코머니 기본 적립을 C형 영화관·커피 할인 결제에도 더해 주는지 문구가 없다, assumed: 같은 결제에서는 큰 혜택 하나만}
notes: 2026-10-10 expand3 조사. 상품 페이지를 대조했다. 연회비 없음. 서비스 유형 A·B·C 중 하나를 고른다. A형·B형 할인은 전월실적 30만원부터이고 통합 월 한도 5천·7천·1만·1만5천원. C형 에코머니 기본 적립은 20만원부터 0.2~0.5%이고 0.5%는 200만원부터다. C형 영화관·커피 할인은 30만원부터 월 1만원 한도. 카드 수령일부터 다음 달 말까지는 실적 미달이어도 최소 구간으로 준다. 정부 바우처는 카드사 부가서비스가 아니라 계산하지 않는다
