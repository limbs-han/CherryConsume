        title: 백화점·대형마트 5% 청구할인
        source: page
        evidence: [주요 백화점 및 대형마트에서 5만원 이상 결제 시 5% 결제일 할인(청구할인) 혜택 제공, '(백화점)롯데백화점, 현대백화점, 신세계백화점, 갤러리아백화점 (대형마트) 이마트, 롯데마트, 홈플러스', '※ 기업형 슈퍼마켓(이마트 에브리데이, 홈플러스 익스프레스, 롯데슈퍼 등) 및 건물 내 임대매장 이용금액은 할인 제외', '월 할인한도:5천원']
        target:
          merchants: [emart, galleria, homeplus, hyundai_department, lotte_department, lotte_mart, shinsegae_department]
        when:
          - {channel: offline}
          - amount: {min: 50000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 700000}
        stack: discount
        unmodeled: [건물 안 임대매장 결제는 할인하지 않는다]
    unmodeled: [특별할인 대상 가맹점에서 쓴 금액은 할인을 받지 않아도 전부 포인트 적립에서 빠진다. 그 가맹점을 포인트 대상에서 뺐다, '바우처 연 1회(15만원권 중 택1 또는 Air Money 13만점), 공항라운지·골프장 커피·호텔 브런치 통합 월 1회 연 4회, Mastercard 브랜드 서비스는 결제 혜택이 아니라 계산하지 않는다', 각종 수수료와 이자는 실적과 적립에서 빠진다, 해외 이용금액은 매입 방식 때문에 다음 달 실적으로 잡힐 수 있다, Air Money는 제휴처에서 결제 당일에만 쓰거나 TOP포인트로 바꿔 쓴다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 원문 수집일로 두었다. 준법감시인 심의필은 2026-04-24다, assumed: '2026-10-11'}
  - {path: 'revisions[0].benefits', question: 해외 호텔·면세점이 더블적립 2%인지 특별적립 1.5%인지 원문에 없다. 해외는 2%로 두었다, assumed: double-2}
notes: 2026-10-11 IBK 상품 페이지(여신협회 심의필 2025-C1a-11672호, 준법감시인 2026-3394호) 대조. 발급대상 개인, 연회비 Master 220,000원. 기업카드와 결합한 듀얼카드 230,000원은 담지 않았다. 전월 국내외 70만원 이상일 때 Air Money 기본 1%(국내), 특별 1.5%(주유·전기차충전·호텔·면세점), 더블 2%(해외), 특별·더블 월 통합 10만P, 중복 없음. 특별할인 커피 10%(1만원 이상, 월 4천원), 온라인 5%(3만원 이상, 월 5천원), 백화점·마트 5%(5만원 이상, 월 5천원). 카드 사용 등록일부터 다음 달 말일까지는 실적과 관계없이 준다. Air Money 1포인트 = 1원. 실적의 후불교통 제외는 시내버스와 지하철로 담았다.
