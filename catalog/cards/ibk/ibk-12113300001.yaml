        source: page
        evidence: ['기본적립 | 국내 가맹점 이용금액의 1% 포인트 적립 (특별적립, 더블적립 이용금액 제외)', Air Money 포인트 적립(1포인트=1원), '후불교통, 단기카드대출(현금서비스), 장기카드대출(카드론), 무이자할부(라이트할부 등 변형 무이자 포함), 특별할인 서비스가 제공되는 가맹점의 전체 이용금액은 포인트 적립 제외']
