        target:
          merchants: [auction, coupang, eleven_st, gmarket, interpark, ssg_com]
        when:
          - {channel: online}
          - amount: {min: 30000}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 700000}
        stack: discount
