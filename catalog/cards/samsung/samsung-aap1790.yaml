notes: 2026-10-10 상품설명서(2023.5판, 여신금융협회 심의필 제2023-C1a-03079호)와 상품 페이지 대조. 연회비 국내전용, 해외겸용 Mastercard·UnionPay 모두 20,000원(기본 7,000+제휴 13,000). 발급월+1개월까지 50만 구간 혜택을 준다. 영역마다 통합 월 할인한도가 따로다. 실적 제외는 4대보험, 국세·지방세·공과금, 부동산 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다.
