          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: coffee-bakery}
        tiers: {from: 300000}
        unmodeled: [백화점·할인점·쇼핑몰 임대매장은 할인하지 않는다]
      - key: starbucks-10
        title: 스타벅스 10% 할인
        source: manual
        evidence: [커피전문점/제과점 10% 결제일할인, '단, 스타벅스의 경우, 사이렌오더 결제건도 혜택 제공']
