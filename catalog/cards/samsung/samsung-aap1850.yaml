        title: 커피전문점·제과점 10% 할인
        source: manual
        evidence: [커피전문점/제과점 10% 결제일할인, '커피전문점 스타벅스, 이디야커피, 투썸플레이스, 커피빈, 블루보틀', '제과점 파리바게뜨, 뚜레쥬르, 던킨', '전월 이용금액대별 통합 월 할인한도 30만원 이상 3,000원, 60만원 이상 5,000원', '오프라인 결제건에 한하며, 백화점, 할인점, 쇼핑몰 등의 임대매장은 제외']
