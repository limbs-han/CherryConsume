        reward: {type: billing_discount, rate: 1}
    unmodeled: ['교육 5%의 학원(입시·보습·외국어·예체능계, 오프라인)은 학원 업종이 더 넓어 담지 않았다. 인터넷강의(이투스, 메가스터디교육, 대성마이맥, 천재교과서 밀크T)는 가맹점이 없어 담지 않았다. 학습지와 같은 월 할인한도를 쓴다', 삼성카드의 다른 결제일할인과 중복되지 않고 큰 금액만 적용한다, '전월 이용금액은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일은 2024-12-03이고 상품설명서는 2025.2판이다. 출시일을 시행일로 두었다, assumed: '2024-12-03'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통은 후불교통기능·모바일교통기능 결제건이다. 새 방식대로 시내버스와 지하철을 뺐다. 이 카드는 무이자할부와 할인 받은 결제를 실적에서 빼지 않는다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits[mangwondang-50].when', question: 알라딘의 정기결제를 만권당 월정액으로 보았다. 만권당 정기결제는 알라딘 15%를 받지 않는 것으로 두었다, assumed: 'billing: subscription'}
notes: 2026-10-10 상품설명서(2025.2판, 여신금융협회 심의필 제2024-C1a-15164호)와 상품 페이지 대조. 연회비 국내전용과 해외겸용 Mastercard 모두 15,000원(기본 7,000+제휴 8,000). 발급월+1개월까지 30만 구간 혜택을 준다. 영역마다 월 할인한도가 따로다. 실적 제외는 4대보험, 국세·지방세·공과금, 아파트관리비, 부동산 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통(후불교통·모바일교통), 택시, 기프트·선불카드, 상품권이다.
