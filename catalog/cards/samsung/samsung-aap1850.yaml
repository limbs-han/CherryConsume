        title: 해외 1% 할인
        source: manual
        evidence: ['전월 이용금액에 관계없이, 할인한도 없이 해외 1% 결제일할인', 해외 가맹점 및 해외 직접구매 이용건, 해외겸용카드에 한해 제공]
        target: {all: true}
        when:
