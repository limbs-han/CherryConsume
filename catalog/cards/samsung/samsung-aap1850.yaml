        target:
          merchants: [auction, coupang, eleven_st, gmarket, lotte_on, naver_plus_store, samsung_card_shopping, ssg_com]
        reward: {type: billing_discount, rate: 5}
        limits:
          - per: month
            amount: {300000: 3000, 600000: 5000}
        tiers: {from: 300000}
      - key: study-5
        title: 학습지 5% 할인
        source: manual
        evidence: [학원/학습지/인터넷강의 5% 결제일할인, '학습지 웅진씽크빅, 교원, 대교, 한솔교육', '전월 이용금액대별 통합 월 할인한도 30만원 이상 3,000원, 60만원 이상 5,000원']
        target:
          merchants: [daekyo, hansol_education, kyowon, woongjin_thinkbig]
        reward: {type: billing_discount, rate: 5}
        limits:
          - per: month
            amount: {300000: 3000, 600000: 5000}
        tiers: {from: 300000}
