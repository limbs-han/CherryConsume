notes: 2026-10-10 상품안내장(SC제일은행 삼성체크카드 YOUNG·CASHBACK·POINT 공용, 준법심의 P3121-16-1155)과 상품 페이지 대조. 초안의 대중교통·이동통신 10%와 편의점·커피·제과 1,000원은 YOUNG 카드, 빅포인트 적립은 POINT 카드 혜택이라 뺐다. 연회비 없음. 캐시백에는 전월 실적 조건이 없다. 연간 누적 300만원 상향 비율과 직전 3개월 평균 조건의 공통 서비스는 계산하지 않아 혜택이 실제보다 적게 나올 수 있다. 후불교통 기능은 만 19세 이상 신청자에게 준다.
