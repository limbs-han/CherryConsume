open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 서비스 안내서 심의일(2022-12-01)로 두었다. 상품 출시일은 2021-03-31이다, assumed: '2022-12-01'}
  - {path: 'revisions[0].benefits[base-1].reward.program', question: 멤버십리워즈는 따로 전환하지 않고 빅포인트와 합산해 1MR=1원으로 쓴다고 적혀 있어 samsung_bigpoint로 계산했다. 포인트 프로그램을 따로 둘지 정한다, assumed: samsung_bigpoint}
  - {path: 'revisions[0].stacks', question: 삼성카드 할인이 적용된 결제는 멤버십리워즈 적립에서 빠져 30% 할인과 기본 1%를 한 묶음에 두었다. 할인 한도를 넘긴 다음 결제부터 기본 1%를 받는다, assumed: 'pick: priority, spill: none'}
notes: 2026-10-11 서비스 안내서(여신금융협회 심의필 제2022-C1a-10580호)와 PLATINUM ELITE 서비스 안내(제2026-C1a-02820호, 제2026-C1a-05330호) 대조. 연회비 해외겸용 아멕스 150,000원(기본 70,000+제휴 80,000). 추가 4%는 기본 1%에 더해 받고, 추가 4% 한도를 넘기면 기본 1%만 받는다. 발급월+1개월까지는 100만원 미만이어도 100만 구간 혜택을 준다. 실적 제외는 4대보험, 국세·지방세·공과금, 초중고 납입금, 대학 등록금, 대중교통, 택시, 아파트관리비, 부동산 임대료, 기프트·선불카드 구매와 충전, 상품권이다. 무이자할부는 실적 제외 목록에 없어 실적에 넣었다.
