        title: 배달의민족·써브웨이·쉐이크쉑·도미노피자 30% 할인
        source: manual
        evidence: ['Food 배달의민족, 써브웨이, 쉐이크쉑, 도미노피자', Food·Coffee·Movie 30% 결제일할인, '월 할인한도 100만원 이상 통합 15,000원, 200만원 이상 통합 30,000원 영역별 15,000원', 'Food 중 배달의민족의 경우, 공식 앱을 통한 결제건에 한하며', 'Food 중 써브웨이·쉐이크쉑의 경우, 오프라인 결제건에 한해 혜택이 제공됩니다.']
