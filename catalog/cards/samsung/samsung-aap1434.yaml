        evidence: ['백화점, 할인점, 온라인 쇼핑몰, 홈쇼핑, 병원, 약국 1% 빅포인트 적립', 전월 이용금액에 관계없이 적립한도 없이 적립, '백화점 신세계·롯데·현대·갤러리아·동아·대구백화점, AK플라자, NC 대전 유성점', '할인점 이마트(에브리데이, 트레이더스 포함), 홈플러스, 롯데마트, 빅마켓', '온라인 쇼핑몰 G마켓, 옥션, 신세계몰, GS SHOP, CJ온스타일, 롯데i몰, 현대Hmall, 인터파크, 11번가', '홈쇼핑 GS SHOP, CJ온스타일, 롯데홈쇼핑, 현대홈쇼핑', 병원·약국 양방 병원(내과·외과·치과·피부과 포함) 및 약국]
