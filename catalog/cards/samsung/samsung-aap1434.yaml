open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: 상품안내장이 전월 이용금액에서 빼는 항목을 교육 할인 적용분만 적고 공통 제외 항목은 적지 않았다. 삼성카드 공통 기준으로 4대보험과 공과금과 학교납입금과 등록금과 아파트 관리비와 임대료와 기프트·선불카드와 상품권과 대중교통과 택시를 뺐다, assumed: 삼성카드 공통 제외}
  - {path: 'revisions[0].benefits', question: 안내장에 일반 가맹점 기본 적립률이 적혀 있지 않아 기본 적립을 넣지 않았다, assumed: no base}
  - {path: status, question: 상품 페이지가 자바스크립트로 그려져 판매 상태를 다시 확인하지 못해 색인 값 on_sale을 두었다, assumed: on_sale}
notes: 2026-10-13 상품안내장(2017.1판, 심의필 제2017-C1a-02598호) 확인. 2015-05-29 출시. 연회비 해외겸용 Mastercard 18,000원이고 국내전용은 삼성카드 5 V2로 발급되며 같은 18,000원이다. 커피·제과 10%는 전월 30만원 이상 월 5,000원, 교육 5%는 30만원 이상 5,000원, 60만원 이상 10,000원, 90만원 이상 20,000원 한도다. 특별 적립 1%와 해외 1%는 실적과 한도 없이 주고 해외 특별 1%는 전월 국내 50만원 이상 5,000P, 100만원 이상 10,000P 한도다. 안내장이 2017년판이라 이후 개정은 확인하지 못했다.
