        target: {all: true}
        when:
          - payment: [toss_pay]
          - {region: domestic}
        reward: {type: billing_discount, rate: 15}
        limits:
          - {shared: toss-online}
        tiers: {from: 300000}
        exclude_applied: 1
      - key: toss-shopping-15
