        source: manual
        evidence: ['10% 온라인쇼핑몰 쿠팡, 네이버플러스 스토어, SSG.COM, 롯데 ON, G마켓, 옥션, 11번가, 삼성카드쇼핑']
        target:
          merchants: [auction, coupang, eleven_st, gmarket, lotte_on, naver_plus_store, samsung_card_shopping, ssg_com]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: toss-online}
        tiers: {from: 300000}
        exclude_applied: 1
