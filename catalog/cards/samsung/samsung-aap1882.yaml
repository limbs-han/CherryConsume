        title: 인앱 결제 50% 할인
        source: manual
        evidence: ['인앱 결제 구글플레이, 앱스토어', '결제 수단에 해당 카드 등록 후 결제 시 혜택 제공(단, 간편결제건은 제외)']
        target:
          merchants: [app_store, google_play]
        when:
          - payment_not: [coupay, kakao_pay, l_pay, naver_pay, payco, samsung_pay, smile_pay, ssg_pay, toss_pay]
        reward: {type: billing_discount, rate: 50}
        limits:
          - {shared: digital}
        tiers: {from: 300000}
        exclude_applied: 1
      - key: digital-50
        title: 디지털콘텐츠 50% 할인
        source: manual
        evidence: [디지털콘텐츠 넷플릭스/디즈니+/유튜브/티빙 정기결제건, 디지털콘텐츠의 유튜브는 유튜브 프리미엄 결제건에 한함]
        target:
          merchants: [disney_plus, netflix, tving, youtube_premium]
        when:
          - billing: [subscription]
          - payment_not: [coupay, kakao_pay, l_pay, naver_pay, payco, samsung_pay, smile_pay, ssg_pay, toss_pay]
        reward: {type: billing_discount, rate: 50}
        limits:
          - {shared: digital}
        tiers: {from: 300000}
        exclude_applied: 1
      - key: starbucks-50
        title: 스타벅스 50% 할인
        source: manual
        evidence: [스타벅스 50% 결제일할인, '월 할인한도 : 5,000원', 전월 이용금액 30만원 이상 시 제공, '오프라인 결제건에 한하며, 백화점, 할인점, 쇼핑몰 등의 임대매장은 제외(단, 사이렌오더 결제건은 혜택 제공)']
        target:
          merchants: [starbucks]
        reward: {type: billing_discount, rate: 50}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
        exclude_applied: 1
        unmodeled: [매장 결제와 사이렌오더만 할인하고 백화점·할인점·쇼핑몰 임대매장은 제외한다]
      - key: overseas-2
        title: 해외 2% 할인
        source: manual
        evidence: ['전월 이용금액에 관계없이, 할인한도 없이 해외 2% 결제일할인', 해외 가맹점 및 해외 직접구매 이용건, 해외겸용카드에 한해 제공]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: billing_discount, rate: 2}
        unmodeled: [해외 온라인 거래 중 국내 가맹점으로 승인되는 결제는 할인하지 않는다]
    unmodeled: ['할인은 승인일 기준이고 실적은 승인일 기준이되 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다', 삼성카드의 다른 결제일할인 혜택과 겹치면 할인 금액이 큰 것 하나만 준다]
open_questions:
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-10 상품설명서(2025.7판, 심의필 2025-C1a-09823호) 대조. 카드 출시 2025-07-07. 연회비 해외겸용 Mastercard·국내전용 모두 15,000원(기본 7,000+제휴 8,000). 토스·온라인 15%/10% 네 혜택은 통합 한도 하나를 쓰고, 한 결제에 둘이 맞으면 큰 쪽 하나만 준다. 토스·온라인, 토스프라임·인앱·디지털, 스타벅스 할인 건은 실적에서 빠지고 해외 2% 건은 실적에 들어간다. 발급월+1개월까지는 30만원 미만이어도 30만 구간 혜택. 토스 앱으로 신청한다.
