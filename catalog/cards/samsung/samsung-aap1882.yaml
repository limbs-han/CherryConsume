        source: manual
        evidence: [토스프라임/인앱 결제/디지털콘텐츠 50% 결제일할인, 토스프라임 정기결제건, '전월 이용금액대별 통합 월 할인한도 30만원 이상 5,000원, 60만원 이상 7,000원, 100만원 이상 10,000원', '결제 수단에 해당 카드 등록 후 결제 시 혜택 제공(단, 간편결제건은 제외)']
        target:
          merchants: [toss_prime]
        when:
          - billing: [subscription]
          - payment_not: [coupay, kakao_pay, l_pay, naver_pay, payco, samsung_pay, smile_pay, ssg_pay, toss_pay]
        reward: {type: billing_discount, rate: 50}
        limits:
          - {shared: digital}
        tiers: {from: 300000}
        exclude_applied: 1
