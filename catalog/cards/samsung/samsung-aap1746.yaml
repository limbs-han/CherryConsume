notes: 2026-10-11 상품설명서(2023.5판, 심의필 2023-C1a-05578호) 대조. 혁신금융서비스로 청소년 자녀에게 발급하는 가족 신용카드이고 신청은 부모가 한다. 연회비 국내전용 1,000원(제휴 1,000). 전월 10만원 미만은 한도 없이 1%, 10만원 이상은 대중교통 2%와 편의점·배달앱·델리·커피전문점 8%를 각각 월 5,000원까지 주고 한도를 넘긴 다음 결제부터 1%다. 발급월+1개월까지는 10만 구간 혜택. 실적은 일시불·할부 이용금액이고 따로 적힌 실적 제외 대상이 없다. 할인 제외는 무이자할부, 삼성카드 할인 적용분, 기프트·선불카드, 상품권이다.
