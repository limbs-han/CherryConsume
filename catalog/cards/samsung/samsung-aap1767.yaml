open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품설명서 판(2026.6)의 첫날로 두었다. 부가서비스 변경 제한 기준일은 2022-06-02다, assumed: '2026-06-01'}
