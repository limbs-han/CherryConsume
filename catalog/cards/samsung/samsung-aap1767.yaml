notes: 2026-10-11 상품설명서(2026.6판, 심의필 2026-C1a-08052호) 대조. 연회비 해외겸용 Mastercard·VISA·UnionPay와 국내전용 모두 7,000원(기본 7,000). 기본 할인은 실적과 한도 없이 건별 10만원 미만 0.7%, 이상 1%다. 멤버십 50%와 영화는 전월 30만원 이상이고 발급월+1개월까지는 실적과 관계없이 준다. 실적 제외는 4대보험, 국세·지방세·공과금, 아파트 관리비, 임대료, 학교납입금, 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다. 할인 받은 이용금액과 무이자할부는 실적에 들어간다.
