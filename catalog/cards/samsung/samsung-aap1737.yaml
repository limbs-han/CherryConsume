open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택의 시행일을 확인하지 못해 상품설명서 판(2022.8)의 첫날로 두었다. 상품 출시일은 2021-10-21이다, assumed: '2022-08-01'}
  - {path: 'revisions[0].limits', question: '쇼핑, 생활 편의, 의료 영역마다 할인율과 통합 월 할인한도 표가 따로 있어 영역별 한도로 두었다. 세 영역 전체가 한 한도인지는 원문에 적혀 있지 않다', assumed: 영역별}
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-11 상품설명서(2022.8판, 심의필 2021-C1a-09228호)와 상품 페이지 대조. 출시 2021-10-21. 연회비 국내전용 5,000원, 해외겸용 없음. 신청 대상은 서민금융진흥원 햇살론카드 보증약정 체결 대상이다. 실적 제외는 4대보험, 국세·지방세·공과금, 학교납입금, 등록금, 대중교통, 택시, 아파트 관리비, 임대료, 상품권·선불 충전이고 할인받은 금액은 실적에 들어간다. 발급월+1개월까지는 30만 구간 혜택.
