schema_version: 2
id: samsung-id-on
issuer: samsung
name: 삼성 iD ON 카드
kind: credit
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
  - {scope: global, amount: 20000}
sources:
  - {id: page, kind: product_page, url: 'https://www.samsungcard.com/home/card/cardinfo/PGHPPCCCardCardinfoDetails001?code=AAP1731', fetched_at: &id001 2026-09-28}
checked_at: *id001
revisions:
  - effective_from: *id001
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 600000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, gift_card, tax, taxi, transit, utility]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 1
    benefits:
      - key: top-area-30
        title: 많이 쓰는 영역 30% 자동 할인
        target:
          merchants: [baemin, baskin_robbins, blue_bottle, coffee_bean, dunkin, ediya, paris_baguette, shake_shack, starbucks, subway, twosome, yogiyo]
        reward: {type: billing_discount, rate: 30}
        limits:
          - {per: month, amount: 10000}
        tiers: {from: 300000}
        notes: 커피전문점(스타벅스·이디야·커피빈·투썸·블루보틀), 배달앱(배민·요기요), 델리(쉐이크쉑·써브웨이·파리바게뜨·배스킨라빈스·던킨) 중 그 달 이용금액이 가장 큰 1개 영역만 30%. 커피·델리는 오프라인만, 임대매장 제외, 스타벅스 사이렌오더 포함. 배달앱은 공식 앱·홈페이지 결제만. 가족카드 미제공. 간편결제·키오스크 등 자체 가맹점번호 건 제외. 3%·1% 할인과 중복 적용
      - key: transit-telecom-streaming-10
        title: 교통·이동통신·스트리밍 10% 할인(30만원 이상)
        target:
          categories: [streaming, taxi, telecom, transit]
        reward: {type: billing_discount, rate: 10}
        limits:
          - per: month
            amount: {300000: 10000, 600000: 20000}
        tiers: {from: 300000}
        notes: 전월 30만원 이상 60만원 미만 구간 전용, 통합 월 10,000원. 교통은 버스·지하철·택시 오프라인만, 시외·고속버스 제외. 이동통신은 SKT·KT·LG U+·알뜰폰(SK텔링크, KT스카이라이프, KT M모바일, 헬로모바일, 미디어로그) 정기결제만, 결합상품·단말기·대리점 제외. 스트리밍은 넷플릭스·웨이브·티빙·왓챠·멜론·FLO 정기결제만, 간편결제·인앱결제 제외
      - key: easypay-overseas-1
        title: 온라인 간편결제·해외 1% 할인(30만원 미만)
        target:
          categories: [online_shopping]
        reward: {type: billing_discount, rate: 1}
        notes: 전월 30만원 미만일 때 한도 없이 1%. 30만원 이상 구간에서는 3% 한도를 넘긴 다음 결제부터 1%. 국내는 삼성페이·네이버페이·카카오페이·PAYCO·스마일페이·coupay·SSGPAY·L.PAY 온라인 결제만, 바코드·QR·NFC 오프라인 결제 제외. 해외는 해외겸용카드의 해외 가맹점·해외 직구
      - key: easypay-overseas-3
        title: 온라인 간편결제·해외 3% 할인(30만원 이상)
        target:
          categories: [online_shopping]
        reward: {type: billing_discount, rate: 3}
        limits:
          - per: month
            amount: {300000: 5000, 600000: 10000}
        tiers: {from: 300000}
        notes: 전월 30만원 이상 60만원 미만 구간 전용, 통합 월 5,000원. 한도 초과 후 1%. 대상 조건은 -t0과 같음
notes: '연회비는 실물카드 기준. 모바일카드는 국내·해외 모두 15,000원. 실적은 매월 1일~말일 일시불·할부 이용금액. 할인 제외는 온라인 간편결제·해외 3%, 교통·이동통신·스트리밍 10% 할인이 적용된 건 전체금액만이고, 30% 맞춤할인과 1% 할인 건은 실적에 들어감. 실적 제외 중 업종 코드 없는 것: 초·중·고 학교납입금, 대학 등록금, 부동산 임대료, 선불카드·전자지급수단 구매·충전, 현금서비스, 카드론, 수수료·이자, 연체료. 건강보험 등 사회보험료는 삼성카드가 공과금으로 분류. 실적과 할인은 승인 시점 기준, 해외·무승인 건은 매출전표 접수 시점 기준. 취소는 매출취소전표 접수월에서 뺌. 공식 문구 미확인: 할부를 결제 달에 전액 인정하는지. 무이자할부, 다른 행사 할인 적용 건은 할인 대상 아님. 삼성카드 다른 결제일할인과 중복 시 큰 것만 적용. 본인·가족카드 실적과 한도 합산. 발급월+1개월까지는 실적 미달이어도 30만원 구간 혜택 제공.'
