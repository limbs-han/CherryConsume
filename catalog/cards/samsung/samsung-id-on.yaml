  - effective_from: 2026-07-30
    source: disclosure
    patch:
      benefit_exclusions:
        unmodeled: [삼성카드의 다른 행사 혜택이 적용된 일시불과 할부 이용금액은 할인하지 않는다, '자체 가맹점번호로 승인되는 일부 결제(간편결제, 키오스크 등)는 할인하지 않는다']
open_questions:
  - {path: 'revisions[0].benefits', question: 할인 금액의 원 미만을 어떻게 처리하는지 공식 문구에 없다. 모든 할인에 같은 가정을 쓴다, assumed: floor}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 초·중·고등학교 학교납입금을 education.school_fee로 옮겼다. 이 업종에 유치원 납입금도 들어 있어 유치원 납입금까지 빠진다, assumed: education.school_fee}
notes: '첫 개정 시행일 근거: disclosure. 실적 제외의 대중교통은 페이지 정의대로 시내버스와 지하철로 담았다. 카드 출시일자 2021-09-01(상품 페이지와 상품약관 공시). 상품약관 공시의 변경이력은 2021-09-24과 2022-08-14 안내 문구, 2026-07-30 모바일카드 추가와 할인 제외 문구(삼성카드 할인이 적용된 건 → 삼성카드의 다른 행사 혜택이 적용된 건) 등이다. 2026-06-29 공지는 유의사항만 바뀌고 혜택은 같다고 밝혔다. 2026-07-30의 할인 제외 문구 변경은 계산에 영향이 없지만 문장이 바뀌어 benefit_exclusions.unmodeled만 바꾸는 patch 개정으로 나눴다. 공지사항 400건(2007~2026-09)과 옛 서비스변경안내 105건(~2023-03)을 끝까지 봤고 부가서비스 변경 공지는 없다(2023-02-08 디자인 변경만). 연회비는 Mastercard 본인 실물 20,000원(기본 7,000+제휴 13,000), 모바일 15,000원, 가족 13,000원. 실적은 매월 1일~말일 일시불·할부 이용금액. 실적 제외: 3%와 10% 할인이 적용된 전체 금액, 사회보험료·장애인 고용부담금, 국세·지방세·공과금, 초·중·고 학교납입금, 대학 등록금, 대중교통, 택시, 아파트 관리비, 부동산 임대료, 기프트·선불카드 구매와 충전, 상품권. 30% 할인과 1% 할인 건은 실적에 들어간다. 현금서비스, 카드론, 수수료·이자, 연체료, 연회비는 결제 기록이 아니라 다루지 않는다. 삼성카드는 전기요금, 사회보험료, 우편요금, 도시가스요금, 여권 발급비용, 상하수도요금, 과태료·범칙금·벌금, 공공기관 가맹점을 공과금으로 분류한다. 취소는 매출취소전표 접수월에서 뺀다. 발급월+1개월까지는 30만원 미만이어도 30만 구간 혜택. 10%와 3% 한도는 30만 구간과 60만 구간에 모두 있다. 결제일할인은 다음 달 15일 이후 결제대금에서 빠진다.'
