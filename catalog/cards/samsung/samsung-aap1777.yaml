          categories: [fuel]
        when:
          - {region: domestic}
        reward: {type: points, program: samsung_bigpoint, rate: 1.5}
        unmodeled: [LPG충전소는 1.5%를 적립하지 않는다]
    unmodeled: ['연 2가지 고르는 기프트(호텔·골프 25만원 현장할인, 삼성물산 패션 25만원, 신라면세점 27만원 결제일할인, 신세계상품권 25만원)와 공항 라운지(월 6회, 연 12회)는 계산하지 않는다', 1.5% 영역의 동화·HDC신라·JDC·JTO 면세점과 여행(호텔·콘도·리조트 국내 오프라인)은 가맹점이 없거나 업종이 더 넓어 담지 않았다. 이 결제는 국내 1.2%로 계산한다, 본인카드와 가족카드의 이용실적은 합산한다, 삼성카드의 다른 결제일할인과 중복되지 않고 큰 금액만 적용한다, '전월 이용금액은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다', 전월 50만원 이상 라이프스타일 5만원 할인 월 1회 연 3회는 발급월부터 12개월로 세어 계산하지 않는다]
