        when:
          - {region: domestic}
        reward: {type: points, program: samsung_bigpoint, rate: 1.5}
        unmodeled: [면세점 임대매장은 1.5%를 적립하지 않는다]
      - key: airline-1-5
        title: 항공 1.5% 빅포인트 적립
        source: manual
        evidence: ['항공 대한항공, 아시아나항공, 제주항공, 진에어, 티웨이항공', '항공은 항공사 공식 홈페이지/앱을 통한 결제건에 한하며, 다른 여행사, 항공권 구매 대행 사이트를 통한 결제건은 제외됩니다.']
        target:
          merchants: [asiana_airlines, jeju_air, jin_air, korean_air, tway_air]
        when:
          - {channel: online}
        reward: {type: points, program: samsung_bigpoint, rate: 1.5}
