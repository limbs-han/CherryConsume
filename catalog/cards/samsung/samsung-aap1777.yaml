        source: manual
        evidence: ['전월 이용금액에 관계없이, 적립한도 없이 해외/면세점/항공/여행/주유 이용금액의 1.5% 빅포인트를 적립해 드립니다.', 해외 가맹점 및 해외 직접구매 이용건, 해외는 해외겸용카드에 한해 제공됩니다.]
