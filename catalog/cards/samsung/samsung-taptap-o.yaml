notes: >-
  실적은 "전월 일시불 및 할부 이용금액". 공식 문구 미확인: 전월 1일~말일 기준 명시, 할부 인정 방식, 취소 반영 달.
  실적 제외 중 업종 코드 없는 것: 대학 등록금, 선불카드 충전. 할인 적용 건은 할인 전 총액이 실적에서 빠짐.
  무이자할부 결제는 할인 대상 아님(실적 제외 여부는 공식 문구에 없음).
  발급월+1개월까지는 실적 무관 제공(영화는 연 12회 한도에 포함).
  라이프스타일 옵션 패키지 6개 중 1개를 골라 앱에서 매월 변경. 골라진 패키지의 커피 1개, 쇼핑 7% 1개, 나머지 쇼핑 2개 1% 적립만 적용되며 pkg- 혜택은 모두 선택지로 나열함.
  결제 건 혜택 아님: 컨택리스 결제 지원.
