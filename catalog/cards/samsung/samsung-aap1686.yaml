notes: 2026-10-13 상품안내장(2025.11판, 심의필 2025-C1a-16538호) 대조. 출시 2020-09-29. 연회비 해외겸용 Mastercard·국내전용 모두 15,000원(기본 7,000+제휴 8,000). 구독료 할인은 매월 3일 적용되고 월 1회 구간별 정액이다. 이 계산은 구독료 결제에 구간별 금액까지 구독료를 깎는 것으로 옮겼다. 발급월+1개월까지는 30만 구간 혜택. 실적 제외는 무이자할부, 4대보험, 국세·지방세·공과금, 아파트 관리비, 임대료, 학교납입금, 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다. 할인받은 이용금액은 실적에 들어간다.
