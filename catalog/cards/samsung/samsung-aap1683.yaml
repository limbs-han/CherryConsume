notes: 2026-10-13 상품안내장(2026.1판, 심의필 제2026-C1a-00118호) 대조. 연회비 국내전용과 해외겸용 Mastercard 모두 15,000원(기본 7,000+제휴 8,000). 발급월+1개월까지는 전월 40만원 미만이어도 40만원 구간 혜택을 준다.
