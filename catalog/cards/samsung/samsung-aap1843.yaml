schema_version: 2
id: samsung-aap1843
issuer: samsung
name: 단비교육 삼성카드
short_name: 단비교육 삼성
search_names: [단비교육, 단비교육 삼성카드, 윙크 삼성카드]
kind: credit
product_codes: [AAP1843]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 15000}
  - {scope: global, brand: visa, amount: 15000}
sources:
  - {id: page, kind: product_page, url: 'https://www.samsungcard.com/home/card/cardinfo/PGHPPCCCardCardinfoDetails001?code=AAP1843', fetched_at: 2026-10-11}
  - {id: manual, kind: manual_pdf, url: 'https://www.samsungcard.com/filedownload.do?grpNo=1zPVy1PuFbwGC7xZyM4qtmr82jlimUW0apTjYBYQm%2F0%3D&sn=1', fetched_at: 2026-10-11}
checked_at: 2026-10-11
revisions:
  - effective_from: 2024-09-20
    source: manual
    tiers: [0, 300000, 700000, 1200000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, taxi, transit.bus_city, transit.subway, utility]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 0
    new_card: {until: next_month_end, tier: 300000, from: issue}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [삼성카드 할인이 적용된 일시불·할부 이용금액은 할인하지 않는다, '자체 가맹점번호로 승인되는 일부 결제(간편결제, 키오스크 등)는 할인하지 않는다']
    limits:
      - {key: living, per: month, count: 3}
    benefits:
      - key: danbi
        title: 단비교육 온라인 결제 7,000~12,000원 할인
        source: manual
        evidence: ['단비교육(윙크, 캐츠홈) 온라인 결제금액 7,000~12,000원 결제일할인', '전월 이용금액대별 통합 월 할인한도 30만원 이상 7,000원, 70만원 이상 9,000원, 120만원 이상 12,000원', '단비교육 온라인 결제금액이 월 할인한도보다 적을 경우, 결제금액만큼 할인 적용', '단비교육 공식 홈페이지(www.wink.co.kr, https://parents.cats4me.net/login) 또는 윙크 학부모 앱을 통한 결제건에 한함']
        target:
          merchants: [danbi_education]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {300000: 7000, 700000: 9000, 1200000: 12000}
        tiers: {from: 300000}
      - key: living-autopay
        title: 생활요금 정기결제 1,000원 할인
        source: manual
        evidence: ['아파트 관리비/4대 사회보험/보험/이동통신/인터넷, 유선통신 건별 10,000원 이상 정기결제 시 1,000원 결제일할인', '이동통신 SKT/KT/LG U+/알뜰폰(SK텔링크, KT스카이라이프, KT M모바일, 헬로모바일, 미디어로그) 이동통신요금', '인터넷, 유선통신 SK브로드밴드/KT/LG U+ 인터넷요금 및 유선통신요금', 통합 월 3회 제공, 전월 이용금액 30만원 이상 시 제공]
        target:
          categories: [apartment_fee, insurance.social]
          merchants: [hello_mobile, kt, kt_m_mobile, kt_skylife, lg_uplus, media_log, sk_broadband, sk_telink, skt]
        when:
          - amount: {min: 10000}
          - billing: [autopay, subscription]
        reward: {type: billing_discount, fixed: 1000}
        limits:
          - {shared: living}
        tiers: {from: 300000}
        unmodeled: ['결합상품요금, 사물인터넷(IoT) 요금, 단말기 구매금액, 대리점 카드 결제는 할인하지 않는다']
      - key: insurance
        title: 보험료 1,000원 할인
        source: manual
        evidence: ['보험 생명보험, 손해보험(자동차보험, 화재보험, 운전자보험, 상해보험 등)', 보험은 일반 결제건도 제공, 건별 10, 000원 이상, 통합 월 3회 제공]
        target:
          categories: [insurance.private]
        when:
          - amount: {min: 10000}
        reward: {type: billing_discount, fixed: 1000}
        limits:
          - {shared: living}
        tiers: {from: 300000}
    unmodeled: [삼성카드의 다른 결제일할인과 중복되지 않고 큰 금액만 적용한다, '할인과 실적은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다']
open_questions:
  - {path: 'revisions[0].benefits', question: 할인의 원 미만 처리가 공식 문구에 없다, assumed: floor}
  - {path: 'revisions[0].benefits[danbi].target', question: 단비교육(윙크·캐츠홈) 가맹점이 공통 파일에 없어 danbi_education을 새로 제안했다, assumed: danbi_education}
notes: 2026-10-11 상품안내장(2024.10판, 심의필 2024-C1a-11771호) 확인. 출시 2024-09-20. 연회비 해외겸용 VISA·국내전용 모두 15,000원(기본 7,000+제휴 8,000). 단비교육 할인은 결제금액만큼 월 한도까지 차감한다. 발급월+1개월까지는 30만 구간 혜택을 준다. 실적 제외는 무이자할부, 4대보험, 국세·지방세·공과금, 아파트 관리비, 임대료, 유치원·초중고 납입금, 대학 등록금, 후불교통·모바일교통 대중교통, 택시, 기프트·선불카드, 상품권이다.
