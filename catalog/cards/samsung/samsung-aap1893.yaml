        source: manual
        evidence: [편의점/배달앱 5% 결제일할인, '배달앱 배달의민족, 쿠팡이츠, 요기요', '배달앱은 공식 홈페이지/앱을 통한 결제건에 한하며, 가맹점 직접 결제건은 제외']
