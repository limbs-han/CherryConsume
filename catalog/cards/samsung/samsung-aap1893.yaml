    unmodeled: ['LG U+ 라이트할부 이용 시 결제대금 차감(전월 40만원 이상 10,000원, 80만원 이상 15,000원, 120만원 이상 20,000원, 월 1회)은 결제 하나에 붙는 혜택이 아니라 계산하지 않는다. 라이트할부 이용 여부는 혜택 제공월의 전월 말일 기준이다', 삼성카드의 다른 결제일할인과 중복되지 않고 큰 금액만 적용한다, '전월 이용금액은 승인일 기준이고 해외 결제와 무승인 결제(대중교통, 정기결제 등)는 매출전표 접수일 기준이다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일 2025-11-03과 상품설명서 2025.11판을 시행일로 두었다, assumed: '2025-11-03'}
  - {path: 'revisions[0].spend.exclude_categories', question: 삼성카드는 사회보험료를 공과금으로 분류해 insurance.social도 뺐다. 이 카드는 대중교통과 택시를 실적에서 빼지 않는다, assumed: 'insurance.social 포함, 교통 제외 없음'}
  - {path: 'revisions[0].benefits[uplus-telecom].when', question: LG U+ 통신요금 정기결제를 자동납부로 보았다. 정기결제 2건 이상이면 통합 한도 안에서 할인한다, assumed: 'billing: autopay'}
notes: 2026-10-10 상품설명서(2025.11판, 여신금융협회 심의필 제2025-C1a-16018호)와 상품 페이지 대조. KT 할부 S(samsung-aap1839)와 같은 구조에 통신사만 LG U+다. 연회비 국내전용과 해외겸용 Mastercard·JCB 모두 25,000원(기본 7,000+제휴 18,000). LG U+ 24/36개월 라이트할부는 최소 10만원, 연 5.9%·7.0% 할부수수료다. 라이트할부를 이용 중이면 통신요금 할인 대신 결제대금 차감을 받고 완납 다음 달부터 통신요금 할인으로 바뀐다. 차감은 계산하지 않아 using 선택지는 미지원이다. 발급월+1개월까지 통신요금은 40만 구간, 커피·편의점·배달앱은 80만 구간 혜택을 준다. 실적 제외는 무이자할부, 4대보험, 국세·지방세·공과금, 아파트관리비, 부동산 임대료, 유치원·초중고 납입금, 대학 등록금, 기프트·선불카드 구매와 충전, 상품권이다. 할인 받은 결제도 실적에 넣는다.
