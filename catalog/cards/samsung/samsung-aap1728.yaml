notes: 2026-10-11 상품안내장(2026.6판) 확인. 출시 2021-09-01. 연회비 실물 해외겸용 Mastercard·VISA와 국내전용 모두 20,000원(기본 7,000+제휴 13,000). 모바일카드는 15,000원(해외겸용)과 13,000원(국내전용)이다. 많이 쓰는 영역 5%는 백화점·할인점·슈퍼마켓 중 이번 달 이용액이 가장 큰 한 영역에만 주고 0.5%와 더해 받는다. 주유·이동통신·아파트 관리비 2.5%는 한도를 넘으면 다음 결제부터 0.5%다. 실적 제외는 4대보험, 국세·지방세·공과금, 임대료, 초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다. 아파트 관리비와 무이자할부는 실적에 넣는다.
