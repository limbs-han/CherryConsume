        source: manual
        evidence: [이동통신·스트리밍 10% 결제일할인, 'SKT, KT, LG U+, 알뜰폰(SK텔링크, KT스카이라이프, KT M모바일, 헬로모바일, 미디어로그) 이동통신요금 정기결제건', '40만원 이상 5,000원, 80만원 이상 12,000원', '알뜰폰의 경우, 결합상품요금, 휴대전화 등 단말기 구매금액 및 대리점 카드 결제건 제외']
        target:
          merchants: [hello_mobile, kt, kt_m_mobile, kt_skylife, lg_uplus, media_log, sk_telink, skt]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: telecom-streaming}
        tiers: {from: 400000}
        exclude_applied: 1
