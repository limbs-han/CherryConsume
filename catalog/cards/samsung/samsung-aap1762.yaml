        evidence: ['철도 철도(KTX, SRT 포함)']
        target:
          categories: [transit.rail]
          merchants: [korail, srt]
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 1.5}
        limits:
          - {shared: travel}
