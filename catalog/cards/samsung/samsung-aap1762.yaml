      - key: streaming-10
        title: 스트리밍 정기결제 10% 할인
        source: manual
        evidence: ['스트리밍 넷플릭스, 웨이브, 티빙, 왓챠, 멜론, FLO 정기결제건', 스트리밍은 앱스토어를 통한 결제건(인앱 결제) 제외]
        target:
          merchants: [flo, melon, netflix, tving, watcha, wavve]
        when:
          - billing: [subscription]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: telecom-streaming}
        tiers: {from: 400000}
        exclude_applied: 1
      - key: coffee-cvs-10
        title: 커피전문점·편의점 10% 할인
        source: manual
        evidence: [커피전문점·편의점 10% 결제일할인, '커피전문점 스타벅스, 이디야커피, 투썸플레이스, 커피빈, 블루보틀', '편의점 CU, GS25, 세븐일레븐, 이마트24', '40만원 이상 3,000원, 80만원 이상 6,000원', '오프라인 결제건에 한하며, 백화점, 할인점, 쇼핑몰 등의 임대매장은 제외']
        target:
          merchants: [blue_bottle, coffee_bean, cu, ediya, emart24, gs25, seven_eleven, twosome]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: coffee-cvs}
        tiers: {from: 400000}
        exclude_applied: 1
        unmodeled: [백화점·할인점·쇼핑몰 임대매장은 할인하지 않는다]
      - key: starbucks-10
        title: 스타벅스 10% 할인
        source: manual
        evidence: ['단, 스타벅스의 경우, 사이렌오더 결제건도 혜택 제공']
        target:
          merchants: [starbucks]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: coffee-cvs}
        tiers: {from: 400000}
        exclude_applied: 1
        unmodeled: [매장 결제와 사이렌오더만 할인하고 임대매장은 제외한다]
      - key: overseas-1-5
        title: 해외 1.5% 할인
        source: manual
        evidence: ['전월 이용금액에 관계없이, 해외·항공·철도 1.5% 결제일할인', 해외 가맹점 및 해외 직접구매 이용건, '통합 월 할인한도 : 50만원', 해외는 해외겸용카드에 한해 제공]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: billing_discount, rate: 1.5}
        limits:
          - {shared: travel}
      - key: airline-1-5
        title: 항공 1.5% 할인
        source: manual
        evidence: ['항공 대한항공, 아시아나항공, 제주항공, 티웨이항공, 진에어', '항공은 공식 홈페이지·앱을 통한 결제건에 한하며, 다른 여행사, 항공권 구매 대행 사이트를 통한 결제건은 제외']
        target:
          merchants: [asiana_airlines, jeju_air, jin_air, korean_air, tway_air]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 1.5}
        limits:
          - {shared: travel}
