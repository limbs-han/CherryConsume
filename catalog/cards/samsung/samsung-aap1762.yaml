open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일은 2022-04-29이고 상품설명서는 2026.6판(제2026-C1a-08319호)이다. 출시일을 시행일로 두었다, assumed: '2022-04-29'}
  - {path: 'revisions[0].benefits[mobile-10].when', question: 이동통신요금 정기결제를 자동납부로 보았다, assumed: 'billing: autopay'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통을 시내버스와 지하철로 보았다. 초중고 납입금은 유치원을 함께 담은 education.school_fee도 뺐다, assumed: 'transit.bus_city, transit.subway, education.school_fee'}
  - {path: annual_fees, question: '모바일카드 연회비는 15,000원(기본 2,000+제휴 13,000)이지만 연회비 칸에 실물카드와 모바일카드를 나눌 수 없어 실물카드 값만 두었다', assumed: 20000}
  - {path: status, question: 상품 페이지에서 판매 상태를 다시 확인하지 못해 색인 값 on_sale을 두었다, assumed: on_sale}
notes: 2026-10-10 상품설명서(2026.6판, 여신금융협회 심의필 제2026-C1a-08319호) 확인. 실물카드 연회비 국내전용과 해외겸용 Mastercard·VISA·JCB 모두 20,000원(기본 7,000+제휴 13,000), 모바일카드 15,000원. 발급월+1개월까지 40만 구간 혜택을 준다. 10% 할인 받은 결제는 실적에서 빠진다. 해외·항공·철도 1.5%는 실적과 관계없고 통합 월 할인한도 50만원이다. 실적 제외는 4대보험, 국세·지방세, 공과금, 아파트관리비, 임대료, 초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다.
