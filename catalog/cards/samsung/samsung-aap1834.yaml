open_questions:
  - {path: 'revisions[0].effective_from', question: 상품 출시일 2024-05-03과 상품설명서 2024.5판을 시행일로 두었다, assumed: '2024-05-03'}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외의 대중교통에 후불교통 같은 한정이 없다. 시내버스와 지하철만 뺐고 철도와 시외·고속버스는 실적에 남겼다. 삼성카드는 사회보험료를 공과금으로 분류해 insurance.social도 뺐다, assumed: 'transit.bus_city, transit.subway, insurance.social'}
  - {path: 'revisions[0].benefits[bill-10].when', question: 생활요금 정기결제를 자동납부나 정기결제로 보았다, assumed: 'billing: autopay, subscription'}
  - {path: 'revisions[0].limits', question: 생활요금과 일상 필수 영역은 안내장에 각자 통합 월 할인한도 표가 있어 따로 두었다, assumed: 따로}
notes: 2026-10-10 상품설명서(2024.5판, 여신금융협회 심의필 제2024-C1a-05083호)와 상품 페이지 대조. 연회비 국내전용과 해외겸용 VISA 모두 20,000원(기본 7,000+제휴 13,000). 하나투어 12/24개월 라이트할부는 하나투어 공식 홈페이지·앱에서 5만원 이상, 연 6.5% 할부수수료다. 라이트할부 이용 여부에 따라 생활요금과 일상 필수 영역 할인율이 미이용 10%, 이용 5%로 바뀐다. 발급월+1개월까지 50만 구간 혜택을 준다. 생활요금과 일상 필수 영역 할인을 받은 결제는 실적에서 빠진다. 실적 제외는 그 밖에 무이자할부, 4대보험, 국세·지방세·공과금, 아파트관리비, 부동산 임대료, 유치원·초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다.
