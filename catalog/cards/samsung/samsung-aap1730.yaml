open_questions:
  - {path: 'revisions[0].effective_from', question: 부가서비스 변경 제한 기준일 2021-09-01을 시행일로 두었다. 대조한 상품안내장은 2026.6판(심의필 2026-C1a-08545호)이다, assumed: '2021-09-01'}
  - {path: 'revisions[0].benefits', question: 포인트의 원 미만 처리가 공식 문구에 없다, assumed: floor}
notes: 2026-10-11 상품안내장(2026.6판, 심의필 2026-C1a-08545호) 대조. 할인형 SFC iD ALL(AAP1728)의 빅포인트 적립형이다. 연회비 실물 해외겸용 Mastercard·UnionPay와 국내전용 모두 20,000원(기본 7,000+제휴 13,000), 모바일카드 15,000원, 가족 실물 13,000원. 많이 쓰는 영역 5%는 백화점·할인점·슈퍼마켓 중 이번 달 이용액이 가장 큰 한 영역에만 주고 0.5%와 더해 받는다. 주유·이동통신·아파트 관리비는 기본 0.5%에 2%를 더 주고 통합 한도를 넘으면 0.5%만 준다. 실적 제외는 4대보험, 국세·지방세·공과금, 임대료, 초중고 납입금, 대학 등록금, 대중교통, 택시, 기프트·선불카드, 상품권이다. 아파트 관리비와 무이자할부는 실적에 넣는다. 포인트는 다음 달 15일 적립, 1P=1원.
