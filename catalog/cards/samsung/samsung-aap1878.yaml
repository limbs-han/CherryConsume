notes: 2026-10-10 상품설명서(2025.8판, 심의필 2025-C1a-09517호) 대조. 카드 출시 2025-07-02. 연회비 해외겸용 Mastercard·국내전용 모두 20,000원(기본 7,000+제휴 13,000). SELECT 옵션은 셋 중 하나를 고르고 매월 바꿀 수 있으며 신청 다음 달 1일에 반영된다. 음식점·온라인몰 할인이 적용된 이용금액만 실적에서 빠지고 생활 편의 5%, 인앱·디지털 50%, 간편결제 1%, 해외 2% 건은 실적에 들어간다. 이 카드는 실적 제외에 대중교통과 택시가 없다. 발급월+1개월까지는 30만원 미만이어도 30만 구간 혜택. 같은 혜택의 일반 상품 삼성 iD SELECT ON(AAP1877)이 따로 있다.
