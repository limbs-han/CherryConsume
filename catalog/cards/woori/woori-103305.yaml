notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-02-29. 연회비 12,000원. 전월 국내 30만 이상 커피 4개 브랜드 55% 건당 3,300원 월 1만1천원(11~12월 2만2천원), 시내버스·지하철·택시 33% 건당 2,200원 월 5,500원, 편의점 11% 건당 1,100원 월 3,300원, 영화 9,900원 이상 5,500원 월 1회. 할인 받은 매출 전액 실적 제외. 공과금에 4대보험이 들어간다고 보고 실적에서 뺐다.
