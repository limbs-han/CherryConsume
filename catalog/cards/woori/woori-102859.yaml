          merchants: [sk_intellix]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - {shared: intellix-cap}
        tiers: {from: 300000}
    unmodeled: [SK인텔릭스 우리카드의 가족카드는 청구할인이 적용되지 않는다, 카드 재발급 뒤 자동납부 재신청이 필요하고 할부 중단이나 한도 부족이면 할인이 안 된다, 가족카드 이용금액은 본인카드 실적에 합산된다, 해외가맹점과 교통카드와 통신료 자동납부 금액은 매출표 접수일 기준으로 그 달 실적에 넣는다, 국내가맹점 취소가 매월 1~2일에 접수되면 전월 실적에서 뺀다, 신규 특례는 사용등록일과 사용개시일 중 빠른 날부터 다음 달 말일까지다, 고속버스는 차내단말기와 앱 결제만 실적 제외인데 고속버스 전체를 뺐다]
open_questions:
  - {path: 'revisions[0].benefits', question: 원 미만 처리 문구가 없다, assumed: floor}
notes: 2026-10-13 공식 상품 페이지를 브라우저로 열어 확인했다. 상품 출시일 2023-12-07. 연회비는 본인 15,000원이며 가족카드는 없다. 이 카드로 할인받은 이용금액 전체가 실적에서 빠진다.
