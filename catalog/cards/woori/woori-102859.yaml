        source: page
        evidence: ['전월 국내외 가맹점 이용실적 30만원 이상 ~ 70만원 미만 월 할인한도 10,000원', '70만원 이상 ~ 120만원 미만 15,000원', '120만원 이상 20,000원', 'SK인텔릭스 구독료 자동납부 이용 시에만 적용되며, 자동납부가 아닌 일반결제는 할인 적용 불가', '월 청구금액이 8,000원인 경우 8,000원 할인 적용']
