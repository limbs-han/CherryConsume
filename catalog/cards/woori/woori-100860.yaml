    limits:
      - key: integrated
        per: month
        amount: {300000: 30000, 600000: 40000, 900000: 60000}
      - key: shopping
        per: month
        amount: {300000: 4000, 600000: 8000, 900000: 16000}
      - key: care
        per: month
        amount: {300000: 3000, 600000: 6000, 900000: 12000}
      - key: untact
        per: month
        amount: {300000: 3000, 600000: 6000, 900000: 12000}
