schema_version: 2
id: woori-102860
issuer: woori
name: 카드의정석 햇살론카드
kind: credit
product_codes:
  - '102860'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 10000}
sources:
  - {id: page, kind: product_page, url: 'https://pc.wooricard.com/dcpc/yh1/crd/crd01/H1CRD101S02.do?cdPrdCd=102860', fetched_at: '2026-10-11', review_no: 제2026-C1a-12081호}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2023-12-28'
    source: page
    tiers: [0, 300000, 600000, 1200000]
    spend:
      basis: prev_calendar_month
      regions: [domestic]
      exclude_categories: [annual_fee]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_express, utility]
      unmodeled: ['우편요금, 과태료·벌금, 여권발급비, 국가·공공기관 가맹점 이용금액과 수수료·이자는 적립에서 빠진다']
    limits:
      - key: points
        per: month
        amount: {300000: 10000, 600000: 20000, 1200000: 50000}
    benefits:
      - key: base-0-8
        title: 국내 기본 0.8% 모아포인트
        source: page
        evidence: [기본 | 상기 가맹점 외 국내 적립 대상 가맹점 | 0.8%, 기본적립과 특별적립은 중복 적용되지 않음, 전월 국내 가맹점 이용 실적 30만원 이상 시 적립, 결제건당 1만원 미만금액 적립 제외, 기본/특별 통합 월 적립한도 | 1만점 | 2만점 | 5만점]
        target: {all: true}
        when:
          - {region: domestic}
          - amount: {min: 10000}
        reward: {type: points, program: woori_moa_point, rate: 0.8}
        limits:
          - {shared: points}
        tiers: {from: 300000}
      - key: special-3-mobile
        title: 이동통신 자동납부 3% 모아포인트
        source: page
        evidence: ['특별 | 이동통신, 대중교통, 커피, 영화 | 3%', 'SKT, KT, LGU+, 헬로모바일, KTM모바일, U+유모바일', '휴대전화 요금에 한하며, 본 카드로 대상 통신사에 자동납부 신청 후 결제한 건에 대해서만 적립', '인터넷, 유선전화 등 결합상품 신청 시에는 적립 제외']
        target:
          categories: [telecom.mobile]
          merchants: [hello_mobile, kt_m_mobile]
        when:
          - billing: [autopay]
          - amount: {min: 10000}
        reward: {type: points, program: woori_moa_point, rate: 3}
        limits:
          - {shared: points}
        tiers: {from: 300000}
        unmodeled: [인터넷·유선전화 결합상품을 신청하면 적립에서 빠진다, 'SKT, KT, LG U+ 가맹점은 인터넷 요금과 구분되지 않아 휴대전화 요금 업종으로 기록한 결제만 계산한다', U+유모바일은 공통 가맹점이 없어 휴대전화 요금 업종으로 기록한 결제만 계산한다]
      - key: special-3-transit
        title: 버스·지하철 3% 모아포인트
        source: page
        evidence: ['대중교통 | 명세서에 교통-버스, 교통-지하철로 표시되는 매출', '고속버스, 시외버스, 공항버스, 공항철도(직통열차) 이용금액 적립 제외']
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - amount: {min: 10000}
        reward: {type: points, program: woori_moa_point, rate: 3}
        limits:
          - {shared: points}
        tiers: {from: 300000}
        unmodeled: ['공항버스, 공항철도 직통열차는 빠진다']
      - key: special-3-coffee
        title: 커피 3% 모아포인트
        source: page
        evidence: ['커피 | 스타벅스, 엔제리너스, 이디야', '커피브랜드의 상품권, 선불카드 구매/충전 등의 이용금액은 적립 제외', '백화점/대형마트 내 매장, 미군부대 매장 제외']
        target:
          merchants: [angel_in_us, ediya, starbucks]
        when:
          - amount: {min: 10000}
        reward: {type: points, program: woori_moa_point, rate: 3}
        limits:
          - {shared: points}
        tiers: {from: 300000}
        unmodeled: ['백화점·대형마트 안 매장, 미군부대 매장은 빠진다']
      - key: special-3-movie
        title: 영화 3% 모아포인트
        source: page
        evidence: ['영화 | CGV, 롯데시네마', 예매 대행사이트를 통해 결제 시 적립 제외]
        target:
          merchants: [cgv, lotte_cinema]
        when:
          - amount: {min: 10000}
        reward: {type: points, program: woori_moa_point, rate: 3}
        limits:
          - {shared: points}
        tiers: {from: 300000}
        unmodeled: [예매 대행사이트 결제는 빠진다]
      - key: special-1-offline
        title: 백화점·대형마트 오프라인 1% 모아포인트
        source: page
        evidence: ['백화점, 대형마트, 온라인쇼핑, 주유 | 1%', '신세계백화점, 현대백화점, 롯데백화점 ※ 온라인결제 적립 제외', '이마트, 홈플러스, 롯데마트, 롯데마트맥스, 트레이더스 홀세일클럽 ※ 온라인결제 적립 제외']
        target:
          merchants: [emart, homeplus, hyundai_department, lotte_department, lotte_mart, lotte_mart_max, shinsegae_department, traders]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward: {type: points, program: woori_moa_point, rate: 1}
        limits:
          - {shared: points}
        tiers: {from: 300000}
      - key: special-1-online
        title: 온라인쇼핑 1% 모아포인트
        source: page
        evidence: ['11번가, G마켓, 옥션, 롯데ON, 쿠팡, 티몬, 롯데홈쇼핑, 우리WON마켓', '쿠팡 : 일반결제 및 쿠페이 결제 시 적립 제공 (와우멤버십 및 기타 간편결제 건 적립 제외)']
        target:
          merchants: [auction, coupang, eleven_st, gmarket, lotte_homeshopping, lotte_on, tmon]
        when:
          - payment_not: [kakao_pay, naver_pay, toss_pay]
          - amount: {min: 10000}
        reward: {type: points, program: woori_moa_point, rate: 1}
        limits:
          - {shared: points}
        tiers: {from: 300000}
        unmodeled: [우리WON마켓은 공통 가맹점이 없어 계산하지 않는다, 쿠팡은 일반결제와 쿠페이만 적립한다. 간편결제를 넣지 않은 결제는 일반결제로 본다]
      - key: special-1-fuel
        title: 주유 1% 모아포인트
        source: page
        evidence: ['SK주유소, GS칼텍스, HD현대오일뱅크, S-OIL', LPG충전소 제외]
        target:
          merchants: [gs_caltex, hd_oilbank, s_oil, sk_energy]
        when:
          - amount: {min: 10000}
        reward: {type: points, program: woori_moa_point, rate: 1}
        limits:
          - {shared: points}
        tiers: {from: 300000}
        unmodeled: [LPG충전소는 빠진다]
    unmodeled: [교통카드 이용금액과 통신료 자동납부 금액은 매출표 접수일 기준으로 실적에 들어간다, 국내가맹점 취소 매출이 매월 1~2일에 접수되면 전월 실적에서 뺀다, 카드 발급 달 포함 3개월간 국내 90만원 이상 이용 시 5천점 보너스 적립은 계산하지 않는다, 적립은 거래 매입 순서대로 한도를 쓴다, '서민금융진흥원 햇살론카드 정책에 따라 유흥·사행업종, 골프장 등에서는 쓸 수 없다']
notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2023-12-28. 연회비 국내전용 10,000원. 전월 국내 30만/60만/120만 이상 기본 0.8%, 이동통신·대중교통·커피·영화 3%, 백화점·마트·온라인쇼핑·주유 1%, 건당 1만원 이상, 통합 월 1만/2만/5만점. 실적 제외는 수수료·이자·연회비·취소뿐이다. 서민금융진흥원 햇살론카드 대상자만 발급한다.
