        evidence: ['스타벅스, 투썸플레이스, 폴바셋, 메가MGC커피, 컴포즈커피', ※ 건당 1만원 이상 결제 시 제공, '※ 통합 일 1회, 월 3회, 건당 최대 2천원까지 캐시백', ※ 공식 앱을 통한 결제 건 포함]
