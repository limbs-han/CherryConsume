        source: page
        evidence: [올리브영, ※ 건당 1만원 이상 결제 시 제공, '※ 일 1회, 월 3회, 건당 최대 2천원까지 캐시백']
        target:
          merchants: [olive_young]
        when:
          - amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 2000}
          - {per: day, count: 1}
          - {per: month, count: 3}
          - {shared: life}
