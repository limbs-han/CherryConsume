          - {per: month, count: 2}
          - {shared: kaltoe}
        tiers: {from: 300000}
        unmodeled: [대형시설물 입점 점포와 임대매장은 제외]
      - key: life-gym
        title: 갓생 헬스클럽·스포츠센터 5% 캐시백
        source: page
        evidence: ['헬스클럽 업종 : 헬스클럽, 스포츠센터, 레저스포츠', ※ 10만원 이상 결제 시 제공, '※ 통합 월 1회, 월 최대 5천원까지 캐시백']
