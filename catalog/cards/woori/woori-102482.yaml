        unmodeled: [대형시설물 입점 점포와 임대매장은 제외]
      - key: life-millie
        title: 갓생 밀리의 서재 정기결제 5% 캐시백
        source: page
        evidence: [밀리의 서재, ※ 건당 최저 결제금액 조건 없음, '※ 횟수 제한 없음, 건당 최대 2천원까지 캐시백', ※ 공식 홈페이지/앱을 통한 정기결제 건에 한하여 캐시백 제공]
        target:
          merchants: [millie]
        when:
