        source: page
        evidence: [택시 업종 및 카카오T(택시), ※ 건당 1만원 이상 결제 시 제공, '※ 통합 일 1회, 월 3회, 건당 최대 2천원까지 캐시백', ※ 오프라인 결제 및 카카오T 공식 앱에 해당 카드를 등록하여 결제하는 택시 건에 한하여 캐시백 제공]
        target:
          categories: [taxi]
          merchants: [kakao_t]
        when:
          - amount: {min: 10000}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 2000}
          - {shared: taxi-day}
          - {shared: taxi-month}
          - {shared: life}
        tiers: {from: 300000}
        unmodeled: [카카오T는 택시 결제만이다. 대리운전 등 다른 서비스는 빠진다]
      - key: mobility-socar
        title: 교통 쏘카 5% 캐시백
        source: page
        evidence: [쏘카(SOCAR), ※ 건당 최저 결제금액 조건 없음, '※ 일 1회, 월 3회, 건당 최대 2천원까지 캐시백', ※ 공식 홈페이지/앱을 통한 결제 건에 한하여 캐시백 제공]
        target:
          merchants: [socar]
        when:
          - {channel: online}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 2000}
          - {per: day, count: 1}
          - {per: month, count: 3}
          - {shared: life}
        tiers: {from: 300000}
    unmodeled: ['해외 이용금액, 교통카드 이용금액, 통신료 자동납부 금액은 매출표 접수일 기준으로 실적에 들어간다', 국내가맹점 취소 매출이 매월 1~2일에 접수되면 전월 실적에서 뺀다, 정부지원금과 국가·공공기관 가맹점 이용금액은 실적과 캐시백에서 빠진다, 갓생과 교통 영역은 월 한도 하나를 같이 쓴다, '교통 대중교통 5% 캐시백(후불교통 버스·지하철, 건당 5만원 이상, 월 1회 3천원)은 조건 문구가 분명하지 않아 계산하지 않는다']
open_questions:
  - {path: 'revisions[0].limits', question: 음식점·주점과 카페의 통합 일 1회 월 3회가 함께 세는지 따로 세는지 원문이 분명하지 않아 함께 세는 쪽으로 두었다, assumed: 함께 센다}
notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-09-23. 연회비 없음. 체크카드. 전월 국내외 30만/60만/120만 이상 칼퇴(저녁 6~11시 음식점·주점, 5개 커피, CU) 5% 월 4천/8천/1만5천원, 갓생·교통(헬스, 올리브영, 밀리의 서재, 택시·카카오T 택시, 쏘카) 5% 월 6천/1만2천/2만5천원. 해외 이용은 캐시백 제외. woori-103748 모임WON CHECK와 혜택 구조가 같고 교통에 택시가 있는 다른 상품이다.
