        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 2000}
          - {shared: kaltoe-day}
          - {shared: kaltoe-month}
          - {shared: kaltoe}
        tiers: {from: 300000}
        unmodeled: ['백화점, 대형마트, 리조트 등 대형시설물 입점 점포와 임대매장은 제외']
