notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-06-01. 연회비 20,000원. 전월 국내외 30만/70만/150만 이상 현대렌탈서비스 렌탈요금 자동납부 월 1만/1만5천/2만5천원 청구할인, 할인받은 이용금액 전체 실적 제외. 신규 다음 달 말까지 30만 구간.
