notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 확인했다. 상품 출시일 2024-08-28. 연회비 12,000원(기본 7천, 제휴 5천), 가족카드 없음. 페이지에 발급 대상 제한 문구가 없어 일반 카드로 담았다. 전월 실적과 한도 없이 국내외 0.5%, 생활업종과 해외에 0.3% 추가. 추가 할인의 해외 이용분은 해외 결제 전체를 대상으로 따로 두고 같은 묶음에 넣어 생활업종과 겹쳐 받지 않게 했다. 할인 제외의 아파트 관리비(임대료)는 임대료 업종까지 뺐다.
