notes: 2026-10-13 공식 상품 페이지 대조. 시행일은 페이지에 없어 확인일로 두고 추정 표시. 연회비 국내 10,000원 해외겸용 12,000원. 기본 0.5%와 생활밀착 혜택은 중복하지 않아 한 묶음 우선순위로 둔다. 생활밀착 한도를 넘으면 기본 0.5%로 넘어가는지 원문에 없어 넘기지 않는다.
