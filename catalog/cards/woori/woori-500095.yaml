          merchants: [kakao_t]
        when:
          - {channel: online}
          - amount: {min: 10000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: life}
        tiers: {from: 1000000}
        exclude_applied: 1
        unmodeled: [카카오T 안의 대리 등 주차·택시 외 결제는 할인 제외]
      - key: life-delivery
        title: LIFE 배달의민족·쿠팡이츠 10% 청구할인
        source: page
        evidence: ['배달앱 | 배달의민족, 쿠팡이츠', 100만원 이상 | 10% | 5천원, 건당 1만원 이상 결제 시 청구할인 적용됩니다., 배달앱 영역은 공식 배달앱에서 '앱 내 카드결제' 통한 온라인 결제 건에 한하여 할인 제공됩니다.]
