        source: page
        evidence: ['100만원 이상 ~ 150만원 미만 | 27,000원 | 바디프랜드 렌탈 요금 자동납부 필수', '150만원 이상 ~ 200만원 미만 | 32,000원', '200만원 이상 | 37,000원', 바디프랜드 렌탈요금 자동납부 건이 여러 건인 경우 월 할인한도 내에서 통합할인 적용됩니다., '월 할인한도보다 바디프랜드 렌탈요금 자동납부 승인금액이 적을 경우, 승인금액 만큼만 할인이 적용됩니다.']
        target:
          merchants: [bodyfriend_rental]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {1000000: 27000, 1500000: 32000, 2000000: 37000}
        tiers: {from: 1000000}
