        evidence: [교통 | 카카오T(주차/택시), 100만원 이상 | 10% | 5천원, 건당 1만원 이상 결제 시 청구할인 적용됩니다., 교통 영역은 공식 홈페이지 및 앱을 통한 온라인 결제 건에 한하여 할인 제공됩니다.]
