notes: 2026-10-10 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2025-12-05. 연회비는 국내전용·해외겸용(VISA) 모두 2만5천원(기본 7천원, 제휴 1만8천원), 가족카드 연회비 없음. 이 카드로 할인받은 이용금액 전체가 실적에서 빠진다. 혜택은 모두 전월 국내외 실적 40만원 이상일 때 준다. SK 주유 400 청소년 가족카드(104167)는 혜택이 같은 상품이라 이 카드로 등록한다.
