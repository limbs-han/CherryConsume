  - {scope: domestic, amount: 12000}
  - {scope: global, amount: 12000}
sources:
  - {id: page, kind: product_page, url: 'https://pc.wooricard.com/dcpc/yh1/crd/crd01/H1CRD101S02.do?cdPrdCd=102718', fetched_at: &id001 2026-09-28}
checked_at: *id001
