  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외 원문은 아파트 관리비(임대료)뿐이고 부동산 임대료를 따로 적지 않았다. 월세 카드납부도 빠지는지, assumed: 빠진다}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문 제외는 고속버스 차내 단말기와 고속버스 앱 결제다. 터미널 창구에서 산 고속버스 표도 빠지는지 문구가 없다. 실적 제외와 적립 제외 benefit_exclusions.categories에 같은 가정을 썼다, assumed: 고속버스 결제 전부 제외}
notes: '원래 맡은 카드의정석2 EVERY DISCOUNT(cdPrdCd 103729)는 우리카드 공식 판매여부가 N이고 개인 신용카드 목록에도 없어 같은 구조의 적립형인 이 카드로 바꿈. 2026-05-29 카드의정석 EVERY POINT에서 카드의정석2 EVERY POINT로 이름이 바뀌었다. 연회비는 해외겸용(Mastercard, VISA)·국내전용 모두 1만2천원(기본 7천원, 제휴 5천원), 가족카드 무료. 1모아포인트 = 1꿀 = 1원. 실적은 전월 1일~말일 매출승인일 기준 국내외 가맹점 이용분. 실적 제외와 적립 제외: 무이자할부, 정부지원금, 대학(대학원) 등록금, 국세·지방세·공공요금(4대보험, 전기, 우편, 도시가스, 상하수도, 과태료·범칙금·벌금, 여권발급, 공공기관 가맹점), 상품권·기프트카드·선불카드 구매와 충전, 교통카드 구매와 충전, 고속버스(차내 단말기, 앱), 아파트 관리비(임대료), 연회비, 매출취소금액. 수수료, 이자, 현금서비스, 카드론은 결제 기록이 아니라 다루지 않는다. 취소는 취소 매출표 접수월 실적에서 뺀다. 카드 수령(사용)등록일과 사용개시일 중 빠른 날부터 다음 달 말일까지는 추가 적립을 최저 구간으로 제공. 월 한도는 당월 1일~말일, 매입 순서대로 적용. 가족카드 실적과 적립한도는 본인카드와 따로. 첫 개정 시행일 근거: page. 상품 출시일 2024-02-26. 우리카드 서비스 변경 게시판 317건을 끝까지 봤다. 이 카드 공지는 2024-09-30 이용안내 문구 개정과 2026-05-29 상품명 변경뿐이고 혜택 내용 변경은 없다.'
