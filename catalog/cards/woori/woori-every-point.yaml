notes: >-
  원래 맡은 카드의정석2 EVERY DISCOUNT(cdPrdCd 103729)는 우리카드 공식 판매여부가 N이고 개인 신용카드 목록에도 없어
  같은 구조의 적립형인 이 카드로 바꿈. 연회비는 해외겸용(Mastercard, VISA)·국내전용 모두 1만2천원, 가족카드 무료.
  포인트는 1모아포인트 = 1꿀 = 1원.
  실적은 전월 1일~말일 매출승인일 기준 국내외 가맹점 이용분. 해외 이용, 교통카드 이용, 통신료 자동납부는 매출표 접수일 기준.
  실적 제외 중 업종 코드가 없는 것: 정부지원금, 대학(대학원) 등록금, 교통카드 구매·충전, 고속버스(차내 단말기·앱 결제),
  각종 수수료·이자, 현금서비스, 카드론, 매출취소금액. 공과금에는 4대보험, 우편요금, 과태료, 여권발급비용, 공공기관 가맹점 포함.
  취소는 취소 매출표 접수월 실적에서 빼되, 국내 취소가 매월 1~2일에 접수되면 전월 실적에서 뺌.
  공식 문구 미확인: 할부를 실적에 어떻게 넣는지. full_at_purchase로 둠.
  적립 제외는 실적 제외 목록과 같음. 카드 수령일과 사용개시일 중 빠른 날부터 다음 달 말일까지는 추가 적립을 실적 무관 최저 구간으로 제공.
  월 한도는 당월 1일~말일, 매입 순서대로 적용.
