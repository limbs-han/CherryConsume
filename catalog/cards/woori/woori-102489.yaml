    unmodeled: [가족카드의 할인 한도는 본인카드와 따로다, 교통카드 이용금액과 통신료 자동납부 금액은 매출표 접수일 기준으로 실적에 들어간다, 국내가맹점 취소 매출이 매월 1~2일에 접수되면 전월 실적에서 뺀다, 공공임대료와 관세와 국가·공공기관 가맹점 이용금액은 실적에서 빠진다, 간편결제 할인과 올데이·주유 할인은 한 결제에 겹쳐 받지 않는다]
open_questions:
  - {path: 'revisions[0].limits[0]', question: 주유 통합 월 할인한도 7천원 칸이 첫 구간 줄에만 보인다. 세 구간 모두 7천원으로 읽었다, assumed: 7000}
  - {path: 'revisions[0].benefits', question: 올데이 표에서 할인율 칸이 합쳐져 있어 커피·택시 10%와 편의점·대형마트 5%로 읽었다, assumed: 커피·택시 10%와 편의점·대형마트 5%}
  - {path: name, question: 상품명에 WELFARE가 있지만 페이지에 발급 대상 제한 문구가 없어 일반 상품으로 담았다, assumed: 누구나 발급}
notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2025-07-24. 연회비 12,000원. 전월 국내 30만/60만/120만 이상. 주유 S-OIL·HD현대오일뱅크 리터당 60/80/100원 월 7천원, 간편결제 온라인 1% 월 4천/8천/1만6천원, 올데이 멤버십 20%·커피·택시 10%·편의점·대형마트 5% 통합 월 6천/1만2천/2만4천원. 할인 적용된 이용금액 전체는 실적 제외.
