      - key: allday-mart-5
        title: 이마트·롯데마트 5% 청구할인
        source: page
        evidence: ['대형마트 | 이마트, 롯데마트', 대형마트 영역은 오프라인 매장에서 마트 내 상품 구매 시에만 할인 제공]
