open_questions:
  - {path: 'revisions[0].effective_from', question: 지금 혜택 구성의 시행일을 찾지 못해 상품 출시일로 두었다. 2026-08-24 심의 문구라 그 사이 개정이 있었을 수 있다, assumed: '2018-06-25'}
notes: 2026-10-10 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2018-06-25. 연회비 국내전용(UnionPay) 10,000원, Mastercard·VISA 12,000원. 전월 국내 30만/70만/120만 이상 온라인 쇼핑 10%, 지정 오프라인 쇼핑 10% 각 건당 5만원까지, 온라인 4대 PAY 5% 추가는 온라인 한도 안에서. 월 한도 온라인 4천/8천/1만6천원, 오프라인 6천/1만2천/2만4천원. 주말 4대 주유소 리터당 60원(건당 10만원, 월 30만원), 스타벅스·폴바셋 10% 건당 1천원 월 5천원. 할인 받은 매출의 50%는 실적 제외. 신규 발급 다음 달 말까지 30만 구간.
