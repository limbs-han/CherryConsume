notes: 'K-패스 전용 체크카드. 우리카드 공시실 기준 2024-12-30 단종이고 보유자는 계속 쓴다. 상품 출시일 2020-02-21. 연회비 없음(해외겸용 Mastercard, 국내전용). 만 18세 이상, 가족카드 발급 불가. 해외 서비스는 Mastercard 발급만. K-패스 대중교통 마일리지 환급은 정부 사업이라 카드 혜택으로 옮기지 않는다. 대상 지역 거주자만 신청하고 환급은 K-패스 앱과 고객센터가 맡는다. 실적은 전월 1일~말일 매출승인일 기준 국내외 가맹점 이용금액이고 상품권과 선불카드 구매·충전은 빠진다. 국내 서비스와 라운지 실적에는 캐시백 받은 국내 매출이 들어가고 해외 캐시백 실적에는 들어가지 않는다. 국내 서비스 한도는 전월 20만/50만/70만원 이상에서 기본 서비스 8천/1만8천/2만8천원, 추가 서비스 2천원, 합친 통합 월 한도 1만/2만/3만원. 통합 한도는 두 한도의 합과 같아 따로 두지 않았다. 월 한도와 횟수는 당월 1일~말일, 거래(매입) 순서대로 적용. 캐시백 및 제외 업종·가맹점은 우리카드 전산상 등록 기준이고 국내 캐시백은 매출표 접수일(승인일로부터 2~3영업일)에 결제계좌로 입금. 카드 사용등록일부터 다음 달 말일까지 국내 서비스는 전월 20만원, 해외 캐시백은 25만원으로 간주하고 그보다 많이 쓰면 그 구간을 준다. 결제 건 혜택 아님: 해외이용수수료 면제(해외 가맹점 건당 US$0.5, 해외 ATM 건당 US$3, 국제브랜드 수수료 1%는 부과), 인천공항 라운지 마티나·스카이허브 통합 월 1회 연 2회(전월 국내외 50만원 이상, 카드 수령 달 제외, 국제선 탑승 시), 체크카드 소액신용한도(월 최고 30만원 신용 일시불). 해외 QR결제 가이드는 다른 카드 안내라 옮기지 않았다. 첫 개정 시행일 근거: page. 받은 원문은 2026-10-05 사본이고 실제 페이지는 자바스크립트로 그려 2026-10-06 다시 열었을 때 본문이 오지 않았다. 상품안내장 PDF는 다운로드 팝업이라 주소를 얻지 못했다.'
