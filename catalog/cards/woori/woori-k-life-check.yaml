open_questions:
  - {path: 'revisions[0].benefits[transit-5].when', question: '후불교통은 이용액이 합산 청구되는데 건당 5만원 조건을 합산 청구액에 적용하는지. LOCA 365처럼 한 달 합산 청구액을 한 건으로 보면 basis: month_total과 month_total min 50000으로 담는다. 가정대로면 탑승 한 번은 5만원을 넘지 않아 혜택이 거의 0이다', assumed: 결제 기록 한 건마다 5만원 이상일 때만 캐시백}
  - {path: 'revisions[0].new_card', question: 카드 수령(사용)등록일과 사용개시일 중 빠른 날이 기준인데 한 날짜만 받는다, assumed: registration}
  - {path: 'revisions[0].spend.exclude_categories', question: 실적 제외 원문은 아파트 관리비(임대료)뿐이고 부동산 임대료를 따로 적지 않았다. 월세 카드납부도 빠지는지, assumed: 빠진다}
notes: '원래 맡은 카드의정석 COOKIE CHECK(cdPrdCd 838832)는 우리카드 공식 판매여부가 N이고 페이지가 2023년 4월 기준이라, 해외·영화·대중교통·온라인쇼핑 캐시백 구성이 가장 비슷한 이 카드로 바꿈. 외국인 고객 맞춤 체크카드이고 우리은행 영업점에서만 발급. 연회비 없음(해외겸용 Mastercard, 국내전용, 가족카드 포함). 실적은 전월 1일~말일 매출승인일 기준 국내 가맹점 이용분이고 해외 이용금액은 실적에서 빠짐. 국내 서비스로 캐시백 받은 건은 이용금액의 50%만 실적에서 빠진다. 실적 제외와 국내 캐시백 제외: 상품권·기프트카드·선불카드 구매와 충전, 교통카드 구매와 충전, 고속버스(차내 단말기, 앱), 정부지원금, 대학(대학원) 등록금, 국세·지방세·공공요금(4대보험, 전기, 우편, 도시가스, 상하수도, 과태료·범칙금·벌금, 여권발급, 공공기관 가맹점), 아파트 관리비(임대료), 매출취소금액. 수수료와 이자는 결제 기록이 아니라 다루지 않는다. 취소는 취소 매출표 접수월 실적에서 뺀다. 카드 수령(사용)등록일과 사용개시일 중 빠른 날부터 다음 달 말일까지는 국내 서비스를 최저 구간으로 제공하고 해외 서비스는 특례가 없다. 월 한도와 횟수는 당월 1일~말일, 매입 순서대로 적용. 캐시백은 매출표 접수일에 결제계좌로 입금. 가족카드 실적과 한도는 본인카드와 따로. 첫 개정 시행일 근거: page. 상품 출시일 2024-05-29, 준법 심의필 2024-C01139(2024.05.21). 우리카드 서비스 변경 게시판 317건을 끝까지 봤고 이 카드 공지는 없다.'
