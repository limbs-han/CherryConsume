notes: >-
  원래 맡은 카드의정석 COOKIE CHECK(cdPrdCd 838832)는 우리카드 공식 판매여부가 N이고 페이지가 2023년 4월 기준이라,
  해외·영화·대중교통·온라인쇼핑 캐시백 구성이 가장 비슷한 이 카드로 바꿈. 우리은행 영업점에서만 발급.
  연회비 없음(가족카드 포함).
  실적은 전월 1일~말일 매출승인일 기준 국내 가맹점 이용분이고 해외 이용금액은 실적에서 빠짐. 교통카드 이용, 통신료 자동납부는 매출표 접수일 기준.
  국내 서비스로 캐시백 받은 건은 이용금액의 50%만 실적에서 빠지는데, 스키마가 참거짓만 받아 exclude_discounted를 true로 둠.
  실적 제외 중 업종 코드가 없는 것: 교통카드 구매·충전, 고속버스(차내 단말기·앱 결제), 정부지원금, 대학(대학원) 등록금, 각종 수수료·이자, 매출취소금액.
  공과금에는 4대보험, 우편요금, 과태료, 여권발급비용, 공공기관 가맹점 포함.
  취소는 취소 매출표 접수월 실적에서 빼되, 매월 1~2일 접수분은 전월 실적에서 뺌.
  카드 수령일과 사용개시일 중 빠른 날부터 다음 달 말일까지는 국내 서비스를 실적 무관 최저 구간으로 제공.
  해외 캐시백 한도 월 5만원은 국내 통합한도와 따로. 캐시백은 매출표 접수일에 결제계좌로 입금.
  공항라운지 같은 부가서비스는 없음.
