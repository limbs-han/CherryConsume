        tiers:
          from: 400000
          waived_when:
            fact: first-issuance-eligible
            card_month: {max: 1}
        exclude_applied: 0
        unmodeled: [가족카드는 청구할인을 받지 못한다, 'KT 단말기 장기할부(36개월, 연 7.0%) 월 청구금액도 같은 한도 안에서 할인하지만 장기할부 월 청구를 입력으로 나타낼 수 없어 계산하지 않는다', 1~36개월은 첫 서비스 적용월부터 세는데 카드 사용 시작 달부터 36개월로 덜 주는 쪽으로 계산한다]
    unmodeled: [가족카드 전월 이용실적은 본인카드와 합산한다, 해외 이용금액과 무승인 결제(대중교통, 통신요금 자동납부)는 매출표 접수일 기준으로 실적에 들어간다, 국내가맹점 취소 매출이 매월 1~2일에 접수되면 전월 실적에서 뺀다, 공공임대료와 국가·공공기관 가맹점 이용금액은 실적에서 빠진다, 할인은 거래 매입 순서대로 적용된다]
notes: 2026-10-13 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2025-12-31. 연회비 25,000원. KT 통신요금 자동납부 또는 KT 단말기 36개월 장기할부 필수. 전월 국내외 40만/80만/120만 이상 월 할인한도 처음 36개월 8,000/13,000/18,000원, 37개월 이후 5,000원. 승인금액이 한도보다 적으면 승인금액만큼 할인한다. 최초 발급 카드는 등록 다음 달 말까지 최저 구간.
