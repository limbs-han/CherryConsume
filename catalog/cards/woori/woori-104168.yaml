      cancellation: cancel_month
    new_card: null
    facts:
      - {key: first-issuance-eligible, type: bool, scope: card, ask: '만기·해지 후 재발급이 아닌 이 상품 최초 발급 카드인가요? 시작일은 카드 수령 등록일과 사용개시일 중 빠른 날입니다.'}
    benefits:
      - key: kt-autopay
        title: KT 통신요금 자동납부 청구할인
        source: page
        evidence: ['40만원 이상 ~ 80만원 미만 | 8,000원 | 5,000원 | KT 통신요금 자동납부 또는 KT 단말기 장기할부(36개월) 필수', '80만원 이상 ~ 120만원 미만 | 13,000원', '120만원 이상 | 18,000원', 37개월 이후 전월 이용실적 40만원 이상 시 5천원 월 할인한도가 적용됩니다., 1~36개월에 적용되는 할인서비스는 해당 상품 최초 발급 시에 한해 제공됩니다.]
        target:
