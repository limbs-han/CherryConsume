          merchants: [coupang, musinsa, zigzag]
        when:
          - payment_not: [naver_pay, woori_won_pay]
          - {channel: online}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: shopping}
        tiers: {from: 200000}
        unmodeled: [쿠팡 와우 멤버십과 기타 간편결제 제외. 무신사·지그재그는 공식 앱과 홈페이지 결제만. 안경점 5% 캐시백은 안경점 업종이 없어 담지 않았다]
      - key: coffee-5
        title: 스타벅스 사이렌오더 5% 캐시백
        source: page
        evidence: [오늘 하루 EAT 5% 캐시백 서비스, 커피 스타벅스 사이렌오더, 매출 건당 최대 1천원까지 캐시백 제공]
        target:
          merchants: [starbucks]
        when:
          - payment_not: [naver_pay, woori_won_pay]
          - {channel: online}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: eat}
        tiers: {from: 200000}
        unmodeled: [스타벅스 공식 앱 사이렌오더만. 스타벅스카드 구매·충전과 백화점·대형할인점·미군부대 임대매장 제외]
      - key: delivery-5
        title: 배달 5% 캐시백
        source: page
        evidence: [오늘 하루 EAT 5% 캐시백 서비스, 배달/주문 배달의민족 쿠팡이츠 B마트 마켓컬리, 매출 건당 최대 1천원까지 캐시백 제공]
        target:
          merchants: [baemin, coupang_eats, kurly]
        when:
          - payment_not: [naver_pay, woori_won_pay]
          - {channel: online}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: eat}
        tiers: {from: 200000}
        unmodeled: [공식 앱과 홈페이지 결제만. 가맹점 직접결제와 상품권 구매 제외. 마켓컬리는 컬리패스 멤버십 자동납부 월 1회만]
      - key: ott-5
        title: OTT 5% 캐시백
        source: page
        evidence: [오늘 하루 PLAY 5% 캐시백 서비스, OTT 넷플릭스 멜론, 매출 건당 최대 1천원까지 캐시백 제공, PLAY 월 한도 20만원 3천원 50만원 6천원 70만원 9천원]
        target:
          merchants: [melon, netflix]
        when:
          - payment_not: [naver_pay, woori_won_pay]
          - billing: [subscription]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: play}
        tiers: {from: 200000}
        unmodeled: [공식 앱과 홈페이지에서 직접 신청한 정기결제만. 넷플릭스는 Basic·Standard·Premium 요금제만이고 광고형 스탠다드 제외]
      - key: ticket-5
        title: 공연티켓 5% 캐시백
        source: page
        evidence: [오늘 하루 PLAY 5% 캐시백 서비스, 공연티켓 인터파크티켓 YES24티켓 티켓링크 멜론티켓, 매출 건당 최대 1천원까지 캐시백 제공]
        target:
          merchants: [interpark_ticket, melon_ticket, ticketlink, yes24_ticket]
        when:
          - payment_not: [naver_pay, woori_won_pay]
          - {channel: online}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: play}
        tiers: {from: 200000}
        unmodeled: [공식 앱과 홈페이지 예매만]
      - key: transit-5
        title: 후불 시내버스·지하철 5% 캐시백
        source: page
        evidence: [오늘 하루 LIFE 5% 캐시백 서비스, 대중교통 시내버스 지하철 후불교통 이용금액, 매출 건당 최대 1천원까지 캐시백 제공, LIFE 월 한도 20만원 3천원 50만원 6천원 70만원 9천원]
        target:
          categories: [transit.bus_city, transit.subway]
        when:
          - billing: [postpaid_transit]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: life}
        tiers: {from: 200000}
        unmodeled: [고속버스·시외버스·공항버스·공항철도 직통열차 제외]
      - key: telecom-5
        title: 이동통신 자동납부 5% 캐시백
        source: page
        evidence: [오늘 하루 LIFE 5% 캐시백 서비스, 이동통신 SKT KT LG U+ 헬로모바일 KTM모바일 U+유모바일, 매출 건당 최대 1천원까지 캐시백 제공]
        target:
          merchants: [hello_mobile, kt, kt_m_mobile, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: life}
        tiers: {from: 200000}
        unmodeled: [휴대전화 요금 자동납부만. 인터넷·집전화 결합상품 제외. U+유모바일은 가맹점이 없어 담지 않았다]
      - key: exam-5
        title: 어학시험 5% 캐시백
        source: page
        evidence: [오늘 하루 LIFE 5% 캐시백 서비스, 어학시험 TOEIC OPIc HSK TEPS TOEFL, 매출 건당 최대 1천원까지 캐시백 제공, 해외와 어학시험 매출이 중복되는 경우 어학시험 서비스로 캐시백 적용]
        target:
          merchants: [toeic]
        when:
          - payment_not: [naver_pay, woori_won_pay]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: life}
        tiers: {from: 200000}
        unmodeled: [OPIc·HSK·TEPS·TOEFL은 가맹점이 없어 담지 않았다]
      - key: overseas-5
        title: 해외 5% 캐시백
        source: page
        evidence: [오늘 하루 LIFE 5% 캐시백 서비스, 해외 온/오프라인 가맹점, 매출 건당 최대 1천원까지 캐시백 제공, MasterCard브랜드만 제공]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: life}
        tiers: {from: 200000}
        unmodeled: [Mastercard 해외겸용 카드만. 국내전용 브랜드는 해외 캐시백이 없다]
    unmodeled: [교통카드 이용금액과 통신료 자동납부 금액과 해외 이용금액은 매출표 접수일 기준으로 실적에 넣는다, 국내 가맹점 취소 매출이 매월 1~2일에 접수되면 전월 실적에서 뺀다, 서비스는 거래 매입 순서대로 한도를 쓴다, 체크카드 소액신용결제는 월 최대 30만원 한도 안 신용 일시불. 간편결제로 승인되면 간편결제 서비스가 먼저 적용된다. 해외 캐시백은 카드 결제일에 입금된다. 잔여 한도는 이월하지 않는다]
notes: 2026-10-13 공식 상품 페이지로 대조했다. 상품 출시일 2026-04-01. 연회비 없음. 영역별 월 한도는 영역 안 혜택이 함께 쓴다. 안경점 5% 캐시백은 안경점 업종이 없어 담지 않았다.
