        target: {all: true}
        when:
          - {channel: online}
          - payment: [naver_pay, woori_won_pay]
        reward: {type: cashback, rate: 5}
        limits:
          - {per: txn, amount: 1000}
          - {shared: shopping}
        tiers: {from: 200000}
        unmodeled: [페이에 본 카드를 등록해 온라인 업종에서 쓴 경우만]
      - key: shopping-5
        title: 온라인 쇼핑 5% 캐시백
        source: page
        evidence: [오늘 하루 SHOPPING 5% 캐시백 서비스, 온라인 쇼핑 쿠팡 무신사 지그재그, 매출 건당 최대 1천원까지 캐시백 제공]
