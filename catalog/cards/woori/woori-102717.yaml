open_questions:
  - {path: 'revisions[0].stacks', question: 'Simple 할인과 Daily 할인은 중복 제공하지 않는다고만 적혀 있고 어느 쪽을 주는지, Daily 한도를 다 쓴 뒤 Simple로 넘어가는지 문구가 없다', assumed: 결제마다 큰 쪽 하나}
  - {path: 'revisions[0].benefit_exclusions.categories', question: 할인 제외 원문은 아파트관리비(임대료)다. 월세 카드납부도 빠지는지, assumed: 빠진다}
  - {path: 'revisions[0].benefits', question: 원 미만 처리 문구가 없다, assumed: floor}
notes: 2026-10-10 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-02-26. 연회비는 해외겸용(Mastercard)·국내전용 모두 1만2천원(기본 7천원, 제휴 5천원). 가족카드 실적과 한도는 본인카드와 따로다. Daily 할인 적용 이용금액 전체는 전월실적에서 빠진다. 실적 제외에 공과금과 아파트관리비가 없어 실적 제외에 넣지 않았다. 우리금융저축은행 I&U+(103727)는 혜택이 같은 상품이라 이 카드로 등록한다.
