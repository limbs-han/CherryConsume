schema_version: 2
id: woori-101060
issuer: woori
name: 우리금융그룹 Together Premium
kind: credit
product_codes:
  - '101060'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 100000}
  - {scope: global, brand: visa, amount: 100000}
sources:
  - {id: page, kind: product_page, url: 'https://pc.wooricard.com/dcpc/yh1/crd/crd01/H1CRD101S02.do?cdPrdCd=101060', fetched_at: '2026-10-11'}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2021-05-10'
    source: page
    tiers: [0, 500000]
    spend:
      basis: prev_calendar_month
      regions: [domestic]
      exclude_categories: [annual_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, utility]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: cancel_month
    new_card: {until: next_month_end, tier: 500000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, transit.bus_express, utility]
      unmodeled: [정부지원금액은 적립 제외다, 고속버스는 차내 단말기와 고속버스 App 결제만 적립 제외라고 적혀 있으나 고속버스 업종 전체를 뺐다, 당사 이벤트 혜택을 받은 매출은 적립 제외다]
    stacks:
      - key: main
        pick: priority
        order: [overseas-earn, dutyfree-earn, domestic-earn]
        spill: none
      - {key: pay}
      - {key: fuel}
    benefits:
      - key: overseas-earn
        title: 해외 가맹점 1.5% 적립
        source: page
        evidence: [해외 가맹점 및 면세점 | 1.5%, 전월 이용 실적 조건 및 월 적립한도 없음]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: points, program: woori_moa_point, rate: 1.5}
      - key: dutyfree-earn
        title: 면세점 1.5% 적립
        source: page
        evidence: [해외 가맹점 및 면세점 | 1.5%, 전월 이용 실적 조건 및 월 적립한도 없음]
        target:
          categories: [travel.duty_free]
        reward: {type: points, program: woori_moa_point, rate: 1.5}
      - key: domestic-earn
        title: 국내 가맹점 0.7% 적립
        source: page
        evidence: [국내 가맹점 | 0.7%, 전월 이용 실적 조건 및 월 적립한도 없음]
        target: {all: true}
        when:
          - {region: domestic}
        reward: {type: points, program: woori_moa_point, rate: 0.7}
      - key: woori-pay-earn
        title: 우리페이 간편결제 0.5% 추가 적립
        source: page
        evidence: [우리페이 간편결제 시 0.5% 추가 적립, 포인트 추가적립은 우리페이 간편결제에 우리금융그룹 Together Premium 카드를 등록하여 온라인/오프라인에서 사용 시 제공, (단, 우리페이에서 연동되는 기타 간편결제 이용금액은 추가 적립 제외)]
        target: {all: true}
        when:
          - payment: [woori_won_pay]
        reward: {type: points, program: woori_moa_point, rate: 0.5}
        stack: pay
      - key: fuel-electric-5pct
        title: 주유 5% 할인
        source: page
        evidence: [전 주유소(LPG 충전)/전기차 충전 5% 할인, 전월 국내 가맹점 이용금액 50만원 이상 시 할인 적용, '주유 서비스는 휘발유, 경유, LPG 모두 할인 제공', '통합 일 1회, 월 6회, 결제 건당 할인 대상 금액 최대 10만원', 무이자할부 이용금액은 할인 제외]
        target:
          categories: [fuel]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: day, count: 1}
          - {per: month, count: 6}
          - {per: txn, base: 100000}
        tiers: {from: 500000}
        stack: fuel
        unmodeled: [전기차 충전 5% 할인은 EV Infra 앱으로 충전 결제한 건만 받는다. 담을 가맹점이 없어 계산하지 않는다. 주유와 일 1회 월 6회를 함께 쓴다]
    unmodeled: [교통카드 이용금액과 통신료 자동이체 금액은 매출표 접수일 기준으로 실적에 넣는다, 정부지원금액은 실적에서 빠진다, 취소 매출표가 매월 1~2일에 접수되면 전월 실적에서 뺀다, 가족카드 포인트는 본인회원에게 합산 적립되지만 전월실적과 한도는 카드별로 따로 본다, 프리미엄 기프트(신세계 상품권 5만원 등 연 1회 택1)와 더 라운지 멤버스 공항라운지·골프·호텔 브런치 서비스는 결제 혜택이 아니라 계산하지 않는다, 모아포인트와 우리WON꿀머니는 1점에 1원이다]
open_questions:
  - {path: 'revisions[0].benefits[domestic-earn].reward', question: 원 미만 포인트 처리 문구가 없다, assumed: floor}
  - {path: 'revisions[0].stacks', question: 주유 5% 할인 결제에도 포인트를 적립하는지 문구가 없다. 적립 제외 목록에 주유 할인이 없어 둘 다 받는다고 보았다, assumed: 둘 다 받음}
notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품출시일 2021-05-10. 연회비 10만원(기본 5천원과 제휴 9만5천원), 해외겸용 VISA와 국내전용 BC. 포인트는 실적 조건과 한도 없이 해외·면세점 1.5%, 국내 0.7%, 우리페이 0.5% 추가. 주유 5%는 전월 국내 50만원 이상, 일 1회 월 6회 건당 10만원까지. 무이자할부는 실적과 혜택에서 모두 빠진다.
