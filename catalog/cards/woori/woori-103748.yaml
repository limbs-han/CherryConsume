open_questions:
  - {path: 'revisions[0].limits', question: 음식점·주점과 카페의 일 1회 월 3회가 함께 세는지 따로 세는지와 카카오T와 쏘카의 횟수가 함께인지 원문이 분명하지 않아 함께 세는 쪽으로 두었다, assumed: 함께 센다}
notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2024-12-19. 연회비 없음. 전월 국내외 30만/60만/120만 이상 모임(저녁 6~11시 음식점·주점, 5개 커피, CU) 5% 월 4천/8천/1만5천원, 갓생·교통(헬스, 올리브영, 밀리의 서재, 카카오T 택시 선결제, 쏘카) 5% 월 6천/1만2천/2만5천원.
