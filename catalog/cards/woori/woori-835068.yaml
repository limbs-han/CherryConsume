open_questions:
  - {path: 'revisions[0].effective_from', question: 지금 혜택 구성의 시행일을 찾지 못해 상품 출시일로 두었다. 페이지 심의는 2024-12-17이다, assumed: '2010-04-15'}
notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2010-04-15. 연회비 국내전용 BC 2,000원, Mastercard·VISA 5,000원, BC Global·UnionPay 2,000원. 전월 국내 30만 이상 Woori 할인 5% 통합 일1회 월3회 월 5천/7천/1만원, 패밀리레스토랑 25%·온더보더 20%, 스타벅스·탐앤탐스 20% 월 2회 5천원, 통신 자동납부 3% 월 1건 5만원까지, 영화 6천원 월1회 연6회. 신규 다음 달 말까지 30만 구간.
