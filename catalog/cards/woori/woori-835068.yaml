        source: page
        evidence: ['아래 업종 내 가맹점에서 5% 청구할인 (5개 업종 통합 일1회, 월3회까지)', '대형마트 | 이마트, 롯데마트, 홈플러스, TOP마트 등 전국 대형마트', '백화점 | 롯데, 신세계, 현대, 갤러리아 등 전국 백화점', '주유 | SK에너지, GS칼텍스, S-Oil, HD현대오일뱅크 등', '병의원 | 전국 병원, 의원, 한의원', 학원 | 전국 학원 ( 인터넷 결제시는 제외 ), 30만원 이상 | 5% | 5천원, 50만원 이상 | 7천원, 100만원 이상 | 1만원, 예) 마트/백화점 등의 인터넷몰이나 슈퍼마켓(SSM)에서 구매한 경우 할인 제외]
        target:
          categories: [department_store, education.academy, fuel, hospital]
          merchants: [emart, homeplus, lotte_mart]
        when:
