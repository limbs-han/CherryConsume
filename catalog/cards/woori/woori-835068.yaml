        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: woori-day}
          - {shared: woori-month}
          - {shared: woori}
        tiers: {from: 300000}
        exclude_applied: 1
        unmodeled: [주유 업종의 LPG충전소는 제외, 대형마트는 이마트·롯데마트·홈플러스만 담았다. TOP마트 등 다른 대형마트도 원문 대상이다, '할인 받은 매출은 실적에서 빼되 한도 5천원이면 10만원까지, 1만원이면 20만원까지만 뺀다. 계산은 전액을 뺀다']
