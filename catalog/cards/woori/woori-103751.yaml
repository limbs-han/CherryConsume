notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2025-06-30. 연회비 25,000원. 전월 국내외 40만/80만/120만 이상 LG U+ 통신요금 자동납부 월 1만/1만5천/2만원, 25개월째부터 40만 이상 5천원. 신규 다음 달 말까지 40만 구간.
