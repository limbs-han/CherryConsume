          merchants: [paul_bassett, starbucks]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, amount: 1000}
          - {shared: coffee}
        tiers: {from: 300000}
        exclude_applied: 1
        unmodeled: [커피 상품권·선불카드 구입과 충전 제외, 백화점·대형할인점·면세점·공항·미군부대 등 입점 매장 제외]
    unmodeled: [Two-in-One 결제서비스로 체크 매출이 된 건은 0.3% 캐시백만 받는다, 교통카드 이용금액과 통신료 자동납부 금액은 매출표 접수일 기준으로 실적에 넣는다, 국내 가맹점 무승인매입취소가 매월 1~2일에 접수되면 전월 실적에서 뺀다, 할인은 거래 매입 순서대로 한도를 쓴다, 가족카드 실적과 한도는 본인카드와 별도다, 0.7% 청구할인과 생활밀착 할인은 중복되지 않고 결제마다 큰 쪽으로 둔다]
open_questions:
  - {path: 'revisions[0].benefits', question: 원 미만 처리 문구가 없다, assumed: floor}
  - {path: 'revisions[0].benefits', question: 건당 1천원 한도가 결제 건당 할인액인지 대상금액인지 불명확하다, assumed: 할인액 기준}
notes: 2026-10-13 공식 상품 페이지로 대조했다. 연회비 국내전용 10,000원 MasterCard VISA 12,000원 UnionPay 10,000원. 주유 교통 커피 할인을 받은 매출 전체는 전월실적에서 빠진다.
