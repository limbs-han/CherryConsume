notes: 2026-10-13 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2025-07-18. 연회비 20,000원. 전월 국내외 40만 이상 E1 충전소 10% 월 1만원, 80만 이상 월 2만원. 편의점과 커피 오프라인 10% 월 각 5천원. 할인받은 이용금액 전체는 실적에서 뺀다. 신규 발급은 다음 달 말까지 40만 구간.
