notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2025-06-05. 연회비 50,000원. 전월 국내 50만/100만/200만 이상 7개 영역 10% 청구할인, 영역별 월 4천/6천/1만2천원. 월 최대 한도 2만8천/4만2천/8만4천원은 영역 한도의 합이라 따로 두지 않았다. 온라인쇼핑·대형마트·배달앱은 건당 2만원 이상. 할인받은 이용금액은 실적에서 전액 빠진다. 신규 등록 다음 달 말까지 50만 구간.
