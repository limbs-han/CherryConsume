notes: 2026-10-11 공식 상품 페이지를 브라우저로 열어 대조했다. 상품 출시일 2025-09-05. 연회비 20,000원. 전월 국내외 30만/70만/120만 이상 월 할인한도 10,000/15,000/20,000원. 승인금액이 한도보다 적으면 승인금액만큼 할인한다. 최초 발급 카드는 등록 다음 달 말까지 최저 구간. 원문에 신규 특례 문장이 두 개다. 하나는 모든 신규, 하나는 최초 발급만이라 덜 주는 최초 발급 쪽을 따랐다.
