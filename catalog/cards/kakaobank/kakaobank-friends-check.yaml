notes: '첫 개정 시행일 근거: promo. 2017년 5월 25일 출시. 행사 혜택은 해마다 2월 1일에 바뀌고(2025-01-10 공지) 지금 행사는 2026.02.01~2027.01.31이라 그날을 첫 개정으로 둠. 공지사항 808건과 상품/약관 변경공시 238건을 끝까지 봤고 기본 캐시백 변경 공지는 없음. 기본 캐시백은 상품 페이지와 상품안내장, 전월 30만원 이상 혜택은 캐시백 프로모션 2026 페이지에서 옮김. 행사 혜택은 기본 캐시백에 더해 받고 혜택마다 고객별 월 1회, GS25와 저가커피는 합쳐 월 10회·월 1천원. 금액 조건은 1회 승인금액 기준이고 여러 승인을 합치지 않음. 실적은 전월 1일~말일 실제 승인금액이고 취소는 취소매출전표 접수월에서 뺌. 체크카드라 할부 없음. 해외겸용은 Mastercard이고 국제브랜드수수료 1%와 해외이용수수료 0.25%가 따로 붙음. 매입·정산은 KB국민카드가 맡고 업종도 KB국민카드 기준. 캐시백은 다음 달 10일 결제계좌로 입금. 캐시백은 이용내역서 정산일인 매월 5일까지 매입이 확정된 건만 그 달에 지급하고 늦으면 다음 달에 지급한다. 재발급 수수료 2천원. K-패스 환급은 정부 사업이라 넣지 않음. product_codes의 30은 상품공시 목록의 약관 그룹 번호.'
