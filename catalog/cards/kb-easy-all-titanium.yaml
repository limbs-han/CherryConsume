notes: >-
  발급 시 기본인 Auto 모드 캐시백 기준으로 옮김. Auto 모드는 4개 그룹(A 3%, B 5%, C 7%, D 10%) 20개 영역 중 그룹별 이용금액 상위 1·2·3개 영역(구간별 총 4·8·12개)만 영역당 월 4천원까지 캐시백, 다음 달 둘째 금요일 입금.
  DIY 모드(청구할인)는 영역과 한도 패턴을 직접 골라 통합한도를 나눠 쓰는 방식이라 담지 못함. 모드 변경은 다음 달 1일부터.
  C그룹 스포츠 영역(스포츠·레저용품, 골프, 테니스, 볼링, 스키, 수영, 헬스, 당구, 요가, 필라테스 업종)은 업종 코드가 없어 빠짐.
  승인시점 기준, 해외는 일시불 매입완료 기준. 실적 제외: 현금서비스, 카드론, 정부지원금, 초·중·고 학교 납입금, 대학 등록금, 4대 사회보험료, 수수료·이자, 연체료, 취소금액.
  할인 제외: 무이자할부, 상품권·선불카드 구입·충전.
  최초 사용등록일부터 다음 달 말까지 실적 없어도 1구간 제공. KB Pay에서만 신청 가능. 모바일단독 연회비 2만4천원.
  결제 건 혜택 아님: 티타늄 서비스(공항·호텔 발레파킹, 공항 라운지, 전월 30만원 이상), Visa 브랜드 서비스.
