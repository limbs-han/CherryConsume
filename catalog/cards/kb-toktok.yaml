notes: >-
  연회비는 K-WORLD(JCB타입) 1만원을 국내, Master 1만2천원을 해외겸용으로 넣음. 모바일단독 4천원·6천원.
  해외 이용은 일시불 매입완료 기준. 실적 제외: 할인 받은 건 전액, 현금서비스, 카드론, 정부지원금, 대학 등록금, 수수료·이자, 연체료, 무승인전표(교통요금·자판기·터널통행료·항공기), 취소금액.
  public_transit는 무승인전표 교통요금으로 보고 뺐다.
  취소를 어느 달 실적에서 빼는지는 공식 문구 미확인, KB 다른 카드 기준 cancel_month로 둠.
  할인 제외: 무이자할부, 상품권·선불카드 구입·충전.
  간편결제 10%는 다른 할인과 중복 적용되고 한도는 각각 차감.
  최초 사용등록일부터 다음 달 말까지 실적 무관. 월 한도는 본인 기준, 이월 없음.
