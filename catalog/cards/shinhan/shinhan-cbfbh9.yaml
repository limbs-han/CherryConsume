  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/credit/1188377_2207.html', fetched_at: 2026-10-10}
  - {id: api, kind: api, url: 'https://shapi.shinhancard.com/card-apply/search/v1.0/getCardProductsInformation?entryId=201802220001', fetched_at: 2026-10-10}
checked_at: 2026-10-10
revisions:
  - effective_from: 2026-10-10
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 700000, 1000000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [fuel, gift_card.prepaid_card, prepaid_charge, tax.local, utility.water]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      month_offset: {transit.bus_city: 1, transit.subway: 1}
