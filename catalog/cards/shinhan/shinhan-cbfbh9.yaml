schema_version: 2
id: shinhan-cbfbh9
issuer: shinhan
name: 신한카드 경차사랑 Life
short_name: 신한 경차사랑 Life
kind: credit
product_codes: [CBFBH9, CBFBHA, CBFBHB, CBFBHC, CBFBHD, CBFBHE]
status: on_sale
annual_fees:
