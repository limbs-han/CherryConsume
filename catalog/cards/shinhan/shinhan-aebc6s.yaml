notes: 신한카드 상품 페이지와 상품 API 기준. 카드 출시 2015.03.09. 연회비 없음. 전월 이용금액 20만/30만/50만/80만원 이상 구간마다 쇼핑·주유·외식·영화 통합 할인한도 5천/1만/2만/3만원. 신규 회원은 등록월 다음 달 말까지 한도 5천원, 전월 30만원 이상이면 실적 구간 한도. 교통카드 이용실적은 전전월 기준. 패밀리 레스토랑(아웃백, 파리크라상, 서가앤쿡)은 통합 월 2회 현장 할인.
