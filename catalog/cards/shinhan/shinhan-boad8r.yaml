notes: 'KT 가족만족 할부 신한카드 상품 페이지 기준(2026-10-12). 출시 2020-04-09, 심의필 제2023-C1a-03775호(2023.04.13). 연회비는 페이지 HTML의 국내전용 2만2천원, Master 2만5천원. 가족카드 연회비 없음. KT 요금 자동이체 할인은 요금이 한도보다 적으면 요금만큼 할인한다. Super할부 이용 회원 월 1만·1만5천원, 미이용 회원 3천·5천원. 실적 제외: 카드대출, 연회비, 수수료·이자, 도시가스, 전기요금, 4대보험, 무이자할부(슬림할부 포함), 기프트·선불카드, 상품권·선불전자지급수단, 거래 취소. 세금은 실적 제외 목록에 없다. 신규 발급 회원은 등록월 다음 달 말까지 30만 구간. 2026-10-12 결정대로 시내버스와 지하철을 실적에서 뺐다.'
