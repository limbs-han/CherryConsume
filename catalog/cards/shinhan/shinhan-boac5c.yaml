notes: 'SKT T라이트 신한카드 상품 페이지 기준(2026-10-12). 출시 2020-04-09, 심의필 제2020-C1a-03373호(2020.04.20). 연회비는 페이지 HTML의 국내전용 2만2천원, Master 2만5천원. 가족카드 발급 불가. SKT 요금 할인은 라이트할부 이용 회원 월 1만·1만5천원, 미이용 회원 3천·5천원 한도다. 요금이 한도보다 적을 때 요금만큼 할인하는 문구는 KT 가족만족 할부와 달리 없지만 할인액은 결제액을 넘을 수 없어 100%로 두었다. 실적 제외: 카드대출, 연회비, 수수료·이자, 도시가스, 전기요금, 4대보험, 무이자할부(슬림할부 포함), 기프트·선불카드, 상품권·선불전자지급수단, 거래 취소. 신규 발급 회원은 등록월 다음 달 말까지 30만 구간. 2026-10-12 결정대로 시내버스와 지하철을 실적에서 뺐다.'
