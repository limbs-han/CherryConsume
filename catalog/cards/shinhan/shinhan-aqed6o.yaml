notes: 신한카드 상품 페이지와 상품 API 기준. 카드 출시 2023.03.20. 연회비 없음. 전월 이용금액 30만원 미만 0.1%, 이상 0.3% 캐시백, 한도 없음. 버스·지하철 후불교통은 월 캐시백 대신 이용일마다 30만원 이상 100원, 50만원 이상 200원. 신규 회원은 등록월 다음 달 말까지 30만~50만원 구간. 캐시백은 다음 달 20일 결제계좌로 들어온다. 신용카드 신한카드 봄(shinhan-aqdd6n)과는 다른 상품이다.
