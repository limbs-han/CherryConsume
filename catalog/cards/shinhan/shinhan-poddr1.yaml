notes: 신한카드 상품 페이지 기준. 연회비 국내전용과 Mastercard 모두 1만 5천원. 전월 40만, 80만, 120만원 구간마다 Time Plan 월 5천, 1만, 1만 5천원, Daily Plan 1만, 2만, 3만원, 정기결제 3천, 7천, 1만원, 영화 5천원 한도다. Time Plan은 07~15시 카페와 음식점, 18~22시 편의점과 배달앱 10%를 영역마다 일 1회 1회 1만원까지. Daily Plan은 쇼핑 10%, 이동과 생활 5%를 영역마다 일 1회 월 5회 1회 5만원까지. Monthly Plan은 공과금 자동납부 10%(통신 월 1회), 디지털구독·멤버십 20%. 실적은 국내 취소를 처음 승인한 달에서 빼고 해외 취소는 매입한 달에서 뺀다. 철도 업종 이용금액은 실적에서 빠진다. 신규 발급 회원은 등록월 다음 달 말까지 40만원 구간을 적용한다.
