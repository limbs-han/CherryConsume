schema_version: 2
id: shinhan-baab7d
issuer: shinhan
name: 요기요 신한카드 체크
short_name: 신한 요기요 체크
kind: check
product_codes: [BAAB7D]
status: discontinued
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: mastercard, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/check/1188364_2206.html', fetched_at: 2026-10-12}
checked_at: 2026-10-12
revisions:
  - effective_from: 2017-03-02
    source: page
    tiers: [0, 200000, 500000, 800000, 1000000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, gift_card, prepaid_charge, transit.bus_city, transit.subway]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      month_offset: {}
      exclude_applied: 1
    new_card: {until: next_month_end, tier: 200000, from: registration}
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
    limits:
      - key: integrated
        per: month
        amount: {200000: 6000, 500000: 8000, 800000: 10000, 1000000: 15000}
    benefits:
      - key: yogiyo-15
        title: 요기요 15% 할인
        source: page
        evidence: [요기요 결제금액 15% 할인, '일 1회, 월 4회', 일 최대 2천원 할인]
        target:
          merchants: [yogiyo]
        reward: {type: cashback, rate: 15}
        limits:
          - {per: txn, amount: 2000}
          - {per: day, count: 1}
          - {per: month, count: 4}
          - {shared: integrated}
        tiers: {from: 200000}
      - key: ediya-10
        title: 이디야 10% 할인
        source: page
        evidence: [이디야 10% 할인, '일 1회, 월 3회', 건당 7천원 이상 결제 시 제공, 월 최대 3천원까지 할인]
        target:
          merchants: [ediya]
        when:
          - amount: {min: 7000}
        reward: {type: cashback, rate: 10}
        limits:
          - {per: day, count: 1}
          - {per: month, count: 3}
          - {per: month, amount: 3000}
          - {shared: integrated}
        tiers: {from: 200000}
      - key: cu-10
        title: CU 10% 할인
        source: page
        evidence: [CU 편의점 10% 할인, '일 1회, 월 3회', 건당 1만원 이상 결제 시 제공, 월 최대 5천원까지 할인]
        target:
          merchants: [cu]
        when:
          - amount: {min: 10000}
        reward: {type: cashback, rate: 10}
        limits:
          - {per: day, count: 1}
          - {per: month, count: 3}
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 200000}
    unmodeled: [일반 후불교통 이용금액은 전전월 금액이 전월 실적에 반영되는데 반영월을 담을 수 없어 시내버스와 지하철을 실적에서 뺐다. 실적이 실제보다 적게 잡힌다, 할인은 승인 순서대로 적용하고 결제일에 결제계좌로 돌려준다]
open_questions:
  - {path: 'revisions[0].spend.cancellation', question: 취소 금액을 어느 달 실적에서 빼는지 상품 페이지에 없다. 신한카드 기본값을 따랐다, assumed: cancel_month}
  - {path: 'revisions[0].spend.exclude_categories', question: '전월 실적 제외 대상에 국세, 지방세, 관리비, 공과금이 적혀 있지 않다. 원문대로 실적에 넣었다', assumed: '수수료, 이자, 기프트카드, 선불카드, 할인 적용 금액, 취소만 제외'}
notes: 신한카드 상품 페이지 2026-10-12 기준. 2021-02-02 18시부터 신규 발급이 중단돼 보유 회원만 재발급한다. 연회비 없음. 전월 20만, 50만, 80만, 100만원 구간마다 통합할인한도 6천, 8천, 1만, 1만5천원. 신규 발급 회원은 등록월 다음 달 말까지 6천원 한도를 준다. 할인 받은 금액은 전월 실적에서 뺀다.
