schema_version: 2
id: shinhan-bobct3
issuer: shinhan
name: 땡겨요 신한카드 체크
short_name: 신한 땡겨요 체크
kind: check
product_codes: [BOBCT3]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/check/1215119_2206.html', fetched_at: 2026-10-12}
checked_at: 2026-10-12
revisions:
  - effective_from: 2026-10-12
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 500000, 800000, 1000000]
    spend:
      exclude_categories: [annual_fee, gift_card.prepaid_card, prepaid_charge, transit.bus_city, transit.subway]
    new_card: {tier: 300000}
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
      categories: [apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, gift_card, insurance.social, prepaid_charge, tax, utility.electricity, utility.gas]
      unmodeled: [포인트로 결제한 금액과 신한카드 할인이 적용된 거래는 적립하지 않는다, 간편결제로 결제해 가맹점명이 간편결제명으로 찍히면 적립하지 않는다]
    limits:
      - key: integrated
        per: month
        amount: {300000: 6000, 500000: 8000, 800000: 10000, 1000000: 15000}
    benefits:
      - key: ddangyo-10
        title: 땡겨요 앱 10% 적립
        source: page
        evidence: [땡겨요 앱 이용금액 마이신한포인트 10% 적립, '일 1회, 월 최대 4회 제공', 카드 이용건당 최대 2천 포인트 적립, '땡겨요 앱에서 땡겨요 신한카드 체크로 배달관련 이용 시에만 서비스가 제공되며, 온라인 충전 및 선물하기 이용금액은 서비스가 제공되지 않습니다.']
        target:
          merchants: [ddangyo]
        when:
          - {channel: online}
        reward: {type: points, program: mysinhan_point, rate: 10}
        limits:
          - {per: txn, amount: 2000}
          - {per: day, count: 1}
          - {per: month, count: 4}
          - {shared: integrated}
        tiers: {from: 300000}
      - key: starbucks-2
        title: 스타벅스 2% 적립
        source: page
        evidence: [스타벅스(사이렌오더 포함) 이용금액 마이신한포인트 2% 적립, '일 1회, 이용금액 건당 7천원 이상 이용 시 적용', 월 최대 3천 포인트 적립]
        target:
          merchants: [starbucks]
        when:
          - amount: {min: 7000}
        reward: {type: points, program: mysinhan_point, rate: 2}
        limits:
          - {per: day, count: 1}
          - {per: month, amount: 3000}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: ['백화점·할인점 입점 매장, 온라인 충전과 선물하기는 적립하지 않는다']
      - key: convenience-2
        title: 편의점 2% 적립
        source: page
        evidence: [편의점 이용금액 마이신한포인트 2% 적립, 'GS 25, CU, 세븐일레븐, 미니스톱, 이마트 24', '일 1회, 이용금액 건당 1만원 이상 이용 시 적립', 월 최대 5천 포인트 적립, 오프라인 매장에 한하여 적용되며]
        target:
          merchants: [cu, emart24, gs25, ministop, seven_eleven]
        when:
          - {channel: offline}
          - amount: {min: 10000}
        reward: {type: points, program: mysinhan_point, rate: 2}
        limits:
          - {per: day, count: 1}
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 300000}
        unmodeled: [백화점·할인점 입점 매장은 적립하지 않는다]
    unmodeled: [교통카드 이용금액은 실물 전전월 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 해외 이용금액은 매입일 기준으로 실적 달을 정한다, '땡겨요 신한카드 신용, 체크 일반형, 체크 라이더형을 함께 가지면 실적은 카드별로 따로 센다', 적립은 거래 순서대로 하고 같은 달에 취소하면 횟수와 한도가 복원된다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 이 혜택 구성이 시작된 날을 공식 원문에서 찾지 못해 확인한 날로 두었다, assumed: '2026-10-12'}
notes: 땡겨요 신한카드 체크(일반형) 상품 페이지 기준(2026-10-12 headless Chrome). 심의필 제2022-C1a-00389호(2022.01.18). 연회비 없음. 가족카드 불가. 적립은 전월 30만원 이상, 통합 한도 6천/8천/1만/1만5천P(30만/50만/80만/100만). 실적 제외는 카드대출, 연회비, 수수료·이자, 기프트·선불카드 구매·충전, 거래 취소뿐이다. 신규 발급 회원은 등록월 다음 달 말까지 30만~50만원 구간. 라이더형(shinhan-bobct4)은 다른 상품으로 본다.
