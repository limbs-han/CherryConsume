schema_version: 2
id: shinhan-pobe2z
issuer: shinhan
name: SOL LINK 신한카드 Point Plan 체크
short_name: 신한 SOL LINK Point Plan 체크
kind: check
product_codes: [POBE2Z]
status: on_sale
annual_fees:
  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/check/2014281_2206.html', fetched_at: 2026-10-12, review_no: 제20260909-Dpp-001호}
checked_at: 2026-10-12
revisions:
  - effective_from: 2026-09-07
    source: page
    tiers: [0, 200000, 500000, 800000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.academy, education.study_material, gift_card, insurance.social, pharmacy, prepaid_charge, tax, transit.bus_city, transit.rail, transit.subway, utility.water]
      interest_free: count
      installment: full_at_purchase
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
      exclude_applied: 0
    new_card:
      until: next_month_end
      tier: 200000
      tier_by_benefit: {weekend-delivery: 0}
      from: registration
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
      categories: [apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, pharmacy, prepaid_charge, tax, transit.rail, utility.water]
      unmodeled: [이 카드로 할인 서비스(이벤트 포함)를 받은 거래는 금액 전체가 적립 제외, 포인트 사용 거래의 포인트 금액은 적립과 적립률 산정에서 빠진다]
    limits:
      - key: integrated
        per: month
        amount: {200000: 5000, 500000: 10000, 800000: 15000}
        adjust:
          - when:
              months: [5, 12]
            add: 5000
    stacks:
      - {key: solpay}
      - {key: weekend}
    benefits:
      - key: daily-under-20k
        title: 국내 2만원 미만 0.2% 적립
        source: page
        evidence: [국내 건당 결제금액별 0.2~1% 마이신한포인트 적립, 2만원 미만 0.2%, '편의점(CU, GS25, 세븐일레븐) 결제 건은 ‘일상 생활비 적립 서비스’가 적용되지 않습니다.', '20만원 이상 50만원 미만 5천 포인트, 50만원 이상 80만원 미만 1만 포인트, 80만원 이상 1만 5천 포인트']
        target:
          all: true
          exclude_merchants: [cu, gs25, seven_eleven]
        when:
          - amount: {below: 20000}
          - {region: domestic}
        reward: {type: points, program: mysinhan_point, rate: 0.2}
        limits:
          - {shared: integrated}
        tiers: {from: 200000}
      - key: daily-20k
        title: 국내 2만원 이상 0.4% 적립
        source: page
        evidence: [국내 건당 결제금액별 0.2~1% 마이신한포인트 적립, 2만원 이상 10만원 미만 0.4%]
        target:
          all: true
          exclude_merchants: [cu, gs25, seven_eleven]
        when:
          - amount: {min: 20000, below: 100000}
          - {region: domestic}
        reward: {type: points, program: mysinhan_point, rate: 0.4}
        limits:
          - {shared: integrated}
        tiers: {from: 200000}
      - key: daily-100k
        title: 국내 10만원 이상 0.8% 적립
        source: page
        evidence: [국내 건당 결제금액별 0.2~1% 마이신한포인트 적립, 10만원 이상 50만원 미만 0.8%]
        target:
          all: true
          exclude_merchants: [cu, gs25, seven_eleven]
        when:
          - amount: {min: 100000, below: 500000}
          - {region: domestic}
        reward: {type: points, program: mysinhan_point, rate: 0.8}
        limits:
          - {shared: integrated}
        tiers: {from: 200000}
      - key: daily-500k
        title: 국내 50만원 이상 1% 적립
        source: page
        evidence: [국내 건당 결제금액별 0.2~1% 마이신한포인트 적립, 50만원 이상 1.0%]
        target:
          all: true
          exclude_merchants: [cu, gs25, seven_eleven]
        when:
          - amount: {min: 500000}
          - {region: domestic}
        reward: {type: points, program: mysinhan_point, rate: 1.0}
        limits:
          - {shared: integrated}
        tiers: {from: 200000}
      - key: daily-solpay-extra
        title: 신한 SOL페이 결제 0.1% 추가 적립
        source: page
        evidence: [신한 SOL페이로 국내 결제 시 0.1% 마이신한포인트 추가 적립, '신한 SOL페이 추가 적립 기준: 신한 SOL페이·신한 슈퍼SOL로 결제(터치결제, QR·바코드 결제, NFC결제 포함. 단, ARS결제, 일반결제, Smart결제는 추가 적립 제외)']
        target:
          all: true
          exclude_merchants: [cu, gs25, seven_eleven]
        when:
          - {region: domestic}
          - payment: [shinhan_sol_pay]
        reward: {type: points, program: mysinhan_point, rate: 0.1}
        limits:
          - {shared: integrated}
        tiers: {from: 200000}
        stack: solpay
        unmodeled: ['신한 SOL페이의 ARS결제, 일반결제, Smart결제는 추가 적립 제외']
      - key: daily-overseas
        title: 해외 일시불 1% 적립
        source: page
        evidence: [해외(일시불) 결제금액에 대해 1% 마이신한포인트 적립, 해외 결제금액의 경우 최종 원화 청구금액을 기준으로 적립됩니다.]
        target: {all: true}
        when:
          - {region: overseas}
          - {lump_sum: true}
        reward: {type: points, program: mysinhan_point, rate: 1.0}
        limits:
          - {shared: integrated}
        tiers: {from: 200000}
      - key: weekend-delivery
        title: 주말 배달앱 SOL페이 2만원 이상 1천P 적립
        source: page
        evidence: [주말(토/일) 배달앱 건당 2만원 이상 결제 시 1천 마이신한포인트 적립, '배달의 민족, 요기요, 땡겨요', 통합 일 1회 적용, '공식 배달앱에서 [앱 내 카드결제 > 신한 SOL페이] 결제 시 적립', 20만원 미만 1회, 20만원 이상 3회, ‘주말 배달앱 포인트 적립 서비스’와 ‘일상 생활비 적립 서비스’는 중복으로 제공됩니다.]
        target:
          merchants: [baemin, ddangyo, yogiyo]
        when:
          - {channel: online}
          - amount: {min: 20000}
          - day:
              in: [sat, sun]
          - payment: [shinhan_sol_pay]
        reward: {type: points, program: mysinhan_point, fixed: 1000}
        limits:
          - {per: day, count: 1}
          - per: month
            count: {0: 1, 200000: 3}
        stack: weekend
        unmodeled: ['신한 SOL페이의 ARS결제, 일반결제, Smart결제는 제외']
      - key: convenience-5
        title: 편의점 5% 적립
        source: page
        evidence: ['CU, GS25, 세븐일레븐 이용금액 5% 마이신한포인트 적립', 통합 일 1회 적용, 오프라인 가맹점에서만 적립, 20만원 이상 3천 포인트]
        target:
          merchants: [cu, gs25, seven_eleven]
        when:
          - {channel: offline}
        reward: {type: points, program: mysinhan_point, rate: 5}
        limits:
          - {per: day, count: 1}
          - {per: month, amount: 3000}
        tiers: {from: 200000}
        unmodeled: [백화점·할인점 입점 편의점은 적립하지 않는다]
    unmodeled: [교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 해외 이용금액은 매입일 기준으로 실적 달을 정한다, 의약품 전용몰(도매몰)과 제약회사 이용금액은 실적과 적립에서 빠진다, 부분취소가 생기면 취소 뒤 최종 금액으로 적립률을 다시 적용한다, 온라인 결제가 되는 서비스는 해당 업체 사이트나 앱에서 직접 결제한 경우에만 혜택을 준다]
notes: '신한카드 상품 페이지 기준. 연회비 Visa 없음. 카드 출시 2026.09.07. 일상 생활비는 국내 건당 2만원 미만 0.2%, 10만원 미만 0.4%, 50만원 미만 0.8%, 50만원 이상 1.0%와 SOL페이 추가 0.1%, 해외 일시불 1%이고 편의점 결제는 빠진다. 월 통합 한도 전월 20만/50만/80만원 구간 5천/1만/1만 5천P, 5월과 12월은 5천P 추가. 주말 배달앱은 SOL페이로 2만원 이상 결제 시 1천P, 일 1회, 전월 20만원 미만 월 1회, 이상 월 3회이고 일상 생활비와 중복된다. 편의점 5%는 일 1회, 전월 20만원 이상 월 3천P이고 일상 생활비 대신 받는다. 신규 발급 회원은 등록월 다음 달까지 일상 생활비와 편의점 20만원 구간, 주말 배달앱 20만원 미만 구간. 국내 취소는 처음 승인한 달, 해외 취소는 매입 달 실적에서 뺀다. 실적 제외: 카드대출, 연회비, 수수료, 이자, 기프트·선불카드, 상품권·선불전자지급수단, 국세·지방세·수도요금, 4대보험, 아파트관리비, 취소, 학원·학습지·자동차학원, 의약품 전용몰·제약회사·약국, 철도.'
