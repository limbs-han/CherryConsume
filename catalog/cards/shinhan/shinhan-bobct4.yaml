schema_version: 2
id: shinhan-bobct4
issuer: shinhan
name: 땡겨요 신한카드 체크(라이더형)
short_name: 신한 땡겨요 체크 라이더형
kind: check
product_codes: [BOBCT4]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/check/1215124_2206.html', fetched_at: 2026-10-12}
checked_at: 2026-10-12
revisions:
  - effective_from: 2024-03-22
    effective_from_estimated: true
    source: page
    tiers: [0, 200000]
    spend:
      exclude_categories: [annual_fee, gift_card, prepaid_charge, transit.bus_city, transit.subway]
    new_card: {tier: 200000}
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, gift_card, insurance.social, prepaid_charge, tax, utility.electricity, utility.gas]
      unmodeled: [포인트로 결제한 금액과 신한카드 할인이 적용된 거래는 적립하지 않는다]
    limits:
      - {key: integrated, per: month, amount: 50000}
    stacks:
      - {key: main}
      - {key: extra}
    benefits:
      - key: base-0-2
        title: 전 가맹점 0.2% 적립
        source: page
        evidence: [전 가맹점 이용금액 마이신한포인트 0.2% 적립, 20만원 미만 | 0.2% | 5만 포인트]
        target: {all: true}
        reward: {type: points, program: mysinhan_point, rate: 0.2}
        limits:
          - {shared: integrated}
      - key: fuel-convenience-0-2
        title: 주유소·편의점 0.2% 추가 적립
        source: page
        evidence: [주유소/편의점 이용금액 마이신한포인트 0.2% 추가 적립, 추가적립은 전월 이용금액 20만원 이상 시 제공, '주유소: 신한카드 가맹점 업종 기준으로 등록된 전 주유소에서 휘발유, 경유, 등유, LPG 이용거래만 적용', '편의점: GS 25, CU, 세븐일레븐, 미니스톱, 이마트 24', '오프라인 매장에 한하여 적용되며, 인터넷이나 모바일엡을 통한 온라인 거래는 포인트 적립되지 않습니다.']
        target:
          categories: [fuel]
          merchants: [cu, emart24, gs25, ministop, seven_eleven]
        when:
          - {channel: offline}
        reward: {type: points, program: mysinhan_point, rate: 0.2}
        limits:
          - {shared: integrated}
        tiers: {from: 200000}
        stack: extra
    unmodeled: [교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, '주유소는 휘발유, 경유, 등유, LPG 결제만 추가 적립한다', '백화점·할인점 입점 매장, 온라인 충전, 선물하기는 추가 적립하지 않는다', 해외 이용금액은 매입일 기준으로 실적 달을 정한다, 적립은 거래 순서대로 하고 같은 달에 취소하면 한도가 복원된다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 지금 혜택 구성이 시작된 날을 원문에서 찾지 못해 신한카드 부속약관 시행일로 두었다. 출시일은 2022-01-18이다, assumed: '2024-03-22'}
  - path: revisions[0].limits[integrated].amount
    question: 월 통합적립한도 표에서 20만원 이상 칸이 비어 있어 20만원 미만 칸의 5만 포인트가 두 구간을 묶은 칸이라고 보았다
    assumed: '50000'
notes: 땡겨요 신한카드 체크(라이더형) 상품 페이지 기준(2026-10-12). 출시 2022-01-18, 심의필 제2022-C1a-00389호. 연회비는 페이지 HTML의 Local, Visa 모두 0원. 전 가맹점 0.2%에 전월 20만원 이상이면 주유소·편의점 0.2%를 더한다. 월 통합적립한도 5만 포인트. 신규 발급 회원은 등록월 다음 달 말까지 20만 구간. 땡겨요 체크 일반형(shinhan-bobct3)과 다른 상품이다. 2026-10-12 결정대로 시내버스와 지하철을 실적에서 뺐다.
