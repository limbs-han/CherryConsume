notes: 신한카드 Simple Plan+ 상품 페이지 기준. 연회비 국내전용 4만7천원, Mastercard 5만원. 실적 조건과 한도 없이 국내 1.5%, 해외 2%를 결제일에 할인한다. 웰컴 캐시백은 발급 초년도 마트, 병원, 주유 오프라인 3만원 이상 결제 한 번에 3만원이고 심플 할인과 겹쳐 받는다. 간편결제명 제외 문구는 웰컴 캐시백에만 있어 카드사 기본값을 덮고 웰컴 캐시백에만 걸었다. 신규 고객 연회비 캐시백 행사는 담지 않았다. 기본 Plan 카드와 이름이 기호 하나만 달라 이름 뒤에 (플러스)를 붙였다.
