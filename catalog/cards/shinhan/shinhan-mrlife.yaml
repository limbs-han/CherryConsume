        notes: TIME Night. 승인시간 오후 9시~오전 9시만. 한식·양식·일식·중식·뷔페·일반대중음식·패스트푸드·커피전문점 업종 합쳐 일 1회, 월 10회, 1회 승인 1만원까지
      - key: weekend-mart
