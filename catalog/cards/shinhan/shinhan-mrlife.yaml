notes: '신한카드 Mr.Life 상품 페이지와 신한카드 상품 API 기준. 첫 개정 시행일 근거: notice-20260715. 공지 본문의 시행일자 2025년 7월 15일은 오기로 보고 게시일 2026-07-15를 썼다. 2026-07-06 웹 보관본의 공식 상품 페이지는 아직 Night 온라인쇼핑에 위메프가 있고 심의필 제2025-C1h-16799호였으며, 지금 페이지는 롯데홈쇼핑이고 심의필 제2026-C1a-09920호(2026.07.01)다. 카드 출시 일자 2015.09.03. 공지사항은 2020년 1월 글부터 남아 있고 이 카드 공지는 2023.02.08 디자인 변경(시행 2023-02-09, 혜택 변경 아님)과 2026.07.15 약관 개정(Night 온라인쇼핑 위메프를 롯데홈쇼핑으로, 주말 할인 문구 정리)이다. 2026.05.15 발급 중단 공지의 Mr.Life는 글로벌금융판매 제휴 상품이고 이 카드는 발급 중이다. 연회비는 API 값. 국내 칸은 S&브랜드(신한카드가 아멕스와 제휴한 브랜드, 국내전용 연회비로 해외 아멕스 가맹점 이용) 15,000원, 해외 칸은 VISA 18,000원. TIME 할인(All Day와 Night 합산) 한도는 integrated 1만/2만/3만원. 주말 할인 한도는 weekend 3천/7천/1만원. 월납 할인 한도는 따로 3천/7천/1만원. TIME은 구분 영역별로 각각 일 1회, All Day는 월 5회, Night는 월 10회. 실적 제외: 카드대출, 연회비, 수수료, 이자, 기프트카드 구매, 선불카드 충전, 거래취소금액. 카드대출, 수수료, 이자는 결제가 아니라 담지 않았다. 교통 이용금액은 전전월 기준, 해외 이용금액은 매입일 기준. 신규 발급 회원은 카드 사용 등록월의 다음 달 말까지 30만~50만원 구간 한도. 인테이크몰은 이 기간 실적 무관. 가족카드 발급 불가. 후불교통 신청 가능.'
