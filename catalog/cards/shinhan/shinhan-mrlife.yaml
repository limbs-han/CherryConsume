notes: >-
  신한카드 상품 페이지(여신금융협회 심의필 제2026-C1a-09920호, 2026.07.01)와 같은 페이지가 부르는 신한카드 상품 API(getCardProductsInformation, entryId 201509030001) 기준. 연회비는 API 값.
  연회비 국내 칸은 S&브랜드(아멕스 제휴, 국내전용 연회비로 해외 아멕스 가맹점 이용) 15,000원, 해외 칸은 VISA 18,000원. 순수 국내전용 브랜드는 없음.
  integrated_cap은 TIME 할인(All Day와 Night 합산) 한도 1만/2만/3만원. 월납 할인과 주말 할인은 서비스별 한도가 따로라 구간별 혜택으로 나누고 counts_toward_integrated_cap false.
  실적 제외: 장·단기 카드대출, 연회비, 각종 수수료, 이자, 기프트카드 구매, 선불카드 충전, 거래취소금액. 교통 이용금액은 전전월 기준, 해외 이용금액은 매입일 기준.
  신규 발급 회원은 카드 사용 등록월의 다음 달 말까지 30만~50만원 구간 한도 제공. 인테이크몰은 이 기간 실적 무관.
  할인은 전표 매입 순서대로 결제일 할인. 가족카드 발급 불가. 후불교통 신청 가능.
  TIME All Day의 세탁소 업종 10% 할인(일 1회, 월 5회, 1회 1만원까지)은 업종 코드가 없어 뺌.
  공식 문구 미확인: 전월 이용금액 산정기간이 1일~말일인지(페이지에 명시 없음, 신한카드 다른 상품 기준으로 가정). 할부를 결제 달에 전액 인정하는지. 취소를 어느 달 실적에서 빼는지.
