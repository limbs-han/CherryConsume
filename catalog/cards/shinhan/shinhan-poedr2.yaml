notes: '신한카드 상품 페이지와 상품 상세 API 기준. 연회비는 API afeInfoList로 국내와 Mastercard 모두 5만원(기본 7천 + 제휴 4만 3천). 카드 출시 2025.03.24. Time Plan은 DAY(07~15시) 카페·음식점, NIGHT(18~22시) 편의점·배달앱 10%, 영역별 일 1회, 1회 1만원까지. Daily Plan은 쇼핑 10%, 이동·생활 5%, 영역별 일 1회 월 5회, 1회 5만원까지. Monthly Plan은 공과금 자동납부 10%(1회 5만원, 통신 월 1회), 디지털구독·멤버십 20%(1회 1만원), 피트니스 5%(1회 10만원, 일 1회), 영화 예매 5천원 월 1회. 월 한도는 전월 40만/80만/120만/180만원 구간 Time 5천/1만/1만 5천/2만원, Daily 1만 5천/2만 5천/3만 5천/5만원, 정기결제 5천/1만/1만 5천/2만원, 영화 5천원. 신규 발급 회원은 등록월 다음 달까지 40만원 구간. 국내 취소는 처음 승인한 달, 해외 취소는 매입 달 실적에서 뺀다. 시각 조건 15:00과 22:00은 끝 시각을 넣지 않는 쪽으로 계산한다. 실적 제외: 카드대출, 기프트·선불카드, 국세·지방세·세외수입, 4대보험, 스쿨뱅킹·대학 등록금, 아파트관리비, 도시가스, 전기요금, TV수신료, 수도요금, 상품권·선불전자지급수단, 포인트 충전, 취소, 철도. 기본 Plan 카드와 이름이 기호 하나만 달라 이름 뒤에 (플러스)를 붙였다.'
