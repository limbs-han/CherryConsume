    unmodeled: [모두렌탈과 한국야쿠르트 정기주문은 공통 가맹점이 없어 계산하지 않는다, 스타벅스 카드 자동충전 적립은 선불 충전을 스타벅스만 가려낼 수 없어 계산하지 않는다, 아파트관리비에 도시가스·전기요금이 함께 청구되면 1건으로 본다, 이동통신은 순수 통신요금 자동이체만이고 약정금액 대납·지점 월납·알뜰폰은 제외한다, 같은 가맹점에 자동이체를 여러 건 등록해도 월 1건만 적립한다, 디지털 구독은 공식 홈페이지나 앱에서 직접 신청한 정기결제만이고 앱마켓 인앱결제와 통신요금 합산 결제는 제외한다, Local(국내전용) 카드는 Plus 해외 적립을 받지 못한다, 교통카드 이용금액은 실물 전전월 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, '본인과 가족카드의 전월 이용금액, 월 적립 건수와 한도를 합산한다', 백화점·할인점 입점 매장 결제와 1회성 결제는 렌탈·생활월납·디지털 구독 적립에서 빠진다]
