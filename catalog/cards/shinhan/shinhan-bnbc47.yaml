notes: '신한카드 상품 페이지 기준. 연회비 국내 27,000원, Mastercard 30,000원. 전월 40만/80만/120만원 이상 구간에 따라 렌탈 자동이체 건당 3천/5천/7천P(1만원 이상, 업체별 월 1건, 통합 월 5건), 생활월납 자동이체 건당 2천/4천/6천P(6천원 이상, 대상별 월 1건, 통합 월 3건), 디지털 구독 정기결제 건당 2천/4천/6천P(6천원 이상, 업체별 월 1건, 통합 월 3건). Plus는 전월 40만원 이상이면 커피·편의점 업종 각 월 누적 5만원 이상 3천P, 해외 일시불 월 5만원 이상 2천P. 신규 회원은 등록월+1개월까지 40만 구간. 실적 제외: 연회비, 카드대출, 수수료·이자, 거래취소, 기프트카드·상품권, 선불카드·선불전자지급수단. 생활월납 대상인 아파트관리비·도시가스·전기요금은 실적에 들어간다.'
