notes: CJ ONE 신한카드 체크 상품 페이지 기준(2026-10-12). 출시 2018-07-20, 준법감시 심의필 제20260625-Dpp-001호(2026.06.25). 연회비는 페이지 HTML의 Master, UPI 모두 0원. 전월 20만·50만·80만·100만원 이상이면 통합캐시백한도 5천·1만·1만5천·2만원. 신규 발급 회원은 등록월 다음 달 말까지 통합한도 5천원(20만 구간). 실적 제외는 수수료, 이자, 기프트카드 구매, 선불카드 충전. 2026-10-10 새 방식대로 후불교통 반영월 구분 대신 시내버스와 지하철을 실적에서 뺐다.
