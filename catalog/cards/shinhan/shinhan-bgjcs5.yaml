schema_version: 2
id: shinhan-bgjcs5
issuer: shinhan
name: 신한카드 On 체크
short_name: 신한 On 체크
kind: check
product_codes: [BGJCS5, BGJCYZ]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
  - {scope: global, brand: visa, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/check/1214936_2206.html', fetched_at: 2026-10-12}
checked_at: 2026-10-12
revisions:
  - effective_from: 2022-03-04
    source: page
    tiers: [0, 200000, 500000, 800000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      installment: full_at_purchase
      cancellation: cancel_month
    new_card: {until: next_month_end, tier: 200000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.primary_secondary_fee, gift_card, insurance.social, prepaid_charge, tax, utility]
      unmodeled: [포인트로 결제한 금액과 신한카드 할인 서비스(이벤트 포함)가 적용된 거래는 적립하지 않는다]
    limits:
      - {key: daily-life, per: month, amount: 8000}
    benefits:
      - key: easypay
        title: 간편결제 온라인 1~2% 적립
        source: page
        evidence: [간편결제(Pay) 이용 시 최대 2% 적립, 마이신한포인트로 적립되며 월간 적립한도는 8천원 입니다., '신한 SOL페이(신한 슈퍼SOL로 결제 포함), 네이버페이, 카카오페이, SK페이, SSG페이, 쿠페이, 페이코, 스마일페이, 배민페이, L.pay', 온라인 결제에 한하여 제공되며 오프라인 매장에서 바코드나 스마트폰 NFC기능을 통한 거래 등은 적용되지 않습니다., 온라인 결제는 국내 거래에 한하여 적립됩니다., '20만원 이상 50만원 미만 1%, 50만원 이상 80만원 미만 1.5%, 80만원 이상 2%']
        target: {all: true}
        when:
          - {channel: online}
          - {region: domestic}
          - payment: [baemin_pay, coupay, kakao_pay, l_pay, naver_pay, payco, shinhan_sol_pay, smile_pay, ssg_pay]
        reward:
          type: points
          program: mysinhan_point
          rate: {200000: 1, 500000: 1.5, 800000: 2}
        limits:
          - {per: month, amount: 8000}
        tiers: {from: 200000}
        unmodeled: [SK페이는 공통 결제수단에 없어 계산하지 않는다]
      - key: daily-life-cafe
        title: 생활편의영역 커피전문점 1~2% 적립
        source: page
        evidence: [생활편의영역 이용시 2% 적립, 마이신한포인트로 적립되며 월간 적립한도는 8천원 입니다., '통신요금 SKT, KT, LGU+ / 편의점·생활잡화 GS25, CU, 세븐일레븐, 이마트24, 올리브영, 다이소 / 디지털컨텐츠 유튜브프리미엄, 넷플릭스, 왓차, 웨이브, 디즈니플러스 / 커피전문점 업종', 통신요금은 순수 통신요금 결제금액 자동이체만 대상이며 약정금액 대납 지점을 통한 월납 알뜰폰은 적립 제외됩니다., 편의점/생활잡화는 오프라인 매장에 한하여 적용, 디지털컨텐츠의 경우 공식 홈페이지(앱)을 통해 직접 신청한 정기결제(자동이체)이용건에 한하여 적용]
        target:
          categories: [cafe]
        reward:
          type: points
          program: mysinhan_point
          rate: {200000: 1, 500000: 1.5, 800000: 2}
        limits:
          - {shared: daily-life}
        tiers: {from: 200000}
        unmodeled: ['백화점, 할인점, 면세점, 공항 등에 입점된 커피전문점은 적립하지 않는다']
      - key: daily-life-convenience
        title: 생활편의영역 편의점·생활잡화 1~2% 적립
        source: page
        evidence: ['편의점/생활잡화 GS25, CU, 세븐일레븐, 이마트24, 올리브영, 다이소', 편의점/생활잡화는 오프라인 매장에 한하여 적용되며 인터넷이나 모바일앱을 통한 온라인 거래는 적용되지 않습니다.]
        target:
          merchants: [cu, daiso, emart24, gs25, olive_young, seven_eleven]
        when:
          - {channel: offline}
        reward:
          type: points
          program: mysinhan_point
          rate: {200000: 1, 500000: 1.5, 800000: 2}
        limits:
          - {shared: daily-life}
        tiers: {from: 200000}
        unmodeled: ['백화점, 할인점 등에 입점한 매장은 적립하지 않는다']
      - key: daily-life-telecom
        title: 생활편의영역 통신요금 자동이체 1~2% 적립
        source: page
        evidence: ['통신요금 SKT, KT, LGU+', 통신요금은 순수 통신요금 결제금액 자동이체만 대상이며 약정금액 대납 지점을 통한 월납 알뜰폰은 적립 제외됩니다.]
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward:
          type: points
          program: mysinhan_point
          rate: {200000: 1, 500000: 1.5, 800000: 2}
        limits:
          - {shared: daily-life}
        tiers: {from: 200000}
      - key: daily-life-digital
        title: 생활편의영역 디지털컨텐츠 정기결제 1~2% 적립
        source: page
        evidence: ['디지털컨텐츠 유튜브프리미엄, 넷플릭스, 왓차, 웨이브, 디즈니플러스', '디지털컨텐츠의 경우 공식 홈페이지(앱)을 통해 직접 신청한 정기결제(자동이체)이용건에 한하여 적용됩니다.(1회성 일반구매 결제, 앱 내 결제, 구글플레이스/앱스토어 등 앱마켓 결제, 통신요금 포함(합산) 결제인 경우 서비스가 제외)']
        target:
          merchants: [disney_plus, netflix, watcha, wavve, youtube_premium]
        when:
          - billing: [autopay, subscription]
        reward:
          type: points
          program: mysinhan_point
          rate: {200000: 1, 500000: 1.5, 800000: 2}
        limits:
          - {shared: daily-life}
        tiers: {from: 200000}
      - key: overseas
        title: 해외 이용금액 1.3% 적립
        source: page
        evidence: [해외 이용금액에 대해 1.3% 적립, 전월 이용금액 관계없이 제공, 일/월/한도 제한 없음, 해외 일시불만 적용되며 해외 일시불 거래 후 할부로 전환하는 경우는 제외됩니다., 해외겸용(VISA) 카드 발급 후 이용시 제공됩니다.]
        target: {all: true}
        when:
          - {region: overseas}
          - {lump_sum: true}
        reward: {type: points, program: mysinhan_point, rate: 1.3}
    unmodeled: [교통카드 이용금액은 전전월 금액이 전월 실적에 반영되고 모바일 후불교통은 전월 금액이 반영되는데 결제수단별 반영월을 담을 수 없어 시내버스와 지하철을 실적에서 뺐다. 실적이 실제보다 적게 잡힌다, 선불전자지급수단 구매와 충전은 실적과 적립에서 빠진다, 서비스는 이용한 거래 순서대로 적용한다]
notes: 신한카드 On 체크 상품 페이지 기준. 연회비 없음. 간편결제 온라인 결제와 생활편의영역이 전월 20만원 이상부터 구간별 1%, 1.5%, 2%로 각각 월 8천 포인트, 합계 월 1만 6천 포인트까지 적립한다. 해외 1.3%는 실적과 한도 없이 적립한다. 이 카드 페이지에는 간편결제 가맹점명 제외 문구가 없고 간편결제 적립이 핵심이라 카드사 기본값의 간편결제 제외를 덮었다. 신규 발급 회원은 등록월 다음 달 말까지 20만원 구간을 적용한다. 디자인만 다른 같은 상품 BGJCYZ도 이 카드로 등록한다.
