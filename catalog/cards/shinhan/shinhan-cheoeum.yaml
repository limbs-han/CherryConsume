        reward: {type: points, program: mysinhan_point, rate: 5}
        limits:
          - {per: txn, amount: 500}
          - {shared: integrated}
        tiers: {from: 300000}
        notes: 오늘도 5%. 1회 1만원까지, 오늘도 5% 전체 일 최대 1천P. 쿠팡 와우 멤버십 요금은 제외(membership 혜택만 적용). 상품권·선불 구입 제외
