        notes: 일상 속 5%. 올리브영(온·오프라인), 다이소(오프라인), 오늘의집(온라인), KTX, 패션(무신사·지그재그·W컨셉·29CM·에이블리 공식 홈페이지·앱만). 1회 5만원까지. 월 한도는 daily-travel과 공유
