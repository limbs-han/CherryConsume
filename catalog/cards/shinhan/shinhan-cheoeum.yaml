        notes: 일상 속 5%. 해외는 일시불(해외이용·직구 포함)만, Mastercard 카드만, 최종 원화 청구금액 기준. 할부 전환·국내 PG 경유 결제·현금인출·가상화폐·사행성 제외. 1회 5만원까지. 월 한도는 daily-shop과 공유
      - key: sub-telecom
        title: 통신요금 10% 적립
