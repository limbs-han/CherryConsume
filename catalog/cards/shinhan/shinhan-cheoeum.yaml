        notes: 정기결제 최대 20%. 공식 홈페이지 정기결제(자동이체)만. 1회성 구매, 앱마켓 인앱결제, 통신요금 합산 결제 제외. 월 한도는 통신·멤버십과 공유
      - key: sub-membership
        title: 쿠팡 와우·네이버플러스 멤버십 20% 적립
        target:
          merchants: [coupang_wow, naver_plus_membership]
        when:
          - {channel: online}
        reward: {type: points, program: mysinhan_point, rate: 20}
