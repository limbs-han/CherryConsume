notes: '신한카드 처음 상품 페이지와 신한카드 상품 API 기준. 첫 개정 시행일 근거: page. 카드 출시 일자 2024.04.02. 출시 뒤 이 카드의 부가서비스 변경 공지는 없다. 공지사항 전체를 2026-09-29에 확인했다. 2025.11.14 공지는 삼성월렛의 처음(ANNIVERSE) 디자인 적용이라 혜택 변경이 아니다. 같은 목록에 디자인판 신한카드 처음(ANNIVERSE, entryId 202408190001)과 체크카드 신한카드 처음 체크가 따로 있다. 모든 적립은 마이신한포인트(1P=1원). 서비스마다 월 통합 적립 한도가 따로다. 오늘도 5%는 integrated, 일상 속 5%는 daily, 정기결제는 sub, 소비관리 보너스는 bonus. 네 서비스를 다 채우면 월 최대 1만8천/3만6천/7만P. 전월(1일~말일) 거래 시점 이용금액(일시불+할부) 기준. 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 상품권·선불전자지급수단, 국세·지방세·수도요금·지방세외수입·환경개선부담금, 4대보험, 도시가스·전기요금·아파트관리비·TV수신료, 스쿨뱅킹, 대학(원) 등록금, 거래 취소금액. 적립 제외: 실적 제외 항목, 무이자할부(부분 무이자 포함), 이 카드로 할인 서비스를 받은 거래, 포인트 사용 금액. 카드대출, 수수료, 이자는 결제가 아니라 담지 않았다. 최초 신규 발급 회원은 카드 사용 등록월의 다음 달 말까지 30만~50만원 구간. 그 기간에 50만원 이상 쓰면 다음 달 해당 구간. 후불교통 기능 카드로만 신청 가능. 가족카드 불가.'
