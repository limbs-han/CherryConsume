      - key: instant-pay
        title: 즉시결제 0.3% 적립
        target: {all: true}
        reward: {type: points, program: mysinhan_point, rate: 0.3}
        limits:
          - per: month
            amount: {300000: 3000, 500000: 6000, 1000000: 10000}
        tiers: {from: 300000}
        notes: 소비관리 보너스. 이번 달 일시불 이용금액을 이번 달 안에 즉시결제한 금액만. 포인트 적립 제외 거래 제외. 다음 달 25일 적립. 월 한도는 계획소비 적립과 공유(계획소비가 먼저)
notes: '신한카드 상품 페이지(여신금융협회 심의필 제2025-C1h-16946호, 2025.11.21~2026.11.20)와 신한카드 상품 API(entryId 202404150001) 기준. 연회비는 API 값(국내전용 15,000원, Mastercard 18,000원). 공식 목록상 신용카드 이름은 "신한카드 처음". 같은 목록에 디자인판 "신한카드 처음 (ANNIVERSE)"와 체크카드 "신한카드 처음 체크"가 따로 있음. 모든 혜택은 마이신한포인트 적립(1P=1원). 서비스마다 월 통합 적립 한도가 따로 있음. integrated_cap은 오늘도 5% 한도(5천/1만/2만P). 일상 속 5%, 정기결제, 소비관리 보너스는 구간별 혜택으로 나누고 counts_toward_integrated_cap false. 네 서비스를 다 채우면 월 최대 1만8천/3만6천/7만P. 전월(1일~말일) 거래 시점 이용금액(일시불+할부) 기준. 해외는 매입일 기준, 교통카드는 전전월 이용금액 반영(모바일 후불교통은 전월). 실적 제외 중 업종 코드에 없는 것: 단기·장기 카드대출, 각종 수수료·이자, 선불카드·선불전자지급수단 구매·충전, 지방세외수입, 환경개선부담금, 4대보험, TV수신료, 유치원·초중고 납입금(스쿨뱅킹), 대학(원) 등록금, 거래 취소금액. 수도요금·도시가스·전기요금은 utility로 처리. 포인트 적립 제외: 위 실적 제외 항목, 무이자할부(부분 무이자 포함), 이 카드로 할인 서비스를 받은 거래 전체, 포인트 사용 금액. 간편결제 가맹점명이 페이 이름이면 적립 제외. 온라인은 해당 업체 사이트·앱 직접 접속만. 최초 신규 발급 회원은 카드 사용 등록월의 다음 달 말까지 30만~50만원 구간 적용. 그 기간에 50만원 이상 쓰면 다음 달 해당 구간. 후불교통 기능 카드로만 신청 가능. 가족카드 불가. 모델 제외: 소비관리 보너스 계획소비 적립(매월 1~5일 목표 소비금액 설정 시 500P, 이번 달 이용금액이 목표 ±5만원이면 5천P, 30만~50만원 구간은 최대 3천P, 다음 달 25일 적립). 즉시결제 0.3%와 한도 공유. 공식 문구 미확인: 취소를 어느 달 실적에서 빼는지.'
