notes: 신한카드 Deep Taking 상품 페이지 기준(2026-10-12). 출시 2019-07-11, 심의필 제2025-C1h-17031호(2025.11.24~2026.11.23)라 시작일을 심의 시작일로 두었다. 연회비는 페이지 HTML의 Visa 플래티늄 2만원, URS 플래티늄 2만원. URS는 신한카드와 JCB가 만든 국내전용 연회비 브랜드라 국내 칸에 jcb로 적었다. 전월 40만원 이상이면 17개 영역 중 그 달 이용금액 상위 5개 영역에 각 2%를 영역별 월 1만 포인트, 통합 월 1만·3만·5만 포인트(40만·80만·120만원) 한도로 적립한다. 신규 발급 회원은 등록월 다음 달 말까지 40만 구간 한도. 2026-10-12 결정대로 시내버스와 지하철을 실적에서 뺐다.
