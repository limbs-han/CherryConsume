        evidence: ['신한 SOL페이가 아닌 방식으로 결제 시: 국내 신판(일시불+할부) 이용금액 0.5% 결제일 할인', 전월 이용금액 조건/할인 한도 없음]
        target: {all: true}
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 0.5}
        stack: daily
