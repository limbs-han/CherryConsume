    unmodeled: ['Weekly 할인 쿠폰(월 3천원 1회, 1천원 3회, 전월 40만원 이상, 5천원 이상)은 매주 신한 SOL페이에서 쿠폰 받기를 해야 해서 계산하지 않는다. 쿠폰이 적용된 거래는 Daily 할인을 받지 않는다', 'Monthly 단골 적립(전월 최다 이용 오프라인 가맹점의 월 3, 6, 9번째 이용에 1천 포인트)은 가맹점이 지난달 이용으로 자동 선택되어 계산하지 않는다', '교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다', 해외 이용금액은 매입일 기준으로 실적 달을 정한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택이 시작된 날을 찾지 못했다. 카드 출시는 2022.05.18이고 카드사 공통 규칙 시작일을 시작일로 둔다, assumed: '2024-03-22'}
notes: 신한카드 상품 페이지와 상품 API 기준. 카드 출시 2022.05.18. 연회비 국내 1.5만원, 해외겸용 1.8만원. Daily 할인은 전월 실적과 한도 없이 국내 SOL페이 0.9%, 그 밖 0.5%, 해외 일시불 0.5%. Weekly 쿠폰과 Monthly 단골 적립은 전월 40만원 이상, 신규 회원은 등록월 다음 달 말까지 실적과 관계없이 제공.
