        source: page
        evidence: [해외 일시불 이용금액 0.5% 결제일 할인, 해외 일시불 거래 후 할부로 전환하는 경우는 제외됩니다., 해외 이용금액 할인 서비스는 해외겸용 카드 발급 후 이용 시 제공됩니다.]
        target: {all: true}
        when:
          - {region: overseas}
