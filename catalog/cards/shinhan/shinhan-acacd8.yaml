notes: '신한카드 상품 페이지 기준. 연회비 국내 22,000원, Mastercard 25,000원. LG U+ 통신요금(휴대폰·인터넷·TV·집전화·인터넷전화) 자동납부를 전월 40만원 이상 1만원, 80만원 이상 1만5천원까지 요금만큼 할인. 영화는 전월 30만원 이상, CGV·메가박스 공식 홈페이지·앱 예매 9천원 이상 1,500원, 1만8천원 이상 3,000원. 신규 회원은 등록월+1개월까지 통신 40만 구간, 영화는 실적과 관계없이 제공. 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 거래 취소, 무이자할부, 국세·지방세·수도요금, 4대보험.'
