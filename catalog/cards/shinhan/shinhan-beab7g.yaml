    unmodeled: ['신세계백화점 입점 영화관 주말 3천원 할인(1만원 이상, 일 1회, 월 2회, 현장 매표소)은 공통 가맹점이 없어 계산하지 않는다', '롯데월드·서울랜드 본인 자유이용권 50% 할인(전월 30만원 이상, 일 1회, 연 3회)은 공통 가맹점이 자유이용권 밖의 결제까지 묶어 계산하지 않는다', 연간 1천만원 이상 이용 시 해외 일시불 5% 캐시백(최대 5만원)은 연간 누적 실적이라 계산하지 않는다, 생활 할인 한도는 원문 표에 50만원 이상 구간만 있다. SRT와 버스·지하철 3%는 전월 실적이 필요 없다고 해서 0 구간에도 50만 구간의 1만원 한도를 같이 쓰는 것으로 두었다, 가족카드의 전월 실적과 할인 한도는 본인 카드와 합산한다, 교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 결제일 할인은 승인 순서대로 적용한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 지금 혜택 구성이 시작된 날을 원문에서 찾지 못해 신한카드 부속약관 시행일로 두었다. 출시일은 2017-04-01이다, assumed: '2024-03-22'}
notes: 신세계 신한카드 상품 페이지 기준(2026-10-12). 출시 2017-04-01, 심의필 제2017-C1a-05121호. 연회비는 페이지 HTML의 Master 1만5천원, UPI 1만2천원. 원문의 "최대 5%"는 건당 할인 상한 때문에 붙은 말로 보고 5%로 계산한다. 같은 영역의 SRT는 "최대 3%"와 "5만원 요금까지 3%"를 함께 적었다. 실적은 국내 일시불과 할부만 센다. 신세계백화점 할인 한도 50만·100만·150만원 구간 1만·2만·3만원, 생활 할인 1만·1만5천·2만원. 신규 발급 회원은 등록월 다음 달 말까지 50만 구간. 2026-10-12 결정대로 시내버스와 지하철을 실적에서 뺐다.
