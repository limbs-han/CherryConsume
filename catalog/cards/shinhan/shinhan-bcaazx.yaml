        tiers: {from: 500000}
      - key: shop-homeshopping-10
        title: 홈쇼핑 10% 할인
        source: page
        evidence: ['홈쇼핑 | CJ온스타일, GS SHOP', 구분영역별 각각 일 1회/월 2회 할인 적용, 할인 전 승인금액 1회 3만원까지 할인적용(1회 최대 할인금액 3천원)]
        target:
          merchants: [cj_onstyle, gs_shop]
        reward: {type: billing_discount, rate: 10}
        limits:
