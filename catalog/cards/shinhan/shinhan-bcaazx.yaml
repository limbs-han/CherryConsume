        source: page
        evidence: ['소셜커머스 | 쿠팡, 티켓몬스터', 구분영역별 각각 일 1회/월 2회 할인 적용, 할인 전 승인금액 1회 3만원까지 할인적용(1회 최대 할인금액 3천원), 소셜커머스는 사이트 직접 접속 시 혹은 해당 앱을 통해 접속 시에만 할인 적용됩니다.]
        target:
