schema_version: 2
id: shinhan-bcaazx
issuer: shinhan
name: 신한카드 Shopping
short_name: 신한 Shopping
kind: credit
product_codes: [BCAAZX]
status: on_sale
annual_fees:
  - {scope: domestic, brand: amex, amount: 20000}
  - {scope: global, brand: visa, amount: 23000}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/credit/1187935_2207.html', fetched_at: 2026-10-12}
checked_at: 2026-10-12
revisions:
  - effective_from: 2026-10-12
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 500000, 1000000, 1500000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, gift_card, prepaid_charge, transit.bus_city, transit.subway]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
      exclude_applied: 0
    new_card:
      until: next_month_end
      tier: 500000
      tier_by_benefit: {partner-kurly-10: 300000}
      from: registration
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, toss_pay]
        - {interest_free: true}
      categories: [annual_fee, gift_card, prepaid_charge]
    limits:
      - key: shopping
        per: month
        amount: {500000: 15000, 1000000: 35000, 1500000: 50000}
      - key: life
        per: month
        amount: {500000: 10000, 1000000: 15000, 1500000: 20000}
    benefits:
      - key: shop-department-10
        title: 백화점 10% 할인
        source: page
        evidence: ['백화점 | 롯데, 현대, 신세계, 갤러리아, AK백화점', 구분영역별 각각 일 1회/월 2회 할인 적용, 할인 전 승인금액 1회 5만원까지 할인적용(1회 최대 할인금액 5천원), 상품권 구매 및 온라인 매장 이용건은 할인에서 제외됩니다.]
        target:
          merchants: [ak_plaza, galleria, hyundai_department, lotte_department, shinsegae_department]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 50000}
          - {per: day, count: 1}
          - {per: month, count: 2}
          - {shared: shopping}
        tiers: {from: 500000}
      - key: shop-outlet-10
        title: 프리미엄 아울렛 10% 할인
        source: page
        evidence: ['프리미엄 아울렛 | 롯데, 현대, 신세계 사이먼', 구분영역별 각각 일 1회/월 2회 할인 적용, 할인 전 승인금액 1회 5만원까지 할인적용(1회 최대 할인금액 5천원)]
        target:
          merchants: [hyundai_premium_outlet, lotte_premium_outlet, shinsegae_premium_outlet, shinsegae_simon]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 50000}
          - {per: day, count: 1}
          - {per: month, count: 2}
          - {shared: shopping}
        tiers: {from: 500000}
      - key: shop-mart-10
        title: 마트 10% 할인
        source: page
        evidence: ['마트 | 이마트, 홈플러스, 롯데마트, 메가마트, 탑마트', 구분영역별 각각 일 1회/월 2회 할인 적용, 할인 전 승인금액 1회 5만원까지 할인적용(1회 최대 할인금액 5천원), '기업형 슈퍼마켓(이마트 에브리데이, 홈플러스 익스프레스, 롯데슈퍼)은 마트 할인에서 제외됩니다.']
        target:
          merchants: [emart, homeplus, lotte_mart, mega_mart, top_mart]
        when:
