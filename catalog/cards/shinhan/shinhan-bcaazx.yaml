      - key: life-zakka-10
        title: 올리브영·다이소 10% 할인
        source: page
        evidence: ['잡화 | 올리브영, 다이소', 구분영역별 각각 일 1회/월 5회 할인 적용, 할인 전 승인금액 1회 1만원까지 할인적용(1회 최대 할인금액 1천원), '잡화의 경우 온라인 매장, 백화점 입점 매장은 할인이 적용되지 않습니다.']
        target:
          merchants: [daiso, olive_young]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 10000}
          - {per: day, count: 1}
          - {per: month, count: 5}
          - {shared: life}
        tiers: {from: 500000}
        unmodeled: [백화점 입점 매장은 할인하지 않는다]
      - key: life-bookstore-10
        title: 온라인서점 10% 할인
        source: page
        evidence: ['온라인서점 | 교보, 반디앤루니스, Yes24, 알라딘 온라인 서점', 구분영역별 각각 일 1회/월 5회 할인 적용, 할인 전 승인금액 1회 1만원까지 할인적용(1회 최대 할인금액 1천원)]
        target:
          merchants: [aladin, kyobo_book, yes24]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 10000}
          - {per: day, count: 1}
          - {per: month, count: 5}
          - {shared: life}
        tiers: {from: 500000}
        unmodeled: [반디앤루니스는 공통 가맹점이 없어 넣지 않았다]
      - key: life-fuel-60
        title: 4대 정유사 리터당 60원 할인
        source: page
        evidence: ['주유 | SK에너지, GS칼텍스, S-Oil, 에이치디현대오일뱅크', '휘발유, 등유, 경유(LPG 제외)', 일1회, 월5회, 할인 전 승인금액 1회 5만원까지 할인적용, 주유 할인은 정유사 공시 기준 휘발유가 기준으로 할인이 적용되며 등유/경유 거래도 휘발유가 기준으로 환산하여 서비스 제공됩니다.]
        target:
          merchants: [gs_caltex, hd_oilbank, s_oil, sk_energy]
        reward: {type: billing_discount, per_liter: 60}
        limits:
          - {per: txn, base: 50000}
          - {per: day, count: 1}
          - {per: month, count: 5}
          - {shared: life}
        tiers: {from: 500000}
        unmodeled: [LPG는 할인하지 않는다. 휘발유·경유·등유만, 리터는 정유사 공시 휘발유가로 환산한다. 앱은 전국 평균 휘발유 가격으로 환산한다]
      - key: partner-kurly-10
        title: 컬리 10% 할인
        source: page
        evidence: ['마켓컬리, 프레딧, 집반찬연구소 10% 할인', 각각 일 1회/월 2회, 할인 전 승인금액 1회 5만원까지 할인적용(1회 최대 할인금액 5천원), 전월 카드이용금액(일시불+할부) 30만원 이상 이용 시 할인이 적용됩니다., 제휴사 사이트 직접 접속 시 혹은 해당 앱을 통해 접속 시에만 할인 적용됩니다.]
        target:
          merchants: [kurly]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 50000}
          - {per: day, count: 1}
          - {per: month, count: 2}
        tiers: {from: 300000}
    unmodeled: ['해외이용 캐시백(전년도 국내 이용 1천만원 이상 회원에게 연간 해외 일시불 이용금액의 5%, 연 최대 5만원)은 연간 누적 조건이라 계산하지 않는다', 프레딧과 집반찬연구소 10% 할인은 공통 가맹점이 없어 계산하지 않는다, 할인은 영역별 이용 순서대로 적용하고 통합할인한도는 본인과 가족카드를 합산한다, 간편결제로 결제해 가맹점이 구분되지 않으면 할인하지 않는다, 교통카드 이용금액은 실물 전전월 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 이 혜택 구성의 시행일이 상품 페이지에 없어 확인한 날을 넣었다, assumed: '2026-10-12'}
  - {path: 'revisions[0].spend.cancellation', question: 취소 금액을 어느 달 실적에서 빼는지 상품 페이지에 없다. 신한카드 기본값을 따랐다, assumed: cancel_month}
notes: '신한카드 상품 페이지 기준. 연회비는 Visa 2만 3천원, S&(AMEX 제휴 국내 브랜드) 2만원. 쇼핑 할인 6개 영역(백화점, 프리미엄 아울렛, 마트, 창고형, 홈쇼핑, 소셜커머스)은 영역별 일 1회 월 2회이고 쇼핑 한도를 같이 쓴다. 생활 할인 4개 영역(커피, 잡화, 온라인서점, 주유)은 생활 한도를 같이 쓴다. 두 한도는 전월 50만, 100만, 150만원 구간마다 다르다. 제휴 할인은 전월 30만원 이상이고 한도가 따로다. 신규 발급 회원은 등록월 다음 달 말까지 50~100만원 구간 한도를, 제휴 할인은 실적과 관계없이 받는다. 실적 제외: 카드대출, 연회비, 수수료, 이자, 기프트카드 구매, 선불카드 충전, 취소.'
