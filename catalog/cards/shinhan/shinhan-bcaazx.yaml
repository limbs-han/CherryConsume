          - {per: month, count: 2}
          - {shared: shopping}
        tiers: {from: 500000}
      - key: life-coffee-10
        title: 커피전문점 10% 할인
        source: page
        evidence: ['커피 | 스타벅스, 커피빈, 카페베네, 엔제리너스, 투썸플레이스', 일 1회/월 10회 할인 적용, 할인 전 승인금액 1회 1만원까지 할인적용(1회 최대 할인금액 1천원)]
