        title: GS25·CU·스타벅스·이디야·택시 5% 결제일 할인
        source: page
        evidence: ['GS25, CU 5% 결제일 할인', '스타벅스, 이디야 5% 결제일 할인', 택시 5% 결제일 할인, '오프라인 현장 일반 결제만 가능하며, 온라인/자동 결제 등은 적용 제외됩니다.', '생활서비스 월 이용금액 한도 30만원 이상 70만원 미만 15만원, 70만원 이상 30만원']
        target:
          categories: [taxi]
          merchants: [cu, ediya, gs25, starbucks]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: life}
        tiers: {from: 300000}
        unmodeled: [택시는 오프라인 현장 일반 결제만 할인하고 앱 자동결제는 빠진다, '상품권 구입, 선불카드 충전은 할인하지 않는다']
    unmodeled: ['롯데시네마 일반관 5천원 현장 할인(월 1회, 70만원 이상 2회)은 공통 가맹점이 매점까지 묶여 계산하지 않는다', 정유사는 연 1회 바꿀 수 있고 바꾼 다음 날 거래부터 적용한다, 모든 주유소 주유와 LPG 이용금액은 실적에서 빠진다, 본인과 가족카드의 실적과 이용금액 한도는 합산한다, 후불 하이패스 실적이 카드 실적에 합산된다, 교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 해외 이용금액은 매입일 기준으로 실적 달을 정한다, 포인트 사용 금액과 신한카드 할인이 적용된 거래는 할인하지 않는다]
notes: 신한카드 Deep Oil 상품 페이지와 상세 API 기준(2026-10-12). 출시 2018-02-13, 심의필 제2025-C1h-17341호(2025.12.01~2026.11.30)라 시작일을 심의 시작일로 두었다. 연회비는 페이지 HTML의 Master 1만3천원, API의 S&(cardBrandCode 8, 아멕스 제휴 국내 브랜드) 1만원. 전월 30만원 이상이면 고른 정유사 10%, 스피드메이트·주차장 10%, 편의점·커피·택시 5%를 영역별 월 이용금액 한도(30만원 이상 15만원, 70만원 이상 30만원) 안에서 할인한다. 정유사를 고르지 않으면 GS칼텍스다. 신규 발급 회원은 등록월 다음 달 말까지 30만 구간. 2026-10-12 결정대로 시내버스와 지하철을 실적에서 뺐다.
