id: shinhan-pointplan
issuer: shinhan
name: 신한카드 Point Plan
kind: credit
annual_fee_domestic: 20000
annual_fee_global: 23000
active: true
source_url: https://www.shinhancard.com/pconts/html/card/apply/credit/1226113_2207.html
updated_at: 2026-09-28
spend_basis: prev_calendar_month
spend_tiers:
  - { min_spend: 0, integrated_cap: null }
  - { min_spend: 400000, integrated_cap: 10000 }    # 일상 생활비 적립 한도
  - { min_spend: 800000, integrated_cap: 30000 }
  - { min_spend: 1200000, integrated_cap: 50000 }
spend_rule:
  excluded_categories: [annual_fee, gift_card, tax, apartment_fee, pharmacy]
  exclude_interest_free_installment: false
  exclude_discounted: false
  installment_basis: full_at_purchase
  cancellation_basis: cancel_month
notes: >-
  신한카드 상품 페이지(여신금융협회 심의필 제2025-C1h-16768호, 2025.11.19~2026.11.18)와 신한카드 상품 API(entryId 202402020001) 기준. 연회비는 API 값(국내전용 20,000원, VISA 23,000원).
  모든 혜택은 마이신한포인트 적립(1P=1원), 매월 이용분을 다음 달 20일 적립.
  integrated_cap은 일상 생활비 적립 서비스(국내 결제금액별 0.5~3%, SOL페이 추가 0.1%, 해외 1%)의 월 통합 적립 한도 1만/3만/5만P. 주말 외식비와 정기결제 자동납부는 한도가 따로라 counts_toward_integrated_cap false.
  가족행사월(5월, 12월)은 전월 40만원 이상이면 일상 생활비 한도 1만P 추가(2만/4만/6만P). 모델에 못 담음.
  전월(1일~말일) 거래 시점 이용금액(일시불+할부) 기준. 해외는 매입일 기준, 교통카드는 전전월 이용금액 반영(모바일 후불교통은 전월). 본인·가족카드 실적·한도·횟수 합산.
  실적 제외 중 업종 코드에 없는 것: 단기·장기 카드대출, 각종 수수료·이자, 선불카드·선불전자지급수단 구매·충전, 수도요금, 4대보험, 거래 취소금액, 학원(일반전문학원·학습지·자동차학원) 업종, 의약품 전용몰·제약회사, 철도 업종. 전기·도시가스요금과 통신요금은 실적에 들어감.
  모든 적립 제외: 기프트카드·선불·상품권 구매·충전, 무이자할부(부분 무이자 포함), 국세·지방세·수도요금, 4대보험, 아파트관리비, 스쿨뱅킹·대학(원) 등록금, 할인 서비스를 받은 거래 전체, 포인트 사용 금액, 거래 취소, 의약품 전용몰·제약회사·약국, 철도.
  간편결제 가맹점명이 페이 이름이면 적립 제외. 온라인은 해당 업체 사이트·앱 직접 결제만. 부분취소는 취소 반영 후 최종 금액으로 적립률 다시 적용.
  신규 발급 회원은 카드 사용 등록월의 다음 달 말까지 일상 생활비는 40만~80만원 구간, 주말 외식비는 40만원 미만 구간, 자동납부는 40만원 이상 구간 적용. 그 기간에 일상 생활비는 80만원, 주말 외식비는 40만원 이상 쓰면 다음 달 해당 구간.
  가족카드 발급 가능(연회비 없음). 후불교통 신청 가능.
  공식 문구 미확인: 취소를 어느 달 실적에서 빼는지.
