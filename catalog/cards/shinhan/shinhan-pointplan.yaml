notes: '신한카드 Point Plan 상품 페이지와 신한카드 상품 API 기준. 첫 개정 시행일 근거: notice-20240626. 카드 출시 일자 2024.01.29. 2024.06.26 약관 개정 공지(시행 즉시)가 SOL페이 추가 적립 기준을 바꿨고 그 뒤 이 카드의 변경 공지는 없다. 공지사항 전체를 2026-09-29에 확인했다. 모든 혜택은 마이신한포인트(1P=1원), 매월 이용분을 다음 달 20일 적립. 일상 생활비(국내 결제금액별 0.5~3%, SOL페이 추가 0.1%, 해외 1%) 월 통합 한도는 integrated 1만/3만/5만P. 가족행사월(5월, 12월)은 전월 40만원 이상이면 1만P 추가(2만/4만/6만P). 주말 외식비는 weekend-day와 weekend-month, 자동납부는 영역별 5천P로 한도가 따로다. 전월(1일~말일) 거래 시점 이용금액(일시불+할부) 기준. 교통카드는 전전월 이용금액 반영. 실적 제외: 카드대출, 연회비, 수수료·이자, 기프트·선불카드, 상품권·선불전자지급수단, 국세·지방세·수도요금, 4대보험, 아파트관리비, 거래 취소금액, 학원(일반전문학원·학습지·자동차학원), 의약품 전용몰·제약회사·약국, 철도. 전기·도시가스요금과 통신요금은 실적에 들어간다. 적립 제외: 기프트·선불·상품권, 무이자할부(부분 무이자 포함), 국세·지방세·수도요금, 4대보험, 아파트관리비, 스쿨뱅킹·대학(원) 등록금, 할인 서비스를 받은 거래, 포인트 사용 금액, 거래 취소, 의약품 전용몰·제약회사·약국, 철도. 카드대출, 수수료, 이자는 결제가 아니라 담지 않았다. 신규 발급 회원은 카드 사용 등록월의 다음 달 말까지 일상 생활비 40만~80만원, 주말 외식비 40만원 미만, 자동납부 40만원 이상 구간. 그 기간에 일상 생활비는 80만원, 주말 외식비는 40만원 이상 쓰면 다음 달 해당 구간. 가족카드 발급 가능(연회비 없음). 후불교통 신청 가능.'
