notes: '신한카드 상품 페이지 기준. 페이지 상품명은 신한카드 Hey Young 체크이고 수집 이름의 포차코는 카드 디자인이다. 먼작귀 등 다른 디자인과 같은 상품이다. 연회비 없음. 가족카드 불가, 후불교통 가능. 국내 일상 서비스와 간편결제 1%는 전월 20만/50만/80만/100만원 구간 통합 한도 5천/1만/2만/3만원 안이고 간편결제는 생활 서비스와 겹치면 받지 않아 같은 묶음 맨 뒤에 두었다. 해외 1.2%는 실적·한도 없이 따로다. 신규 발급 회원은 등록월 다음 달까지 20만원 구간. 실적 제외: 현금서비스, 카드론, 연회비, 수수료, 이자, 기프트·선불카드, 상품권·선불전자지급수단, Tmoney 사용 금액. 취소 금액을 어느 달 실적에서 빼는지 페이지에 없어 카드사 기본값을 쓴다. 디자인만 다른 같은 상품 BGGDT9도 이 카드로 등록한다.'
