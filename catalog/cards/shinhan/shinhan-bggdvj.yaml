        title: 해외 일시불 1.2% 캐시백
        source: page
        evidence: [해외 전 가맹점(온라인포함) 1.2% 캐시백, 지난달 이용 금액 조건 없이 제공, 일/월 횟수 및 한도 제한 없음, 통합 캐시백 한도와 별도로 제공합니다.]
        target: {all: true}
        when:
          - {region: overseas}
          - {lump_sum: true}
