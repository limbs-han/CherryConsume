schema_version: 2
id: shinhan-boadp9
issuer: shinhan
name: 알리익스프레스 신한카드
kind: credit
product_codes: [BOADP9]
status: on_sale
annual_fees:
  - {scope: domestic, amount: 16000}
  - {scope: global, brand: mastercard, amount: 19000}
sources:
  - {id: page, kind: product_page, url: 'https://www.shinhancard.com/pconts/html/card/apply/credit/1231466_2207.html', fetched_at: '2026-10-12'}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2026-10-12'
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 600000, 1000000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      cancellation: original_month
      cancellation_overrides:
        - use: cancel_month
          when: {region: overseas}
      month_offset: {}
    new_card: {tier: 0}
    benefit_exclusions:
      when_any:
        - payment: [kakao_pay, naver_pay, payco, smile_pay, toss_pay]
        - {interest_free: true}
      categories: [annual_fee, apartment_fee, education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, utility]
      unmodeled: [포인트 사용금액, 이 카드 할인서비스를 받은 거래는 다른 할인 제외]
    limits:
      - key: ali
        per: month
        amount: {300000: 10000, 600000: 20000, 1000000: 30000}
      - key: dining
        per: month
        amount: {300000: 5000, 600000: 10000, 1000000: 20000}
      - {key: dining-day, per: day, amount: 1000}
    stacks:
      - {key: main}
      - {key: overseas}
    benefits:
      - key: ali-domestic-10
        title: 알리익스프레스 국내 배송 10% 할인
        source: page
        evidence: [알리익스프레스 국내 / 해외 배송상품 10% 결제일 할인, '국내 배송 상품 : 알리익스프레스 K-venue 등 한국에서 발송되는 상품의 원화 기준 상품', 30만원 이상 60만원 미만 | 1만원, 60만원 이상 100만원 미만 | 2만원, 100만원 이상 | 3만원]
        target:
          merchants: [aliexpress]
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: ali}
        tiers: {from: 300000}
      - key: ali-overseas-10
        title: 알리익스프레스 해외 배송 10% 할인
        source: page
        evidence: [알리익스프레스 국내 / 해외 배송상품 10% 결제일 할인, 해외 배송 상품의 10%할인은 해당 카드로 단일 거래에서 최종 원화 청구 금액 2만원 이상 발생 시에 적용됩니다., 해외 일시불 결제 후 할부로 전환하는 경우는 할인 받을 수 없습니다.]
        target:
          merchants: [aliexpress]
        when:
          - {region: overseas}
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: ali}
        tiers: {from: 300000}
      - key: dining-10
        title: 음식점·카페 10% 할인
        source: page
        evidence: ['음식점 영역: 한식, 중식, 양식, 일식, 일반대중음식, 패스트푸드, 뷔페 업종', '카페 영역: 스타벅스, 엔제리너스, 폴바셋, 투썸플레이스, 매머드커피, 메가MGC커피, 빽다방, 커피 전문점 업종', 할인액 기준 1일 1천원까지 잔여 통합 할인 한도 내에서 할인 받을 수 있습니다., 오프라인 매장에서 이용한 경우에만 할인 받을 수 있습니다.]
        target:
          categories: [cafe, restaurant.fastfood, restaurant.general]
        when:
          - {region: domestic}
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: dining-day}
          - {shared: dining}
        tiers: {from: 300000}
        unmodeled: [호텔·백화점·할인점·면세점·공항·기차역 입점 매장은 업종에 따라 제외]
      - key: smart-order-10
        title: 스타벅스·투썸 스마트오더 10% 할인
        source: page
        evidence: ['스타벅스, 투썸플레이스 스마트오더는 온라인 이용이지만 카페 할인 서비스를 받을 수 있습니다.', 할인액 기준 1일 1천원까지 잔여 통합 할인 한도 내에서 할인 받을 수 있습니다.]
        target:
          merchants: [starbucks, twosome]
        when:
          - {region: domestic}
          - {channel: online}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: dining-day}
          - {shared: dining}
        tiers: {from: 300000}
        unmodeled: [온라인 결제 중 스마트오더만 할인한다]
      - key: delivery-10
        title: 배달의민족·땡겨요 10% 할인
        source: page
        evidence: ['배달앱 영역: 배달의민족, 땡겨요', '배달의 민족은 공식 배달앱에서 ‘앱 내 카드결제’ 시 할인되며, ‘만나서/현장 카드 결제, 페이 결제’ 등 다른 결제 방식은 할인 받을 수 없습니다.', 할인액 기준 1일 1천원까지 잔여 통합 할인 한도 내에서 할인 받을 수 있습니다.]
        target:
          merchants: [baemin, ddangyo]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: dining-day}
          - {shared: dining}
        tiers: {from: 300000}
      - key: overseas-point-1
        title: 해외 1% 적립
        source: page
        evidence: [해외 이용 시 1% 마이신한포인트 적립, 알리익스프레스 10% 할인 서비스도 같이 받을 수 있습니다., 해외 일시불 결제 후 할부로 전환하는 경우는 포인트가 적립되지 않습니다.]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: points, program: mysinhan_point, rate: 1}
        stack: overseas
        unmodeled: [해외겸용 Mastercard 카드만 적립. 해외 사이트에서 국내 간편결제나 PG로 결제하면 제외]
    unmodeled: [교통카드 이용금액은 실물 전전월, 모바일 후불교통 전월 실적에 반영되지만 계산은 실적에서 뺀다, 최초 신규 발급 회원은 다음 달까지 30만 구간이지만 재발급 회원 제외라 계산하지 않는다]
notes: 상품 페이지 기준. 해외 1% 적립은 전월 실적 조건 문구가 없어 모든 구간에 준다. 국내 취소는 최초 승인 달, 해외 취소는 매입 달에서 뺀다.
