notes: 카드 출시 2025-04-22. 연회비 국내전용·국내외겸용(VISA) 20,000원. 하나머니 적립은 지난달 실적과 관계없다. 적립 대상이 겹치면 적립률이 높은 서비스 하나만 준다. 해외·항공·여행 통합 한도 월 5만 하나머니를 넘으면 0.7%를 준다. 적립 제외 대상 목록에 도시가스와 아파트관리비가 없어 적립 제외에서 뺐다. 하나머니 소수점 이하 반올림. 2026-10-10 상품 페이지 원문으로 작성.
