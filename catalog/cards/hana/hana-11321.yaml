        limits:
          - {shared: lunch}
        tiers: {from: 300000}
        unmodeled: [백화점·할인점·아울렛·쇼핑몰·공항·호텔·리조트·역사 입점 점포는 제외된다]
    unmodeled: [실적 제외의 아이행복 정부지원금은 업종으로 가릴 수 없어 실적에 넣는다, 교통요금 등 무승인 매입은 매출전표가 접수된 달의 이용금액에 들어간다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙이 시작된 날을 찾지 못했다. 상품 페이지 준법심의일을 잠정 시작일로 둔다., assumed: '2021-09-29'}
  - {path: 'revisions[0].spend.exclude_categories', question: '원문 실적 제외는 공과금, 도시가스, 아파트 관리비 자동이체다. 전기와 수도가 공과금에 드는지 단정할 수 없어 utility 전체와 아파트관리비 전체를 뺐다.', assumed: utility와 apartment_fee 전체}
  - {path: 'revisions[0].benefits[lunch-cashback].when', question: '"오전 11시~오후 2시 사이"에서 14:00 정각 결제가 포함되는지 원문이 불명확하다.', assumed: '11:00 이상 14:00 미만'}
  - {path: 'revisions[0].benefits[lunch-cashback].when', question: 원문은 평일이 임시공휴일이면 제외한다고만 적었다. 평일에 걸린 일반 공휴일도 제외로 계산한다., assumed: holidays exclude}
notes: 2026-10-10 공식 상품 페이지(상세 번호 CD_PD_SEQ=9047, 목록 상품 번호 11321, 준법심의 L-21-2166)에서 옮겼다. 연회비 면제, 발급수수료 2,000원은 다음 달 말일까지 1만원 이상 쓰면 돌려준다. 해외 ATM 인출 건당 US$3 면제는 결제가 아니라 계산하지 않는다. 캐쉬백 적용 금액은 실적에서 빠진다.
