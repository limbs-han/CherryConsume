    unmodeled: ['바우처는 본인에게 연 1회 택1 제공한다. 첫해 50만원 이용, 이후 직전 1년 600만원 이용이 필요하다. 호텔다이닝 10만원 할인, 신세계상품권 10만원, SK주유권 5만원 2매, 배달의민족 상품권 10만원, 하나머니 9만원 중 고른다.', '라운지는 본인 가족 동반자 통합 일 3회 연 3회. 첫해 전월 50만원, 이후 직전 1년 600만원 이용이 필요하다. 서비스 연도는 발급월부터 12개월이다.', 프리미엄 바우처와 라운지의 발급연도 실적 및 신청과 사용 이력에 따른 혜택은 자동 계산하지 않는다. 일반 거래의 하나머니 적립만 계산한다.]
