    unmodeled: ['생활 적립은 통신, 렌탈, 교통, 케이블TV, 전기 다섯 영역 이용액을 합쳐 10만원마다 주지만, 여기서는 자동이체 영역과 교통 영역을 따로 합쳐 덜 줄 수 있다', 공항철도는 생활 적립 대상이지만 업종으로 가리지 못해 넣지 않았다, '전기요금은 아파트, 빌라, 상가 등 일괄 납부 단체요금이 빠진다', 마트와 백화점 적립은 임대매장 매출이 빠진다, 커피 할인은 상품권 구매와 백화점·마트 입점 점포에서 빠진다, 아이행복 정부지원금은 실적에서 빠진다, '본인카드, 모바일카드, 가족카드의 실적, 적립한도, 할인횟수를 합산한다', 무승인 매출은 매출이 접수된 달의 실적에 들어간다]
