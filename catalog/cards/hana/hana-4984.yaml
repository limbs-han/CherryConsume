notes: 2026-10-10 공식 상품 페이지에서 옮겼다. 연회비 국내전용 28,000원, 국내외겸용 30,000원. 하나머니 1하나머니 = 1원. 영역별 이번 달 합산 이용금액이 10만원이 될 때마다 5천 하나머니라 달 합계 보상으로 넣었다. 마트, 백화점, 온라인쇼핑, 주유는 영역마다 30만 구간 1만, 60만 구간 2만 하나머니 한도다. 주유와 학원 업종 이용액은 적립을 받지 않아도 실적에서 빠진다. 초안의 생활 적립은 통신 업종 전체를 넣어 원문보다 넓었고, 해외와 렌탈, 케이블TV를 빠뜨렸다.
