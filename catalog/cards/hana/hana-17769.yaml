notes: 2026-10-11 공식 상품 페이지(준법심의 L-24-0078)에서 옮겼다. 연회비 VISA 본인 300,000원, 국내전용 본인 295,000원, 가족 VISA 30,000원, 국내전용 가족 25,000원. 기본적립은 실적 조건 없이 1%, 지난달 200만원 이상이면 1.5%(월 10만 하나머니). 특별적립, 주유, 택시, 디지털은 지난달 50만원 이상. 최초 사용 등록 후 다음 달 말일까지는 50만원 미만도 50만원으로 본다. 하나머니 소수점 이하 반올림.
