notes: 하나은행 밀리언달러 통장을 외화계좌로 연결하는 카드. 카드 출시 2021-11-29. 연회비 국내전용·국내외겸용(VISA) 15,000원. 해외 적립은 실적과 관계없고 국내 4개 영역은 지난달 실적 50만원 이상. 국내 적립 받은 매출과 무이자할부 매출은 실적에서 빠진다. 최초 사용등록일부터 다음달 말일까지는 실적과 관계없이 제공. 사이렌오더는 결제 방식 앱 선결제로 가린다. 해외 수수료 면제는 계산하지 않는다. 하나머니 소수점 이하 반올림. 2026-10-10 상품 페이지 원문으로 작성.
