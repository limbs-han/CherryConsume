  - {scope: global, brand: amex, amount: 19900}
  - {scope: global, brand: mastercard, amount: 19900}
  - {scope: global, brand: visa, amount: 19900}
sources:
  - {id: page, kind: product_page, url: 'https://www.hanacard.co.kr/OPI41000000D.web?CD_PD_SEQ=16947', fetched_at: 2026-10-10, review_no: 제2026-C1h-10500호, review_valid_until: 2027-07-05}
  - {id: notice-14253, kind: notice, url: 'https://www.hanacard.co.kr/OPP35150001D.web?schID=ncd&mID=OPP35150000D&AN_NO=14253', fetched_at: 2026-10-10}
checked_at: 2026-10-10
revisions:
  - effective_from: 2025-07-01
    source: notice-14253
    tiers: [0, 400000, 800000, 1200000]
    spend:
      exclude_categories: [education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility.water]
      exclude_applied: 1
    new_card: {until: next_month_end, tier: 400000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [education.kindergarten, education.primary_secondary_fee, education.school_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility.water]
    options:
      - key: combo
        title: 원더카드 맞춤 혜택 조합
        choices:
          - {key: free_plus, title: FREE+ 조합 그대로}
          - {key: custom, title: 하나Pay에서 바꾼 조합}
        default: free_plus
        change: immediate
        unsupported: [custom]
    limits:
      - {key: coupang_super, per: month, amount: 50000}
      - key: taxi
        per: month
        amount: {400000: 4000, 800000: 8000, 1200000: 12000}
    benefits:
      - key: general-0-8
        title: 국내외 가맹점 0.8% 할인
        source: page
        evidence: ['할인 대상 : 국내·외 결제 시', 0.8% | 없음 | 없음]
        target: {all: true}
        when:
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 0.8}
        exclude_applied: 0
      - key: simple-pay-1-2
        title: 하나페이·간편결제 온라인 1.2% 할인
        source: page
        evidence: ['할인대상 : 하나페이 모든결제 / 삼성페이, 네이버페이, 카카오페이, SSG페이, 페이코, 쿠페이, 11 pay에 카드를 등록하여 온라인 가맹점에서 결제하는 건', 1.2% | 없음 | 없음, '하나페이를 제외한 다른 간편결제 시 모바일 단말을 이용한 삼성페이 오프라인 결제, 네이버페이 오프라인 결제 등 오프라인 가맹점에서의 결제는 서비스에서 제외됩니다.']
        target: {all: true}
        when:
          - any_of:
              - payment: [hana_pay]
              - channel: online
                payment: [coupay, eleven_pay, kakao_pay, naver_pay, payco, samsung_pay, ssg_pay]
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 1.2}
        exclude_applied: 0
      - key: coupang-2
        title: 쿠팡 2% 할인
        source: page
        evidence: [쿠팡 | 2% | 없음 | 통합 5만원, '공식 홈페이지(온라인/모바일 앱)를 통한 결제 건에 한하여 서비스가 제공되며, 상품 선택 시 연결된 다른 사이트 및 앱 에서 결제한 경우와 오프라인 결제 건은 서비스에서 제외됩니다.']
        target:
          merchants: [coupang]
        when:
          - {channel: online}
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 2}
        limits:
          - {shared: coupang_super}
        unmodeled: ['상품권, 여행, 항공권, 티켓, 도서, 공연 매출은 제외된다']
      - key: supermarket-2
        title: 슈퍼마켓 2% 할인
        source: page
        evidence: [슈퍼마켓 | 2% | 없음 | 통합 5만원, '할인 대상 : GS THE FRESH, 롯데슈퍼, 이마트에브리데이, 홈플러스익스프레스, 노브랜드', 오프라인 결제건에 한하여 서비스가 제공됩니다.]
        target:
          merchants: [emart_everyday, gs_the_fresh, homeplus_express, lotte_super]
        when:
          - {channel: offline}
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 2}
        limits:
          - {shared: coupang_super}
        notes: 노브랜드는 가맹점 키가 없어 계산하지 않는다
      - key: delivery-4
        title: 배달앱 4% 할인
        source: page
        evidence: ['할인 대상 : 배달의민족, 요기요, 쿠팡이츠', '4% | 지난달 실적 40만원 이상 80만원 미만 | 4,000', '지난달 실적 80만원 이상 120만원 미만 | 6,000', '지난달 실적 120만원 이상 | 10,000', '공식 홈페이지(온라인/모바일 앱)를 통한 결제 건에 한하여 서비스가 제공되며, 음식점 직접 결제 건은 서비스에서 제외됩니다.']
        target:
          merchants: [baemin, coupang_eats, yogiyo]
        when:
          - {channel: online}
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 4}
        limits:
          - per: month
            amount: {400000: 4000, 800000: 6000, 1200000: 10000}
        tiers: {from: 400000}
      - key: online-food-4
        title: 온라인식품·쇼핑 4% 할인
        source: page
        evidence: ['할인 대상 : 컬리, SSG.COM, 롯데ON, 더현대닷컴', '4% | 지난달 실적 40만원 이상 80만원 미만 | 4,000', '지난달 실적 80만원 이상 120만원 미만 | 8,000', '지난달 실적 120만원 이상 | 12,000', 공식 홈페이지(온라인/모바일 앱)를 통한 결제 건에 한하여 서비스가 제공되며]
        target:
          merchants: [kurly, lotte_on, ssg_com, the_hyundai_com]
        when:
          - {channel: online}
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 4}
        limits:
          - per: month
            amount: {400000: 4000, 800000: 8000, 1200000: 12000}
        tiers: {from: 400000}
        unmodeled: ['상품권, 여행, 항공권, 티켓, 도서, 공연 매출은 제외된다', '상품 선택 때 연결된 다른 사이트와 앱에서 결제한 건, 롯데ON과 더현대닷컴에서 몰 이동으로 다른 계열사 몰에서 결제한 건은 제외된다']
      - key: open-market-4
        title: 오픈마켓 4% 할인
        source: page
        evidence: ['할인 대상 : G마켓, 옥션, 11번가, 티몬', '4% | 지난달 실적 40만원 이상 80만원 미만 | 4,000', '지난달 실적 80만원 이상 120만원 미만 | 8,000', '지난달 실적 120만원 이상 | 12,000', 공식 홈페이지(온라인/모바일 앱)를 통한 결제 건에 한하여 서비스가 제공되며]
        target:
          merchants: [auction, eleven_st, gmarket, tmon]
        when:
          - {channel: online}
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 4}
        limits:
          - per: month
            amount: {400000: 4000, 800000: 8000, 1200000: 12000}
        tiers: {from: 400000}
        unmodeled: ['상품권, 여행, 항공권, 티켓, 도서, 공연 매출은 제외된다', 상품 선택 때 연결된 다른 사이트와 앱에서 결제한 건은 제외된다]
      - key: taxi-4
        title: 택시 4% 할인
        source: page
        evidence: ['할인 대상 : 카카오T, UT, 택시업종', '4% | 지난달 실적 40만원 이상 80만원 미만 | 4,000', '지난달 실적 80만원 이상 120만원 미만 | 8,000', '지난달 실적 120만원 이상 | 12,000', 택시 업종은 오프라인 결제 건에 한하여 서비스가 제공됩니다.]
        target:
          categories: [taxi]
          exclude_merchants: [kakao_t, ut]
        when:
          - {channel: offline}
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 4}
        limits:
          - {shared: taxi}
        tiers: {from: 400000}
      - key: taxi-app-4
        title: 카카오T·UT 앱 선결제 4% 할인
        source: page
        evidence: ['카카오T, UT는 공식 앱에서 카드를 등록하고 미리 결제하는 방식에만 서비스가 제공되며 현장결제 또는 나중에 결제하는 방식에는 서비스가 제외됩니다.']
        target:
          merchants: [kakao_t, ut]
        when:
          - billing: [app_prepay]
          - option:
              combo: [free_plus]
        reward: {type: billing_discount, rate: 4}
        limits:
          - {shared: taxi}
        tiers: {from: 400000}
    unmodeled: ['가족카드 이용금액과 월별 할인횟수, 할인한도는 본인카드와 합산된다', 트래블로그 스위치로 해외결제를 외화 하나머니로 설정해 해외 이용하면 원더 서비스가 없다]
open_questions:
  - {path: 'revisions[0].spend', question: 취소가 실적에서 빠지는 달. 원문에는 혜택을 매입 취소가 접수된 달에 차감한다는 문구만 있다, assumed: cancel_month}
  - {path: 'revisions[0].benefits', question: 원문은 결제 한 건에 영역 혜택이 여럿 겹칠 때의 처리를 적지 않았다. 실적 문구가 한 건에 한 서비스를 전제해 한 건에 가장 큰 혜택 하나만 준다, assumed: 기본 묶음에서 가장 큰 혜택 하나}
notes: 원더카드 2.0의 FREE+ 맞춤 혜택 조합. 같은 상품의 DAILY 조합 hana-wonder2-daily와 같은 틀이다. 연회비는 19,900원(기본 12,000원, 제휴 7,900원). 실적은 지난달 1일~말일 승인 기준 국내외 일시불·할부. 실적 제외는 DAILY와 같고 할인 받은 매출도 빠지지만, 전가맹점 1.0% 이하와 간편결제 1.2% 이하로 할인 받은 매출은 실적에 들어가 general-0-8과 simple-pay-1-2만 exclude_applied 0이다. 전가맹점, 간편결제, 쿠팡, 슈퍼마켓은 실적 조건이 없고 나머지는 40만원 이상. 최초 사용등록일~다음 달 말일은 40만~80만원 구간. 2026-10-10 상품 페이지 원문으로 작성.
