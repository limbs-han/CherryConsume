notes: '하나머니 잔액으로 결제하는 하나머니 전용 체크카드. 국내는 원화 하나머니, 해외는 외화 하나머니 잔액에서 출금. 연회비 없음. 모든 혜택이 지난달 실적과 무관해 spend.basis를 none으로 둔다. 적립 제외: 국세, 지방세, 공과금, 4대보험료, 상품권·기프트카드, 선불카드·선불전자지급수단 충전, 수도·전기요금, 아파트관리비, 부동산임대료, 스쿨뱅킹, 도시가스요금, 대학·대학원 등록금, 초·중·고 납입금, 국내외 ATM 이용금액. 결제 건 혜택 아님: 외화 하나머니 무료 환전, 해외 ATM 인출 수수료 면제(해외인출수수료 건당 US$3, 국제브랜드수수료 1%). 해외원화결제(DCC) 불가. 국내 ATM 현금인출 불가. 신용·체크카드로 충전한 하나머니는 결제에 못 씀. 첫 개정 시행일 근거: page. 카드 출시 시기 2022-07-18. 하나카드 서비스변경안내 193건 전부와 주요공지 2021-03 이후 500건을 봤다. 이 카드의 부가서비스 변경 공지는 없고 2023-08-10 외화 하나머니 추가 출금·환급 통화 변경만 있다.'
