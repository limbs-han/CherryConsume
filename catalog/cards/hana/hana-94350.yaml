open_questions:
  - {path: 'revisions[0].effective_from', question: 지금 규칙이 시작된 날을 찾지 못해 수집한 날로 두었다. 카드 출시는 2026-02-13이다., assumed: '2026-10-10'}
  - {path: 'revisions[0].benefits', question: 보도로는 일본 특화 시즌1 캐시백(2026-04-15~2027-04-14)이 있으나 공식 상품 페이지에서 확인하지 못해 넣지 않았다.}
notes: 2026-10-10 공식 상품 페이지(준법심의 A-26-0674)에서 옮겼다. 초안의 상품 번호 94350은 카드 목록 번호이고 상세 페이지 번호는 18956이다. 연회비 국내전용과 Mastercard 20,000원(기본 20,000원, 제휴 0원). 실적 조건이 없다. 해외 결제는 신용 결제로 설정했을 때만 적립하고, 발급 때 기본은 외화 하나머니 결제다. 적립 대상이 겹치면 높은 적립률 하나만 주고, 통합 5만 하나머니를 넘으면 하나Pay 1.3% 또는 1%를 준다.
