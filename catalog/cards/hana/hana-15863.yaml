open_questions:
  - {path: 'revisions[0].spend', question: 취소가 실적에서 빠지는 달. 원문에는 혜택을 매입 취소가 접수된 달에 차감한다는 문구만 있다, assumed: cancel_month}
  - {path: 'revisions[0].benefits[living-hospital-10].target', question: 원문 대상의 요양·보육·복지시설을 어느 업종으로 연결할지 정하지 않았다, assumed: '병원, 약국만'}
notes: '원더카드 2.0의 LIVING 맞춤 혜택 조합. 같은 상품의 DAILY 조합 hana-wonder2-daily와 같은 틀이다. 발급 후 하나Pay에서 조합을 월 1회 바꿀 수 있고 바꾸면 즉시 적용된다(notice-14253). 연회비는 19,900원(기본 12,000원, 제휴 7,900원). 제휴연회비는 혜택플러스 선택 시 부과되며 DAILY와 같게 19,900원으로 둔다. 실적은 지난달 1일~말일 승인 기준 국내외 일시불·할부. 실적 제외: 국세, 지방세, 공과금, 4대보험, 상품권·기프트카드, 선불 충전, 수도요금, 대학·대학원 등록금, 스쿨뱅킹, 부동산임대료, 초중고 납입금, 할인 받은 매출. 최초 사용등록일~다음 달 말일은 40만~80만원 구간. 무이자·부분무이자할부는 할인 제외. 2026-10-10 상품 페이지 원문으로 작성.'
