notes: '2026-10-10 공식 상품 페이지(준법심의 L-26-0397)에서 옮겼다. 연회비 면제. BC 계열 상품이라 가맹점 업종은 BC 기준이다. 실적 제외: 국세, 지방세, 공과금, 4대보험, 상품권·기프트카드, 선불 충전, 도시가스·수도·전기, 아파트관리비, 대학등록금, 초중고 납입금, 무이자할부, 어린이집·유치원 이용금액과 바우처 이용금액, 할인 받은 매출 전체. 신규 발급 특례는 원문에 없다.'
