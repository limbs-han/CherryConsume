  - {path: 'revisions[0].benefits[5].limits', question: 표에서 스트리밍과 멤버십이 월 한도 1만 하나머니 칸을 함께 쓰는지 따로 쓰는지 원문 글로는 구분되지 않는다, assumed: 둘이 함께 1만}
notes: MOVING카드의 PLAY 모드. GLOBAL 모드 hana-19153처럼 3일 연속 2배는 빼고 기본 적립률만 담는다. 카드 출시 2026-07-01. 연회비 국내전용·국내외겸용(Mastercard) 20,000원. 모든 적립은 지난달 실적 50만원 이상. 최초 사용등록일부터 다음달 말일까지 50만원 이상 기준. PLAY 모드로 적립 받은 매출 전체는 실적에서 빠진다. 적립 영역이 겹치면 큰 서비스 하나만 준다. 하나머니 소수점 이하 반올림. 2026-10-10 상품 페이지 원문으로 작성.
