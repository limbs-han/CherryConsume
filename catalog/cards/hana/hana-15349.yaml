schema_version: 2
id: hana-15349
issuer: hana
name: 대명아임레디 플러스 하나카드
kind: credit
product_codes:
  - '15349'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
  - {scope: global, brand: visa, amount: 20000}
sources:
  - {id: page, kind: product_page, url: 'https://www.hanacard.co.kr/OPI41000000D.web?CD_PD_SEQ=15349', fetched_at: &id001 2026-10-04}
checked_at: 2026-10-10
revisions:
  - effective_from: *id001
    effective_from_estimated: true
    source: page
    tiers: [0, 300000, 1000000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      interest_free: count
      installment: full_at_purchase
      cancellation: cancel_month
    new_card: {until: next_month_end, tier: 300000, from: registration}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
    benefits:
      - key: daemyung-auto-discount
        title: 대명아임레디 자동납부 할인
        source: page
        target:
          merchants: [daemyung_imready]
        when:
          - billing: [autopay]
          - card_month: {min: 2}
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {300000: 12000, 1000000: 19000}
        tiers: {from: 300000}
      - key: first-registration-daemyung-12k
        title: 최초 사용등록월과 다음달 자동납부 월 12,000원 할인
        source: page
        target:
          merchants: [daemyung_imready]
        when:
          - billing: [autopay]
          - card_month: {min: 0, max: 1}
        reward: {type: billing_discount, rate: 100}
        limits:
          - {per: month, amount: 12000}
    unmodeled: [무승인 매출은 매출 접수 월에 실적 반영한다]
notes: 2026-10-09 공식 수집 원문 대조. 시행일을 소급하지 않고 수집일 이후 규칙으로 제안한다. 최초 사용등록월과 다음달은 원문에 안내된 최저 구간으로 모델링한다. 높은 실적에 추가 제공한다는 원문 근거가 없으므로 신규 기간에는 상위 구간을 지급하지 않는다. 기존 최저 구간 보장 해석은 철회한다.
