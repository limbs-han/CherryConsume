notes: '2026-10-10 공식 상품 페이지(준법심의 A-26-0400)에서 옮겼다. 연회비 국내전용·VISA 15,000원. 전월 실적과 횟수 조건 없음. 하나페이 1.8% 한도를 넘긴 금액은 0.8%로 받는다. 서비스 제외 매출: 국세, 지방세, 공과금, 4대보험, 상품권·기프트카드, 선불 충전, 도시가스·수도·전기, 아파트관리비, 부동산임대료, 스쿨뱅킹, 대학·대학원 등록금, 초중고 납입금, 무이자할부. 하나머니 소수점 이하 절사.'
