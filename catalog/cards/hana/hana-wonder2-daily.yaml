  - {path: 'revisions[0].benefits[transit-10].reward.rate', question: '대중교통 할인율이 상세표는 10%, 같은 페이지 주요혜택 요약은 3% 청구할인이라 서로 다르다', assumed: 10}
notes: '원더카드 2.0의 DAILY 맞춤 혜택 조합. 발급 후 하나Pay에서 서비스 영역을 월 1회 바꿀 수 있고 바꾸면 즉시 적용된다(notice-14253). 바꾼 조합은 options의 custom으로 두고 계산하지 않는다. 연회비는 국내전용·국내외겸용 19,900원(기본 12,000원, 제휴 7,900원). 제휴연회비는 혜택플러스 선택 시 부과되는데 DAILY 조합은 제휴연회비 7,900원으로 적혀 있어 19,900원으로 둔다. 실적은 지난달 1일~말일 승인 기준 국내외 일시불·할부 금액, 40만원 미만이면 혜택 없음. 최초 카드 사용등록일~다음 달 말일은 40만~80만원 구간 기준. 실적 제외: 국세, 지방세, 공과금, 4대보험, 상품권·기프트카드, 선불카드·선불전자지급수단 충전, 수도요금, 대학·대학원 등록금, 스쿨뱅킹, 부동산임대료, 초·중·고 납입금, 할인·적립 받은 매출. 할인 제외: 같은 항목과 무이자·부분무이자할부 전체. 무승인거래는 매입 확정 다음날 혜택. 해외 이용은 수수료 포함 최종 원화 청구액에 혜택 적용. 결제 건 혜택 아님: 온가족 플러스(가족카드당 월 1만원 캐시백, 차년도 연회비 1만원 캐시백), 트래블로그 스위치(외화 하나머니 결제 시 해외 수수료 면제). 첫 개정 시행일 근거: notice-14253. 카드 출시 시기는 2022-11-15이고 2025-07-01 원더카드 2.0으로 바뀌며 트래블로그 스위치 규칙이 처음 생겼다(notice-14253 변경일자 2025. 7. 1). notice-14490은 2026-08-01 위메프·인터파크 제공처 변경으로 오픈마켓 영역만 바꾼다. DAILY 영역과 관계없는 변경이다. 실적 산정 기준과 트래블로그 스위치 결제 실적 제외는 상품안내장(leaflet) 23쪽.'
