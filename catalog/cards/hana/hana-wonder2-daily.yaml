notes: '원더카드 2.0의 DAILY 맞춤 혜택 조합. 발급 후 하나Pay에서 영역을 바꿀 수 있어 실제 혜택은 회원마다 다를 수 있음. 실적은 지난달 1일~말일 승인 기준 국내외 일시불·할부 금액. 영역마다 한도가 따로 있고 통합 한도 문구는 없음. 지난달 40만원 미만이면 혜택 없음. 최초 사용등록일~다음 달 말일은 40만~80만원 구간 기준으로 제공. 실적 제외 중 업종 코드에 없는 것: 국민연금·고용보험·산재보험·건강보험, 선불카드·선불전자지급수단(하나머니 등) 충전, 수도요금(utility로 처리), 대학·대학원 등록금, 스쿨뱅킹, 부동산임대료, 초·중·고 납입금. 할인·적립 받은 매출은 실적에서 빠짐. 할인 제외: 위 실적 제외 항목과 무이자·부분무이자할부 전체. 공식 문구 미확인: 취소가 실적에서 빠지는 달. 혜택은 매입 취소가 접수된 달에 차감한다는 문구만 있음. 공식 문구 미확인: 연회비. 상단은 19,900원(기본 12,000원+제휴 7,900원)이나 제휴연회비는 혜택플러스 선택 시 부과라고 함. DAILY만 쓰면 12,000원일 수 있음. 결제 건 혜택 아님: 온가족 플러스(가족카드당 월 1만원 캐시백, 차년도 연회비 1만원 캐시백), 트래블로그 스위치(외화 하나머니 결제 시 해외 수수료 면제, 이때 원더 서비스 없음). 해외 이용은 수수료 포함 최종 원화 청구액에 혜택 적용. 가족카드 실적·한도 합산.'
