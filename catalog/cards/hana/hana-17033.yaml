open_questions:
  - {path: 'revisions[0].effective_from', question: 지금 규칙이 시작된 날을 찾지 못해 수집한 날로 두었다. 카드 출시는 2023-07-04다., assumed: '2026-10-10'}
notes: 2026-10-10 공식 상품 페이지(준법심의 A-26-0404)에서 옮겼다. 연회비 없음. 실적 제외에 후불교통이 없어 교통 이용액은 실적에 넣는다. 다이소는 오프라인만 대상이라 올리브영과 혜택을 나누고 월 1만원 한도를 함께 쓰게 했다.
