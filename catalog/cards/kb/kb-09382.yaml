    benefits:
      - key: daesang-wellife-subscription
        title: 대상웰라이프 정기배송 결제 청구할인
        source: page
        evidence: [구분 | 전월 이용실적에 따른 월간 할인 금액 | 1구간(30만원 이상) | 2구간(70만원 이상) | 대상웰라이프 정기배송 | 7천원 | 1만1천원 |, 최초 카드 사용 등록일(KB Pay 등 간편결제 등록 포함)로부터 다음달 말일까지는 「대상웰라이프 KB국민카드」 전월 이용실적이 없는 경우에도 1구간(전월 이용실적 30만원 이상)에 해당하는 할인금액이 적용됩니다., 할인금액보다 정기배송 결제금액이 적을 경우 결제금액까지만 할인이 적용됩니다., 대상웰라이프 정기배송 결제 건이 여러 건인 경우 합산하여 월 할인금액 내에서 할인됩니다., '할인(적립) 서비스 제공 관련 카드별 실적 유예기간은 본인회원이 해당카드를 생애 최초 발급받은 경우에 적용되며, 가족카드 단독 발급 시 적용되지 않습니다.']
        target:
          merchants: [daesang_wellife]
        when:
          - billing: [subscription]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {0: 7000, 300000: 7000, 700000: 11000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        notes: 정기배송 결제금액 전액을 월 할인금액까지 할인한다. 0 구간 7,000원은 생애 최초 발급의 실적 유예기간에만 준다
    unmodeled: [월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 결제대행업체(PG)나 간편결제 전용 가맹점으로 승인된 결제는 할인에서 빠질 수 있다, 정부지원금(보육료·유치원보조비·바우처) 결제는 실적에서 빠진다, 자판기·터널이용료·항공기내·공항버스 같은 무승인 전표는 실적에서 빠지지만 담을 업종이 없다, 할인 한도는 전표 매입 순서대로 채운다, 정기배송이 아닌 대상웰라이프 일반 구매는 할인되지 않는다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2023-08-23 출시만 적었다. 출시 뒤 부가서비스 변경 공지를 확인하지 못해 출시일을 잠정 시작일로 둔다., assumed: '2023-08-23'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 실적 유예는 생애 최초 본인 발급만 facts로 확인한다.
