  - {scope: global, amount: 15000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=04287', fetched_at: '2026-10-11', review_no: 제2022-C1a-03308호}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 300000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility.electricity, utility.water]
      interest_free: exclude
      month_offset: {}
      exclude_applied: 1
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: ['PG 결제와 호텔·백화점·대형마트·철도역사 입점 가맹점, 상품권 구매는 할인에서 빠질 수 있다']
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 본인 명의로 발급받았나요? 가족카드만 발급받은 경우는 아니요를 고르세요.'}
    benefits:
      - key: wavve-7900
        title: Wavve 이용권 자동결제 월 7,900원 청구할인
        source: page
        evidence: [Wavve 이용권 (자동결제) | 7, 900원 | 7, 900원, Wavve 웹(www.wavve.com)을 통한 이용권 자동결제 시 할인, 구글 플레이스토어 및 앱스토어 등을 통한 인앱 결제는 할인 제외, 'PAYCO, 네이버페이, 카카오페이 등 간편 결제 이용 시 할인 제외', 할인금액보다 이용금액이 작을 경우 이용금액 까지만 할인]
        target:
          merchants: [wavve]
        when:
          - billing: [subscription]
          - payment: [physical_card]
        reward: {type: billing_discount, rate: 100}
        limits:
          - {per: month, amount: 7900}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: food-10
        title: 커피·편의점·배달앱 10% 청구할인
        source: page
        evidence: ['커피/편의점 업종, 배민, 쿠팡이츠, 요기요 | 10% | 3천원 (건당 1천원 한도)', 대상 가맹점의 멤버십 결제 건은 할인 제외, 건당 1만원 이용금액까지 할인 적용]
        target:
          categories: [cafe, convenience]
          merchants: [baemin, coupang_eats, yogiyo]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: txn, base: 10000}
          - {per: month, amount: 3000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [대상 가맹점의 멤버십 결제는 할인에서 빠진다]
      - key: membership-20
        title: 멤버십 정기구독 20% 청구할인
        source: page
        evidence: ['네이버플러스 멤버십, 쿠팡 로켓와우, 요기패스, 컬리패스, 카카오My구독 | 20% | 5천원', 구글 플레이스토어 및 앱스토어 등을 통한 인앱 결제는 할인 제외]
        target:
          merchants: [coupang_wow, kurly_members, naver_plus_membership]
        when:
          - billing_not: [in_app]
        reward: {type: billing_discount, rate: 20}
        limits:
          - {per: month, amount: 5000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [요기패스와 카카오My구독은 공통 가맹점이 없어 계산하지 않는다]
      - key: selfcare-5
        title: 미용실·화장품 5% 청구할인
        source: page
        evidence: ['미용실/화장품/문화센터 업종,스포츠 (종합스포츠센터/골프장/골프연습장/테니스장/수영장/요가/볼링장 업종) | 5% | 5천원', 온라인 결제(PG가맹점) 이용금액은 할인 제외]
        target:
          categories: [beauty.cosmetics, beauty.salon]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [문화센터 업종은 공통 업종이 없고 스포츠 7개 업종은 공통 업종 sports가 스포츠용품점 등까지 넓어 계산하지 않는다]
    unmodeled: [기본 포인트리 적립 여부는 원문에 없다, '정부지원금과 무승인전표(공항버스, 자판기, 터널이용료, 항공기내 이용)는 실적에서 빠진다', 월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 할인 한도는 전표 매입 순서대로 채운다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 연회비는 국내전용과 K-WORLD(UPI)·VISA 겸용 모두 1만5천원이다. 실적 유예기간은 모든 서비스에 적용된다.
