notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 전월 실적 조건이 없는 카드라 구간은 하나다. 모임 영역 0.4%는 그 외 가맹점 0.2%를 대신한다. 출시일 2023.06.28은 부가서비스 변경 안내 문장에서 옮겼다.
