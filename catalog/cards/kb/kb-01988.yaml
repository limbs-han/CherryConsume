open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다., assumed: '2026-10-12'}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 할인은 환급할인이고 후불 버스·지하철만 청구할인이다. 해외 이용금액은 실적에서 빠진다.
