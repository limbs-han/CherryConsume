revisions:
  - effective_from: '2021-10-27'
    source: page
    tiers: [0, 500000, 1000000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit, utility]
