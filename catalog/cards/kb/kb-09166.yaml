schema_version: 2
id: kb-09166
issuer: kb
name: KB국민 누리 체크카드
short_name: KB 누리 체크
kind: check
product_codes:
  - '09166'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=09166', fetched_at: '2026-10-12', review_no: 260522-01722-HPP}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2026-05-22'
    effective_from_estimated: true
    source: page
    tiers: [0, 300000]
    spend:
      basis: prev_calendar_month
      regions: [domestic]
      exclude_categories: [transit.bus_city, transit.subway]
      exclude_applied: 0
    benefit_exclusions:
      categories: [education.tuition, gift_card, prepaid_charge, tax.local]
      unmodeled: [PG 결제와 호텔·백화점·대형마트·철도역사 입점 가맹점은 할인에서 빠질 수 있다, 정부지원금 결제는 할인에서 빠진다]
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 본인 명의로 발급받았나요? 가족카드만 발급받은 경우는 아니요를 고르세요.'}
    stacks:
      - {key: main, pick: best}
      - {key: weekend, pick: best}
      - {key: area, pick: best}
    benefits:
      - key: base-0-2
        title: 국내 가맹점 0.2% 기본 환급할인
        source: page
        evidence: [모든 가맹점 0.2% 기본 환급할인, '누리체크카드(기본/추가 환급할인 서비스, 해외이용 할인 캐시백 서비스)는 전월 이용실적 30만원 이상 시 제공됩니다.', '(단, 기본 환급할인 및 해외할인 캐시백 서비스는 제외됩니다.)']
        target: {all: true}
        when:
          - {region: domestic}
        reward: {type: cashback, rate: 0.2}
        tiers: {from: 300000}
        stack: main
      - key: weekend-0-2
        title: 주말·공휴일 0.2% 추가 환급할인
        source: page
        evidence: [주말·공휴일 모든 가맹점에서 0.2% 추가 환급할인, '할인제외 : 대중교통(버스·지하철) / 이동통신요금 자동납부 / 해외이용금액', 단, 택시는 추가 할인 가능합니다.]
        target:
          exclude_categories: [telecom.mobile, transit.bus_city, transit.subway]
          all: true
        when:
          - {region: domestic}
          - day:
              in: [sat, sun]
              holidays: include
        reward: {type: cashback, rate: 0.2}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        stack: weekend
        notes: 이동통신요금은 자동납부만 빠지지만 덜 주는 쪽으로 이동통신 업종 전체를 뺀다
      - key: food-cafe-0-2
        title: 음식점·커피전문점 0.2% 추가 환급할인
        source: page
        evidence: [음식점, 커피전문점 업종 0.2% 추가 환급할인, '음식점 : 일반음식점, 한식, 중식, 일식, 양식, 뷔페, 패밀리레스토랑 업종', '커피 : 커피전문점 업종(스타벅스, 커피빈 등)']
        target:
          categories: [cafe, restaurant.general]
        when:
          - {region: domestic}
        reward: {type: cashback, rate: 0.2}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        stack: area
      - key: taxi-0-2
        title: 택시 0.2% 추가 환급할인
        source: page
        evidence: ['대중교통(버스·지하철), 택시 0.2% 추가 환급할인', '할인제외 : 시외버스, 고속버스, 공항버스']
        target:
          categories: [taxi]
        when:
          - {region: domestic}
        reward: {type: cashback, rate: 0.2}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        stack: area
      - key: telecom-0-2
        title: 이동통신요금 자동납부 0.2% 추가 환급할인
        source: page
        evidence: ['제공조건 : 이동통신요금(SKT, KT, LG U+) 자동납부 등록시 서비스 제공']
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward: {type: cashback, rate: 0.2}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        stack: area
      - key: overseas-1
        title: 해외 이용 1% 할인 캐시백
        source: page
        evidence: [해외이용 1% 할인캐시백, 할인금액은 다음 달 둘째 주에 결제계좌로 입금, 예시) 3월 실적 충족 시 4월의 해외매출을 합산하여 캐시백 금액을 산정 후 5월 결제계좌 입금]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: cashback, rate: 1}
        tiers: {from: 300000}
    unmodeled: [버스·지하철 0.2% 추가 할인은 실제 이용일이 아닌 이용내역서 기재일 기준이라 계산하지 않는다, 정부지원금과 자판기·터널통행료·기차와 고속버스 취소 반환 수수료 같은 무승인금액은 실적에서 빠진다, 해외 캐시백은 한 달 해외 이용금액을 모아 다음 달 둘째 주에 입금한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2014.12.24 출시와 2026.05.22 심의번호만 적었다. 심의일을 현재 규칙의 시작일로 잠정 적용한다., assumed: '2026-05-22'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 교통이용금액 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. KB ALL point kb-09162와 같은 구조의 체크카드다. 실적 유예기간에는 추가 할인만 주고 기본 할인과 해외 캐시백은 주지 않는다.
