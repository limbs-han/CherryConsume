open_questions:
  - {path: 'revisions[0].ranked', question: 영역 easy-all-a~d의 이용금액에서 취소를 어느 달에 빼는지 원문에 없다. 상품설명서와 상품 페이지의 취소 문구는 전월 이용실적 기준 아래에만 있다}
  - {path: 'revisions[0].benefit_exclusions.categories', question: 원문 할인 제외에는 지방세만 있다. 국세도 할인에서 빠지는지, assumed: 세금 전체 제외}
notes: '첫 개정 시행일 근거: launch. 출시 2020-06-18. 출시 상품설명서와 지금 상품설명서의 혜택이 같고, 새소식 게시판에 이 카드의 부가서비스 변경 공지가 없다. 2020-10-15 약관 문구 정비와 국제브랜드·티타늄 서비스 변경 공지는 계산하는 혜택과 관계없다. Easy all 선택서비스는 전월 50만원 이상, 최초 발급 때 Auto 모드. Auto 모드는 4개 그룹(A 3%, B 5%, C 7%, D 10%) 20개 영역 중 그룹별 이용금액 상위 1·2·3개 영역에 영역당 월 4천원까지 캐시백하고 다음 달 둘째 금요일에 결제계좌로 입금한다. DIY 모드는 영역과 한도 패턴을 직접 골라 통합한도를 나누는 청구할인이라 계산하지 않는다. 모드 변경은 신청 다음 달 1일부터. 실적 제외의 공과금은 원문이 전기·수도만 적어 도시가스는 실적에 넣었다. 할인 제외의 입점 가맹점, PG, 지방세, 대학 등록금, 연회비는 product 확인사항의 공통 제외에서 옮겼다. 한도는 이용 순서가 아니라 전표매입 순서대로 채운다. 2020년 상품설명서는 이용순서대로라고 적어 상품 페이지와 다르다. 월 한도는 이월하지 않는다. 티타늄 서비스(공항·호텔 발레파킹, 공항 라운지, 전월 30만원 이상)와 Visa 서비스는 결제 건 혜택이 아니다. KB Pay에서 신청한다.'
