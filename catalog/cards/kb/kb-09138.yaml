        title: '[카 라이프] 주차·세차 10% 청구할인'
        source: page
        evidence: ['카(Car) 라이프 서비스: 주차/세차 10% 청구할인, 월 1만원', 전월 이용실적 50만원 이상 조건, 주유소 내 세차장은 업종분류 기준에 따라 제외될 수 있음]
        target:
          categories: [car.car_wash, car.parking]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: car_life}
        tiers: {from: 500000}
        stack: special
        exclude_applied: 1
    unmodeled: [연 1회 쿠폰(포인트리 8만점·롯데백화점 상품권 8만원·CGV 씨네드쉐프 9만원 중 택1)과 공항 라운지·발레파킹·금융 수수료 면제는 계산하지 않는다, 최초 사용등록일부터 다음 달 말일까지 실적 없이 할인을 주는 신규 특례는 계산하지 않는다, 정부지원금과 무승인전표(자판기·터널 이용료·항공기내 이용)는 실적에서 빠진다, 할인 한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일로 둔다., assumed: '2026-10-12'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(RF후불교통요금) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].limits[car_life]', question: 원문 표가 주차 행에만 월 1만원을 적고 세차 행에는 한도를 적지 않았다. 덜 주는 쪽으로 주차와 세차가 월 1만원을 함께 쓴다고 두었다, assumed: shared}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 특별 서비스 1.2%는 기본 1%와 추가 0.2%를 다른 묶음에 두어 더한다. 특별·Flex·카 라이프는 서로 겹치지 않아 한 묶음이다. Flex와 카 라이프 할인을 받은 결제는 실적에서 빠진다.
