        reward: {type: billing_discount, fixed: 10000}
        limits:
          - {shared: flex}
        tiers: {from: 500000}
        stack: special
        exclude_applied: 1
      - key: flex-offline-10000
        title: '[Flex] 호텔·스포츠·미용실 건당 20만원 이상 1만원 청구할인'
        source: page
        evidence: [호텔 | 특급/일반/기타관광호텔 | 오프라인 결제 건만, 스포츠 | 종합스포츠센터/레포츠클럽/골프장/골프연습장/요가/테니스장/볼링장/스키장/수영장/스포츠용품점/레저용품점, 미용실 | 미용실]
        target:
          categories: [beauty.salon, sports, travel.hotel]
        when:
          - amount: {min: 200000}
          - {channel: offline}
        reward: {type: billing_discount, fixed: 10000}
        limits:
          - {shared: flex}
        tiers: {from: 500000}
        stack: special
        exclude_applied: 1
