        source: page
        evidence: ['백화점, 대형마트, 슈퍼마켓 | 오프라인 결제 건만', '음식: 한식/일식/중식/양식/기타음식점/뷔페/패밀리레스토랑/휴게음식점/패스트푸드 | 오프라인 결제 건만', '커피: 커피 오프라인 매장', 편의점은 오프라인 결제 건만]
        target:
          categories: [cafe, convenience, department_store, grocery_mart, restaurant.fastfood, restaurant.general]
        when:
