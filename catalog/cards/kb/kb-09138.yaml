        evidence: ['Flex 서비스: 건당 20만원 이상 결제 시 1만원 청구할인, 분기당 영역 통합 1회', '온라인항공: 대한항공/아시아나항공 공식 홈페이지·앱 직판항공권, 외화 결제 건 제외', '온라인면세: 롯데면세점/신라면세점/신세계면세점 공식 홈페이지·앱 결제 시만']
