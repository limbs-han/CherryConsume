        reward: {type: billing_discount, rate: 0.2}
        tiers: {from: 500000}
        stack: special
        unmodeled: [스타벅스 사이렌오더도 대상이지만 온라인 결제로 기록되면 계산하지 않는다]
      - key: special-other-0-2
        title: '[특별 생활·교육·건강] 택시·학원·학습지·병원 0.2% 추가 청구할인'
        source: page
        evidence: ['생활 | 편의점, 택시', '교육 | 학원: 문리계학원/외국어학원/예체능계학원/기술사무가정계학원/자동차학원/기타학원, 학습지, 독서실', '건강 | 병원: 종합병원/일반병원(치과/한방)/일반의원(치과/한의원), 건강검진센터']
        target:
          categories: [education.academy, education.study_material, hospital, taxi]
        reward: {type: billing_discount, rate: 0.2}
        tiers: {from: 500000}
        stack: special
        unmodeled: [독서실은 담을 업종이 없어 계산하지 않는다]
      - key: flex-online-10000
        title: '[Flex] 항공·온라인면세점 건당 20만원 이상 1만원 청구할인'
