        evidence: ['특별 서비스: 생활밀착 4개 영역 1.2% 청구할인 (기본 1% + 추가 0.2%)', '온라인몰: 네이버플러스 스토어/쿠팡/G마켓/11번가/SSG.COM | KB Pay 결제 시에만 할인', '상품권, 여행, 티켓, 도서, 배달, 멤버십 구독료, 외부 제휴몰, 별도 팝업 사이트 제외']
