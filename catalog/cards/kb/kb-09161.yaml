schema_version: 2
id: kb-09161
issuer: kb
name: KB국민 누리올림카드
short_name: KB 누리올림
kind: credit
product_codes:
  - '09161'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 32000}
  - {scope: global, amount: 37000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=09161', fetched_at: '2026-10-11'}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 500000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, education.tuition, gift_card, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      interest_free: count
      month_offset: {}
      exclude_applied: 0
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [education.tuition, gift_card, prepaid_charge, tax, utility]
      unmodeled: ['PG 결제와 호텔·백화점·대형마트·철도역사 입점 가맹점, 상품권 구매는 할인에서 빠질 수 있다', 부분 무이자할부 이용금액도 할인에서 빠진다]
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 본인 명의로 발급받았나요? 가족카드만 발급받은 경우는 아니요를 고르세요.'}
    stacks:
      - {key: main}
      - {key: weekend}
      - {key: extra}
    benefits:
      - key: base-1
        title: 국내 모든 가맹점 1% 청구할인
        source: page
        evidence: [모든 가맹점 1% 청구할인, '단, 해외이용금액은 해외이용 할인 캐시백 서비스 제공', 누리올림카드 서비스는 전월 이용실적 50만 이상 시 제공됩니다., 최초 카드 사용등록일부터 다음 달 말일까지 KB국민 누리올림카드 이용실적이 없는 경우에도 기본 청구할인 서비스 제공]
        target: {all: true}
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 1}
        tiers:
          from: 500000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: weekend-03
        title: 주말·공휴일 0.3% 추가 청구할인
        source: page
        evidence: [주말/공휴일 모든 가맹점 0.3% 추가 청구할인, '대중교통(버스,지하철), 이동통신요금 자동납부, 해외이용금액은 추가 할인 제외 (단, 택시는 추가 할인 가능)']
        target:
          exclude_categories: [telecom.mobile, transit.bus_city, transit.subway]
          all: true
        when:
          - region: domestic
            day:
              in: [sat, sun]
              holidays: include
        reward: {type: billing_discount, rate: 0.3}
        tiers: {from: 500000}
        stack: weekend
        unmodeled: [이동통신요금은 자동납부만 빠지지만 이동통신 업종 전체를 뺐다]
      - key: dining-03
        title: 음식점·커피전문점 0.3% 추가 청구할인
        source: page
        evidence: [음식점, 커피전문점 업종 0.3% 추가 청구할인, '음식 : 일반음식점, 한식, 중식, 일식, 양식, 뷔페, 패밀리레스토랑 업종', '커피 : 커피전문점 업종 (스타벅스, 커피빈 등)', 'KB국민 누리올림카드로 음식/커피, 대중교통/택시, 이동통신요금 추가 청구할인 받은 이용금액(해당 이용금액 전체)']
        target:
          categories: [cafe, restaurant.general]
        reward: {type: billing_discount, rate: 0.3}
        tiers: {from: 500000}
        stack: extra
        exclude_applied: 1
      - key: transit-03
        title: 버스·지하철·택시 0.3% 추가 청구할인
        source: page
        evidence: ['대중교통(버스, 지하철), 택시 0.3% 추가 청구할인', 시외버스, 고속버스 제외]
        target:
          categories: [taxi, transit.bus_city, transit.subway]
        reward: {type: billing_discount, rate: 0.3}
        tiers: {from: 500000}
        stack: extra
        exclude_applied: 1
      - key: telecom-03
        title: 이동통신요금 자동납부 0.3% 추가 청구할인
        source: page
        evidence: ['이동통신요금(SKT,KT, LG U+) 0.3% 추가 청구할인', KB국민 누리올림카드로 자동납부 등록 시 서비스 제공]
        target:
          exclude_categories: [telecom.internet_tv]
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 0.3}
        tiers: {from: 500000}
        stack: extra
        exclude_applied: 1
      - key: overseas-1
        title: 해외이용 1% 캐시백
        source: page
        evidence: ['해외이용금액의 1% 할인 캐시백 [월 이용금액 100만원까지]', 해외이용 할인 캐시백 서비스는 전월 이용실적 50만원 이상 시 제공됩니다.]
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: cashback, rate: 1}
        limits:
          - {per: month, base: 1000000}
        tiers: {from: 500000}
        unmodeled: [해외 이용금액은 일시불 매입 완료 기준으로 달을 나눈다]
    unmodeled: ['올림 리워드: 전년도 1~12월 결제납부실적 1,000만원 이상 3만점, 1,200만원 이상 4만점, 1,500만원 이상 5만점, 2,000만원 이상 7만점을 연 1회 적립한다. 연간 결제납부금액 기준이라 계산하지 않는다', 기본 포인트리는 적립되지 않는다, 무승인전표와 정부지원금은 실적에서 빠진다, 실적과 할인한도는 본인회원 기준이라 가족카드 이용분과 합산한다, 할인은 전표 매입 순서대로 적용한다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits', question: 원문에 월 할인한도가 적혀 있지 않아 한도 없이 두었다, assumed: 한도 없음}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 연회비는 국내전용 3만2천원, 국내외겸용 3만7천원이고 차기년도 면제 조건이 없다. 기본 1%에 주말·공휴일 0.3%와 업종 0.3%를 더해 받는다. 실적 유예는 기본 청구할인에만 있다.
