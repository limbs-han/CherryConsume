    unmodeled: [커피빈 카드 충전 건당 5천원 할인(건당 3만원 이상 일 1회 월 1만원)은 충전과 일반 구매를 결제 입력으로 가를 수 없어 담지 않았다. 커피빈 카드 충전금액은 실적에서 빠진다, 전년도 이용금액 700만원 이상이면 다음 해 1월 커피빈 1만원 쿠폰을 주는 혜택은 담지 않았다, 생애 최초 발급 본인회원은 사용등록 후 다음 달 말일까지 실적 50만원 미만이어도 50만원 구간 할인을 받는데 이 유예는 담지 않았다, 정부지원금은 실적에서 빠진다, 월 할인한도는 본인회원 기준으로 가족카드와 합산한다]
