open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택이 시작된 날짜를 찾지 못해 출시일 2025.04.22로 두었다., assumed: '2025-04-22'}
  - {path: 'revisions[0].limits[telecom-ott]', question: 원문 표가 이동통신요금과 OTT에 월 5천원과 건당 2천5백원 한도를 한 칸으로 적었다. 덜 주는 쪽으로 둘이 한도 하나를 함께 쓰고 OTT에도 건당 한도를 둔다고 두었다, assumed: shared}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 RF후불교통요금 무승인전표 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 연회비는 기본 7천원과 제휴 4만3천원이고 모바일 단독카드는 4만4천원이다. 할인 받은 결제는 금액 전체가 실적에서 빠진다. KB Pay 10%는 음식·건강·여가·차량 할인과 더해서 받는다.
