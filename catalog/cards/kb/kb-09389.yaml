          categories: [fuel]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 400000}
        exclude_applied: 1
      - key: food-5
        title: 식음료 5% 청구할인
        source: page
        evidence: [식음료 5%, 월 할인한도 5천원, '커피/음료, 제과/아이스크림, 편의점 업종']
        target:
          categories: [cafe, convenience, restaurant.bakery]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 400000}
        exclude_applied: 1
        unmodeled: [아이스크림 업종은 맞는 공통 업종이 없어 담지 않았다]
    unmodeled: [생애 최초 발급 본인회원은 사용등록 후 다음 달 말일까지 실적 40만원 미만이어도 할인을 받는데 이 유예는 담지 않았다, 정부지원금·현금서비스·카드론·수수료와 무승인전표(공항버스·자판기·터널통행료 등)는 실적에서 빠진다, 할인은 전표 매입 순서대로 한도 안에서 적용한다, 티맵 할인 대상 세부 서비스는 티맵 앱 고객센터에서 안내한다]
open_questions:
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인 대중교통 전표 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠질 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits', question: 티맵 할인 건의 실적 제외 여부가 원문에 없어 실적에서 빼는 쪽으로 두었다, assumed: exclude_applied 1}
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙의 시작일을 찾지 못해 수집일로 둔다, assumed: '2026-10-11'}
notes: 2026-10-11 KB국민카드 상품 페이지와 대조. 공통 가맹점 tmap(티맵 유료서비스)이 필요하다. 심의번호는 페이지에서 찾지 못했다.
