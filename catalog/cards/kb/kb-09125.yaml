schema_version: 2
id: kb-09125
issuer: kb
name: HERITAGE Smart(헤리티지 스마트) 할인형
short_name: KB HERITAGE Smart 할인형
kind: credit
product_codes:
  - '09125'
status: on_sale
annual_fees:
  - {scope: domestic, brand: local, amount: 200000}
  - {scope: global, brand: mastercard, amount: 200000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=09125', fetched_at: '2026-10-11', review_no: 제2023-C1a-06204호}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 400000, 800000, 1500000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      exclude_applied: 0
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [PG 전용 가맹점 결제와 할인하지 않는 일부 간편결제는 할인에서 빠질 수 있다]
    limits:
      - key: special
        per: month
        amount: {400000: 10000, 800000: 30000, 1500000: 50000}
    stacks:
      - {key: main, pick: best}
      - {key: special, pick: best}
    benefits:
      - key: domestic-1
        title: 국내 가맹점 1% 청구할인
        source: page
        evidence: [국내 가맹점 1% 청구할인, 전월 이용실적 조건 및 적립한도 없음, '[국내 가맹점 할인 제외 대상] 무이자할부 이용금액, 단기카드대출(현금서비스), 장기카드대출(카드론), 국세, 지방세, 각종 공과금(전기/수도 등), 아파트관리비, 정부지원금(보육료/유치원보조비/바우처이용금액 등), 초·중·고 학교 납입금 전체(수업료/교육비/현장학습비/급식비), 대학(대학원)등록금, 4대 사회보험료(건강/연금/고용/산재), 각종 수수료 및 이자, 연체료, 연회비, 상품권 및 선불카드(선불전자지급수단 포함) 구입·충전금액, 신차구매청구(환급) 할인 전표 전체, 해외이용 전표 전체, 취소금액']
        target:
          exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, insurance.social, tax, utility]
          all: true
        when:
          - {region: domestic}
        reward: {type: billing_discount, rate: 1}
        unmodeled: [정부지원금 결제와 신차구매청구(환급)할인 전표는 할인에서 빠진다]
      - key: overseas-3
        title: 해외 가맹점 3% 청구할인
        source: page
        evidence: [해외 가맹점 3% 청구할인, 전월 이용실적 조건 및 적립한도 없음, '[해외 가맹점 할인 제외 대상] 무이자할부 이용금액, 국내이용 전표 전체, 취소금액']
        target: {all: true}
        when:
          - {region: overseas}
        reward: {type: billing_discount, rate: 3}
      - key: special-department-5
        title: '[특별 쇼핑] 백화점 5% 청구할인'
        source: page
        evidence: ['쇼핑 | 백화점, 인터넷 면세점, 온라인 명품, 택시 | 5% | 1만원 | 3만원 | 5만원', '백화점 : 롯데백화점, 현대백화점, 신세계백화점, 갤러리아백화점', 온라인 결제 이용금액 제외, ‘국내 가맹점 1% + 특별 영역 5%’ 중복 적용 가능, 특별 영역 할인한도 초과 시 국내 가맹점 1% 청구할인 서비스만 제공]
        target:
          merchants: [galleria, hyundai_department, lotte_department, shinsegae_department]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: special}
        tiers: {from: 400000}
        stack: special
        exclude_applied: 1
      - key: special-dutyfree-5
        title: '[특별 쇼핑] 인터넷 면세점 5% 청구할인'
        source: page
        evidence: ['인터넷 면세점 : 롯데면세점, 신라면세점, 현대면세점, 신세계면세점', 공식 홈페이지 및 모바일(앱) 결제 시 제공, 별도의 팝업사이트 결제 및 전용 가맹점번호로 승인처리되는 일부 간편페이(Pay) 이용금액 제외]
        target:
          merchants: [hyundai_dfs_online, lotte_dfs_online, shilla_dfs_online, shinsegae_dfs_online]
        when:
          - {channel: online}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: special}
        tiers: {from: 400000}
        stack: special
        exclude_applied: 1
      - key: special-taxi-5
        title: '[특별 쇼핑] 택시 5% 청구할인'
        source: page
        evidence: ['택시 : 택시 업종', 현장 결제 시 제공, 당사 등록된 가맹점 업종 기준 제공]
        target:
          categories: [taxi]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: special}
        tiers: {from: 400000}
        stack: special
        exclude_applied: 1
      - key: special-fuel-5
        title: '[특별 스포츠] GS·SK주유소 5% 청구할인'
        source: page
        evidence: ['스포츠 | 스포츠, 주유, 방문세차 | 5% | 1만원 | 3만원 | 5만원', '주유 : GS주유소, SK주유소', LPG 충전소 포함(전기/수소 충전 제외)]
        target:
          merchants: [gs_caltex, sk_energy]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: special}
        tiers: {from: 400000}
        stack: special
        exclude_applied: 1
      - key: special-academy-5
        title: '[특별 학원] 학원 5% 청구할인'
        source: page
        evidence: ['학원 | 학원, 편의점, 커피전문점 | 5% | 1만원 | 3만원 | 5만원', '학원/편의점/커피전문점 : 기술/사무/가정계학원, 예체능계학원, 문리계학원, 외국어학원, 자동차학원, 기타학원, 편의점, 커피/음료 전문점(스타벅스 사이렌오더 포함) 업종', '현장 결제 시 제공, 당사 등록된 가맹점 업종 기준 제공']
        target:
          categories: [education.academy]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: special}
        tiers: {from: 400000}
        stack: special
        exclude_applied: 1
      - key: special-convenience-5
        title: '[특별 학원] 편의점 5% 청구할인'
        source: page
        evidence: ['학원/편의점/커피전문점 : ... 편의점, 커피/음료 전문점(스타벅스 사이렌오더 포함) 업종', 현장 결제 시 제공]
        target:
          categories: [convenience]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: special}
        tiers: {from: 400000}
        stack: special
        exclude_applied: 1
      - key: special-cafe-5
        title: '[특별 학원] 커피전문점 5% 청구할인'
        source: page
        evidence: ['학원/편의점/커피전문점 : ... 커피/음료 전문점(스타벅스 사이렌오더 포함) 업종', 현장 결제 시 제공]
        target:
          categories: [cafe]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: special}
        tiers: {from: 400000}
        stack: special
        exclude_applied: 1
        unmodeled: [스타벅스 사이렌오더도 대상이지만 온라인 결제로 기록되면 계산하지 않는다]
    unmodeled: ['특별 스포츠 영역의 스포츠 업종(골프장·골프연습장·테니스·볼링·스키·수영·종합스포츠센터·당구·요가)과 방문세차(인스타워시), 특별 쇼핑 영역의 온라인 명품(발란·머스트잇·트렌비)은 담을 업종이나 가맹점이 없어 계산하지 않는다', 특급호텔·항공권·공연전시 15만원 할인 쿠폰(연 1회 택1)과 발레파킹·라운지 같은 Mastercard 서비스는 계산하지 않는다, 최초 사용등록일부터 다음 달 말일까지 40만원 구간 특별 영역 혜택을 주는 신규 특례는 계산하지 않는다, 정부지원금(보육료·유치원보조비·바우처)과 무승인전표(자판기·터널통행료·항공기내 이용)는 실적에서 빠진다, 할인 한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2023.01.03 출시만 적었다., assumed: '2026-10-11'}
  - {path: 'revisions[0].limits[special]', question: 원문 표가 쇼핑·스포츠·학원 영역마다 1만·3만·5만원을 적었지만 영역별 한도인지 특별 영역 통합 한도인지 분명하지 않다. 덜 주는 쪽으로 세 영역이 한도 하나를 함께 쓴다고 두었다, assumed: shared}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(교통요금) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 특별 영역 할인을 받은 결제는 금액 전체가 실적에서 빠진다.
