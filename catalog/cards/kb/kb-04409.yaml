        source: page
        evidence: [11번가에서 SK PAY 등록 후 결제 시 | 11% | 5만점 | 건당 2만원 이상 이용 시 제공 이용건당 최대 1만점 이내 제공, '(KB PAY, 삼성페이, 네이버페이 등 타 간편결제 또는 ISP에 등록하여 11번가에서 결제 시에는 서비스가 제공되지 않습니다.)', 최초 발급받은 CHALLENGE BAG KB국민카드 사용등록일(KB Pay 등 간편결제 등록 포함)로부터 다음달 말일(실적유예기간)까지 이용실적이 없는 경우에도 11번가 OK캐쉬백 포인트 특별적립 서비스가 제공됩니다.]
        target:
          merchants: [eleven_st]
        when:
          - payment: [eleven_pay]
          - amount: {min: 20000}
        reward: {type: points, program: ok_cashbag, rate: 11}
        limits:
          - {per: txn, amount: 10000}
          - {per: month, amount: 50000}
        tiers:
          from: 400000
          waived_when:
