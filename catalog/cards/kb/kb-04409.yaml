        title: 생활밀착업종 OK캐쉬백 5% 적립
        source: page
        evidence: ['daily : 커피, 편의점, 약국 업종', 'weekly : 패밀리레스토랑, 패스트푸드, 주유/충전소 업종', 'monthly : 학원, 골프/골프연습장, 미용실 업종', 생활밀착업종 | 5% | 1만점 | 2만점 | 건당 1만원 이상 이용 시 제공, (단, 월 적립한도 1만점이내 제공)]
        target:
          categories: [beauty.salon, cafe, convenience, education.academy, fuel, pharmacy, restaurant.fastfood]
        when:
          - amount: {min: 10000}
        reward: {type: points, program: ok_cashbag, rate: 5}
        limits:
          - per: month
            amount: {0: 10000, 400000: 10000, 800000: 20000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        exclude_applied: 1
        unmodeled: [패밀리레스토랑과 골프장·골프연습장 업종은 공통 업종이 넓어 계산하지 않는다]
      - key: base-0-1
        title: 전 가맹점 OK캐쉬백 0.1% 기본적립
        source: page
        evidence: [전 가맹점 OK캐쉬백 0.1% 기본적립, 적립 제외 대상 이외 이용금액에 대해 OK캐쉬백 포인트 0.1% 기본 적립]
        target: {all: true}
        reward: {type: points, program: ok_cashbag, rate: 0.1}
    unmodeled: [기본 포인트리는 적립되지 않는다, SK PAY에 이 카드를 등록해 11번가에서 결제해야 한다. 결제수단 11PAY로 본다, 월 적립한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].benefits[base-0-1]', question: 특별적립 결제에 0.1% 기본적립을 더 주는지 원문이 밝히지 않는다. 같은 묶음에 두어 큰 쪽 하나만 준다, assumed: same stack}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 연회비는 K-WORLD(JCB)와 Master 모두 1만5천원이다. 생활밀착업종의 daily, weekly, monthly는 업종 묶음 이름으로 보고 횟수 제한으로 옮기지 않았다. 특별적립 받은 매출은 실적에서 빠진다.
