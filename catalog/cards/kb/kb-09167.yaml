        source: page
        evidence: [해외 전 가맹점에서 포인트리 1.0% 추가 적립 됩니다., 전월 국내 이용실적 50만원 이상 시 제공됩니다., 이용금액 50만원까지 해외가맹점 특별적립 서비스가 제공됩니다. (별도 실적 유예기간 없음)]
