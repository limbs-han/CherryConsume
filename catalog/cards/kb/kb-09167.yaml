open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2015.12.11 출시와 2018.10.02 심의번호만 적었다. 심의일을 현재 규칙의 시작일로 잠정 적용한다., assumed: '2018-10-02'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 대중교통 무승인 전표 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 쇼핑·여행 추가 적립을 받은 결제는 그 금액 전체가 실적에서 빠진다. 해외 특별 적립은 실적 유예가 없다.
