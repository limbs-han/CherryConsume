schema_version: 2
id: kb-07601
issuer: kb
name: KB국민 Members 체크카드
short_name: KB Members 체크
kind: check
product_codes:
  - '07601'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=07601', fetched_at: '2026-10-11', review_no: 180226-00502-HPP}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 100000]
    spend:
      basis: prev_calendar_month
      regions: [domestic]
      exclude_categories: [transit]
      exclude_applied: 0
    benefit_exclusions:
      categories: [education.tuition, gift_card, prepaid_charge, tax.local]
      unmodeled: ['PG 결제, 호텔·백화점·대형마트·철도역사 입점 가맹점은 적립에서 빠질 수 있다', 정부지원금 결제는 적립에서 빠진다]
    stacks:
      - {key: main, pick: best}
      - {key: extra, pick: best}
    benefits:
      - key: base-0-2
        title: 모든 가맹점 0.2% 포인트리 기본 적립
        source: page
        evidence: [기본 적립 | 모든 가맹점 | 0.2% | 10만원 이상, KB국민 Members 체크카드(기본/추가 포인트리 적립 서비스)는 전월 이용실적 10만원 이상 시 제공됩니다., '포인트리 적립 제외 대상: 지방세, 정부지원금, 대학(대학원) 등록금, 각종 수수료 및 이자, 연체료, 상품권 및 선불카드 구입·충전금액, 취소금액']
        target: {all: true}
        reward: {type: points, program: kb_pointree, rate: 0.2}
        tiers: {from: 100000}
      - key: weekend-0-2
        title: 주말·공휴일 0.2% 추가 적립
        source: page
        evidence: [주말·공휴일 모든 가맹점에서 0.2% 추가 포인트리 적립, '적립제외 : 대중교통(버스·지하철)/이동통신요금 자동납부', 단, 택시는 추가 적립 가능합니다.]
        target:
          exclude_categories: [telecom.mobile, transit.bus_city, transit.subway]
          all: true
        when:
          - day:
              in: [sat, sun]
              holidays: include
        reward: {type: points, program: kb_pointree, rate: 0.2}
        tiers: {from: 100000}
        stack: extra
        notes: 이동통신요금은 자동납부만 빠지지만 덜 주는 쪽으로 이동통신 업종 전체를 뺀다
      - key: food-cafe-0-2
        title: 음식점·커피전문점 0.2% 추가 적립
        source: page
        evidence: ['음식점 : 일반음식점, 한식, 중식, 일식, 양식, 뷔페, 패밀리레스토랑 업종', '커피 : 커피전문점 업종(스타벅스, 커피빈 등)']
        target:
          categories: [cafe, restaurant.general]
        reward: {type: points, program: kb_pointree, rate: 0.2}
        tiers: {from: 100000}
        stack: extra
      - key: transit-taxi-0-2
        title: 버스·지하철·택시 0.2% 추가 적립
        source: page
        evidence: ['대중교통(버스·지하철), 택시 0.2% 추가 포인트리 적립', '적립제외 : 시외버스, 고속버스', 실제 카드이용일이 아닌 이메일 이용내역서상 기재된 이용일 기준으로 적립 적용됩니다.]
        target:
          categories: [taxi, transit.bus_city, transit.subway]
        reward: {type: points, program: kb_pointree, rate: 0.2}
        tiers: {from: 100000}
        stack: extra
        unmodeled: [후불교통 적립은 이메일 이용내역서에 적힌 이용일 기준이다]
      - key: telecom-0-2
        title: 이동통신요금 자동납부 0.2% 추가 적립
        source: page
        evidence: ['제공조건 : 이동통신요금(SKT, KT, LG U+) 자동납부 등록']
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - billing: [autopay]
        reward: {type: points, program: kb_pointree, rate: 0.2}
        tiers: {from: 100000}
        stack: extra
    unmodeled: [무승인 금액(철도반환수수료 등)과 정부지원금은 실적에서 빠진다, 최초 발급 후 사용등록일부터 다음 달 말일까지 실적 없이 추가 적립을 주는 신규 특례는 계산하지 않는다, 같은 계열 KB국민 체크카드는 실적을 합산할 수 있다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문은 교통이용금액을 실적에서 뺀다고 적었다. 후불교통만인지 교통 전체인지 분명하지 않아 덜 주는 쪽으로 교통 업종 전체를 뺐다. 택시는 남겼다, assumed: transit}
  - {path: 'revisions[0].stacks', question: 주말 추가 적립과 음식·교통·통신 추가 적립을 한 결제에 함께 주는지 원문에 없다. 덜 주는 쪽으로 추가 적립은 하나만 준다, assumed: best}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 해외 이용금액은 실적에서 빠진다. 적립 한도는 원문에 없다.
