open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택이 시작된 날짜를 찾지 못해 출시일 2023.06.23으로 두었다., assumed: '2023-06-23'}
  - {path: 'revisions[0].limits[integrated]', question: 원문 통합할인한도표는 20만원 이상부터다. 실적 조건 없는 커피 할인만 받는 20만원 미만 구간은 커피 월 한도 3천원으로 두었다, assumed: '0: 3000'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통요금 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 일상 혜택은 kb-07964 노리2 KB Pay와 같고 KB Pay 추가 할인 대신 Play 게임·푸드 할인이 있다. 체크카드 환급할인은 캐시백으로 옮겼다.
