open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다, assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문은 무이자할부(부분)서비스를 실적에서 뺀다. 부분 무이자도 무이자할부로 본다, assumed: interest_free exclude}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 구간은 전월 50만원 이상과 100만원 이상 둘이다. 할인 받은 이용금액도 전월 실적에 넣는다. 구독 할인은 50만원 이상 한 구간이다. 본인카드만 발급한다. 심의번호는 페이지에서 찾지 못했다.
