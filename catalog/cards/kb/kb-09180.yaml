notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 연회비는 K-WORLD 1만원(기본 7천원과 제휴 3천원), 국내외겸용 아멕스 1만5천원이다. 롯데마트몰 평일 한도와 매장 주말 한도는 따로다.
