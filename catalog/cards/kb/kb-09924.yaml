notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 1st와 2nd 선택서비스를 하나씩 고르고 변경은 다음 달 1일부터다. 할인받은 결제는 금액 전체가 실적에서 빠진다.
