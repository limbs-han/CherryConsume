schema_version: 2
id: kb-toktok
issuer: kb
name: KB국민 청춘대로 톡톡카드
kind: credit
status: on_sale
annual_fees:
  - {scope: domestic, amount: 10000}
  - {scope: global, amount: 12000}
sources:
  - {id: page, kind: product_page, url: 'https://img2.kbcard.com/obj/card/download/09174__prdctOpmn_20260714.pdf', fetched_at: &id001 2026-09-28}
checked_at: *id001
revisions:
  - effective_from: *id001
    effective_from_estimated: true
    source: page
    tiers: [0, 300000]
    spend:
      exclude_categories: [annual_fee, apartment_fee, gift_card, tax, transit, utility]
      exclude_applied: 1
    benefits:
      - key: starbucks-50
        title: 스타벅스 50% 청구할인
        target:
          merchants: [starbucks]
        reward: {type: billing_discount, rate: 50}
        limits:
          - {per: month, amount: 10000}
        tiers: {from: 300000}
        notes: 상품권 구매, 건물 내 임대매장 제외
      - key: burger-20
        title: 버거·패스트푸드 20% 청구할인
        target:
          merchants: [burger_king, lotteria, mcdonalds, shake_shack]
        reward: {type: billing_discount, rate: 20}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
        notes: 원문은 버거/패스트푸드 업종 전체. 예시로 든 맥도날드·버거킹·롯데리아·쉐이크쉑만 넣음. 상품권, 건물 내 임대매장 제외
      - key: pay-10
        title: 간편결제 10% 청구할인
        target: {all: true}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
        notes: 삼성페이, 네이버페이, 카카오페이, KB국민 앱카드 등 온·오프라인 간편결제만. ISP·MISP 제외. 다른 할인과 중복 가능
      - key: basic-10
        title: 대중교통·택시·이동통신 10% 청구할인
        target:
          categories: [taxi, telecom, transit]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
        tiers: {from: 300000}
        notes: 이동통신은 SKT·KT·LG U+ 자동납부만, 결합상품·알뜰폰 제외. 시외·고속버스, 모바일티머니 후불형 제외. 버스·지하철은 명세서 이용일 기준
notes: '연회비는 K-WORLD(JCB타입) 1만원을 국내, Master 1만2천원을 해외겸용으로 넣음. 모바일단독 4천원·6천원. 해외 이용은 일시불 매입완료 기준. 실적 제외: 할인 받은 건 전액, 현금서비스, 카드론, 정부지원금, 대학 등록금, 수수료·이자, 연체료, 무승인전표(교통요금·자판기·터널통행료·항공기), 취소금액. public_transit는 무승인전표 교통요금으로 보고 뺐다. 취소를 어느 달 실적에서 빼는지는 공식 문구 미확인, KB 다른 카드 기준 cancel_month로 둠. 할인 제외: 무이자할부, 상품권·선불카드 구입·충전. 간편결제 10%는 다른 할인과 중복 적용되고 한도는 각각 차감. 최초 사용등록일부터 다음 달 말까지 실적 무관. 월 한도는 본인 기준, 이월 없음.'
