        evidence: [최초 카드 사용등록일(KB Pay등 간편결제 등록 포함)로부터 다음달 말일(실적 유예기간)까지「삼성AI구독 KB국민카드」전월 이용실적 30만원 미만 시에도 월 할인한도 5천원까지 할인이 제공됩니다.]
