        source: page
        evidence: [삼성 AI구독 자동납부 할인 | 1만원 | 1만2천원 | 1만4천원, 할인금액보다 구독 자동납부 금액이 적을 경우 결제금액 까지만 할인이 적용됩니다., 삼성AI구독 자동납부 결제 건이 여러 건인 경우 합산하여 월 할인 금액 내에서 할인됩니다.]
