          merchants: [samsung_subscription]
        when:
          - billing: [autopay]
          - {fact: first_personal_issue}
          - card_month: {min: 0, max: 1}
        reward: {type: billing_discount, rate: 100}
        limits:
          - {shared: samsung-ai}
        tiers: {to: 0}
    unmodeled: [삼성전자 AI구독 클럽 자동납부만 대상이다, '정부지원금과 무승인전표(공항버스, 자판기, 터널통행료, 항공기내 이용)는 실적에서 빠진다', 'PG 결제와 호텔·백화점·대형마트·철도역사 입점 가맹점, 상품권 구매는 할인에서 빠질 수 있다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 공통 가맹점 삼성전자 구독(samsung_subscription)을 쓴다. 실적 유예기간 한도가 1구간보다 낮은 5천원이라 0 구간에만 붙는 별도 혜택으로 두었다.
