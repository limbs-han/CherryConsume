schema_version: 2
id: kb-02088
issuer: kb
name: KB국민 그린체크카드(서울형)
short_name: KB 그린체크 서울형
kind: check
product_codes:
  - '02088'
status: on_sale
annual_fees:
  - {scope: domestic, amount: 0}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=02088', fetched_at: '2026-10-11', review_no: 제2024-C1a-14704호}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 100000, 300000, 500000, 1000000]
    spend:
      basis: prev_calendar_month
      regions: [domestic]
      exclude_categories: [apartment_fee, education.tuition, gift_card, prepaid_charge, tax, transit.bus_city, transit.subway, utility]
      month_offset: {}
      exclude_applied: 0
    benefit_exclusions:
      categories: [education.tuition, gift_card, prepaid_charge, tax, utility]
      unmodeled: [PG 결제와 호텔·백화점·철도역사·아울렛 입점 가맹점은 적립에서 빠질 수 있다, 정부지원금 결제는 적립에서 빠진다]
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 처음 발급받았나요? 해지 후 다시 발급받은 경우는 아니요를 고르세요.'}
    limits:
      - key: shopping
        per: month
        amount: {0: 5000, 300000: 5000, 500000: 10000, 1000000: 10000}
    benefits:
      - key: transit-eco
        title: 버스·지하철·고속·시외버스 5~10% 에코머니 적립
        source: page
        evidence: ['대중교통적립(후불교통(시내버스, 지하철), 고속/시외버스)', 직전월 이용금액 10만원 이상 30만원 미만 | 30만원 이상 50만원 미만 | 50만원 이상 100만원 미만 | 100만원 이상, 대중교통 5% 10%, 월간적립한도 대중교통 5, 000점 5, 000점 5, 000점 10, 000점, 최초 사용등록일이 포함된 월말까지는 실적과 관계없이 대중교통은 10만원 이상 구간 적립 제공(해지 후 재발급 제외)]
        target:
          categories: [transit.bus_city, transit.bus_express, transit.bus_intercity, transit.subway]
        reward:
          type: points
          program: eco_money
          rate: {0: 5, 100000: 5, 300000: 5, 500000: 5, 1000000: 10}
        limits:
          - per: month
            amount: {0: 5000, 100000: 5000, 300000: 5000, 500000: 5000, 1000000: 10000}
        tiers:
          from: 100000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 0}
        unmodeled: [후불교통 적립은 실제 이용일이 아니라 이용대금명세서의 이용일 달로 계산될 수 있다]
      - key: online-shopping-eco
        title: 6대 인터넷쇼핑몰 1~3% 에코머니 적립
        source: page
        evidence: ['6대 인터넷 쇼핑몰(G마켓, 옥션, 인터파크, 11번가, 롯데ON, 신세계몰)', 인터넷쇼핑 1% 2% 3%, 월간적립한도 쇼핑 5, 000점 10, 000점 10, 000점, 쇼핑은 30만원 이상 구간 적립 제공]
        target:
          merchants: [auction, eleven_st, gmarket, interpark, lotte_on]
        reward:
          type: points
          program: eco_money
          rate: {0: 1, 300000: 1, 500000: 2, 1000000: 3}
        limits:
          - {shared: shopping}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 0}
        notes: 신세계몰은 공통 가맹점 ssg_com이 이마트몰까지 넓어 넣지 않았다
      - key: mart-eco
        title: 대형마트 0.5~2% 에코머니 적립
        source: page
        evidence: [쇼핑업종(6대 인터넷 쇼핑몰, 대형마트), 대형마트 0.5% 1% 2%, 월간적립한도 쇼핑 5, 000점 10, 000점 10, 000점]
        target:
          merchants: [emart, homeplus, lotte_mart]
        reward:
          type: points
          program: eco_money
          rate: {0: 0.5, 300000: 0.5, 500000: 1, 1000000: 2}
        limits:
          - {shared: shopping}
        tiers:
          from: 300000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 0}
        notes: 대형마트 업종은 이마트, 홈플러스, 롯데마트만 넣었다
    unmodeled: [실적은 가족카드 이용분을 합산한다, 탄소포인트제·에코마일리지 같은 카드 결제 밖 적립은 계산하지 않는다, 정부지원금과 항공기내 같은 무승인 전표는 실적에서 빠진다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 원문에 출시일이 없고 심의일만 있다. 현재 규칙 시작일을 몰라 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통이용 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
  - {path: 'revisions[0].benefits[transit-eco].reward.rate', question: '원문 표는 대중교통 5%와 10% 두 칸만 있다. 월간 한도 5,000점이 세 구간, 10,000점이 100만원 구간이라 5%를 10만~100만원 미만, 10%를 100만원 이상으로 읽었다. 쇼핑 세 비율은 30만원 이상 세 구간으로 읽었다', assumed: '10만·30만·50만 5%, 100만 10%'}
notes: 2026-10-11 KB국민카드 상품 페이지로 대조했다. 체크카드라 무이자할부 조건은 두지 않았다. 신용카드 kb-02086과 다른 상품이다.
