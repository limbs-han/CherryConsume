notes: >-
  승인시점 기준, 해외는 매입완료 기준. 실적 제외: 할인 받은 건 전액, 현금서비스, 카드론, 초·중·고 학교 납입금, 정부지원금, 대학 등록금, 4대 사회보험료, 수수료·이자, 연체료, 무승인전표(교통요금·자판기·터널통행료·기내), 취소금액.
  public_transit는 무승인전표 교통요금으로 보고 뺐다.
  할인 제외: 무이자할부, 상품권·선불카드, 아파트관리비, 학교 납입금·등록금, 세금·공과금, 4대 사회보험료, 신차구매 할인 전표 등.
  더욱 진심 서비스는 3팩(먹는데·노는데·관리에 진심) 중 택1, 변경은 다음 달 1일부터.
  생일 월에는 선택 팩 한도 2배(Happy Birth Month). 전월실적 35만~40만원이면 연 2회 실적 채워드림 신청 가능.
  최초 사용등록일부터 다음 달 말까지 실적 무관. 월 한도는 본인 기준, 이월 없음.
  KB Pay 할인과 다른 할인의 중복 여부는 공식 문구 미확인.
  모바일단독카드 연회비 9,000원. 가족카드 발급 불가.
