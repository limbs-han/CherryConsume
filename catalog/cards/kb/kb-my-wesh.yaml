    unmodeled: ['전월실적 채워드림은 전월 실적이 35만원 이상 40만원 미만일 때 신청하면 신청 다음날부터 신청월 말일까지 할인을 받는다. 신청 당일은 할인하지 않는다. 신청은 월 1회, 연 2회, 매월 1일부터 25일 사이에만 할 수 있고 생일 월에는 신청할 수 없다. 신청 여부를 모르므로 계산하지 않는다', 생일 달 두 배 한도는 실적 유예기간에 주지 않는다. 카드 등록 다음 달에 실제 전월 실적이 40만원 미만이면 두 배 한도를 받지 못한다, 해외 이용금액은 승인일이 아니라 매입 완료일 기준으로 실적 달을 나누고 일시불만 센다, 정부지원금(보육료·유치원보조비·바우처) 결제와 자판기·터널통행료·항공기내 같은 무승인 전표는 실적에서 빠진다, '실적 유예기간은 처음 발급받은 My WE:SH 카드의 사용등록일 기준이다. 재발급이나 추가 발급 카드에는 적용하지 않는다']
