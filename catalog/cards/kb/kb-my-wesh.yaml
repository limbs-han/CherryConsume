notes: '첫 개정 시행일 근거: launch. 출시 2022-12-26. 출시 상품설명서와 지금 상품설명서의 혜택이 같고, 새소식 게시판에 이 카드의 부가서비스 변경 공지가 없다. 2025-01-02부터 새로 발급한 카드는 기본연회비도 카드별로 청구한다는 약관 개정은 혜택 변경이 아니다. 나한테 진심 4개는 모두 받고, 더욱 진심 3팩 중 하나를 고른다. 팩 변경은 신청 다음 달 1일부터. 전월 40만원 이상, 처음 발급받은 My WE:SH 카드의 사용등록일(KB Pay 등 간편결제 등록 포함)부터 다음 달 말일까지는 실적 무관. 재발급이나 추가 발급 카드에는 유예기간이 없다. 생일 달에는 더욱 진심 팩 월 한도가 두 배(Happy Birth Month)이고 생일 달은 KB국민카드에 등록된 회원정보 기준. 할인 제외의 교통요금은 product 확인사항에서 옮겼다. 월 한도는 본인회원 기준이고 이용 순서대로 채우며 이월하지 않는다. 가족카드 발급 불가. 상품공시실에 제휴코드 09123과 09923 두 개로 공시되고 09123은 Eco형 디자인 이미지에도 쓰인다.'
