        notes: U+유모바일 자동납부 승인금액 전액을 월 할인금액까지 할인한다. 여러 건이면 합산해 월 할인금액 안에서 할인한다. 0 구간 3,500원은 생애 최초 발급의 실적 유예기간에만 준다
    unmodeled: [월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 할인 한도는 이용 순서대로 채운다, 해외 이용금액은 승인일이 아니라 매입 완료일 기준으로 실적 달을 나누고 일시불만 센다, 정부지원금(보육료·유치원보조비·바우처) 결제는 실적에서 빠진다, 자판기·터널통행료·항공기내 같은 무승인 전표는 실적에서 빠진다, 무승인 공항버스 요금은 실적에서 빠지지만 담을 업종이 없어 실적에 남는다]
