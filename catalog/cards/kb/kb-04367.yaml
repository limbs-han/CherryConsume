        source: page
        evidence: [알뜰폰 통신료 자동납부요금 청구할인 | 7천원 | 1만1천원, 타 통신사 자동이체 건은 할인대상에서 제외, '최초 카드 사용 등록일(KB Pay 등 간편결제 등록 포함)로 부터 다음달 말일(실적 유예기간)까지 KB국민 U+유모바일Ⅱ 카드 전월 이용실적 30만원 미만 시, 월 3천5백원 할인금액이 제공됩니다.', 할인금액보다 자동납부 승인금액이 작을 경우 승인금액까지만 할인이 적용됩니다., U+유모바일 자동납부 승인 건이 여러 건인 경우 합산하여 월 할인금액 내에서 할인됩니다., '할인(적립) 서비스 제공 관련 카드별 실적 유예기간은 본인회원이 해당카드를 생애 최초 발급받은 경우에 적용되며, 가족카드 단독 발급 시 적용되지 않습니다.']
