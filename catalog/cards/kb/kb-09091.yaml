notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 기본 0.5%에 특별 포인트리를 더한다. 표의 특별 포인트리 비율은 기본에 더하는 비율이다. 영역별 월 15,000점 한도 셋의 합이 월 45,000점이라 월 통합 한도는 따로 적지 않았다.
