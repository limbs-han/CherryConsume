open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2026.02.27 출시라고만 적었다. 현재 규칙의 시작일로 잠정 적용한다., assumed: '2026-02-27'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(RF후불교통요금) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
  - path: revisions[0].benefits[digital-30].limits
    question: 원문 표의 디지털 콘텐츠 월 한도 5천원이 40만원과 80만원 구간에 같이 걸친 것으로 읽었다
    assumed: '5000'
notes: 2026-10-10 KB국민카드 상품 페이지를 직접 받아 대조했다. 실적 유예는 생애 최초 발급만 facts로 확인하고 월 한도는 40만원 구간의 50%, 건당 한도는 그대로 둔다. 간편결제 할인은 온라인 패션몰과 네이버플러스 멤버십 할인과 중복된다.
