schema_version: 2
id: kb-09060
issuer: kb
name: CU KB국민카드
short_name: KB CU
kind: credit
product_codes:
  - '09060'
status: on_sale
annual_fees:
  - {scope: global, amount: 20000}
  - {scope: global, form: mobile, amount: 14000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=09060', fetched_at: '2026-10-11', review_no: 제2024-C1a-04917호}
checked_at: '2026-10-11'
revisions:
  - effective_from: '2026-10-11'
    effective_from_estimated: true
    source: page
    tiers: [0, 400000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility.electricity, utility.water]
      month_offset: {}
      exclude_applied: 1
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: ['PG 결제와 호텔·백화점·대형마트·철도역사 입점 가맹점, 상품권 구매는 할인에서 빠질 수 있다', 부분 무이자할부 이용금액도 할인에서 빠진다]
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 본인 명의로 발급받았나요? 가족카드만 발급받은 경우는 아니요를 고르세요.'}
    stacks:
      - {key: main, pick: best}
      - {key: kbpay, pick: best}
    benefits:
      - key: cu-30
        title: CU 30% 청구할인
        source: page
        evidence: [CU 청구 할인 | 30% | 1만5천원 | 40만원]
        target:
          merchants: [cu]
        reward: {type: billing_discount, rate: 30}
        limits:
          - {per: month, amount: 15000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: cu-kbpay-20
        title: CU KB Pay 결제 20% 추가 청구할인
        source: page
        evidence: [KB Pay 추가 청구 할인* | 20% | 5천원, CU에서 KB Pay 결제 시 추가 할인]
        target:
          merchants: [cu]
        when:
          - payment: [kb_pay]
        reward: {type: billing_discount, rate: 20}
        limits:
          - {per: month, amount: 5000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        stack: kbpay
      - key: telecom-5
        title: 이동통신요금 자동납부 5% 청구할인
        source: page
        evidence: ['SKT, KT, LG U+, Liiv M | 5% | 5천원 | 40만원', '인터넷, IPTV 등 결합상품 제외']
        target:
          merchants: [kt, lg_uplus, liiv_m, skt]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {per: month, amount: 5000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [인터넷·IPTV 등 결합상품 요금은 할인에서 빠진다]
      - key: ott-10
        title: OTT 정기결제 10% 청구할인
        source: page
        evidence: ['넷플릭스, 유튜브 프리미엄, 웨이브, 티빙, 디즈니 플러스 | 10% | 1만원 | 40만원', 공식 홈페이지를 통한 정기 결제 이용 건에 한함, 간편 결제 또는 인앱 결제 건 등은 제외]
        target:
          merchants: [disney_plus, netflix, tving, wavve, youtube_premium]
        when:
          - billing: [subscription]
          - payment: [physical_card]
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 10000}
        tiers:
          from: 400000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
    unmodeled: [CU멤버십 포인트 적립은 CU가 주는 혜택이라 계산하지 않는다, '정부지원금과 무승인전표(공항버스, 자판기, 터널통행료, 항공기내 이용)는 실적에서 빠진다', 월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 할인 한도는 전표 매입 순서대로 채운다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. CU KB Pay 추가 20%는 기본 30%에 더해 최대 50%가 되므로 다른 묶음에 두었다. 연회비는 국내전용과 Master 겸용 2만원, 모바일 단독 1만4천원이다.
