notes: 2025-03-31 출시. 연회비는 일반카드 합계 5만5천원이고 모바일 단독은 4만9천원이다. 자동납부 세 혜택은 월 5천원 한도를 함께 쓰고 할인받은 매출은 실적에서 빠진다.
