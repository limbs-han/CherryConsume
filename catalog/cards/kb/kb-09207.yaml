notes: 2026-10-12 KB국민카드 상품 페이지로 대조했다. A팩과 B팩 중 하나를 고르고, 전월 120만원 이상이면 고르지 않은 팩의 2구간 적립도 더 준다. 고르지 않은 팩의 추가 적립은 -extra 혜택으로 따로 두었다. 적립받은 결제는 금액 전체가 실적에서 빠진다.
