notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 밀크T 학습비 자동이체 전용 할인 카드이고 구조는 KB HCN kb-02249와 같다. 밀크T 가맹점은 공통 파일에 새로 더해야 한다.
