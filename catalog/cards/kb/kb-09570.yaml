        evidence: ['[취향] 오늘의집/29CM/인터파크티켓/티켓링크 10% 청구할인 오늘의집, 29CM, 인터파크티켓, 티켓링크', ※ 공식 홈페이지/모바일 앱 결제 건에 한함, '※ 인터파크티켓, 티켓링크는 공연, 전시, 스포츠 예매에 한함']
