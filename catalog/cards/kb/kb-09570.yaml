        evidence: ['쇼핑 KB Pay 쇼핑, G마켓, 11번가, SSG.COM 10% 7천원 1만2천원', '[건별 할인한도 5천원]', 선택 할인 서비스는 KB Pay 이용 건에 한하여 제공됩니다, '※ 상품권, 여행, 항공권, 티켓, 도서, 별도 팝업사이트 제외']
        target:
          merchants: [eleven_st, gmarket, ssg_com]
        when:
          - payment: [kb_pay]
