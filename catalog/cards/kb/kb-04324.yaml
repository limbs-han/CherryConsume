        evidence: [알뜰폰 통신료 자동이체 할인 | 1만2천원 | 1만7천원, 1구간(30만원 이상) 2구간(70만원 이상), 할인금액보다 자동이체 승인금액이 적을 경우 승인금액만큼 할인 적용됩니다., 통신료 자동이체 승인 건이 여러 건인 경우 합산하여 월 할인금액 내에서 할인 됩니다., 최초 카드 사용 등록일로부터 다음달 말일까지는 알뜰폰 Hub Ⅱ 카드 실적이 없는 경우에도 1구간(전월 이용실적 30만원 이상)에 해당하는 12, 000원 청구할인 서비스가 적용됩니다.]
