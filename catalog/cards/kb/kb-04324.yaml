    unmodeled: [월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 해외 이용금액은 매입 완료일 기준으로 실적 달을 나누고 일시불만 센다, 정부지원금 결제는 실적에서 빠진다, 자판기·터널이용료·항공기내·공항버스 같은 무승인 전표는 실적에서 빠진다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙의 시작일을 찾지 못했다. 원문은 2021.03.11 출시만 적었다, assumed: '2026-10-12'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(대중교통) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-12 KB국민카드 상품 페이지와 상품설명서 PDF를 대조했다. 알뜰폰 자동이체 승인금액 전액을 월 할인금액까지 할인한다. 원문 대상은 모든 알뜰폰 사업자지만 공통 업종에 알뜰폰이 따로 없어 공통 가맹점에 있는 알뜰폰 사업자만 담았다. 알뜰폰 업종이나 리브엠 같은 사업자가 공통 파일에 들어오면 대상을 넓힌다.
