notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 연회비는 기본 7,000원과 제휴 793,000원을 더한 본인 800,000원이고 가족카드는 200,000원이다. 포인트리 1점은 1원이다. 특별 적립은 백화점·골프장·골프연습장 각 업종의 한 건 결제가 100만원 이상이어야 하고 여러 업종을 합산하지 않는다.
