        notes: 무승인 후불대중교통은 적립에서 빠진다. 결제 입력으로 무승인 여부를 알 수 없어 시내버스와 지하철 업종을 모두 뺐다
      - key: extra-point-0-5
        title: 슈퍼·마트·편의점 0.5% 포인트리 추가 적립
        source: page
        evidence: [전월 이용실적 충족 후 생활 편의업종(슈퍼, 마트, 편의점) 이용시 포인트리 추가 적립!, '월 최대 적립 한도 : 2만점(기본 적립 포함)', 30만원 이상 | 0.5%, '적립 서비스 제외 대상 이용 취소건, 상품권 및 선불카드(선불전자지급수단 포함) 구입·충전금액, 기프트카드 구매 충전 금액']
        target:
          categories: [convenience, grocery_mart]
        when:
          - {region: domestic}
        reward: {type: points, program: kb_pointree, rate: 0.5}
        limits:
          - {shared: point_monthly}
        tiers: {from: 300000}
        stack: extra
        notes: 기본 0.5%에 더해 받는다. 기본과 추가 적립이 월 2만점 한도를 함께 쓴다. 할인 제외 공통 목록을 따라 무이자할부도 뺐다
    unmodeled: [정부지원금(보육료·유치원보조비·바우처) 결제는 실적에서 빠진다, 월 적립한도는 본인회원 기준이다, 적립 한도는 이용 순서대로 채운다, 서민금융진흥원 햇살론카드 보증서 발급자만 신청할 수 있고 유흥·사행 업종 등은 이용이 제한된다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2021.10.22 출시만 적었다. 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-11'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 대조했다. 상품설명서 PDF(img2.kbcard.com)는 robots.txt가 막아 받지 않았다. 추가 적립의 제외 대상에는 무이자할부가 없지만 공통 할인(적립) 제외매출에 있어 덜 주는 쪽으로 뺐다.
