            card_month: {min: 0, max: 1}
        stack: fuel
        notes: 주유는 포인트리 적립에서 빠져 따로 묶는다
      - key: weekday-base-1-1
        title: 주중(월~목) 전 가맹점 1.1% 포인트리
        source: page
        evidence: ['주중(월요일~목요일) 전 가맹점 기본 1.1% 포인트리 적립(주유소, 충전소 제외) / 일상 쇼핑(백화점/대형마트) 이용 시 1.3% 포인트리 적립', '포인트리 적립 제외대상 - 주유소, 충전소 , 무이자할부 이용금액']
        target:
          exclude_categories: [fuel]
          all: true
        when:
          - {interest_free: false}
          - day:
              in: [mon, tue, wed, thu]
              holidays: ignore
        reward: {type: points, program: kb_pointree, rate: 1.1}
        tiers:
          from: 500000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: weekday-shopping-1-3
        title: 주중(월~목) 백화점·대형마트 1.3% 포인트리
        source: page
        evidence: [일상 쇼핑(백화점/대형마트) 이용 시 1.3% 포인트리 적립, '일상 쇼핑(백화점/대형마트) 및 프리미엄 쇼핑(면세점/프리미엄 아울렛)의 온라인 쇼핑몰, 건물 내 임대매장 이용금액은 기본 적립 대상입니다.', 특별 적립 서비스는 국내 가맹점 이용시에 한하여 제공됩니다.]
        target:
          categories: [department_store, grocery_mart]
          exclude_merchants: [hyundai_premium_outlet, lotte_premium_outlet, shinsegae_premium_outlet, shinsegae_simon]
        when:
          - {interest_free: false}
          - day:
              in: [mon, tue, wed, thu]
              holidays: ignore
          - {channel: offline}
          - {region: domestic}
        reward: {type: points, program: kb_pointree, rate: 1.3}
        tiers:
          from: 500000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [백화점과 대형마트 건물 안 임대매장은 기본 1.1%만 받는다]
      - key: weekend-base-1-3
        title: 주말(금~일) 전 가맹점 1.3% 포인트리
        source: page
        evidence: ['주말(금요일~일요일) 전 가맹점 기본 1.3% 포인트리 적립(주유소, 충전소 제외) / 프리미엄 쇼핑(면세점/롯데, 신세계 프리미엄 아울렛) 이용 시 1.5% 포인트리 적립']
        target:
          exclude_categories: [fuel]
          all: true
        when:
          - {interest_free: false}
          - day:
              in: [fri, sat, sun]
              holidays: ignore
        reward: {type: points, program: kb_pointree, rate: 1.3}
        tiers:
          from: 500000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
      - key: weekend-dutyfree-1-5
        title: 주말(금~일) 면세점 1.5% 포인트리
        source: page
        evidence: ['프리미엄 쇼핑(면세점/롯데, 신세계 프리미엄 아울렛) 이용 시 1.5% 포인트리 적립', '일상 쇼핑(백화점/대형마트) 및 프리미엄 쇼핑(면세점/프리미엄 아울렛)의 온라인 쇼핑몰, 건물 내 임대매장 이용금액은 기본 적립 대상입니다.', 특별 적립 서비스는 국내 가맹점 이용시에 한하여 제공됩니다.]
        target:
          categories: [travel.duty_free]
        when:
          - {interest_free: false}
          - day:
              in: [fri, sat, sun]
              holidays: ignore
          - {channel: offline}
          - {region: domestic}
        reward: {type: points, program: kb_pointree, rate: 1.5}
        tiers:
          from: 500000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        unmodeled: [롯데프리미엄아울렛(파주·이천·김해·광명·동부산점)과 신세계사이먼 프리미엄 아울렛(파주·여주·시흥·부산점)도 1.5% 대상이지만 지점 목록을 담을 가맹점이 없어 기본 1.3%로 계산한다]
    unmodeled: [무승인전표(자판기·터널 통행료·항공기 내 이용)는 실적에서 빠진다, '연 1회 쿠폰(신세계·롯데 상품권 15만원, 포인트리 15만점, 호텔 뷔페 16만원 중 택1)은 첫해 50만원, 다음 해부터 전년 600만원 이용 시 준다. 결제 혜택이 아니라 담지 않는다', '해외여행상품 3~5% 현장할인, 제주 렌터카, 골프, 공항 서비스 같은 BeV Ⅲ 전용 서비스는 담지 않는다']
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 규칙의 시작일을 원문에서 찾지 못했다. 수집일을 잠정 시작일로 둔다., assumed: '2026-10-11'}
notes: 2026-10-11 KB국민카드 상품 페이지를 직접 받아 옮겼다. 할인과 적립은 모두 전월 50만원 이상일 때만 준다. 무승인 교통요금 실적 제외는 시내버스와 지하철 업종 제외로 둔다. 포인트리 적립 한도는 원문에 없다.
