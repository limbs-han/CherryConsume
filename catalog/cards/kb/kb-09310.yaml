        source: page
        evidence: [전 주유소/충전소 리터당 100원 할인, '할인한도 - 전월 이용실적 50만원 이상 : 이용금액 20만원 한도, 전월 이용실적 100만원 이상 : 이용금액 40만원 한도', '기준 유가 : GS 칼텍스 본사 고시 휘발유가(경유, 등유, LPG는 휘발유가에 비례하여 할인율 적용)', 전월 1일~말일(승인시점 기준) BeV Ⅲ카드 일시불 및 할부 승인(이용)금액 기준 50만원 이상일 경우에만 할인 및 적립 서비스를 제공합니다., '단, 최초 카드 사용 등록일로부터 다음 달 말일까지는 전월 이용실적이 50만원 미만인 경우에도 서비스를 제공합니다.']
        target:
