        source: page
        evidence: ['동네중심 | SSM(이마트에브리데이/롯데슈퍼/홈플러스익스프레스), 배달앱(배달의민족/요기요), 동네상권(세탁소, 정육점, 약국, 제과점/아이스크림점, 미용원, 서점)', '배달앱은 상품권(선물하기 등), 선불카드 충전, 배달현장 결제 제외. 동네상권은 온라인(PG) 결제 제외']
