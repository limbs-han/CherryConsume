        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: second}
        tiers: {from: 400000}
      - key: second-kids-other-10
        title: '[2nd 자녀중심] CU·GS25·패스트푸드 10% 청구할인'
        source: page
        evidence: ['편의점(CU, GS25), 독서실, 패스트푸드점', '온라인(PG) 결제 제외, 백화점·대형마트 일부 입점 매장 제외']
        target:
          categories: [restaurant.fastfood]
          merchants: [cu, gs25]
        when:
          - option:
              second: [kids]
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: second}
        tiers: {from: 400000}
