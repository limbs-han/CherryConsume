        evidence: [돌봄중심 10% 청구할인 (건당 3만원이상 매출에 한하여 서비스 적용), '종합병원, 일반병원(치과/한방), 일반의원(치과/한의원), 한약방, 건강식품점', 병원·의원 온라인(PG) 결제 제외]
        target:
          categories: [hospital]
        when:
          - option:
              second: [care]
          - amount: {min: 30000}
          - {channel: offline}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {shared: second}
        tiers: {from: 400000}
        unmodeled: [한약방과 건강식품점은 담을 업종이 없어 계산하지 않는다]
    unmodeled: [최초 사용등록일부터 다음 달 말일까지 1구간 서비스를 주는 신규 특례는 계산하지 않는다, 전월실적 35만원 이상 40만원 미만 고객이 신청하는 전월실적 채워드림(월 1회·연 2회)은 계산하지 않는다, 정부지원금과 무승인전표(자판기·터널이용료·항공기내 이용)는 실적에서 빠진다, 할인 한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 원문 규칙이 시작된 날짜를 찾지 못했다. 원문은 2022.12.26 출시만 적었다., assumed: '2026-10-12'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 무승인전표(RF후불교통요금) 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다, assumed: 'transit.bus_city, transit.subway'}
  - {path: status, question: 데스크톱 페이지가 기존 보유 고객의 재발급 신청만 된다고 안내한다. 신규 발급이 끝났는지 확인해야 한다, assumed: on_sale}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 할인받은 결제는 금액 전체가 실적에서 빠진다. 5월 Happy Family Month에는 2nd 한도가 두 배다.
