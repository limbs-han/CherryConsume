schema_version: 2
id: kb-04328
issuer: kb
name: KB국민 쿠쿠렌탈 티타늄카드
short_name: KB 쿠쿠렌탈 티타늄
kind: credit
product_codes:
  - '04328'
status: on_sale
annual_fees:
  - {scope: global, brand: k_world_upi, amount: 20000}
  - {scope: global, brand: mastercard, amount: 20000}
sources:
  - {id: page, kind: product_page, url: 'https://card.kbcard.com/CRD/DVIEW/HCAMCXPRICAC0076?mainCC=a&cooperationcode=04328', fetched_at: '2026-10-12'}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2026-10-12'
    effective_from_estimated: true
    source: page
    tiers: [0, 500000, 1000000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, tax, transit.bus_city, transit.subway, utility.electricity, utility.water]
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
    facts:
      - {key: first_personal_issue, type: bool, scope: card, ask: '이 상품을 생애 처음 본인 명의로 발급받았나요? 가족카드만 발급받은 경우는 아니요를 고르세요.'}
    benefits:
      - key: cuckoo-rental-autopay-discount
        title: 쿠쿠렌탈 렌탈료 자동이체 청구할인
        source: page
        evidence: [쿠쿠렌탈 렌탈료 자동이체 할인 | 1만원 | 1만5천원, 1구간(50만원 이상) 2구간(100만원 이상), 최초 카드 사용 등록일로부터 다음달 말일까지는 KB국민 쿠쿠렌탈 티타늄 카드 실적이 없는 경우에도 1구간(전월 이용실적 50만원 이상)에 해당하는 10, 000원 청구할인 서비스가 적용됩니다., 할인금액보다 자동이체 승인금액이 작을 경우 승인금액만큼 할인 적용됩니다., 쿠쿠렌탈 자동이체 승인 건이 여러 건인 경우 합산하여 월 할인금액 내에서 할인 됩니다., '할인(적립) 서비스 제공 관련 카드별 실적 유예기간은 본인회원이 해당카드를 생애 최초 발급받은 경우에 적용되며, 가족카드 단독 발급 시 적용되지 않습니다.']
        target:
          merchants: [cuckoo_rental]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {0: 10000, 500000: 10000, 1000000: 15000}
        tiers:
          from: 500000
          waived_when:
            fact: first_personal_issue
            card_month: {min: 0, max: 1}
        notes: 자동이체 승인금액 전액을 월 할인금액까지 할인한다. 0 구간 값은 생애 최초 발급의 실적 유예기간에만 쓴다
    unmodeled: [공항·호텔 발레파킹과 공항 라운지 같은 티타늄 서비스는 계산하지 않는다, 월 할인한도는 본인회원 기준이라 가족카드 이용분과 함께 쓴다, 해외 이용금액은 매입 완료일 기준으로 실적 달을 나누고 일시불만 센다, 정부지원금(보육료·유치원보조비·바우처)과 무승인전표(자판기·터널통행료·항공기내 이용)는 실적에서 빠진다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 원문은 2019.08.01 출시만 적었다. 현재 규칙 시작일을 몰라 수집일을 잠정 적용 시작일로 둔다., assumed: '2026-10-12'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문의 후불교통요금 실적 제외를 시내버스와 지하철 업종 제외로 옮겼다. 승인된 버스·지하철 결제도 실적에서 빠져 실적이 적게 잡힐 수 있다. 철도와 고속·시외버스는 실적에 남긴다, assumed: 'transit.bus_city, transit.subway'}
notes: 2026-10-12 KB국민카드 상품 페이지로 대조했다. 쿠쿠렌탈Ⅱ카드(kb-04325)와 연회비, 실적 구간, 할인금액이 다른 상품이다.
