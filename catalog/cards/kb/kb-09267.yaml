        source: page
        evidence: ['Green market | 올가홀푸드, 바이올가, 초록마을 (건당 1만원 이상) 5% | 5천점 | 7천점 | 1만점', 온/오프라인 매장 서비스 제공, '백화점, 마트 등 일부 쇼핑몰 내 입점 매장의 경우 서비스 제외']
        target:
          merchants: [chorokmaeul]
        when:
          - amount: {min: 10000}
        reward: {type: points, program: kb_pointree, rate: 5}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 7000, 1500000: 10000}
        tiers: {from: 500000}
        unmodeled: [올가홀푸드와 바이올가는 공통 가맹점에 없어 계산하지 않는다]
      - key: eco-packaging-5
        title: SSG.COM·쿠팡 5% 포인트리 적립
        source: page
        evidence: ['Eco packaging | SSG.COM, 쿠팡 (건당 1만원 이상) 5% | 5천점 | 7천점 | 1만점', '상품권, 여행, 항공권, 티켓, 도서, 별도 팝업사이트 제외']
        target:
          merchants: [coupang, ssg_com]
        when:
          - amount: {min: 10000}
        reward: {type: points, program: kb_pointree, rate: 5}
        limits:
          - per: month
            amount: {500000: 5000, 1000000: 7000, 1500000: 10000}
        tiers: {from: 500000}
        unmodeled: [SSG.COM·쿠팡의 여행·항공권·티켓·도서 결제와 별도 팝업사이트 결제는 적립에서 빠진다]
    unmodeled: [모바일단독카드 이용 시 월 1회 1천점 적립(Plastic free)은 발급 형태를 알 수 없어 계산하지 않는다, 기부생활은 고른 기부율(0·1·3·5·10%)만큼 적립 포인트리를 기부포인트리로 나누고 카드사가 같은 만큼 더 준다. 기부포인트리는 기부에만 쓰여 기부율 0%로 계산한다, 최초 사용등록일부터 다음 달 말일까지 실적 없이 50만원 구간 친환경생활 혜택을 주는 신규 특례는 계산하지 않는다, 공항 라운지·발레파킹 같은 티타늄 서비스는 계산하지 않는다, 무승인전표(자판기·터널통행료·항공기내 이용)와 정부지원금은 실적에서 빠진다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현재 혜택이 시작된 날짜를 찾지 못해 출시일 2020.11.30으로 두었다., assumed: '2020-11-30'}
  - {path: 'revisions[0].spend.exclude_categories', question: 원문은 교통요금을 실적에서 뺀다고만 적었다. 덜 주는 쪽으로 철도와 고속·시외버스를 포함한 대중교통 전체를 실적에서 뺐다, assumed: transit}
notes: 2026-10-12 KB국민카드 상품 페이지를 직접 받아 대조했다. 연회비는 기본 7천원과 제휴 2만3천원이고 모바일 단독카드는 2만4천원이다. 포인트리 1점은 1원이다. 할인(적립) 서비스 제외매출은 무이자할부와 상품권·선불카드 구입·충전이다.
