notes: >-
  기본 캐시백은 상품 페이지(심의필 26-0018), 전월 30만원 이상 혜택은 카카오뱅크 앱 혜택 페이지
  https://kakaobankcontent.com/event/card_benefit 의 2026 캐시백 프로모션(2026.02.01~2027.01.31, 심의필 26-0007)에서 옮김.
  프로모션 종료 뒤에는 다시 확인 필요. 연회비 없음. 재발급 수수료 2천원. 매입·정산은 KB국민카드가 맡고 업종은 KB국민카드 기준.
  실적은 전월 1일~말일 실제 승인금액 기준이며 프렌즈 체크카드를 여러 장 가지면 고객별로 합산.
  실적 제외 중 업종 코드가 없는 것: 대학(대학원) 등록금, 수수료·이자, 선물하기(상품권 업종), 정부지원금, 사회보험료, 연체료, 결제취소금액,
  교통카드/RF유통기관 이용금액. 이 교통 항목에 후불교통 이용분이 들어가는지는 공식 문구 미확인이라 public_transit은 제외 목록에 넣지 않음.
  취소는 취소매출전표 접수월 실적에서 뺌. 체크카드라 할부 없음.
  최초 사용등록일 또는 첫 승인·매입일 중 빠른 날부터 다음 달 말일까지 프로모션 혜택을 실적 무관 제공.
  프로모션 혜택은 항목마다 고객별 월 1회. 금액은 1회 승인금액 기준이고 여러 승인을 합치지 않음. 간편결제로 결제하면 혜택이 빠질 수 있음.
  캐시백은 다음 달 10일 결제계좌로 입금. 기본 캐시백 제외 항목은 실적 제외 항목과 같음.
