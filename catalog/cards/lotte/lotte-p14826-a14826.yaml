        evidence: ['30만원 이상 10,000원 7,000원 / 70만원 이상 15,000원 7,000원 / 150만원 이상 20,000원 7,000원', 결제일 할인은 발급월 포함하여 기간내 혜택 제공, 'SKT, KT, LG U+, 알뜰폰 이동통신 요금 자동납부 건만 할인 혜택이 제공됩니다.(1회성 즉시 결제건은 할인 불가)', 이동통신 요금이 할인금액보다 적을 경우 이동통신 요금 만큼 할인됩니다.]
        target:
          merchants: [hello_mobile, kt, kt_m_mobile, lg_uplus, liiv_m, media_log, sk_telink, skt, toss_mobile, woori_won_mobile]
        when:
          - billing: [autopay]
          - card_month: {max: 23}
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {300000: 10000, 700000: 15000, 1500000: 20000}
        tiers: {from: 300000}
      - key: mobile-after-24m
        title: 이동통신 요금 자동납부 결제일 할인 25개월 이후
        source: manual
        evidence: [25개월 이후 7, 000원, '서비스 적용 예시 : 24년 01월 발급 후 해당 월 대상카드로 이동통신 요금 자동 납부 시 첫 서비스 적용월 포함 24개월간 10,000원/15,000원/20,000원 월 할인 한도가 적용되며, 이후 7,000원 할인 한도 적용']
        target:
          merchants: [hello_mobile, kt, kt_m_mobile, lg_uplus, liiv_m, media_log, sk_telink, skt, toss_mobile, woori_won_mobile]
        when:
          - billing: [autopay]
          - card_month: {min: 24}
        reward: {type: billing_discount, rate: 100}
        limits:
          - {per: month, amount: 7000}
        tiers: {from: 300000}
    unmodeled: [인터넷·케이블TV 같은 결합상품 요금은 할인하지 않는다, 공통 가맹점에 없는 알뜰폰 통신사 요금은 계산하지 않는다, 24개월은 첫 서비스 적용월부터 세고 실적 미달이나 자동납부 해지로 할인이 없던 달도 회차를 쓴다. 카드 시작 달부터 세어 덜 주는 쪽으로 계산한다, 'Mobile X LOCA SE가 아닌 롯데카드 이용금액, 오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 정부지원금, 무승인전표(자판기, 터널통행료, 항공 기내 이용), 관세·벌금·과태료·민원 발급 수수료·인지세·송달료, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', 롯데카드의 다른 결제일 할인과 겹치면 할인이 큰 혜택 하나만 준다, 이동통신 자동납부 건은 롯데카드 접수일 기준으로 실적과 할인에 들어간다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2023-12-08이고 설명서는 2026년 9월 심의본이다, assumed: '2026-10-12'}
notes: 2026-10-12 상품 페이지와 상품설명서 대조. 연회비 국내전용·해외겸용 20,000원. 이동통신 요금이 할인액보다 적으면 그 금액만큼이라 100% 할인에 월 한도로 적었다. 신규 발급 특례는 사용등록일부터 다음 달 말일까지 30만 구간이다. 할인 받은 이용금액 전체를 실적에서 뺀다. 대중교통(시내·광역·시외버스, 지하철), 택시, 고속버스, 고속도로 통행요금은 실적에서 빠진다.
