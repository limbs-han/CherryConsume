notes: 2026-10-11 상품 페이지 대조. 네이버페이 금융상품 페이지에서만 신청한다. 출시일 2021-06-20. 장기할부 미이용 회원 1% 적립만 계산한다. 장기할부 이용 회원은 선택지로 두고 계산하지 않는다. 적립한도 없음. 공시 색인 1716은 이 상품의 옛 설명서다.
