notes: >-
  LOCA LIKIT 1.2 신규 발급 중단으로 대신 넣은 카드. 국내외 전가맹점 결제일 할인, 할인한도 없음.
  지난달 1일~말일 150만원 미만 0.5%, 150만원 이상 1.0%. 기본할인과 특별할인은 중복 없음(두 혜택 중 하나만 적용).
  최초 발급 시 발급일~다음 달 말일은 실적 무관 1.0%.
  실적 제외 중 업종 코드에 없는 것: 건강보험·국민연금·고용보험·산재보험, LOCA 시리즈가 아닌 롯데카드 이용금액, 초·중·고 납입금, LH·SH 공공임대료, 부동산 임대료, 장애인 고용부담금, 대학등록금, 오토·스마트 캐시백 신청 금액, 포인트 충전, 현금서비스·카드론, 이자·수수료.
  할인 제외: 무이자할부, 국세·지방세, 도시가스비·공과금, 4대보험, 초·중·고 납입금, 공공임대료, 부동산 임대료, 장애인 고용부담금, 아파트관리비, 대학등록금, 캐시백 신청 금액, 기프트·선불카드, 포인트 충전, 상품권, 현금서비스·카드론, 연회비, 이자·수수료.
  해외 이용과 대중교통 같은 무승인 결제는 롯데카드 접수일 기준 실적 반영. 할부는 이용일 기준 전체 금액에 할인. 해외 이용 수수료 별도.
  롯데카드 L.POINT 적립 없음. 가족카드 연회비 없음, 실적 합산.
