    unmodeled: ['실적은 롯데백화점 이용금액, 연회비, 수수료를 뺀다. 롯데백화점만 뺄 칸이 없어 백화점 업종 전체를 실적에서 뺐다', 최초 발급 회원은 카드 사용 등록 달 포함 2개월 동안 실적과 상관없이 할인한도 1만원을 받는다. 계산하지 않는다, 롯데백화점 5% 현장할인 e-쿠폰은 직전 6개월 롯데백화점 누적 30만원 이상 회원에게 매월 2매 발행된다. 쿠폰 사용이라 계산하지 않는다, 롯데백화점 12개월 할부 수수료를 지난달 30만원 이상이면 그달 면제한다. 계산하지 않는다, 롯데카드의 다른 청구할인 행사와 겹치면 할인 금액이 큰 서비스 하나만 준다, 실적과 할인한도는 가족카드와 합산한다, 할인은 승인 순서대로 남은 한도 안에서 준다, 이 카드로 결제하면 롯데카드가 주는 L.POINT 적립은 없다]
notes: 2026-10-11 상품 페이지와 상품설명서(2026년 8월 기준) 대조. 출시일 2016-11-30. 상품설명서 실적 예시에서 무이자와 유이자 할부를 모두 실적 대상으로 적어 무이자할부를 실적에 넣었다. 할인 제외 목록은 원문에 없다.
