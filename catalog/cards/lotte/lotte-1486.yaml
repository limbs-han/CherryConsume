schema_version: 2
id: lotte-1486
issuer: lotte
name: 롯데백화점-K 롯데카드
kind: credit
product_codes: []
status: on_sale
annual_fees:
  - {scope: domestic, amount: 10000}
  - {scope: domestic, brand: unionpay, amount: 10000}
  - {scope: global, brand: mastercard, amount: 15000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://image.lottecard.co.kr/UploadFiles/cardProvisionPath/2017-A00020_20260801_10009.pdf', fetched_at: '2026-10-12'}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2017-05-20'
    source: manual
    tiers: [0, 300000, 500000, 1000000, 2000000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, department_store]
      interest_free: count
      installment: full_at_purchase
      cancellation: original_month
    benefits:
      - key: deptstore-billing-15
        title: 롯데백화점 15% 청구할인
        source: manual
        evidence: [롯데백화점 이용시 지난달 실적에 따른 할인한도 내에서 15% 청구할인, '30만원 이상 2만원, 50만원 이상 3만원, 100만원 이상 5만원, 200만원 이상 10만원', 롯데백화점 오프라인 매장 이용 시 청구할인 서비스가 제공됩니다., '엘롯데, 롯데아울렛, 롯데역사, 롯데몰은 서비스 대상가맹점에 포함되지 않습니다.', '실적 산정 시 롯데백화점에서 이용하신 모든 금액, 연회비, 수수료 납부금액은 제외됩니다.']
        target:
          merchants: [lotte_department]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 15}
        limits:
          - per: month
            amount: {300000: 20000, 500000: 30000, 1000000: 50000, 2000000: 100000}
        tiers: {from: 300000}
    unmodeled: [실적에서 롯데백화점 이용금액만 빠지지만 업종을 가려낼 칸이 없어 백화점 업종 전체를 실적에서 뺐다. 다른 백화점 이용금액이 있으면 실적이 실제보다 적게 잡힌다, 최초 발급 회원은 사용 등록 달을 포함해 2개월간 실적과 관계없이 할인한도 1만원을 받는다. 가장 낮은 구간 한도보다 작아 구간으로 담지 못해 계산하지 않는다, 롯데백화점 5% 현장할인 e-쿠폰은 직전 6개월 롯데백화점 누적 이용 30만원 이상 회원에게 매월 2매 발행이라 계산하지 않는다. 15% 청구할인은 e-쿠폰 할인 뒤 금액에 적용한다, 롯데백화점 12개월 할부 수수료 5%는 지난달 실적 30만원 이상이면 그달 회차 수수료를 면제한다. 할부 수수료라 계산하지 않는다, 롯데백화점 안 임대매장은 청구할인에서 빠질 수 있다, 같은 가맹점의 롯데카드 청구할인 행사와 겹치면 할인이 큰 것 하나만 준다, 실적과 할인한도는 본인과 가족카드를 합산하고 청구할인은 승인 순서대로 적용한다, 현금서비스와 카드론은 실적에서 빠진다]
open_questions:
  - {path: product_codes, question: 롯데카드 판매 카드 목록에서 상품 코드를 찾지 못해 id를 공시 색인 번호로 두었다, assumed: '[]'}
  - {path: 'revisions[0].spend.cancellation', question: 설명서에 취소 매출의 실적 반영 기준이 없어 롯데 기본값인 원래 승인 달 기준을 썼다, assumed: original_month}
notes: 2026-10-12 상품설명서(2026년 8월 기준, 여신금융협회 심의필 제2026-C1a-13456호) 대조. 실적 예시 표에서 무이자와 유이자 할부가 모두 실적 대상이라 interest_free를 count로 두었다. L.POINT 적립 없음.
