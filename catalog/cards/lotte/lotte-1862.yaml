notes: 2026-10-11 상품설명서 대조. 출시일 2023-10-11. 상품 코드를 공개 목록에서 찾지 못해 공시 색인 id를 그대로 둔다. 기본 1% 캐시백은 실적 조건과 한도가 없다.
