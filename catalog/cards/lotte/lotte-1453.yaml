    benefits:
      - key: lotte-outlet-7
        title: 롯데아울렛 오프라인 매장 7% 청구할인
        source: manual
        evidence: [롯데아울렛 7% 할인, 롯데아울렛 오프라인매장 이용시 청구 할인, 지난달(1일~말일) 롯데아울렛 롯데카드 이용금액의 5% 할인 한도 생성됩니다.]
        target:
          merchants: [lotte_outlet, lotte_premium_outlet]
        when:
          - {channel: offline}
        reward: {type: billing_discount, rate: 7}
        limits:
          - {shared: integrated}
        tiers: {from: 300000}
      - key: transit-taxi-5
        title: 시내버스·지하철·택시 5% 청구할인
        source: manual
        evidence: ['대중교통 | 시내버스, 지하철, 택시요금 5% 할인']
        target:
          categories: [taxi, transit.bus_city, transit.subway]
        reward: {type: billing_discount, rate: 5}
        limits:
          - {shared: integrated}
        tiers: {from: 300000}
    unmodeled: [통합 할인 한도는 지난달 이용금액의 5%(1만5천원~20만원)다. 앱은 10만원 단위로 내려 잡은 구간의 5%로 계산해 실제 한도보다 조금 적을 수 있다. 400만원을 넘는 이용금액은 실적에 넣지 않는다, '롯데몰(은평, 수원, 김포공항), 롯데월드몰, 롯데피트인(동대문점) 7% 청구할인은 공통 가맹점이 없어 계산하지 않는다', '롯데홈쇼핑과 롯데마트 5% 청구할인(월 2회, 건당 5천원 한도)은 5천원이 할인 금액인지 이용 금액인지 원문으로 가를 수 없어 계산하지 않는다', 롯데몰·롯데월드몰·롯데피트인에 입점한 임대매장은 할인에서 빠질 수 있다, 같은 가맹점의 롯데카드 청구할인 행사와 겹치면 할인 금액이 큰 쪽 하나만 준다, 청구 할인은 승인 순서대로 적용하고 본인과 가족카드 실적과 한도를 합산한다]
open_questions:
  - {path: product_codes, question: 롯데카드 판매 카드 목록에서 상품 코드를 찾지 못해 id를 공시 색인 번호로 두었다, assumed: '[]'}
  - {path: 'revisions[0].benefits[lotte-outlet-7].target', question: 공통 가맹점 lotte_outlet(롯데아울렛)이 필요하다. needed/lotte-1453.json에 제안했다}
  - {path: annual_fees, question: '설명서는 해외 카드를 해외전용 15,000원이라고만 적어 국제 브랜드를 확인하지 못했다', assumed: 브랜드 없이 15000}
notes: 2026-10-12 상품설명서(파일 날짜 2026-09-08) 대조. 1쪽은 글자로, 2쪽은 그림으로 읽었다. 연회비 국내전용 10,000원, 해외 15,000원. 할인은 모두 통합 할인 한도 안에서 준다. 통합 한도는 지난달 이용금액의 5%라 10만원 단위 구간으로 나눠 구간 하한의 5%를 한도로 두었다. 할인 받은 결제는 실적에서 빠진다. 실적 제외 목록에 대중교통과 무이자할부가 없어 실적에 넣었다. 신규 발급 특례는 사용등록월의 다음 달 말까지 1만5천원이라 30만 구간으로 넣었다. 시행일은 파일 날짜로 추정했다.
