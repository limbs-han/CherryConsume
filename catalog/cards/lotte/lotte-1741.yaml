schema_version: 2
id: lotte-1741
issuer: lotte
name: LOCA X 세라젬
kind: credit
product_codes: []
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
  - {scope: global, brand: mastercard, amount: 20000}
  - {scope: global, brand: amex, amount: 20000}
sources:
  - {id: manual, kind: manual_pdf, url: 'https://image.lottecard.co.kr/UploadFiles/cardProvisionPath/2021-A00054_20250704_10002.pdf', fetched_at: '2026-10-12'}
checked_at: '2026-10-12'
revisions:
  - effective_from: '2021-10-05'
    effective_from_estimated: true
    source: manual
    tiers: [0, 300000, 700000, 1500000]
    spend:
      basis: prev_calendar_month
      exclude_categories: [annual_fee, apartment_fee, education.primary_secondary_fee, education.tuition, gift_card, insurance.social, prepaid_charge, rent, tax, utility]
      interest_free: exclude
      installment: full_at_purchase
      cancellation: original_month
      exclude_applied: 1
    new_card: {until: next_month_end, tier: 300000, from: issue}
    benefit_exclusions:
      when_any:
        - {interest_free: true}
      categories: [gift_card, prepaid_charge]
      unmodeled: [포인트 충전은 할인에서 빠진다]
    benefits:
      - key: ceragem-subscription
        title: 세라젬 구독료 자동납부 결제일 할인
        source: manual
        evidence: ['30만원 이상 10,000원 자동납부 필수', '70만원 이상 15,000원', '150만원 이상 25,000원', LOCA X 세라젬으로 세라젬 구독료 자동납부 연결 시에만 결제일 할인이 적용됩니다., 구독료가 구독료 할인 금액보다 적을 경우 구독료 만큼만 할인이 됩니다.]
        target:
          merchants: [ceragem_rental]
        when:
          - billing: [autopay]
        reward: {type: billing_discount, rate: 100}
        limits:
          - per: month
            amount: {300000: 10000, 700000: 15000, 1500000: 25000}
        tiers: {from: 300000}
    unmodeled: [세라젬 이용금액 전체가 실적에서 빠지지만 할인받은 구독료만 뺀다. 세라젬 장기 할부를 기록하면 실적이 실제보다 크게 잡힐 수 있다, '장기할부 캐시백 10,000·15,000·25,000원은 세라젬 10만원 이상 24·36개월 장기할부 다음 달부터 36개월차까지 매월 26일 지급이라 계산하지 않는다. 구독료 할인과 함께 받지 못한다', 롯데카드의 다른 결제일 할인과 겹치면 할인이 큰 혜택 하나만 준다, '오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 자동차 환경개선 부담금, 포인트 충전, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', LOCA X 세라젬이 아닌 다른 롯데카드 이용금액은 실적에 넣지 않는다, 해외 이용과 후불교통 같은 무승인 결제는 롯데카드 접수일 기준으로 실적에 들어가 이용한 달과 다를 수 있다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 카드 출시일로 두었다. 설명서는 2025년 6월 기준이다, assumed: '2021-10-05'}
  - {path: product_codes, question: 상품 페이지와 상품 코드를 찾지 못해 색인 번호 id를 그대로 썼다}
notes: 2026-10-12 상품설명서(2025년 6월 기준) 대조. 출시일 2021-10-05. 구독료가 한도보다 적으면 구독료만큼 할인이라 100% 할인에 월 한도로 적었다. 신규 발급 특례는 발급일부터 다음 달 말일까지 10,000원 한도라 30만 구간으로 넣었다. 가족카드는 발급하지 않는다.
