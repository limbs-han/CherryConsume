notes: 2026-10-11 상품 페이지와 상품설명서(2023년 6월 기준) 대조. 출시일 2023-05-23. 지난달 30만원 이상이면 국내 1.2%, 해외 2.0%를 한도 없이 준다. 신규 발급 특례는 카드발급일부터 다음 달 말일까지 실적과 상관없이 혜택이라 30만 구간으로 넣었다.
