notes: 2026-10-11 상품 페이지와 상품설명서(2025년 10월 기준) 대조. 출시일과 상품 코드는 상품 페이지에서 확인했다. 공시 색인 id lotte-1898를 상품 코드 id로 바꿨다. 신규 발급 특례는 발급일부터 다음 달 말일까지 13,000원이라 30만 구간으로 넣었다. 대중교통(시내·광역·시외버스, 지하철), 택시, 고속버스는 실적에서 모두 빠진다. 가족카드는 발급하지 않는다.
