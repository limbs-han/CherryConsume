    unmodeled: [마트 내 임대매장은 할인하지 않는다, PG나 간편결제 가맹점명으로 접수된 온라인쇼핑·홈쇼핑 결제는 할인하지 않는다, LOCA 시리즈 카드가 아닌 롯데카드 이용금액만 실적에서 빠져 다른 LOCA 시리즈 카드 이용금액도 실적에 합산될 수 있다. 이 카드 결제만 센다, 가족카드 이용금액과 할인한도가 본인카드와 합산된다, 해외 이용과 대중교통 같은 무승인 결제는 롯데카드 접수일 기준으로 실적에 들어가 이용한 달과 다를 수 있다, '오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 포인트 충전은 실적에서 빠진다', 롯데카드의 다른 결제일 할인 혜택과 겹치면 할인이 큰 혜택 하나만 준다, 할인은 승인 시점 기준 남은 한도 안에서 준다]
open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2020-07-10이고 설명서는 2026년 3월 기준이다, assumed: '2026-10-11'}
notes: 2026-10-11 상품 페이지와 상품설명서(2026년 3월 기준) 대조. 지난달 150만원 이상일 때만 네 영역 10% 할인, 영역마다 월 한도와 일 5천원 한도. 신규 발급 특례는 발급일부터 다음 달 말일까지 실적과 상관없이 혜택 제공이라 150만 구간으로 넣었다. 초안은 온라인쇼핑과 홈쇼핑, 편의점을 정액 할인으로 잘못 적었다. 롯데슈퍼, 이마트 에브리데이, 홈플러스 익스프레스는 별도 가맹점이라 대상에 넣지 않았다.
