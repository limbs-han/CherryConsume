notes: 2026-10-10 상품 페이지와 상품설명서(2026년 6월 기준) 대조. 출시일 2026-06-19부터 같은 조건이다. 신규 발급 특례는 발급일부터 다음 달 말일까지 8,000원 한도라 40만 구간으로 넣었다. 렌탈료가 한도보다 적으면 렌탈료만큼 할인이라 100% 할인에 월 한도로 적었다. 쿠쿠 X LOCA(lotte-1858)와 다른 상품이다.
