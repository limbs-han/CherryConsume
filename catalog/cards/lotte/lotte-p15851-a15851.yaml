open_questions:
  - {path: 'revisions[0].effective_from', question: 출시일을 원문에서 찾지 못해 상품설명서 파일 날짜로 두었다, assumed: '2026-04-07'}
notes: 2026-10-11 상품설명서(2026년 4월 기준)를 봤다. 신용카드. 구독료가 한도보다 적으면 구독료만큼 할인이라 100% 할인에 월 한도로 적었다. 신규 발급 특례는 발급일부터 다음 달 말일까지 15,000원 한도라 50만 구간으로 넣었다.
