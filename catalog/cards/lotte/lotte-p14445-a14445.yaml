    unmodeled: ['2023-10-01 이후 발급 회원은 KT 유무선 통신료가 실적에서 빠진다. 가맹점 단위 실적 제외가 없어 통신요금 업종 전체를 실적에서 뺐다. SKT, LG유플러스 요금도 실적에 넣지 않아 실제보다 적게 잡힌다', 2023-10-01 이전 발급 회원은 KT 통신료가 실적에 들어가지만 계산하지 않는다, '오토·스마트 캐시백 신청 이용금액, 장애인 고용부담금, 고속도로 통행요금, 무승인전표, 벌금·과태료·민원 발급 수수료·관세·인지세·송달료, 포인트 충전, 현금서비스·카드론·이자·수수료는 실적에서 빠진다', KT DC PLUS 롯데카드가 아닌 다른 롯데카드 이용금액은 실적에 넣지 않는다, 가족카드 이용금액과 할인한도는 본인카드와 합산한다, 롯데카드의 다른 결제일 할인과 겹치면 할인 금액이 큰 혜택 하나만 준다, 할인은 승인 시점 기준 남은 한도 안에서 준다, 이 카드로 결제하면 롯데카드가 주는 L.POINT 적립은 없다]
