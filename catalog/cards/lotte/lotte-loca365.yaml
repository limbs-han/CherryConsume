notes: >-
  지난달 1일~말일 50만원 이상(본인·가족카드 합산) 이용 시 생활업종 결제일 할인, 월 최대 36,500원.
  건당 2만원 이상 결제만 할인(스트리밍은 금액 무관).
  최초 발급 시 발급일~다음 달 말일은 실적 무관 할인.
  실적 제외 중 업종 코드에 없는 것: 건강보험·국민연금·고용보험·산재보험, 초·중·고 납입금, 대학등록금, LH·SH 공공임대료, 부동산 임대료, 장애인 고용부담금, 오토·스마트 캐시백 신청 금액, 포인트 충전, 고속버스, 고속도로 통행료, 무승인전표(자판기·터널통행료·기내), 벌금·과태료, 민원 수수료, 관세·인지세·송달료, 현금서비스·카드론, 이자·수수료, LOCA 365가 아닌 롯데카드 이용금액.
  할인 제외: 모든 무이자할부, 기프트·선불카드 충전·구매, 포인트 충전, 상품권 구매, 스마트 캐시백 신청 금액.
  해외 이용은 현지 매출일자, 이동통신·대중교통처럼 다음 달 청구되는 건은 롯데카드 접수일 기준으로 실적과 할인에 반영.
  할부는 이용일 기준 전체 금액에 할인. 다른 롯데카드 결제일 할인과 겹치면 큰 쪽 하나만.
  결제 건 혜택 아님: 국내 5만원 이상 2~3개월 무이자할부(적용 시 다른 할인 없음). 롯데카드 L.POINT 적립 없음.
