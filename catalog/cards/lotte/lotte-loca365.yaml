schema_version: 2
id: lotte-loca365
issuer: lotte
name: 롯데카드 LOCA 365
kind: credit
status: on_sale
annual_fees:
  - {scope: domestic, amount: 20000}
  - {scope: global, amount: 20000}
sources:
  - {id: page, kind: product_page, url: 'https://www.lottecard.co.kr/app/LPCDADB_V100.lc?vtCdKndC=P14028-A14028', fetched_at: &id001 2026-09-28}
checked_at: *id001
revisions:
  - effective_from: *id001
    effective_from_estimated: true
    source: page
    tiers: [0, 500000]
    spend:
      exclude_categories: [annual_fee, gift_card, tax, taxi]
    limits:
      - key: integrated
        per: month
        amount: {500000: 36500}
    benefits:
      - key: apartment-10
        title: 아파트관리비 10% 할인
        target:
          categories: [apartment_fee]
        when:
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 500000}
        notes: 자동납부 건만
      - key: utility-10
        title: 도시가스·전기료 10% 할인
        target:
          categories: [utility]
        when:
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 500000}
        notes: 도시가스비·전기료 자동납부 건만. 두 요금 합산 월 5천원. 수도 등 다른 공과금은 대상 아님
      - key: telecom-10
        title: 이동통신 10% 할인
        target:
          merchants: [kt, lg_uplus, skt]
        when:
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
          - {per: month, count: 1}
          - {shared: integrated}
        tiers: {from: 500000}
        notes: 이동통신요금 자동납부 건만, 월 1회. 인터넷·TV 결합상품과 알뜰폰 제외
      - key: transit-10
        title: 대중교통 10% 할인
        target:
          categories: [transit]
        when:
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 500000}
        notes: 지하철·시내버스만. 택시·고속버스·시외버스 제외. 후불교통은 한 달 합산 청구 건으로 접수됨. 공식 문구 미확인 - 건당 2만원 조건을 합산 청구액에 적용하는지
      - key: insurance-10
        title: 보험료 10% 할인
        target:
          categories: [insurance]
        when:
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 500000}
        notes: 생명·손해보험 자동납부 건만. 카카오페이·네이버페이·페이코 등 모든 간편결제 제외
      - key: study-10
        title: 학습지 10% 할인
        target:
          categories: [education]
        when:
          - {channel: offline}
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 500000}
        notes: 학습지 업종만(학원 등 다른 교육 업종 아님). 오프라인만, 일부 PG 결제 제외
      - key: delivery-10
        title: 배달앱 10% 할인
        target:
          merchants: [baemin, coupang_eats, yogiyo]
        when:
          - {channel: online}
          - amount: {min: 20000}
        reward: {type: billing_discount, rate: 10}
        limits:
          - {per: month, amount: 5000}
          - {shared: integrated}
        tiers: {from: 500000}
        notes: 공식 앱 결제만. 가맹점 직접 결제 제외
      - key: streaming-1500
        title: 스트리밍 월 1,500원 할인
        target:
          merchants: [disney_plus, genie, melon, netflix, watcha, youtube_premium]
        when:
          - {channel: online}
        reward: {type: billing_discount, fixed: 1500}
        limits:
          - {per: month, amount: 1500}
          - {per: month, count: 1}
          - {shared: integrated}
        tiers: {from: 500000}
        notes: 공식 홈페이지·앱에서 직접 신청한 정기결제만, 월 1회. 1회성 구매, 통신요금 합산 청구, 앱마켓 결제 제외. 건당 금액 조건 없음
notes: '지난달 1일~말일 50만원 이상(본인·가족카드 합산) 이용 시 생활업종 결제일 할인, 월 최대 36,500원. 건당 2만원 이상 결제만 할인(스트리밍은 금액 무관). 최초 발급 시 발급일~다음 달 말일은 실적 무관 할인. 실적 제외 중 업종 코드에 없는 것: 건강보험·국민연금·고용보험·산재보험, 초·중·고 납입금, 대학등록금, LH·SH 공공임대료, 부동산 임대료, 장애인 고용부담금, 오토·스마트 캐시백 신청 금액, 포인트 충전, 고속버스, 고속도로 통행료, 무승인전표(자판기·터널통행료·기내), 벌금·과태료, 민원 수수료, 관세·인지세·송달료, 현금서비스·카드론, 이자·수수료, LOCA 365가 아닌 롯데카드 이용금액. 할인 제외: 모든 무이자할부, 기프트·선불카드 충전·구매, 포인트 충전, 상품권 구매, 스마트 캐시백 신청 금액. 해외 이용은 현지 매출일자, 이동통신·대중교통처럼 다음 달 청구되는 건은 롯데카드 접수일 기준으로 실적과 할인에 반영. 할부는 이용일 기준 전체 금액에 할인. 다른 롯데카드 결제일 할인과 겹치면 큰 쪽 하나만. 결제 건 혜택 아님: 국내 5만원 이상 2~3개월 무이자할부(적용 시 다른 할인 없음). 롯데카드 L.POINT 적립 없음.'
