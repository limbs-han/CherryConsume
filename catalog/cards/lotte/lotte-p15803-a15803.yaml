open_questions:
  - {path: 'revisions[0].effective_from', question: 현행 조건의 시행일을 찾지 못해 원문 확인일로 두었다. 카드 출시일은 2025-10-24이다, assumed: '2026-10-10'}
notes: 2026-10-10 상품 페이지와 상품설명서 대조. 신규 발급 특례는 발급일부터 다음 달 말일까지 10,000원 한도라 30만 구간으로 넣었다. 렌탈료가 한도보다 적으면 렌탈료만큼 할인이라 100% 할인에 월 한도로 적었다.
