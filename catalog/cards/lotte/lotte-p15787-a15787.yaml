notes: 2026-10-12 상품 페이지 대조. 출시일 2025-10-02. 상품설명서 PDF는 그림이라 글자를 뽑지 못해 페이지로 대조했다. 기본 혜택만 담았다. 지난달 50만원 이상이면 국내외 1.2%(월 1만원), 마트·슈퍼 3%(월 5천원), 커피·편의점 5%(월 5천원)이고 한도를 넘거나 50만원 미만이면 0.5%. 혜택끼리는 큰 쪽 하나만 받아 묶음 기본값 best와 none을 쓴다. 신규 발급 특례는 발급일부터 다음 달 말일까지 기본 혜택이라 50만 구간으로 넣었다.
