notes: 2026-10-11 상품 페이지와 상품설명서(2023년 8월 기준) 대조. 상품 페이지에 2026-03-31부터 신규·갱신 발급 중단이라 적혀 있다. 출시일 2023-03-12. 공시 색인 id lotte-1848을 상품 코드 id로 바꿨다. 네이버페이 쇼핑엔로카(lotte-p13810-a13810)와 같은 계열이지만 장기할부 대신 플랜할인을 주는 다른 상품이다. 플랜할인 미이용 회원의 1% 적립만 계산하고 플랜할인 이용은 선택지로 두고 계산하지 않는다. 적립한도 없음. 가족카드는 발급하지 않는다.
